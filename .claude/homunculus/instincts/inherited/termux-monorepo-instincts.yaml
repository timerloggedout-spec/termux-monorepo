# Termux Monorepo Workflow Add New Gate To Ci Pipeline

## Action

Follow the add-new-gate-to-ci-pipeline workflow:
1. Implement the gate logic as a script (e.g., Python, Bash).
2. Add a new workflow YAML file to .github/workflows to run the gate in CI.
3. Document the gate in a dedicated markdown file in docs/.
4. Update architectural documentation to reflect the new gate's position in the pipeline.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: scripts/ci/{gate_name}.py, .github/workflows/{gate_name}.yml, docs/{GATE_NAME}.md

