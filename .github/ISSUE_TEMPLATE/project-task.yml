# SWARM-DISPATCH-BEGIN
# schema: issue-dispatch/v1
# lane: swarm-dispatch
# que_tier: 3
# payload_class: project-task
# route: project-task-dispatch.yml
# after:
# chain:
# SWARM-DISPATCH-END
name: Project Task
description: Submit a project task to the system; filing IS the trigger — the system selects the provider(s) across all wired endpoints.
title: "[task] "
labels: ["project-task"]
body:
  - type: dropdown
    id: entry
    attributes:
      label: Entry
      description: The entry/program this task belongs to.
      options:
        - D0
        - D1
        - D2
        - D3
        - D4
        - D5
        - AMD
        - Repo-Story
        - Certifications
        - Other
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task / spec
      description: What to build/do — the spec, exact scope and constraints.
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Scope
      description: Paths/repos the task may touch (e.g. apps/studysprint/**).
    validations:
      required: true
  - type: textarea
    id: done-evidence
    attributes:
      label: Done-evidence
      description: What proves completion (PR, tests, artifacts, receipts).
    validations:
      required: true
  - type: input
    id: target-repo
    attributes:
      label: Target repo
      description: Repository the task executes against.
      value: timerloggedout-spec/termux-monorepo
    validations:
      required: false
  - type: textarea
    id: instance-stamps
    attributes:
      label: Instance stamps (post-hoc)
      description: Leave empty at filing — filled by the system/desk AFTER execution with the resolved provider x model, session/run ids, and outcomes.
    validations:
      required: false
