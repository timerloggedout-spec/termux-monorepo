name: Gemini Quota Gate
description: Offline fail-closed Gemini admission gate. Production admission remains disabled.
inputs:
  model:
    description: Router-selected Gemini model
    required: true
  credential-alias:
    description: Credential label (primary or backup); no credential is read
    required: false
    default: primary
  cap-policy-path:
    description: Private cap policy file path (never its contents)
    required: false
    default: ''
  project-evidence-path:
    description: Private project evidence file path (never its contents)
    required: false
    default: ''
  ledger-directory:
    description: Private quota ledger directory
    required: false
    default: ${{ runner.temp }}/gemini-shared-cap
outputs:
  skip:
    description: Whether provider invocation must be skipped
    value: ${{ steps.gate.outputs.skip }}
  reason:
    description: Fixed fail-closed reason code
    value: ${{ steps.gate.outputs.reason }}
  use_backup_key:
    description: Always false; backup rotation is disabled
    value: ${{ steps.gate.outputs.use_backup_key }}
runs:
  using: composite
  steps:
    - name: Evaluate offline Gemini quota gate
      id: gate
      shell: bash
      env:
        GEMINI_SELECTED_MODEL: ${{ inputs.model }}
        GEMINI_CREDENTIAL_ALIAS: ${{ inputs.credential-alias }}
        GEMINI_CAP_POLICY_PATH: ${{ inputs.cap-policy-path }}
        GEMINI_PROJECT_EVIDENCE_PATH: ${{ inputs.project-evidence-path }}
        GEMINI_CAP_LEDGER_DIR: ${{ inputs.ledger-directory }}
      run: python3 -m scripts.gemini_quota_gate
