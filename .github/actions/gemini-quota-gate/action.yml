        LIMIT="$DAILY_LIMIT"
        REMAINING=$(( LIMIT - CURRENT ))

        echo "Gemini quota (primary key): $CURRENT / $LIMIT used today (RPD safety margin), $REMAINING remaining"
        echo "Note: RPM (~15/min Flash free) is enforced by the API; this gate tracks daily RPD only."

        if [ "$CURRENT" -ge "$LIMIT" ]; then
          if [ "$HAS_BACKUP_KEY" = "true" ]; then
            BACKUP_CURRENT=$(cat "$BACKUP_FILE" 2>/dev/null || echo "0")
            BACKUP_REMAINING=$(( LIMIT - BACKUP_CURRENT ))
            echo "Gemini quota (backup key): $BACKUP_CURRENT / $LIMIT, $BACKUP_REMAINING remaining"

            if [ "$BACKUP_CURRENT" -lt "$LIMIT" ]; then
              echo "Primary key exhausted — rotating to backup key"
              NEW=$(( BACKUP_CURRENT + 1 ))
              echo "$NEW" > "$BACKUP_FILE"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "remaining=$(( LIMIT - NEW ))" >> "$GITHUB_OUTPUT"
              echo "use_backup_key=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "remaining=0" >> "$GITHUB_OUTPUT"
          echo "use_backup_key=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Gemini free-tier daily RPD safety margin exhausted ($CURRENT/$LIMIT). Skipping to avoid TerminalQuotaError. RPD resets at midnight Pacific."
        else
          NEW=$(( CURRENT + 1 ))
          echo "$NEW" > "$COUNTER_FILE"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "remaining=$(( LIMIT - NEW ))" >> "$GITHUB_OUTPUT"
          echo "use_backup_key=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Save quota counter
      if: always() && steps.check.outputs.skip != 'true'
      uses: actions/cache/save@v4
      with:
        path: /tmp/gemini-quota
        key: gemini-quota-${{ steps.date.outputs.key }}
        enableCrossOsArchive: true

