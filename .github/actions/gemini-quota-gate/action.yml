name: 'Gemini Quota Gate'
description: |
  Throttle Gemini free-tier API calls so CI does not exhaust quotas.
  Free-tier limits are multi-dimensional (RPM + TPM + RPD), NOT a hard
  20/day cap. Typical Flash free tier is ~15 RPM and ~1000–1500 RPD
  (varies by model; Pro is lower). This gate tracks a per-day counter
  with a safety margin (default 900 RPD) and supports multi-key rotation.
  When exhausted, sets skip=true and posts a graceful comment instead of
  hard-failing with TerminalQuotaError. Pair with continue-on-error on
  the Gemini CLI step for transient RPM 429s within the day.

inputs:
  daily-limit:
    description: 'Max Gemini free-tier requests per day (safety margin on RPD; default 900)'
    required: false
    default: '900'
  pr-number:
    description: 'PR or issue number for the graceful skip comment'
    required: false
    default: ''
  command:
    description: 'The Gemini command (review/triage/invoke) for the skip message'
    required: false
    default: 'review'
  has-backup-key:
    description: 'Set to "true" if GEMINI_API_KEY_BACKUP secret is configured'
    required: false
    default: 'false'

outputs:
  skip:
    description: '"true" if quota exhausted and the job should be skipped'
    value: ${{ steps.check.outputs.skip }}
  remaining:
    description: 'Remaining quota for today'
    value: ${{ steps.check.outputs.remaining }}
  use_backup_key:
    description: '"true" if the backup key should be used instead of primary'
    value: ${{ steps.check.outputs.use_backup_key }}

runs:
  using: composite
  steps:
    - name: Get Pacific date key (RPD resets midnight PT)
      id: date
      run: echo "key=$(TZ=America/Los_Angeles date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Restore quota counter
      id: restore
      uses: actions/cache@v4
      with:
        path: /tmp/gemini-quota
        key: gemini-quota-${{ steps.date.outputs.key }}
        lookup-only: true
        enableCrossOsArchive: true

    - name: Check / update daily Gemini quota
      id: check
      env:
        DAILY_LIMIT: ${{ inputs.daily-limit }}
        PR_NUMBER: ${{ inputs.pr-number }}
        COMMAND: ${{ inputs.command }}
        HAS_BACKUP_KEY: ${{ inputs.has-backup-key }}
      run: |
        set -eu

        COUNTER_DIR="/tmp/gemini-quota"
        COUNTER_FILE="${COUNTER_DIR}/counter.txt"
        BACKUP_FILE="${COUNTER_DIR}/backup_counter.txt"

        mkdir -p "$COUNTER_DIR"

        CURRENT=$(cat "$COUNTER_FILE" 2>/dev/null || echo "0")
