name: 'Gemini Quota Gate'
description: |
  Best-effort throttle for Gemini free-tier calls so CI does not hard-fail on
  TerminalQuotaError. Tracks a per-day counter (Pacific midnight reset) with a
  safety margin (default 900 job invocations). One increment ≈ one workflow
  job, not one model request — pair with session-skip in review and
  continue-on-error on the CLI step for RPM 429s.
  Single-key by default (has-backup-key: false). Cache is branch-scoped and
  best-effort across concurrent PRs.

inputs:
  daily-limit:
    description: 'Max Gemini job invocations per day (safety margin; default 900)'
    required: false
    default: '900'
  pr-number:
    description: 'PR or issue number for the graceful skip comment'
    required: false
    default: ''
  command:
    description: 'The Gemini command (review/triage/invoke) for the skip message'
    required: false
    default: 'review'
  has-backup-key:
    description: 'Set to "true" only if a backup key exists (usually false — single key)'
    required: false
    default: 'false'

outputs:
  skip:
    description: '"true" if quota exhausted and the job should be skipped'
    value: ${{ steps.check.outputs.skip }}
  remaining:
    description: 'Remaining quota for today'
    value: ${{ steps.check.outputs.remaining }}
  use_backup_key:
    description: 'Always "false" under single-key policy'
    value: ${{ steps.check.outputs.use_backup_key }}

runs:
  using: composite
  steps:
    - name: Get Pacific date key (RPD resets midnight PT)
      id: date
      run: echo "key=$(TZ=America/Los_Angeles date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Restore quota counter
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: /tmp/gemini-quota
        key: gemini-quota-${{ steps.date.outputs.key }}
        restore-keys: gemini-quota-${{ steps.date.outputs.key }}
        enableCrossOsArchive: true

    - name: Check / update daily Gemini quota
      id: check
      env:
        DAILY_LIMIT: ${{ inputs.daily-limit }}
        HAS_BACKUP_KEY: ${{ inputs.has-backup-key }}
      run: |
        set -eu
        COUNTER_DIR="/tmp/gemini-quota"
        COUNTER_FILE="${COUNTER_DIR}/counter.txt"
        mkdir -p "$COUNTER_DIR"
        CURRENT=$(cat "$COUNTER_FILE" 2>/dev/null || echo "0")
        if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then CURRENT=0; fi
        LIMIT="$DAILY_LIMIT"
        REMAINING=$(( LIMIT - CURRENT ))
        echo "Gemini quota (single key): $CURRENT / $LIMIT job-invocations today, $REMAINING remaining"
        echo "Note: each job may issue many model requests; this gate is best-effort."
        if [ "$CURRENT" -ge "$LIMIT" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "remaining=0" >> "$GITHUB_OUTPUT"
          echo "use_backup_key=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Gemini daily job-invocation safety margin exhausted ($CURRENT/$LIMIT). Skipping. Resets midnight Pacific."
        else
          NEW=$(( CURRENT + 1 ))
          echo "$NEW" > "$COUNTER_FILE"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "remaining=$(( LIMIT - NEW ))" >> "$GITHUB_OUTPUT"
          echo "use_backup_key=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Save quota counter
      if: steps.check.outcome == 'success' && steps.check.outputs.skip != 'true'
      uses: actions/cache/save@v4
      with:
        path: /tmp/gemini-quota
        key: gemini-quota-${{ steps.date.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
        enableCrossOsArchive: true

    - name: Post graceful skip comment
      if: steps.check.outputs.skip == 'true' && inputs.pr-number != ''
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        script: |
          const prNumber = Number(process.env.PR_NUMBER);
          if (!prNumber) return;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            per_page: 100,
          });
          const marker = '<!-- gemini-quota-skip -->';
          if (comments.some(c => c.body && c.body.includes(marker))) {
            core.info('Quota skip comment already exists');
            return;
          }
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body: [
              marker,
              `⚠️ **Gemini CLI** ${process.env.COMMAND || 'review'} skipped — daily job-invocation safety margin exhausted.`,
              '',
              'Single-key policy. Limits are RPM + TPM + RPD. Resets midnight Pacific.',
              'This is **not a failure** — CI stays green. Other agents continue.',
            ].join('\n'),
          });
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        COMMAND: ${{ inputs.command }}
