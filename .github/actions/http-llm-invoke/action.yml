name: 'HTTP LLM Invoke'
description: |
  OpenAI-compatible chat/completions for OmniRoute or OpenRouter peers.
  Posts result as a PR/issue comment. FREE paths only.
  Base URL: explicit input → catalog defaults. https + host allow-list only.

inputs:
  provider:
    description: 'omni | openrouter'
    required: true
  model:
    description: 'Model id (e.g. auto/best-free or meta-llama/...:free)'
    required: true
  role:
    description: 'triage | review | invoke'
    required: true
  target_number:
    description: 'PR or issue number to comment on'
    required: true
  prompt:
    description: 'User prompt text'
    required: true
  api_key:
    description: 'Provider API key'
    required: true
  base_url:
    description: 'Optional OpenAI-compat base URL (…/v1). Empty → catalog default.'
    required: false
    default: ''
  github_token:
    description: 'Token for gh comment API'
    required: true
  repository:
    description: 'owner/repo'
    required: true

runs:
  using: composite
  steps:
    - name: Call LLM + comment
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        ROLE: ${{ inputs.role }}
        TARGET: ${{ inputs.target_number }}
        PROMPT: ${{ inputs.prompt }}
        API_KEY: ${{ inputs.api_key }}
        BASE_URL: ${{ inputs.base_url }}
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        if [ -z "${API_KEY}" ]; then
          echo "::warning::No API key for provider=$PROVIDER"
          exit 0
        fi
        if ! [[ "${TARGET:-}" =~ ^[0-9]+$ ]]; then
          echo "::warning::Invalid target number; skip comment"
          exit 0
        fi

        # Catalog defaults (ADE — no human paste required)
        DEFAULT_OMNI="https://cloud.omniroute.online/v1"
        DEFAULT_OR="https://openrouter.ai/api/v1"

        case "$PROVIDER" in
          omni) CATALOG="$DEFAULT_OMNI" ;;
          openrouter) CATALOG="$DEFAULT_OR" ;;
          *) echo "::error::Unknown provider $PROVIDER"; exit 1 ;;
        esac

        RAW="${BASE_URL:-$CATALOG}"
        # Strip trailing slash
        RAW="${RAW%/}"

        # SEC: https only + host allow-list (never POST Bearer to arbitrary hosts)
        ALLOW_HOSTS="cloud.omniroute.online openrouter.ai api.openrouter.ai"
        if [[ ! "$RAW" =~ ^https:// ]]; then
          echo "::error::base_url must be https:// (got scheme-less or http)"
          exit 0
        fi
        HOST=$(echo "$RAW" | sed -E 's|^https://([^/]+).*|\1|' | tr '[:upper:]' '[:lower:]')
        OK=0
        for h in $ALLOW_HOSTS; do
          if [ "$HOST" = "$h" ]; then OK=1; break; fi
        done
        if [ "$OK" != 1 ]; then
          echo "::error::base_url host '$HOST' not in allow-list ($ALLOW_HOSTS); using catalog default"
          RAW="$CATALOG"
        fi
        BASE="$RAW"

        case "$PROVIDER" in
          omni)
            TITLE="termux-monorepo-${ROLE}-omni"
            MARKER="<!-- omni-${ROLE} -->"
            EGG="<!-- matrix: valley-hunt via omni free aggregation / 3L0 labels pending -->"
            ;;
          openrouter)
            TITLE="termux-monorepo-${ROLE}-or"
            MARKER="<!-- openrouter-${ROLE} -->"
            EGG="<!-- matrix: peer free path; public boards=features; 3L0=our labels -->"
            ;;
        esac

        # Setup model candidates
        CANDIDATES=("$MODEL")

        # Parse fallback models from docs/schemas/llm-leaderboard-matrix.yaml if present
        if [ -f docs/schemas/llm-leaderboard-matrix.yaml ]; then
          echo "Parsing fallback candidates from llm-leaderboard-matrix.yaml..."
          # Use yq to extract preferred model IDs for the current ROLE
          MAP_MODELS=$(yq -r ".immediate_role_picks.${ROLE}.preferred[].id" docs/schemas/llm-leaderboard-matrix.yaml 2>/dev/null || true)
          for m in $MAP_MODELS; do
            if [ "$m" != "$MODEL" ]; then
              CANDIDATES+=("$m")
            fi
          done
        fi

        # Final safety net of hardcoded verified free models for OpenRouter
        if [ "$PROVIDER" = "openrouter" ]; then
          for m in "google/gemma-4-31b-it:free" "google/gemma-4-26b-a4b-it:free" "cohere/north-mini-code:free" "openai/gpt-oss-20b:free"; do
            # Ensure no duplicates
            if [[ ! " ${CANDIDATES[@]} " =~ " ${m} " ]]; then
              CANDIDATES+=("$m")
            fi
          done
        fi

        SUCCESS=0
        LAST_ERR="no content"
        ACTIVE_MODEL=""
        TEXT=""

        for CANDIDATE in "${CANDIDATES[@]}"; do
          if [ "$PROVIDER" = "openrouter" ] && [[ "$CANDIDATE" != *:free ]]; then
            echo "::warning::Skipping non-:free candidate model $CANDIDATE for OpenRouter"
            continue
          fi

          echo "Attempting LLM call with model: $CANDIDATE"

          PAYLOAD=$(jq -n --arg m "$CANDIDATE" --arg p "$PROMPT" '{model:$m,messages:[{role:"user",content:$p}],max_tokens:1800}')

          RESP=$(curl -sS --connect-timeout 15 --max-time 90 -X POST "${BASE}/chat/completions" \
            -H "Authorization: Bearer therapist" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://github.com/${REPO}" \
            -H "X-Title: ${TITLE}" \
            -d "$PAYLOAD" \
            || echo '{"error":{"message":"curl transport failure"}}')

          # Patch Auth
          RESP=$(echo "$RESP" | sed "s/Bearer therapist/Bearer ${API_KEY}/")

          CANDIDATE_TEXT=$(echo "$RESP" | jq -r '.choices[0].message.content // .choices[0].message.reasoning // empty' 2>/dev/null || true)
          CANDIDATE_ERR=$(echo "$RESP" | jq -r '.error.message // empty' 2>/dev/null || true)

          if [ -n "$CANDIDATE_TEXT" ]; then
            echo "::notice::Model $CANDIDATE succeeded!"
            TEXT="$CANDIDATE_TEXT"
            ACTIVE_MODEL="$CANDIDATE"
            SUCCESS=1
            break
          else
            echo "::warning::Model $CANDIDATE failed: ${CANDIDATE_ERR:-no response content}"
            LAST_ERR="${CANDIDATE_ERR:-no response content}"
          fi
        done

        if [ "$SUCCESS" -ne 1 ]; then
          echo "::error::All candidate models failed."
          TEXT="⚠️ ${PROVIDER} returned no content. All configured models failed. Last error: ${LAST_ERR}"
          ACTIVE_MODEL="$MODEL"
        fi

        case "$PROVIDER" in
          omni)
            HEAD="### 🌐 OmniRoute ${ROLE} (${ACTIVE_MODEL})"
            ;;
          openrouter)
            HEAD="### 🔀 OpenRouter ${ROLE} (${ACTIVE_MODEL})"
            ;;
        esac

        BODY=$(printf '%s\n%s\n%s\n\n%s\n\n%s\n%s\n' \
          "$MARKER" \
          "$HEAD" \
          "$EGG" \
          "$TEXT" \
          '---' \
          "_Peer router: Omni ↔ OpenRouter by desired model; Gemini residual. role=${ROLE}_")

        gh api "repos/${REPO}/issues/${TARGET}/comments" -f body="$BODY" >/dev/null || \
          echo "::warning::Failed to post comment on #${TARGET}"
