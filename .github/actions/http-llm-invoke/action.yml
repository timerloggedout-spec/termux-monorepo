name: 'HTTP LLM Invoke'
description: |
  OpenAI-compatible chat/completions for OmniRoute or OpenRouter peers.
  Posts result as a PR/issue comment. FREE paths only.
  Base URL: explicit input → catalog defaults. https + host allow-list only.
  CAVEMAN: system message from workspace/caveman/caveman-micro.txt (output compress).

inputs:
  provider:
    description: 'omni | openrouter'
    required: true
  model:
    description: 'Model id (e.g. auto/best-free or meta-llama/...:free)'
    required: true
  role:
    description: 'triage | review | invoke'
    required: true
  target_number:
    description: 'PR or issue number to comment on'
    required: true
  prompt:
    description: 'User prompt text (task)'
    required: true
  api_key:
    description: 'Provider API key'
    required: true
  base_url:
    description: 'Optional OpenAI-compat base URL (…/v1). Empty → catalog default.'
    required: false
    default: ''
  github_token:
    description: 'Token for gh comment API'
    required: true
  repository:
    description: 'owner/repo'
    required: true
  caveman:
    description: '"true" prepend CAVEMAN system msg (default true)'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Call LLM + comment
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        ROLE: ${{ inputs.role }}
        TARGET: ${{ inputs.target_number }}
        PROMPT: ${{ inputs.prompt }}
        API_KEY: ${{ inputs.api_key }}
        BASE_URL: ${{ inputs.base_url }}
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ inputs.repository }}
        CAVEMAN: ${{ inputs.caveman }}
      run: |
        set -euo pipefail
        if [ -z "${API_KEY}" ]; then
          echo "::warning::No API key for provider=$PROVIDER"
          exit 0
        fi
        if ! [[ "${TARGET:-}" =~ ^[0-9]+$ ]]; then
          echo "::warning::Invalid target number; skip comment"
          exit 0
        fi

        DEFAULT_OMNI="https://cloud.omniroute.online/v1"
        DEFAULT_OR="https://openrouter.ai/api/v1"

        case "$PROVIDER" in
          omni) CATALOG="$DEFAULT_OMNI" ;;
          openrouter) CATALOG="$DEFAULT_OR" ;;
          *) echo "::error::Unknown provider $PROVIDER"; exit 1 ;;
        esac

        RAW="${BASE_URL:-$CATALOG}"
        RAW="${RAW%/}"

        ALLOW_HOSTS="cloud.omniroute.online openrouter.ai api.openrouter.ai"
        if [[ ! "$RAW" =~ ^https:// ]]; then
          echo "::error::base_url must be https:// (got scheme-less or http)"
          exit 0
        fi
        HOST=$(echo "$RAW" | sed -E 's|^https://([^/]+).*|\1|' | tr '[:upper:]' '[:lower:]')
        OK=0
        for h in $ALLOW_HOSTS; do
          if [ "$HOST" = "$h" ]; then OK=1; break; fi
        done
        if [ "$OK" != 1 ]; then
          echo "::error::base_url host '$HOST' not in allow-list ($ALLOW_HOSTS); using catalog default"
          RAW="$CATALOG"
        fi
        BASE="$RAW"

        case "$PROVIDER" in
          omni)
            TITLE="termux-monorepo-${ROLE}-omni"
            MARKER="<!-- omni-${ROLE} -->"
            HEAD="### 🌐 OmniRoute ${ROLE} (`${MODEL}`)"
            EGG="<!-- matrix: valley-hunt via omni free aggregation / 3L0 labels pending -->"
            ;;
          openrouter)
            if [[ "$MODEL" != *:free ]]; then
              echo "::error::OpenRouter path requires :free model id (got $MODEL)"
              exit 0
            fi
            TITLE="termux-monorepo-${ROLE}-or"
            MARKER="<!-- openrouter-${ROLE} -->"
            HEAD="### 🔀 OpenRouter ${ROLE} (`${MODEL}`)"
            EGG="<!-- matrix: peer free path; public boards=features; 3L0=our labels -->"
            ;;
        esac

        # CAVEMAN system (output compress) — seed kuba-guzik/caveman-micro
        SYS=""
        if [ "${CAVEMAN}" = "true" ]; then
          if [ -f workspace/caveman/caveman-micro.txt ]; then
            SYS=$(cat workspace/caveman/caveman-micro.txt)
          else
            SYS='Respond like smart caveman. Cut all filler, keep technical substance.
- Drop articles (a, an, the), filler (just, really, basically, actually).
- Drop pleasantries (sure, certainly, happy to).
- No hedging. Fragments fine. Short synonyms.
- Technical terms stay exact. Code blocks unchanged.
- Pattern: [thing] [action] [reason]. [next step].'
          fi
        fi

        if [ -n "$SYS" ]; then
          PAYLOAD=$(jq -n --arg m "$MODEL" --arg s "$SYS" --arg p "$PROMPT" \
            '{model:$m,messages:[{role:"system",content:$s},{role:"user",content:$p}],max_tokens:1200}')
        else
          PAYLOAD=$(jq -n --arg m "$MODEL" --arg p "$PROMPT" \
            '{model:$m,messages:[{role:"user",content:$p}],max_tokens:1200}')
        fi

        RESP=$(curl -sS --connect-timeout 15 --max-time 90 -X POST "${BASE}/chat/completions" \
          -H "Authorization: Bearer ${API_KEY}" \
          -H "Content-Type: application/json" \
          -H "HTTP-Referer: https://github.com/${REPO}" \
          -H "X-Title: ${TITLE}" \
          -d "$PAYLOAD" \
          || echo '{"error":{"message":"curl transport failure"}}')

        TEXT=$(echo "$RESP" | jq -r '.choices[0].message.content // .choices[0].message.reasoning // empty' 2>/dev/null || true)
        ERR=$(echo "$RESP" | jq -r '.error.message // empty' 2>/dev/null || true)
        if [ -z "$TEXT" ]; then
          echo "::warning::${PROVIDER} empty response: ${ERR:-no content}"
          TEXT="⚠️ ${PROVIDER} returned no content. ${ERR}"
        fi

        CAV_TAG=""
        [ "${CAVEMAN}" = "true" ] && CAV_TAG=" · CAVEMAN"

        BODY=$(printf '%s\n%s\n%s\n\n%s\n\n%s\n%s\n' \
          "$MARKER" \
          "$HEAD" \
          "$EGG" \
          "$TEXT" \
          '---' \
          "_Peer router: Omni ↔ OpenRouter; Gemini residual. role=${ROLE}${CAV_TAG}_")

        gh api "repos/${REPO}/issues/${TARGET}/comments" -f body="$BODY" >/dev/null || \
          echo "::warning::Failed to post comment on #${TARGET}"
