name: 'Model Router'
description: |
  Select provider+model for a role (triage|review|invoke).

  LEADER POLICY (2026-08-20, issue #272):
    Gemini is PRIMARY for its best roles (review / triage / invoke).
    OmniRoute and OpenRouter are secondary free-tier peers.
    Selection = model desired + real free-tier headroom (no soft room).
    Jules remains async Cloud VM builder.

  FREE TIER ONLY on Omni + OpenRouter paths.
  Soft budgets are per-branch best-effort (Actions cache).

inputs:
  role:
    description: 'triage | review | invoke'
    required: true
  has-omni:
    description: '"true" if OMNI_API_KEY or OMNIROUTE_API_KEY is set'
    required: false
    default: 'false'
  has-openrouter:
    description: '"true" if OPENROUTER_API_KEY is set'
    required: false
    default: 'false'
  has-gemini:
    description: '"true" if GEMINI_API_KEY is set'
    required: false
    default: 'true'
  capability-spine-observe:
    description: 'Emit AR-17 shadow decision data only; it never changes the execution route'
    required: false
    default: 'true'

outputs:
  provider:
    description: 'omni | openrouter | gemini | none'
    value: ${{ steps.pick.outputs.provider }}
  model:
    description: 'Model id to request'
    value: ${{ steps.pick.outputs.model }}
  skip:
    description: '"true" if no capacity remains'
    value: ${{ steps.pick.outputs.skip }}
  reason:
    description: 'Human-readable selection reason'
    value: ${{ steps.pick.outputs.reason }}
  decision:
    description: 'Secret-free AR-17 observe-mode capability decision envelope'
    value: ${{ steps.pick.outputs.decision }}
  decision-summary:
    description: 'One-line AR-17 observe-mode decision summary'
    value: ${{ steps.pick.outputs.decision_summary }}

runs:
  using: composite
  steps:
    - name: Pacific date key
      id: date
      shell: bash
      run: echo "key=$(TZ=America/Los_Angeles date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Restore per-model counters (per-branch best-effort)
      id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: /tmp/model-router
        key: model-router-${{ steps.date.outputs.key }}
        restore-keys: model-router-${{ steps.date.outputs.key }}
        enableCrossOsArchive: true

    - name: Pick provider + model plus observe-mode capability decision
      id: pick
      shell: bash
      env:
        ROLE: ${{ inputs.role }}
        HAS_OMNI: ${{ inputs.has-omni }}
        HAS_OPENROUTER: ${{ inputs.has-openrouter }}
        HAS_GEMINI: ${{ inputs.has-gemini }}
        CAPABILITY_SPINE_OBSERVE: ${{ inputs.capability-spine-observe }}
      run: |
        python3 scripts/model_router.py

    - name: Save per-model counters
      if: steps.pick.outputs.skip != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: /tmp/model-router
        key: model-router-${{ steps.date.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
        enableCrossOsArchive: true
