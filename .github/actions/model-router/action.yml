name: 'Model Router'
description: |
  Select provider+model for a role (triage|review|invoke).

  Logic chain (AGENT-TEAM-ORCHESTRATION):
    live catalog (openrouter|felo|omni) → eligible free/zero/trial
      → model-router pick (Gemini soft-budget primary when present)
      → invocation telemetry → MoneyBall/3L0 post-success scoring

  "Fallback" means dynamic recovery from unavailable capacity — not a frozen hierarchy.
  FELO is a first-class peer when FELO_AI_API is set.

inputs:
  role:
    description: 'triage | review | invoke'
    required: true
  has-omni:
    description: '"true" if OMNI_API_KEY or OMNIROUTE_API_KEY is set'
    required: false
    default: 'false'
  has-openrouter:
    description: '"true" if OPENROUTER_API_KEY is set'
    required: false
    default: 'false'
  has-felo:
    description: '"true" if FELO_AI_API is set'
    required: false
    default: 'false'
  has-gemini:
    description: '"true" if GEMINI_API_KEY is set'
    required: false
    default: 'true'
  capability-spine-observe:
    description: 'Emit AR-18 shadow decision data only; it never changes the execution route'
    required: false
    default: 'true'
  target-sha:
    description: 'Optional already-validated PR head SHA for a PR-scoped observe decision'
    required: false
    default: ''
  current-sha:
    description: 'Optional trusted current SHA used to validate target-sha; required when target-sha is supplied'
    required: false
    default: ''

outputs:
  provider:
    description: 'omni | openrouter | felo | gemini | none'
    value: ${{ steps.pick.outputs.provider }}
  model:
    description: 'Model id to request'
    value: ${{ steps.pick.outputs.model }}
  skip:
    description: '"true" if no capacity remains'
    value: ${{ steps.pick.outputs.skip }}
  reason:
    description: 'Human-readable selection reason'
    value: ${{ steps.pick.outputs.reason }}
  decision:
    description: 'Secret-free AR-18 observe-mode capability decision envelope'
    value: ${{ steps.pick.outputs.decision }}
  decision-summary:
    description: 'One-line AR-18 observe-mode decision summary'
    value: ${{ steps.pick.outputs.decision_summary }}
  catalog-state:
    description: 'live | cached | unavailable'
    value: ${{ steps.pick.outputs.catalog_state }}

runs:
  using: composite
  steps:
    - name: Pacific date key
      id: date
      shell: bash
      run: echo "key=$(TZ=America/Los_Angeles date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Restore per-model counters (per-branch best-effort)
      id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: /tmp/model-router
        key: model-router-${{ steps.date.outputs.key }}
        restore-keys: model-router-${{ steps.date.outputs.key }}
        enableCrossOsArchive: true

    - name: Pick provider + model (live catalog fed)
      id: pick
      shell: bash
      env:
        ROLE: ${{ inputs.role }}
        HAS_OMNI: ${{ inputs.has-omni }}
        HAS_OPENROUTER: ${{ inputs.has-openrouter }}
        HAS_FELO: ${{ inputs.has-felo }}
        HAS_GEMINI: ${{ inputs.has-gemini }}
        CAPABILITY_SPINE_OBSERVE: ${{ inputs.capability-spine-observe }}
        TARGET_SHA: ${{ inputs.target-sha }}
        CURRENT_SHA: ${{ inputs.current-sha }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        FELO_AI_API: ${{ secrets.FELO_AI_API }}
        OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
        OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      run: |
        python3 -m scripts.model_router

    - name: Save per-model counters
      if: steps.pick.outputs.skip != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: /tmp/model-router
        key: model-router-${{ steps.date.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
        enableCrossOsArchive: true
