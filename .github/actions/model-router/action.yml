name: 'Model Router'
description: |
  Select provider+model for a role (triage|review|invoke).

  ORDER (max free-tier ROI — operator 2026-08-08):
    1. OmniRoute   — free-tier aggregation / auto failover (#91)
    2. OpenRouter  — :free models only
    3. Gemini      — residual capacity (do NOT burn first)

  Soft budgets are per-branch best-effort (Actions cache).
  FREE TIER ONLY on Omni + OpenRouter paths.

inputs:
  role:
    description: 'triage | review | invoke'
    required: true
  has-omni:
    description: '"true" if OMNI_API_KEY or OMNIROUTE_API_KEY is set'
    required: false
    default: 'false'
  has-openrouter:
    description: '"true" if OPENROUTER_API_KEY is set'
    required: false
    default: 'false'
  has-gemini:
    description: '"true" if GEMINI_API_KEY is set'
    required: false
    default: 'true'

outputs:
  provider:
    description: 'omni | openrouter | gemini | none'
    value: ${{ steps.pick.outputs.provider }}
  model:
    description: 'Model id to request'
    value: ${{ steps.pick.outputs.model }}
  skip:
    description: '"true" if no capacity remains'
    value: ${{ steps.pick.outputs.skip }}
  reason:
    description: 'Human-readable selection reason'
    value: ${{ steps.pick.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Pacific date key
      id: date
      shell: bash
      run: echo "key=$(TZ=America/Los_Angeles date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Restore per-model counters (per-branch best-effort)
      id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: /tmp/model-router
        key: model-router-${{ steps.date.outputs.key }}
        restore-keys: model-router-${{ steps.date.outputs.key }}
        enableCrossOsArchive: true

    - name: Pick provider + model (Omni → OpenRouter → Gemini)
      id: pick
      shell: bash
      env:
        ROLE: ${{ inputs.role }}
        HAS_OMNI: ${{ inputs.has-omni }}
        HAS_OPENROUTER: ${{ inputs.has-openrouter }}
        HAS_GEMINI: ${{ inputs.has-gemini }}
      run: |
        set -eu
        DIR=/tmp/model-router
        mkdir -p "$DIR"
        count() {
          f="$DIR/${1//\//_}.txt"
          c=$(cat "$f" 2>/dev/null || echo 0)
          [[ "$c" =~ ^[0-9]+$ ]] || c=0
          echo "$c"
        }
        bump() {
          f="$DIR/${1//\//_}.txt"
          c=$(count "$1")
          echo $((c + 1)) > "$f"
        }

        case "$ROLE" in
          triage)
            # Omni: auto/best-free aggregates free providers
            OMNI_MODEL="auto/best-free"
            OMNI_LIMIT=200
            OR_CANDIDATES="meta-llama/llama-3.3-70b-instruct:free:40 google/gemma-3-12b-it:free:40"
            GEM_CANDIDATES="gemini-3.1-flash-lite:450 gemini-3.5-flash-lite:450 gemini-2.5-flash-lite:15"
            ;;
          review)
            OMNI_MODEL="auto/best-free"
            OMNI_LIMIT=120
            OR_CANDIDATES="qwen/qwen3-coder:free:30 meta-llama/llama-3.3-70b-instruct:free:40 deepseek/deepseek-r1:free:20"
            GEM_CANDIDATES="gemini-3.5-flash:15 gemini-2.5-flash:15 gemini-3-flash:15 gemini-3.1-flash-lite:450"
            ;;
          invoke)
            OMNI_MODEL="auto/best-free"
            OMNI_LIMIT=200
            OR_CANDIDATES="meta-llama/llama-3.3-70b-instruct:free:40 google/gemma-3-12b-it:free:40"
            GEM_CANDIDATES="gemini-3.1-flash-lite:450 gemini-3.5-flash-lite:450"
            ;;
          *)
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "provider=none" >> "$GITHUB_OUTPUT"
            echo "model=" >> "$GITHUB_OUTPUT"
            echo "reason=unknown role $ROLE" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac

        # ── 1. OmniRoute (PRIMARY) ──────────────────────────────────────
        if [ "$HAS_OMNI" = "true" ]; then
          used=$(count "omni/$OMNI_MODEL")
          if [ "$used" -lt "$OMNI_LIMIT" ]; then
            bump "omni/$OMNI_MODEL"
            echo "provider=omni" >> "$GITHUB_OUTPUT"
            echo "model=$OMNI_MODEL" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=role=$ROLE omni=$OMNI_MODEL used=$((used+1))/$OMNI_LIMIT primary" >> "$GITHUB_OUTPUT"
            echo "Selected omni/$OMNI_MODEL ($((used+1))/$OMNI_LIMIT) PRIMARY"
            exit 0
          fi
          echo "Omni soft budget exhausted for $OMNI_MODEL ($used/$OMNI_LIMIT)"
        fi

        # ── 2. OpenRouter :free (SECONDARY) ─────────────────────────────
        if [ "$HAS_OPENROUTER" = "true" ]; then
          for entry in $OR_CANDIDATES; do
            model="${entry%:*}"
            limit="${entry##*:}"
            used=$(count "$model")
            if [ "$used" -lt "$limit" ]; then
              bump "$model"
              echo "provider=openrouter" >> "$GITHUB_OUTPUT"
              echo "model=$model" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "reason=role=$ROLE openrouter=$model used=$((used+1))/$limit secondary" >> "$GITHUB_OUTPUT"
              echo "Selected openrouter/$model ($((used+1))/$limit) SECONDARY"
              exit 0
            fi
            echo "Exhausted soft budget for openrouter $model ($used/$limit)"
          done
        fi

        # ── 3. Gemini (RESIDUAL — last) ─────────────────────────────────
        if [ "$HAS_GEMINI" = "true" ]; then
          for entry in $GEM_CANDIDATES; do
            model="${entry%%:*}"
            limit="${entry##*:}"
            used=$(count "$model")
            if [ "$used" -lt "$limit" ]; then
              bump "$model"
              echo "provider=gemini" >> "$GITHUB_OUTPUT"
              echo "model=$model" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "reason=role=$ROLE gemini=$model used=$((used+1))/$limit residual" >> "$GITHUB_OUTPUT"
              echo "Selected gemini/$model ($((used+1))/$limit) RESIDUAL"
              exit 0
            fi
            echo "Exhausted soft budget for gemini $model ($used/$limit)"
          done
        fi

        echo "skip=true" >> "$GITHUB_OUTPUT"
        echo "provider=none" >> "$GITHUB_OUTPUT"
        echo "model=" >> "$GITHUB_OUTPUT"
        echo "reason=all free paths exhausted (omni/openrouter/gemini) role=$ROLE" >> "$GITHUB_OUTPUT"
        echo "::warning::Model router: no capacity for role=$ROLE"

    - name: Save per-model counters
      if: steps.pick.outputs.skip != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: /tmp/model-router
        key: model-router-${{ steps.date.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
        enableCrossOsArchive: true
