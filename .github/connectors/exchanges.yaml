# Exchange API Connectors Configuration
# This file defines the configuration for all exchange API integrations

exchanges:
  yobit:
    enabled: true
    api_key_env: "YOBIT_API_KEY"
    api_secret_env: "YOBIT_API_SECRET"
    base_url: "https://yobit.net"
    api_version: "3"
    rate_limit: 10
    timeout: 30
    retry_attempts: 3
    retry_delay: 1
    
    # Authentication
    auth_method: "hmac"
    hash_algorithm: "sha512"
    
    # API endpoints
    endpoints:
      info: "/api/{api_version}/info"
      ticker: "/api/{api_version}/ticker/{pair}"
      depth: "/api/{api_version}/depth/{pair}"
      trades: "/api/{api_version}/trades/{pair}"
      get_info: "/tapi"
      get_balance: "/tapi"
      trade: "/tapi"
      active_orders: "/tapi"
      order_info: "/tapi"
      cancel_order: "/tapi"
      trade_history: "/tapi"
      withdraw: "/tapi"
    
    # Trading pairs to monitor
    pairs:
      - "BTC_USD"
      - "ETH_USD"
      - "LTC_USD"
      - "XRP_USD"
      - "BCH_USD"
    
    # Features
    features:
      - spot_trading
      - market_data
      - account_balance
      - order_management
      - trade_history
      - withdrawals
    
    # Rate limiting
    rate_limits:
      public: 10  # requests per second
      private: 10 # requests per second
    
    # Order types
    order_types:
      - limit
      - market
      - stop_limit
      - stop_market
    
    # Time in force
    time_in_force:
      - GTC  # Good Till Cancel
      - IOC  # Immediate Or Cancel
      - FOK  # Fill Or Kill

  kucoin:
    enabled: true
    api_key_env: "KUCOIN_API_KEY"
    api_secret_env: "KUCOIN_API_SECRET"
    passphrase_env: "KUCOIN_PASSPHRASE"
    base_url: "https://api.kucoin.com"
    api_version: "v1"
    rate_limit: 100
    timeout: 30
    retry_attempts: 3
    retry_delay: 1
    
    # Authentication
    auth_method: "jwt"
    hash_algorithm: "sha256"
    
    # API endpoints
    endpoints:
      # Market data
      symbols: "/api/{api_version}/symbols"
      ticker: "/api/{api_version}/market/allTickers"
      order_book: "/api/{api_version}/market/orderbook/level2"
      trades: "/api/{api_version}/market/histories"
      kline: "/api/{api_version}/market/candles"
      
      # Trading
      orders: "/api/{api_version}/orders"
      order_by_id: "/api/{api_version}/orders/{orderId}"
      cancel_order: "/api/{api_version}/orders/{orderId}"
      cancel_all_orders: "/api/{api_version}/orders"
      
      # Account
      accounts: "/api/{api_version}/accounts"
      account_balance: "/api/{api_version}/accounts/{accountId}/balance"
      account_ledgers: "/api/{api_version}/accounts/{accountId}/ledgers"
      
      # Deposit and Withdrawal
      deposits: "/api/{api_version}/deposits"
      withdrawals: "/api/{api_version}/withdrawals"
      withdrawal_quotas: "/api/{api_version}/withdrawals/quotas"
      
      # User
      user_info: "/api/{api_version}/user/info"
    
    # Trading pairs to monitor
    pairs:
      - "BTC-USDT"
      - "ETH-USDT"
      - "LTC-USDT"
      - "XRP-USDT"
      - "KCS-USDT"
    
    # Features
    features:
      - spot_trading
      - margin_trading
      - futures_trading
      - market_data
      - account_balance
      - order_management
      - trade_history
      - deposits
      - withdrawals
    
    # Rate limiting
    rate_limits:
      rest: 100  # requests per second
      websocket: 1000 # messages per second
    
    # Websocket
    websocket:
      enabled: true
      url: "wss://ws-api.kucoin.com/endpoint"
      ping_interval: 30
      reconnect_delay: 5

  binance:
    enabled: false
    api_key_env: "BINANCE_API_KEY"
    api_secret_env: "BINANCE_API_SECRET"
    base_url: "https://api.binance.com"
    api_version: "v3"
    rate_limit: 1200
    timeout: 30
    retry_attempts: 3
    retry_delay: 1
    
    # Authentication
    auth_method: "hmac"
    hash_algorithm: "sha256"
    
    # API endpoints
    endpoints:
      # Market data
      ping: "/api/{api_version}/ping"
      server_time: "/api/{api_version}/time"
      exchange_info: "/api/{api_version}/exchangeInfo"
      depth: "/api/{api_version}/depth"
      trades: "/api/{api_version}/trades"
      historical_trades: "/api/{api_version}/historicalTrades"
      agg_trades: "/api/{api_version}/aggTrades"
      kline: "/api/{api_version}/klines"
      ticker_24hr: "/api/{api_version}/ticker/24hr"
      ticker_price: "/api/{api_version}/ticker/price"
      ticker_book: "/api/{api_version}/ticker/bookTicker"
      
      # Trading
      test_order: "/api/{api_version}/order/test"
      new_order: "/api/{api_version}/order"
      cancel_order: "/api/{api_version}/order"
      cancel_all_orders: "/api/{api_version}/openOrders"
      order_status: "/api/{api_version}/order"
      
      # Account
      account_info: "/api/{api_version}/account"
      account_trades: "/api/{api_version}/myTrades"
      
      # User data
      user_assets: "/sapi/v1/asset/getUserAsset"
    
    # Trading pairs to monitor
    pairs:
      - "BTCUSDT"
      - "ETHUSDT"
      - "LTCUSDT"
      - "XRPUSDT"
      - "BNBUSDT"
    
    # Features
    features:
      - spot_trading
      - margin_trading
      - futures_trading
      - market_data
      - account_balance
      - order_management
      - trade_history
      - staking
      - savings
    
    # Rate limiting
    rate_limits:
      rest: 1200  # requests per minute
      websocket: 5000 # messages per minute
    
    # Websocket
    websocket:
      enabled: true
      url: "wss://stream.binance.com:9443/ws"
      ping_interval: 60
      reconnect_delay: 5

  # Additional exchanges can be added here
  # Example:
  # coinbase:
  #   enabled: false
  #   api_key_env: "COINBASE_API_KEY"
  #   api_secret_env: "COINBASE_API_SECRET"
  #   base_url: "https://api.coinbase.com"
