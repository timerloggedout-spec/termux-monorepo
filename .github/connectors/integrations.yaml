# =============================================================================
# TIER 3 — PATs (secret wiring only)
# =============================================================================
tokens:
  ARCHWIZ_GITHUB_TOKEN:
    type: fine_grained_pat
    status: never_used
    action: WIRE_AS_REPO_SECRET
    preference: preferred_admin
    runbook: docs/ops/ARCHWIZ-ADMIN-TOKEN.md
  OPERATOR_GITHUB_TOKEN:
    type: classic_or_fine
    status: primary
    action: KEEP
  Gh_actions:
    type: classic_pat
    last_used: within_last_week
    action: KEEP_IF_WIRED
  gitlab_cicd-w+org_view:
    type: classic_pat
    last_used: within_last_week
    scopes: [read:org, repo]
    action: KEEP_FOR_GITLAB_BRIDGE
  gitlab_cicd:
    type: classic_pat
    status: never_used
    scopes: [repo]
    action: REVOKE_OR_MERGE_INTO_W_ORG_VIEW
  timers-full+accessPAT:
    type: classic_pat
    status: never_used
    action: REVOKE
    note: Prefer fine-grained ARCHWIZ / OPERATOR; avoid duplicate full admin
  DEEPSEEK_API_KEY:
    type: classic_pat
    status: never_used
    action: REVOKE_OR_RENAME
    warning: MISNAMED — this is a GitHub PAT with admin scopes, NOT DeepSeek model auth. Do NOT use as DEEPSEEK_TOKEN.
  DeepSeek_account-1:
    type: fine_grained_pat
    status: expired
    action: ROTATE_OR_REMOVE
  DEEPSEEK_TOKEN:
    type: model_auth
    action: ENSURE_REPO_SECRET
    note: Not a GitHub PAT. First non-empty of DEEPSEEK_TOKEN | DEEPSEEK_API_KEY | DEEPSEEK_AUTH_TOKEN | NEXUSCLI_TOKEN

