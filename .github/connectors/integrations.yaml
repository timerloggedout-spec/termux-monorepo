rules:
  - Admin PATs (OPERATOR_*, ARCHWIZ_*) → gh / REST / git only
  - Model tokens (DEEPSEEK_TOKEN, Omni, OpenRouter, Gemini, Mistral) → provider APIs only
  - Never cross-wire (no GH PAT as DeepSeek Bearer)
  - Never paste secret values into issues/PRs/catalogs
  - Prefer fine-grained over classic full-admin duplicates
