# ========== CI mode integration ==========
def run_ci(event, session, peer, workspace, operator_token):
    """
    Non-interactive agent loop.
    - event: GitHub event dict
    - session: session dict from session_manager
    - peer: provider info from router
    - workspace: path to repo root
    - operator_token: GitHub PAT
    Returns a dict with 'actions' (list of commands to execute).
    """
    import subprocess
    import json
    from pathlib import Path

    # Set up GitHub CLI with token
    gh_env = os.environ.copy()
    gh_env['GH_TOKEN'] = operator_token

    # Example: parse PR info
    pr_number = event.get('pull_request', {}).get('number')
    repo = event.get('repository', {}).get('full_name')
    action = event.get('action')

    results = []
    decisions = []

    # Decide what to do based on event
    if action in ['opened', 'synchronize'] and pr_number:
        # Get PR diff
        diff_cmd = ['gh', 'pr', 'diff', str(pr_number), '--repo', repo]
        diff = subprocess.check_output(diff_cmd, env=gh_env, text=True)

        # Send to the chosen provider for analysis
        # We'll call the provider's completion endpoint (official or via wrapper)
        if peer['provider'] == 'deepseek':
            # Use web-wrapper via core's stream_completion (but we need to adapt)
            # For now, we'll simulate analysis
            analysis = "Simulated analysis: no critical issues found."
        else:
            # Use official REST API
            import requests
            headers = {
                'Authorization': f"Bearer {peer['api_key']}",
                'Content-Type': 'application/json',
            }
            payload = {
                'model': 'gpt-4o-mini',  # or appropriate
                'messages': [
                    {'role': 'system', 'content': 'You are a code reviewer. Analyze the diff and suggest improvements.'},
                    {'role': 'user', 'content': diff[:8000]}  # truncate
                ]
            }
            resp = requests.post(peer['endpoint'], json=payload, headers=headers)
            if resp.status_code == 200:
                analysis = resp.json()['choices'][0]['message']['content']
            else:
                analysis = f"API error: {resp.status_code}"

        # Optionally create a comment on the PR
        comment_cmd = ['gh', 'pr', 'comment', str(pr_number), '--body', analysis[:2000], '--repo', repo]
        subprocess.run(comment_cmd, env=gh_env, check=False)

        decisions.append({
            'type': 'pr_review',
            'pr': pr_number,
            'summary': analysis[:200],
        })

    # Return structured output
    return {
        'actions': decisions,
        'event': event.get('action'),
        'pr': pr_number,
        'provider_used': peer['provider'],
    }
