3. deepcli/session_manager.py

```python
"""
Manages DeepSeek web session: PoW solving, cookie rotation, persistence.
Uses deepseek.wasm via Node.js (or Pyodide fallback).
"""
import os
import json
import subprocess
import time
from pathlib import Path
from curl_cffi import requests

# Base URL for DeepSeek web interface (reverse-engineered)
DEEPSEEK_BASE = "https://chat.deepseek.com"
DEFAULT_WASM_PATH = Path(__file__).parent / "deepseek.wasm"

def solve_pow(wasm_path=DEFAULT_WASM_PATH):
    """
    Runs the PoW solver using Node.js + WASM.
    Returns a dict with 'answer' and 'signature' to be used in headers.
    """
    if not wasm_path.exists():
        raise FileNotFoundError(f"WASM solver not found: {wasm_path}")

    # Simple wrapper: assume a Node script that outputs JSON
    # We'll use a small inline script that loads the WASM and solves.
    # In reality, you'd have a dedicated solver script.
    # Here we simulate by calling a pre-written script.
    solver_script = Path(__file__).parent / "pow_solver.js"
    if not solver_script.exists():
        # Fallback: write a minimal solver on the fly
        with open(solver_script, 'w') as f:
            f.write("""
const fs = require('fs');
const path = require('path');
const wasmPath = process.argv[2];
const wasm = fs.readFileSync(wasmPath);
WebAssembly.instantiate(wasm).then(obj => {
    // Assume the module exports a 'solve' function
    const result = obj.instance.exports.solve();
    console.log(JSON.stringify({ answer: result.answer, signature: result.signature }));
});
""")
    result = subprocess.check_output(['node', str(solver_script), str(wasm_path)], text=True)
    return json.loads(result)

def get_new_session(wasm_path=DEFAULT_WASM_PATH):
    """
    Perform full handshake: solve PoW, get cookies, return session dict.
    """
    pow_result = solve_pow(wasm_path)

    # Use curl_cffi to mimic browser
    session = requests.Session()
    session.headers.update({
        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
        'Accept': 'application/json',
        'Content-Type': 'application/json',
    })

    # First request to get initial cookies
    resp = session.get(f"{DEEPSEEK_BASE}/api/chat")
    if resp.status_code != 200:
        raise RuntimeError("Failed to get initial session")

    # Send PoW answer to get authenticated token
    auth_payload = {
        'pow_answer': pow_result['answer'],
        'pow_signature': pow_result['signature'],
    }
    auth_resp = session.post(f"{DEEPSEEK_BASE}/api/auth", json=auth_payload)
    if auth_resp.status_code != 200:
        raise RuntimeError("PoW authentication failed")

    token = auth_resp.json().get('token')
    if not token:
        raise RuntimeError("No token received")

    session.headers['Authorization'] = f'Bearer {token}'

    # Return session info
    return {
        'cookies': session.cookies.get_dict(),
        'headers': dict(session.headers),
        'token': token,
        'expires': time.time() + 3600 * 24,  # roughly 24h
    }

def ensure_session(cache_dir='/tmp/deepseek-cache'):
    """
    Load session from cache if valid, otherwise create new and cache it.
    Returns session dict.
    """
    cache_path = Path(cache_dir) / 'session.json'
    cache_path.parent.mkdir(parents=True, exist_ok=True)

    # Try to load
    if cache_path.exists():
        with open(cache_path, 'r') as f:
            session = json.load(f)
        # Check if still valid (simple expiration)
        if session.get('expires', 0) > time.time():
            return session

    # Need new session
    session = get_new_session()
    with open(cache_path, 'w') as f:
        json.dump(session, f)
    return session
