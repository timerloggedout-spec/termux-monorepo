Title: feat(ci): wire DeepSeek v4-Pro (web-wrapper) into GitHub Actions with session caching and peer routing

Summary:

· Adds .github/workflows/deepseek-ci.yml – the main CI workflow that runs on pull_request and workflow_dispatch.
· Adds deepcli/ci_mode.py – CI entrypoint that imports core.py, solves PoW (via WASM), caches session, reads GitHub event, runs agent loop with full tool support.
· Adds deepcli/session_manager.py – responsible for PoW solving, cookie rotation, and session persistence.
· Updates deepcli/core.py with a run_ci() function exposed for CI mode (non-interactive).
· Adds deepcli/router.py – routing logic that treats OpenRouter and Omni as equal primary peers (not fallbacks), with scoring based on cost/latency.
· Adds environment variable support for OPENROUTER_API_KEY, OMNI_API_KEY, and OPERATOR_TOKEN (GitHub PAT).

Testing:

· Verified on Ubuntu 22.04 runner with Node.js installed (WASM solver works).
· Session cache persists across runs, reducing PoW solves to ~once per 24h.

