name: DeepSeek CI – Agentic Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      event_payload:
        description: 'JSON event payload (optional)'
        required: false
        default: '{}'

jobs:
  deepseek-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    env:
      OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
      GITHUB_EVENT: ${{ toJson(github.event) }}
      DEEPSEEK_WASM_PATH: ./deepcli/deepseek.wasm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.OPERATOR_TOKEN }}

      - name: Setup Node.js (for PoW WASM)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install curl_cffi requests pyyaml

      - name: Cache DeepSeek session (cookies + tokens)
        uses: actions/cache@v4
        id: cache-session
        with:
          path: |
            ./cookies_2.json
            ./session.json
          key: deepseek-session-${{ runner.os }}-${{ hashFiles('deepcli/session_manager.py') }}
          restore-keys: |
            deepseek-session-${{ runner.os }}-

      - name: Run DeepSeek CI Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m deepcli.ci_mode \
            --event "$GITHUB_EVENT" \
            --workspace "$GITHUB_WORKSPACE" \
            --cache-dir "${{ runner.temp }}/deepseek-cache"

      - name: Upload results (if any)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-output
          path: ./deepseek_output.json
