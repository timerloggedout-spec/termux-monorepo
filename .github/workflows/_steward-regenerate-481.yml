name: Steward Regenerate 481
on:
  push:
    branches: [ops/agent-handoff-observability]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor == 'timerloggedout-spec' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - run: rm -f .github/workflows/_steward-regenerate-481.yml
      - run: python3 scripts/ci/automation_docs.py --write
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ops/generated/automation-workflow-catalog.json docs/ops/generated/automation-workflow-catalog.md docs/ops/generated/automation-diagram-assets.json .github/workflows/_steward-regenerate-481.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix(agent): refresh deterministic automation catalog'
          git push origin HEAD:ops/agent-handoff-observability
