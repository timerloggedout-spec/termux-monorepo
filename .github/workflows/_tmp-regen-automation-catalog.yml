name: tmp regen automation catalog

# One-shot: regenerate docs/ops/generated automation catalog and push to this branch.
# Delete after gate is green.

on:
  workflow_dispatch:
  push:
    branches: [feat/ecc-tools-comment-command-automation]
    paths:
      - '.github/workflows/agent-ecc-tools-ops.yml'
      - '.github/workflows/_tmp-regen-automation-catalog.yml'

permissions:
  contents: write

concurrency:
  group: tmp-regen-catalog
  cancel-in-progress: true

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ecc-tools-comment-command-automation
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate catalog
        run: |
          set -euo pipefail
          python3 scripts/ci/automation_docs.py --write
          python3 scripts/ci/automation_docs.py --check
      - name: Commit if dirty
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ops/generated/automation-workflow-catalog.json \
                  docs/ops/generated/automation-workflow-catalog.md \
                  docs/ops/generated/automation-diagram-assets.json || true
          if git diff --cached --quiet; then
            echo "catalog already current"
            exit 0
          fi
          git commit -m "docs(ops): regenerate automation catalog for agent-ecc-tools-ops"
          git push origin HEAD:feat/ecc-tools-comment-command-automation
