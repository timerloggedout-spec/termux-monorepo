name: tmp regen automation catalog
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ecc-tools-comment-command-automation
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp-regen-automation-catalog.yml
          python3 scripts/ci/automation_docs.py --write
          python3 scripts/ci/automation_docs.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/ops/generated/
          git add -u .github/workflows/_tmp-regen-automation-catalog.yml || true
          if git diff --cached --quiet; then echo current; exit 0; fi
          git commit -m "docs(ops): catalog after agent-ecc CodeRabbit fixes"
          git push origin HEAD:feat/ecc-tools-comment-command-automation
