name: Action Effectiveness Ledger

# Trusted control-plane telemetry. Reads GitHub metadata and Git objects as data;
# never checks out or executes pull-request source, tests, build scripts, or dependencies.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to inspect'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write
  checks: read

concurrency:
  # Comment storms must not cancel an in-flight ledger. Cancelled zero-job
  # runs on issue_comment (PR #1156, 2026-10-06) are a failure mode, not a skip.
  # Include event_name so a /ledger comment does not cancel pull_request_target.
  group: action-effectiveness-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  ledger:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/ledger'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted control-plane
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Measure action-effect events and longitudinal delta
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "invalid PR number" >&2; exit 1; }

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          base_sha="$(jq -r '.base.sha' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"

          # actions/checkout fetches the trusted control-plane revision, not the PR head.
          # Acquire the exact immutable base/head objects explicitly before merge-base work.
          # This avoids depending on branch names or on the synthetic PR ref being retained.
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base_sha"
          fi
          if ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            if [[ "$head_repo" == "$GITHUB_REPOSITORY" ]]; then
              git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}"
            else
              git fetch --no-tags "https://github.com/${head_repo}.git" "$head_sha"
            fi
          fi
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null || ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            echo "receipt race: base=${base_sha} head=${head_sha} unavailable after fetch; skipping measure" >&2
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          merge_base="$(git merge-base "$base_sha" "$head_sha")"

          mapfile -t commits < <(git rev-list --reverse "$merge_base..$head_sha")
          commit_count=${#commits[@]}
          empty_count=0
          metadata_only_count=0
          effective_count=0
          gross_add=0
          gross_del=0

          # Complete commit-range accounting. 0/0 is diagnostic metadata-only evidence,
          # not an absolute semantic claim about binary changes.
          for sha in "${commits[@]}"; do
            parent="$(git rev-parse "${sha}^" 2>/dev/null || true)"
            if [[ -n "$parent" ]]; then
              stats="$(git diff --numstat "$parent" "$sha")"
            else
              stats="$(git diff --numstat --root "$sha")"
            fi
            read -r add del files < <(awk 'BEGIN{a=0;d=0;f=0} {if($1~/^[0-9]+$/)a+=$1;if($2~/^[0-9]+$/)d+=$2;f++} END{print a,d,f+0}' <<<"$stats")
            gross_add=$((gross_add + add))
            gross_del=$((gross_del + del))
            if [[ "$files" -eq 0 ]]; then
              empty_count=$((empty_count + 1))
            elif [[ "$add" -eq 0 && "$del" -eq 0 ]]; then
              metadata_only_count=$((metadata_only_count + 1))
            else
              effective_count=$((effective_count + 1))
            fi
          done

          read -r final_add final_del final_files < <(git diff --numstat "$base_sha" "$head_sha" | awk 'BEGIN{a=0;d=0;f=0} {if($1~/^[0-9]+$/)a+=$1;if($2~/^[0-9]+$/)d+=$2;f++} END{print a,d,f+0}')
          ahead=$(git rev-list --count "$base_sha..$head_sha")
          behind=$(git rev-list --count "$head_sha..$base_sha")
          gross_churn=$((gross_add + gross_del))
          final_delta=$((final_add + final_del))
          if (( commit_count > 0 )); then noop_pct=$(( (empty_count + metadata_only_count) * 100 / commit_count )); else noop_pct=0; fi
          if (( gross_churn > 0 )); then realization_pct=$(( final_delta * 100 / gross_churn)); else realization_pct=0; fi

          # --slurp is required because gh api --paginate emits one JSON array per page.
          # Fail closed on API errors; normalize empty collections to [].
          # Write pages to files. Capturing them in shell variables and feeding
          # jq via here-strings still execs jq with an oversized argv
          # (run 37551434859 exit 126: /usr/bin/jq Argument list too long).
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > "$RUNNER_TEMP/ledger-comments-pages.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" > "$RUNNER_TEMP/ledger-reviews-pages.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments?per_page=100" > "$RUNNER_TEMP/ledger-inline-pages.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" > "$RUNNER_TEMP/ledger-commits-pages.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100" > "$RUNNER_TEMP/ledger-checks-pages.json"

          jq -c 'add // []' "$RUNNER_TEMP/ledger-comments-pages.json" > "$RUNNER_TEMP/ledger-comments.json"
          jq -c 'add // []' "$RUNNER_TEMP/ledger-reviews-pages.json" > "$RUNNER_TEMP/ledger-reviews.json"
          jq -c 'add // []' "$RUNNER_TEMP/ledger-inline-pages.json" > "$RUNNER_TEMP/ledger-inline.json"
          jq -c 'add // []' "$RUNNER_TEMP/ledger-commits-pages.json" > "$RUNNER_TEMP/ledger-commits.json"

          comment_count="$(jq 'length' "$RUNNER_TEMP/ledger-comments.json")"
          review_count="$(jq 'length' "$RUNNER_TEMP/ledger-reviews.json")"
          review_comment_count="$(jq 'length' "$RUNNER_TEMP/ledger-inline.json")"
          actionable_comment_count="$(jq '[.[] | select((.body // "") | test("(^|\\n)\\s*(fix|change|update|remove|add|please|must|should|address|resolve|request|review)\\b"; "i"))] | length' "$RUNNER_TEMP/ledger-comments.json")"
          approvals="$(jq '[.[] | select(.state == "APPROVED")] | length' "$RUNNER_TEMP/ledger-reviews.json")"
          changes_requested="$(jq '[.[] | select(.state == "CHANGES_REQUESTED")] | length' "$RUNNER_TEMP/ledger-reviews.json")"
          check_total="$(jq 'map(.check_runs[]) | length' "$RUNNER_TEMP/ledger-checks-pages.json")"
          check_success="$(jq 'map(.check_runs[]) | map(select(.conclusion == "success")) | length' "$RUNNER_TEMP/ledger-checks-pages.json")"
          check_failure="$(jq 'map(.check_runs[]) | map(select(.conclusion == "failure")) | length' "$RUNNER_TEMP/ledger-checks-pages.json")"
          check_pending="$(jq 'map(.check_runs[]) | map(select(.status != "completed")) | length' "$RUNNER_TEMP/ledger-checks-pages.json")"

          # Temporal follow-through is association, not causal attribution.
          # Filter programs live in files. Inline jq programs overflow ARG_MAX
          # (run 37551434859 exit 126: /usr/bin/jq Argument list too long).
          jq -n \
            --slurpfile comments "$RUNNER_TEMP/ledger-comments.json" \
            --slurpfile reviews "$RUNNER_TEMP/ledger-reviews.json" \
            --slurpfile inline "$RUNNER_TEMP/ledger-inline.json" \
            --slurpfile commits "$RUNNER_TEMP/ledger-commits.json" \
            -f scripts/ci/ledger/correlation.jq \
            > "$RUNNER_TEMP/ledger-correlation.json"
          event_count="$(jq '.all | length' "$RUNNER_TEMP/ledger-correlation.json")"
          followed_count="$(jq '[.all[] | select(.associated_commit_sha != null)] | length' "$RUNNER_TEMP/ledger-correlation.json")"
          followthrough_pct=0
          if (( event_count > 0 )); then followthrough_pct=$(( followed_count * 100 / event_count )); fi
          first_followthrough_sha="$(jq -r '.all | map(select(.associated_commit_sha != null)) | .[0].associated_commit_sha // ""' "$RUNNER_TEMP/ledger-correlation.json")"
          median_lag_minutes="$(jq -r '.all | map(select(.lag_minutes != null) | .lag_minutes) | if length == 0 then 0 else sort | .[length/2|floor] end' "$RUNNER_TEMP/ledger-correlation.json")"
          jq -c '[.recent // [] | .[-8:] | .[] | {id, created_at, html_url, event: (.event // .type // "event"), actor: (.actor.login // .user.login // "unknown")}]' \
            "$RUNNER_TEMP/ledger-correlation.json" > "$RUNNER_TEMP/ledger-recent-events.json"

          # Recover the previous v2 marker for longitudinal comparison. If absent, baseline is zero.
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("<!-- action-effectiveness-ledger:v2 ")) | .id' | head -n1 || true)"
          previous_json='{}'
          if [[ -n "$existing" ]]; then
            previous_body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" --jq .body)"
            previous_json="$(grep -o '<!-- action-effectiveness-ledger:v2 {.*} -->' <<<"$previous_body" | head -n1 | sed 's/^<!-- action-effectiveness-ledger:v2 //; s/ -->$//' || echo '{}')"
          fi

          printf '%s\n' "$previous_json" > "$RUNNER_TEMP/ledger-previous.json"
          prev_final_delta="$(jq -r '.final_delta // 0' "$RUNNER_TEMP/ledger-previous.json")"
          prev_behind="$(jq -r '.behind // 0' "$RUNNER_TEMP/ledger-previous.json")"
          prev_failure="$(jq -r '.check_failure // 0' "$RUNNER_TEMP/ledger-previous.json")"
          prev_pending="$(jq -r '.check_pending // 0' "$RUNNER_TEMP/ledger-previous.json")"
          prev_events="$(jq -r '.event_count // 0' "$RUNNER_TEMP/ledger-previous.json")"
          prev_followed="$(jq -r '.followed_count // 0' "$RUNNER_TEMP/ledger-previous.json")"

          delta_final=$((final_delta - prev_final_delta))
          delta_behind=$((behind - prev_behind))
          delta_failure=$((check_failure - prev_failure))
          delta_pending=$((check_pending - prev_pending))
          delta_events=$((event_count - prev_events))
          delta_followed=$((followed_count - prev_followed))

          state='🟢 EFFECTIVE'
          if [[ "$final_files" -eq 0 ]]; then
            state='🔴 NO_EFFECTIVE_DIFF'
          elif [[ "$check_failure" -gt 0 || "$changes_requested" -gt 0 ]]; then
            state='🟠 NEEDS_RECONCILIATION'
          elif [[ "$check_pending" -gt 0 ]]; then
            state='🟡 VALIDATION_PENDING'
          fi

          history_json="$(jq -c --arg head "$head_sha" --arg base "$base_sha" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson fd "$final_delta" --argjson b "$behind" --argjson ev "$event_count" --argjson fo "$followed_count" --argjson de "$delta_final" --argjson db "$delta_behind" --argjson df "$delta_failure" --argjson dp "$delta_pending" --argjson dv "$delta_events" --argjson dfo "$delta_followed" \
            '(.history // []) + [{observed_at:$at,head_sha:$head,base_sha:$base,final_delta:$fd,behind:$b,event_count:$ev,followed_count:$fo,delta:{final_delta:$de,behind:$db,check_failure:$df,check_pending:$dp,event_count:$dv,followed_count:$dfo}}] | .[-12:]' "$RUNNER_TEMP/ledger-previous.json")"
          printf '%s\n' "$history_json" > "$RUNNER_TEMP/ledger-history.json"
          # recent_events and history are file inputs. The state program is also
          # a file: an inline filter plus --slurpfile still overflowed ARG_MAX
          # (run 37551434859 exit 126). Do not echo the object into GITHUB_OUTPUT.
          jq -n \
            --slurpfile recent_events "$RUNNER_TEMP/ledger-recent-events.json" \
            --slurpfile history "$RUNNER_TEMP/ledger-history.json" \
            --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base_sha "$base_sha" --arg head_sha "$head_sha" --arg merge_base "$merge_base" --arg head_repo "$head_repo" \
            --argjson commit_count "$commit_count" --argjson empty_count "$empty_count" --argjson metadata_count "$metadata_only_count" --argjson effective_count "$effective_count" \
            --argjson gross_add "$gross_add" --argjson gross_del "$gross_del" --argjson final_add "$final_add" --argjson final_del "$final_del" --argjson final_files "$final_files" --argjson final_delta "$final_delta" \
            --argjson ahead "$ahead" --argjson behind "$behind" --argjson noop_pct "$noop_pct" --argjson realization_pct "$realization_pct" \
            --argjson comment_count "$comment_count" --argjson review_count "$review_count" --argjson review_comment_count "$review_comment_count" --argjson actionable_comments "$actionable_comment_count" --argjson approvals "$approvals" --argjson changes_requested "$changes_requested" \
            --argjson check_total "$check_total" --argjson check_success "$check_success" --argjson check_failure "$check_failure" --argjson check_pending "$check_pending" \
            --argjson event_count "$event_count" --argjson followed_count "$followed_count" --argjson followthrough_pct "$followthrough_pct" --argjson median_lag_minutes "$median_lag_minutes" \
            --argjson delta_final "$delta_final" --argjson delta_behind "$delta_behind" --argjson delta_failure "$delta_failure" --argjson delta_pending "$delta_pending" --argjson delta_events "$delta_events" --argjson delta_followed "$delta_followed" \
            --arg state "$state" --arg first_followthrough_sha "$first_followthrough_sha" \
            -f scripts/ci/ledger/state.jq \
            > "$RUNNER_TEMP/ledger-state.json"
          {
            echo "state_path=$RUNNER_TEMP/ledger-state.json"
            echo "existing_comment_id=$existing"
          } >> "$GITHUB_OUTPUT"

      - name: Publish idempotent longitudinal ledger
        if: steps.measure.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          STATE_PATH: ${{ steps.measure.outputs.state_path }}
          EXISTING_COMMENT_ID: ${{ steps.measure.outputs.existing_comment_id }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(jq -r '
            "<!-- action-effectiveness-ledger:v2 " + tojson + " -->\n\n" +
            "## 🧬 Action → Effect Longitudinal Ledger\n\n" +
            "**State:** " + .state + "  \n" +
            "**Measured head:** `" + .head_sha + "`  \n" +
            "**Base / merge-base:** `" + .base_sha + "` / `" + .merge_base + "`\n\n" +
            "| Dimension | Current | Δ since prior observation |\n|---|---:|---:|\n" +
            "| Final retained diff | " + (.final_delta|tostring) + " | " + (.delta.final_delta|tostring) + " |\n" +
            "| Behind base | " + (.behind|tostring) + " | " + (.delta.behind|tostring) + " |\n" +
            "| Check failures | " + (.check_failure|tostring) + " | " + (.delta.check_failure|tostring) + " |\n" +
            "| Pending checks | " + (.check_pending|tostring) + " | " + (.delta.check_pending|tostring) + " |\n" +
            "| Action/effect events | " + (.event_count|tostring) + " | " + (.delta.event_count|tostring) + " |\n" +
            "| Events followed by a later commit | " + (.followed_count|tostring) + " | " + (.delta.followed_count|tostring) + " |\n" +
            "| Temporal follow-through | " + (.followthrough_pct|tostring) + "% | — |\n" +
            "| Median event→commit lag | " + (.median_lag_minutes|tostring) + " min | — |\n" +
            "| PR-range commits | " + (.commit_count|tostring) + " | — |\n" +
            "| Empty / metadata-only / effective | " + ([.empty_count,.metadata_count,.effective_count] | map(tostring) | join(" / ")) + " | — |\n" +
            "| No-op + metadata rate | " + (.noop_pct|tostring) + "% | — |\n" +
            "| Churn → retained diff | " + (.realization_pct|tostring) + "% | — |\n\n" +
            "### Interpretation\n" +
            "Activity is not effectiveness. The ledger measures the complete merge-base→head commit range, distinguishes empty commits from diagnostic 0/0 metadata-only evidence, correlates actionable review/comment events to later commits, and records explicit deltas against the previous observation. Temporal follow-through is association, not causal attribution. Current-head checks and review state remain validation evidence.\n\n" +
            "### Recent correlated events\n" +
            (if (.recent_events|length) == 0 then "None in the bounded event set." else "The marker retains the latest " + ((.recent_events|length)|tostring) + " event correlations; bodies are intentionally omitted." end) + "\n\n" +
            "### First associated commit\n" +
            (if .first_followthrough_sha == "" then "None observed in the current PR range." else "`" + .first_followthrough_sha + "`" end) + "\n\n" +
            "### Longitudinal window\n" +
            "Rolling history retains the latest 12 observations in the machine-readable marker. The comment is updated in place to prevent comment amplification.\n\n" +
            "Generated: " + .observed_at
          ' "$STATE_PATH")"

          # pull_request_target github.token sometimes returns 403
          # "Resource not accessible by integration" (runs 37551532077 and
          # 37556718962) even with issues: write. Measurement already succeeded.
          # Do not fail the named workflow on that token boundary; keep other
          # API errors fail-closed.
          set +e
          if [[ -n "$EXISTING_COMMENT_ID" ]]; then
            err="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING_COMMENT_ID}" -f body="$body" 2>&1 >/dev/null)"
            rc=$?
          else
            err="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" 2>&1 >/dev/null)"
            rc=$?
          fi
          set -e
          if [[ "$rc" -ne 0 ]]; then
            if grep -q 'Resource not accessible by integration' <<<"$err"; then
              echo "ledger publish skipped: github.token cannot comment (HTTP 403)" >> "$GITHUB_STEP_SUMMARY"
              echo "$err" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "$err" >&2
            exit "$rc"
          fi
