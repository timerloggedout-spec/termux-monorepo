name: Actions queue reaper

# Stale queued runs with zero jobs (issue_comment fan-out, abandoned PR events)
# hold the Actions queue. Cancel those; if cancel returns 409, delete the ghost.
# Never touch in-progress jobs.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-queue-reaper
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
        timeout-minutes: 5
      - name: Cancel stale zero-job queued runs
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/actions_queue_reaper.py --repo "${{ github.repository }}" --older-than-hours 6 --schedule-older-than-minutes 45 --apply
