name: Actions Run Watcher — incident notification

on:
  workflow_run:
    # workflows is required; omitting it makes every push fail this file with zero jobs.
    workflows:
      - repository observatory
      - Automation Documentation Continuous Refresh
      - Context Relationship + Lead/Lag Audit
      - Agent Throughput Evidence
      - Audit Cycle — Single PR Feed-Forward
      - PR production ledger
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: actions-run-watcher-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  observe-completion:
    # Success and cancelled completions were starting a runner only to echo.
    # On 2026-10-06 the receipt SHA f26eedd0 produced a burst of watcher runs
    # with no incident. Skip the job unless the completion is actionable.
    # A workflow_run conclusion of failure is still not enough: run
    # 37859394240 on ddb22aea concluded cancelled, and stale incidents such
    # as #1025 were re-commented after the current tip ledger succeeded.
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate job classifier
        run: python3 scripts/ci/test_classify_workflow_jobs.py

      - name: Classify job conclusions
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            | python3 scripts/ci/classify_workflow_jobs.py > "$RUNNER_TEMP/classification.json" \
            && rc=0 || rc=$?
          cat "$RUNNER_TEMP/classification.json"
          if [ "$rc" -eq 1 ]; then
            echo "actionable=false" >> "$GITHUB_OUTPUT"
            echo "no failed or timed_out job; skip incident"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          echo "actionable=true" >> "$GITHUB_OUTPUT"

      - name: Create or update incident notification
        if: steps.classify.outputs.actionable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          fp="gha:${WORKFLOW_NAME,,}:${CONCLUSION,,}:${HEAD_SHA:0:12}"
          title="[Actions Incident] ${WORKFLOW_NAME}: ${CONCLUSION}"
          body=$(cat <<EOF
          ## GitHub Actions incident

          **Classification:** ${CONCLUSION}
          **Workflow:** ${WORKFLOW_NAME}
          **Run:** ${RUN_ID} (attempt ${RUN_ATTEMPT})
          **SHA:** ${HEAD_SHA}
          **Branch:** ${HEAD_BRANCH}
          **Fingerprint:** \`${fp}\`

          Evidence: ${RUN_URL}

          Job classifier required at least one failure or timed_out job. Cancelled-only and skipped completions are not incidents.

          This notification is observation/notification only; remediation remains governed by the Self-Healing Engine authority and verification gates.
          EOF
          )

          existing=$(gh issue list --repo "$REPOSITORY" --state open --search "in:title \"[Actions Incident] ${WORKFLOW_NAME}: ${CONCLUSION}\"" --json number --limit 10)
          number=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["number"] if d else "")' <<<"$existing")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPOSITORY" --body "$body"
          else
            gh issue create --repo "$REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Emit structured incident receipt
        if: steps.classify.outputs.actionable == 'true'
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 - <<'PY'
          import json, os
          print(json.dumps({
              "schema": "actions-run-watcher/v1",
              "run_id": os.environ["RUN_ID"],
              "workflow": os.environ["WORKFLOW_NAME"],
              "conclusion": os.environ["CONCLUSION"],
              "head_sha": os.environ["HEAD_SHA"],
              "run_url": os.environ["RUN_URL"],
              "observer_only": True,
              "job_classifier": "actions-job-classifier/v1",
          }, sort_keys=True))
          PY
