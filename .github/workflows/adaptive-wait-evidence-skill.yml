name: adaptive wait evidence skill contract

on:
  pull_request:
    paths:
      - '.agents/skills/adaptive-wait/**'
      - '.agents/skills/evidence-led-monorepo-ops/**'
      - 'docs/ops/skills/adaptive-wait/**'
      - 'docs/ops/skills/evidence-led-monorepo-ops/**'
      - 'docs/ops/SKILL-DISCOVERY-MATRIX.md'
      - 'docs/ops/SKILLS-INVENTORY.md'
      - 'scripts/ci/validate_operational_skills.py'
  push:
    branches: [master]
    paths:
      - '.agents/skills/adaptive-wait/**'
      - '.agents/skills/evidence-led-monorepo-ops/**'
      - 'docs/ops/skills/adaptive-wait/**'
      - 'docs/ops/skills/evidence-led-monorepo-ops/**'
      - 'docs/ops/SKILL-DISCOVERY-MATRIX.md'
      - 'docs/ops/SKILLS-INVENTORY.md'
      - 'scripts/ci/validate_operational_skills.py'

permissions:
  contents: read

concurrency:
  group: adaptive-wait-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: adaptive-wait + evidence-led contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Validate operational skill contract
        env:
          SKILL_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: python3 scripts/ci/validate_operational_skills.py
      - name: Diff hygiene
        run: git diff --check