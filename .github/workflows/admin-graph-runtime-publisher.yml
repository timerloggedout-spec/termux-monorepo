name: Admin Graph Runtime Publisher

on:
  workflow_job:
    types: [queued, in_progress, completed]
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/2 * * * *"

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: admin-graph-runtime-publisher-${{ github.event.workflow_job.run_id || github.run_id }}-${{ github.event.workflow_job.id || github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: admin-graph-runtime-publisher
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_job' && github.event.workflow_job.name != 'admin-graph-runtime-publisher') ||
      (github.event_name == 'issue_comment' && (contains(github.event.comment.body, 'PRODUCER CLAIM') || contains(github.event.comment.body, 'DISPATCH EXECUTOR CLAIM')))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Mint read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3
        with:
          app-id: ${{ vars.TERMUX_FLEET_SWARM_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read
          permission-issues: read

      - name: Normalize task-route or job lifecycle event
        id: normalize
        if: github.event_name == 'workflow_job' || github.event_name == 'issue_comment'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_FILE: ${{ github.event_path }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ops/admin_graph_runtime_event.py \
            --event-file "$EVENT_FILE" \
            --event-name "$EVENT_NAME" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --head-sha "$HEAD_SHA" \
            --output runtime-event.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Reconcile recent workflow and task-route states
        if: github.event_name == 'schedule'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          API_HEADERS=(-H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail --silent --show-error "${API_HEADERS[@]}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=30" \
            -o workflow-runs.json
          SINCE="$(date -u -d '15 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"
          for page in $(seq 1 20); do
            comment_file="issue-comments-$page.json"
            curl --fail --silent --show-error "${API_HEADERS[@]}" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/comments?since=$SINCE&per_page=100&sort=created&direction=asc&page=$page" \
              -o "$comment_file"
            count="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1], encoding="utf-8"))))' "$comment_file")"
            if [ "$count" -lt 100 ]; then break; fi
            if [ "$page" -eq 20 ]; then
              echo "Task-route reconciliation reached its bounded 2,000-comment page limit." >&2
              exit 1
            fi
          done
          python3 - <<'PY'
          import glob
          import json
          comments = []
          for path in sorted(glob.glob("issue-comments-*.json")):
              with open(path, encoding="utf-8") as handle:
                  comments.extend(json.load(handle))
          with open("workflow-runs.json", encoding="utf-8") as handle:
              runs = json.load(handle).get("workflow_runs", [])
          with open("runtime-snapshot.json", "w", encoding="utf-8") as handle:
              json.dump({"workflow_runs": runs, "issue_comments": comments}, handle)
          PY
          python3 scripts/ops/admin_graph_runtime_event.py \
            --event-file runtime-snapshot.json \
            --event-name runtime_snapshot \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --head-sha "$HEAD_SHA" \
            --output runtime-event.json

      - name: Publish verified events
        if: github.event_name != 'issue_comment' || steps.normalize.outputs.event_count != '0'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("runtime-event.json").read_text(encoding="utf-8"))
          events = payload.get("events", [])
          batch_dir = Path("event-batches")
          batch_dir.mkdir(exist_ok=True)
          for offset in range(0, len(events), 100):
              batch = {"events": events[offset:offset + 100]}
              (batch_dir / ("batch-" + str(offset // 100).zfill(4) + ".json")).write_text(
                  json.dumps(batch, separators=(",", ":")), encoding="utf-8"
              )
          PY
          shopt -s nullglob
          batches=(event-batches/*.json)
          for batch in ${batches[@]}; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              -X POST "https://admin-graph-live.timerloggedout.workers.dev/ingest" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @"$batch" \
              -o /dev/null
          done
