name: Admin Graph Runtime Publisher

on:
  workflow_run:
    types: [requested, in_progress, completed]
  workflow_job:
    types: [queued, in_progress, completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: admin-graph-runtime-publisher-${{ github.event.workflow_run.id || github.event.workflow_job.run_id || 'refresh' }}-${{ github.event.workflow_job.id || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name != 'Admin Graph Runtime Publisher') ||
      (github.event_name == 'workflow_job' && github.event.workflow.name != 'Admin Graph Runtime Publisher')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Mint read-only Actions token
        id: app-token
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3
        with:
          app-id: ${{ vars.TERMUX_FLEET_SWARM_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read

      - name: Normalize lifecycle event
        if: github.event_name != 'schedule'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_FILE: ${{ github.event_path }}
        run: |
          python3 scripts/ops/admin_graph_runtime_event.py \
            --event-file "$EVENT_FILE" --event-name "$EVENT_NAME" \
            --output runtime-event.json

      - name: Publish verified event
        if: github.event_name != 'schedule'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -X POST "https://admin-graph-live.timerloggedout.workers.dev/ingest" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @runtime-event.json \
            -o /dev/null

