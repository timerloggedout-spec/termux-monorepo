name: Continuous agent ops

# 24/7 unattended advancement of open agent PRs.
# High-performance rewrite (OPERATOR 2026-08-10/11):
# - No false "4-day stall" on brand-new / never-commented PRs
# - Self-nudge excluded from loop + approval; SHA sticky-skip
# - checks:read so failing status detection works
# - Display moniker heyVern; live ping only @jules
#
# Complements event-driven agent-review-auto-jules + peer-review-orchestrator.
# Requires: Jules GitHub App. Optional: OPERATOR_GITHUB_TOKEN for privileged comments.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Ignore debounce and re-ping all eligible PRs'
        required: false
        default: 'false'
      max_prs:
        description: 'Max PRs to act on this run'
        required: false
        default: '8'

concurrency:
  group: continuous-agent-ops
  cancel-in-progress: false

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    steps:
      - name: Sweep open PRs and advance stuck work
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
          MAX_PRS: ${{ github.event.inputs.max_prs || '8' }}
          HAS_OPERATOR: ${{ secrets.ARCHWIZ_GITHUB_TOKEN != '' || secrets.OPERATOR_GITHUB_TOKEN != '' || secrets.OPERATOR_TOKEN != '' }}
          PEER_STATE_PUBLISHER_LOGINS: ${{ vars.PEER_STATE_PUBLISHER_LOGINS || github.repository_owner }}
        with:
          github-token: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const forceAll = process.env.FORCE_ALL === 'true';
            const maxPrs = Math.min(Number(process.env.MAX_PRS) || 8, 20);
            const marker = '<!-- continuous-agent-ops -->';
            const debounceMs = 45 * 60 * 1000;
            const stickyDebounceMs = 6 * 60 * 60 * 1000; // sticky reasons: 6h if SHA unchanged
            const staleMs = 2 * 60 * 60 * 1000;
            const stallMs = 4 * 24 * 60 * 60 * 1000;
            const emptyDiffMinAgeMs = 30 * 60 * 1000;

            const agentLogins = [
              'google-labs-jules', 'devin-ai-integration', 'coderabbitai',
              'github-actions', 'copilot', 'gitar-bot', 'blocksorg',
            ];
            const isAgent = (login) => {
              const l = (login || '').toLowerCase();
              return agentLogins.some(a => l.includes(a));
            };
            const isSelfNudge = (c) => c.body && c.body.includes(marker);
            const peerStateMarker = '<!-- agent-peer-response-state:v2 -->';
            const codeRabbitRequestMarker = '<!-- operator-coderabbit-review:v1 -->';
            const publisherLogins = new Set((process.env.PEER_STATE_PUBLISHER_LOGINS || context.repo.owner)
              .split(',').map(value => value.trim().toLowerCase()).filter(Boolean));
            const parseField = (body, name) =>
              (body || '').match(new RegExp(`^${name}:\\s*(.+?)\\s*$`, 'm'))?.[1]?.trim() || '';
            const cooldownRetryAt = (body, updatedAt) => {
              const match = (body || '').match(/next review available in:\s*\*\*(\d+)\s*(minute|minutes|hour|hours)\*\*/i);
              if (!match) return null;
              const multiplier = match[2].toLowerCase().startsWith('hour') ? 60 * 60 * 1000 : 60 * 1000;
              const updated = Date.parse(updatedAt || '');
              return Number.isFinite(updated) ? updated + Number(match[1]) * multiplier : null;
            };

            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'desc',
              per_page: 50,
            });

            const eligible = prs.filter(p => !p.draft && !p.head.repo?.fork);
            core.info(`Open non-draft PRs: ${eligible.length}`);

            let acted = 0;
            const report = [];

            for (const pr of eligible) {
              if (acted >= maxPrs) break;

              let mergeable = pr.mergeable;
              let mergeableState = pr.mergeable_state;
              let changedFiles = pr.changed_files;
              try {
                const { data: fresh } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                mergeable = fresh.mergeable;
                mergeableState = fresh.mergeable_state;
                changedFiles = fresh.changed_files;
              } catch (e) {
                core.info(`PR #${pr.number} get skip: ${e.message}`);
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });

              const peerState = comments.filter(comment =>
                publisherLogins.has((comment.user?.login || '').toLowerCase()) &&
                comment.body?.includes(peerStateMarker) &&
                parseField(comment.body, 'head_sha') === pr.head.sha
              ).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];
              const peerCycleId = parseField(peerState?.body, 'cycle_id');
              const peerStateValue = parseField(peerState?.body, 'state');
              const codeRabbitCooldown = comments.filter(comment =>
                (comment.user?.login || '').toLowerCase() === 'coderabbitai[bot]' &&
                /review limit reached|couldn[’']t start this review|next review available in/i.test(comment.body || '')
              ).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];
              const retryAt = codeRabbitCooldown && cooldownRetryAt(codeRabbitCooldown.body, codeRabbitCooldown.updated_at);
              const retryKey = codeRabbitCooldown ? `${codeRabbitCooldown.id}:${codeRabbitCooldown.updated_at}` : '';
              const retryAlreadyRequested = comments.some(comment =>
                comment.body?.includes(codeRabbitRequestMarker) &&
                comment.body.includes(`cycle_id: ${peerCycleId}`) &&
                comment.body.includes('request_kind: cooldown_retry') &&
                comment.body.includes(`cooldown_source: ${retryKey}`)
              );
              if (process.env.HAS_OPERATOR === 'true' &&
                  peerStateValue === 'provider_cooldown' &&
                  peerCycleId && retryAt && Date.now() >= retryAt && !retryAlreadyRequested) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: [
                    codeRabbitRequestMarker,
                    `cycle_id: ${peerCycleId}`,
                    'request_kind: cooldown_retry',
                    `cooldown_source: ${retryKey}`,
                    'request_actor: OPERATOR',
                    '',
                    '@coderabbitai review',
                    '',
                    'The documented CodeRabbit cooldown has elapsed. This is an OPERATOR-token retrigger for the active SHA; await substantive provider output.',
                  ].join('\\n'),
                });
                acted += 1;
                report.push(`#${pr.number} (CodeRabbit cooldown retry)`);
                core.info(`PR #${pr.number}: OPERATOR retriggered CodeRabbit after cooldown`);
                await new Promise(r => setTimeout(r, 1200));
                continue;
              }
              if (['pending_operator_action', 'action_acknowledged', 'awaiting_provider_response', 'provider_cooldown'].includes(peerStateValue)) {
                core.info(`PR #${pr.number}: waiting on peer contract (${peerStateValue})`);
                continue;
              }

              const lastOps = comments
                .filter(isSelfNudge)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

              // Sticky skip: same head SHA already nudged → long quiet period
              let lastOpsSha = null;
              if (lastOps && lastOps.body) {
                const m = lastOps.body.match(/^sha:\s*([0-9a-f]{7,40})/m);
                if (m) lastOpsSha = m[1];
              }
              if (lastOps && !forceAll) {
                const age = Date.now() - new Date(lastOps.created_at).getTime();
                const sameSha = lastOpsSha && pr.head.sha.startsWith(lastOpsSha);
                const limit = sameSha ? stickyDebounceMs : debounceMs;
                if (age < limit) {
                  core.info(`PR #${pr.number}: debounced (${Math.round(age/60000)}m, sameSha=${!!sameSha})`);
                  continue;
                }
              }

              const agentComments = comments
                .filter(c => isAgent(c.user?.login) && !isSelfNudge(c))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              const lastAgentComment = agentComments[0] || null;
              const lastAgentAge = lastAgentComment
                ? Date.now() - new Date(lastAgentComment.created_at).getTime()
                : null;

              let statusFailed = false;
              let failCount = 0;
              try {
                const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: pr.head.sha,
                  per_page: 50,
                });
                // Prefer latest run per check name
                const byName = new Map();
                for (const c of (checkRuns || [])) {
                  const prev = byName.get(c.name);
                  if (!prev || new Date(c.completed_at || c.started_at || 0) > new Date(prev.completed_at || prev.started_at || 0)) {
                    byName.set(c.name, c);
                  }
                }
                const latest = [...byName.values()].filter(c => c.status === 'completed');
                // Do NOT treat cancelled as failure (concurrency cancel-in-progress is normal)
                const failed = latest.filter(c =>
                  ['failure', 'timed_out', 'action_required'].includes(c.conclusion)
                );
                if (failed.length > 0) {
                  statusFailed = true;
                  failCount = failed.length;
                }
              } catch (e) {
                core.info(`PR #${pr.number} checks skip: ${e.message}`);
              }

              let requestingApproval = false;
              const approvalRegex = /\b(requesting approval|waiting for approval|please approve|requires approval)\b/i;
              if (lastAgentComment && lastAgentComment.body && approvalRegex.test(lastAgentComment.body)) {
                requestingApproval = true;
              }

              let loopDetected = false;
              if (agentComments.length >= 3) {
                let lastCommitTime = null;
                try {
                  const { data: headCommit } = await github.rest.repos.getCommit({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: pr.head.sha,
                  });
                  lastCommitTime = new Date(
                    headCommit.commit.committer?.date || headCommit.commit.author?.date || 0
                  ).getTime();
                } catch (e) {
                  core.info(`PR #${pr.number} getCommit skip: ${e.message}`);
                }

                if (lastCommitTime != null && lastCommitTime > 0) {
                  const newestAgent = agentComments[0].user?.login;
                  let consecutive = 0;
                  for (const c of agentComments) {
                    if (c.user?.login === newestAgent &&
                        new Date(c.created_at).getTime() > lastCommitTime) {
                      consecutive += 1;
                    } else {
                      break;
                    }
                  }
                  if (consecutive >= 3) loopDetected = true;
                }
              }

              const prAgeMs = Date.now() - new Date(pr.created_at).getTime();
              const emptyDiff = (changedFiles === 0) && prAgeMs > emptyDiffMinAgeMs;

              let openThreads = 0;
              try {
                const q = `
                  query($owner:String!, $repo:String!, $number:Int!) {
                    repository(owner:$owner, name:$repo) {
                      pullRequest(number:$number) {
                        reviewThreads(first: 50) {
                          nodes { isResolved }
                        }
                      }
                    }
                  }`;
                const result = await github.graphql(q, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: pr.number,
                });
                const nodes = result?.repository?.pullRequest?.reviewThreads?.nodes || [];
                openThreads = nodes.filter(n => !n.isResolved).length;
              } catch (e) {
                core.info(`PR #${pr.number} threads skip: ${e.message}`);
              }

              const dirty = mergeableState === 'dirty' || mergeable === false;
              const blocked = mergeableState === 'blocked' || mergeableState === 'unstable';
              const stale = lastAgentAge != null && lastAgentAge > staleMs;
              const stale4Days = lastAgentAge != null && lastAgentAge > stallMs;

              const needsWork = dirty ||
                                (blocked && openThreads > 0) ||
                                (stale && openThreads > 0) ||
                                stale4Days ||
                                statusFailed ||
                                requestingApproval ||
                                loopDetected ||
                                emptyDiff ||
                                forceAll;

              if (!needsWork) {
                core.info(`PR #${pr.number}: clean enough (state=${mergeableState} threads=${openThreads})`);
                continue;
              }

              const reasons = [];
              if (dirty) reasons.push('merge conflict / dirty vs base');
              if (blocked && openThreads > 0) reasons.push(`${openThreads} unresolved review thread(s)`);
              if (stale) reasons.push(`stale agent activity (${Math.round(lastAgentAge/3600000)}h)`);
              if (stale4Days) reasons.push('4-day stall (BUG #159 — inactive after prior agent activity)');
              if (statusFailed) reasons.push(`status checks failing (${failCount})`);
              if (requestingApproval) reasons.push('agent requesting approval');
              if (loopDetected) reasons.push('loop (consecutive agent comments without commits)');
              if (emptyDiff) reasons.push('empty diff (0 changed files, age>30m)');
              if (forceAll) reasons.push('forced sweep');

              const instructions = [];
              if (dirty) instructions.push('- Rebase/merge base into head; resolve conflicts; push.');
              if (openThreads > 0) {
                instructions.push('- Address **all open review threads** (CodeRabbit, Devin, Copilot).');
                instructions.push('- Prefer minimal diffs; preserve Sentinel 0o600/0o700.');
              }
              if (stale4Days) instructions.push('- **4-day stall (#159):** revive with concrete next step or close if superseded.');
              if (statusFailed) instructions.push('- **Checks failed:** fix or comment context if transient.');
              if (requestingApproval) instructions.push('- **Approval path:** ready for human/OPERATOR, or continue with explicit steering.');
              if (loopDetected) instructions.push('- **Loop break:** change approach or files; stop identical comment cycles.');
              if (emptyDiff) instructions.push('- **Empty diff:** commit and push real changes.');
              instructions.push('- Push to existing head branch. No Class 3/4 artifacts.');

              // Display moniker only — live trigger is @jules (do not @heyVern real users)
              const body = [
                marker,
                `sha: ${pr.head.sha}`,
                `state: ${mergeableState}`,
                `threads_open: ${openThreads}`,
                '',
                `@jules **opsSweep** (heyVern lane) — high-perf unattended advance.`,
                '',
                `PR #${pr.number} · \`${pr.head.ref}\` → \`${pr.base.ref}\``,
                `**Why:** ${reasons.join('; ')}`,
                '',
                '### Instructions',
                ...instructions,
                '',
                'Monikers: docs/ops/AGENT-MONIKERS.md · Read AGENTS.md.',
                'Agent: Grok (archW1z) orchestration · https://x.com/grok',
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });

              acted += 1;
              report.push(`#${pr.number} (${reasons.join(', ')})`);
              core.info(`PR #${pr.number}: nudged — ${reasons.join('; ')}`);
              await new Promise(r => setTimeout(r, 1200));
            }

            core.summary
              .addHeading('Continuous agent ops (high-perf)')
              .addRaw(`Acted on **${acted}** PR(s).`)
              .addList(report.length ? report : ['(none eligible)'])
              .write();

            core.setOutput('acted', String(acted));
