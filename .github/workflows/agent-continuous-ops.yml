name: Continuous agent ops

# 24/7 unattended advancement of open agent PRs.
# High-performance rewrite (OPERATOR 2026-08-10):
# - No false "4-day stall" on brand-new / never-commented PRs
# - Self-nudge comments excluded from loop + approval detectors
# - checks:read so failing status detection actually works
# - Prefer @heyVern moniker (Jules still accepts @jules)
#
# Complements event-driven agent-review-auto-jules + peer-review-orchestrator.
# Requires: Jules GitHub App. Optional: OPERATOR_GITHUB_TOKEN for privileged comments.

on:
  schedule:
    # Hourly — high-performance lag clearance (was every 2h)
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Ignore debounce and re-ping all eligible PRs'
        required: false
        default: 'false'
      max_prs:
        description: 'Max PRs to act on this run'
        required: false
        default: '8'

concurrency:
  group: continuous-agent-ops
  cancel-in-progress: false

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    steps:
      - name: Sweep open PRs and advance stuck work
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
          MAX_PRS: ${{ github.event.inputs.max_prs || '8' }}
          HAS_OPERATOR: ${{ secrets.OPERATOR_GITHUB_TOKEN != '' || secrets.OPERATOR_TOKEN != '' }}
        with:
          github-token: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const forceAll = process.env.FORCE_ALL === 'true';
            const maxPrs = Math.min(Number(process.env.MAX_PRS) || 8, 20);
            const marker = '<!-- continuous-agent-ops -->';
            const debounceMs = 45 * 60 * 1000; // 45 min — high-perf
            const staleMs = 2 * 60 * 60 * 1000; // 2h without real agent activity
            const stallMs = 4 * 24 * 60 * 60 * 1000; // 4 days true stall (BUG #159)

            const agentLogins = [
              'google-labs-jules', 'devin-ai-integration', 'coderabbitai',
              'copilot', 'gitar-bot', 'blocksorg',
              // deliberately omit pure github-actions so our own nudges
              // are not treated as "agent progress"
            ];
            const isAgent = (login) => {
              const l = (login || '').toLowerCase();
              return agentLogins.some(a => l.includes(a));
            };
            const isSelfNudge = (c) => c.body && c.body.includes(marker);

            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'desc',
              per_page: 50,
            });

            const eligible = prs.filter(p => !p.draft && !p.head.repo?.fork);
            core.info(`Open non-draft PRs: ${eligible.length}`);

            let acted = 0;
            const report = [];

            for (const pr of eligible) {
              if (acted >= maxPrs) break;

              let mergeable = pr.mergeable;
              let mergeableState = pr.mergeable_state;
              let changedFiles = pr.changed_files;
              try {
                const { data: fresh } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                mergeable = fresh.mergeable;
                mergeableState = fresh.mergeable_state;
                changedFiles = fresh.changed_files;
              } catch (e) {
                core.info(`PR #${pr.number} get skip: ${e.message}`);
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });

              // Debounce on our own marker only
              const lastOps = comments
                .filter(isSelfNudge)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              if (lastOps && !forceAll) {
                const age = Date.now() - new Date(lastOps.created_at).getTime();
                if (age < debounceMs) {
                  core.info(`PR #${pr.number}: debounced (${Math.round(age/60000)}m ago)`);
                  continue;
                }
              }

              // Real agent comments only (exclude continuous-ops self)
              const agentComments = comments
                .filter(c => isAgent(c.user?.login) && !isSelfNudge(c))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              const lastAgentComment = agentComments[0] || null;
              // CRITICAL FIX: never treat missing agent activity as Infinity age
              // (that caused brand-new PRs to be labeled "4 days inactive")
              const lastAgentAge = lastAgentComment
                ? Date.now() - new Date(lastAgentComment.created_at).getTime()
                : null;

              // Failing checks (needs checks:read)
              let statusFailed = false;
              let failCount = 0;
              try {
                const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: pr.head.sha,
                  per_page: 50,
                });
                const completed = (checkRuns || []).filter(c => c.status === 'completed');
                const failed = completed.filter(c =>
                  ['failure', 'timed_out', 'cancelled', 'action_required'].includes(c.conclusion)
                );
                if (failed.length > 0) {
                  statusFailed = true;
                  failCount = failed.length;
                }
              } catch (e) {
                core.info(`PR #${pr.number} checks skip: ${e.message}`);
              }

              // Approval request — only on non-self agent comments
              let requestingApproval = false;
              const approvalRegex = /\b(requesting approval|waiting for approval|please approve|requires approval)\b/i;
              if (lastAgentComment && lastAgentComment.body && approvalRegex.test(lastAgentComment.body)) {
                requestingApproval = true;
              }

              // Loop detection — consecutive same agent after last commit, excluding self
              let loopDetected = false;
              if (agentComments.length >= 3) {
                let lastCommitTime = null;
                try {
                  const prCommits = await github.paginate(github.rest.pulls.listCommits, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    per_page: 30,
                  });
                  if (prCommits.length > 0) {
                    // Prefer newest by list order (API returns chronological)
                    const newest = prCommits[prCommits.length - 1];
                    lastCommitTime = new Date(
                      newest.commit.committer?.date || newest.commit.author?.date || 0
                    ).getTime();
                  }
                } catch (e) {
                  core.info(`PR #${pr.number} listCommits skip: ${e.message}`);
                }

                if (lastCommitTime != null && lastCommitTime > 0) {
                  const newestAgent = agentComments[0].user?.login;
                  let consecutive = 0;
                  for (const c of agentComments) {
                    if (c.user?.login === newestAgent &&
                        new Date(c.created_at).getTime() > lastCommitTime) {
                      consecutive += 1;
                    } else {
                      break;
                    }
                  }
                  if (consecutive >= 3) loopDetected = true;
                }
              }

              const emptyDiff = (changedFiles === 0);

              let openThreads = 0;
              try {
                const q = `
                  query($owner:String!, $repo:String!, $number:Int!) {
                    repository(owner:$owner, name:$repo) {
                      pullRequest(number:$number) {
                        reviewThreads(first: 50) {
                          nodes { isResolved }
                        }
                      }
                    }
                  }`;
                const result = await github.graphql(q, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: pr.number,
                });
                const nodes = result?.repository?.pullRequest?.reviewThreads?.nodes || [];
                openThreads = nodes.filter(n => !n.isResolved).length;
              } catch (e) {
                core.info(`PR #${pr.number} threads skip: ${e.message}`);
              }

              const dirty = mergeableState === 'dirty' || mergeable === false;
              const blocked = mergeableState === 'blocked' || mergeableState === 'unstable';
              const stale = lastAgentAge != null && lastAgentAge > staleMs;
              // FIX: only true stall when we HAVE observed agent activity that went quiet for 4d
              const stale4Days = lastAgentAge != null && lastAgentAge > stallMs;

              const needsWork = dirty ||
                                (blocked && openThreads > 0) ||
                                (stale && openThreads > 0) ||
                                stale4Days ||
                                statusFailed ||
                                requestingApproval ||
                                loopDetected ||
                                emptyDiff ||
                                forceAll;

              if (!needsWork) {
                core.info(`PR #${pr.number}: clean enough (state=${mergeableState} threads=${openThreads})`);
                continue;
              }

              const reasons = [];
              if (dirty) reasons.push('merge conflict / dirty vs base');
              if (blocked && openThreads > 0) reasons.push(`${openThreads} unresolved review thread(s)`);
              if (stale) reasons.push(`stale agent activity (${Math.round(lastAgentAge/3600000)}h)`);
              if (stale4Days) reasons.push('4-day stall (BUG #159 — inactive after prior agent activity)');
              if (statusFailed) reasons.push(`status checks failing (${failCount})`);
              if (requestingApproval) reasons.push('agent requesting approval');
              if (loopDetected) reasons.push('loop (consecutive agent comments without commits)');
              if (emptyDiff) reasons.push('empty diff (0 changed files)');
              if (forceAll) reasons.push('forced sweep');

              const instructions = [];
              if (dirty) {
                instructions.push('- Rebase/merge base into head; resolve conflicts; push.');
              }
              if (openThreads > 0) {
                instructions.push('- Address **all open review threads** (CodeRabbit, Devin, Copilot).');
                instructions.push('- Prefer minimal diffs; preserve Sentinel 0o600/0o700.');
              }
              if (stale4Days) {
                instructions.push('- **4-day stall (#159):** revive with concrete next step or close if superseded.');
              }
              if (statusFailed) {
                instructions.push('- **Checks failed:** fix or comment context if transient.');
              }
              if (requestingApproval) {
                instructions.push('- **Approval path:** ready for human/OPERATOR, or continue with explicit steering.');
              }
              if (loopDetected) {
                instructions.push('- **Loop break:** change approach or files; stop identical comment cycles.');
              }
              if (emptyDiff) {
                instructions.push('- **Empty diff:** commit and push real changes.');
              }
              instructions.push('- Push to existing head branch. No Class 3/4 artifacts.');

              const body = [
                marker,
                `sha: ${pr.head.sha}`,
                `state: ${mergeableState}`,
                `threads_open: ${openThreads}`,
                '',
                `@heyVern @jules **@opsSweep** continuous-ops — high-perf unattended advance.`,
                '',
                `PR #${pr.number} · \`${pr.head.ref}\` → \`${pr.base.ref}\``,
                `**Why:** ${reasons.join('; ')}`,
                '',
                '### Instructions',
                ...instructions,
                '',
                'Monikers: docs/ops/AGENT-MONIKERS.md · Read AGENTS.md.',
                'Agent: Grok (@archW1z) orchestration · https://x.com/grok',
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });

              acted += 1;
              report.push(`#${pr.number} (${reasons.join(', ')})`);
              core.info(`PR #${pr.number}: nudged — ${reasons.join('; ')}`);
              await new Promise(r => setTimeout(r, 1200));
            }

            core.summary
              .addHeading('Continuous agent ops (high-perf)')
              .addRaw(`Acted on **${acted}** PR(s).`)
              .addList(report.length ? report : ['(none eligible)'])
              .write();

            core.setOutput('acted', String(acted));
