name: Continuous agent ops

# 24/7 unattended advancement of open agent PRs.
# Complements event-driven agent-review-auto-jules + peer-review-orchestrator:
# those fire on bot feedback; this catches PRs that went quiet, got dirty,
# or never received a follow-up after peer-review-ready.
#
# Requires: Jules GitHub App (repo access). Optional: secrets.JULES_API_KEY
# Security: no secrets in prompts; OPERATOR_TOKEN only for comment write if set.

on:
  schedule:
    # Every 2 hours — enough to clear lag without burning review quota
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Ignore debounce and re-ping all eligible PRs'
        required: false
        default: 'false'
      max_prs:
        description: 'Max PRs to act on this run'
        required: false
        default: '8'

concurrency:
  group: continuous-agent-ops
  cancel-in-progress: false

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Sweep open PRs and advance stuck work
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
          MAX_PRS: ${{ github.event.inputs.max_prs || '8' }}
          # Prefer operator token so @jules / @coderabbitai accept write-path comments
          HAS_OPERATOR: ${{ secrets.OPERATOR_GITHUB_TOKEN != '' || secrets.OPERATOR_TOKEN != '' }}
        with:
          github-token: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const forceAll = process.env.FORCE_ALL === 'true';
            const maxPrs = Math.min(Number(process.env.MAX_PRS) || 8, 20);
            const marker = '<!-- continuous-agent-ops -->';
            const debounceMs = 90 * 60 * 1000; // 90 minutes
            const staleMs = 3 * 60 * 60 * 1000; // 3 hours without agent activity

            const agentLogins = [
              'google-labs-jules', 'devin-ai-integration', 'coderabbitai',
              'github-actions', 'copilot', 'gitar-bot', 'blocksorg',
            ];
            const isAgent = (login) => {
              const l = (login || '').toLowerCase();
              return agentLogins.some(a => l.includes(a));
            };

            // List open non-draft PRs (newest activity first)
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'desc',
              per_page: 50,
            });

            const eligible = prs.filter(p => !p.draft && !p.head.repo?.fork);
            core.info(`Open non-draft PRs: ${eligible.length}`);

            let acted = 0;
            const report = [];

            for (const pr of eligible) {
              if (acted >= maxPrs) break;

              // Fresh mergeability
              let mergeable = pr.mergeable;
              let mergeableState = pr.mergeable_state;
              let changedFiles = pr.changed_files;
              try {
                const { data: fresh } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                mergeable = fresh.mergeable;
                mergeableState = fresh.mergeable_state;
                changedFiles = fresh.changed_files;
              } catch (e) {
                core.info(`PR #${pr.number} get skip: ${e.message}`);
              }

              // Comments for debounce + last agent activity
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });

              const lastOps = comments
                .filter(c => c.body && c.body.includes(marker))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              if (lastOps && !forceAll) {
                const age = Date.now() - new Date(lastOps.created_at).getTime();
                if (age < debounceMs) {
                  core.info(`PR #${pr.number}: debounced (${Math.round(age/60000)}m ago)`);
                  continue;
                }
              }

              const lastAgentComment = comments
                .filter(c => isAgent(c.user?.login))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              const lastAgentAge = lastAgentComment
                ? Date.now() - new Date(lastAgentComment.created_at).getTime()
                : Infinity;

              // Check if PR status checks failed
              let statusFailed = false;
              let failCount = 0;
              try {
                const { data: checks } = await github.rest.checks.listForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: pr.head.sha,
                  per_page: 50,
                });
                const completedRuns = (checks.check_runs || []).filter(c => c.status === 'completed');
                const failedRuns = completedRuns.filter(c => c.conclusion === 'failure');
                if (failedRuns.length > 0) {
                  statusFailed = true;
                  failCount = failedRuns.length;
                }
              } catch (e) {
                core.info(`PR #${pr.number} checks status list skip: ${e.message}`);
              }

              // Check if requesting approval
              let requestingApproval = false;
              const approvalRegex = /(requesting approval|waiting for approval|please approve|requires approval|request.*approval)/i;
              if (lastAgentComment && lastAgentComment.body && approvalRegex.test(lastAgentComment.body)) {
                requestingApproval = true;
              }

              // Check for loops
              let loopDetected = false;
              const sortedComments = [...comments].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const newestAgent = sortedComments.length > 0 && isAgent(sortedComments[0].user?.login) ? sortedComments[0].user?.login : null;
              if (newestAgent) {
                let lastCommitTime = 0;
                try {
                  const prCommits = await github.paginate(github.rest.pulls.listCommits, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    per_page: 50,
                  });
                  if (prCommits.length > 0) {
                    const sortedCommits = prCommits.sort((a, b) => new Date(b.commit.committer?.date || b.commit.author?.date || 0) - new Date(a.commit.committer?.date || a.commit.author?.date || 0));
                    lastCommitTime = new Date(sortedCommits[0].commit.committer?.date || sortedCommits[0].commit.author?.date || 0).getTime();
                  }
                } catch (e) {
                  core.info(`PR #${pr.number} listCommits skip: ${e.message}`);
                }

                let consecutiveAgentComments = 0;
                for (const c of sortedComments) {
                  if (c.user?.login === newestAgent) {
                    const commentTime = new Date(c.created_at).getTime();
                    if (commentTime > lastCommitTime) {
                      consecutiveAgentComments += 1;
                    } else {
                      break;
                    }
                  } else {
                    break;
                  }
                }

                const lastThreeAgentComments = sortedComments.filter(c => isAgent(c.user?.login)).slice(0, 3);
                const bodiesAreIdentical = lastThreeAgentComments.length === 3 &&
                  lastThreeAgentComments[0].body === lastThreeAgentComments[1].body &&
                  lastThreeAgentComments[1].body === lastThreeAgentComments[2].body;

                if (consecutiveAgentComments >= 3 || bodiesAreIdentical) {
                  loopDetected = true;
                }
              }

              // Check for empty diff
              const emptyDiff = (changedFiles === 0);

              // Open review threads (unresolved)
              let openThreads = 0;
              try {
                const q = `
                  query($owner:String!, $repo:String!, $number:Int!) {
                    repository(owner:$owner, name:$repo) {
                      pullRequest(number:$number) {
                        reviewThreads(first: 50) {
                          nodes { isResolved }
                        }
                      }
                    }
                  }`;
                const result = await github.graphql(q, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: pr.number,
                });
                const nodes = result?.repository?.pullRequest?.reviewThreads?.nodes || [];
                openThreads = nodes.filter(n => !n.isResolved).length;
              } catch (e) {
                core.info(`PR #${pr.number} threads skip: ${e.message}`);
              }

              const dirty = mergeableState === 'dirty' || mergeable === false;
              const blocked = mergeableState === 'blocked' || mergeableState === 'unstable';
              const stale = lastAgentAge > staleMs;
              const stale4Days = lastAgentAge > 4 * 24 * 60 * 60 * 1000;

              const needsWork = dirty ||
                                (blocked && openThreads > 0) ||
                                (stale && openThreads > 0) ||
                                stale4Days ||
                                statusFailed ||
                                requestingApproval ||
                                loopDetected ||
                                emptyDiff ||
                                forceAll;

              if (!needsWork && !forceAll) {
                core.info(`PR #${pr.number}: clean enough (state=${mergeableState} threads=${openThreads})`);
                continue;
              }

              // Build action prompt
              const reasons = [];
              if (dirty) reasons.push('merge conflict / dirty vs base');
              if (blocked && openThreads > 0) reasons.push(`${openThreads} unresolved review thread(s)`);
              if (stale) reasons.push(`stale agent activity (${Math.round(lastAgentAge/3600000)}h)`);
              if (stale4Days) reasons.push('4 Days Response Failure (inactive for 4+ days)');
              if (statusFailed) reasons.push(`PR status checks failing (${failCount} failure(s))`);
              if (requestingApproval) reasons.push('agent/bot is requesting approval');
              if (loopDetected) reasons.push('loop detected (consecutive duplicate comments or actions without commits)');
              if (emptyDiff) reasons.push('failure to produce any diff (0 changed files)');
              if (forceAll) reasons.push('forced sweep');

              const instructions = [];
              if (dirty) {
                instructions.push('1. Rebase or merge base into head; resolve conflicts; push.');
                instructions.push('2. Prefer content-preserving resolution; cite Implements: if board item applies.');
              }
              if (openThreads > 0) {
                instructions.push(`${dirty ? '3' : '1'}. Address **all open review threads** (CodeRabbit, Devin, Copilot).`);
                instructions.push(`${dirty ? '4' : '2'}. Prefer minimal diffs; preserve Sentinel 0o600/0o700.`);
              }
              if (stale4Days) {
                instructions.push('**Stall Warning:** This PR has been inactive for more than 4 days. Comment "Continue" or send other relevant context to revive it.');
              }
              if (statusFailed) {
                instructions.push('**Status Failed:** Check status is failed. It can still continue and sometimes it resolved and finishes with a message send as prompt [contextual steering]. Verify build errors, and if transient, comment "Continue" to retry.');
              }
              if (requestingApproval) {
                instructions.push('**Approval Requested:** The agent is requesting approval. Check if ready, and provide approval or "Continue" as prompt steering.');
              }
              if (loopDetected) {
                instructions.push('**Loop Detected:** The agent is stuck in a loop of consecutive duplicate comments/actions. Provide explicit steering context to break the loop, reset, or adjust files.');
              }
              if (emptyDiff) {
                instructions.push('**Empty Diff:** PR has 0 changed files. Ensure you have committed and pushed the correct changes to the branch.');
              }
              instructions.push('Push commits to the existing head branch. Do not retarget base without cause.');
              instructions.push('Skip pure nits only if they conflict with security/gates.');
              instructions.push('If the PR is superseded, close it with a pointer to the replacement.');

              const body = [
                marker,
                `sha: ${pr.head.sha}`,
                `state: ${mergeableState}`,
                `threads_open: ${openThreads}`,
                '',
                `@jules **Continuous ops** (GHA agent-continuous-ops) — unattended advance.`,
                '',
                `PR #${pr.number} · \`${pr.head.ref}\` → \`${pr.base.ref}\``,
                `**Why:** ${reasons.join('; ')}`,
                '',
                '### Instructions',
                ...instructions,
                '',
                'Read AGENTS.md. No Class 3/4 artifacts. No secret leaks.',
                'Agent: Grok orchestration · Profile: https://x.com/grok',
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });

              acted += 1;
              report.push(`#${pr.number} (${reasons.join(', ')})`);
              core.info(`PR #${pr.number}: nudged — ${reasons.join('; ')}`);

              // Brief pause to avoid secondary rate limits
              await new Promise(r => setTimeout(r, 1500));
            }

            core.summary
              .addHeading('Continuous agent ops')
              .addRaw(`Acted on **${acted}** PR(s) this sweep.`)
              .addList(report.length ? report : ['(none eligible)'])
              .write();

            core.setOutput('acted', String(acted));
