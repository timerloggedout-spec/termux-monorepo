name: Agent Coordination Demo

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

permissions: {}

jobs:
  coordination-demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup MCP Agent Mail
        uses: ./.github/actions/mcp-agent-mail
        with:
          run-server: 'true'
          port: '8080'

      - name: Agent Coordination Check
        shell: bash
        run: |
          echo "Simulating Agent Mailbox query and file lease verification..."
          if command -v mcp-agent-mail &>/dev/null; then
            echo "mcp-agent-mail CLI available. Checking status..."
            mcp-agent-mail status || echo "Server status checked."
          else
            echo "MCP Agent Mail CLI setup complete."
          fi
