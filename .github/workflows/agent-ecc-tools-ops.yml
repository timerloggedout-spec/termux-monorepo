name: ECC Tools demand-driven ops

# SCOPE: ECC Tools App only (/ecc-tools …).
# Does NOT post @coderabbitai, @jules, or other app commands.
# continuous-ops owns CodeRabbit; jules workflows own @jules; operator token lanes stay separate.
#
# Actions posts lean /ecc-tools comments; ECC Tools GitHub App executes.
# Dual-gate remains merge authority. Never auto-merge App PRs.
#
# Surfaces: PR path audit | authorized issue commands | PR operator | ECC bot acknowledgement.
# No fixed cron, time debounce, or manual workflow dispatch; demand is event/SHA-bound.
# Outbound commands require repository variable ECC_TOOLS_APP_ENABLED=true.
# Unset/false keeps the integration quiet while the hosted App is suspended.
# Token policy: marker + command(s) + one meta line; batch multi-cmd into one comment.
# Saturated conversations (≥2500 comments): overflow to ONE thin tracking issue (idempotent — never duplicate).

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - '.hermes/**'
      - '.pi/**'
      - '**/hooks/**'
      - '**/mcp/**'
      - '**/skills/**'
      - '**/SKILL.md'
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '.github/ecc-tools.yml'
      - '.github/ecc-tools.yaml'

concurrency:
  group: ecc-tools-ops-${{ github.event.pull_request.number || github.event.issue.number || github.event.comment.id || github.run_id }}
  cancel-in-progress: false

permissions: {}

env:
  HARNESS_PATH_RE: '(^|/)(\.claude|\.codex|\.agents|\.hermes|\.pi)(/|$)|(^|/)(hooks|mcp|skills)(/|$)|SKILL\.md$|AGENTS\.md$|CLAUDE\.md$|ecc-tools\.ya?ml$'
  ECC_OPS_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  pr-harness-audit:
    if: |
      vars.ECC_TOOLS_APP_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Lean /ecc-tools audit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ env.ECC_OPS_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            // Content-addressed idempotency: a new head SHA is eligible
            // immediately; duplicate webhook deliveries for the same SHA are no-ops.
            const marker = `<!-- ecc-tools-ops:audit:${pr.head.sha} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr.number, per_page: 100,
            });
            if (comments.some(c => (c.body || '').includes(marker))) {
              core.info(`#${pr.number} already audited at ${pr.head.sha.slice(0, 12)}`); return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: pr.number, per_page: 100,
            });
            const re = new RegExp(process.env.HARNESS_PATH_RE || '', 'i');
            const hits = files.filter(f => re.test(f.filename));
            if (!hits.length) { core.info(`#${pr.number} no harness files`); return; }
            const body = [
              marker,
              '/ecc-tools audit',
              `<!-- meta:gha ecc-ops lane=pr-path pr=${pr.number} n=${hits.length} -->`,
            ].join('\n');
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, body,
              });
            } catch (err) {
              const saturated = err?.status === 403 && /2500 comments|Commenting is disabled/i.test(String(err.message || err));
              if (!saturated) throw err;
              core.warning(`#${pr.number} saturated — overflow tracking issue`);
              // Idempotent: reuse existing open overflow if present
              let existing = null;
              try {
                const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:ecc-tools "ecc-tools ops: PR #${pr.number}"`;
                const { data } = await github.rest.search.issuesAndPullRequests({ q, per_page: 5 });
                const hits = (data.items || []).filter(i => !i.pull_request && (i.title || '').includes(`PR #${pr.number}`));
                if (hits.length) {
                  hits.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                  existing = hits[0];
                }
              } catch (_) {}
              if (existing) {
                core.info(`#${pr.number} already has overflow #${existing.number} — reusing`);
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: existing.number, body,
                  });
                } catch (_) {}
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: `ecc-tools ops: PR #${pr.number} /audit`,
                  body: [
                    `Overflow for **PR #${pr.number}** (conversation ≥2500 comments).`,
                    '', body, '',
                    `Parent: https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pr.number}`,
                  ].join('\n'),
                  labels: ['ecc-tools'],
                });
              }
            }

  issue-commands:
    if: |
      vars.ECC_TOOLS_APP_ENABLED == 'true' &&
      ((github.event_name == 'issues' && github.event.action == 'labeled' &&
        github.event.sender.type == 'User' &&
        (github.event.label.name == 'ecc-tools' || github.event.label.name == 'ecc' || github.event.label.name == 'ECC')) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
        github.event.sender.type == 'User' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (startsWith(github.event.comment.body, '/ecc-tools-ops') || startsWith(github.event.comment.body, '/ecc ops') ||
         contains(github.event.comment.body, '<!-- request-ecc-tools-ops -->'))))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
    steps:
      - name: Resolve authorized issue request and post one lean command batch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ env.ECC_OPS_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const isLabelEvent = context.eventName === 'issues';
            const comment = context.payload.comment;
            const requestId = isLabelEvent
              ? `label-${context.payload.label.name.toLowerCase()}`
              : `comment-${comment.id}`;
            const marker = `<!-- ecc-tools-ops:request:${issueNumber}:${requestId} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issueNumber, per_page: 100,
            });
            if (comments.some(c => (c.body || '').includes(marker))) {
              core.info(`#${issueNumber} request ${requestId} already delivered`);
              return;
            }
            let commands = [];
            if (isLabelEvent) {
              commands = ['analyze', 'setup', 'audit'];
            } else {
              const m = (comment.body || '').match(/\/(?:ecc-tools-ops|ecc ops)\s+([\w-]+)/i);
              const requested = m ? m[1].toLowerCase() : 'analyze';
              if (requested === 'full') commands = ['analyze', 'setup', 'audit', 'doctor'];
              else if (['analyze', 'setup', 'audit', 'doctor', 'repair'].includes(requested)) commands = [requested];
              else {
                core.info(`Ignoring unsupported ECC command '${requested}'`);
                return;
              }
            }
            const body = [
              marker,
              ...commands.map(c => `/ecc-tools ${c}`),
              `<!-- meta:gha ecc-ops lane=issue n=${issueNumber} request=${requestId} -->`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issueNumber, body,
            });

  pr-operator-command:
    if: |
      vars.ECC_TOOLS_APP_ENABLED == 'true' &&
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.sender.type == 'User' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/ecc-tools-ops') || startsWith(github.event.comment.body, '/ecc ops') ||
       contains(github.event.comment.body, '<!-- request-ecc-tools-ops -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Lean /ecc-tools on this PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ env.ECC_OPS_TOKEN }}
          script: |
            const prNumber = context.payload.issue.number;
            const bodyIn = context.payload.comment?.body || '';
            const requestId = context.payload.comment.id;
            const marker = `<!-- ecc-tools-ops:pr-request:${requestId} -->`;
            const prior = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prNumber, per_page: 100,
            });
            if (prior.some(c => (c.body || '').includes(marker))) {
              core.info(`PR #${prNumber} request ${requestId} already delivered`);
              return;
            }
            const m = bodyIn.match(/\/(?:ecc-tools-ops|ecc ops)\s+([\w-]+)/i);
            const c = m ? m[1].toLowerCase() : 'audit';
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: context.payload.comment.id, content: 'eyes',
              });
            } catch (_) {}
            if (c.startsWith('cr-') || c === 'jules' || c.includes('coderabbit')) {
              core.notice(`Ignored non-ECC ops token '${c}'`);
              return;
            }
            let lines;
            if (c === 'full') {
              lines = [marker, '<!-- ecc-tools-ops:batch -->', '/ecc-tools analyze', '/ecc-tools setup', '/ecc-tools audit', '/ecc-tools doctor', `<!-- meta:gha ecc-ops lane=pr-op pr=${prNumber} -->`];
            } else {
              const cmd = ['analyze', 'setup', 'audit', 'doctor', 'repair'].includes(c) ? c : 'audit';
              lines = [marker, `<!-- ecc-tools-ops:${cmd} -->`, `/ecc-tools ${cmd}`, `<!-- meta:gha ecc-ops lane=pr-op pr=${prNumber} -->`];
            }
            const body = lines.join('\n');
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, body,
              });
            } catch (err) {
              const saturated = err?.status === 403 && /2500 comments|Commenting is disabled/i.test(String(err.message || err));
              if (!saturated) throw err;
              // Idempotent overflow
              let existing = null;
              try {
                const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:ecc-tools "ecc-tools ops: PR #${prNumber}"`;
                const { data } = await github.rest.search.issuesAndPullRequests({ q, per_page: 5 });
                const hits = (data.items || []).filter(i => !i.pull_request && (i.title || '').includes(`PR #${prNumber}`));
                if (hits.length) {
                  hits.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                  existing = hits[0];
                }
              } catch (_) {}
              if (existing) {
                core.info(`operator: reusing overflow #${existing.number}`);
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: existing.number, body,
                  });
                } catch (_) {}
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: `ecc-tools ops: PR #${prNumber} (operator)`,
                  body: [`Overflow for **PR #${prNumber}**.`, '', body, '', `Parent: https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}`].join('\n'),
                  labels: ['ecc-tools'],
                });
              }
            }

  acknowledge-ecc-pr:
    if: |
      vars.ECC_TOOLS_APP_ENABLED == 'true' &&
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.user.type == 'Bot' &&
      (github.event.comment.user.login == 'ecc-tools[bot]' || contains(github.event.comment.user.login, 'ecc-tools'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Lean ack (ECC scope only)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ env.ECC_OPS_TOKEN }}
          script: |
            const prNumber = context.payload.issue.number;
            const ack = '<!-- ecc-tools-ops-ack -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prNumber, per_page: 50,
            });
            if (comments.some(c => c.body?.includes(ack))) {
              core.info('Already acknowledged');
              return;
            }
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber,
                body: [ack, 'ECC App activity — dual-gate merges; review skills/hooks before merge.', '<!-- meta:gha ecc-ops lane=ack -->'].join('\n'),
              });
            } catch (err) {
              core.warning(`ack #${prNumber}: ${err.message}`);
            }
