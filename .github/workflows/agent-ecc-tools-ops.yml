name: ECC Tools comment-command ops

# SCOPE: ECC Tools App only (/ecc-tools …).
# Does NOT post @coderabbitai, @jules, or other app commands.
# continuous-ops owns CodeRabbit; jules workflows own @jules; operator token lanes stay separate.
#
# Actions posts lean /ecc-tools comments; ECC Tools GitHub App executes.
# Dual-gate remains merge authority. Never auto-merge App PRs.
#
# Surfaces: PR path audit | PR sweep | matrix #175 | any issue | PR operator | ecc-bot ack
# Token policy: marker + command(s) + one meta line; batch multi-cmd into one comment.
# Saturated conversations (≥2500 comments): overflow to a thin tracking issue — never skip the target.

on:
  schedule:
    - cron: '23 6,18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'sweep-prs | issue'
        required: true
        default: 'sweep-prs'
        type: choice
        options: [sweep-prs, issue]
      command:
        description: 'issue mode: ECC Tools command only'
        required: false
        default: 'analyze'
        type: choice
        options: [analyze, setup, audit, doctor, repair, full-cycle]
      issue_number:
        description: 'issue mode target'
        required: false
        default: '175'
      force:
        description: 'Ignore debounce'
        required: false
        default: false
        type: boolean
      max_prs:
        description: 'sweep-prs cap'
        required: false
        default: '10'
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - '.hermes/**'
      - '.pi/**'
      - '**/hooks/**'
      - '**/mcp/**'
      - '**/skills/**'
      - '**/SKILL.md'
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '.github/ecc-tools.yml'
      - '.github/ecc-tools.yaml'

concurrency:
  group: ecc-tools-ops-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.mode || github.run_id }}
  cancel-in-progress: false

permissions: {}

env:
  HARNESS_PATH_RE: '(^|/)(\.claude|\.codex|\.agents|\.hermes|\.pi)(/|$)|(^|/)(hooks|mcp|skills)(/|$)|SKILL\.md$|AGENTS\.md$|CLAUDE\.md$|ecc-tools\.ya?ml$'
  ECC_OPS_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  pr-harness-audit:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Lean /ecc-tools audit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ env.ECC_OPS_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const marker = '<!-- ecc-tools-ops:audit -->';
            const debounceMs = 6 * 60 * 60 * 1000;
            const isOpsAuthor = (c) => {
              const login = (c.user?.login || '').toLowerCase();
              return login === 'github-actions[bot]' || login.includes('ecc-ops') || login.includes('timerloggedout');
            };
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr.number, per_page: 100,
            });
            const prior = comments.filter(c => c.body?.includes(marker) && isOpsAuthor(c))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (prior && Date.now() - new Date(prior.created_at) < debounceMs) {
              core.info(`#${pr.number} debounced`); return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: pr.number, per_page: 100,
            });
            const re = new RegExp(process.env.HARNESS_PATH_RE || '', 'i');
            const hits = files.filter(f => re.test(f.filename));
            if (!hits.length) { core.info(`#${pr.number} no harness files`); return; }
            const body = [
              marker,
              '/ecc-tools audit',
              `<!-- meta:gha ecc-ops lane=pr-path pr=${pr.number} n=${hits.length} -->`,
            ].join('\n');
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, body,
              });
            } catch (err) {
              const saturated = err?.status === 403 && /2500 comments|Commenting is disabled/i.test(String(err.message || err));
              if (!saturated) throw err;
              core.warning(`#${pr.number} saturated — overflow tracking issue`);
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `ecc-tools ops: PR #${pr.number} /audit`,
                body: [
                  `Overflow for **PR #${pr.number}** (conversation ≥2500 comments).`,
                  '', body, '',
                  `Parent: https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pr.number}`,
                ].join('\n'),
                labels: ['ecc-tools'],
              });
            }

  sweep-prs:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'sweep-prs')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Sweep harness PRs (lean /ecc-tools only)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          MAX_PRS: ${{ github.event.inputs.max_prs || '10' }}
        with:
          github-token: ${{ env.ECC_OPS_TOKEN }}
          script: |
            const force = process.env.FORCE === 'true';
            const maxPrs = Math.min(Number(process.env.MAX_PRS) || 10, 20);
            const debounceMs = 12 * 60 * 60 * 1000;
            const re = new RegExp(process.env.HARNESS_PATH_RE || '', 'i');
            const isOpsAuthor = (c) => {
              const login = (c.user?.login || '').toLowerCase();
              return login === 'github-actions[bot]' || login.includes('ecc-ops') || login.includes('timerloggedout');
            };
            const isCommentSaturated = (err) =>
              err?.status === 403 && /2500 comments|Commenting is disabled/i.test(String(err.message || err));
            async function deliverEcc(prNumber, cmd, marker, lane) {
              const body = [
                marker,
                `/ecc-tools ${cmd}`,
                `<!-- meta:gha ecc-ops lane=${lane} pr=${prNumber} -->`,
              ].join('\n');
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: prNumber, body,
                });
                return { channel: 'pr-comment', ref: prNumber };
              } catch (err) {
                if (!isCommentSaturated(err)) throw err;
                core.warning(`#${prNumber} conversation saturated (≥2500 comments) — overflow tracking issue`);
                const { data: issue } = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: `ecc-tools ops: PR #${prNumber} /${cmd}`,
                  body: [
                    `Overflow surface for **PR #${prNumber}** (conversation ≥2500 comments — GitHub blocks further issue comments).`,
                    '',
                    marker,
                    `/ecc-tools ${cmd}`,
                    `<!-- meta:gha ecc-ops lane=${lane}-overflow pr=${prNumber} -->`,
                    '',
                    `Parent: https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}`,
                  ].join('\n'),
                  labels: ['ecc-tools'],
                });
                return { channel: 'overflow-issue', ref: issue.number };
              }
            }
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', sort: 'updated', direction: 'desc', per_page: 50,
            });
            let acted = 0;
            const report = [];
            for (const pr of prs.filter(p => !p.draft && !p.head.repo?.fork)) {
              if (acted >= maxPrs) break;
              let files = [];
              try {
                files = await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner, repo: context.repo.repo,
                  pull_number: pr.number, per_page: 100,
                });
              } catch (e) { continue; }
              const hits = files.filter(f => re.test(f.filename));
              const isEcc = (pr.user?.login || '').toLowerCase().includes('ecc-tools');
              if (!hits.length && !isEcc) continue;
              const cmd = isEcc ? 'doctor' : 'audit';
              const marker = `<!-- ecc-tools-ops:${cmd} -->`;
              let prior = null;
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: pr.number, per_page: 100,
                });
                prior = comments.filter(c => c.body?.includes(marker) && isOpsAuthor(c))
                  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              } catch (_) {}
              if (prior && !force && Date.now() - new Date(prior.created_at) < debounceMs) continue;
              try {
                const delivered = await deliverEcc(pr.number, cmd, marker, 'sweep');
                acted++;
                report.push(`#${pr.number}:${cmd}@${delivered.channel}${delivered.channel === 'overflow-issue' ? '#' + delivered.ref : ''}`);
              } catch (err) {
                core.error(`#${pr.number} deliver failed: ${err.message}`);
                report.push(`#${pr.number}:ERROR`);
              }
              await new Promise(r => setTimeout(r, 800));
            }
            core.summary.addHeading('ecc sweep').addRaw(`acted ${acted}`).addList(report.length ? report : ['none']).write();

  matrix-cycle:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Batch analyze+doctor on #175
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ env.ECC_OPS_TOKEN }}
          script: |
            const issueNumber = 175;
            const marker = '<!-- ecc-tools-ops:full-cycle-lite -->';
            const debounceMs = 12 * 60 * 60 * 1000;
            const isOpsAuthor = (c) => {
              const login = (c.user?.login || '').toLowerCase();
              return login === 'github-actions[bot]' || login.includes('ecc-ops') || login.includes('timerloggedout');
            };
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issueNumber, per_page: 50,
            });
            const prior = comments.filter(c => c.body?.includes(marker) && isOpsAuthor(c))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (prior && Date.now() - new Date(prior.created_at) < debounceMs) {
              core.info('#175 debounced'); return;
            }
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber,
                body: [marker, '/ecc-tools analyze', '/ecc-tools doctor', '<!-- meta:gha ecc-ops lane=matrix -->'].join('\n'),
              });
            } catch (err) {
              core.error(`matrix #175 post failed: ${err.message}`);
            }

  issue-commands:
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'issue') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
        (github.event.label.name == 'ecc-tools' || github.event.label.name == 'ecc' || github.event.label.name == 'ECC')) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
        github.event.sender.type == 'User' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (startsWith(github.event.comment.body, '/ecc-tools-ops') || startsWith(github.event.comment.body, '/ecc ops') ||
         contains(github.event.comment.body, '<!-- request-ecc-tools-ops -->')))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
    steps:
      - name: Resolve + post lean /ecc-tools only (batch when multi)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          INPUT_COMMAND: ${{ github.event.inputs.command || '' }}
          INPUT_ISSUE: ${{ github.event.inputs.issue_number || '' }}
          INPUT_FORCE: ${{ github.event.inputs.force || 'false' }}
        with:
          github-token: ${{ env.ECC_OPS_TOKEN }}
          script: |
            const force = process.env.INPUT_FORCE === 'true';
            const requestedIssue = (process.env.INPUT_ISSUE || '').trim();
            let issueNumber = 175;
            if (context.eventName === 'workflow_dispatch' && requestedIssue) {
              const parsedIssue = Number(requestedIssue);
              if (!/^[1-9]\d*$/.test(requestedIssue) || !Number.isSafeInteger(parsedIssue) || String(parsedIssue) !== requestedIssue) {
                throw new Error('issue_number must be a canonical positive integer');
              }
              issueNumber = parsedIssue;
            }
            if (context.eventName === 'issues' || context.eventName === 'issue_comment') {
              issueNumber = context.payload.issue?.number || issueNumber;
            }
            const inputCmd = (process.env.INPUT_COMMAND || '').trim();
            let commands = [];
            const parseOps = (body) => {
              const m = (body || '').match(/\/(?:ecc-tools-ops|ecc ops)\s+([\w-]+)/i);
              return m ? m[1].toLowerCase() : null;
            };
            if (context.eventName === 'workflow_dispatch') {
              if (inputCmd === 'full-cycle') commands = ['analyze', 'setup', 'audit', 'doctor'];
              else if (['analyze', 'setup', 'audit', 'doctor', 'repair'].includes(inputCmd)) commands = [inputCmd];
              else commands = ['analyze'];
            } else if (context.eventName === 'issues') {
              commands = ['analyze', 'setup', 'audit'];
            } else {
              const c = parseOps(context.payload.comment?.body);
              if (c === 'full') commands = ['analyze', 'setup', 'audit', 'doctor'];
              else if (['analyze', 'setup', 'audit', 'doctor', 'repair'].includes(c)) commands = [c];
              else commands = ['analyze'];
            }
            if (!commands.length) return;
            const isOpsAuthor = (c) => {
              const login = (c.user?.login || '').toLowerCase();
              return login === 'github-actions[bot]' || login.includes('ecc-ops') || login.includes('timerloggedout');
            };
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issueNumber, per_page: 100,
            });
            const debounceMs = 12 * 60 * 60 * 1000;
            const batchMarker = commands.length > 1 ? '<!-- ecc-tools-ops:batch -->' : `<!-- ecc-tools-ops:${commands[0]} -->`;
            const recent = commands.some(cmd => {
              const p = comments.filter(c => isOpsAuthor(c) && (c.body?.includes(`<!-- ecc-tools-ops:${cmd} -->`) || c.body?.includes(batchMarker)))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              return p && !force && Date.now() - new Date(p.created_at) < debounceMs;
            });
            if (recent) { core.info(`#${issueNumber} debounced`); return; }
            const body = [batchMarker, ...commands.map(c => `/ecc-tools ${c}`), `<!-- meta:gha ecc-ops lane=issue n=${issueNumber} -->`].join('\n');
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber, body,
              });
            } catch (err) {
              core.error(`#${issueNumber} post failed: ${err.message}`);
            }

  pr-operator-command:
    if: |
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.sender.type == 'User' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/ecc-tools-ops') || startsWith(github.event.comment.body, '/ecc ops') ||
       contains(github.event.comment.body, '<!-- request-ecc-tools-ops -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Lean /ecc-tools on this PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ env.ECC_OPS_TOKEN }}
          script: |
            const prNumber = context.payload.issue.number;
            const bodyIn = context.payload.comment?.body || '';
            const m = bodyIn.match(/\/(?:ecc-tools-ops|ecc ops)\s+([\w-]+)/i);
            const c = m ? m[1].toLowerCase() : 'audit';
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: context.payload.comment.id, content: 'eyes',
              });
            } catch (_) {}
            if (c.startsWith('cr-') || c === 'jules' || c.includes('coderabbit')) {
              core.notice(`Ignored non-ECC ops token '${c}'`);
              return;
            }
            let lines;
            if (c === 'full') {
              lines = ['<!-- ecc-tools-ops:batch -->', '/ecc-tools analyze', '/ecc-tools setup', '/ecc-tools audit', '/ecc-tools doctor', `<!-- meta:gha ecc-ops lane=pr-op pr=${prNumber} -->`];
            } else {
              const cmd = ['analyze', 'setup', 'audit', 'doctor', 'repair'].includes(c) ? c : 'audit';
              lines = [`<!-- ecc-tools-ops:${cmd} -->`, `/ecc-tools ${cmd}`, `<!-- meta:gha ecc-ops lane=pr-op pr=${prNumber} -->`];
            }
            const body = lines.join('\n');
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, body,
              });
            } catch (err) {
              const saturated = err?.status === 403 && /2500 comments|Commenting is disabled/i.test(String(err.message || err));
              if (!saturated) throw err;
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `ecc-tools ops: PR #${prNumber} (operator)`,
                body: [`Overflow for **PR #${prNumber}**.`, '', body, '', `Parent: https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}`].join('\n'),
                labels: ['ecc-tools'],
              });
            }

  acknowledge-ecc-pr:
    if: |
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.user.type == 'Bot' &&
      (github.event.comment.user.login == 'ecc-tools[bot]' || contains(github.event.comment.user.login, 'ecc-tools'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Lean ack (ECC scope only)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ env.ECC_OPS_TOKEN }}
          script: |
            const prNumber = context.payload.issue.number;
            const ack = '<!-- ecc-tools-ops-ack -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prNumber, per_page: 50,
            });
            if (comments.some(c => c.body?.includes(ack))) {
              core.info('Already acknowledged');
              return;
            }
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber,
                body: [ack, 'ECC App activity — dual-gate merges; review skills/hooks before merge.', '<!-- meta:gha ecc-ops lane=ack -->'].join('\n'),
              });
            } catch (err) {
              core.warning(`ack #${prNumber}: ${err.message}`);
            }
