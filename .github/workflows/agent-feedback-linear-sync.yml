name: Agent feedback → Linear subtasks

# Every CodeRabbit / Devin (and future bot) review comment becomes a Linear
# subtask under a per-PR parent issue, labeled agent-feedback.
# Requires: secrets.LINEAR_API_KEY

on:
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: linear-feedback-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync-linear:
    if: |
      (
        github.event_name == 'pull_request_review_comment' &&
        (
          contains(github.event.comment.user.login, 'coderabbit') ||
          contains(github.event.comment.user.login, 'devin') ||
          contains(github.event.comment.user.login, 'copilot') ||
          github.event.comment.user.type == 'Bot'
        ) &&
        !contains(github.event.comment.body || '', '<!-- agent-auto-jules -->') &&
        !contains(github.event.comment.body || '', '<!-- agent-linear-synced -->')
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.review.state != 'approved' &&
        (
          contains(github.event.review.user.login, 'coderabbit') ||
          contains(github.event.review.user.login, 'devin') ||
          github.event.review.user.type == 'Bot'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Sync to Linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/github-script@v7
        with:
          script: |
            const key = process.env.LINEAR_API_KEY;
            if (!key) {
              core.warning('LINEAR_API_KEY not set — skip Linear subtask sync');
              return;
            }
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const prUrl = pr.html_url;
            const bot =
              context.payload.comment?.user?.login ||
              context.payload.review?.user?.login ||
              'bot';
            const path = context.payload.comment?.path || '';
            const commentBody = (
              context.payload.comment?.body ||
              context.payload.review?.body ||
              ''
            ).slice(0, 3500);
            const commentUrl =
              context.payload.comment?.html_url ||
              context.payload.review?.html_url ||
              prUrl;

            async function linear(query, variables) {
              const res = await fetch('https://api.linear.app/graphql', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Authorization: key,
                },
                body: JSON.stringify({ query, variables }),
              });
              const json = await res.json();
              if (json.errors) {
                throw new Error(JSON.stringify(json.errors));
              }
              return json.data;
            }

            const teamId = '1e672463-31de-40b2-a378-3c03fd8f7e3b';
            const parentTitle = `PR #${prNumber} agent feedback rollup`;

            const search = await linear(
              `query($title: String!) {
                issues(filter: { title: { eq: $title } }) {
                  nodes { id identifier title }
                }
              }`,
              { title: parentTitle }
            );
            let parentId = search.issues?.nodes?.find(
              n => n.title === parentTitle
            )?.id;

            if (!parentId) {
              const created = await linear(
                `mutation($input: IssueCreateInput!) {
                  issueCreate(input: $input) {
                    success
                    issue { id identifier url }
                  }
                }`,
                {
                  input: {
                    teamId,
                    title: parentTitle,
                    description: [
                      '**Agent: Jules | Grok**',
                      '',
                      `Parent rollup for automated review feedback on ${prUrl}`,
                      '',
                      'Subtasks are created by GHA `agent-feedback-linear-sync`.',
                      'Jules auto-resolve via `agent-review-auto-jules`.',
                      '',
                      'Signed-off-by: Grok <grok@x.ai>',
                    ].join('\n'),
                  },
                }
              );
              parentId = created.issueCreate.issue.id;
              core.info(`Created parent ${created.issueCreate.issue.identifier}`);
            }

            const labels = await linear(
              `query { issueLabels(filter: { name: { eq: "agent-feedback" } }) { nodes { id } } }`
            );
            const labelId = labels.issueLabels?.nodes?.[0]?.id;

            const subTitle = path
              ? `[${bot}] PR #${prNumber}: ${path}`
              : `[${bot}] PR #${prNumber}: review feedback`;

            const sub = await linear(
              `mutation($input: IssueCreateInput!) {
                issueCreate(input: $input) {
                  success
                  issue { id identifier url }
                }
              }`,
              {
                input: {
                  teamId,
                  parentId,
                  title: subTitle.slice(0, 200),
                  description: [
                    '**Agent: Jules | Grok**',
                    '',
                    `Source: ${commentUrl}`,
                    `PR: ${prUrl}`,
                    `Bot: ${bot}`,
                    path ? `Path: \`${path}\`` : '',
                    '',
                    '### Comment',
                    commentBody,
                    '',
                    'Auto-synced by agent-feedback-linear-sync.yml',
                  ].filter(Boolean).join('\n'),
                  ...(labelId ? { labelIds: [labelId] } : {}),
                },
              }
            );
            core.info(`Subtask ${sub.issueCreate.issue.identifier} ${sub.issueCreate.issue.url}`);

            if (context.payload.comment?.id) {
              try {
                await github.rest.reactions.createForPullRequestReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content: 'eyes',
                });
              } catch (e) {
                core.info(String(e));
              }
            }
