name: Legacy Google Jules Requests — Retirement Receipt

# Preserve legacy issue labels and @jules mentions as auditable request signals.
# Hosted Google Jules is read-only after 2026-11-11; this workflow records a
# retirement receipt and directs operators to the local DoE role skill bundle.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: jules-retirement-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  retirement-receipt:
    if: |
      (
        github.event_name == 'issues' &&
        github.event.action == 'labeled' &&
        github.event.sender.type == 'User' &&
        contains(fromJSON('["jules", "Jules", "JULES"]'), github.event.label.name)
      ) ||
      (
        github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        github.event.sender.type == 'User' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (startsWith(github.event.comment.body, '@jules') || startsWith(github.event.comment.body, '@Jules'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Record Google Jules retirement receipt
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const eventName = context.eventName;
            if (eventName === 'issues') {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
              });
              if (!new Set(['admin', 'maintain', 'write']).has(data.permission)) {
                core.info(`Label actor ${context.actor} has permission ${data.permission}; receipt skipped.`);
                return;
              }
            } else {
              const allowed = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
              if (!allowed.has(context.payload.comment.author_association)) {
                core.info('Comment author association is outside the trusted collaborator set; receipt skipped.');
                return;
              }
            }

            const issue = context.payload.issue.number;
            const marker = '<!-- google-jules-retirement-receipt -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              per_page: 100,
            });
            if (comments.some(comment => comment.body?.includes(marker))) return;

            const requestSource = eventName === 'issues'
              ? `label:${context.payload.label.name}`
              : 'mention:@jules';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: [
                marker,
                '**Google Jules hosted execution is retired.** Google set Jules to read-only after 2026-11-11 and plans to wind it down on 2026-12-31.',
                'Use `.agents/skills/jules-doe-role-adapter/SKILL.md` for local role guidance and `docs/ops/DOE-ROLES-EPOCH-2026-11-03.md` for canonical role bindings.',
                'Live execution follows `docs/schemas/agent-roster.yaml` and requires a verified provider adapter.',
                `Request source: ${requestSource}`,
                `Tracking: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
