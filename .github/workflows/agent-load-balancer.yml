name: '⚖️ Agent Load Balancer'

# Capacity-aware dispatch router for all free-tier AI agents.
# Routes review / triage / invoke tasks to the agent with the most headroom,
# falling back gracefully when quotas are exhausted.
#
# Agent capacity model (free-tier, conservative):
#   Gemini:  20 req/day,  1 concurrent  (quota-gate throttles to 18)
#   Jules:   15/day,      3 concurrent  (sessions span multiple PR revisions)
#   CodeRabbit: unlimited per-PR (always available as fallback)
#   Devin:   on-demand (invoked via @devin mentions)
#   Copilot: on-demand (invoked via @copilot mentions)
#
# Implements: agent-quota-loadbalancer QL-04

on:
  workflow_call:
    inputs:
      command:
        description: 'review | triage | invoke'
        type: string
        required: true
      pr_number:
        type: string
        required: false
        default: ''
      issue_number:
        type: string
        required: false
        default: ''
      additional_context:
        type: string
        required: false
        default: ''
      prior_prs:
        type: string
        required: false
        default: 'none'

defaults:
  run:
    shell: bash

jobs:
  # ── Capacity probe ─────────────────────────────────────────────
  # Check Gemini quota availability before dispatching.
  # Jules and CodeRabbit are always considered available (their own
  # platforms handle throttling internally).
  probe-capacity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    outputs:
      gemini_available: ${{ steps.gemini-probe.outputs.available }}
      gemini_remaining: ${{ steps.gemini-probe.outputs.remaining }}
      recommended_agent: ${{ steps.route.outputs.agent }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Probe Gemini quota
        id: gemini-probe
        uses: ./.github/actions/gemini-quota-gate
        with:
          daily-limit: '18'
          pr-number: ''
          command: 'probe'
          has-backup-key: ${{ secrets.GEMINI_API_KEY_BACKUP != '' }}
        continue-on-error: true

      - name: Route to best available agent
        id: route
        uses: actions/github-script@v7
        env:
          GEMINI_AVAILABLE: ${{ steps.gemini-probe.outputs.skip != 'true' }}
          GEMINI_REMAINING: ${{ steps.gemini-probe.outputs.remaining || '0' }}
          COMMAND: ${{ inputs.command }}
        with:
          script: |
            const geminiAvailable = process.env.GEMINI_AVAILABLE === 'true';
            const geminiRemaining = Number(process.env.GEMINI_REMAINING || '0');
            const command = process.env.COMMAND || 'review';

            // Capacity priority for each command type:
            //   review:    Gemini (if available) → CodeRabbit (always) → human ping
            //   triage:    Gemini (if available) → Jules label → human ping
            //   invoke:    Gemini (if available) → Jules → human ping
            let agent, reason;

            if (command === 'review') {
              if (geminiAvailable && geminiRemaining > 2) {
                agent = 'gemini';
                reason = `Gemini has ${geminiRemaining} quota remaining — primary reviewer`;
              } else if (geminiAvailable) {
                agent = 'coderabbit';
                reason = `Gemini low (${geminiRemaining} left) — CodeRabbit is primary, Gemini assists`;
              } else {
                agent = 'coderabbit';
                reason = 'Gemini quota exhausted — CodeRabbit is sole reviewer (always available)';
              }
            } else if (command === 'triage') {
              if (geminiAvailable && geminiRemaining > 2) {
                agent = 'gemini';
                reason = `Gemini has ${geminiRemaining} quota remaining — primary triage`;
              } else {
                agent = 'jules-label';
                reason = 'Gemini quota exhausted — routing triage to Jules (label + @jules ping)';
              }
            } else {
              if (geminiAvailable) {
                agent = 'gemini';
                reason = `Gemini available (${geminiRemaining} remaining) — on-demand invoke`;
              } else {
                agent = 'jules';
                reason = 'Gemini quota exhausted — routing invoke to Jules';
              }
            }

            core.setOutput('agent', agent);
            core.setOutput('reason', reason);
            core.info(`Load balancer: ${agent} — ${reason}`);

      - name: Post routing decision
        if: inputs.pr_number != '' || inputs.issue_number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          AGENT: ${{ steps.route.outputs.agent }}
          REASON: ${{ steps.route.outputs.reason }}
          GEMINI_REMAINING: ${{ steps.gemini-probe.outputs.remaining || '0' }}
        with:
          script: |
            const num = Number(process.env.PR_NUMBER || process.env.ISSUE_NUMBER);
            if (!num) return;
            const marker = '<!-- agent-load-balancer -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num,
              per_page: 10,
            });
            // Don't spam — only post if no recent routing comment
            const recent = comments.filter(c => c.body?.includes(marker));
            if (recent.length > 0) {
              const age = Date.now() - new Date(recent[recent.length - 1].created_at).getTime();
              if (age < 5 * 60 * 1000) {
                core.info('Recent load-balancer comment exists — skipping');
                return;
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num,
              body: [
                marker,
                `⚖️ **Agent Load Balancer** routed this to **${process.env.AGENT}**.`,
                '',
                `> ${process.env.REASON}`,
                '',
                `Gemini quota: ${process.env.GEMINI_REMAINING} remaining today (limit 18, resets 00:00 UTC).`,
                `Other agents (CodeRabbit, Jules) continue independently.`,
              ].join('\n'),
            });

  # ── Dispatch to Gemini (if routed) ────────────────────────────
  gemini-dispatch:
    needs: probe-capacity
    if: needs.probe-capacity.outputs.recommended_agent == 'gemini'
    uses: ./.github/workflows/gemini-review.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      additional_context: ${{ inputs.additional_context }}
      prior_prs: ${{ inputs.prior_prs }}
    secrets: inherit

  # ── Fallback: ping Jules for triage/invoke when Gemini is down ─
  jules-fallback:
    needs: probe-capacity
    if: |
      needs.probe-capacity.outputs.recommended_agent == 'jules' ||
      needs.probe-capacity.outputs.recommended_agent == 'jules-label'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Ping Jules as fallback
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMAND: ${{ inputs.command }}
          REASON: ${{ needs.probe-capacity.outputs.reason }}
        with:
          script: |
            const num = Number(process.env.PR_NUMBER || process.env.ISSUE_NUMBER);
            if (!num) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num,
              body: [
                '<!-- agent-load-balancer-jules-fallback -->',
                `@jules **Fallback dispatch** — Gemini quota exhausted.`,
                '',
                `> ${process.env.REASON}`,
                '',
                `Command: ${process.env.COMMAND}`,
                `Please handle this ${process.env.COMMAND} request. CodeRabbit continues to review the PR diff independently.`,
              ].join('\n'),
            });

  # ── CodeRabbit is always available — no action needed ──────────
  # CodeRabbit runs on every PR automatically via its GitHub App.
  # When the load balancer routes to 'coderabbit', no extra dispatch
  # is needed — it's already reviewing.
