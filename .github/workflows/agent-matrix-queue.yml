name: Decision matrix cue & queue

# Proposes matrix updates from proposals / issues / PRs / gap signals.
# Does NOT auto-commit DECISION-MATRIX.md — OPERATOR or Tier-3 path commits scores.
# See docs/ops/MATRIX-QUEUE.md

on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
    inputs:
      tracking_issue:
        description: 'Issue number to post the queue summary on (0 = skip comment)'
        required: false
        default: '61'

concurrency:
  group: agent-matrix-queue
  cancel-in-progress: false

permissions: {}

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Scan and enqueue matrix candidates
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          TRACKING: ${{ github.event.inputs.tracking_issue || '61' }}
        with:
          github-token: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- matrix-queue -->';
            const tracking = Number(process.env.TRACKING) || 0;
            const labels = ['priority', 'production', 'jules'];

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50,
              sort: 'updated',
              direction: 'desc',
            });

            const candidates = [];
            for (const it of issues) {
              const names = (it.labels || []).map(l => (l.name || '').toLowerCase());
              const hit = labels.some(l => names.includes(l));
              if (!hit && !it.pull_request) continue;
              const kind = it.pull_request ? 'PR' : 'ISSUE';
              candidates.push(`- ${kind} #${it.number}: ${it.title}`);
              if (candidates.length >= 25) break;
            }

            const body = [
              marker,
              '## Matrix queue (auto)',
              '',
              'Candidates from open priority/production/jules issues & PRs.',
              '**OPERATOR:** review → update `docs/ops/DECISION-MATRIX.md` via signed commit if scores change.',
              'Delphi / skeptic / critic / 11th-man participation required for P0 band changes.',
              '',
              '### Candidates',
              ...(candidates.length ? candidates : ['- (none)')]),
              '',
              'See `docs/ops/MATRIX-QUEUE.md` · `docs/ops/DELPHI-WEIGHTING.md` · `docs/ops/ROLES-SKEPTIC-CRITIC-11TH.md`',
              'Signed-off-by: Grok (OPERATOR) session-matrix-queue / auto',
            ].join('\n');

            core.summary.addHeading('Matrix queue').addRaw(body).write();

            if (tracking > 0) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracking,
                per_page: 30,
              });
              const recent = comments
                .filter(c => c.body && c.body.includes(marker))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              if (recent) {
                const age = Date.now() - new Date(recent.created_at).getTime();
                if (age < 5 * 60 * 60 * 1000) {
                  core.info('Debounced matrix-queue comment');
                  return;
                }
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracking,
                body,
              });
            }
