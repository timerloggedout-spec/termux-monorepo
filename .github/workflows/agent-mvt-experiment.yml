name: Agent MVT experiment loop

# Immutable baseline/candidate comparison. Every terminal path preserves evidence.
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: 'Candidate branch, tag, or commit SHA to test'
        required: true
        type: string
      baseline_ref:
        description: 'Baseline branch, tag, or commit SHA'
        required: false
        default: 'master'
        type: string
      experiment_id:
        description: 'Stable experiment identifier'
        required: true
        type: string
      suite:
        description: 'Validation suite: smoke, contract, or full'
        required: false
        default: 'smoke'
        type: choice
        options: [smoke, contract, full]
      compare_only:
        description: 'Compare metadata only; do not execute validation'
        required: false
        default: false
        type: boolean

concurrency:
  group: agent-mvt-${{ inputs.experiment_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable refs
        id: refs
        continue-on-error: true
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASELINE_REF"
          candidate_sha="$(git rev-parse 'HEAD^{commit}')"
          baseline_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          merge_base="$(git merge-base "$candidate_sha" "$baseline_sha" || true)"
          test "${#candidate_sha}" -eq 40
          test "${#baseline_sha}" -eq 40
          printf 'candidate_sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"
          printf 'baseline_sha=%s\n' "$baseline_sha" >> "$GITHUB_OUTPUT"
          printf 'merge_base=%s\n' "$merge_base" >> "$GITHUB_OUTPUT"
          git diff --name-status "$baseline_sha" "$candidate_sha" > mvt-path-diff.txt
          {
            echo "## Immutable MVT references"
            echo "- experiment: ` ${{ inputs.experiment_id }} `"
            echo "- candidate SHA: `$candidate_sha`"
            echo "- baseline SHA: `$baseline_sha`"
            echo "- merge base: `${merge_base:-not-related}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare detached baseline worktree
        id: baseline
        if: steps.refs.outcome == 'success'
        continue-on-error: true
        env:
          BASELINE_SHA: ${{ steps.refs.outputs.baseline_sha }}
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/mvt-baseline "$BASELINE_SHA"

      - name: Install validation dependencies
        id: deps
        if: steps.refs.outcome == 'success' && steps.baseline.outcome == 'success' && !inputs.compare_only
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install jsonschema pytest

      - name: Run identical suite on baseline and candidate
        id: validate
        if: steps.refs.outcome == 'success' && steps.baseline.outcome == 'success' && steps.deps.outcome == 'success' && !inputs.compare_only
        continue-on-error: true
        env:
          SUITE: ${{ inputs.suite }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/mvt-logs
          run_suite() {
            case "$SUITE" in
              smoke)
                if [ -x ./scripts/ops/repo-gate.sh ]; then ./scripts/ops/repo-gate.sh || return $?; fi
                if [ -x ./scripts/ops/termux-smoke.sh ]; then ./scripts/ops/termux-smoke.sh || return $?; fi
                python -m compileall -q .
                ;;
              contract)
                local found=0
                for test_file in tests/test_notation_sets.py tests/test_she_recovery_contract.py tests/test_phase_codec.py tests/test_doe_experiment_record.py; do
                  if [ -f "$test_file" ]; then found=1; python -m pytest -q "$test_file" || return $?; fi
                done
                [ "$found" -eq 1 ] || { echo "No contract tests found"; return 2; }
                ;;
              full) python -m pytest -q ;;
              *) echo "Unsupported suite: $SUITE"; return 2 ;;
            esac
          }
          set +e
          (cd /tmp/mvt-baseline && run_suite) > /tmp/mvt-logs/baseline.log 2>&1
          baseline_exit=$?
          (cd "$GITHUB_WORKSPACE" && run_suite) > /tmp/mvt-logs/candidate.log 2>&1
          candidate_exit=$?
          set -e
          echo "baseline_exit=$baseline_exit" >> "$GITHUB_OUTPUT"
          echo "candidate_exit=$candidate_exit" >> "$GITHUB_OUTPUT"
          {
            echo "## Like-for-like validation"
            echo "- suite: `$SUITE`"
            echo "- baseline exit: `$baseline_exit`"
            echo "- candidate exit: `$candidate_exit`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emit and validate canonical experiment evidence
        if: always()
        id: evidence
        env:
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          SUITE: ${{ inputs.suite }}
          COMPARE_ONLY: ${{ inputs.compare_only }}
          CANDIDATE_SHA: ${{ steps.refs.outputs.candidate_sha }}
          BASELINE_SHA: ${{ steps.refs.outputs.baseline_sha }}
          MERGE_BASE: ${{ steps.refs.outputs.merge_base }}
          BASELINE_EXIT: ${{ steps.validate.outputs.baseline_exit }}
          CANDIDATE_EXIT: ${{ steps.validate.outputs.candidate_exit }}
          REFS_OUTCOME: ${{ steps.refs.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          failed_stage=none
          reason=""
          if [ "$REFS_OUTCOME" != success ]; then failed_stage=resolve-refs; reason="Could not resolve both immutable refs"; 
          elif [ "$BASELINE_OUTCOME" != success ]; then failed_stage=prepare-baseline; reason="Could not prepare detached baseline worktree";
          elif [ "$COMPARE_ONLY" != true ] && [ "$DEPS_OUTCOME" != success ]; then failed_stage=install-dependencies; reason="Validation dependencies could not be installed";
          elif [ "$COMPARE_ONLY" != true ] && [ "$VALIDATE_OUTCOME" != success ]; then failed_stage=validation; reason="Validation step did not complete normally";
          fi
          baseline_exit="${BASELINE_EXIT:--1}"
          candidate_exit="${CANDIDATE_EXIT:--1}"
          set +e
          python scripts/doe/experiment_record.py \
            --schema docs/ops/corpus/EXPERIMENT.schema.json \
            --experiment-id "$EXPERIMENT_ID" \
            --baseline-sha "$BASELINE_SHA" --candidate-sha "$CANDIDATE_SHA" \
            --merge-base-sha "$MERGE_BASE" --suite "$SUITE" \
            --baseline-exit "$baseline_exit" --candidate-exit "$candidate_exit" \
            --repository "$REPOSITORY" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --failed-stage "$failed_stage" --failure-reason "$reason" \
            --candidate-ref "$CANDIDATE_REF" --baseline-ref "$BASELINE_REF" \
            ${COMPARE_ONLY:+}
          record_exit=$?
          set -e
          if [ "$record_exit" -ne 0 ]; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p={"evidence_type":"mvt-evidence-emission-failure/v1","experiment_id":os.environ["EXPERIMENT_ID"],"status":"blocked","failed_stage":"canonical-record-validation","reason":"Canonical record builder or schema validation failed","run_id":os.environ["RUN_ID"],"observed_at":datetime.now(timezone.utc).isoformat()}
          json.dump(p,open("mvt-failure.json","w"),indent=2)
          PY
          fi
          if [ "$COMPARE_ONLY" = true ]; then
            # Rebuild in explicit compare-only mode; never label metadata-only as passed.
            python scripts/doe/experiment_record.py --schema docs/ops/corpus/EXPERIMENT.schema.json \
              --experiment-id "$EXPERIMENT_ID" --baseline-sha "$BASELINE_SHA" --candidate-sha "$CANDIDATE_SHA" \
              --merge-base-sha "$MERGE_BASE" --suite "$SUITE" --compare-only \
              --repository "$REPOSITORY" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
          fi
          if [ -f mvt-failure.json ]; then cat mvt-failure.json >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload experiment evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvt-${{ inputs.experiment_id }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            mvt-experiment.json
            mvt-failure.json
            mvt-path-diff.txt
            /tmp/mvt-logs/*.log

      - name: Fail workflow when validation or evidence failed
        if: always()
        env:
          COMPARE_ONLY: ${{ inputs.compare_only }}
          BASELINE_EXIT: ${{ steps.validate.outputs.baseline_exit }}
          CANDIDATE_EXIT: ${{ steps.validate.outputs.candidate_exit }}
          REFS_OUTCOME: ${{ steps.refs.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          RECORD_EXISTS: ${{ steps.evidence.outcome }}
        run: |
          set -euo pipefail
          [ "$REFS_OUTCOME" = success ] || exit 1
          [ "$BASELINE_OUTCOME" = success ] || exit 1
          if [ "$COMPARE_ONLY" != true ]; then
            [ "$DEPS_OUTCOME" = success ] || exit 1
            [ "${BASELINE_EXIT:--1}" = 0 ] || exit 1
            [ "${CANDIDATE_EXIT:--1}" = 0 ] || exit 1
          fi
          [ "$RECORD_EXISTS" = success ] || exit 1
          test -s mvt-experiment.json
