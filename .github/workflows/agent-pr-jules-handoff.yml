name: Agent PR Jules Handoff
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize]
permissions:
  contents: read
  pull-requests: read
  issues: write
jobs:
  handoff:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (
        (github.event.comment.user.type == 'User') ||
        contains(fromJSON('["github-actions[bot]"]'), github.event.comment.user.login)
      ) &&
      (startsWith(github.event.comment.body, '@jules') || startsWith(github.event.comment.body, '@Jules'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const n = context.payload.issue.number, id = context.payload.comment.id;
            const {data: pr} = await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:n});
            const {data: source} = await github.rest.issues.getComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:n,comment_id:id});
            const trustedSource =
              (source.user?.type === 'User' && ['OWNER','MEMBER','COLLABORATOR'].includes(source.author_association)) ||
              (source.user?.login === 'github-actions[bot]' && source.user?.type === 'Bot');
            if (!trustedSource) return;
            if (!/^@jules(?:\s|$)|^@Jules(?:\s|$)/.test(source.body || '')) return;
            const marker = `<!-- agent-pr-jules-handoff:${id} -->`;
            const cs = await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:n,per_page:100});
            if (cs.some(c => c.user?.login === 'github-actions[bot]' && (c.body||'').includes(marker))) return;
            const ref = (pr.head.ref||'head').replace(/[^a-zA-Z0-9-_]/g,'').slice(0,40);
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:n,body:[marker,'## Jules handoff receipt','- state: **DISPATCHED**','- target_agent: **jules**',`- initiated_by: **${source.user?.login||context.actor}**`,`- context_key: \`pr-${n}-${ref}\``,`- branch: \`${pr.head.ref}\``,`- baseline_head_sha: \`${pr.head.sha}\``,`- base_sha: \`${pr.base.sha}\``,`- source_comment_id: \`${id}\``,'','Delegation is not completion. Require a later head mutation, fresh exact-SHA gates, review disposition, and independent verification.'].join('\n')});
  mutation:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr=context.payload.pull_request;
            const cs=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:pr.number,per_page:100});
            const rs=cs.filter(c=>c.user?.login === 'github-actions[bot]' && (c.body||'').includes('## Jules handoff receipt')).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
            if(!rs.length)return;
            const receipt=rs[0];
            const sourceId=receipt.body.match(/source_comment_id: `([^`]+)`/)?.[1]||'';
            if(!sourceId)return;
            const {data:source}=await github.rest.issues.getComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:pr.number,comment_id:Number(sourceId)});
            const trustedSource=
              (source.user?.type === 'User' && ['OWNER','MEMBER','COLLABORATOR'].includes(source.author_association)) ||
              (source.user?.login === 'github-actions[bot]' && source.user?.type === 'Bot');
            if(!trustedSource)return;
            if(!/^@jules(?:\s|$)|^@Jules(?:\s|$)/.test(source.body||''))return;
            const base=receipt.body.match(/baseline_head_sha: `([^`]+)`/)?.[1]||'';
            const initiator=receipt.body.match(/- initiated_by: \*\*([^*]+)\*\*/)?.[1]||source.user?.login||'unknown';
            if(!base||base===pr.head.sha)return;
            const marker=`<!-- agent-pr-jules-mutation:${pr.head.sha} -->`;
            if(cs.some(c=>c.user?.login === 'github-actions[bot]' && (c.body||'').includes(marker)))return;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:pr.number,body:[marker,'## Jules handoff cross-check','- state: **MUTATION_OBSERVED**',`- initiated_by: **${initiator}**`,`- baseline_head_sha: \`${base}\``,`- observed_head_sha: \`${pr.head.sha}\``,`- head_actor: **${pr.user?.login||'unknown'}**`,'','Delegation remains open until fresh exact-SHA gates and independent verification succeed.'].join('\n')});
