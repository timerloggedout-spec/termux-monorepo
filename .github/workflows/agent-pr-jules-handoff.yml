name: Agent PR Jules Handoff
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize]
permissions:
  contents: read
  pull-requests: read
  issues: write
jobs:
  handoff:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.sender.type == 'User' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '@jules') || startsWith(github.event.comment.body, '@Jules'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const n = context.payload.issue.number, id = context.payload.comment.id;
            const {data: pr} = await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:n});
            const marker = `<!-- agent-pr-jules-handoff:${id} -->`;
            const cs = await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:n,per_page:100});
            if (cs.some(c => (c.body||'').includes(marker))) return;
            const ref = (pr.head.ref||'head').replace(/[^a-zA-Z0-9-_]/g,'').slice(0,40);
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:n,body:[marker,'## Jules handoff receipt','- state: **DISPATCHED**','- target_agent: **jules**',`- initiated_by: **${context.actor}**`,`- context_key: \`pr-${n}-${ref}\``,`- branch: \`${pr.head.ref}\``,`- baseline_head_sha: \`${pr.head.sha}\``,`- base_sha: \`${pr.base.sha}\``,`- source_comment_id: \`${id}\``,'','Delegation is not completion. Require a later head mutation, fresh exact-SHA gates, review disposition, and independent verification.'].join('\\n')});
  mutation:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr=context.payload.pull_request;
            const cs=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:pr.number,per_page:100});
            const rs=cs.filter(c=>(c.body||'').includes('## Jules handoff receipt')).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
            if(!rs.length)return;
            const base=rs[0].body.match(/baseline_head_sha: `([^`]+)`/)?.[1]||'';
            if(!base||base===pr.head.sha)return;
            const marker=`<!-- agent-pr-jules-mutation:${pr.head.sha} -->`;
            if(cs.some(c=>(c.body||'').includes(marker)))return;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:pr.number,body:[marker,'## Jules handoff cross-check','- state: **MUTATION_OBSERVED**',`- initiated_by: **${rs[0].user?.login||'unknown'}**`,`- baseline_head_sha: \`${base}\``,`- observed_head_sha: \`${pr.head.sha}\``,`- head_actor: **${pr.user?.login||'unknown'}**`,'','Delegation remains open until fresh exact-SHA gates and independent verification succeed.'].join('\\n')});