name: Legacy Google Jules PR Requests — Retirement Receipt

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: legacy-jules-pr-request-${ github.event.issue.number || github.run_id }
  cancel-in-progress: false

jobs:
  legacy-request-receipt:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '@jules') || startsWith(github.event.comment.body, '@Jules'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Record legacy Jules PR request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const n = context.payload.issue.number;
            const id = context.payload.comment.id;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: n,
            });
            const { data: source } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              comment_id: id,
            });
            const trusted = source.user?.type === 'User' &&
              ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(source.author_association);
            if (!trusted || !/^@jules(?:\s|$)|^@Jules(?:\s|$)/.test(source.body || '')) return;

            const marker = '<!-- jules-retired-pr-request:' + id + ' -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              per_page: 100,
            });
            if (comments.some(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body || '').includes(marker)
            )) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              body: [
                marker,
                '## Legacy Google Jules PR request receipt',
                '- state: LEGACY_REQUEST_RECORDED',
                '- target_provider: Google Jules (read-only after 2026-11-11)',
                '- initiated_by: ' + (source.user?.login || context.actor),
                '- branch: ' + pr.head.ref,
                '- baseline_head_sha: ' + pr.head.sha,
                '- base_sha: ' + pr.base.sha,
                '- source_comment_id: ' + id,
                '- local_role_guidance: .agents/skills/jules-doe-role-adapter/SKILL.md',
                '- role_register: docs/ops/DOE-ROLES-EPOCH-2026-11-03.md',
                '- active_provider_roster: docs/schemas/agent-roster.yaml',
                '',
                'This receipt records the legacy request. Route implementation through the active provider roster and a verified adapter; preserve independent exact-head review before completion.',
              ].join('\n'),
            });
