name: Agent Quality Lane

# Read-only quality control for agent telemetry and TDQS preparation/aggregation.
# This lane validates policy invariants, schemas, diff hygiene, and deterministic
# tests; it does not execute agent prompts or tool payloads.
on:
  pull_request:
    paths:
      - "she/metrics/**"
      - "she/observability/orchestrator_trace.py"
      - "tests/test_orchestrator_trace.py"
      - "tests/test_tdqs.py"
      - "scripts/ci/emit_ates_run_receipt.py"
      - "scripts/ci/bridge_ates_trace_to_events.py"
      - "tests/test_emit_ates_run_receipt.py"
      - "tests/test_bridge_ates_trace_to_events.py"
      - ".github/workflows/ates-phase-b-run-receipt.yml"
      - "tests/test_she_agent_throughput.py"
      - "docs/ops/AGENT-THROUGHPUT-*.md"
      - "docs/ops/AGENT-OBSERVABILITY-PRIORITY-DECISION.md"
      - "docs/ops/AGENT-THROUGHPUT-EVENT.schema.json"
      - "docs/ops/TDQS-EVIDENCE.schema.json"
      - "docs/architecture/TOOL-DEFINITION-QUALITY-SCORE.md"
      - "docs/proposals/active/notation-sets/TDQS.md"
      - "scripts/ci/verify_agent_quality.py"
      - ".github/workflows/agent-quality-lane.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify agent telemetry quality contract
        run: python scripts/ci/verify_agent_quality.py

      - name: Check source diff whitespace hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Markdown hard-breaks intentionally use two trailing spaces. Keep the
          # strict diff check on executable/configuration surfaces instead of
          # mistaking that documentation syntax for source-code whitespace.
          git diff --check "$BASE_SHA" "$HEAD_SHA" -- \
            ':(glob)**/*.py' \
            ':(glob)**/*.yml' \
            ':(glob)**/*.yaml' \
            ':(glob)**/*.json' \
            ':(glob)**/*.toml' \
            ':(glob)**/*.sh'

      - name: Compile telemetry and TDQS Python sources
        run: python -m compileall -q she/metrics scripts/ci tests/test_she_agent_throughput.py tests/test_emit_ates_run_receipt.py tests/test_bridge_ates_trace_to_events.py tests/test_orchestrator_trace.py tests/test_tdqs.py

      - name: Validate event and TDQS evidence schema JSON
        run: |
          python -m json.tool docs/ops/AGENT-THROUGHPUT-EVENT.schema.json >/dev/null
          python -m json.tool docs/ops/TDQS-EVIDENCE.schema.json >/dev/null

      - name: Run focused ATES, trace, and TDQS tests
        run: python -m unittest tests.test_she_agent_throughput tests.test_emit_ates_run_receipt tests.test_bridge_ates_trace_to_events tests.test_orchestrator_trace tests.test_tdqs -v
