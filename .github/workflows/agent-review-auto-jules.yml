name: Legacy Google Jules Review Feedback — Retirement Receipt

on:
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]

permissions: {}

concurrency:
  group: jules-review-retirement-${ github.event.pull_request.number || github.event.issue.number || github.run_id }-${ github.event.review.id || github.event.comment.id || github.run_id }
  cancel-in-progress: false

jobs:
  legacy-review-receipt:
    if: github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' || github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Record legacy provider review feedback
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const event = context.eventName;
            const prNumber = event === 'issue_comment'
              ? (context.payload.issue.pull_request ? context.payload.issue.number : null)
              : context.payload.pull_request.number;
            if (!prNumber) return;

            const source = context.payload.review || context.payload.comment || {};
            const actor = source.user || {};
            const allowedProviders = new Set([
              'coderabbitai[bot]',
              'qodo-code-review[bot]',
              'devin-ai-integration[bot]',
              'copilot-pull-request-reviewer[bot]',
            ]);
            if (actor.type !== 'Bot' || !allowedProviders.has((actor.login || '').toLowerCase())) return;
            if (event === 'pull_request_review' && source.state === 'approved') return;
            const feedback = (source.body || '').trim();
            if (!feedback) return;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const sourceRevision = String(source.id || 'unknown') + ':' +
              (source.updated_at || source.submitted_at || source.created_at || context.runId);
            const marker = '<!-- jules-retired-review:' + sourceRevision + ' -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            if (comments.some(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body || '').includes(marker)
            )) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                marker,
                '## Legacy Google Jules review feedback receipt',
                '- state: LEGACY_REVIEW_FEEDBACK_RECORDED',
                '- provider: ' + actor.login,
                '- source_id: ' + source.id,
                '- source_revision: ' + sourceRevision,
                '- observed_head_sha: ' + pr.head.sha,
                '- base_sha: ' + pr.base.sha,
                '- local_role_guidance: .agents/skills/jules-doe-role-adapter/SKILL.md',
                '- role_register: docs/ops/DOE-ROLES-EPOCH-2026-11-03.md',
                '',
                'Google Jules became read-only after 2026-11-11. This receipt preserves provider feedback for the DoE reviewer role. Route follow-up implementation through the active roster and a verified adapter; preserve independent exact-head review.',
                '',
                'BEGIN_UNTRUSTED_PROVIDER_FEEDBACK',
                feedback.slice(0, 1600),
                'END_UNTRUSTED_PROVIDER_FEEDBACK',
              ].join('\n'),
            });
