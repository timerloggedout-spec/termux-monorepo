name: Agentic Auth Canary

# Validates the path that actually carries PR throughput: the operator/DeepAgent
# gh+git CLI auth on the Termux device. The device publishes a heartbeat with
# scripts/termux/check-gh-agentic-auth.sh --publish (branch ops/agentic-auth-heartbeat);
# missing/stale/degraded treated as operational lag / device residual (notice + exit 0)
# to reduce notification spam. Dual-gate remains separate. Complements Pinggy transport canary.
# Device #1 opaque ID tmx-node-primary. Credentials names-only #184.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Maximum heartbeat age before notice"
        required: false
        default: "26"

permissions:
  contents: read

concurrency:
  group: agentic-auth-canary
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read heartbeat and recent operator pushes
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || '26' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const maxAge = Number(process.env.MAX_AGE_HOURS || 26);
            const problems = [];
            let hb = null;
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: 'ops/agentic-auth/heartbeat.json', ref: 'ops/agentic-auth-heartbeat' });
              hb = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            } catch (e) {
              problems.push(`heartbeat unavailable (${e.status || e.message}); run scripts/termux/check-gh-agentic-auth.sh --publish on the device (tmx-node-primary)`);
            }
            let ageH = null;
            if (hb) {
              ageH = (Date.now() - Date.parse(hb.observed_at)) / 36e5;
              if (!(ageH <= maxAge)) problems.push(`heartbeat is ${ageH.toFixed(1)}h old (max ${maxAge}h)`);
              if (hb.status !== 'ok') {
                const bad = (hb.checks || []).filter(c => !c.ok).map(c => `${c.name}: ${c.detail}`);
                problems.push(`device reports ${hb.status}: ${bad.join('; ')}`);
              }
            }
            // Context only: most recent human/agent (non-bot) commit on master.
            let lastPush = null;
            try {
              const { data: commits } = await github.rest.repos.listCommits({ owner, repo, sha: 'master', per_page: 50 });
              lastPush = commits.find(c => !(c.author?.type === 'Bot' || /\[bot\]|actions@users/.test(c.commit.author.email || '')));
            } catch (e) { core.warning(`commit lookup failed: ${e.message}`); }
            const summary = problems.length
              ? `\n⚠️ Device lag residual (notice, exit 0): ${problems.join(' | ')}\n`
              : '\n✅ gh/git agentic auth path healthy\n';
            await core.summary
              .addHeading('Agentic auth canary')
              .addRaw(`- heartbeat: ${hb ? `${hb.status} @ ${hb.observed_at} (device ${hb.device_id || 'tmx-node-primary'}, ${ageH ? ageH.toFixed(1) + 'h old' : 'n/a'})` : 'missing'}\n`)
              .addRaw(`- last non-bot master commit: ${lastPush ? `${lastPush.sha.slice(0,7)} by ${lastPush.commit.author.name} @ ${lastPush.commit.author.date}` : 'n/a'}\n`)
              .addRaw(summary)
              .write();
            if (problems.length) {
              core.notice(problems.join(' | ') + ' — classified as device lag (Pinggy/auth residual on #1); not a required-gate failure.');
              // Exit 0 to reduce notification spam; audit retained in summary.
            }
