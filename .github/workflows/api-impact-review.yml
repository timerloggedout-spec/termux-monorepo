name: API Impact Review

# Read-only contract review. The ChatGPT API Impact Mapper is not a CI endpoint;
# workflow_dispatch accepts its structured result envelope for validation.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      mapper_input_json:
        description: Optional SHA-bound API Impact Mapper JSON envelope
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: api-impact-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.meta.outputs.pr_number }}
      base_sha: ${{ steps.meta.outputs.base_sha }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
    steps:
      - name: Resolve pull_request event metadata
        if: github.event_name == 'pull_request'
        id: meta
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve manually requested PR metadata
        if: github.event_name == 'workflow_dispatch'
        id: manual
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const number = Number('${{ inputs.pr_number }}');
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid PR number');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number
            });
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);

      - name: Publish manual metadata
        if: github.event_name == 'workflow_dispatch'
        id: meta
        env:
          PR_NUMBER: ${{ steps.manual.outputs.pr_number }}
          BASE_SHA: ${{ steps.manual.outputs.base_sha }}
          HEAD_SHA: ${{ steps.manual.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER" && test -n "$BASE_SHA" && test -n "$HEAD_SHA"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  report:
    needs: resolve-pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.resolve-pr.outputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare optional mapper result
        id: mapper
        if: github.event_name == 'workflow_dispatch' && inputs.mapper_input_json != ''
        env:
          MAPPER_INPUT_JSON: ${{ inputs.mapper_input_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          payload = os.environ.get("MAPPER_INPUT_JSON", "")
          if not payload:
              raise SystemExit("mapper input was requested but is empty")
          target = Path(os.environ["RUNNER_TEMP"]) / "api-impact-mapper-input.json"
          target.write_text(payload, encoding="utf-8")
          print(f"Prepared mapper input at {target}")
          PY
          echo "path=$RUNNER_TEMP/api-impact-mapper-input.json" >> "$GITHUB_OUTPUT"

      - name: Generate deterministic PR report
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          BASE_SHA: ${{ needs.resolve-pr.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
          MAPPER_INPUT_PATH: ${{ steps.mapper.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/api-impact
          args=(
            --repository "$REPOSITORY"
            --pr-number "$PR_NUMBER"
            --base "$BASE_SHA"
            --head "$HEAD_SHA"
            --output-json artifacts/api-impact/report.json
            --output-markdown artifacts/api-impact/report.md
          )
          if [ -n "$MAPPER_INPUT_PATH" ]; then
            args+=(--mapper-input "$MAPPER_INPUT_PATH")
          fi
          python3 -m scripts.integrations.api_impact.cli "${args[@]}"
          cat artifacts/api-impact/report.md >> "$GITHUB_STEP_SUMMARY"
          state=$(python3 -c 'import json; print(json.load(open("artifacts/api-impact/report.json", encoding="utf-8"))["state"])')
          if [ "$state" = "analysis_required" ]; then
            echo "::warning::API surface changed; run API Impact Mapper and submit the SHA-bound envelope using workflow_dispatch."
          elif [ "$state" = "partial" ]; then
            echo "::warning::API Impact Mapper report is partial; unresolved findings remain open."
          fi

      - name: Upload API impact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-impact-pr-${{ needs.resolve-pr.outputs.pr_number }}-${{ needs.resolve-pr.outputs.head_sha }}
          path: artifacts/api-impact/
          if-no-files-found: error
          retention-days: 30
