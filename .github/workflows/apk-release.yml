name: apk-release

# [MUSEai]@{role:{apk-release}} :: fleet .APK release lane (docs/ops/APK-RELEASE-LANE.md)
# Trigger = tag apk-v<semver> ∨ workflow_dispatch. Build = SDK-direct (scripts/apk/build_apk.sh, ∅ Gradle/network).
# Signing custody = Actions secrets NAMES only (values ∅ in repo/chat): ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD — ∅ provisioned at lane birth (recon 2026-10-31) ⇒ fail-soft to an in-runner
#   EPHEMERAL debug keystore, release notes disclose SIGNING_MODE; production signing = owner provisioning of those 4 names.
# Release write = job GITHUB_TOKEN contents:write only.

on:
  push:
    tags: ["apk-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "semver override (default: apps/fleet-apk/VERSION)"
        required: false
        type: string
      prerelease:
        description: "mark GitHub Release as prerelease"
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#apk-v}";
          elif [ -n "${INPUT_VERSION}" ]; then V="${INPUT_VERSION}";
          else V="$(tr -d '[:space:]' < apps/fleet-apk/VERSION)"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=apk-v$V" >> "$GITHUB_OUTPUT"
          echo "resolved version=$V"

      - name: Materialize release keystore (names only; absent ⇒ ephemeral path)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            { echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"; echo "KEYSTORE_PASS=$KS_PASS";
              echo "KEY_ALIAS=$KS_ALIAS"; echo "KEY_PASS=$KEY_PASS"; } >> "$GITHUB_ENV"
            echo "signing: release-keystore (secret names present)"
          else
            echo "signing: ephemeral-debug (ANDROID_KEYSTORE_* secrets not provisioned)"
          fi

      - name: Build + sign + verify + checksum
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/apk/build_apk.sh "$VERSION"

      - name: Upload workflow artifact (backup surface)
        uses: actions/upload-artifact@v4
        with:
          name: fleet-${{ steps.ver.outputs.version }}-apk
          path: |
            dist/fleet-${{ steps.ver.outputs.version }}.apk
            dist/SHA256SUMS
            dist/SIGNING_MODE

      - name: Create GitHub Release
        # Token class fix (2026-11-02, arm-A proof runs 41422144649/41422211229): GITHUB_TOKEN got
        # HTTP 403 'Resource not accessible by integration' on POST /releases for non-master refs,
        # while build/sign/verify succeeded. Release step uses the provisioned operator PAT-class
        # secret (name verified in live secrets census) until the Termux Fleet ApkRelease AppID
        # migration (QUEUED, AppID lane) makes this an app token. All other steps keep github.token.
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          MODE="$(cat dist/SIGNING_MODE | cut -d= -f2)"
          { echo "fleet .APK $VERSION — [MUSEai]@{role:{apk-release}}";
            echo;
            echo "artifact: fleet-$VERSION.apk (package com.timerloggedout.fleet) + SHA256SUMS";
            echo "SIGNING_MODE: $MODE";
            if [ "$MODE" != "release-keystore" ]; then
              echo "⚠ ephemeral debug signing — installable proof artifact, NOT production-signed. Production = owner provisions ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD (names only).";
            fi
            echo "build: scripts/apk/build_apk.sh (SDK build-tools direct, no Gradle) ∧ workflow apk-release.yml @ $GITHUB_SHA";
          } > /tmp/notes.md
          FLAGS="--title fleet-$VERSION --notes-file /tmp/notes.md"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then FLAGS="$FLAGS --target $GITHUB_SHA"; fi
          if [ "$PRERELEASE" = "true" ]; then FLAGS="$FLAGS --prerelease"; fi
          gh release create "$TAG" dist/fleet-$VERSION.apk dist/SHA256SUMS $FLAGS
          gh release view "$TAG" --json url,tagName,assets --jq '{url,tagName,assets:[.assets[].name]}'
