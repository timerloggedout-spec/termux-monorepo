name: apk-xref exec

# Execution lane for the APK <-> repo cross-reference category
# (docs/ops/APK-XREF-TOOLKIT.md). The intake workflow
# (apk-xref-intake.yml) only records filings; THIS workflow runs the
# belt: acquire -> extract -> scan-repo -> cross-validate -> file the
# findings on the Reverse Engineering — APK Cross-Reference Findings
# form. Owner ENV rule: swarm execution runs in GitHub Actions
# (ephemeral runner isolation), not on a VM and not on a device.
#
# Dispatch-driven, one filed request issue per run:
#   gh workflow run apk-xref-exec.yml -f issue_number=2273
#
# Note on the record comment: the findings issue is authored by the
# fleet CrossReference app token, so it DOES wake apk-xref-intake. This
# workflow therefore still
# runs the same deterministic intake parser itself and posts the
# record with the same hash marker the intake workflow dedupes on;
# a later human edit re-runs intake, which then skips its duplicate.
# Auth: fleet CrossReference App installation token (SEC-03 mint step
# below; AppID lane 2026-11-01 — Reverse Engineering family identity,
# `Scalpel · CrossReference`, App 5564430; swapped off Swarm, which was
# the 2026-11-01 bridge fix in PR #2992). The job GITHUB_TOKEN's shared
# 1,000 req/hr repo bucket chronically starved the filing fetch (runs
# 41273960355 + 41274305340 + 41274413601 + 41274635772 = HTTP 403
# rate-limit at the fetch step). The CrossReference installation bucket
# is its own 5,000 req/hr.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Filed [apk-xref] request issue number"
        required: true
        type: string

permissions: {}

concurrency:
  group: apk-xref-exec-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  exec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Mint the fleet CrossReference app token
        id: mint
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3 release
        with:
          app-id: ${{ vars.TERMUX_FLEET_CROSSREFERENCE_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_CROSSREFERENCE_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out trusted default-branch control plane
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.mint.outputs.token }}
          persist-credentials: false

      - name: Fetch the filed request
        env:
          TOKEN: ${{ steps.mint.outputs.token }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          set -uo pipefail
          # Diagnostics ride the evidence artifact (run 41273960355
          # failed this step in <1s with logs unreachable from the
          # fleet's API route; never fly blind again).
          {
            echo "gh: $(command -v gh || echo MISSING)"; gh --version 2>&1 | head -1
            echo "jq: $(command -v jq || echo MISSING)"; jq --version 2>&1
            echo "curl: $(command -v curl || echo MISSING)"
          } > /tmp/diag.txt 2>&1
          # Read via curl + the job token directly (no gh dependency
          # on the read path).
          # Bounded retry: the repo GITHUB_TOKEN installation bucket
          # (1,000 req/hr/repo) is shared by every fleet workflow and
          # is chronically contended at hour boundaries — proof runs
          # 41273960355 + 41274305340 + 41274413601 all died here on
          # HTTP 403 rate-limit, not on workflow logic. Retry only
          # the rate-limit class; any other non-200 is fatal at once
          # with the response body in the diagnostics.
          code=""
          for attempt in 1 2 3 4 5 6 7 8; do
            code="$(curl -sS -o /tmp/issue.json -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE}")"
            echo "attempt ${attempt}: issue GET -> HTTP ${code}" >> /tmp/diag.txt
            [ "${code}" = "200" ] && break
            if grep -qi 'rate limit' /tmp/issue.json; then
              echo "rate-limited; backing off 45s" >> /tmp/diag.txt
              sleep 45
            else
              head -c 400 /tmp/issue.json >> /tmp/diag.txt; echo >> /tmp/diag.txt
              cat /tmp/diag.txt; exit 1
            fi
          done
          [ "${code}" = "200" ] || { cat /tmp/diag.txt; exit 1; }
          jq -e '[.labels[].name] | index("apk-xref")' /tmp/issue.json > /dev/null \
            || { echo "issue #${ISSUE} lacks the apk-xref label; refusing"; exit 1; }
          jq -r '.body // ""' /tmp/issue.json > /tmp/filing.md
          echo "filing: $(jq -r '.title' /tmp/issue.json)"

      - name: Run the belt (acquire -> extract -> scan -> xref)
        env:
          ISSUE: ${{ inputs.issue_number }}
          # The belt's fetch sends this as Bearer for api.github.com
          # only (env-read, never logged), so acquire rides the CrossReference
          # bucket instead of the anonymous 60/hr egress-IP quota.
          GITHUB_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/apk-xref"
          echo "WORK=${WORK}" >> "$GITHUB_ENV"
          python3 ops/web_adapter_foundry/apk_xref_exec.py \
            --issue-body /tmp/filing.md \
            --issue-number "${ISSUE}" \
            --workdir "${WORK}" | tee /tmp/runner.log
          python3 - <<'PY'
          import json, re
          log = open('/tmp/runner.log', encoding='utf-8').read()
          m = re.search(r'\{\n "acquisition_status".*\n\}', log, re.S)
          summary = json.loads(m.group(0)) if m else {}
          json.dump(summary, open('/tmp/summary.json', 'w'), indent=1)
          print('summary:', summary)
          PY

      - name: File the findings issue
        id: findings
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          set -euo pipefail
          TARGET="$(jq -r '.target_id' "${WORK}/findings.json")"
          URL="$(gh issue create \
            --title "[apk-xref:findings] ${TARGET}: cross-reference findings" \
            --label apk-xref \
            --body-file "${WORK}/findings.md")"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "number=$(basename "${URL}")" >> "$GITHUB_OUTPUT"
          echo "findings filed: ${URL}"

      - name: Post the cross-reference record on the findings issue
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          NUM: ${{ steps.findings.outputs.number }}
        run: |
          set -euo pipefail
          set +e
          python3 -m scripts.apk_xref.apk_xref_intake "${WORK}/findings.md" \
            --markdown > /tmp/record.md
          code=$?
          set -e
          {
            cat /tmp/record.md
            echo
            echo "---"
            if [ "$code" -eq 0 ]; then
              echo "[MUSEai]@{role:{reverse-engineering-toolkits}} cross-reference record generated by \`apk_xref_intake\` from the findings filing above. Posted by apk-xref-exec: the exec workflow runs the same parser itself; the hash marker below is the intake workflow's own dedupe key, so the intake pass this issue wakes skips its duplicate."
            else
              echo "[MUSEai]@{role:{reverse-engineering-toolkits}} intake parser refused the findings filing (exit $code) — see the run log; the findings issue itself stands as the record of the run."
              exit 1
            fi
          } > /tmp/comment.md
          hash="$(sha256sum /tmp/record.md | cut -d' ' -f1)"
          echo "<!-- apk-xref-intake:${hash} -->" >> /tmp/comment.md
          gh issue comment "${NUM}" --body-file /tmp/comment.md

      - name: Report back on the request issue
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          ISSUE: ${{ inputs.issue_number }}
          URL: ${{ steps.findings.outputs.url }}
        run: |
          set -euo pipefail
          VERDICT="$(jq -r '.verdict' "${WORK}/findings.json")"
          {
            echo "[MUSEai]@{role:{reverse-engineering-toolkits}} execution complete (apk-xref-exec, ephemeral Actions runner)."
            echo
            echo "- verdict: \`${VERDICT}\`"
            echo "- findings: ${URL}"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- evidence bundle: workflow artifact \`apk-xref-${ISSUE}\` (acquisition + extraction + findings record)."
          } > /tmp/report.md
          gh issue comment "${ISSUE}" --body-file /tmp/report.md

      - name: Upload the evidence bundle (findings only — extractions carry the DEX corpus, which does not travel; see the toolkit doc)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-xref-${{ inputs.issue_number }}
          path: |
            ${{ env.WORK }}/findings.json
            ${{ env.WORK }}/findings.md
            ${{ env.WORK }}/findings-full.md
            /tmp/summary.json
            /tmp/diag.txt
          if-no-files-found: ignore
          retention-days: 90
