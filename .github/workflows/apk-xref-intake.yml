name: apk-xref intake

# Issue trigger for the APK <-> repo cross-reference category
# (docs/ops/APK-XREF-TEMPLATES.md). Filing an apk-cross-reference or
# apk-cross-reference-findings form (label `apk-xref`) IS the trigger.
# Exactly ONE issues event per filing: types opened/reopened/edited, no
# `labeled`, no concurrency group (research-intake fix, PRs #2132/#2137).
# Deterministic parsing only; trusted default-branch code; the issue body
# is data, never code. No pull_request_target (Nov-2 rules). No provisioned
# secrets: only the job GITHUB_TOKEN with issues:write.

on:
  issues:
    types: [opened, reopened, edited]

permissions: {}

jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 'apk-xref')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted default-branch control plane
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Parse filing into the cross-reference record
        env:
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
        run: |
          set -uo pipefail
          printf '%s' "$ISSUE_BODY" > /tmp/apk-xref-body.md
          set +e
          python3 -m scripts.apk_xref.apk_xref_intake /tmp/apk-xref-body.md \
            --markdown > /tmp/apk-xref-record.md
          code=$?
          set -e
          {
            cat /tmp/apk-xref-record.md
            echo
            echo "---"
            if [ "$code" -eq 0 ]; then
              echo "[MUSEai]@{role:{research-triggers}} cross-reference record generated by \`apk_xref_intake\` from this filing. The Foundry lane runs the cross-validation; findings are filed on the APK Cross-Reference Findings form. Edit the issue to re-run."
            else
              echo "[MUSEai]@{role:{research-triggers}} intake refused (exit $code): a bad issue reference, package-id shape, submitter (Role{Moniker} required), a write filing without state-changing authorization, or a missing divergence direction. Fix the fields and edit the issue to re-run."
            fi
          } > /tmp/comment.md
          hash="$(sha256sum /tmp/apk-xref-record.md | cut -d' ' -f1)"
          echo "<!-- apk-xref-intake:${hash} -->" >> /tmp/comment.md
          echo "RECORD_HASH=${hash}" >> "$GITHUB_ENV"
          cat /tmp/comment.md

      - name: Comment the record on the issue (hash-deduped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" --paginate \
              --jq '[.[] | .body // ""] | join("\n")' | grep -q "apk-xref-intake:${RECORD_HASH}"; then
            echo "Identical cross-reference record already posted (hash ${RECORD_HASH}); skipping duplicate."
            exit 0
          fi
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md
