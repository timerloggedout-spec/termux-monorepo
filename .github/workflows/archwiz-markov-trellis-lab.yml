name: ArchWiz Markov Trellis Lab

on:
  pull_request:
    paths:
      - "experiments/archwiz-markov-lane/**"
      - "docs/proposals/active/archwiz-markov-trellis-lab/**"
      - "docs/proposals/registry.yaml"
  push:
    branches:
      - experiment/archwiz-markov-trellis-lab
    paths:
      - "experiments/archwiz-markov-lane/**"

permissions:
  contents: read

# QUE fan-out guard (Owner order 2026-11-18): PR events coalesce per PR;
# every other event keeps a unique group (run_id) ⇒ ¬coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  deterministic-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Node version
        run: node --version

      - name: Run deterministic Markov fixtures
        run: node experiments/archwiz-markov-lane/src/markov-engine.test.mjs
