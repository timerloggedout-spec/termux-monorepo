name: BIFROST-006 benchmark smoke

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Smoke duration seconds
        required: false
        default: "15"
      rate:
        description: Target RPS
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"

      - name: Clone benchmarking fork
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/timerloggedout-spec/bifrost-benchmarking_fork.git bench

      - name: Build mocker + benchmark
        working-directory: bench
        run: |
          set -euo pipefail
          go mod tidy
          (cd mocker && go build -o ../mocker-bin .)
          go build -o benchmark benchmark.go
          ls -la mocker-bin benchmark

      - name: Start mocker
        working-directory: bench
        run: |
          set -euo pipefail
          ./mocker-bin -port 8000 &
          echo $! > mocker.pid
          sleep 2
          curl -sS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8000/ || true

      - name: Run benchmark
        working-directory: bench
        env:
          DURATION: ${{ inputs.duration }}
          RATE: ${{ inputs.rate }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          ./benchmark -h 2>&1 | head -40 || true
          ./benchmark -provider bifrost -rate "$RATE" -duration "$DURATION" \
            -output evidence/results-bifrost-smoke.json 2>&1 || \
          ./benchmark -rate "$RATE" -duration "$DURATION" \
            -output evidence/results-bifrost-smoke.json 2>&1 || \
          echo '{"status":"cli_probe","see_logs":true}' > evidence/results-bifrost-smoke.json
          ls -la evidence/

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-006-evidence
          path: bench/evidence/

      - name: Summary
        working-directory: bench
        run: |
          echo "### BIFROST-006 smoke" >> "$GITHUB_STEP_SUMMARY"
          ls -la evidence/ >> "$GITHUB_STEP_SUMMARY" || true
