name: Root Brain Rust core

on:
  pull_request:
    paths:
      - "brain.rs"
      - "brain/**"
      - ".github/workflows/brain-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt + check + test + clippy (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Two jobs per eligible PR/manual run; no scheduled trigger. Shared
        # Brain changes intentionally also exercise the MOSAIC matrix (four jobs total).
        # Keep the declared MSRV honest and exercise current stable Rust.
        rust: ["1.85.0", "1.100.0"]
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Check committed formatting
        id: format_check
        continue-on-error: true
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2021 --check ../brain.rs src/lib.rs src/extensions.rs tests/brain.rs tests/extensions.rs
      - name: Generate formatting artifact for diagnosis
        if: steps.format_check.outcome == 'failure'
        run: |
          diagnostic_root="${RUNNER_TEMP}/brain-rustfmt"
          rm -rf "$diagnostic_root"
          mkdir -p "$diagnostic_root/brain"
          cp -a . "$diagnostic_root/brain/"
          cp ../brain.rs "$diagnostic_root/brain.rs"
          cargo fmt --manifest-path "$diagnostic_root/brain/Cargo.toml" --all
          rustfmt --edition 2021 "$diagnostic_root/brain.rs"
      - name: Upload rustfmt output
        if: steps.format_check.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brain-rustfmt-output-${{ matrix.rust }}
          path: ${{ runner.temp }}/brain-rustfmt/**
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Fail if committed formatting differs
        if: steps.format_check.outcome == 'failure'
        run: exit 1
