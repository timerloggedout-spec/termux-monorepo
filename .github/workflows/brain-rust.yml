name: Root Brain Rust core

on:
  pull_request:
    paths:
      - "brain.rs"
      - "brain/**"
      - "docs/superpowers/specs/2026-11-15-monorepo-brain-kernel-design.md"
      - "docs/superpowers/plans/2026-11-15-monorepo-brain-kernel.md"
      - ".github/workflows/brain-rust.yml"
  push:
    branches: [master]
    paths:
      - "brain.rs"
      - "brain/**"
      - ".github/workflows/brain-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt + check + test + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format sources for inspection
        run: cargo fmt --all
      - name: Upload rustfmt output
        uses: actions/upload-artifact@v4
        with:
          name: brain-rustfmt-output
          path: |
            brain.rs
            brain/src/lib.rs
            brain/tests/brain.rs
      - name: Verify format
        run: cargo fmt --check
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
