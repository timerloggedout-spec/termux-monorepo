name: Briefing Registry Validation

on:
  push:
    paths:
      - "data/briefing/**"
      - "schemas/briefing/**"
      - "scripts/briefing/**"
      - "docs/briefing/**"
      - "docs/research/**"
      - ".github/workflows/briefing-registry-validation.yml"
  pull_request:
    paths:
      - "data/briefing/**"
      - "schemas/briefing/**"
      - "scripts/briefing/**"
      - "docs/briefing/**"
      - "docs/research/**"
  workflow_dispatch:

permissions:
  contents: read

# QUE fan-out guard (Owner order 2026-11-18): PR events coalesce per PR;
# every other event keeps a unique group (run_id) ⇒ ¬coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate registry
        run: python3 scripts/briefing/validate_registry.py
      - name: Validate dated briefing snapshots
        run: python3 scripts/briefing/validate_snapshots.py
      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in Path("schemas/briefing").glob("*.json"):
              json.loads(p.read_text())
              print(f"valid JSON: {p}")
          PY
