name: Cadence Lead/Lag

on:
  schedule:
    - cron: "12 */2 * * *"
  workflow_dispatch:
    inputs:
      per_page:
        description: Maximum recent workflow runs to sample (1–100)
        type: number
        default: 50
        required: true

permissions:
  actions: read
  contents: write

# Do not cancel a running snapshot writer; queued invocations may coalesce naturally.
concurrency:
  group: cadence-lead-lag
  cancel-in-progress: false

jobs:
  classify:
    name: lead-lag-moneyball
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Classify recent Actions outcomes (Lead/Lag)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          CADENCE_PER_PAGE: ${{ inputs.per_page || 50 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/lead_lag_cadence.py \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --branch master \
            --per-page "$CADENCE_PER_PAGE" \
            --out docs/ops/generated/lead-lag-cadence.json

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          REPORT=docs/ops/generated/lead-lag-cadence.json
          {
            echo "## Cadence Lead/Lag (moneyball plane)"
            echo
            echo "Correctness > green badges. Skipped/cancelled = operational lag, not model failure."
            echo
            SAMPLE=$(jq -r '.sample_size' "$REPORT")
            TOTAL=$(jq -r '.api_total_count // "unknown"' "$REPORT")
            TRUNCATED=$(jq -r '.sample_truncated' "$REPORT")
            VERDICT=$(jq -r '.verdict' "$REPORT")
            echo "- Sample: $SAMPLE / $TOTAL recent runs"
            echo "- Truncated: $TRUNCATED"
            echo "- Verdict: $VERDICT (observer-only; not a promotion gate)"
            echo
            echo '```json'
            head -c 6000 "$REPORT"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit cadence snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add docs/ops/generated/lead-lag-cadence.json
          if git diff --cached --quiet; then
            echo "No cadence delta."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -m "chore(cadence): Lead/Lag moneyball snapshot" \
            -m "Observation plane only. Not dual-gate. Device UI not required." \
            -m "Agent-Identity: Cadence Lead/Lag"
          # Reconcile concurrent master movement; a rejected push is a real failure,
          # not a success-shaped log message.
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
