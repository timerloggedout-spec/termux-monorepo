name: Temporary Automation Catalog Refresh

on:
  push:
    branches: [ops/merge-promotion-queue]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/automation_docs.py'
      - 'docs/ops/generated/**'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - run: python3 scripts/ci/automation_docs.py --write
      - run: python3 scripts/ci/automation_docs.py --check
      - name: Commit generated catalog
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/ops/generated; then
            echo 'Automation catalog already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ops/generated
          git commit -m 'docs(ops): refresh generated automation catalog'
          git push
