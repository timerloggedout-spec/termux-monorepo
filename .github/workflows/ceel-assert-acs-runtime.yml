name: CEEL ASSERT ACS runtime smoke

on:
  push:
    paths:
      - "experiments/doe/assert_acs_2x2/**"
      - ".github/workflows/ceel-assert-acs-runtime.yml"
  pull_request:
    paths:
      - "experiments/doe/assert_acs_2x2/**"
      - ".github/workflows/ceel-assert-acs-runtime.yml"

permissions:
  contents: read

concurrency:
  group: ceel-assert-acs-runtime-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  acs-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned ACS Python SDK
        run: python -m pip install "git+https://github.com/microsoft/agent-governance-toolkit.git@3233be2338816257700a8dbdf531a21b9f359582#subdirectory=policy-engine/sdk/python"
      - name: Execute real ACS host fixture
        run: |
          python experiments/doe/assert_acs_2x2/acs/host.py \
            --input experiments/doe/assert_acs_2x2/acs/tasks.jsonl \
            --manifest experiments/doe/assert_acs_2x2/acs/manifest.yaml \
            --audit /tmp/ceel-acs-decisions.jsonl \
            --output /tmp/ceel-acs-results.jsonl
          python experiments/doe/assert_acs_2x2/acs/validate_smoke.py \
            /tmp/ceel-acs-results.jsonl \
            /tmp/ceel-acs-decisions.jsonl
          python experiments/doe/assert_acs_2x2/acs/validate_target_smoke.py \
            /tmp/ceel-acs-target-decisions.jsonl
