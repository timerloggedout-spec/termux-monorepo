name: cert-coderoad-image

# Builds the CodeRoad completion image ONCE and publishes it to GHCR;
# cert-coderoad.yml pulls it per run. Rationale (2026-11-02): the
# in-run image build is dpkg-bound on hosted runners — attempt 4 died
# at the 20-min step timeout mid-unpack and attempt 5 at 40 min,
# both still progressing (runner disk throughput, not a hang). The
# rdb-alpha half builds in ~1 min; the VS Code layer is the cost.
# Amortize it: build here (rare, on dispatch), pull there (fast).

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  issues: write

concurrency:
  group: cert-coderoad-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out monorepo (driver sources)
        uses: actions/checkout@v4
        with:
          path: mono

      - name: Fetch rdb-alpha environment recipe (pinned Dockerfile)
        # Same preprocessing as the run workflow used: full cross-repo
        # checkout failed in run 41400838295, so the recipe is a pinned
        # raw file; `unminimize` dropped (docs-only, non-TTY stall);
        # apt sources stay upstream (archive.ubuntu.com serves focal;
        # old-releases 404s it — run 41408722874).
        run: |
          mkdir -p rdb-alpha
          curl -fsSL "https://raw.githubusercontent.com/freeCodeCamp/rdb-alpha/main/Dockerfile" \
            -o rdb-alpha/Dockerfile.upstream
          grep -v 'unminimize' rdb-alpha/Dockerfile.upstream > rdb-alpha/Dockerfile
          wc -l rdb-alpha/Dockerfile rdb-alpha/Dockerfile.upstream

      - name: Build rdb-alpha image
        timeout-minutes: 30
        run: docker build --progress=plain -t rdb-alpha:local ./rdb-alpha

      - name: Build CodeRoad stage 1 of 3 — libs
        timeout-minutes: 30
        run: |
          docker build --progress=plain --target libs -t coderoad-stage:libs \
            -f mono/scripts/certifications/coderoad-driver/Dockerfile.coderoad \
            mono/scripts/certifications/coderoad-driver

      - name: Build CodeRoad stage 2 of 3 — vscode tarball
        timeout-minutes: 30
        run: |
          docker build --progress=plain --target vscode -t coderoad-stage:vscode \
            -f mono/scripts/certifications/coderoad-driver/Dockerfile.coderoad \
            mono/scripts/certifications/coderoad-driver

      - name: Build CodeRoad stage 3 of 3 — full (extension + driver)
        timeout-minutes: 30
        run: |
          docker build --progress=plain --target full -t ghcr.io/timerloggedout-spec/coderoad-rdb:latest \
            -f mono/scripts/certifications/coderoad-driver/Dockerfile.coderoad \
            mono/scripts/certifications/coderoad-driver

      - name: Diagnose vscode stage on failure (issue 506)
        if: failure()
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          DIAG=$(docker run --rm coderoad-stage:libs bash -c '
            set +e
            mkdir -p /opt/vscode
            curl -fsSL "https://update.code.visualstudio.com/latest/linux-x64/stable" -o /tmp/code.tgz
            echo "curl exit: $?"
            ls -la /tmp/code.tgz
            tar -xzf /tmp/code.tgz -C /opt/vscode
            echo "tar exit: $?"
            ls /opt/vscode
            /opt/vscode/VSCode-linux-x64/bin/code --version
            echo "code --version exit: $?"
            ldd /opt/vscode/VSCode-linux-x64/code 2>/dev/null | grep "not found" | head -20
            echo "ldd-scan done"
          ' 2>&1 | tail -30)
          export DIAG
          python3 - <<PYEOF
          import json, os, urllib.request
          body = "CODEROAD_IMAGE_DIAG run %s\n\n```\n%s\n```" % (os.environ["RUN_ID"], os.environ.get("DIAG", "")[:2400])
          req = urllib.request.Request(
              "https://api.github.com/repos/timerloggedout-spec/termux-monorepo/issues/506/comments",
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"},
              method="POST")
          urllib.request.urlopen(req)
          print("diag recorded")
          PYEOF

      - name: Report stage state on failure (issue 506)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          STATE=$(docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E 'coderoad|rdb-alpha' | tr '\n' ';' || true)
          python3 - <<PYEOF
          import json, os, urllib.request
          body = "CODEROAD_IMAGE_FAILED run %s — stage state at failure: %s (the failed step in the run's step list names the stage: libs / vscode / full)." % (os.environ["RUN_ID"], os.environ.get("STATE", "") or "$STATE")
          req = urllib.request.Request(
              "https://api.github.com/repos/timerloggedout-spec/termux-monorepo/issues/506/comments",
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"},
              method="POST")
          urllib.request.urlopen(req)
          print("failure state recorded")
          PYEOF

      - name: Push image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/timerloggedout-spec/coderoad-rdb:latest
          docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/timerloggedout-spec/coderoad-rdb:latest

      - name: Record built digest on issue 506
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/timerloggedout-spec/coderoad-rdb:latest)
          python3 - <<PYEOF
          import json, os, urllib.request
          body = "CODEROAD_IMAGE_BUILT run %s digest \`%s\` — cert-coderoad.yml pulls ghcr.io/timerloggedout-spec/coderoad-rdb:latest per run." % (os.environ["RUN_ID"], "$DIGEST")
          req = urllib.request.Request(
              "https://api.github.com/repos/timerloggedout-spec/termux-monorepo/issues/506/comments",
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"},
              method="POST")
          urllib.request.urlopen(req)
          print("digest recorded")
          PYEOF
