name: Cert unit (Route A)

# Certifications Phase 1: one dispatch = one cert work unit (module-block).
# Execution happens here (Swarm workflow run); artifacts upload for capture
# into fleet-logs certifications/ by PR; platform submit/verify stays with
# the Platforms lane. Model auto-resolves from the provider catalog.
on:
  workflow_dispatch:
    inputs:
      cert:
        description: "Cert slug (fleet-logs path segment)"
        required: true
        default: l1-relational-databases-v9
        type: string
      unit:
        description: "Unit id (module-block)"
        required: true
        type: string
      manifest:
        description: "Unit manifest JSON {cert, unit, steps:[{id,title}]}"
        required: true
        type: string
      provider:
        description: "Invoke provider (auto model resolution)"
        required: false
        default: cohere
        type: choice
        options:
          - cohere
          - sealion
          - baseten
      set_index:
        description: "Batch set index (scoring-grade stamp; optional)"
        required: false
        default: ""
        type: string
      cumulative_n:
        description: "Batch cumulative n (optional)"
        required: false
        default: ""
        type: string
      selection_reason:
        description: "Why this arm/batch (optional)"
        required: false
        default: ""
        type: string
      instance_context:
        description: "Configured-instance context shared by the batch (optional)"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Mint Swarm App token (stamp fan-out dispatch)
        id: app-token
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3
        with:
          app-id: ${{ vars.TERMUX_FLEET_SWARM_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }}
      - name: Run cert unit
        env:
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          SEALION_API_KEY: ${{ secrets.SEALION_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          UNIT_MANIFEST: ${{ inputs.manifest }}
        run: |
          set -o pipefail
          printf '%s' "$UNIT_MANIFEST" > /tmp/unit-manifest.json
          python3 scripts/certifications/run_unit.py \
            --manifest /tmp/unit-manifest.json \
            --provider "${{ inputs.provider }}" \
            --out "/tmp/cert-out/${{ inputs.unit }}" 2>&1 | tee /tmp/unit.log
      - name: Post unit verdict to ledger (#506)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          verdict=$(grep -E '^UNIT_VERDICT ' /tmp/unit.log | tail -1 | sed 's/^UNIT_VERDICT //')
          body=$(printf '[MUSEai]@{role:{optimizations-assurance}} CERT UNIT VERDICT run %s unit %s: `%s` - artifacts in Actions artifact cert-%s-%s (capture to fleet-logs by PR).' "${{ github.run_id }}" "${{ inputs.unit }}" "$verdict" "${{ inputs.unit }}" "${{ github.run_id }}")
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/506/comments" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"body": sys.argv[1]}))' "$body")" > /dev/null
      - name: Emit dispatch stamp to scoring planes
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          verdict=$(grep -E '^UNIT_VERDICT ' /tmp/unit.log | tail -1 | sed 's/^UNIT_VERDICT //')
          STAMP=$(VERDICT="$verdict" TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)" python3 - <<'PYEOF'
          import json, os
          v = json.loads(os.environ.get("VERDICT") or "{}")
          ok = bool(v.get("ok"))
          provider = "${{ inputs.provider }}"
          stamp = {
            "dispatch_id": "cert-unit-${{ github.run_id }}",
            "ts": os.environ.get("TS"),
            "task_class": "certifications-unit",
            "entry": "506",
            "trigger": "workflow_dispatch",
            "provider": provider,
            "model": v.get("model"),
            "role": "builder",
            "moniker": "optimizations-assurance",
            "context": "certifications-unit ${{ inputs.cert }}/${{ inputs.unit }}",
            "run": {"workflow": "cert-unit.yml", "run_id": "${{ github.run_id }}", "session_id": None},
            "outcome": {"status": "completed" if ok else "failed",
                        "summary": "cert unit ${{ inputs.unit }} verdict ok=%s" % ok,
                        "artifact": "issue 506 verdict comment", "gate_call": None, "confirmed": None},
            "quota": {"pool": provider, "cost_class": "free-credit" if provider == "baseten" else "free-tier", "slice": None},
          }
          import hashlib
          si = "${{ inputs.set_index }}".strip()
          if si:
              stamp["set_index"] = int(si)
              cn = "${{ inputs.cumulative_n }}".strip()
              stamp["cumulative_n"] = int(cn) if cn else int(si)
              sr = "${{ inputs.selection_reason }}".strip()
              if sr:
                  stamp["selection_reason"] = sr
          model = v.get("model")
          if model:
              def _sha(p):
                  try:
                      return hashlib.sha256(open(p, "rb").read()).hexdigest()
                  except OSError:
                      return None
              sp = _sha("scripts/certifications/run_unit.py")
              tw = _sha(".github/workflows/cert-unit.yml")
              if sp and tw:
                  ctx = "${{ inputs.instance_context }}".strip() or stamp["context"]
                  stamp["instance"] = {
                      "provider": provider, "model": model,
                      "system_prompt": {"ref": "scripts/certifications/run_unit.py", "sha256": sp},
                      "tools": {"ref": ".github/workflows/cert-unit.yml", "sha256": tw},
                      "role": "builder", "moniker": "optimizations-assurance", "context": ctx}
          print(json.dumps(stamp))
          PYEOF
          )
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/dispatch-stamp-fanout.yml/dispatches" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"ref": "master", "inputs": {"stamp": sys.argv[1]}}))' "$STAMP")" > /dev/null
          echo "stamp dispatched for run ${{ github.run_id }}"
      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cert-${{ inputs.unit }}-${{ github.run_id }}
          path: /tmp/cert-out/${{ inputs.unit }}
