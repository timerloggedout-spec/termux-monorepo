# Challenge countdowns feed refresh (contract: docs/ops/CHALLENGE-COUNTDOWNS-FEED.md).
# Regenerates apps/tribute-dashboard/data/challenge-countdowns-feed.json
# from the challenge entries log (the SSOT for deadline instants) and
# proposes it as a refresh PR — never commits directly. Mirrors the
# linguist-panel-feed-collect pattern (issue #1880).
name: challenge-countdowns-feed-collect

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 2'
  push:
    branches: [master]
    paths:
      - 'docs/ops/CHALLENGE-ENTRIES-LOG.md'
      - 'ops/challenge/coordinator.json'
      - 'scripts/challenge_entries/countdowns.py'
      - 'scripts/dashboards/challenge_countdowns_feed.py'

concurrency:
  group: challenge-countdowns-feed-collect
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint Termux Fleet Swarm token (own rate bucket)
        # #5219 leg (a): this collector's API reads/writes drew the shared
        # per-repo GITHUB_TOKEN bucket (1,000/h class) exhausted on
        # 2026-11-12. The Swarm App installation token carries its own
        # 12,500 bucket. Downscoped to this workflow's declared permissions.
        id: swarm
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3
        with:
          app-id: ${{ vars.TERMUX_FLEET_SWARM_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.swarm.outputs.token }}
      - name: Collect the feed
        run: |
          set -euo pipefail
          python3 -B scripts/dashboards/challenge_countdowns_feed.py \
            --root . --out apps/tribute-dashboard/data/challenge-countdowns-feed.json
      - name: Propose the refresh as a PR
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/tribute-dashboard/data/challenge-countdowns-feed.json; then
            echo "feed unchanged; no refresh PR"
            exit 0
          fi
          branch="challenge-countdowns-feed/refresh"
          git config user.name "challenge-countdowns-feed-collect"
          git config user.email "actions@github.com"
          git checkout -B "$branch"
          git add apps/tribute-dashboard/data/challenge-countdowns-feed.json
          git commit -m "chore(countdowns): refresh challenge-countdowns-feed.json"
          git push -f origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore(countdowns): refresh challenge-countdowns-feed.json" \
            --body "Automated challenge countdowns feed refresh (collector: scripts/dashboards/challenge_countdowns_feed.py; contract: docs/ops/CHALLENGE-COUNTDOWNS-FEED.md). Instants are derived from docs/ops/CHALLENGE-ENTRIES-LOG.md at collection time; nothing is copied forward." \
            || echo "refresh PR already open"
        env:
          GH_TOKEN: ${{ steps.swarm.outputs.token }}
