# challenge-osint-watch (contract: docs/ops/CHALLENGE-OSINT.md).
# Full-spectrum public OSINT plus recurring Devpost directory discovery.
name: challenge-osint-watch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
  push:
    branches: [master]
    paths:
      - 'ops/challenge/coordinator.json'
      - 'scripts/challenge/osint_watch.py'
      - 'scripts/challenge/devpost_discovery.py'
      - 'scripts/challenge/field_size_scrape.py'

concurrency:
  group: challenge-osint-watch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANE_EVENTS_DATABASE_URL: ${{ secrets.LANE_EVENTS_DATABASE_URL }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover Devpost directory leads
        run: |
          set -euo pipefail
          python3 -B scripts/challenge/devpost_discovery.py --root .
      - name: Scrape field-size counts (participants/projects)
        run: |
          set -euo pipefail
          python3 -B scripts/challenge/field_size_scrape.py --root .
      - name: Collect coverage + page snapshots
        run: |
          set -euo pipefail
          python3 -B scripts/challenge/osint_watch.py --root .
      - name: Mirror snapshots to Neon (append-only)
        run: |
          set -euo pipefail
          python3 -B scripts/challenge/participant_event.py sync \
            --source ops/challenge/coordinator.json
      - name: Propose the refresh as a PR
        run: |
          set -euo pipefail
          if git diff --quiet -- ops/challenge/osint ops/challenge/discovery ops/challenge/coordinator.json; then
            echo "osint and discovery unchanged; no refresh PR"
            exit 0
          fi
          branch="challenge-osint/refresh"
          git config user.name "challenge-osint-watch"
          git config user.email "actions@github.com"
          git checkout -B "$branch"
          git add ops/challenge/osint ops/challenge/discovery ops/challenge/coordinator.json
          git commit -m "chore(osint): refresh coverage + discovery leads"
          git push -f origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore(osint): refresh coverage + discovery leads" \
            --body "Automated public OSINT refresh. Devpost directory discoveries are unverified leads only; they do not alter coordinator admission or the wagering book." \
            || echo "refresh PR already open"
        env:
          GH_TOKEN: ${{ github.token }}
