name: Continuous CI Sweep
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
concurrency:
  group: ci-sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Dispatch sweep to termux agent
        id: dispatch
        timeout-minutes: 25
        env:
          AGENT_URL: ${{ secrets.DEEPSEEK_AGENT_URL }}
          AGENT_TOKEN: ${{ secrets.DEEPSEEK_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AGENT_URL:-}" ]; then echo "::error::DEEPSEEK_AGENT_URL not set"; exit 1; fi
          # Unresolved tunnel (curl exit 6) is environmental, not a repo defect.
          # Run 36959200200 on 7921e406 failed resolving the Pinggy host.
          HOST=$(python3 -c 'import os; from urllib.parse import urlparse; print(urlparse(os.environ["AGENT_URL"]).hostname or "")')
          if [ -z "$HOST" ] || ! getent hosts "$HOST" >/dev/null 2>&1; then
            echo "::warning::DEEPSEEK agent host ${HOST:-<empty>} does not resolve. Recording tunnel-unresolved skip."
            echo "skipped=tunnel-unresolved" >> "$GITHUB_OUTPUT"
            echo '{"phase":"skipped","reason":"tunnel-unresolved"}' > agent_status.json
            exit 0
          fi
          TASK=$(cat <<'EOF'
          Execute ~/deepcli/tasks/workflow-sweep.md.
          Scope: all repos owned by timerloggedout-spec.
          Follow the evidence-led method: DISCOVER, CLASSIFY, PRIORITIZE, FIX, VALIDATE, REPORT.
          For each fix, open a PR — do not auto-merge. Post the final report as an issue comment
          on the newest open issue titled "CI Sweep" or open one if none exists.
          EOF
          )
          jq -n --arg t "$TASK" '{task:$t, source:"gh-schedule:ci-sweep"}' \
            > payload.json
          INV=$(curl -sS --max-time 30 -X POST "$AGENT_URL/v1/agent" \
                  -H "Authorization: Bearer $AGENT_TOKEN" \
                  -H 'Content-Type: application/json' \
                  --data-binary @payload.json || true)
          if [ -z "$INV" ]; then
            echo "::warning::DEEPSEEK agent POST failed after DNS preflight (tunnel dropped). Recording tunnel-lost skip."
            echo "skipped=tunnel-lost" >> "$GITHUB_OUTPUT"
            echo '{"phase":"skipped","reason":"tunnel-lost"}' > agent_status.json
            exit 0
          fi
          INV_ID=$(printf '%s' "$INV" | jq -r '.invocation_id // empty')
          if [ -z "$INV_ID" ]; then
            echo "::warning::DEEPSEEK agent POST returned no invocation_id. Recording tunnel-lost skip."
            echo "skipped=tunnel-lost" >> "$GITHUB_OUTPUT"
            echo '{"phase":"skipped","reason":"tunnel-lost"}' > agent_status.json
            exit 0
          fi
          echo "invocation=$INV_ID"
          echo "invocation=$INV_ID" >> "$GITHUB_OUTPUT"
          # 90 x 15s = 22.5min, inside the 25min step timeout so the loop
          # exits via phase=done/error rather than being killed by the timeout.
          # curl exit 6 mid-poll is the same unresolved-host class as run 36959200200.
          P=timeout
          for i in $(seq 1 90); do
            S=$(curl -sS --max-time 10 "$AGENT_URL/v1/agent/status/$INV_ID" \
                  -H "Authorization: Bearer $AGENT_TOKEN" || echo '{"phase":"tunnel-lost"}')
            if printf '%s' "$S" | jq -e '.phase == "tunnel-lost"' >/dev/null 2>&1; then
              echo "::warning::DEEPSEEK agent status poll lost the tunnel. Recording tunnel-lost skip."
              echo "skipped=tunnel-lost" >> "$GITHUB_OUTPUT"
              echo '{"phase":"skipped","reason":"tunnel-lost"}' > agent_status.json
              exit 0
            fi
            echo "$S" > agent_status.json
            P=$(echo "$S" | jq -r '.phase // "error"')
            echo "[$i] $P"
            [ "$P" = "done" ] && break
            [ "$P" = "error" ] && break
            sleep 15
          done
          if [ "$P" != "done" ]; then
            echo "::error::sweep agent did not reach phase=done (terminal phase=$P); see agent_status.json artifact"
            exit 1
          fi

      - name: Failure diagnostics
        if: failure()
        timeout-minutes: 5
        run: |
          set -uo pipefail
          echo "::group::Workflow failure context"
          echo "event: ${{ github.event_name }}"
          echo "actor: ${{ github.actor }}"
          echo "run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::endgroup::"
          for f in payload.json agent_status.json; do
            if [ -f "$f" ]; then
              echo "::group::--- $f ---"
              cat "$f" || true
              echo "::endgroup::"
            fi
          done

      - name: Archive artifacts
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: ci-sweep-${{ github.run_id }}
          path: |
            payload.json
            agent_status.json
          if-no-files-found: ignore
          retention-days: 7