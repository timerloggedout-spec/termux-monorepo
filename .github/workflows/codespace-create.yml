name: Codespace create (dispatch)

# Creates a Codespace via API using the monorepo privileged GH token chain.
# SSOT: ARCHWIZ_GITHUB_TOKEN || OPERATOR_GITHUB_TOKEN || OPERATOR_TOKEN
# Optional override: CODESPACE_CREATE_TOKEN
# Never print token values.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA (default master)
        required: false
        default: master
      machine:
        description: Machine type (basicLinux32gb | standardLinux32gb | premiumLinux)
        required: false
        default: basicLinux32gb
      display_name:
        description: Optional display name
        required: false
        default: agent-bifrost-006

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve token presence (names only)
        id: tok
        env:
          HAS_CS: ${{ secrets.CODESPACE_CREATE_TOKEN != '' }}
          HAS_ARCHWIZ: ${{ secrets.ARCHWIZ_GITHUB_TOKEN != '' }}
          HAS_OP_GH: ${{ secrets.OPERATOR_GITHUB_TOKEN != '' }}
          HAS_OP: ${{ secrets.OPERATOR_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "CODESPACE_CREATE_TOKEN present: $HAS_CS"
          echo "ARCHWIZ_GITHUB_TOKEN present: $HAS_ARCHWIZ"
          echo "OPERATOR_GITHUB_TOKEN present: $HAS_OP_GH"
          echo "OPERATOR_TOKEN present: $HAS_OP"
          if [ "$HAS_CS" = "true" ] || [ "$HAS_ARCHWIZ" = "true" ] || [ "$HAS_OP_GH" = "true" ] || [ "$HAS_OP" = "true" ]; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No privileged GH token secret present."
            exit 1
          fi

      - name: Create codespace
        id: create
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_CREATE_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN }}
          REF: ${{ inputs.ref }}
          MACHINE: ${{ inputs.machine }}
          DISPLAY: ${{ inputs.display_name }}
        run: |
          set -euo pipefail
          # GitHub API: machine is a STRING, not {name: ...}
          body=$(jq -n \
            --arg ref "$REF" \
            --arg machine "$MACHINE" \
            --arg name "$DISPLAY" \
            '{ref: $ref, machine: $machine, display_name: $name}')
          echo "request body (no secrets): $body"
          resp=$(curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/timerloggedout-spec/termux-monorepo/codespaces" \
            -d "$body")
          echo "$resp" | jq '{name, id, state, machine: .machine.name, web_url, created_at, message, documentation_url}' 2>/dev/null || echo "$resp"
          name=$(echo "$resp" | jq -r '.name // empty')
          web=$(echo "$resp" | jq -r '.web_url // empty')
          if [ -z "$name" ]; then
            echo "::error::Codespace create failed"
            echo "$resp" | jq . 2>/dev/null || echo "$resp"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "web_url=$web" >> "$GITHUB_OUTPUT"
          {
            echo "### Codespace created"
            echo "- **name:** \`$name\`"
            echo "- **url:** $web"
            echo "- **ref:** \`$REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List codespaces (evidence)
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_CREATE_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN }}
        run: |
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/timerloggedout-spec/termux-monorepo/codespaces" \
            | jq '[.codespaces[]? | {name, state, machine: .machine.name, web_url, created_at}]' \
            || true
