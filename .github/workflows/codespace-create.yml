name: Codespace create (dispatch)

# create | start | list — ARCHWIZ/OPERATOR secret chain. Never print values.

on:
  workflow_dispatch:
    inputs:
      action:
        description: create | start | list
        required: false
        default: list
      ref:
        description: Branch for create (default master)
        required: false
        default: master
      display_name:
        description: Display name when creating
        required: false
        default: agent-bifrost-006
      codespace_name:
        description: Codespace name when action=start
        required: false
        default: agent-bifrost-006-5g7qvg7pqjggh4jqv

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve token
        env:
          HAS_CS: ${{ secrets.CODESPACE_CREATE_TOKEN != '' }}
          HAS_ARCHWIZ: ${{ secrets.ARCHWIZ_GITHUB_TOKEN != '' }}
          HAS_OP_GH: ${{ secrets.OPERATOR_GITHUB_TOKEN != '' }}
          HAS_OP: ${{ secrets.OPERATOR_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "secrets present CS=$HAS_CS ARCHWIZ=$HAS_ARCHWIZ OP_GH=$HAS_OP_GH OP=$HAS_OP"
          if [ "$HAS_CS" != "true" ] && [ "$HAS_ARCHWIZ" != "true" ] && [ "$HAS_OP_GH" != "true" ] && [ "$HAS_OP" != "true" ]; then
            echo "::error::No privileged GH token secret"
            exit 1
          fi

      - name: List codespaces
        if: ${{ inputs.action == 'list' || inputs.action == 'start' || inputs.action == 'create' }}
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_CREATE_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN }}
        run: |
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/timerloggedout-spec/termux-monorepo/codespaces" \
            | jq '[.codespaces[]? | {name, state, machine: .machine.name, web_url, created_at}]'

      - name: Start codespace
        if: ${{ inputs.action == 'start' }}
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_CREATE_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN }}
          CS_NAME: ${{ inputs.codespace_name }}
        run: |
          set -euo pipefail
          resp=$(curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/codespaces/${CS_NAME}/start")
          echo "$resp" | jq '{name, state, machine: .machine.name, web_url}' 2>/dev/null || echo "$resp"
          state=$(echo "$resp" | jq -r '.state // empty')
          if [ -z "$state" ]; then
            echo "::error::Start failed for $CS_NAME"
            echo "$resp" | jq . 2>/dev/null || echo "$resp"
            exit 1
          fi
          echo "### Started \`$CS_NAME\` → $state" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $(echo "$resp" | jq -r '.web_url')" >> "$GITHUB_STEP_SUMMARY"

      - name: Last-used names only
        if: ${{ inputs.action == 'list' || inputs.action == 'start' || inputs.action == 'create' }}
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_CREATE_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          # Issue #184 evidence is names and timestamps only. Never print token material.
          curl -sS -o /tmp/codespaces.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/timerloggedout-spec/termux-monorepo/codespaces" > /tmp/codespaces.status
          status=$(cat /tmp/codespaces.status)
          if [ "$status" != "200" ]; then
            echo "::warning::Codespace list HTTP $status; last-used receipt skipped"
            exit 0
          fi
          jq -r '[.codespaces[]? | {name, state, created_at, last_used_at}]' /tmp/codespaces.json > /tmp/codespaces.names.json
          count=$(jq 'length' /tmp/codespaces.names.json)
          echo "codespace_count=$count" >> "$GITHUB_ENV"
          {
            echo "### Codespace last-used (names only)"
            echo ""
            echo "count: $count"
            echo '```json'
            cat /tmp/codespaces.names.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create codespace
        if: ${{ inputs.action == 'create' }}
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_CREATE_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN }}
          REF: ${{ inputs.ref }}
          DISPLAY: ${{ inputs.display_name }}
        run: |
          set -euo pipefail
          quota_skip() {
            echo "::warning::Codespace create skipped: $1"
            {
              echo "### Codespace create skipped"
              echo "$1"
              echo "Historical class: run 36970871999 on b265eb49 exited 1 before the message matcher landed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          # Local cap, not the GitHub quota API. Historical failure 36970871999
          # exited before the POST message matcher. Receipt 84e48b1b did not emit
          # pull_request synchronize runs, so this comment re-arms repo gate.
          if [ "${codespace_count:-0}" -ge 8 ]; then
            quota_skip "preflight count ${codespace_count} already at local cap; not posting create"
          fi
          body=$(jq -n --arg ref "$REF" --arg name "$DISPLAY" '{ref: $ref, display_name: $name}')
          resp=$(curl -sS -o /tmp/create.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/timerloggedout-spec/termux-monorepo/codespaces" \
            -d "$body")
          message=$(jq -r '[.message, (.errors[]?.message // empty)] | map(select(. != null and . != "")) | join(" ")' /tmp/create.json)
          name=$(jq -r '.name // empty' /tmp/create.json)
          echo "create_http=$resp"
          jq '{name, state, machine: .machine.name, web_url, message}' /tmp/create.json 2>/dev/null || true
          if [ -z "$name" ]; then
            case "$message" in
              *"too many codespaces"*|*"quota"*|*"rate limit"*|*"Too many"*)
                quota_skip "$message"
                ;;
            esac
            if [ "$resp" = "429" ] || [ "$resp" = "403" ]; then
              quota_skip "HTTP $resp $message"
            fi
            echo "::error::Create failed HTTP $resp"
            exit 1
          fi
          echo "### Created \`$name\`" >> "$GITHUB_STEP_SUMMARY"
