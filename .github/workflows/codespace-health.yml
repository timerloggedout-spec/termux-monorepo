name: Codespace health (dispatch)

on:
  workflow_dispatch:
    inputs:
      name:
        description: Existing Codespace name to inspect
        required: true
        type: string
      start_if_shutdown:
        description: Start when state is Shutdown
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_CREATE_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN }}
          CS_NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          resp=$(curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/user/codespaces/${CS_NAME}")
          echo "$resp" | jq '{name,state,machine:.machine.name,web_url,last_used_at}'
          state=$(echo "$resp" | jq -r '.state // empty')
          test -n "$state"
          if [ "$state" = "Shutdown" ] && [ "${{ inputs.start_if_shutdown }}" = "true" ]; then
            start_body=$(mktemp)
            start_status=$(curl -sS -o "$start_body" -w '%{http_code}' -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/codespaces/${CS_NAME}/start")
            case "$start_status" in
              2*) ;;
              *) echo "::error::Codespace start request failed with HTTP $start_status"; cat "$start_body"; exit 1 ;;
            esac
            start=$(cat "$start_body")
            start_state=$(echo "$start" | jq -r '.state // empty')
            if [ -z "$start_state" ]; then
              echo "::error::Codespace start response did not contain state"
              echo "$start"
              exit 1
            fi
            echo "$start" | jq '{name,state,machine:.machine.name,web_url,last_used_at}'
          fi
