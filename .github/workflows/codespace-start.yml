name: Codespace start (dispatch)

on:
  workflow_dispatch:
    inputs:
      name:
        description: Codespace name (e.g. agent-bifrost-006-5g7qvg7pqjggh4jqv)
        required: true

permissions:
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_CREATE_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN }}
          CS_NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          # POST /user/codespaces/{codespace_name}/start
          resp=$(curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/codespaces/${CS_NAME}/start")
          echo "$resp" | jq '{name, state, machine: .machine.name, web_url, last_used_at}' 2>/dev/null || echo "$resp"
          state=$(echo "$resp" | jq -r '.state // empty')
          web=$(echo "$resp" | jq -r '.web_url // empty')
          if [ -z "$state" ]; then
            echo "::error::Start failed"
            echo "$resp" | jq . 2>/dev/null || echo "$resp"
            exit 1
          fi
          {
            echo "### Codespace start"
            echo "- **name:** \`$CS_NAME\`"
            echo "- **state:** $state"
            echo "- **url:** $web"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List codespaces
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_CREATE_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN }}
        run: |
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/timerloggedout-spec/termux-monorepo/codespaces" \
            | jq '[.codespaces[]? | {name, state, machine: .machine.name, web_url}]'
