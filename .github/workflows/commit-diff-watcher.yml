name: '🛡️ Direct Master Empty-Commit Watcher'

# PR history/diff measurement lives in pr-change-effectiveness-ledger.yml.
# This workflow is deliberately narrow: it catches empty automated commits
# pushed directly to protected branches. It does not duplicate PR analysis.
on:
  push:
    branches:
      - 'master'
      - 'master-staging'

concurrency:
  group: direct-master-empty-commit-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: 'Check direct pushes for empty automated commits'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted repository history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Analyze pushed commits
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          empty=()
          while read -r sha; do
            [[ -z "$sha" ]] && continue
            parent="$(git rev-parse "${sha}^" 2>/dev/null || true)"
            files=0
            if [[ -n "$parent" ]]; then
              files="$(git diff --name-only "$parent" "$sha" | wc -l | tr -d ' ')"
            else
              files="$(git diff-tree --root --no-commit-id --name-only -r "$sha" | wc -l | tr -d ' ')"
            fi
            if [[ "$files" -eq 0 ]]; then
              author="$(git show -s --format='%an <%ae>' "$sha")"
              empty+=("$sha $author")
            fi
          done < <(git rev-list --reverse "${{ github.event.before }}..${{ github.sha }}")

          if [[ "${#empty[@]}" -eq 0 ]]; then
            echo 'No empty direct-push commits observed.'
            exit 0
          fi

          body='<!-- direct-master-empty-commit-watcher:v2 -->
          ## 🛡️ Empty direct-push commit detected

          The pushed range contains commit(s) with no file-tree delta:

          '
          for item in "${empty[@]}"; do
            body+="- \\`${item%% *}\\` — ${item#* }\n"
          done
          body+='\nPR commit effectiveness is measured by `pr-change-effectiveness-ledger.yml`; this watcher only covers direct pushes to protected branches.'

          # Issue #1 is intentionally not targeted: direct-push telemetry is
          # logged in the workflow run rather than generating noisy PR comments.
          printf '%b\n' "$body"
          exit 1
