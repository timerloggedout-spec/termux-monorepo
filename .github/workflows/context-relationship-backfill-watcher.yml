name: context relationship backfill watcher

on:
  workflow_run:
    workflows: ["context relationship historical backfill"]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: context-relationship-backfill-watcher-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  observe:
    name: observe runtime progression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture runtime state and jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_ACTION: ${{ github.event.action }}
          STATUS: ${{ github.event.workflow_run.status }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          jobs_json=$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")
          artifacts_json=$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")
          JOBS_JSON="$jobs_json" ARTIFACTS_JSON="$artifacts_json" python3 - <<'PY' > runtime-observation.json
          import json, os
          jobs = json.loads(os.environ["JOBS_JSON"])
          artifacts = json.loads(os.environ["ARTIFACTS_JSON"])
          observation = {
              "schema": "context-relationship-backfill-watcher/v1",
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "event_action": os.environ["EVENT_ACTION"],
              "status": os.environ["STATUS"],
              "conclusion": os.environ.get("CONCLUSION") or None,
              "head_sha": os.environ["HEAD_SHA"],
              "head_branch": os.environ["HEAD_BRANCH"],
              "run_url": os.environ["RUN_URL"],
              "jobs": [
                  {"name": j.get("name"), "status": j.get("status"), "conclusion": j.get("conclusion"),
                   "started_at": j.get("started_at"), "completed_at": j.get("completed_at"),
                   "steps": [{"name": s.get("name"), "status": s.get("status"), "conclusion": s.get("conclusion")} for s in (j.get("steps") or [])]}
                  for j in jobs.get("jobs", [])
              ],
              "artifacts": [
                  {"name": a.get("name"), "expired": a.get("expired"), "size_in_bytes": a.get("size_in_bytes")}
                  for a in artifacts.get("artifacts", [])
              ],
              "observer_only": True,
          }
          print(json.dumps(observation, indent=2, sort_keys=True))
          PY
          JOBS_JSON="$jobs_json" ARTIFACTS_JSON="$artifacts_json" python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ["JOBS_JSON"])
          artifacts = json.loads(os.environ["ARTIFACTS_JSON"])
          summary = {
              "job_count": len(jobs.get("jobs", [])),
              "jobs": [{"name": j.get("name"), "status": j.get("status"), "conclusion": j.get("conclusion")} for j in jobs.get("jobs", [])],
              "artifact_count": len(artifacts.get("artifacts", [])),
              "artifacts": [{"name": a.get("name"), "expired": a.get("expired")} for a in artifacts.get("artifacts", [])],
          }
          with open("runtime-summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, indent=2, sort_keys=True)
              f.write("\n")
          PY

      - name: Publish watcher receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          STATUS: ${{ github.event.workflow_run.status }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          body=$(python3 - <<'PY'
          import json, os
          summary = json.load(open("runtime-summary.json", encoding="utf-8"))
          print(f"## Backfill runtime observation — run {os.environ['RUN_ID']}\n")
          print(f"- **Status:** `{os.environ['STATUS']}`")
          print(f"- **Conclusion:** `{os.environ.get('CONCLUSION') or 'pending'}`")
          print(f"- **SHA:** `{os.environ['HEAD_SHA']}`")
          print(f"- **Jobs:** {summary['job_count']}")
          for job in summary['jobs']:
              print(f"  - `{job['name']}` — `{job['status']}` / `{job['conclusion'] or 'pending'}`")
          print(f"- **Artifacts:** {summary['artifact_count']}")
          for artifact in summary['artifacts']:
              print(f"  - `{artifact['name']}` (expired={artifact['expired']})")
          print(f"\nEvidence: {os.environ['RUN_URL']}\n\nObserver only; this watcher does not rerun or mutate the backfill.")
          PY
          )
          existing=$(gh issue list --repo "$REPOSITORY" --state open --search 'in:title "[Backfill Watch] Context relationship historical continuation"' --json number --limit 1)
          number=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["number"] if d else "")' <<<"$existing")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPOSITORY" --body "$body"
          else
            gh issue create --repo "$REPOSITORY" --title '[Backfill Watch] Context relationship historical continuation' --body "$body"
          fi

      - name: Upload structured watcher observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: context-relationship-backfill-watch-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: runtime-*.json
          retention-days: 14
