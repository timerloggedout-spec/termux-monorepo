name: context relationship historical backfill

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Maximum issues and pull requests per family in this bounded continuation window.'
        type: string
        default: '100'
      max_commits:
        description: 'Maximum commits in this bounded continuation window.'
        type: string
        default: '100'

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: context-relationship-writer-master
  cancel-in-progress: false

jobs:
  backfill:
    name: autonomous current-master historical graph continuation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Resolve resumable page from canonical manifest
        id: page
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess
          from pathlib import Path

          manifest = Path('workspace/llm_map/context_relationships/manifest.json')
          if not manifest.exists():
              start_page = 1
              complete = False
          else:
              data = json.loads(manifest.read_text(encoding='utf-8'))
              next_page = data.get('history_window', {}).get('next_start_page')
              start_page = int(next_page) if next_page is not None else 0
              complete = next_page is None

          print(f"start_page={start_page}")
          print(f"complete={'true' if complete else 'false'}")
          print(f"source_sha={subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()}")
          PY

      - name: Stop cleanly when canonical corpus is complete
        if: steps.page.outputs.complete == 'true'
        run: |
          echo 'Historical corpus reports next_start_page=null; no continuation required.'
          exit 0

      - name: Build one bounded historical relationship-index window
        if: steps.page.outputs.complete != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HISTORY_START_PAGE: ${{ steps.page.outputs.start_page }}
          MAX_ITEMS: ${{ inputs.max_items || '100' }}
          MAX_COMMITS: ${{ inputs.max_commits || '100' }}
        run: |
          set -euo pipefail
          test "$HISTORY_START_PAGE" -ge 1
          python -m archwiz.context_relationships.build_index \
            --root . \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --ref master \
            --history-start-page "$HISTORY_START_PAGE" \
            --max-items "$MAX_ITEMS" \
            --max-commits "$MAX_COMMITS" \
            --max-comments-per-item 10 \
            --max-cochange-pairs-per-commit 100 \
            --full-refresh

      - name: Validate continuation metadata
        if: steps.page.outputs.complete != 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('workspace/llm_map/context_relationships')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          summary = json.loads((root / 'build-summary.json').read_text(encoding='utf-8'))
          start = int('${{ steps.page.outputs.start_page }}')
          next_page = manifest.get('history_window', {}).get('next_start_page')
          if next_page is not None and int(next_page) <= start:
              raise SystemExit(f'next_start_page did not advance: start={start} next={next_page}')
          summary_window = summary.get('history_window', {})
          if summary_window.get('start_page') not in (start, str(start)):
              raise SystemExit('build-summary start_page does not match the resumed page')
          print(json.dumps({
              'source_sha': '${{ steps.page.outputs.source_sha }}',
              'start_page': start,
              'next_start_page': next_page,
              'manifest_sha': hashlib.sha256((root / 'manifest.json').read_bytes()).hexdigest(),
              'summary_sha': hashlib.sha256((root / 'build-summary.json').read_bytes()).hexdigest(),
          }, indent=2))
          PY

      - name: Publish backfill coverage summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo '## Context relationship historical backfill'
            echo
            echo 'This workflow resumes from the canonical master manifest and publishes one bounded window per run.'
            echo
            echo '```json'
            cat workspace/llm_map/context_relationships/build-summary.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit canonical historical delta
        if: steps.page.outputs.complete != 'true' && success()
        run: |
          set -euo pipefail
          git add workspace/llm_map/context_relationships
          if git diff --cached --quiet; then
            echo 'No historical relationship-index delta to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'chore(context): continue historical relationship backfill' \
            -m 'Implements: CRG-10' \
            -m 'Agent-Identity: GitHub Actions Context Indexer' \
            -m 'Task-Ref: #522'
          git push origin HEAD:master
