name: context relationship historical backfill

on:
  # Historical collection is anchored to canonical master; continuation is page-bounded and resumable.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      history_start_page:
        description: 'Optional GitHub REST history page. Empty means resume from the canonical manifest.'
        type: string
        default: ''
      max_items:
        description: 'Maximum issues and pull requests per family in this explicit page window.'
        type: string
        default: '100'
      max_commits:
        description: 'Maximum commits in this explicit history window.'
        type: string
        default: '100'

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: context-relationship-writer-master
  cancel-in-progress: false

jobs:
  backfill:
    name: operator-controlled historical graph backfill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Determine historical continuation
        id: continuation
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
import json
from pathlib import Path
manifest = Path('workspace/llm_map/context_relationships/manifest.json')
if not manifest.exists():
    print('continue=true')
    print('start_page=1')
else:
    data = json.loads(manifest.read_text(encoding='utf-8'))
    next_page = data.get('history_window', {}).get('next_start_page')
    if next_page is None:
        print('continue=false')
    else:
        print('continue=true')
        print(f'start_page={next_page}')
PY

      - name: Build one historical relationship-index window
        if: steps.continuation.outputs.continue == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HISTORY_START_PAGE: ${{ github.event.inputs.history_start_page || steps.continuation.outputs.start_page }}
          MAX_ITEMS: ${{ github.event.inputs.max_items || '100' }}
          MAX_COMMITS: ${{ github.event.inputs.max_commits || '100' }}
        run: |
          set -euo pipefail
          python -m archwiz.context_relationships.build_index \
            --root . \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --ref master \
            --history-start-page "$HISTORY_START_PAGE" \
            --max-items "$MAX_ITEMS" \
            --max-commits "$MAX_COMMITS" \
            --max-comments-per-item 10 \
            --max-cochange-pairs-per-commit 100 \
            --full-refresh

      - name: Publish backfill coverage summary
        if: steps.continuation.outputs.continue == 'true'
        run: |
          set -euo pipefail
          {
            echo '## Context relationship historical backfill'
            echo
            echo "Resume only when \`history_window.next_start_page\` is non-null."
            echo
            echo '```json'
            cat workspace/llm_map/context_relationships/build-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit canonical historical delta
        run: |
          set -euo pipefail
          git add workspace/llm_map/context_relationships
          if git diff --cached --quiet; then
            echo 'No historical relationship-index delta to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'chore(context): backfill relationship history' \
            -m 'Implements: CRG-10' \
            -m 'Agent-Identity: GitHub Actions Context Indexer' \
            -m 'Task-Ref: CRG-10'
          git push origin HEAD:master

      - name: Publish completion state
        if: steps.continuation.outputs.continue != 'true'
        run: |
          {
            echo '## Context relationship historical backfill'
            echo
            echo 'Canonical historical corpus is already complete; no new page window was collected.'
          } >> "$GITHUB_STEP_SUMMARY"
