name: Context Relationship Rust Accelerator

on:
  pull_request:
    paths:
      - "archwiz/context_relationships/rust_accel/**"
      - "archwiz/context_relationships/rust_accel.py"
      - "archwiz/context_relationships/source_collector.py"
      - "tests/test_context_relationship_rust_accel.py"
      - ".github/workflows/context-relationship-rust-accel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-relationship-rust-accel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archwiz/context_relationships/rust_accel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
  python-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Adapter tests
        run: python -m pytest tests/test_context_relationship_rust_accel.py -q
