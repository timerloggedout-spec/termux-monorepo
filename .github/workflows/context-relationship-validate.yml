name: context relationship validation

on:
  pull_request:
    paths:
      - 'archwiz/context_relationships/**'
      - 'config/context_relationships/**'
      - 'tests/test_context_relationship_*.py'
      - 'tests/test_context_temporal_lineage.py'
      - 'tests/test_context_temporal_query.py'
      - 'archwiz/context_relationships/temporal_query.py'
      - 'scripts/ci/verify_context_temporal_lineage.py'
      - 'tests/fixtures/context_relationships/**'
      - '.github/workflows/context-relationship-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-relationship-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: schema, collectors, query, and diagram contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Validate relationship-index behavior
        run: |
          python -m pytest \
            tests/test_context_temporal_lineage.py \
            tests/test_context_relationship_compiler.py \
            tests/test_context_relationship_source_collector.py \
            tests/test_context_relationship_github_collector.py \
            tests/test_context_relationship_seed_merger.py \
            tests/test_context_relationship_query.py \
            tests/test_context_temporal_query.py \
            tests/test_context_relationship_build_index.py \
            tests/test_context_relationship_rust_accel.py \
            -q
          python -m archwiz.context_relationships.compiler \
            --input tests/fixtures/context_relationships/seed.json \
            --validate

      - name: Validate committed temporal lineage when present
        run: |
          set -euo pipefail
          lineage=workspace/llm_map/context_relationships/temporal/lineage.jsonl
          manifest=workspace/llm_map/context_relationships/manifest.json
          if [ -f "$lineage" ] && [ -f "$manifest" ]; then
            python scripts/ci/verify_context_temporal_lineage.py \
              --lineage "$lineage" \
              --manifest "$manifest"
          else
            echo 'Temporal corpus lineage not present in this candidate; runtime corpus validation remains authoritative.'
          fi

  rust-accelerator:
    name: Rust accelerator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: archwiz/context_relationships/rust_accel
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release executable
        run: cargo build --release

      - name: Remote deterministic processing and parity receipt
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > /tmp/crg-parity-input.jsonl <<'EOF'
          {"id":"parity-a","level":"function","text":"fn repeated_fragment() { return 42; }","children":[],"bytes":38}
          {"id":"parity-b","level":"function","text":"fn repeated_fragment() { return 42; }","children":[],"bytes":38}
          EOF

          ./target/release/crg-rust-accel < /tmp/crg-parity-input.jsonl > /tmp/crg-parity-output.json
          SOURCE_SHA="$SOURCE_SHA" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source = Path('/tmp/crg-parity-input.jsonl').read_bytes()
          output = Path('/tmp/crg-parity-output.json').read_bytes()
          data = json.loads(output)

          assert isinstance(data.get('fingerprints'), list)
          assert len(data['fingerprints']) == 2
          assert data['fingerprints'][0]['full_hash'] == data['fingerprints'][1]['full_hash']
          assert data['fingerprints'][0]['ref_id'] == data['fingerprints'][1]['ref_id']
          assert all('text' not in item and 'source' not in item for item in data['fingerprints'])

          policies = data.get('policies', [])
          assert policies, 'deterministic fixture must exercise pointer policy'
          assert any(policy['pointer'] for policy in policies), 'repeated fixture must produce a pointer candidate'

          receipt = {
              'contract': 'context-relationship-remote-parity-v1',
              'source_sha': os.environ['SOURCE_SHA'],
              'input_sha256': hashlib.sha256(source).hexdigest(),
              'output_sha256': hashlib.sha256(output).hexdigest(),
              'fingerprints': len(data['fingerprints']),
              'policies': len(policies),
              'parity': 'validated',
          }
          print(json.dumps(receipt, sort_keys=True))
          PY
