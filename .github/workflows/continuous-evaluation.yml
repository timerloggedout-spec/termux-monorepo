name: Continuous Team Evaluation

on:
  workflow_dispatch:
    inputs:
      target_number:
        description: 'Issue/PR reference for the evaluation task (metadata only; no receipt comments)'
        required: true
        default: '337'
        type: string
      refs:
        description: 'Comma-separated historical refs/SHA values to evaluate'
        required: true
        default: 'HEAD,HEAD~1,HEAD~2'
        type: string
      manager:
        description: 'Manager policy identifier'
        required: true
        default: free-capacity-first
        type: choice
        options: [baseline-peer-first, free-capacity-first, parallel-then-integrate]
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [master]
    paths:
      - 'scripts/provider_model_catalog.py'
      - 'scripts/model_performance_index.py'
      - '.github/actions/http-llm-invoke/action.yml'
      - '.github/workflows/continuous-evaluation.yml'
      - 'docs/ops/AGENT-TEAM-ORCHESTRATION.md'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Poll live provider catalogs and account-facing response metadata
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FELO_AI_API: ${{ secrets.FELO_AI_API }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/provider_model_catalog.py --providers openrouter,felo,omni --output /tmp/model-catalog.json
          echo '### Live provider catalog' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('/tmp/model-catalog.json', encoding='utf-8'))
          print(f"Observed: `{d['observed_at']}`")
          for r in d['models']:
              eligible=(r['pricing_classification']=='free_zero_price' or r['free_suffix'] or r['access_classification']=='free_trial')
              if eligible:
                  print(f"- 🔬 {r['provider']}/{r['id']} [price={r['pricing_classification']}; access={r['access_classification']}; source={r.get('access_source') or r['raw_source']}]")
          for e in d['errors']:
              print(f"- ⚠️ {e['provider']}: {e['error']}")
          PY

      - name: Build dynamic MVT matrix from current eligible library
        id: matrix
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          d=json.load(open('/tmp/model-catalog.json', encoding='utf-8'))
          rows=[]
          seen=set()
          for r in d['models']:
              eligible=(r['pricing_classification']=='free_zero_price' or r['free_suffix'] or r['access_classification']=='free_trial')
              if not eligible:
                  continue
              provider=r['provider']; model=r['id']
              key=(provider,model)
              if key in seen:
                  continue
              seen.add(key)
              safe=re.sub(r'[^A-Za-z0-9_.-]+','-',model).strip('-')[:90] or 'model'
              is_ox='ox-alpha' in model.lower()
              if provider=='felo' and is_ox:
                  variant='adversarial-ox-alpha'
                  quota_class='free-trial'
              elif provider=='felo':
                  variant='daily-credit-mvt'
                  quota_class='daily-credit'
              elif provider=='openrouter' and is_ox:
                  variant='baseline-ox-alpha'
                  quota_class='free-zero'
              else:
                  variant='independent-peer'
                  quota_class='free-zero'
              rows.append({'lane':f'{provider}-{safe}','provider':provider,'model':model,'prompt_variant':variant,'quota_class':quota_class})
          rows.sort(key=lambda x:(x['provider'],x['model']))
          matrix=json.dumps({'include':rows},separators=(',',':'))
          print('matrix='+matrix)
          print(f'matrix_count={len(rows)}')
          PY
          COUNT=$(grep '^matrix_count=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          echo "Dynamic candidates: ${COUNT}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload catalog snapshot
        uses: actions/upload-artifact@v4
        with:
          name: provider-catalog-${{ github.run_id }}
          path: /tmp/model-catalog.json

  experiment:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve experiment cohort and rotating manager
        id: cohort
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REFS: ${{ inputs.refs }}
          INPUT_MANAGER: ${{ inputs.manager }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            REFS="$INPUT_REFS"; MANAGER="$INPUT_MANAGER"
          else
            REFS="HEAD"
            MANAGER=$(python3 -c "import time; p=['baseline-peer-first','free-capacity-first','parallel-then-integrate']; print(p[(int(time.time())//900)%len(p)])")
          fi
          echo "manager=$MANAGER" >> "$GITHUB_OUTPUT"
          echo "refs=$REFS" >> "$GITHUB_OUTPUT"

      - name: Poll live catalog again before invocation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FELO_AI_API: ${{ secrets.FELO_AI_API }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/provider_model_catalog.py --providers "${{ matrix.provider }}" --output /tmp/model-catalog.json

      - name: Verify dynamic candidate is still eligible
        id: candidate
        env:
          PROVIDER: ${{ matrix.provider }}
          MODEL: ${{ matrix.model }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/model-catalog.json', encoding='utf-8'))
          p=os.environ['PROVIDER']; m=os.environ['MODEL']
          rows=[r for r in d['models'] if r['provider']==p and r['id']==m]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              if not rows:
                  reason='stale-or-unavailable'
                  print(f'::notice::{p}/{m} disappeared from live catalog; recording candidate skip ({reason})')
                  output.write(f'eligible=false\nskip_reason={reason}\n')
                  raise SystemExit(0)
              r=rows[0]
              eligible=(r['pricing_classification']=='free_zero_price' or r['free_suffix'] or r['access_classification']=='free_trial')
              reason='eligible' if eligible else 'catalog-no-longer-eligible'
              print(f"{p}/{m}: eligible={eligible} pricing={r['pricing_classification']} access={r['access_classification']} reason={reason}")
              output.write(f'eligible={str(eligible).lower()}\nskip_reason={reason}\n')
          PY

      - name: Create immutable evaluation epoch metadata
        run: |
          set -euo pipefail
          mkdir -p /tmp/evaluation
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          catalog = Path('/tmp/model-catalog.json').read_bytes()
          head = os.popen('git rev-parse HEAD').read().strip()
          catalog_sha = hashlib.sha256(catalog).hexdigest()
          seed = ':'.join([os.environ.get('GITHUB_RUN_ID',''), os.environ.get('GITHUB_RUN_ATTEMPT','1'), head, '${{ matrix.provider }}', '${{ matrix.model }}', '${{ steps.cohort.outputs.manager }}', catalog_sha])
          epoch_id = 'eval-' + hashlib.sha256(seed.encode()).hexdigest()[:24]
          Path('/tmp/evaluation/epoch.json').write_text(json.dumps({'schema':'evaluation-epoch/v1','epoch_id':epoch_id,'run_id':int(os.environ.get('GITHUB_RUN_ID','0')),'run_attempt':int(os.environ.get('GITHUB_RUN_ATTEMPT','1')),'head_sha':head,'catalog_sha256':catalog_sha,'provider':'${{ matrix.provider }}','model':'${{ matrix.model }}','manager':'${{ steps.cohort.outputs.manager }}'}, indent=2) + '\\n')
          print('epoch_id='+epoch_id)
          print('head_sha='+head)
          print('catalog_sha256='+catalog_sha)
          PY

      - name: Snapshot repository history without mutation
        env:
          REFS: ${{ steps.cohort.outputs.refs }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/evaluation
          IFS=',' read -ra ITEMS <<< "$REFS"
          for ref in "${ITEMS[@]}"; do
            ref=$(echo "$ref" | xargs); [ -n "$ref" ] || continue
            git rev-parse "$ref^{commit}" >> /tmp/evaluation/resolved-refs.txt
          done
          sort -u /tmp/evaluation/resolved-refs.txt > /tmp/evaluation/resolved-refs.unique.txt
          cp /tmp/model-catalog.json /tmp/evaluation/model-catalog.json

      - name: Build MVT prompt
        id: prompt
        env:
          PROVIDER: ${{ matrix.provider }}
          MODEL: ${{ matrix.model }}
          MANAGER: ${{ steps.cohort.outputs.manager }}
          REFS: ${{ steps.cohort.outputs.refs }}
          VARIANT: ${{ matrix.prompt_variant }}
          QUOTA_CLASS: ${{ matrix.quota_class }}
        run: |
          set -euo pipefail
          {
            echo 'prompt<<EOF'
            echo "You are one player in the termux-monorepo Agent Team Moneyball experiment. Manager=${MANAGER}. Provider=${PROVIDER}. Model=${MODEL}. PromptVariant=${VARIANT}. QuotaClass=${QUOTA_CLASS}. Cohort refs=${REFS}."
            case "$VARIANT" in
              baseline-ox-alpha) echo 'Evaluate issue #337 as the baseline OX Alpha treatment. Give one concrete improvement, one risk, and PASS/FAIL. Do not fabricate tool access.';;
              adversarial-ox-alpha) echo 'Adversarial OX Alpha treatment: attempt to falsify the #337 measurement system. Identify one counterexample, one guard, and PASS/FAIL. Distinguish provider capability, trial access, account quota, and pricing.';;
              daily-credit-mvt) echo 'Felo daily-credit MVT treatment. Evaluate a different repository-specific orchestration question than the OX Alpha treatment. Record usefulness and any quota/rate-limit evidence.';;
              *) echo 'Independent peer treatment. Identify the highest-risk engineering defect in #337, give PASS/FAIL, and name evidence required to change the result.';;
            esac
            echo 'Correctness and integrated working outcome outrank latency. Do not modify files.'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Invoke live candidate with uncapped provider/model response capability
        id: invoke
        if: steps.candidate.outputs.eligible == 'true'
        continue-on-error: true
        uses: ./.github/actions/http-llm-invoke
        with:
          provider: ${{ matrix.provider }}
          model: ${{ matrix.model }}
          role: review
          target_number: ${{ inputs.target_number || '337' }}
          api_key: ${{ matrix.provider == 'felo' && secrets.FELO_AI_API || matrix.provider == 'omni' && secrets.OMNI_API_KEY || secrets.OPENROUTER_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          experiment_id: "${{ github.run_id }}:${{ matrix.lane }}:${{ matrix.prompt_variant }}"
          prompt_variant: ${{ matrix.prompt_variant }}
          max_tokens: '131072'
          post_comment: 'false'
          prompt: ${{ steps.prompt.outputs.prompt }}

      - name: Expose invocation telemetry in audit logs
        if: always()
        run: |
          if [ -f /tmp/model-performance/observations.ndjson ]; then
            echo '### Immutable invocation observation'
            cat /tmp/model-performance/observations.ndjson
          else
            echo '### No provider invocation observation (lane skipped)'
          fi

      - name: Write immutable experiment manifest
        if: always()
        env:
          PROVIDER: ${{ matrix.provider }}
          MODEL: ${{ matrix.model }}
          MANAGER: ${{ steps.cohort.outputs.manager }}
          RUN_ID: ${{ github.run_id }}
          LANE: ${{ matrix.lane }}
          VARIANT: ${{ matrix.prompt_variant }}
          QUOTA_CLASS: ${{ matrix.quota_class }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('/tmp/evaluation/manifest.json'); refs=pathlib.Path('/tmp/evaluation/resolved-refs.unique.txt')
          p.write_text(json.dumps({'schema':'team-evaluation/v6','run_id':os.environ['RUN_ID'],'lane':os.environ['LANE'],'manager':os.environ['MANAGER'],'provider':os.environ['PROVIDER'],'model':os.environ['MODEL'],'prompt_variant':os.environ['VARIANT'],'quota_class':os.environ['QUOTA_CLASS'],'epoch':json.loads(pathlib.Path('/tmp/evaluation/epoch.json').read_text()),'refs':refs.read_text().splitlines() if refs.exists() else []},indent=2)+'\n')
          PY

      - name: Upload immutable evaluation ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-evaluation-${{ github.run_id }}-${{ matrix.lane }}
          path: |
            /tmp/evaluation
            /tmp/model-performance/observations.ndjson
          if-no-files-found: ignore

