name: Continuous Team Evaluation

on:
  workflow_dispatch:
    inputs:
      target_number:
        description: 'Issue/PR receiving the experiment ledger'
        required: true
        default: '337'
        type: string
      refs:
        description: 'Comma-separated historical refs/SHA values to evaluate'
        required: true
        default: 'HEAD,HEAD~1,HEAD~2'
        type: string
      manager:
        description: 'Manager policy identifier'
        required: true
        default: free-capacity-first
        type: choice
        options: [baseline-peer-first, free-capacity-first, parallel-then-integrate]
      probe_felo_ox_alpha:
        description: 'Force an explicit Felo OX Alpha probe (documented free-trial candidate)'
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [master]
    paths:
      - 'scripts/provider_model_catalog.py'
      - 'scripts/model_performance_index.py'
      - '.github/actions/http-llm-invoke/action.yml'
      - '.github/workflows/continuous-evaluation.yml'
      - 'docs/ops/AGENT-TEAM-ORCHESTRATION.md'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - lane: A-openrouter-ox
            provider: openrouter
            model_selector: ox-alpha
            prompt_variant: baseline
          - lane: B-openrouter-peer
            provider: openrouter
            model_selector: other-free
            prompt_variant: independent
          - lane: C-felo-ox
            provider: felo
            model_selector: ox-alpha
            prompt_variant: adversarial
          - lane: D-omni-peer
            provider: omni
            model_selector: free-or-zero
            prompt_variant: synthesis
          - lane: E-felo-peer-daily
            provider: felo
            model_selector: other-free
            prompt_variant: daily-quota-mvt

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve experiment cohort and rotating manager
        id: cohort
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REFS: ${{ inputs.refs }}
          INPUT_MANAGER: ${{ inputs.manager }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            REFS="$INPUT_REFS"; MANAGER="$INPUT_MANAGER"
          else
            REFS="HEAD"
            MANAGER=$(python3 -c "import time; p=['baseline-peer-first','free-capacity-first','parallel-then-integrate']; print(p[(int(time.time())//900)%len(p)])")
          fi
          echo "manager=$MANAGER" >> "$GITHUB_OUTPUT"
          echo "refs=$REFS" >> "$GITHUB_OUTPUT"

      - name: Poll live provider catalogs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FELO_AI_API: ${{ secrets.FELO_AI_API }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/provider_model_catalog.py --providers openrouter,felo,omni --output /tmp/model-catalog.json
          echo '### Live provider catalog' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('/tmp/model-catalog.json', encoding='utf-8'))
          print(f"Observed: `{d['observed_at']}`")
          for r in d['models']:
              if r['pricing_classification']=='free_zero_price' or r['free_suffix'] or r['access_classification']=='free_trial' or 'ox-alpha' in r['id'].lower():
                  print(f"- 🔬 {r['provider']}/{r['id']} [price={r['pricing_classification']}; access={r['access_classification']}; source={r.get('access_source') or r['raw_source']}]")
          for e in d['errors']:
              print(f"- ⚠️ {e['provider']}: {e['error']}")
          PY

      - name: Select lane candidate without failing unavailable lanes
        id: candidate
        env:
          PROVIDER: ${{ matrix.provider }}
          SELECTOR: ${{ matrix.model_selector }}
          PROBE_FELO_OX: ${{ inputs.probe_felo_ox_alpha || 'false' }}
        run: |
          set -euo pipefail
          MODEL=$(python3 - "$PROVIDER" "$SELECTOR" "$PROBE_FELO_OX" <<'PY'
          import json,sys
          d=json.load(open('/tmp/model-catalog.json', encoding='utf-8'))
          p,selector,probe=sys.argv[1:]
          rows=[r for r in d['models'] if r['provider']==p]
          free=[r for r in rows if r['pricing_classification']=='free_zero_price' or r['free_suffix'] or r['access_classification']=='free_trial']
          if selector=='ox-alpha':
              pick=[r for r in rows if r['id'].lower() in ('ox-alpha','stealth/ox-alpha')][:1]
              if not pick and p=='felo' and probe.lower()=='true':
                  pick=[r for r in rows if 'ox-alpha' in r['id'].lower()][:1]
          elif selector=='other-free':
              pick=[r for r in free if 'ox-alpha' not in r['id'].lower()][:1]
          else:
              pick=free[:1]
          print(pick[0]['id'] if pick else '')
          PY
          )
          if [ -n "$MODEL" ]; then
            echo "selection_status=selected" >> "$GITHUB_OUTPUT"
            echo "selection_reason=eligible_live_catalog_or_documented_trial_candidate" >> "$GITHUB_OUTPUT"
            echo "Selected $PROVIDER/$MODEL"
          else
            echo "selection_status=skipped" >> "$GITHUB_OUTPUT"
            echo "selection_reason=no_eligible_live_candidate_or_probe_disabled" >> "$GITHUB_OUTPUT"
            echo "::notice::No eligible live candidate for $PROVIDER/$SELECTOR; recording a capacity/catalog skip rather than a model failure."
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Snapshot repository history without mutation
        env:
          REFS: ${{ steps.cohort.outputs.refs }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/evaluation
          IFS=',' read -ra ITEMS <<< "$REFS"
          for ref in "${ITEMS[@]}"; do
            ref=$(echo "$ref" | xargs); [ -n "$ref" ] || continue
            git rev-parse "$ref^{commit}" >> /tmp/evaluation/resolved-refs.txt
          done
          sort -u /tmp/evaluation/resolved-refs.txt > /tmp/evaluation/resolved-refs.unique.txt
          cp /tmp/model-catalog.json /tmp/evaluation/model-catalog.json

      - name: Build MVT prompt
        id: prompt
        env:
          PROVIDER: ${{ matrix.provider }}
          MODEL: ${{ steps.candidate.outputs.model || 'UNRESOLVED' }}
          MANAGER: ${{ steps.cohort.outputs.manager }}
          REFS: ${{ steps.cohort.outputs.refs }}
          VARIANT: ${{ matrix.prompt_variant }}
        run: |
          set -euo pipefail
          {
            echo 'prompt<<EOF'
            echo "You are one player in the termux-monorepo Agent Team Moneyball experiment. Manager=${MANAGER}. Provider=${PROVIDER}. Model=${MODEL}. PromptVariant=${VARIANT}. Cohort refs=${REFS}."
            case "$VARIANT" in
              baseline) echo 'Critique issue #337. Give one concrete improvement, one risk, and a PASS/FAIL assessment of whether the orchestration concept is operationally testable. Do not fabricate tool access.';;
              independent) echo 'Independently identify the highest-risk engineering defect in the #337 continuous audit concept. Give a PASS/FAIL assessment and evidence required to change it.';;
              adversarial) echo 'Adversarial MVT variant: attempt to falsify the #337 measurement system. Identify one counterexample, one guard, and PASS/FAIL. Explicitly distinguish provider capability, documented free-trial access, account quota, and public pricing.';;
              synthesis) echo 'Synthesize the likely team-level improvement from #337 while explicitly separating model failure, provider failure, dispatch failure, and manager failure. Give PASS/FAIL.';;
              daily-quota-mvt) echo 'Use this as a fifth MVT treatment for Felo daily included quota. Evaluate a different repository-specific orchestration question than the OX Alpha lane. Record whether the result is useful and whether any quota/rate-limit evidence is observed.';;
            esac
            echo 'This is a controlled benchmark. Correctness and working outcome outrank latency. Do not modify files.'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Invoke live candidate
        id: invoke
        if: steps.candidate.outputs.model != ''
        continue-on-error: true
        uses: ./.github/actions/http-llm-invoke
        with:
          provider: ${{ matrix.provider }}
          model: ${{ steps.candidate.outputs.model }}
          role: review
          target_number: ${{ inputs.target_number || '337' }}
          api_key: ${{ matrix.provider == 'felo' && secrets.FELO_AI_API || matrix.provider == 'omni' && secrets.OMNI_API_KEY || secrets.OPENROUTER_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          experiment_id: "${{ github.run_id }}:${{ matrix.lane }}:${{ matrix.prompt_variant }}"
          prompt_variant: ${{ matrix.prompt_variant }}
          max_tokens: '131072'
          post_comment: 'false'
          prompt: ${{ steps.prompt.outputs.prompt }}

      - name: Expose invocation telemetry in audit logs
        if: always()
        run: |
          if [ -f /tmp/model-performance/observations.ndjson ]; then
            echo '### Immutable invocation observation'
            cat /tmp/model-performance/observations.ndjson
          else
            echo '### No provider invocation observation (lane skipped)'
          fi

      - name: Write immutable experiment manifest
        if: always()
        env:
          PROVIDER: ${{ matrix.provider }}
          MODEL: ${{ steps.candidate.outputs.model }}
          SELECTION_STATUS: ${{ steps.candidate.outputs.selection_status }}
          SELECTION_REASON: ${{ steps.candidate.outputs.selection_reason }}
          MANAGER: ${{ steps.cohort.outputs.manager }}
          RUN_ID: ${{ github.run_id }}
          LANE: ${{ matrix.lane }}
          VARIANT: ${{ matrix.prompt_variant }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('/tmp/evaluation/manifest.json'); refs=pathlib.Path('/tmp/evaluation/resolved-refs.unique.txt')
          p.write_text(json.dumps({'schema':'team-evaluation/v4','run_id':os.environ['RUN_ID'],'lane':os.environ['LANE'],'manager':os.environ['MANAGER'],'provider':os.environ['PROVIDER'],'model':os.environ.get('MODEL') or None,'selection_status':os.environ['SELECTION_STATUS'],'selection_reason':os.environ['SELECTION_REASON'],'prompt_variant':os.environ['VARIANT'],'refs':refs.read_text().splitlines() if refs.exists() else []},indent=2)+'\n')
          PY

      - name: Upload immutable evaluation ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-evaluation-${{ github.run_id }}-${{ matrix.lane }}
          path: |
            /tmp/evaluation
            /tmp/model-performance/observations.ndjson
          if-no-files-found: ignore

      - name: Record evaluation receipt
        if: always() && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET: ${{ inputs.target_number || '337' }}
          RUN_ID: ${{ github.run_id }}
          PROVIDER: ${{ matrix.provider }}
          MODEL: ${{ steps.candidate.outputs.model || 'UNRESOLVED' }}
          LANE: ${{ matrix.lane }}
          STATUS: ${{ steps.candidate.outputs.selection_status || 'unresolved' }}
        run: |
          gh api "repos/${REPO}/issues/${TARGET}/comments" -f body="🧪 MVT lane receipt: ${LANE}; ${PROVIDER}/${MODEL}; status=${STATUS}; run=${RUN_ID}; live catalog polled; immutable cohort preserved. Outcome is recorded separately from route execution." >/dev/null || true
