name: continuous-improve

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - name: Check secrets
        id: cfg
        env:
          KEY:  ${{ secrets.MANUS_SSH_KEY }}
          HOST: ${{ secrets.MANUS_SSH_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then
            echo "::warning::MANUS_SSH_* missing — skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Unresolved SSH host is environmental, not a repo defect.
          # Run 37145725107 on 4a54d96f failed: ssh exit 255 temporary failure in name resolution.
          if ! getent hosts "$HOST" >/dev/null 2>&1; then
            echo "::warning::MANUS_SSH_HOST does not resolve. Recording host-unresolved skip."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch on Termux
        if: steps.cfg.outputs.ok == 'true'
        env:
          KEY:  ${{ secrets.MANUS_SSH_KEY }}
          HOST: ${{ secrets.MANUS_SSH_HOST }}
          PORT: ${{ secrets.MANUS_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if ! ssh -p "${PORT:-22}" -o BatchMode=yes -o ConnectTimeout=15 "termux@$HOST" \
            "nohup ~/.local/bin/deepagent-continuous 8 >/dev/null 2>&1 &"; then
            echo "::warning::MANUS SSH dispatch failed after DNS preflight (tunnel dropped). Recording dispatch-lost skip."
            exit 0
          fi
