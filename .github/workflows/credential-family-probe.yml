name: Credential family probe

# Answers one question about a stored secret WITHOUT ever printing its
# value: which credential family does the value belong to? The probe
# offers the value to two APIs and records only the HTTP status codes:
#   api.github.com/user            -> 200 means a valid GitHub credential
#   api.deepseek.com/user/balance  -> 200 means a valid DeepSeek API key
# Built for DEEPSEEK_API_KEY, whose name collides across inventories:
# Issue #184 lists a GitHub classic PAT with that name, while repo code
# consumes the same-named Actions secret as a DeepSeek-issued key.
# The verdict is posted as a comment on Issue #184 (the credential
# inventory of record). Dispatch-only; the value never appears in logs,
# the summary, or the comment — only status codes do.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe both APIs (status codes only)
        id: probe
        env:
          PROBE_VALUE: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          gh_status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $PROBE_VALUE" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user || echo 000)
          ds_status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $PROBE_VALUE" \
            https://api.deepseek.com/user/balance || echo 000)
          if [ "$gh_status" = "200" ] && [ "$ds_status" != "200" ]; then
            verdict="github-family"
          elif [ "$ds_status" = "200" ] && [ "$gh_status" != "200" ]; then
            verdict="deepseek-family"
          elif [ "$gh_status" = "200" ] && [ "$ds_status" = "200" ]; then
            verdict="both-200-anomaly"
          else
            verdict="neither"
          fi
          echo "github_status=$gh_status" >> "$GITHUB_OUTPUT"
          echo "deepseek_status=$ds_status" >> "$GITHUB_OUTPUT"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo "## Credential family probe — DEEPSEEK_API_KEY"
            echo "- api.github.com/user -> HTTP $gh_status"
            echo "- api.deepseek.com/user/balance -> HTTP $ds_status"
            echo "- Verdict: **$verdict** (value never printed; status codes only)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post the verdict to the credential inventory (Issue #184)
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 184 --repo "${{ github.repository }}" --body "[MUSEai]@{role:{main-lane}} — Credential family probe (run ${{ github.run_id }}): the value stored under the Actions secret name DEEPSEEK_API_KEY was offered to both APIs; only HTTP status codes were recorded, the value was never printed or logged. api.github.com/user -> ${{ steps.probe.outputs.github_status }}; api.deepseek.com/user/balance -> ${{ steps.probe.outputs.deepseek_status }}. Verdict: **${{ steps.probe.outputs.verdict }}**."
