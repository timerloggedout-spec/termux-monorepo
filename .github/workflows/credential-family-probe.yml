name: Credential inventory owner review

# Deprecated unsafe probe retired by the credential provenance contract.
# Never send a credential to multiple provider endpoints to infer its type.
# This manual workflow reads no secrets and performs no network requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-review:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish safe reconciliation instructions
        run: |
          {
            echo "## Credential inventory owner review"
            echo ""
            echo "No secret values were read or transmitted."
            echo "1. Open GitHub Settings > Developer settings > Personal access tokens."
            echo "2. Review token names, owner, scopes, expiry, and last-used metadata."
            echo "3. Open repository Settings > Secrets and variables > Actions."
            echo "4. Reconcile secret names to principals using names only; never copy values."
            echo "5. Update issue #184 and data/ops/credential-surfaces.jsonl with verified metadata."
            echo ""
            echo "Do not test a credential by sending it to an unrelated provider API."
          } >> "$GITHUB_STEP_SUMMARY"
