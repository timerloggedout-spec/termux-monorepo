name: Credential Inventory Validation

on:
  push:
    paths:
      - "data/ops/**"
      - "schemas/ops/**"
      - "scripts/ops/validate_credential_inventory.py"
      - "tests/test_credential_inventory.py"
      - "tests/test_credential_use_provenance_schema.py"
      - "docs/ops/CREDENTIAL-INVENTORY.md"
      - "docs/ops/CREDENTIAL-PROVENANCE-AND-DOE-IDENTITY.md"
      - ".github/workflows/credential-inventory-validation.yml"
  pull_request:
    paths:
      - "data/ops/**"
      - "schemas/ops/**"
      - "scripts/ops/validate_credential_inventory.py"
      - "tests/test_credential_inventory.py"
      - "tests/test_credential_use_provenance_schema.py"
      - "docs/ops/CREDENTIAL-INVENTORY.md"
      - "docs/ops/CREDENTIAL-PROVENANCE-AND-DOE-IDENTITY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate names-only inventory
        run: python3 scripts/ops/validate_credential_inventory.py
      - name: Unit tests
        run: |
          python3 -m unittest tests/test_credential_inventory.py
          python3 -m unittest tests/test_credential_use_provenance_schema.py
