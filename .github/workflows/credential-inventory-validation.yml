name: Credential Inventory Validation

on:
  push:
    paths:
      - "data/ops/**"
      - "schemas/ops/**"
      - "scripts/ops/validate_credential_inventory.py"
      - "tests/test_credential_inventory.py"
      - "docs/ops/CREDENTIAL-INVENTORY.md"
      - ".github/workflows/credential-inventory-validation.yml"
  pull_request:
    paths:
      - "data/ops/**"
      - "schemas/ops/**"
      - "scripts/ops/validate_credential_inventory.py"
      - "tests/test_credential_inventory.py"
      - "docs/ops/CREDENTIAL-INVENTORY.md"
  workflow_dispatch:

permissions:
  contents: read

# QUE fan-out guard (Owner order 2026-11-18): PR events coalesce per PR;
# every other event keeps a unique group (run_id) ⇒ ¬coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate names-only inventory
        run: python3 scripts/ops/validate_credential_inventory.py
      - name: Unit tests
        run: python3 -m unittest tests/test_credential_inventory.py
