# Debate dock hygiene — TOC rebuild check, stale/blocker flags, optional Linear ping
name: debate-hygiene

on:
  pull_request:
    paths:
      - "docs/DEBATE/**"
      - "scripts/debate/**"
      - ".github/workflows/debate-hygiene.yml"
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  matrix-toc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Rebuild TOC and diff
        run: |
          # Pin stamp and stale age to the MATRIX commit date. Wall-clock today
          # failed schedule run 37377726547 (header 2026-09-28 vs 2026-10-05).
          export DEBATE_TOC_DATE="$(git log -1 --format=%cs -- docs/DEBATE/MATRIX.yaml)"
          if [ -z "$DEBATE_TOC_DATE" ]; then
            echo "::error::MATRIX.yaml has no commit date"
            exit 1
          fi
          echo "DEBATE_TOC_DATE=$DEBATE_TOC_DATE"
          python3 scripts/debate/build_toc.py
          if ! git diff --quiet docs/DEBATE/TOC.md; then
            echo "::error::TOC.md out of date — rebuild with DEBATE_TOC_DATE from MATRIX.yaml"
            git diff docs/DEBATE/TOC.md
            exit 1
          fi
      - name: Flag stale / blockers
        run: |
          set +e
          out=$(python3 scripts/debate/flag_stale.py)
          code=$?
          echo "$out"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ $code -ne 0 ]; then
            echo "$out" | grep -q BLOCKER && exit 1 || exit 0
          fi
          exit 0
