# Debate dock hygiene — TOC rebuild check, stale/blocker flags, optional Linear ping
name: debate-hygiene

on:
  pull_request:
    paths:
      - "docs/DEBATE/**"
      - "scripts/debate/**"
      - ".github/workflows/debate-hygiene.yml"
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  matrix-toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Rebuild TOC and diff
        run: |
          python3 scripts/debate/build_toc.py
          if ! git diff --quiet docs/DEBATE/TOC.md; then
            echo "::error::TOC.md out of date — run scripts/debate/build_toc.py"
            git diff docs/DEBATE/TOC.md
            exit 1
          fi
      - name: Flag stale / blockers
        run: |
          set +e
          out=$(python3 scripts/debate/flag_stale.py)
          code=$?
          echo "$out"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ $code -ne 0 ]; then
            echo "$out" | grep -q BLOCKER && exit 1 || exit 0
          fi
          exit 0
