# deepagent-task.yml — remote trigger for Termux-hosted deepagent.py.
#
# STATUS: manual dispatch. Requires MANUS_SSH_* secrets pointing at
# the Termux reverse-tunnel endpoint (Pinggy). Until those secrets
# are configured, use the local wrapper:
#
#     deepagent-dispatch ~/deepcli/tasks/<task>.md
#
# The runner does NOT execute the task itself. It triggers the agent
# on Termux via SSH. All tool calls land on the device.
name: deepagent-task

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task file path relative to repo root"
        required: true
        default: "docs/ops/tasks/wire-cache-into-core.md"
      extra:
        description: "Extra task string appended to the task title"
        required: false
        default: "execute the task"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify task file
        run: |
          test -f "${{ inputs.task }}" || {
            echo "::error::task file not found: ${{ inputs.task }}"
            exit 1
          }
          echo "task:"
          head -20 "${{ inputs.task }}"

      - name: Reach Termux
        id: reach
        env:
          SSH_KEY:  ${{ secrets.MANUS_SSH_KEY }}
          SSH_HOST: ${{ secrets.MANUS_SSH_HOST }}
          SSH_PORT: ${{ secrets.MANUS_SSH_PORT }}
        run: |
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "::warning::MANUS_SSH_* secrets not set — cannot reach Termux"
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if ssh -p "${SSH_PORT:-22}" -o BatchMode=yes -o ConnectTimeout=8 \
               "termux@$SSH_HOST" 'test -x ~/.local/bin/deepagent-dispatch'; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::tunnel unreachable or wrapper missing"
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push task file to Termux
        if: steps.reach.outputs.reachable == 'true'
        env:
          SSH_HOST: ${{ secrets.MANUS_SSH_HOST }}
          SSH_PORT: ${{ secrets.MANUS_SSH_PORT }}
        run: |
          scp -P "${SSH_PORT:-22}" "${{ inputs.task }}" \
              "termux@$SSH_HOST:~/deepcli/tasks/$(basename ${{ inputs.task }})"

      - name: Dispatch on Termux
        if: steps.reach.outputs.reachable == 'true'
        env:
          SSH_HOST: ${{ secrets.MANUS_SSH_HOST }}
          SSH_PORT: ${{ secrets.MANUS_SSH_PORT }}
        run: |
          TASK_BASE="$(basename ${{ inputs.task }})"
          ssh -p "${SSH_PORT:-22}" "termux@$SSH_HOST" \
              "~/.local/bin/deepagent-dispatch ~/deepcli/tasks/$TASK_BASE '${{ inputs.extra }}'"

      - name: Notes
        run: |
          echo "Triggered via GitHub Actions at $(date -u +%Y-%m-%dT%H:%MZ)."
          echo "Output and notifications are on the Termux device."
          echo "Local wrapper: deepagent-dispatch ~/deepcli/tasks/<task>.md"
