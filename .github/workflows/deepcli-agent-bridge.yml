name: DeepCLI Agent Bridge Smoke

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
    paths:
      - "deepcli/agent.py"
      - "deepcli/deepagent.py"
      - "deepcli/session_manager.py"
      - "deepcli/core.py"
      - "ops/termux-bridge/current.json"
      - "scripts/termux/**"
      - ".github/workflows/deepcli-agent-bridge.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: deepcli-agent-bridge
  cancel-in-progress: true

jobs:
  bridge-smoke:
    name: Termux bridge + dual agent smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read and validate live bridge manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/ops/termux-bridge/current.json?ref=master" \
            --jq '.content' | tr -d '\n' | base64 -d > bridge.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          d = json.load(open("bridge.json", encoding="utf-8"))
          with open("deepcli-agent-bridge-receipt.json", "w", encoding="utf-8") as out:
              json.dump({
                  "schema_version": 1,
                  "run_id": int("${{ github.run_id }}"),
                  "run_attempt": int("${{ github.run_attempt }}"),
                  "sha": "${{ github.sha }}",
                  "ref": "${{ github.ref }}",
                  "bridge": {
                      "status": d.get("status"),
                      "endpoint": d.get("endpoint"),
                      "port": d.get("port"),
                      "ssh_user": d.get("ssh_user"),
                      "expires_at": d.get("expires_at"),
                      "stale_reason": d.get("stale_reason"),
                  },
                  "checks": [],
              }, out, indent=2, sort_keys=True)
          required = ("endpoint", "port", "ssh_user", "expires_at")
          if d.get("status") != "active":
              raise SystemExit(f"bridge status is {d.get('status')!r}; publisher must refresh it")
          missing = [k for k in required if not d.get(k)]
          if missing:
              raise SystemExit(f"bridge manifest incomplete: {missing}")
          expires = datetime.fromisoformat(d["expires_at"].replace("Z", "+00:00"))
          if expires <= datetime.now(timezone.utc):
              raise SystemExit("bridge endpoint is expired")
          if not (1 <= int(d["port"]) <= 65535):
              raise SystemExit("bridge port out of range")
          print(f"bridge={d['ssh_user']}@{d['endpoint']}:{d['port']}")
          PY

      - name: Install pinned SSH identity
        env:
          SSH_KEY: ${{ secrets.TERMUX_MCP_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.TERMUX_MCP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "::error::TERMUX_MCP_SSH_PRIVATE_KEY is missing"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "::error::TERMUX_MCP_KNOWN_HOSTS is missing"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/termux_mcp
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/termux_mcp ~/.ssh/known_hosts

      - name: Sync DeepAgent payload to Termux
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          d=json.load(open("bridge.json", encoding="utf-8"))
          base=["scp","-i","$HOME/.ssh/termux_mcp","-o","IdentitiesOnly=yes","-o","StrictHostKeyChecking=yes","-o","ConnectTimeout=15","-P",str(d["port"])]
          target=f"{d['ssh_user']}@{d['endpoint']}:~/deepcli/"
          files=["deepcli/prompt_system.py","deepcli/roles.json","deepcli/deepagent.py","deepcli/agent.py"]
          r=subprocess.run(base+files+[target],text=True,capture_output=True)
          if r.returncode:
              print(r.stdout); print(r.stderr)
              raise SystemExit(r.returncode)
          PY

      - name: Dispatch assigned DeepAgent task
        env:
          DEEPCLI_TASK_ID: deepagent-ci-continuation-001
          DEEPCLI_ROLE: engineer
          DEEPCLI_TRANSPORT: auto
          DEEPCLI_TASK: >-
            Inspect and operationalize the DeepCLI agent execution path now. Verify the
            role-aware prompt system, task identity, checkpoint/resume behavior, and the
            direct and HTTP agent paths. Make only safe, task-scoped changes. Run focused
            verification. Do not claim success unless the objective is evidenced. If the
            transport is unavailable, classify that as access/admission failure and preserve
            the exact evidence for the next continuation.
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shlex, subprocess, sys
          d=json.load(open("bridge.json", encoding="utf-8"))
          ssh=["ssh","-i","$HOME/.ssh/termux_mcp","-o","IdentitiesOnly=yes","-o","StrictHostKeyChecking=yes","-o","ConnectTimeout=15","-p",str(d["port"]),f"{d['ssh_user']}@{d['endpoint']}"]
          task="Inspect and operationalize the DeepCLI agent execution path now. Verify the role-aware prompt system, task identity, checkpoint/resume behavior, and the direct and HTTP agent paths. Make only safe, task-scoped changes. Run focused verification. Do not claim success unless the objective is evidenced. If the transport is unavailable, classify that as access/admission failure and preserve the exact evidence for the next continuation."
          remote="DEEPCLI_TASK_ID=deepagent-ci-continuation-001 DEEPCLI_ROLE=engineer DEEPCLI_TRANSPORT=auto DEEPCLI_TASK="+shlex.quote(task)+" bash -lc 'python3 ~/deepcli/deepagent.py --role engineer --task-id deepagent-ci-continuation-001 --transport auto "+shlex.quote(task)+"'"
          r=subprocess.run(ssh+[remote],text=True,capture_output=True,timeout=600)
          open("deepagent-task-output.txt","w").write(r.stdout[-12000:])
          open("deepagent-task-error.txt","w").write(r.stderr[-6000:])
          print(r.stdout[-4000:]); print(r.stderr[-2000:],file=sys.stderr)
          if r.returncode:
              raise SystemExit(r.returncode)
          PY

      - name: Execute bounded dual-agent smoke
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shlex, subprocess, sys

          d = json.load(open("bridge.json", encoding="utf-8"))
          host, port, user = d["endpoint"], str(d["port"]), d["ssh_user"]
          ssh = [
              "ssh", "-i", "$HOME/.ssh/termux_mcp",
              "-o", "IdentitiesOnly=yes",
              "-o", "StrictHostKeyChecking=yes",
              "-o", "ServerAliveInterval=15",
              "-o", "ConnectTimeout=15",
              "-p", port, f"{user}@{host}",
          ]

          checks = [
              ("entrypoints-compile", ["python3", "-m", "py_compile", "$HOME/deepcli/deepagent.py", "$HOME/deepcli/agent.py"]),
              ("direct-agent", ["env", "AGENT_MAX_STEPS=1", "python3", "$HOME/deepcli/deepagent.py", "--dry-run", "Reply exactly SMOKE_OK"]),
              ("http-agent", ["env", "AGENT_MAX_STEPS=1", "python3", "$HOME/deepcli/agent.py", "--dry-run", "Reply exactly SMOKE_OK"]),
          ]

          receipt = {
              "schema_version": 1,
              "run_id": int("${{ github.run_id }}"),
              "run_attempt": int("${{ github.run_attempt }}"),
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "bridge": {"endpoint": host, "port": int(port), "ssh_user": user, "expires_at": d.get("expires_at")},
              "checks": [],
          }

          for name, remote_argv in checks:
              command = " ".join(shlex.quote(x) for x in remote_argv)
              result = subprocess.run(ssh + [command], text=True, capture_output=True, timeout=180)
              row = {"name": name, "rc": result.returncode, "stdout": result.stdout[-4000:], "stderr": result.stderr[-2000:]}
              receipt["checks"].append(row)
              print(json.dumps({k: v for k, v in row.items() if k not in ("stdout", "stderr")}))
              if result.returncode != 0:
                  print(result.stdout[-4000:])
                  print(result.stderr[-2000:], file=sys.stderr)
                  with open("deepcli-agent-bridge-receipt.json", "w", encoding="utf-8") as f:
                      json.dump(receipt, f, indent=2, sort_keys=True)
                  raise SystemExit(f"{name} failed with rc={result.returncode}")

          with open("deepcli-agent-bridge-receipt.json", "w", encoding="utf-8") as f:
              json.dump(receipt, f, indent=2, sort_keys=True)
          PY

      - name: Upload DeepAgent task evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: deepagent-task-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deepagent-task-output.txt
            deepagent-task-error.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload immutable smoke receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: deepcli-agent-bridge-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: deepcli-agent-bridge-receipt.json
          if-no-files-found: error
          retention-days: 14
