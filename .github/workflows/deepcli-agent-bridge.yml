name: DeepCLI Agent Bridge Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "deepcli/agent.py"
      - "deepcli/deepagent.py"
      - "deepcli/session_manager.py"
      - "deepcli/core.py"
      - "ops/termux-bridge/current.json"
      - "scripts/termux/**"
      - ".github/workflows/deepcli-agent-bridge.yml"
      - "tests/test_bridge_admission.py"
  push:
    branches: [master]
    paths:
      - "deepcli/agent.py"
      - "deepcli/deepagent.py"
      - "deepcli/session_manager.py"
      - "deepcli/core.py"
      - "ops/termux-bridge/current.json"
      - "scripts/termux/**"
      - ".github/workflows/deepcli-agent-bridge.yml"
      - "tests/test_bridge_admission.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: deepcli-agent-bridge-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  bridge-smoke:
    name: Termux bridge + dual agent smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read and validate live bridge manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/ops/termux-bridge/current.json?ref=${GITHUB_SHA}" \
            --jq '.content' | tr -d '\n' | base64 -d > bridge.json
          python scripts/termux/bridge_admission.py bridge.json \
            --receipt deepcli-agent-bridge-receipt.json \
            --event-name "${GITHUB_EVENT_NAME}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --sha "${GITHUB_SHA}" \
            --ref "${GITHUB_REF}"

      - name: Install pinned SSH identity
        if: hashFiles('deepcli-bridge-skip') == ''
        env:
          SSH_KEY: ${{ secrets.TERMUX_MCP_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.TERMUX_MCP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "::error::TERMUX_MCP_SSH_PRIVATE_KEY is missing"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "::error::TERMUX_MCP_KNOWN_HOSTS is missing"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/termux_mcp
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/termux_mcp ~/.ssh/known_hosts

      - name: Sync DeepAgent payload to Termux
        if: hashFiles('deepcli-bridge-skip') == ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, os
          d=json.load(open("bridge.json", encoding="utf-8"))
          base=["scp","-i",os.path.expanduser("~/.ssh/termux_mcp"),"-o","IdentitiesOnly=yes","-o","StrictHostKeyChecking=yes","-o","ConnectTimeout=15","-P",str(d["port"])]
          target=f"{d['ssh_user']}@{d['endpoint']}:~/deepcli/"
          files=["deepcli/prompt_system.py","deepcli/roles.json","deepcli/deepagent.py","deepcli/agent.py","scripts/termux/run-deepagent-task.sh"]
          r=subprocess.run(base+files+[target],text=True,capture_output=True)
          if r.returncode:
              print(r.stdout); print(r.stderr)
              raise SystemExit(r.returncode)
          PY

      - name: Dispatch assigned DeepAgent task
        if: hashFiles('deepcli-bridge-skip') == ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shlex, subprocess, sys, os
          d=json.load(open("bridge.json", encoding="utf-8"))
          ssh=["ssh","-i",os.path.expanduser("~/.ssh/termux_mcp"),"-o","IdentitiesOnly=yes","-o","StrictHostKeyChecking=yes","-o","ConnectTimeout=15","-p",str(d["port"]),f"{d['ssh_user']}@{d['endpoint']}"]
          task="Verify the live DeepAgent worker is awake and able to accept work now. Inspect worker/session state, claim DA-WORK-001, identify the actual worker and transport, execute the task through the normal path, and emit FINISH with verification evidence. Do not run a synthetic smoke. If transport is unavailable, classify it explicitly as access/admission failure and preserve exact evidence for resumption."
          remote="DEEPCLI_TASK_ID=DA-WORK-001 DEEPCLI_ROLE=diagnostician DEEPCLI_TRANSPORT=auto DEEPCLI_TASK="+shlex.quote(task)+" bash -lc 'DEEPCLI_TASK_ID=DA-WORK-001 DEEPCLI_ROLE=diagnostician DEEPCLI_TRANSPORT=auto DEEPCLI_TASK="+shlex.quote(task)+" bash ~/deepcli/run-deepagent-task.sh'"
          r=subprocess.run(ssh+[remote],text=True,capture_output=True,timeout=600)
          open("deepagent-task-output.txt","w").write(r.stdout[-12000:])
          open("deepagent-task-error.txt","w").write(r.stderr[-6000:])
          print(r.stdout[-4000:]); print(r.stderr[-2000:],file=sys.stderr)
          if r.returncode:
              raise SystemExit(r.returncode)
          PY

      - name: Upload DeepAgent task evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: deepagent-task-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deepagent-task-output.txt
            deepagent-task-error.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload immutable smoke receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: deepcli-agent-bridge-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: deepcli-agent-bridge-receipt.json
          if-no-files-found: error
          retention-days: 14
