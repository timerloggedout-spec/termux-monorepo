name: DeepSeek CI – Agentic Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      event_payload:
        description: 'JSON event payload (optional)'
        required: false
        default: '{}'

concurrency:
  group: deepseek-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  deepseek-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    env:
      OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
      GITHUB_EVENT: ${{ toJson(github.event) }}
      DEEPSEEK_WASM_PATH: ./deepcli/deepseek.wasm

    steps:
      - name: Debounce rapid-succession commits
        run: sleep 10

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js (for PoW WASM)
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install curl_cffi requests pyyaml click

      - name: Run DeepSeek CI Agent
        env:
          PYTHONPATH: ${{ github.workspace }}/multi-ai-cli
        run: |
          python -m ci_mode \
            --workspace "$GITHUB_WORKSPACE" \
            --cache-dir "${{ runner.temp }}/deepseek-cache"

      - name: Upload results (if any)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: deepseek-output
          path: ./deepseek_output.json
          if-no-files-found: ignore
