name: DeepSeek CI – Agentic Automation

# Template webWrapper accounts:
#   Account-1 / primary  — PRIORITY (default; interactive + CI)
#   Account-2 / secondary — alternate / cookies_2 lineage
#
# chat_session_id is created via /api/v0/chat_session/create before completion.
# Streaming SSE read timeout allows multi-minute thinking.
# GitLab CI/CD is a separate scope.
# Hard-fail on missing cookies/token/session (no soft-skip).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      event_payload:
        description: 'JSON event payload (optional)'
        required: false
        default: '{}'
      account:
        description: 'DeepSeek account (account-1/primary default; account-2/secondary alternate)'
        required: false
        default: 'account-1'

concurrency:
  group: deepseek-ci-${{ github.event.pull_request.number || github.event.issue.number || github.event.comment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  deepseek-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Skip bot noise on issue_comment / review_comment; always run for PR + dispatch.
    # Parentheses required: && binds tighter than || in GHA expressions.
    if: >-
      (github.event_name != 'issue_comment' && github.event_name != 'pull_request_review_comment') ||
      (
        github.event.comment.user.type != 'Bot' &&
        (
          contains(github.event.comment.body, '@deepcore') ||
          contains(github.event.comment.body, '@deepCore') ||
          contains(github.event.comment.body, '@deepseek') ||
          contains(github.event.comment.body, '@deepseek-ci') ||
          contains(github.event.comment.body, 'deepseek') ||
          contains(github.event.comment.body, 'DeepSeek')
        )
      )
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    env:
      # ARCHWIZ_GITHUB_TOKEN (4RCHW12) supersedes all other GH tokens
      OPERATOR_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
      # Prefer dispatch payload when provided; otherwise use the real event
      GITHUB_EVENT: ${{ github.event.inputs.event_payload != '' && github.event.inputs.event_payload || toJson(github.event) }}
      # Account-1 / primary is PRIORITY default
      DEEPSEEK_ACCOUNT: ${{ github.event.inputs.account || 'account-1' }}
      # Model auth — names from docs/ops/DEEPSEEK-CI.md + Issue #184 catalog.
      # First non-empty wins inside session_manager._token_from_env.
      # Cookies are primary auth path for the webWrapper (WASM + 🍪).
      DEEPSEEK_TOKEN_PRIMARY: ${{ secrets.DEEPSEEK_TOKEN_PRIMARY || secrets.DEEPSEEK_TOKEN_ACCOUNT_1 || secrets.DEEPSEEK_TOKEN || secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_AUTH_TOKEN || secrets.NEXUSCLI_TOKEN }}
      DEEPSEEK_TOKEN: ${{ secrets.DEEPSEEK_TOKEN || secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_AUTH_TOKEN || secrets.NEXUSCLI_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_AUTH_TOKEN: ${{ secrets.DEEPSEEK_AUTH_TOKEN }}
      NEXUSCLI_TOKEN: ${{ secrets.NEXUSCLI_TOKEN }}
      DEEPSEEK_COOKIES: ${{ secrets.DEEPSEEK_COOKIES || secrets.DEEPSEEK_COOKIES_1 || secrets.COOKIES }}
      DEEPSEEK_COOKIES_1: ${{ secrets.DEEPSEEK_COOKIES_1 }}
      DEEPSEEK_TOKEN_SECONDARY: ${{ secrets.DEEPSEEK_TOKEN_SECONDARY || secrets.DEEPSEEK_TOKEN_ACCOUNT_2 || secrets.DEEPSEEK_COOKIES_2 }}
      DEEPSEEK_COOKIES_2: ${{ secrets.DEEPSEEK_COOKIES_2 }}
      # Captured browser sessions include aws-waf-token alongside ds_session_id.
      # The value is consumed only by session_manager and persists in the existing
      # permission-restricted session cache; it is never logged or uploaded.
      DEEPSEEK_AWS_WAF_TOKEN: ${{ secrets.DEEPSEEK_AWS_WAF_TOKEN || secrets.DEEPSEEK_WAF_TOKEN || secrets.AWS_WAF_TOKEN || secrets.WAF_AWS_TOKEN }}
      DEEPSEEK_THINKING: "true"
      DEEPSEEK_EXPERT: "true"
      DEEPSEEK_CONNECT_TIMEOUT: "30"
      DEEPSEEK_READ_TIMEOUT: "1200"
      WASM_SOURCE_COMMIT: "ee1807049fd93d087bc14055b2ae6cbffb5dbf82"
      WASM_RAW_BASE: "https://raw.githubusercontent.com/timerloggedout-spec/termux-monorepo"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ env.OPERATOR_TOKEN }}
          persist-credentials: true

      - name: Emit ATES task-boundary identity
        env:
          GITHUB_EVENT_JSON: ${{ env.GITHUB_EVENT }}
        run: |
          set -euo pipefail
          task_kind=$(jq -r '.action // .event_name // .workflow_dispatch // "ci"' <<<"$GITHUB_EVENT_JSON")
          task_text=$(jq -r '.comment.body // .issue.body // .pull_request.body // .pull_request.title // .inputs.event_payload // ""' <<<"$GITHUB_EVENT_JSON")
          target_number=$(jq -r '.pull_request.number // .issue.number // ""' <<<"$GITHUB_EVENT_JSON")
          target_kind=$(jq -r 'if .pull_request.number then "pull_request" elif .issue.number then "issue" else "workflow_dispatch" end' <<<"$GITHUB_EVENT_JSON")
          jq -n \
            --arg agent "deepseek" --arg kind "$task_kind" --arg target "$target_kind" \
            --arg number "$target_number" --arg task "$task_text" --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" --arg image "${ImageOS:-}:${ImageVersion:-}" \
            --arg workflow "$GITHUB_WORKFLOW" --arg provider "deepseek-ci" \
            --arg model "${DEEPSEEK_ACCOUNT:-unresolved}" \
            '{agent_id:$agent,task_kind:$kind,target_kind:$target,target_number:$number,task_text:$task,repository:$repo,base_sha:$sha,runner_image:$image,workflow:$workflow,provider:$provider,model:$model}' \
            > "$RUNNER_TEMP/ates-task-input.json"
          python scripts/ci/write_agent_task_boundary.py \
            --input "$RUNNER_TEMP/ates-task-input.json" \
            --output "$RUNNER_TEMP/ates-task-boundary.json"

      - name: Upload ATES task-boundary identity
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: ates-task-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}/ates-task-boundary.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Setup Node.js (for PoW WASM)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml
          python -c "import requests; print('requests', requests.__version__)"

      - name: Stage DeepSeek PoW WASM & solver
        run: |
          set -euo pipefail
          mkdir -p deepcli/wasm
          if [ -f deepcli/deepseek.wasm ] && [ -f deepcli/pow_solver.js ]; then
            cp -f deepcli/deepseek.wasm deepcli/wasm/deepseek.wasm
            cp -f deepcli/pow_solver.js deepcli/wasm/pow_solver.js
            echo "✓ Using checked-out WASM/solver from deepcli/"
          else
            echo "⚠ WASM files not found in deepcli/, fetching from commit $WASM_SOURCE_COMMIT"
            curl -sSfL "$WASM_RAW_BASE/$WASM_SOURCE_COMMIT/deepcli/deepseek.wasm" -o deepcli/wasm/deepseek.wasm
            curl -sSfL "$WASM_RAW_BASE/$WASM_SOURCE_COMMIT/deepcli/pow_solver.js" -o deepcli/wasm/pow_solver.js
            echo "✓ Fetched WASM/solver from raw.githubusercontent"
          fi
          if [ ! -s deepcli/wasm/deepseek.wasm ] || [ ! -s deepcli/wasm/pow_solver.js ]; then
            echo "::error::WASM files missing or empty after staging"
            exit 1
          fi
          ls -lh deepcli/wasm/

      # Persistent session reuse is intentional: the cache retains the browser
      # cookie jar (including aws-waf-token), chat session, and PoW-compatible state.
      # Scope the cache to this repository and exact Git ref; do not restore a
      # broad prefix from another branch or pull-request head.
      - name: Cache DeepSeek session (Account-1 / primary)
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        id: cache-session
        with:
          path: ${{ runner.temp }}/.deepseek-cache
          key: deepseek-session-${{ github.repository_id }}-${{ github.ref }}-account1-${{ runner.os }}-${{ hashFiles('deepcli/session_manager.py') }}

      - name: Run DeepSeek CI Agent (Account-1 priority)
        timeout-minutes: 40
        env:
          PYTHONPATH: ${{ github.workspace }}
          # runner.temp ONLY valid at step level — was the post-#174 master gate breaker
          DEEPSEEK_CACHE_DIR: ${{ runner.temp }}/.deepseek-cache
        run: |
          python -m deepcli.ci_mode \
            --event "$GITHUB_EVENT" \
            --workspace "$GITHUB_WORKSPACE" \
            --cache-dir "$DEEPSEEK_CACHE_DIR" \
            --account "$DEEPSEEK_ACCOUNT"

      - name: Failure diagnostics
        if: failure()
        timeout-minutes: 5
        run: |
          set -uo pipefail
          echo "::group::Workflow failure context"
          echo "event: ${{ github.event_name }}"
          echo "actor: ${{ github.actor }}"
          echo "ref: ${{ github.ref }}"
          echo "run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::endgroup::"
          for f in deepseek_output.json; do
            if [ -f "$f" ]; then
              echo "::group::--- $f ---"
              cat "$f" || true
              echo "::endgroup::"
            fi
          done

      - name: Upload results
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.2
        if: always()
        with:
          name: deepseek-output
          path: ./deepseek_output.json
          if-no-files-found: ignore
