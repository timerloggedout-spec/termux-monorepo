name: DeepSeek CI – Agentic Automation

# All agent work stays on the Origin/Pinggy Termux WebWrapper route.
# The preflight uses the authenticated read-only agent list endpoint; an
# unavailable proxy skips only this DeepSeek-specific job.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      event_payload:
        description: 'JSON event payload (optional)'
        required: false
        default: '{}'
      account:
        description: 'DeepSeek account (account-1/primary default; account-2/secondary alternate)'
        required: false
        default: 'account-1'

concurrency:
  group: deepseek-ci-${{ github.event.pull_request.number || github.event.issue.number || github.event.comment.id || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  proxy-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Skip bot noise on issue_comment / review_comment; preserve existing PR + dispatch triggers.
    # Parentheses required: && binds tighter than || in GHA expressions.
    if: >-
      (github.event_name != 'issue_comment' && github.event_name != 'pull_request_review_comment') ||
      (
        github.event.comment.user.type != 'Bot' &&
        (
          contains(github.event.comment.body, '@deepcore') ||
          contains(github.event.comment.body, '@deepCore') ||
          contains(github.event.comment.body, '@deepseek') ||
          contains(github.event.comment.body, '@deepseek-ci') ||
          contains(github.event.comment.body, 'deepseek') ||
          contains(github.event.comment.body, 'DeepSeek')
        )
      )
    outputs:
      available: ${{ steps.proxy.outputs.available }}
      reason: ${{ steps.proxy.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Check Origin/Pinggy agent API
        id: proxy
        timeout-minutes: 2
        env:
          DEEPSEEK_AGENT_URL: ${{ secrets.DEEPSEEK_AGENT_URL }}
          DEEPSEEK_AGENT_TOKEN: ${{ secrets.DEEPSEEK_AGENT_TOKEN }}
        run: python scripts/deepseek_agent_proxy.py --check

  deepseek-agent:
    needs: proxy-preflight
    if: needs.proxy-preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Prefer dispatch payload when provided; otherwise use the real event.
      GITHUB_EVENT: ${{ github.event.inputs.event_payload != '' && github.event.inputs.event_payload || toJson(github.event) }}
      DEEPSEEK_ACCOUNT: ${{ github.event.inputs.account || 'account-1' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Build agent payload
        env:
          EVENT_JSON: ${{ env.GITHUB_EVENT }}
          EVENT_NAME: ${{ github.event_name }}
          ACCOUNT: ${{ env.DEEPSEEK_ACCOUNT }}
        run: |
          set -euo pipefail
          TASK_TEXT=$(jq -r '.comment.body // .issue.body // .issue.title // .pull_request.body // .pull_request.title // .inputs.event_payload // ""' <<<"$EVENT_JSON")
          if [ -z "$TASK_TEXT" ] || [ "$TASK_TEXT" = "{}" ]; then
            TASK_TEXT="Handle this GitHub event as the DeepSeek CI agent."
          fi
          jq -n \
            --arg task "Handle this GitHub event using the existing Origin Termux WebWrapper agent: $TASK_TEXT" \
            --arg source "github:$EVENT_NAME" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg event "$EVENT_NAME" \
            --arg actor "$GITHUB_ACTOR" \
            --arg ref "$GITHUB_REF" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg account "$ACCOUNT" \
            --arg event_payload "$EVENT_JSON" \
            --arg repo_path_local "/data/data/com.termux/files/home" \
            '{task:$task,source:$source,context:{repo:$repo,event:$event,actor:$actor,ref:$ref,run_url:$run_url,account:$account,event_payload:$event_payload,repo_path_local:$repo_path_local}}' \
            > agent_payload.json

      - name: Emit ATES task-boundary identity
        env:
          GITHUB_EVENT_JSON: ${{ env.GITHUB_EVENT }}
        run: |
          set -euo pipefail
          task_kind=$(jq -r '.action // .event_name // .workflow_dispatch // "ci"' <<<"$GITHUB_EVENT_JSON")
          task_text=$(jq -r '.comment.body // .issue.body // .pull_request.body // .pull_request.title // .inputs.event_payload // ""' <<<"$GITHUB_EVENT_JSON")
          target_number=$(jq -r '.pull_request.number // .issue.number // ""' <<<"$GITHUB_EVENT_JSON")
          target_kind=$(jq -r 'if .pull_request.number then "pull_request" elif .issue.number then "issue" else "workflow_dispatch" end' <<<"$GITHUB_EVENT_JSON")
          jq -n \
            --arg agent "deepseek" --arg kind "$task_kind" --arg target "$target_kind" \
            --arg number "$target_number" --arg task "$task_text" --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" --arg image "${ImageOS:-}:${ImageVersion:-}" \
            --arg workflow "$GITHUB_WORKFLOW" --arg provider "deepseek-ci" \
            --arg model "${DEEPSEEK_ACCOUNT:-unresolved}" \
            '{agent_id:$agent,task_kind:$kind,target_kind:$target,target_number:$number,task_text:$task,repository:$repo,base_sha:$sha,runner_image:$image,workflow:$workflow,provider:$provider,model:$model}' \
            > "$RUNNER_TEMP/ates-task-input.json"
          python scripts/ci/write_agent_task_boundary.py \
            --input "$RUNNER_TEMP/ates-task-input.json" \
            --output "$RUNNER_TEMP/ates-task-boundary.json"

      - name: Upload ATES task-boundary identity
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: ates-task-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}/ates-task-boundary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Start and poll Origin/Pinggy agent
        id: agent
        timeout-minutes: 42
        env:
          DEEPSEEK_AGENT_URL: ${{ secrets.DEEPSEEK_AGENT_URL }}
          DEEPSEEK_AGENT_TOKEN: ${{ secrets.DEEPSEEK_AGENT_TOKEN }}
        run: python scripts/deepseek_agent_proxy.py --run --payload agent_payload.json --start-output agent_start.json --status-output agent_status_final.json --max-polls 180 --poll-interval 10

      - name: Extract agent summary
        if: steps.agent.outputs.skipped == ''
        timeout-minutes: 2
        run: |
          set -euo pipefail
          jq -r '.tail // [] | join("\n")' agent_status_final.json > agent_tail.txt
          if [ ! -s agent_tail.txt ]; then printf 'Agent phase: %s\n' "$(jq -r '.phase // "unknown"' agent_status_final.json)" > agent_tail.txt; fi

      - name: Failure diagnostics
        if: failure()
        timeout-minutes: 2
        run: |
          echo "::group::Workflow failure context"
          echo "event: ${{ github.event_name }}"
          echo "actor: ${{ github.actor }}"
          echo "ref: ${{ github.ref }}"
          echo "run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::endgroup::"

      - name: Upload Origin agent results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: deepseek-origin-agent-${{ github.run_id }}
          path: |
            agent_start.json
            agent_status_final.json
            agent_tail.txt
          if-no-files-found: ignore
          retention-days: 14
