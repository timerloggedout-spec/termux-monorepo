name: DeepSeek CI – Agentic Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      event_payload:
        description: 'JSON event payload (optional)'
        required: false
        default: '{}'

jobs:
  deepseek-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    env:
      OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
      GITHUB_EVENT: ${{ toJson(github.event) }}
      DEEPSEEK_CACHE_DIR: ${{ github.workspace }}/.deepseek-cache
      WASM_SOURCE_COMMIT: "ee1807049fd93d087bc14055b2ae6cbffb5dbf82"
      WASM_RAW_BASE: "https://raw.githubusercontent.com/termux/termux-monorepo"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.OPERATOR_TOKEN }}

      - name: Setup Node.js (for PoW WASM)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install requests pyyaml

      - name: Fetch DeepSeek PoW WASM & solver from termux-monorepo
        run: |
          mkdir -p deepcli/wasm
          curl -sSfL "$WASM_RAW_BASE/$WASM_SOURCE_COMMIT/deepcli/deepseek.wasm" -o deepcli/wasm/deepseek.wasm
          curl -sSfL "$WASM_RAW_BASE/$WASM_SOURCE_COMMIT/deepcli/pow_solver.js" -o deepcli/wasm/pow_solver.js

      - name: Cache DeepSeek session
        uses: actions/cache@v4
        id: cache-session
        with:
          path: ${{ env.DEEPSEEK_CACHE_DIR }}
          key: deepseek-session-${{ runner.os }}-${{ hashFiles('deepcli/session_manager.py') }}
          restore-keys: |
            deepseek-session-${{ runner.os }}-

      - name: Run DeepSeek CI Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m deepcli.ci_mode \
            --event "$GITHUB_EVENT" \
            --workspace "$GITHUB_WORKSPACE" \
            --cache-dir "$DEEPSEEK_CACHE_DIR"

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-output
          path: ./deepseek_output.json
