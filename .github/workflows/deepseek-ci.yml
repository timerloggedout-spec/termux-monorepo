name: DeepSeek CI – Agentic Automation

# Admin-scope DeepSeek web-wrapper (Account-1 primary).
# No quota model — frustrated-user retries only.
# Supports 2–3 simultaneous sessions; streaming read timeout allows multi-minute thinking.
# GitLab CI/CD is a separate scope and does not gate this workflow.
# Token names: repository secrets listed in PR #174 / auth inventory issue (already set).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      event_payload:
        description: 'JSON event payload (optional)'
        required: false
        default: '{}'

# Allow up to 3 concurrent DeepSeek sessions (Account-1 capacity).
# Do not cancel-in-progress — frustrated-user retries prefer completing in-flight work.
concurrency:
  group: deepseek-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  deepseek-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    env:
      # Thread-listed PAT names → normalize to OPERATOR_TOKEN for deepcli
      OPERATOR_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
      GITHUB_EVENT: ${{ toJson(github.event) }}
      DEEPSEEK_CACHE_DIR: ${{ github.workspace }}/.deepseek-cache
      DEEPSEEK_ACCOUNT: account-1
      DEEPSEEK_THINKING: "true"
      DEEPSEEK_EXPERT: "true"
      # Multi-minute thinking: long SSE read window (seconds)
      DEEPSEEK_CONNECT_TIMEOUT: "30"
      DEEPSEEK_READ_TIMEOUT: "1200"
      WASM_SOURCE_COMMIT: "ee1807049fd93d087bc14055b2ae6cbffb5dbf82"
      WASM_RAW_BASE: "https://raw.githubusercontent.com/timerloggedout-spec/termux-monorepo"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.OPERATOR_TOKEN }}

      - name: Setup Node.js (for PoW WASM)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install requests pyyaml

      - name: Stage DeepSeek PoW WASM & solver
        run: |
          mkdir -p deepcli/wasm
          if [ -f deepcli/deepseek.wasm ] && [ -f deepcli/pow_solver.js ]; then
            cp -f deepcli/deepseek.wasm deepcli/wasm/deepseek.wasm
            cp -f deepcli/pow_solver.js deepcli/wasm/pow_solver.js
            echo "Using checked-out WASM/solver"
          else
            curl -sSfL "$WASM_RAW_BASE/$WASM_SOURCE_COMMIT/deepcli/deepseek.wasm" -o deepcli/wasm/deepseek.wasm
            curl -sSfL "$WASM_RAW_BASE/$WASM_SOURCE_COMMIT/deepcli/pow_solver.js" -o deepcli/wasm/pow_solver.js
            echo "Fetched WASM/solver from raw.githubusercontent"
          fi

      - name: Cache DeepSeek session (Account-1)
        uses: actions/cache@v4
        id: cache-session
        with:
          path: ${{ env.DEEPSEEK_CACHE_DIR }}
          key: deepseek-session-account1-${{ runner.os }}-${{ hashFiles('deepcli/session_manager.py') }}
          restore-keys: |
            deepseek-session-account1-${{ runner.os }}-
            deepseek-session-${{ runner.os }}-

      - name: Run DeepSeek CI Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m deepcli.ci_mode \
            --event "$GITHUB_EVENT" \
            --workspace "$GITHUB_WORKSPACE" \
            --cache-dir "$DEEPSEEK_CACHE_DIR"

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-output
          path: ./deepseek_output.json
          if-no-files-found: ignore
