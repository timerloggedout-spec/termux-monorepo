name: DeepSeek CI – Agentic (safe)

# DeepSeek v4-Pro web-wrapper path for PR review / invoke.
# Security: ephemeral HOME under RUNNER_TEMP only — no session/cookie cache
# (policy from #112/#114). Work context may use agent-context-store separately.
#
# Cost control: NOT on every synchronize. Opt-in via label, mention, or dispatch.
# Agentic: @deepseek / @deepseek-ci / @deepCore (case-insensitive) — no CLI required.
# Monikers: docs/ops/AGENT-MONIKERS.md
#
# Tokens (model auth — first non-empty wins):
#   DEEPSEEK_TOKEN | DEEPSEEK_API_KEY | DEEPSEEK_AUTH_TOKEN | NEXUSCLI_TOKEN
# GitHub writes:
#   ARCHWIZ_GITHUB_TOKEN || OPERATOR_GITHUB_TOKEN || OPERATOR_TOKEN || GITHUB_TOKEN

on:
  pull_request:
    types: [labeled, opened, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (positive decimal; empty skips PR review)'
        required: false
        default: ''

concurrency:
  group: deepseek-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action || '' }}
          LABEL: ${{ github.event.label.name || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body || '' }}
          SENDER_TYPE: ${{ github.event.sender.type || '' }}
          ASSOCIATION: ${{ github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association || '' }}
          # Only use issue.number if it's actually a PR (issue.pull_request is set)
          PR: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || github.event.inputs.pr_number || '' }}
          # Multi-name probe — user may have stored under alternate keys
          HAS_MODEL: ${{ secrets.DEEPSEEK_TOKEN != '' || secrets.DEEPSEEK_API_KEY != '' || secrets.DEEPSEEK_AUTH_TOKEN != '' || secrets.NEXUSCLI_TOKEN != '' }}
          HAS_GH: ${{ secrets.ARCHWIZ_GITHUB_TOKEN != '' || secrets.OPERATOR_GITHUB_TOKEN != '' || secrets.OPERATOR_TOKEN != '' }}
        run: |
          set -euo pipefail
          run=false
          reason="none"
          pr_number="${PR}"

          # --- trigger detection (agentic, mirrors gemini-dispatch / jules) ---
          if [ "$EVENT" = "workflow_dispatch" ]; then
            run=true
            reason="dispatch"
          elif [ "$EVENT" = "pull_request" ]; then
            if [ "$LABEL" = "deepseek-ci" ] || [ "$LABEL" = "deepseek" ] || [ "$LABEL" = "deepCore" ]; then
              run=true
              reason="label:$LABEL"
            fi
          elif [ "$EVENT" = "issue_comment" ] || [ "$EVENT" = "pull_request_review_comment" ] || [ "$EVENT" = "pull_request_review" ]; then
            if [ "$SENDER_TYPE" = "User" ]; then
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR)
                  lower=$(printf '%s' "$COMMENT_BODY" | tr '[:upper:]' '[:lower:]')
                  if printf '%s' "$lower" | grep -qE '(^|[^a-z0-9_])@(deepseek-ci|deepseek|deepcore)\b'; then
                    run=true
                    reason="mention"
                  fi
                  ;;
              esac
            fi
          fi

          # Validate pr_number: accept only positive decimal integers (or empty for dispatch skip)
          if [ -n "$pr_number" ]; then
            if ! printf '%s' "$pr_number" | grep -qE '^[1-9][0-9]*$'; then
              echo "::warning::Invalid pr_number='$pr_number' — must be positive decimal; clearing"
              pr_number=""
              if [ "$reason" = "dispatch" ]; then
                run=false
                reason="invalid_pr_number"
              fi
            fi
          fi

          # For mention/label on non-PR issue, skip agent (ack may still fire)
          if [ "$run" = "true" ] && [ -z "$pr_number" ] && [ "$reason" != "dispatch" ]; then
            echo "::notice::Trigger on non-PR or missing PR number — agent skipped"
            run=false
            if [ "$reason" = "mention" ] || [[ "$reason" == label:* ]]; then
              : # keep reason for ack diagnostic
            else
              reason="not_a_pr"
            fi
          fi

          if [ "$run" = "true" ] && [ "$HAS_MODEL" != "true" ]; then
            echo "::notice::DeepSeek model auth unset — checked DEEPSEEK_TOKEN, DEEPSEEK_API_KEY, DEEPSEEK_AUTH_TOKEN, NEXUSCLI_TOKEN. Add one as a *repository* secret (Settings → Secrets and variables → Actions). Environment-scoped secrets require jobs.<id>.environment."
            reason="missing_model_secret"
            run=false
          fi

          if [ "$HAS_GH" != "true" ]; then
            echo "::notice::No ARCHWIZ/OPERATOR token — PR comments may use GITHUB_TOKEN only"
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Gate: run=$run reason=$reason has_model=$HAS_MODEL pr=$pr_number"

  ack:
    needs: gate
    if: needs.gate.outputs.reason == 'mention' || needs.gate.outputs.reason == 'label:deepseek-ci' || needs.gate.outputs.reason == 'label:deepseek' || needs.gate.outputs.reason == 'label:deepCore' || needs.gate.outputs.reason == 'missing_model_secret'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Acknowledge (eyes) + tracking
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          GATE_REASON: ${{ needs.gate.outputs.reason }}
        with:
          script: |
            const number = context.payload.pull_request?.number || context.payload.issue?.number;
            const reason = process.env.GATE_REASON || 'unknown';
            const eventName = context.eventName;

            if (context.payload.comment?.id) {
              try {
                if (eventName === 'pull_request_review_comment') {
                  await github.rest.reactions.createForPullRequestReviewComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: context.payload.comment.id,
                    content: 'eyes',
                  });
                } else {
                  await github.rest.reactions.createForIssueComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: context.payload.comment.id,
                    content: 'eyes',
                  });
                }
              } catch (e) {
                core.info('Comment reaction skip: ' + e.message);
              }
            }

            if (number && (context.payload.comment || context.payload.review || context.payload.label)) {
              const isMissingSecret = reason === 'missing_model_secret';
              const bodyLines = isMissingSecret
                ? [
                    '`deepCore` (DeepSeek CI) trigger received but **model auth unset**.',
                    'Add a repository secret: `DEEPSEEK_TOKEN` | `DEEPSEEK_API_KEY` | `DEEPSEEK_AUTH_TOKEN` | `NEXUSCLI_TOKEN`.',
                    `Tracking: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                    '',
                    '_See docs/ops/DEEPSEEK-CI.md_',
                  ]
                : [
                    `⚡ \`deepCore\` (DeepSeek CI) received. reason=\`${reason}\``,
                    `Tracking: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                    '',
                    '_Live triggers: `@deepseek` / `@deepseek-ci` / `@deepCore` (case-insensitive). Labels: `deepseek-ci`, `deepseek`, `deepCore`. SSOT: docs/ops/AGENT-MONIKERS.md_',
                  ];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body: bodyLines.join('\n'),
              });
            }

  deepseek-agent:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      # First non-empty model secret wins (expression coalescing)
      DEEPSEEK_TOKEN: ${{ secrets.DEEPSEEK_TOKEN || secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_AUTH_TOKEN || secrets.NEXUSCLI_TOKEN }}
      OPERATOR_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1

      - name: Setup Node (PoW WASM)
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --quiet curl_cffi requests pyyaml

      - name: Ephemeral home + run CI mode
        env:
          PYTHONPATH: ${{ github.workspace }}/multi-ai-cli
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export HOME="${RUNNER_TEMP}/deepseek-webwrapper-home"
          mkdir -p "$HOME"
          chmod 700 "$HOME"
          export DEEPSEEK_WASM_SOLVER="${GITHUB_WORKSPACE}/deepcli/pow_solver.js"
          # Final guard: only positive decimal
          if [ -n "${PR_NUMBER:-}" ] && ! printf '%s' "$PR_NUMBER" | grep -qE '^[1-9][0-9]*$'; then
            echo "::error::Invalid PR_NUMBER=$PR_NUMBER"
            exit 1
          fi
          python -m ci_mode \
            --workspace "$GITHUB_WORKSPACE" \
            --cache-dir "${RUNNER_TEMP}/deepseek-cache" \
            --pr "${PR_NUMBER:-}"

      - name: Scrub ephemeral session
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/deepseek-webwrapper-home" "${RUNNER_TEMP}/deepseek-cache" || true

      - name: Upload non-secret summary
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: deepseek-output
          path: deepseek_output.json
          if-no-files-found: ignore
          retention-days: 7
