name: deepseek-secret-probe

# One-off diagnostic (owner-swarm DeepSeek route, 2026-11-02): prints ONLY
# len + sha256[:12] of the secret env values as the job sees them, posted
# to issue #3141. No secret value is ever printed. Provisioning's sealed
# fingerprint of record: DEEPSEEK_API_KEY sha256[:12]=dcf12286205f len=35.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fingerprint secret env values (hash only)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_AGENT_TOKEN: ${{ secrets.DEEPSEEK_AGENT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os, urllib.request
          def fp(name):
              v = os.environ.get(name)
              if v is None:
                  return {"present": False}
              b = v.encode()
              return {"present": True, "len": len(b),
                      "sha256_12": hashlib.sha256(b).hexdigest()[:12],
                      "stripped_len": len(v.strip())}
          out = {n: fp(n) for n in ("DEEPSEEK_API_KEY", "DEEPSEEK_AGENT_TOKEN")}
          body = ("DEEPSEEK_SECRET_PROBE run %s\n\nfingerprints (hash only): `%s`\n"
                  "expected DEEPSEEK_API_KEY: sha256_12=dcf12286205f len=35 (Provisioning seal of record)"
                  % (os.environ.get("GITHUB_RUN_ID"), json.dumps(out)))
          req = urllib.request.Request(
              "https://api.github.com/repos/timerloggedout-spec/termux-monorepo/issues/3141/comments",
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"},
              method="POST")
          urllib.request.urlopen(req)
          print(json.dumps(out))
          PYEOF
