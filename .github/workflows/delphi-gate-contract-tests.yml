name: Delphi Gate Contract Tests

on:
  pull_request:
    paths:
      - "scripts/delphi/**"
      - "ops/delphi/**"
      - "tests/test_delphi_gate.py"
      - ".github/workflows/delphi-gate-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delphi-gate-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Run Delphi gate contracts
        run: python -m pytest -q tests/test_delphi_gate.py
