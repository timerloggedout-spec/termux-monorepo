name: Delphi Gate Contract Tests

on:
  pull_request:
    paths:
      - "scripts/delphi/**"
      - "ops/delphi/**"
      - "ops/quota/registry.json"
      - ".github/workflows/delphi-gate.yml"
      - ".github/workflows/delphi-signal-bridge.yml"
      - "tests/test_delphi_gate.py"
      - ".github/workflows/delphi-gate-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delphi-gate-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Delphi gate contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Run Delphi gate contracts
        run: python -m pytest -q tests/test_delphi_gate.py
