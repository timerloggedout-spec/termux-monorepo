# Oracle Method proposal generation (owner correction 2026-10-27:
# proposals are GENERATED by the system; the gate evaluates them).
# Dispatch-only: renders a proposal from a committed brief + evidence
# set(s) and uploads it as an artifact. It never commits — a generated
# proposal lands through the normal PR process, like everything else.
name: delphi-generate

on:
  workflow_dispatch:
    inputs:
      brief_path:
        description: "Brief JSON path in repo (e.g. docs/proposals/active/<id>/brief.json)"
        required: true
        type: string
      evidence_path:
        description: "Evidence-set JSON path in repo"
        required: true
        type: string
      proposal_id:
        description: "Proposal slug for the artifact name"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate proposal from evidence
        env:
          BRIEF: ${{ inputs.brief_path }}
          EVIDENCE: ${{ inputs.evidence_path }}
        run: |
          set -euo pipefail
          mkdir -p build/generated-proposal
          python3 -B scripts/delphi/generate_proposal.py \
            --brief "$BRIEF" --evidence "$EVIDENCE" \
            --out build/generated-proposal
          python3 - <<'PY'
          import json
          from pathlib import Path
          prov = json.loads(Path("build/generated-proposal/PROVENANCE.json").read_text())
          assert prov["author"] == "oracle-method"
          assert prov["human_ballots_received"] == 0
          assert prov["external_calls_by_generator"] == 0
          print("generation contract: PASS", prov["proposal_id"])
          PY
      - name: Upload generated proposal
        uses: actions/upload-artifact@v4
        with:
          name: delphi-generated-${{ inputs.proposal_id }}-${{ github.run_id }}
          path: build/generated-proposal
          if-no-files-found: error
          retention-days: 14
