# Oracle Method proposal generation (owner correction 2026-10-27:
# proposals are GENERATED by the system; the gate evaluates them).
# A pass generates n candidate proposals and runs the full Oracle
# Method cycle: cross-vote round 1 with expectations recorded, the
# implementation parallel-comparisons round, an equalized-evidence
# re-vote, and calibration against the recorded expectations.
# Stages that cannot execute are recorded specified_not_run in the
# cycle record — never dropped, never fabricated.
# Dispatch-only: renders to artifacts. It never commits — generated
# proposals land through the normal PR process, like everything else.
name: delphi-generate

on:
  workflow_dispatch:
    inputs:
      brief_path:
        description: "Brief JSON path in repo (e.g. docs/proposals/active/<id>/brief.json)"
        required: true
        type: string
      evidence_path:
        description: "Evidence-set JSON path in repo"
        required: true
        type: string
      proposal_id:
        description: "Proposal / pass slug for the artifact name"
        required: true
        type: string
      pass_mode:
        description: "Pass mode: brief carries variants; emit n candidates + run the cycle"
        required: false
        default: false
        type: boolean
      implementation_results_path:
        description: "Optional repo dir with one <candidate-id>.json of test results per candidate; empty = implementation round recorded specified_not_run"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: read   # read the panel weights ledger (#1489) for cross-vote weighting

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate proposal(s) from evidence
        env:
          BRIEF: ${{ inputs.brief_path }}
          EVIDENCE: ${{ inputs.evidence_path }}
          PASS_MODE: ${{ inputs.pass_mode }}
        run: |
          set -euo pipefail
          mkdir -p build/generated-proposal
          if [ "$PASS_MODE" = "true" ]; then
            python3 -B scripts/delphi/generate_proposal.py --pass \
              --brief "$BRIEF" --evidence "$EVIDENCE" \
              --out build/generated-proposal
          else
            python3 -B scripts/delphi/generate_proposal.py \
              --brief "$BRIEF" --evidence "$EVIDENCE" \
              --out build/generated-proposal
            python3 - <<'PY'
          import json
          from pathlib import Path
          prov = json.loads(Path("build/generated-proposal/PROVENANCE.json").read_text())
          assert prov["author"] == "oracle-method"
          assert prov["human_ballots_received"] == 0
          assert prov["external_calls_by_generator"] == 0
          print("generation contract: PASS", prov["proposal_id"])
          PY
          fi
      - name: Run the Oracle Method cycle (pass mode)
        if: inputs.pass_mode
        env:
          IMPL_PATH: ${{ inputs.implementation_results_path }}
        run: |
          set -euo pipefail
          gh issue view 1489 -R "$GITHUB_REPOSITORY" --json comments \
            -q '[.comments[] | {body}]' > build/ledger-comments.json
          python3 - <<'PY'
          import json
          import sys
          sys.path.insert(0, "scripts/delphi")
          from cross_vote import load_ledger_weights
          comments = json.load(open("build/ledger-comments.json"))
          weights = load_ledger_weights(comments)
          if weights:
              json.dump(weights, open("build/ledger-weights.json", "w"))
              print("ledger weights loaded")
          else:
              print("no ledger weights found; panel.json defaults apply")
          PY
          cycle_args=(--pass-dir build/generated-proposal
                      --panel ops/delphi/panel.json
                      --out build/generated-proposal/cycle)
          if [ -f build/ledger-weights.json ]; then
            cycle_args+=(--weights-file build/ledger-weights.json)
          fi
          if [ -n "$IMPL_PATH" ]; then
            cycle_args+=(--implementation-dir "$IMPL_PATH")
          fi
          python3 -B scripts/delphi/method_cycle.py "${cycle_args[@]}"
      - name: Upload generated proposal(s) + cycle record
        uses: actions/upload-artifact@v4
        with:
          name: delphi-generated-${{ inputs.proposal_id }}-${{ github.run_id }}
          path: build/generated-proposal
          if-no-files-found: error
          retention-days: 14
