name: Delphi Oracle harmonious intake

on:
  issues:
    types: [opened, edited]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: delphi-oracle-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  normalize:
    if: >-
      github.event_name == 'issues' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      contains(github.event.issue.body || '', '### Research selection mode') &&
      contains(github.event.issue.body || '', '### Request category')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Normalize intake against canonical research registries
        id: normalize
        run: |
          set -euo pipefail
          python3 scripts/delphi/intake.py --output "$RUNNER_TEMP/delphi-intake.json"
          echo "record_path=$RUNNER_TEMP/delphi-intake.json" >> "$GITHUB_OUTPUT"

      - name: Record selection review and catalogue disposition
        uses: actions/github-script@v7
        env:
          RECORD_PATH: ${{ steps.normalize.outputs.record_path }}
        with:
          script: |
            const fs = require("fs");
            const record = JSON.parse(fs.readFileSync(process.env.RECORD_PATH, "utf8"));
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = "<!-- delphi-oracle-intake-record:v1 -->";
            const summary = [
              marker,
              "## Delphi Oracle intake normalized",
              "",
              `- Selection: \`${record.selection_id}\``,
              `- Research mode: **${record.research_selection.mode}** (${record.research_selection.status})`,
              `- Participants: ${record.research_selection.participants.length}`,
              `- DoE components: ${record.research_selection.doe_components.length}`,
              `- Methodology RFPs: ${record.research_selection.methodology_rfps.length}`,
              `- Research projects: ${record.research_selection.projects.length}`,
              `- Arms: ${record.research_selection.arms.join(", ")}`,
              `- Question Matrix: ${record.delphi.question_matrix.strategy}`,
              `- Selection review: ${record.disposition.selection_review}`,
              `- Registry catalogue: ${record.disposition.catalogue_write}`,
              "- Execution: **false**",
              "",
              "The research cohort remains segmented; scores stay silo-local and experiment dispatch remains disabled.",
              "",
              "<details><summary>Canonical selection record</summary>",
              "",
              "<pre>",
              JSON.stringify(record, null, 2)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;"),
              "</pre>",
              "</details>"
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issue.number, per_page: 100
            });
            const prior = comments.find(comment => comment.user && comment.user.type === "Bot" && comment.body && comment.body.includes(marker));
            let comment;
            if (prior) {
              const response = await github.rest.issues.updateComment({
                owner, repo, comment_id: prior.id, body: summary
              });
              comment = response.data;
            } else {
              const response = await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number, body: summary
              });
              comment = response.data;
            }

            if (record.disposition.selection_review) {
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name: "delphi:selection-review",
                  color: "5319e7",
                  description: "Normalized Delphi Oracle selection awaiting review"
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
              const currentLabels = (issue.labels || []).map(label =>
                typeof label === "string" ? label : label.name
              );
              if (!currentLabels.includes("delphi:selection-review")) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issue.number,
                  labels: ["delphi:selection-review"]
                });
              }
            }

            let cataloguePrUrl = "";
            if (record.disposition.catalogue_write) {
              const base = await github.rest.git.getRef({
                owner, repo, ref: "heads/master"
              });
              const baseSha = base.data.object.sha;
              const branch = `delphi/selection-catalogue-${issue.number}-${record.record_sha256.slice(0, 8)}`;
              try {
                await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({
                  owner, repo, ref: `refs/heads/${branch}`, sha: baseSha
                });
              }

              const manifestPath = "ops/delphi/selection-catalogue.json";
              const manifestFile = await github.rest.repos.getContent({
                owner, repo, path: manifestPath, ref: branch
              });
              if (Array.isArray(manifestFile.data) || !manifestFile.data.content) {
                throw new Error("Selection catalogue manifest path must resolve to a file");
              }
              const catalogue = JSON.parse(Buffer.from(manifestFile.data.content, "base64").toString("utf8"));
              if (catalogue.schema !== "delphi.selection-catalogue.v1" ||
                  catalogue.policy.execution !== false ||
                  catalogue.policy.cross_silo_score_aggregation !== false) {
                throw new Error("Selection catalogue contract mismatch");
              }

              const recordPath = `ops/delphi/selection-catalogue/${record.selection_id}/${record.record_sha256}.json`;
              let existingRecord = null;
              try {
                const current = await github.rest.repos.getContent({
                  owner, repo, path: recordPath, ref: branch
                });
                if (Array.isArray(current.data) || !current.data.content) {
                  throw new Error("Selection record path must resolve to a file");
                }
                existingRecord = current.data;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const recordContent = JSON.stringify(record, null, 2) + "\n";
              if (existingRecord) {
                const priorContent = Buffer.from(existingRecord.content, "base64").toString("utf8");
                if (priorContent !== recordContent) {
                  throw new Error("Immutable selection record content mismatch");
                }
              } else {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path: recordPath,
                  message: `data(delphi): catalogue selection #${issue.number} (DORI-002)`,
                  content: Buffer.from(recordContent).toString("base64"),
                  branch
                });
              }

              const existing = await github.rest.pulls.list({
                owner, repo, state: "all", head: `${owner}:${branch}`,
                base: "master", per_page: 100
              });
              const mergedPr = existing.data.find(item => item.merged_at);
              let pr = existing.data.find(item => item.state === "open");
              if (mergedPr) {
                pr = mergedPr;
              } else if (!pr && existing.data[0]) {
                const reopened = await github.rest.pulls.update({
                  owner, repo, pull_number: existing.data[0].number, state: "open"
                });
                pr = reopened.data;
              } else if (!pr) {
                const created = await github.rest.pulls.create({
                  owner, repo,
                  title: `data(delphi): catalogue selection from #${issue.number}`,
                  head: branch,
                  base: "master",
                  body: [
                    "Implements: DORI-002",
                    "",
                    `Source intake: #${issue.number}`,
                    `Selection ID: ${record.selection_id}`,
                    `Record SHA-256: ${record.record_sha256}`,
                    `Catalogue record: ${recordPath}`,
                    "",
                    "This PR adds one immutable reference-only Delphi selection record.",
                    "Execution remains false; this record contains selection metadata and registry references only."
                  ].join("\n")
                });
                pr = created.data;
              }
              cataloguePrUrl = pr.html_url;
              if (!mergedPr) {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: "repo-gate.yml", ref: branch
                });
              }
            }

            const finalBody = summary + (cataloguePrUrl
              ? `\n\n**Registry catalogue PR:** ${cataloguePrUrl}`
              : "");
            if (finalBody !== comment.body) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: comment.id, body: finalBody
              });
            }
