# Delphi RFP flood feed refresh (contract: docs/ops/DELPHI-RFP-FEED.md).
# Regenerates apps/tribute-dashboard/data/delphi-rfp-feed.json from
# the open delphi:rfp issues and their gate ledger comments, and
# proposes it as a refresh PR — never commits directly.
#
# F1 ADOPTION — Termux Fleet Swarm (issue #2750 wave, 2026-10-31): the
# branch push + refresh-PR create run on a Swarm app token (SEC-03
# minting), NOT the default GITHUB_TOKEN — default-token PR events do
# not trigger downstream workflows (anti-recursion) and park as
# action_required (17 of the most-recent 400 parked runs sampled
# 2026-10-31 sat on this family's branch). Collection reads stay on
# the default token. Mint failure fails the job loudly on purpose:
# a silent fallback would re-park the refresh PR invisibly.
name: delphi-rfp-feed-collect

on:
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * 2'
  workflow_run:
    workflows: [delphi-gate]
    types: [completed]

concurrency:
  group: delphi-rfp-feed-collect
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Mint Swarm app token (F1, issue #2750)
        id: swarm-token
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3 release
        with:
          app-id: ${{ vars.TERMUX_FLEET_SWARM_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.swarm-token.outputs.token }}
      - name: Freshness gate (event-driven runs only)
        id: gate
        if: github.event_name == 'workflow_run'
        run: |
          # Loop breaker (2026-10-29 burst root cause): delphi-gate
          # completed 143 times in 25 min and every completion fired an
          # unthrottled collect (~30-80 API calls each), exhausting the
          # shared rate buckets; collectors then failed exit-1 for 5h.
          # Event-driven collects now run at most once per 15 min —
          # the same freshness-gate pattern reviewer-metrics-collect
          # uses at 24h. Dispatch and schedule always proceed.
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          skip = False
          try:
              out = subprocess.run(
                  ["gh", "run", "list", "--workflow",
                   "delphi-rfp-feed-collect.yml", "--status", "success",
                   "--limit", "1", "--json", "createdAt"],
                  capture_output=True, text=True, timeout=60)
              runs = json.loads(out.stdout or "[]")
              if runs:
                  last = datetime.fromisoformat(
                      runs[0]["createdAt"].replace("Z", "+00:00"))
                  age_min = (datetime.now(timezone.utc) - last).total_seconds() / 60
                  skip = age_min < 15
                  print(f"last successful collect {age_min:.1f} min ago; "
                        f"event-driven collect {'skipped (<15m)' if skip else 'proceeds'}")
              else:
                  print("no successful collect on record; event-driven collect proceeds")
          except Exception as exc:
              print(f"freshness gate unreadable ({exc}); event-driven collect proceeds")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          PY
      - name: Fetch the RFP census cache
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python3 -B scripts/delphi/rfp_flood_fetch.py --cache .rfp-cache
      - name: Collect the feed
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python3 -B scripts/delphi/rfp_flood_feed.py \
            --cache .rfp-cache --out apps/tribute-dashboard/data/delphi-rfp-feed.json
      - name: Propose the refresh as a PR
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.swarm-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/tribute-dashboard/data/delphi-rfp-feed.json; then
            echo "feed unchanged; no refresh PR"
            exit 0
          fi
          branch="delphi-rfp-feed/refresh"
          git config user.name "termux-fleet-swarm[bot]"
          git config user.email "350898559+termux-fleet-swarm[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add apps/tribute-dashboard/data/delphi-rfp-feed.json
          git commit -m "chore(delphi): refresh delphi-rfp-feed"
          git push -f origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore(delphi): refresh delphi-rfp-feed.json" \
            --body "Automated RFP flood feed refresh (collector: scripts/delphi/rfp_flood_feed.py; contract: docs/ops/DELPHI-RFP-FEED.md). Data is derived live from the open delphi:rfp issues and their gate ledger comments at collection time; nothing is copied forward." \
            || echo "refresh PR already open"
