name: Dependency Phase Dispatch

on:
  repository_dispatch:
    types: [dependency-phase-ready]
  workflow_dispatch:
    inputs:
      phase_id:
        description: "Canonical phase ID to revalidate"
        required: true
        type: string
      issue_number:
        description: "GitHub issue used for the idempotent claim"
        required: true
        type: string
      apply:
        description: "Record claim and invoke configured agent (default: dry-run)"
        required: true
        default: false
        type: boolean

concurrency:
  group: dependency-phase-dispatch-${{ github.repository }}-${{ github.event.client_payload.phase_id || inputs.phase_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  dispatch:
    # Claims and downstream agent launches originate only from the master branch.
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      # Match the repository's existing privileged automation precedence.
      OPERATOR_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
      PHASE_ID: ${{ github.event.client_payload.phase_id || inputs.phase_id }}
      ISSUE_NUMBER: ${{ github.event.client_payload.issue_number || inputs.issue_number }}
      APPLY: ${{ github.event_name == 'repository_dispatch' || inputs.apply }}
      JULES_ENABLED: ${{ secrets.JULES_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Revalidate and create idempotent claim
        id: claim
        run: |
          set -euo pipefail
          arguments=(--live --repo "${{ github.repository }}" dispatch --phase-id "$PHASE_ID" --issue "$ISSUE_NUMBER")
          if [ "$APPLY" = "true" ]; then
            arguments=(--live --apply --repo "${{ github.repository }}" dispatch --phase-id "$PHASE_ID" --issue "$ISSUE_NUMBER")
          fi
          python3 scripts/agentic/dependency_phases.py "${arguments[@]}" | tee claim.json
          echo "claimed=$(jq -r '.claimed' claim.json)" >> "$GITHUB_OUTPUT"
          echo "idempotency_key=$(jq -r '.idempotency_key' claim.json)" >> "$GITHUB_OUTPUT"

      - name: Invoke Jules after successful claim
        if: ${{ env.APPLY == 'true' && steps.claim.outputs.claimed == 'true' && env.JULES_ENABLED == 'true' }}
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: master
          prompt: |
            Dependency phase ${{ env.PHASE_ID }} was claimed with idempotency key ${{ steps.claim.outputs.idempotency_key }}.
            Follow AGENTS.md and docs/agentic/dependency-phases.json. Read only the phase-relevant contracts and current issue #${{ env.ISSUE_NUMBER }}. Make the smallest reviewable change, target master, cite Implements: ${{ env.PHASE_ID }}, and open a PR. Do not merge, close proposals, update submodules, or alter Project configuration.

      - name: Upload claim record
        uses: actions/upload-artifact@v4
        with:
          name: dependency-phase-claim-${{ github.run_id }}
          path: claim.json
          if-no-files-found: error
