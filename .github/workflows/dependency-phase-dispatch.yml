name: Dependency Phase Dispatch

on:
  repository_dispatch:
    types: [dependency-phase-ready]
  workflow_dispatch:
    inputs:
      phase_id:
        description: "Canonical phase ID to revalidate"
        required: true
        type: string
      issue_number:
        description: "GitHub issue used for the idempotent claim"
        required: true
        type: string
      specialist:
        description: "Explicit manager selection from the live candidate pool"
        required: false
        type: string
      apply:
        description: "Record claim after verified adapter routing (default: dry-run)"
        required: true
        default: false
        type: boolean

concurrency:
  group: dependency-phase-dispatch-${{ github.repository }}-${{ github.event.client_payload.phase_id || inputs.phase_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  dispatch:
    # Claims originate only from master. Provider execution requires a separately verified live adapter.
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      # Match the repository's existing privileged automation precedence.
      OPERATOR_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
      PHASE_ID: ${{ github.event.client_payload.phase_id || inputs.phase_id }}
      ISSUE_NUMBER: ${{ github.event.client_payload.issue_number || inputs.issue_number }}
      SELECTED_SPECIALIST: ${{ github.event.client_payload.selected_specialist || inputs.specialist }}
      APPLY: ${{ github.event_name == 'repository_dispatch' || inputs.apply }}
      # Evaluate live adapter readiness separately from credential presence.
      ROUTE_JULES_ADAPTER_READY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve manager-approved specialist route
        id: route
        run: |
          set -euo pipefail
          route_args=(--plan docs/agentic/dependency-phases.json --phase-id "$PHASE_ID")
          if [ -n "$SELECTED_SPECIALIST" ]; then
            route_args+=(--selected-specialist "$SELECTED_SPECIALIST")
          fi
          python3 scripts/agentic/dependency_phase_route.py "${route_args[@]}" | tee route.json
          echo "selected_specialist=$(jq -r '.selected_specialist // empty' route.json)" >> "$GITHUB_OUTPUT"
          echo "manager_policy=$(jq -r '.manager_policy' route.json)" >> "$GITHUB_OUTPUT"
          if [ "$APPLY" = "true" ] && [ -z "$(jq -r '.selected_specialist // empty' route.json)" ]; then
            state=$(jq -r '.state' route.json)
            if [ "$state" = "manager_selection_required" ]; then
              echo "Multiple live adapters are available; pass the specialist input for explicit manager selection." >&2
            else
              echo "The manager-approved route has zero available execution adapters." >&2
            fi
            exit 1
          fi

      - name: Revalidate and create idempotent claim
        id: claim
        run: |
          set -euo pipefail
          arguments=(--live --repo "${{ github.repository }}" dispatch --phase-id "$PHASE_ID" --issue "$ISSUE_NUMBER" --route-specialist "${{ steps.route.outputs.selected_specialist }}" --route-policy "${{ steps.route.outputs.manager_policy }}")
          if [ "$APPLY" = "true" ]; then
            arguments=(--live --apply --repo "${{ github.repository }}" dispatch --phase-id "$PHASE_ID" --issue "$ISSUE_NUMBER" --route-specialist "${{ steps.route.outputs.selected_specialist }}" --route-policy "${{ steps.route.outputs.manager_policy }}")
          fi
          python3 scripts/agentic/dependency_phases.py "${arguments[@]}" | tee claim.json
          echo "claimed=$(jq -r '.claimed' claim.json)" >> "$GITHUB_OUTPUT"
          echo "wave=$(jq -r '.wave' claim.json)" >> "$GITHUB_OUTPUT"
          echo "idempotency_key=$(jq -r '.idempotency_key' claim.json)" >> "$GITHUB_OUTPUT"

      # Google Jules became read-only after 2026-11-11. The local Jules-derived
      # DoE role skill pack supplies capability guidance; provider execution requires a separate live adapter.
      # Applied dispatch remains gated until a concrete non-Jules adapter is
      # implemented and its ROUTE_<AGENT>_ADAPTER_READY probe is wired.

      - name: Upload claim record
        uses: actions/upload-artifact@v4
        with:
          name: dependency-phase-claim-${{ github.run_id }}
          path: |
            claim.json
            route.json
          if-no-files-found: error
