name: '⚙️ Dispatch Executor (admitted -> claim + fire)'

# #5176: converts filings in state {swarm-admitted AND dispatch-queued
# AND unclaimed} into {producer claim + build-dispatch fire}. Consumes
# admitted state ONLY -- never re-evaluates deferred-by-tier filings
# (admission drain = #4977 Fix 3b).
#
# Gates are fail-closed (scripts/ops/dispatch_executor.py): eligibility,
# arm selection per the #5151 registry + census, quota gates off the
# Cadence LEDGER (#5152) mirror, and the standing pre-flight law.
# A HOLD names its cause; nothing fires on an unknown.
# One conversion per run by default (max_conversions=1) -- minimal
# blast radius, one auditable stamp set per run. QDesk may raise it
# via workflow_dispatch input.
#
# Fail-visible: a script/workflow error fails the run loudly, uploads
# the receipt artifact, and stamps an executor_error comment on #5176
# (the filing of record). HOLDs are recorded in the receipt artifact
# and step summary ONLY -- no comment per hold per run (the
# state-comment flurry lesson, #5176 c.6823792254); a filing gets a
# comment only when it transitions (claim/fire).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      max_conversions:
        description: 'Max filings to convert this run (default 1; raise only on a QDesk decision)'
        required: false
        default: '1'
      dry_run:
        description: 'Decide only; claim nothing and fire nothing'
        required: false
        default: 'false'
        type: boolean

permissions: {}

concurrency:
  group: dispatch-executor
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # contents: write is for the probe-record commit ONLY
      # (bucket-headroom feed + quota-probe ledger, QUE #5176 fold).
      contents: write
      issues: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Mint Termux Fleet Swarm token (claim + fire)
        id: swarm
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3
        with:
          app-id: ${{ vars.TERMUX_FLEET_SWARM_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-actions: write

      - name: Collect admitted filings
        env:
          GH_TOKEN: ${{ steps.swarm.outputs.token }}
        run: |
          set -euo pipefail
          gh api 'repos/${{ github.repository }}/issues?labels=swarm-admitted,dispatch-queued&state=open&per_page=100' \
            --jq '[.[] | {number, title, labels: [.labels[].name]}]' > filings.json
          echo "admitted+queued: $(jq length filings.json)"

      # #5160: derive the pool + cadence decisions first (deterministic,
      # no inference, no metering). The derivation reads the registry +
      # census + the published ledger snapshot when one exists
      # (ops/que/feeds/ledger-snapshot.json -- absent until #5113 T2
      # publishes the read contract) and emits the executor's --usage
      # record; without a snapshot the usage record is empty and the
      # executor keeps holding on quota_unknown (fail-closed).
      - name: Derive pool + cadence (#5160)
        id: derive
        run: |
          set -euo pipefail
          SNAPSHOT_ARGS=()
          if [ -f ops/que/feeds/ledger-snapshot.json ]; then
            SNAPSHOT_ARGS=(--snapshot ops/que/feeds/ledger-snapshot.json)
          fi
          python3 scripts/ops/auto_quota_cadence.py \
            --arms ops/dispatch/build-arms.json \
            --census ops/que/feeds/arm-census.json \
            --registry ops/quota/registry.json \
            "${SNAPSHOT_ARGS[@]}" \
            --previous ops/que/feeds/pool-cadence.json \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out pool-cadence.json \
            --usage-out pool-usage.json

      - name: Decide (executor)
        id: decide
        run: |
          set -euo pipefail
          WORKFLOW_SHA="$(git rev-parse HEAD:.github/workflows/dispatch-executor.yml)"
          SCRIPT_SHA="$(git rev-parse HEAD:scripts/ops/dispatch_executor.py)"
          MEASURED_FLAG=""
          if [ -f ops/que/feeds/bucket-headroom.json ]; then
            MEASURED_FLAG="--measured ops/que/feeds/bucket-headroom.json"
          fi
          python3 scripts/ops/dispatch_executor.py decide \
            --filings filings.json \
            --arms ops/dispatch/build-arms.json \
            --census ops/que/feeds/arm-census.json \
            --usage pool-usage.json \
            $MEASURED_FLAG \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --run-id "${{ github.run_id }}" \
            --max-conversions "${{ inputs.max_conversions || 1 }}" \
            --workflow-ref ".github/workflows/dispatch-executor.yml" \
            --workflow-sha "$WORKFLOW_SHA" \
            --script-sha "$SCRIPT_SHA" \
            --out decisions.json
          echo "fires: $(jq '[.decisions[] | select(.action=="fire")] | length' decisions.json)"
          echo "holds: $(jq '[.decisions[] | select(.action=="hold")] | length' decisions.json)"

      - name: Claim + fire (one conversion per decision)
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.swarm.outputs.token }}
        run: |
          set -euo pipefail
          jq -c '.decisions[] | select(.action=="fire")' decisions.json | while read -r d; do
            n="$(echo "$d" | jq -r .issue)"
            arm="$(echo "$d" | jq -r .arm)"
            qc="$(echo "$d" | jq -r .quota_class)"
            # Claim first (comment + label in one motion -- the claim is
            # the exactly-once mutex), then fire build-dispatch.
            echo "$d" | jq -r .claim_body > claim.md
            gh issue comment "$n" --body-file claim.md
            gh issue edit "$n" --add-label dispatch-claimed
            gh workflow run build-dispatch.yml --ref master \
              -f issue_number="$n" -f arm="$arm" -f quota_class="$qc"
            echo "fired #$n on $arm ($qc)"
          done

      - name: Probe (bounded validation — quota_unknown resolves by usage)
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.swarm.outputs.token }}
        run: |
          set -euo pipefail
          # QUE #5176 fold c.6842923762: a quota_unknown gate outcome
          # earns ONE bounded validation probe per run (decide()
          # enforces the budget). Vehicle = the build-arm-census
          # bounded smoke for that arm; its outcome is recorded via
          # the #5230 record surface (hash-chained quota_probe event
          # + typed headroom), committed back for the next cycle.
          jq -c '.decisions[] | select(.probe != null)' decisions.json | while read -r d; do
            arm="$(echo "$d" | jq -r .probe.arm)"
            echo "probing $arm (bounded census smoke)"
            start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run build-arm-census.yml --ref master -f arm="$arm"
            sleep 10
            run_id="$(gh run list --workflow build-arm-census.yml --created ">=$start" --limit 1 --json databaseId --jq '.[0].databaseId')"
            gh run watch "$run_id" --exit-status > /dev/null || true
            mkdir -p probe-census
            gh run download "$run_id" -n arm-census -D probe-census
            python3 scripts/ops/dispatch_executor.py probe-result \
              --census probe-census/arm-census.json \
              --arms ops/dispatch/build-arms.json \
              --arm "$arm" --run-id "$run_id" \
              --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --out probe-result.json
            python3 scripts/ops/bucket_headroom.py record-probe \
              --feed ops/que/feeds/bucket-headroom.json \
              --probe probe-result.json \
              --ledger ops/quota/quota-probe-ledger.jsonl \
              --feed-out ops/que/feeds/bucket-headroom.json
            git config user.name "termux-fleet-swarm[bot]"
            git config user.email "termux-fleet-swarm[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            for attempt in 1 2 3; do
              git add ops/que/feeds/bucket-headroom.json ops/quota/quota-probe-ledger.jsonl
              if git diff --cached --quiet; then echo "probe record unchanged — no commit"; break; fi
              git commit -m "quota-probe: measured state for $arm (executor probe, run $run_id) [skip ci]"
              if git push origin HEAD:master; then echo "probe record pushed (attempt $attempt)"; break; fi
              git fetch origin master && git rebase origin/master
            done
          done

      - name: Publish receipt artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dispatch-executor-receipt
          path: |
            decisions.json
            filings.json
            pool-cadence.json
            pool-usage.json
          retention-days: 30

      - name: "Stamp executor error on #5176"
        if: failure()
        env:
          GH_TOKEN: ${{ steps.swarm.outputs.token }}
        run: |
          gh issue comment 5176 --body "**DISPATCH-EXECUTOR ERROR** — run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed. Receipt artifact: dispatch-executor-receipt. No filing was claimed or fired by this run; the failure is fail-visible here, not silent."

      - name: Summary
        if: always()
        run: |
          {
            echo "## Dispatch executor — run ${{ github.run_id }}"
            echo ""
            echo "- fires: $(jq '[.decisions[] | select(.action=="fire")] | length' decisions.json 2>/dev/null || echo '?')"
            echo "- holds: $(jq '[.decisions[] | select(.action=="hold")] | length' decisions.json 2>/dev/null || echo '?')"
            echo "- probes: $(jq '[.decisions[] | select(.probe != null)] | length' decisions.json 2>/dev/null || echo '?')"
            echo ""
            echo "Holds (named causes):"
            echo ""
            jq -r '.decisions[] | select(.action=="hold") | "- #\(.issue): \(.hold_reason)"' decisions.json 2>/dev/null || echo "(decisions.json unavailable)"
          } >> "$GITHUB_STEP_SUMMARY"
