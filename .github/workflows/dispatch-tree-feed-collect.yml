# Dispatch-tree feed refresh (contract: docs/ops/DISPATCH-TREE-FEED.md).
# Regenerates scripts/dashboards/dispatch_tree_observation.json (read-only
# observer, Actions API) and apps/tribute-dashboard/data/
# dispatch-tree-feed.json (offline collector), and proposes them as a
# refresh PR — never commits directly. Mirrors the
# linguist-panel-feed-collect pattern. Each run appends one busy sample
# to the feed's admission series.
name: dispatch-tree-feed-collect

on:
  workflow_dispatch:
  schedule:
    - cron: '7 7 * * *'
  push:
    branches: [master]
    paths:
      - '.github/workflows/quota-dispatch-tree.yml'
      - 'scripts/dashboards/dispatch_tree_observe.py'
      - 'scripts/dashboards/dispatch_tree_feed.py'

concurrency:
  group: dispatch-tree-feed-collect
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint Termux Fleet Swarm token (own rate bucket)
        # #5219 leg (a): this collector's API reads/writes drew the shared
        # per-repo GITHUB_TOKEN bucket (1,000/h class) exhausted on
        # 2026-11-12. The Swarm App installation token carries its own
        # 12,500 bucket. Downscoped to this workflow's declared permissions.
        id: swarm
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3
        with:
          app-id: ${ vars.TERMUX_FLEET_SWARM_APP_ID }
          private-key: ${ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }
          repositories: ${ github.event.repository.name }
          permission-actions: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.swarm.outputs.token }}
      - name: Observe (Actions API snapshot)
        run: |
          set -uo pipefail
          python3 -B scripts/dashboards/dispatch_tree_observe.py \
            --out scripts/dashboards/dispatch_tree_observation.json 2>&1 | tee /tmp/obs.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            cp /tmp/obs.log dispatch-tree-observe-failure.log || true
            git config user.name "dispatch-tree-feed-collect"
            git config user.email "actions@github.com"
            git checkout -B "dispatch-tree-feed/diag" || true
            git add dispatch-tree-observe-failure.log || true
            git commit -m "diag: observer failure log" || true
            git push -f origin "dispatch-tree-feed/diag" || true
            exit "$rc"
          fi
        env:
          GITHUB_TOKEN: ${{ steps.swarm.outputs.token }}
          GH_TOKEN: ${{ steps.swarm.outputs.token }}
      - name: Collect the feed (offline)
        run: |
          set -euo pipefail
          python3 -B scripts/dashboards/dispatch_tree_feed.py \
            --out apps/tribute-dashboard/data/dispatch-tree-feed.json
      - name: Propose the refresh as a PR
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/dashboards/dispatch_tree_observation.json apps/tribute-dashboard/data/dispatch-tree-feed.json; then
            echo "feed unchanged; no refresh PR"
            exit 0
          fi
          branch="dispatch-tree-feed/refresh"
          git config user.name "dispatch-tree-feed-collect"
          git config user.email "actions@github.com"
          git checkout -B "$branch"
          git add scripts/dashboards/dispatch_tree_observation.json apps/tribute-dashboard/data/dispatch-tree-feed.json
          git commit -m "chore(dashboards): refresh dispatch-tree feed + observation"
          git push -f origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore(dashboards): refresh dispatch-tree feed" \
            --body "Automated dispatch-tree feed refresh (observer: scripts/dashboards/dispatch_tree_observe.py; collector: scripts/dashboards/dispatch_tree_feed.py; contract: docs/ops/DISPATCH-TREE-FEED.md). Busy counts are read live at collection time; nothing is copied forward." \
            || echo "refresh PR already open"
        env:
          GH_TOKEN: ${{ steps.swarm.outputs.token }}
