name: DO Statement Style

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issues:
    types: [opened, edited]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: do-statement-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.event.discussion.number || github.ref }}
  cancel-in-progress: true

jobs:
  action-first-language:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'issues' ||
      github.event_name == 'discussion' ||
      (
        (
          github.event_name == 'issue_comment' ||
          github.event_name == 'discussion_comment' ||
          github.event_name == 'pull_request_review_comment'
        ) && !endsWith(github.actor, '[bot]')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check DO statements, PR text, comments, and commit subjects
        run: python scripts/ci/check_do_statement_style.py

      - name: Set up Node for Markdown lint
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Lint changed Markdown
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "${{ github.event.before }}" =~ ^0+$ ]]; then
            RANGE=""
          fi
          if [[ -n "$RANGE" ]]; then
            mapfile -t FILES < <(git diff --name-only "$RANGE" -- '*.md' | grep -v '^docs/archive/' || true)
          else
            mapfile -t FILES < <(find docs .github -type f -name '*.md' -not -path 'docs/archive/*'; test -f README.md && echo README.md)
          fi
          if (("${#FILES[@]}")); then
            npx --yes markdownlint-cli2@0.24.1 "${FILES[@]}"
          else
            echo "Markdown lint: no eligible changed files"
          fi
      - name: Vale prose lint
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3
        with:
          fail_on_error: true
          files: '["docs", ".github", "README.md"]'
