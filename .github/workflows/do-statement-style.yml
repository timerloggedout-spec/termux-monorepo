name: DO Statement Style

on:
  push:
  pull_request:

jobs:
  action-first-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check DO statements, collaboration text, and commit subjects
        run: python scripts/ci/check_do_statement_style.py
