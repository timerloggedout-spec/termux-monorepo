name: DO Statement Style

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issues:
    types: [opened, edited]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  commit_comment:
    types: [created, edited]
  release:
    types: [published, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: do-statement-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.event.discussion.number || github.event.release.id || github.ref }}
  cancel-in-progress: true

jobs:
  action-first-language:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'issues' ||
      github.event_name == 'discussion' ||
      github.event_name == 'release' ||
      (
        (
          github.event_name == 'issue_comment' ||
          github.event_name == 'commit_comment' ||
          github.event_name == 'discussion_comment' ||
          github.event_name == 'pull_request_review' ||
          github.event_name == 'pull_request_review_comment'
        ) && !endsWith(github.actor, '[bot]')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Review DO statements, collaboration text, and commit subjects
        run: python scripts/ci/check_do_statement_style.py
