name: DoE live-3 auto-dispatch

# Rule-5 automation for experiments/doe/live-3-phrases-deepseek
# (WO-A). One workflow run = one designed dispatch, end to end:
#   plan (live3_dispatcher: A3/cb-1 code screen, daily budget,
#   cell assignment, phrase_layer composition, instance stamp)
#   -> send -> record (EXPERIMENT record + SUMMARY) -> commit-back.
#
# SEND LEG (doe-expert ruling (a), 2026-10-31): the PRIMARY
# OpenRouter route is dead (deepseek/deepseek-r1:free delisted;
# account paid-incapable). The authorized ALT is the deepseek-ci
# COMMENT SURFACE: the send step posts the composed, stamped
# prompt as the dispatch comment on the target PR. The manual
# OpenRouter leg (doe-phrase-dispatch.yml + phrase_dispatch.py)
# is retained for the record; it is not used here.
# Excluded targets (exit 4) and budget exhaustion (exit 5) stop
# the run loudly before any dispatch is made.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Target PR for the review dispatch'
        required: true
        type: string
      task_path:
        description: 'Committed task prompt file (the review task text)'
        required: true
        type: string
      pr_head:
        description: 'Target PR head sha (40-hex)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Plan dispatch (screen + assign + compose + stamp)
        id: plan
        run: |
          python3 scripts/doe/live3_dispatcher.py plan \
            --pr "${{ inputs.pr_number }}" \
            --pr-head "${{ inputs.pr_head }}" \
            --task-file "${{ inputs.task_path }}" \
            --design experiments/doe/live-3-phrases-deepseek/DESIGN.json \
            --phrases ops/phrases/phrases.json \
            --live1-records experiments/doe/live-1-wave-framing/records \
            --cb1-records experiments/doe/cb-1-chronomancer-emission/records \
            --dispatch-dir experiments/doe/live-3-phrases-deepseek/dispatch \
            --state experiments/doe/live-3-phrases-deepseek/dispatch/state.json
          JOB=$(ls experiments/doe/live-3-phrases-deepseek/dispatch/job-*.json | tail -1)
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
      - name: Send dispatch (deepseek-ci comment surface)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_PATH: ${{ steps.plan.outputs.job }}
        run: |
          mkdir -p doe-dispatch-out
          python3 - <<'EOF'
          import datetime as dt, json, os, subprocess
          job = json.load(open(os.environ["JOB_PATH"]))
          body = (
              f"[MUSEai]@{{role:{{doe-mgr-phrases-jit}}}} — "
              f"live-3-phrases-deepseek dispatch "
              f"#{job['dispatch_no']} · cell "
              f"`{job['assignment']['cell']}` (stage 1, fixed-anchor) "
              f"· route deepseek-ci comment surface (ALT, ruling (a)) "
              f"· prompt sha256 `{job['prompt_sha256'][:12]}` · "
              f"instance `{str(job.get('instance_key'))[:16]}`\n\n"
              + job["prompt"])
          open("dispatch-comment.md", "w").write(body)
          subprocess.run(["gh", "pr", "comment",
                          str(job["task"]["pr"]),
                          "--body-file", "dispatch-comment.md"],
                         check=True)
          result = {"status": "ok", "via": "deepseek-ci-comment",
                    "finished_at": dt.datetime.now(
                        dt.timezone.utc).isoformat(),
                    "response_sha256": None,
                    "response_chars": None,
                    "note": "dispatch comment posted; the route "
                            "response lands as the surface reply "
                            "and is harvested by the record loop"}
          json.dump(result, open("doe-dispatch-out/result.json", "w"),
                    indent=1)
          print("dispatch comment posted on PR", job["task"]["pr"])
          EOF
      - name: Record + summary + commit back
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/doe/live3_dispatcher.py record \
            --job "${{ steps.plan.outputs.job }}" \
            --result doe-dispatch-out/result.json \
            --records-dir experiments/doe/live-3-phrases-deepseek/records \
            --summary experiments/doe/live-3-phrases-deepseek/SUMMARY.json \
            --state experiments/doe/live-3-phrases-deepseek/dispatch/state.json \
            --base-sha "${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/doe/live-3-phrases-deepseek/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data(doe): live-3 auto-dispatch record [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin master
            if git rebase origin/master && git push; then
              echo "records pushed (attempt $attempt)"
              exit 0
            fi
            git rebase --abort || true
          done
          echo "push failed after 3 attempts"
          exit 1
