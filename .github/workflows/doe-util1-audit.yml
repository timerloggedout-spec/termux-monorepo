name: doe-util1-audit
on:
  schedule: [{cron: "23 6 * * 1"}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 experiments/doe/util-1-provider-rotation/scripts/util1_auditor.py
      - name: commit records
        run: |
          git config user.name "termux-fleet-swarm[bot]"
          git config user.email "swarm@timerloggedout-spec"
          git add experiments/doe/util-1-provider-rotation/records/
          git diff --cached --quiet || git commit -m "doe: util-1 audit records"
          git push || true
