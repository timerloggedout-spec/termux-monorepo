name: Enterprise organization repository transfer

run-name: "${{ inputs.mode }} transfer: ${{ inputs.source_org }} to ${{ inputs.target_org }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Review the transfer plan or apply the repository transfers"
        required: true
        type: choice
        options:
          - dry_run
          - apply
        default: dry_run
      source_org:
        description: "Organization scheduled for Enterprise trial deletion"
        required: true
        type: string
        default: search-astute-ly
      target_org:
        description: "Independent GitHub Free destination organization"
        required: true
        type: string
        default: asastraneonexus
      baseline_run_id:
        description: "Baseline Actions run ID from the preservation verifier"
        required: true
        type: string
      confirmation:
        description: "Exact confirmation string printed by the dry-run receipt"
        required: false
        type: string

concurrency:
  group: enterprise-org-transfer
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN }}
      SOURCE_ORG: ${{ inputs.source_org }}
      TARGET_ORG: ${{ inputs.target_org }}
      MODE: ${{ inputs.mode }}
      BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
      CREDENTIAL_REF: ${{ secrets.ARCHWIZ_GITHUB_TOKEN != '' && 'ARCHWIZ_GITHUB_TOKEN' || secrets.OPERATOR_GITHUB_TOKEN != '' && 'OPERATOR_GITHUB_TOKEN' || secrets.OPERATOR_TOKEN != '' && 'OPERATOR_TOKEN' || 'UNAVAILABLE' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate operator credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure ARCHWIZ_GITHUB_TOKEN, OPERATOR_GITHUB_TOKEN, or OPERATOR_TOKEN."
            exit 1
          fi
          actor="$(gh api user --jq '.login')"
          if [[ "$actor" != "timerloggedout-spec" ]]; then
            echo "::error::Expected timerloggedout-spec operator identity; received $actor."
            exit 1
          fi
          if [[ ! "$BASELINE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Provide the numeric baseline Actions run ID."
            exit 1
          fi
          echo "Credential reference: $CREDENTIAL_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "Authenticated owner: $actor" >> "$GITHUB_STEP_SUMMARY"

      - name: Download source baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline
          gh run download "$BASELINE_RUN_ID" --name enterprise-org-state --dir baseline
          test -s baseline/enterprise-org-state.json

      - name: Plan or apply repository transfers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          args=(--source-org "$SOURCE_ORG" --target-org "$TARGET_ORG" --mode "$MODE" --baseline baseline/enterprise-org-state.json --receipt artifacts/enterprise-org-transfer-receipt.json)
          if [[ "$MODE" == "apply" ]]; then
            args+=(--confirmation "$CONFIRMATION")
          fi
          python3 scripts/github/transfer_enterprise_org_repositories.py "${args[@]}"

      - name: Publish transfer receipt
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-org-transfer-receipt
          path: artifacts/enterprise-org-transfer-receipt.json
          if-no-files-found: error
          retention-days: 30
