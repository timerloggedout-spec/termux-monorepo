name: Fix-on-Failure Agent
on:
  workflow_run:
    workflows:
      - "DeepSeek Termux Agent"
      - "DeepSeek Self-Integrate"
      - "Continuous CI Sweep"
      - "Tunnel Canary"
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id: {description: "specific run to fix", required: false, type: string}

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: fix-failure-${{ github.event.workflow_run.id || github.event.inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  fix:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Build payload
        env:
          RID: ${{ github.event.workflow_run.id || github.event.inputs.run_id }}
          WN:  ${{ github.event.workflow_run.name || 'manual' }}
          WB:  ${{ github.event.workflow_run.head_branch || 'master' }}
          RU:  ${{ github.event.workflow_run.html_url || '' }}
        run: |
          set -euo pipefail
          TASK="Fix the GitHub Actions failure in run $RID ('$WN' on branch $WB). Run URL: $RU.
          Method:
          1. gh run view $RID --log-failed --repo ${{ github.repository }} -- identify the failing step.
          2. gh_get_file the failing workflow file at ref $WB.
          3. Diagnose.
          4. Apply ONE fix via gh_worktree then commit_push_pr.
          5. Report the PR URL as finish summary.
          If environmental (missing secret, quota), finish with validation=deferred. Never auto-merge."
          jq -n --arg t "$TASK" --arg r "$RID" '{task:$t, source:("gh-fix-on-failure:"+$r)}' > payload.json
          cat payload.json
      - name: Dispatch to local agent
        env:
          URL: ${{ secrets.DEEPSEEK_AGENT_URL }}
          TOK: ${{ secrets.DEEPSEEK_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ]; then
            echo "::warning::DEEPSEEK_AGENT_URL not set. Recording tunnel-unresolved skip."
            echo '{"phase":"skipped","reason":"url-unset"}' > agent_status.json
            exit 0
          fi
          HOST=$(python3 -c 'import os; from urllib.parse import urlparse; print(urlparse(os.environ["URL"]).hostname or "")')
          if [ -z "$HOST" ] || ! getent hosts "$HOST" >/dev/null 2>&1; then
            echo "::warning::DEEPSEEK agent host ${HOST:-<empty>} does not resolve. Upstream failure is not repairable from a dead tunnel."
            echo '{"phase":"skipped","reason":"tunnel-unresolved"}' > agent_status.json
            exit 0
          fi
          set +e
          curl -sS --max-time 30 -X POST "$URL/v1/agent" \
            -H "Authorization: Bearer $TOK" \
            -H 'Content-Type: application/json' \
            --data-binary @payload.json > agent_response.json
          post_rc=$?
          set -e
          if [ "$post_rc" -eq 6 ]; then
            echo "::warning::DEEPSEEK agent POST lost the tunnel. Recording tunnel-lost skip."
            echo '{"phase":"skipped","reason":"tunnel-lost"}' > agent_status.json
            exit 0
          elif [ "$post_rc" -ne 0 ]; then
            echo "::error::DEEPSEEK agent POST failed with curl exit $post_rc."
            cat agent_response.json || true
            exit "$post_rc"
          fi
          RAW=$(cat agent_response.json)
          INV=$(printf '%s' "$RAW" | jq -r '.invocation_id // empty')
          if [ -z "$INV" ]; then
            echo "::error::DEEPSEEK agent POST succeeded at transport level but returned no invocation_id."
            cat agent_response.json
            exit 1
          fi
          echo "invocation=$INV"
          for i in $(seq 1 120); do
            set +e
            curl -sS --max-time 10 "$URL/v1/agent/status/$INV" -H "Authorization: Bearer $TOK" > status_response.json
            poll_rc=$?
            set -e
            if [ "$poll_rc" -eq 6 ]; then
              echo "::warning::DEEPSEEK agent status poll lost the tunnel. Recording tunnel-lost skip."
              echo '{"phase":"skipped","reason":"tunnel-lost"}' > agent_status.json
              exit 0
            elif [ "$poll_rc" -ne 0 ]; then
              echo "::error::DEEPSEEK agent status poll failed with curl exit $poll_rc."
              cat status_response.json || true
              exit "$poll_rc"
            fi
            S=$(cat status_response.json)
            P=$(echo "$S" | jq -r '.phase // "error"')
            echo "[$i] $P"
            [ "$P" = "done" ] && break
            [ "$P" = "error" ] && break
            sleep 15
          done
          echo "$S" | jq -r '.tail | join("\n")' | tail -60