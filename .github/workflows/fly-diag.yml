name: Fly Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -L https://fly.io/install.sh | sh
      - run: echo "$HOME/.fly/bin" >> $GITHUB_PATH
      - env:
          FLY_API_TOKEN: ${{ secrets.Fly_io_ORG_TOKEN }}
        run: |
          set -x
          fly auth whoami
          echo "=== apps ==="
          fly apps list
          echo "=== status ==="
          fly status -a hindsight-termux || true
          echo "=== machines ==="
          fly machine list -a hindsight-termux || true
          echo "=== recent logs ==="
          fly logs -a hindsight-termux --no-tail || true
          echo "=== curl internal health ==="
          fly ssh console -a hindsight-termux -C "wget -qO- http://localhost:8888/health || curl -s http://localhost:8888/health || echo 'neither worked'" || true
