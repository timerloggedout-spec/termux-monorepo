name: Fly Fast Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -L https://fly.io/install.sh | sh
      - run: echo "$HOME/.fly/bin" >> $GITHUB_PATH
      - env:
          FLY_API_TOKEN: ${{ secrets.Fly_io_ORG_TOKEN }}
        run: |
          set -x
          echo "=== whoami ==="
          fly auth whoami || true

          echo "=== machines ==="
          fly machine list -a hindsight-termux 2>&1 || true

          echo "=== ensure machine started ==="
          fly machine start -a hindsight-termux 2>&1 || \
            fly apps restart hindsight-termux 2>&1 || true

          echo "=== current secrets (names only) ==="
          fly secrets list -a hindsight-termux 2>&1 || true

          echo "=== sleep 60 then read logs ==="
          sleep 60
          fly logs -a hindsight-termux --no-tail 2>&1 | tail -80 || true

          echo "=== external probe ==="
          curl -sS -m 30 -o /dev/null -w 'health: %{http_code} in %{time_total}s\n' \
            https://hindsight-termux.fly.dev/health || true
