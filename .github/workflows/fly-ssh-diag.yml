name: Fly SSH Diag
on: {workflow_dispatch: {}}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: curl -L https://fly.io/install.sh | sh
      - run: echo "$HOME/.fly/bin" >> $GITHUB_PATH
      - env:
          FLY_API_TOKEN: ${{ secrets.Fly_io_ORG_TOKEN }}
        run: |
          set -x
          fly status -a hindsight-termux
          echo "=== machines ==="
          fly machine list -a hindsight-termux
          echo "=== ssh into machine ==="
          fly ssh console -a hindsight-termux -C "sh -c 'ps aux 2>/dev/null | head -30 || ps -ef | head -30'"
          echo "=== port check inside ==="
          fly ssh console -a hindsight-termux -C "sh -c 'nc -zv 127.0.0.1 8888 2>&1 || ss -ltnp 2>/dev/null || netstat -ltn 2>/dev/null || echo no-tools'"
          echo "=== recent app stderr via ssh ==="
          fly ssh console -a hindsight-termux -C "sh -c 'ls -la /app 2>/dev/null; ls -la /data 2>/dev/null; tail -60 /var/log/*.log 2>/dev/null || true'"
          echo "=== last 100 log lines ==="
          fly logs -a hindsight-termux --no-tail 2>&1 | tail -100
