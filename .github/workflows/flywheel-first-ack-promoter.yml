name: Flywheel first-ACK shared promoter

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply qualifying FLY-006 first-ACK promotions (leave false for a read-only dry run)
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: flywheel-first-ack-promoter
  cancel-in-progress: false

jobs:
  promote:
    name: Reconcile the Registry onboarding roster
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout shared promoter
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test promoter safety gates
        run: node --test scripts/ops/flywheel-first-ack-promoter.test.mjs

      - name: Reconcile FLY-006 in one shared roster pass
        env:
          APPLY_PROMOTIONS: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
          GITHUB_TOKEN: ${{ github.token }}
          OPERATOR_GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
        run: node scripts/ops/flywheel-first-ack-promoter.mjs
