name: Free-Tier Value Projection Tests

on:
  pull_request:
    paths:
      - 'scripts/free_tier_value_projection.py'
      - 'tests/test_free_tier_value_projection.py'
      - 'tests/test_free_tier_value_board.py'
      - 'apps/tribute-dashboard/free-tier-value.html'
      - 'apps/tribute-dashboard/data/free-tier-value.json'
      - 'docs/ops/FREE-TIER-USE-VALUE-BOARD.md'
      - '.github/workflows/free-tier-value-projection-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Run projection and dashboard contract tests
        run: python3 -m unittest -v tests.test_free_tier_value_projection tests.test_free_tier_value_board
      - name: Parse inline dashboard JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('apps/tribute-dashboard/free-tier-value.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.DOTALL)
          if not scripts:
              raise SystemExit('no inline dashboard script found')
          Path('/tmp/free-tier-value-board.js').write_text('\\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/free-tier-value-board.js
