name: Free-Tier Value Projection Tests

on:
  pull_request:
    paths:
      - 'scripts/free_tier_value_projection.py'
      - 'tests/test_free_tier_value_projection.py'
      - '.github/workflows/free-tier-value-projection-tests.yml'
      - 'apps/tribute-dashboard/data/free-tier-value.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Run projection contract tests
        run: python3 -m unittest -v tests.test_free_tier_value_projection
