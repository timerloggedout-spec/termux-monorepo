name: g4f inference smoke

# Manual bounded inference execution over the harvested g4f-working catalog.
# This is NOT the scheduled availability probe (catalog-only by invariant):
# it runs only on explicit dispatch, sends one synthetic completion per
# catalog working entry, and uploads a sanitized receipt artifact
# (provider/model/ok/latency/error-class; no response bodies, no secrets --
# all providers are no-auth). Never changes routing or production admission.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max completions this run"
        required: false
        default: "200"
        type: string
      source:
        description: "Entry source: working (verified 160), catalog (fork tester 100), universe (9588)"
        required: false
        default: "working"
        type: string
      offset:
        description: "Zero-based offset into the selected population"
        required: false
        default: "0"
        type: string
      timeout_s:
        description: "Per-call timeout seconds"
        required: false
        default: "45"
        type: string
      workers:
        description: "Concurrent probes"
        required: false
        default: "6"
        type: string
      deadline_s:
        description: "Global deadline seconds (receipt writes regardless)"
        required: false
        default: "1500"
        type: string

concurrency:
  group: g4f-inference-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install g4f
        run: pip install --quiet g4f aiohttp_socks PyYAML==6.0.3
      - name: Bounded smoke over catalog working entries
        env:
          SOURCE: ${{ inputs.source }}
          LIMIT: ${{ inputs.limit }}
          OFFSET: ${{ inputs.offset }}
          TIMEOUT_S: ${{ inputs.timeout_s }}
          WORKERS: ${{ inputs.workers }}
          DEADLINE_S: ${{ inputs.deadline_s }}
        run: |
          set -euo pipefail
          python3 scripts/ops/g4f_free_smoke.py \
            --source "$SOURCE" \
            --output g4f-inference-smoke.json \
            --limit "$LIMIT" \
            --offset "$OFFSET" \
            --timeout "$TIMEOUT_S" \
            --workers "$WORKERS" \
            --deadline "$DEADLINE_S"
      - name: Build provider population census with current g4f receipt
        if: always() && hashFiles('g4f-inference-smoke.json') != ''
        run: python3 scripts/ops/provider_population_census.py --g4f-receipt g4f-inference-smoke.json --out provider-population-census.json
      - name: Upload provider population census
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-population-census
          path: provider-population-census.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g4f-inference-smoke
          path: g4f-inference-smoke.json
          if-no-files-found: warn
