name: '🔀 Gemini Dispatch (free-tier agentic)'

# Dispatch Conductor — central router for free-tier Gemini CLI agentic CI/CD.
# NOT a load balancer. Commands, targets, timing, and session continuity live here.
# Requires: secrets.GEMINI_API_KEY (single key; no rotation assumed)
# Complements Jules + CodeRabbit (independent agents, not routed capacity).
#
# Efficiency levers (Orchestrator Optimizations):
#  1) Session skip — review only when head SHA is new
#  2) Quota gate — graceful skip (CI green) when RPD safety margin hit
#  3) Concurrency cancel-in-progress on PR review path
#  4) OWNER/MEMBER/COLLABORATOR-only for @gemini-cli (no fork burn)
#  5) Sanitized prior_prs inventory (no prompt injection from titles)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: gemini-dispatch-${{ github.event.pull_request.number || github.event.issue.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  dispatch:
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false &&
        github.event.pull_request.draft == false
      ) || (
        github.event_name == 'issues' &&
        contains(fromJSON('["opened", "reopened"]'), github.event.action)
      ) || (
        github.event.sender.type == 'User' &&
        startsWith(github.event.comment.body || github.event.review.body || '', '@gemini-cli') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      command: ${{ steps.extract.outputs.command }}
      additional_context: ${{ steps.extract.outputs.additional_context }}
      prior_prs: ${{ steps.extract.outputs.prior_prs }}
      pr_number: ${{ steps.extract.outputs.pr_number }}
      issue_number: ${{ steps.extract.outputs.issue_number }}
    steps:
      - name: Extract command + numbers + prior PR inventory
        id: extract
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          EVENT_TYPE: ${{ github.event_name }}.${{ github.event.action }}
          REQUEST: ${{ github.event.comment.body || github.event.review.body || '' }}
        with:
          script: |
            const eventType = process.env.EVENT_TYPE;
            // Only comment/review bodies — never full issue body (prompt-injection surface)
            const request = (process.env.REQUEST || '').slice(0, 2000);
            if (eventType === 'pull_request.opened' || eventType === 'pull_request.synchronize' || eventType === 'pull_request.ready_for_review') {
              core.setOutput('command', 'review');
            } else if (['issues.opened', 'issues.reopened'].includes(eventType)) {
              core.setOutput('command', 'triage');
            } else if (request.startsWith('@gemini-cli /review')) {
              core.setOutput('command', 'review');
              core.setOutput('additional_context', request.replace(/^@gemini-cli \/review/, '').trim().slice(0, 500));
            } else if (request.startsWith('@gemini-cli /triage')) {
              core.setOutput('command', 'triage');
            } else if (request.startsWith('@gemini-cli')) {
              core.setOutput('command', 'invoke');
              core.setOutput('additional_context', request.replace(/^@gemini-cli/, '').trim().slice(0, 500));
            } else {
              core.setOutput('command', 'none');
            }

            // Distinct PR vs issue numbers (comment on PR has issue.pull_request)
            let prNumber = '';
            let issueNumber = '';
            if (context.payload.pull_request?.number) {
              prNumber = String(context.payload.pull_request.number);
            } else if (context.payload.issue?.pull_request && context.payload.issue?.number) {
              prNumber = String(context.payload.issue.number);
            } else if (context.payload.issue?.number) {
              issueNumber = String(context.payload.issue.number);
            }
            core.setOutput('pr_number', prNumber);
            core.setOutput('issue_number', issueNumber);

            try {
              const linkNum = prNumber || issueNumber || undefined;
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 40,
              });
              const agentHints = ['jules', 'devin', 'coderabbit', 'ecc-tools', 'gemini'];
              const relevant = prs.filter(p => {
                const u = ((p.user && p.user.login) || '').toLowerCase();
                const body = ((p.body || '') + ' ' + (p.title || '')).toLowerCase();
                return agentHints.some(a => u.includes(a)) ||
                       (linkNum && (body.includes('#' + linkNum) || body.includes('issue ' + linkNum)));
              }).slice(0, 12);
              const inventory = relevant.map(p => {
                const sanitized = (p.title || '')
                  .replace(/[\r\n]+/g, ' ')
                  .replace(/[`$\\]/g, '')
                  .slice(0, 100);
                return `PR #${p.number} @${(p.user && p.user.login) || '?'}: ${sanitized}`;
              }).join(' | ') || 'none';
              core.setOutput('prior_prs', inventory);
            } catch (e) {
              core.setOutput('prior_prs', 'unavailable');
            }

      - name: Acknowledge with 👀 + comment
        if: steps.extract.outputs.command != 'none'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          COMMAND: ${{ steps.extract.outputs.command }}
        with:
          script: |
            const cmd = process.env.COMMAND || 'none';
            const number = context.payload.pull_request?.number || context.payload.issue?.number;
            if (context.payload.comment?.id) {
              try {
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content: 'eyes',
                });
              } catch (e) {
                core.info('Comment reaction skip: ' + e.message);
              }
            } else if (number) {
              try {
                await github.rest.reactions.createForIssue({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  content: 'eyes',
                });
              } catch (e) {
                core.info('Issue reaction skip: ' + e.message);
              }
            }
            if ((context.payload.comment || context.payload.review) && number) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body: `🤖 **Gemini CLI** received \\`${cmd}\\`. Tracking: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }

  triage:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'triage'
    uses: ./.github/workflows/gemini-triage.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      additional_context: ${{ needs.dispatch.outputs.additional_context }}
      prior_prs: ${{ needs.dispatch.outputs.prior_prs }}
      issue_number: ${{ needs.dispatch.outputs.issue_number }}
    secrets: inherit

  review:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'review'
    uses: ./.github/workflows/gemini-review.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      additional_context: ${{ needs.dispatch.outputs.additional_context }}
      prior_prs: ${{ needs.dispatch.outputs.prior_prs }}
      pr_number: ${{ needs.dispatch.outputs.pr_number }}
    secrets: inherit

  invoke:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'invoke'
    uses: ./.github/workflows/gemini-invoke.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      additional_context: ${{ needs.dispatch.outputs.additional_context }}
      prior_prs: ${{ needs.dispatch.outputs.prior_prs }}
      pr_number: ${{ needs.dispatch.outputs.pr_number }}
      issue_number: ${{ needs.dispatch.outputs.issue_number }}
    secrets: inherit
