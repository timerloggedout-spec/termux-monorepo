name: '🔀 Gemini Dispatch (free-tier agentic)'

# Central router for free-tier Gemini CLI agentic CI/CD.
# Requires: secrets.GEMINI_API_KEY (Google AI Studio free quota)
#
# QUOTA POLICY:
# - Automatic PR review on opened/synchronize is DISABLED here.
# - On-demand @gemini-cli and case-insensitive @sparkFlux fire immediately.
# Monikers: docs/ops/AGENT-MONIKERS.md

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issues:
    types: [opened, reopened]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

  workflow_call:
    inputs:
      issue_number:
        type: string
        required: true
      pr_number:
        type: string
        required: false
      comment_id:
        type: string
        required: true
      comment_updated_at:
        type: string
        required: true
      source_event:
        type: string
        required: true
    secrets:
      GEMINI_API_KEY:
        required: false

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  validate-source-comment:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Validate caller comment identity and revision
        id: validate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          SOURCE_EVENT: ${{ inputs.source_event }}
          SOURCE_COMMENT_ID: ${{ inputs.comment_id }}
          SOURCE_COMMENT_UPDATED_AT: ${{ inputs.comment_updated_at }}
        with:
          script: |
            if (process.env.SOURCE_EVENT !== 'issue_comment') {
              core.setOutput('valid', 'true');
              return;
            }
            const id = Number(process.env.SOURCE_COMMENT_ID);
            const expectedUpdatedAt = process.env.SOURCE_COMMENT_UPDATED_AT || '';
            const issueNumber = context.payload.issue?.number;
            const eventComment = context.payload.comment || {};
            if (!Number.isSafeInteger(id) || id <= 0 || !expectedUpdatedAt || !issueNumber || String(eventComment.id) !== String(id)) {
              core.setOutput('valid', 'false');
              core.warning('Missing or mismatched source comment metadata.');
              return;
            }
            const { data: comment } = await github.rest.issues.getComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: id,
            });
            const expectedIssueSuffix = `/issues/${issueNumber}`;
            const valid = comment.updated_at === expectedUpdatedAt &&
              comment.issue_url.endsWith(expectedIssueSuffix) &&
              String(comment.user?.login || '').toLowerCase() === String(eventComment.user?.login || '').toLowerCase();
            core.setOutput('valid', String(valid));
            if (!valid) core.warning('Source comment changed or no longer matches the caller event.');
  dispatch:
    needs: validate-source-comment
    if: |
      always() &&
      needs.validate-source-comment.outputs.valid == 'true' &&
      ((
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false &&
        github.event.pull_request.draft == false
      ) || (
        github.event_name == 'issues' &&
        contains(fromJSON('["opened", "reopened"]'), github.event.action)
      ) || (
        (inputs.source_event == 'issue_comment' || contains(fromJSON('["pull_request_review_comment", "pull_request_review"]'), github.event_name)) &&
        github.event.sender.type == 'User' &&
        (
          startsWith(github.event.comment.body || github.event.review.body || '', '@gemini-cli') ||
          startsWith(github.event.comment.body || github.event.review.body || '', '@sparkFlux') ||
          startsWith(github.event.comment.body || github.event.review.body || '', '@sparkflux')
        ) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      command: ${{ steps.extract.outputs.command }}
      additional_context: ${{ steps.extract.outputs.additional_context }}
      prior_prs: ${{ steps.extract.outputs.prior_prs }}
      issue_number: ${{ inputs.issue_number || github.event.pull_request.number || github.event.issue.number }}
      pr_number: ${{ steps.extract.outputs.pr_number }}
    steps:
      - name: Extract command + prior PR inventory
        id: extract
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          EVENT_TYPE: ${{ inputs.source_event == 'issue_comment' && 'issue_comment' || github.event_name }}.${{ github.event.action }}
          REQUEST: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body || '' }}
        with:
          script: |
            const eventType = process.env.EVENT_TYPE;
            const request = process.env.REQUEST || '';
            const lower = request.toLowerCase();

            const stripPrefix = (s) => s
              .replace(/^@(gemini-cli|sparkflux)\b/i, '')
              .trim();

            let prNumber = context.payload.pull_request?.number || null;
            if (!prNumber && context.payload.issue?.pull_request) {
              prNumber = context.payload.issue.number;
            }
            core.setOutput('pr_number', prNumber ? String(prNumber) : '');

            if (eventType === 'pull_request.opened' || eventType === 'pull_request.synchronize' || eventType === 'pull_request.ready_for_review') {
              core.setOutput('command', 'defer-peers');
              core.info('PR event → defer Gemini review until peer gate (saves quota)');
            } else if (['issues.opened', 'issues.reopened'].includes(eventType)) {
              core.setOutput('command', 'triage');
            } else if (lower.startsWith('@gemini-cli /review') || lower.startsWith('@sparkflux /review')) {
              core.setOutput('command', 'review');
              core.setOutput('additional_context', stripPrefix(request).replace(/^\/review/i, '').trim());
            } else if (lower.startsWith('@gemini-cli /triage') || lower.startsWith('@sparkflux /triage')) {
              core.setOutput('command', 'triage');
            } else if (lower.startsWith('@gemini-cli') || lower.startsWith('@sparkflux')) {
              core.setOutput('command', 'invoke');
              core.setOutput('additional_context', stripPrefix(request));
            } else {
              core.setOutput('command', 'none');
            }

            try {
              const issueNum = context.payload.pull_request?.number || context.payload.issue?.number;
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 40,
              });
              const agentHints = ['jules', 'devin', 'coderabbit', 'ecc-tools', 'gemini', 'sparkflux'];
              const relevant = prs.filter(p => {
                const u = ((p.user && p.user.login) || '').toLowerCase();
                const body = ((p.body || '') + ' ' + (p.title || '')).toLowerCase();
                return agentHints.some(a => u.includes(a)) ||
                       (issueNum && (body.includes('#' + issueNum) || body.includes('issue ' + issueNum)));
              }).slice(0, 12);
              const inventory = relevant.map(p =>
                `PR #${p.number} @${p.user.login}: ${p.title}`
              ).join(' | ') || 'none';
              core.setOutput('prior_prs', inventory);
            } catch (e) {
              core.setOutput('prior_prs', 'unavailable');
            }

      - name: Acknowledge on-demand only
        if: |
          steps.extract.outputs.command != 'none' &&
          steps.extract.outputs.command != 'defer-peers'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          COMMAND: ${{ steps.extract.outputs.command }}
        with:
          script: |
            const cmd = process.env.COMMAND || 'none';
            const number = context.payload.pull_request?.number || context.payload.issue?.number;
            if (context.payload.comment?.id) {
              try {
                if (context.eventName === 'pull_request_review_comment') {
                  await github.rest.reactions.createForPullRequestReviewComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: context.payload.comment.id,
                    content: 'eyes',
                  });
                } else {
                  await github.rest.reactions.createForIssueComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: context.payload.comment.id,
                    content: 'eyes',
                  });
                }
              } catch (e) {
                core.info('Comment reaction skip: ' + e.message);
              }
            }
            if (context.payload.comment || context.payload.review) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body: `⚡ **sparkFlux** (Gemini CLI) received \`${cmd}\`. Tracking: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n_Live trigger: \`@gemini-cli\` (alias \`@sparkFlux\` case-insensitive). SSOT: docs/ops/AGENT-MONIKERS.md_`,
              });
            }

  triage:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'triage'
    uses: ./.github/workflows/gemini-triage.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      additional_context: ${{ needs.dispatch.outputs.additional_context }}
      prior_prs: ${{ needs.dispatch.outputs.prior_prs }}
      issue_number: ${{ needs.dispatch.outputs.issue_number }}
    secrets: inherit

  review:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'review'
    uses: ./.github/workflows/gemini-review.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      additional_context: ${{ needs.dispatch.outputs.additional_context }}
      prior_prs: ${{ needs.dispatch.outputs.prior_prs }}
      pr_number: ${{ needs.dispatch.outputs.pr_number }}
    secrets: inherit

  invoke:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'invoke'
    uses: ./.github/workflows/gemini-invoke.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      additional_context: ${{ needs.dispatch.outputs.additional_context }}
      prior_prs: ${{ needs.dispatch.outputs.prior_prs }}
      pr_number: ${{ needs.dispatch.outputs.pr_number }}
      issue_number: ${{ needs.dispatch.outputs.issue_number }}
    secrets: inherit
