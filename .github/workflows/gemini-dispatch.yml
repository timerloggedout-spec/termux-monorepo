name: 'DEPRECATED — Gemini Dispatch retired'

# Retired 2026-11-12 by operator direction.
# Historical Gemini workflows and run evidence are retained; this router is inert.
# Successor: QUE governor + repository-native peer/review orchestration.
# Reviewer unavailable is never equivalent to review passed.

on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo "Gemini Dispatch is deprecated and superseded."
          echo "No Gemini CLI, sparkFlux, triage, review, or invoke action is performed."
          echo "Use the QUE governor and currently registered repository-native review routes."
