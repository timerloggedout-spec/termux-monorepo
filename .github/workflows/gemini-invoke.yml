name: '▶️ Gemini Invoke (on-demand free-tier teammate)'

on:
  workflow_call:
    inputs:
      additional_context:
        type: string
        required: false
      prior_prs:
        type: string
        required: false
        default: 'none'
      pr_number:
        type: string
        required: false
        default: ''
      issue_number:
        type: string
        required: false
        default: ''

concurrency:
  group: gemini-invoke-${{ inputs.pr_number || inputs.issue_number || github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Gemini CLI assistant
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
          github_issue_number: ${{ inputs.issue_number || github.event.issue.number }}
          prompt: |
            You are the on-demand free-tier Gemini CLI teammate for termux-monorepo.
            Read GEMINI.md and AGENTS.md first.

            User request / additional context:
            ${{ inputs.additional_context }}

            ## Open agent / related PRs (coordination — DO NOT overlap files)
            ${{ inputs.prior_prs }}

            ## COORDINATION RULES
            1. Jules is the primary *builder* (creates branches/PRs). You are primarily triage/review/analysis unless the user explicitly asks you to implement and write is possible.
            2. Do not edit files already changed in open agent PRs for this issue.
            3. If you open or recommend a PR, suggest posting <!-- agent-claim --> with claimed_by: gemini and file list.
            4. Prefer reviewing Jules/Devin PRs over duplicating their work.

            Perform the request within free-tier limits. Prefer analysis + concrete suggestions or minimal patches.
            If code changes are required and you cannot push, describe the exact diff and next steps for Jules or a human.
            Never invent work outside the proposal registry process. Never commit secrets.
