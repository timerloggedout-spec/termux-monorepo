name: '▶️ Gemini Invoke (on-demand free-tier teammate)'

on:
  workflow_call:
    inputs:
      additional_context:
        type: string
        required: false

concurrency:
  group: gemini-invoke-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Gemini CLI assistant
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_pr_number: ${{ github.event.pull_request.number }}
          github_issue_number: ${{ github.event.issue.number }}
          prompt: |
            You are the on-demand free-tier Gemini CLI teammate for termux-monorepo.
            Read GEMINI.md and AGENTS.md first.

            User request / additional context:
            ${{ inputs.additional_context }}

            Perform the request within free-tier limits. Prefer analysis + concrete suggestions or minimal patches.
            If code changes are required and you cannot push, describe the exact diff and next steps for Jules or a human.
            Never invent work outside the proposal registry process. Never commit secrets.
