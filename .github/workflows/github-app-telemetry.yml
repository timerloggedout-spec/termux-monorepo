name: GitHub App fleet telemetry

on:
  pull_request:
    paths:
      - 'ops/github-apps/**'
      - 'scripts/github/github_app_telemetry.py'
      - 'scripts/github/test_github_app_telemetry.py'
      - 'docs/ops/GITHUB-APP-G4-RUNTIME-RECEIPT.schema.json'
      - 'scripts/github/integration_mesh_poll.py'
      - 'scripts/github/test_integration_mesh_poll.py'
      - 'docs/ops/GITHUB-APP-FLEET-TELEMETRY.md'
      - '.github/workflows/github-app-telemetry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-app-telemetry-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Validate registry and telemetry tests
        working-directory: scripts/github
        run: |
          set -euo pipefail
          python -m unittest -v test_github_app_telemetry.py test_integration_mesh_poll.py
          python github_app_telemetry.py --output ../../github-app-telemetry.json
          echo 'Artifact is declaration-only. Live token minting remains disabled until SEC-01/02 provisioning is verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload declaration-only telemetry artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-app-telemetry-${{ github.run_id }}
          path: github-app-telemetry.json
          retention-days: 30
