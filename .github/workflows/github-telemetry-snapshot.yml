name: github-telemetry-snapshot

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      max_runs:
        description: Max workflow runs to sample
        type: string
        default: "40"
      with_jobs:
        description: Fetch jobs for duration reconstruction
        type: boolean
        default: true
      with_traffic:
        description: Capture traffic (14d upstream retention)
        type: boolean
        default: true
      with_stats:
        description: Capture commit activity / code frequency
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: github-telemetry-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: collect-reduce-report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Collect Actions runs (+ jobs/traffic)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAX="${{ inputs.max_runs || '40' }}"
          ARGS=(--owner "$GITHUB_REPOSITORY_OWNER" --repo "${GITHUB_REPOSITORY#*/}" --max-runs "$MAX" --out ops/github-telemetry/raw)
          if [ "${{ inputs.with_jobs || true }}" = "true" ]; then ARGS+=(--with-jobs); fi
          if [ "${{ inputs.with_traffic || true }}" = "true" ]; then ARGS+=(--with-traffic); fi
          if [ "${{ inputs.with_stats || false }}" = "true" ]; then ARGS+=(--with-stats); fi
          python -m ops.github_telemetry collect "${ARGS[@]}" || echo "collect finished with warnings"

      - name: Reduce jobs → reconstructed performance JSON
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(ops/github-telemetry/raw/actions-jobs/*/*.json)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No jobs payloads; skip reduce"
            exit 0
          fi
          python -m ops.github_telemetry reduce --jobs-file "${FILES[@]}" --window-label snapshot --out docs/ops/generated

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "## GitHub telemetry snapshot"
            echo
            echo "Locally reconstructed metrics (not GitHub UI parity claim)."
            echo
            if ls docs/ops/generated/actions-performance-reconstructed-*.json >/dev/null 2>&1; then
              echo '```json'
              cat docs/ops/generated/actions-performance-reconstructed-*.json | head -c 8000
              echo
              echo '```'
            else
              echo "_No derived report this run._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit derived report (authority-gated path only)
        run: |
          set -euo pipefail
          git add docs/ops/generated/actions-performance-reconstructed-*.json 2>/dev/null || true
          git add ops/github-telemetry/raw 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No telemetry delta to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -m "chore(telemetry): GitHub operational snapshot" \
            -m "Locally reconstructed Actions performance + optional traffic/stats." \
            -m "Agent-Identity: GitHub Actions Telemetry Snapshot"
          # Push only if on default branch after merge of this workflow; PR branch may lack write
          git push || echo "push skipped (expected on PR branches)"
