# DO publicize the Hark sandbox mirror per Owner pattern 2026-11-18 01:02 (public ∧ age-encrypted payloads).
# Order: audit ∀ blobs ∧ commits ⇒ hit ⇒ ⛔ stop (names-only) · ∅ ⇒ visibility public ⇒ ruleset ⇒ README line ⇒ readback.
# Legal-name check matches sha256 of lowercase word tokens; ¬ plaintext name in this file.
name: hark-vm-backup-publicize
on:
  workflow_dispatch:
    inputs:
      target:
        description: owner/repo of the mirror
        default: timerloggedout-spec/hark-vm-workspace-backup
permissions:
  contents: read
concurrency:
  group: hark-vm-backup-publicize
  cancel-in-progress: false
jobs:
  publicize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Clone full history
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone -q "https://github.com/$TARGET.git" "$RUNNER_TEMP/m"
          echo "::notice title=audit-scope::commits=$(git -C "$RUNNER_TEMP/m" rev-list --all | wc -l) blobs=$(git -C "$RUNNER_TEMP/m" rev-list --all --objects | wc -l)"
      - name: Audit every blob ∧ commit message
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/m"
          python3 - <<'PY'
          import hashlib, re, subprocess, sys
          NAME = {"a6b70a8a5074fc12ed70d61d05fffa30a5bec120ed140cf009b8a6302328360b",
                  "5bbacce5128c5e015d1c58e438e7fcd73711acbc26656c42587e3e3fc33034ea"}
          SECRET = [r"AGE-SECRET-KEY-1", r"-----BEGIN [A-Z ]*PRIVATE KEY", r"\bgh[pousr]_[A-Za-z0-9]{30,}",
                    r"github_pat_[A-Za-z0-9_]{40,}", r"\bsk-[A-Za-z0-9_-]{20,}", r"\bAKIA[0-9A-Z]{16}\b",
                    r"\bxox[abpr]-[A-Za-z0-9-]{10,}", r"\bAIza[0-9A-Za-z_-]{35}\b"]
          rx = re.compile("|".join(SECRET))
          def run(*a): return subprocess.run(a, capture_output=True, check=True).stdout
          def scan(label, data):
              text = data.decode("utf-8", "replace")
              hits = []
              if rx.search(text): hits.append("secret-pattern")
              if any(hashlib.sha256(w.encode()).hexdigest() in NAME for w in set(re.findall(r"[a-z]+", text.lower()))):
                  hits.append("legal-name")
              return [(label, h) for h in hits]
          found = []
          objs = run("git", "rev-list", "--all", "--objects").decode().split("\n")
          for line in filter(None, objs):
              sha = line.split()[0]
              if run("git", "cat-file", "-t", sha).strip() == b"blob":
                  path = line.split(maxsplit=1)[1] if " " in line else sha[:12]
                  found += scan(f"blob:{path}", run("git", "cat-file", "-p", sha))
          for c in filter(None, run("git", "rev-list", "--all").decode().split()):
              found += scan(f"commit:{c[:7]}", run("git", "log", "-1", "--format=%an%n%ae%n%cn%n%ce%n%B", c))
          for label, kind in found:
              print(f"::error title=audit::{kind} in {label}")
          if found:
              sys.exit(1)
          print("::notice title=audit::∅ plaintext secret ∧ ∅ legal name")
          PY
      - name: Set visibility public
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$TARGET" --jq .private)" = "true" ]; then
            gh repo edit "$TARGET" --visibility public --accept-visibility-change-consequences
          fi
          echo "::notice title=visibility::private=$(gh api "repos/$TARGET" --jq .private)"
      - name: Apply append-only ruleset
        run: |
          set -euo pipefail
          if ! gh api "repos/$TARGET/rulesets" --jq '.[].name' | grep -qx append-only; then
            gh api -X POST "repos/$TARGET/rulesets" --input - >/dev/null <<'JSON'
          {"name":"append-only","target":"branch","enforcement":"active",
           "conditions":{"ref_name":{"include":["~DEFAULT_BRANCH"],"exclude":[]}},
           "rules":[{"type":"deletion"},{"type":"non_fast_forward"}]}
          JSON
          fi
      - name: Append README line ∧ register intake (contents API)
        run: |
          set -euo pipefail
          # git push ⇒ 403 on run 44272374001 ⇒ DO write via contents API (fast-forward commit).
          python3 - <<'PY'
          import base64, json, subprocess, os
          T = os.environ["TARGET"]
          def get(path):
              m = json.loads(subprocess.check_output(["gh", "api", f"repos/{T}/contents/{path}"]))
              return m["sha"], base64.b64decode(m["content"]).decode()
          def put(path, sha, text, msg):
              body = json.dumps({"message": msg, "sha": sha, "content": base64.b64encode(text.encode()).decode()})
              subprocess.run(["gh", "api", "-X", "PUT", f"repos/{T}/contents/{path}", "--input", "-"], input=body, text=True, check=True, capture_output=True)
              print(f"::notice title=write::{path}")
          LINE = "payloads age-encrypted; public by design (Muse pattern)"
          sha, txt = get("README.md")
          if LINE not in txt:
              put("README.md", sha, txt.rstrip("\n") + "\n\n" + LINE + "\n", "docs(readme): add public-by-design line [skip render]")
          sha, txt = get("repo-exports/REGISTRY.json")
          reg = json.loads(txt); hark = reg.setdefault("sections", {}).setdefault("hark", {})
          if "intake" not in hark:
              hark["intake"] = {"schema": "termux-monorepo:ops/mesh/REQUESTS-SCHEMA.md", "workflow": "termux-monorepo:.github/workflows/mesh-request.yml",
                                "triggers": ["workflow_dispatch", "issues labeled mesh:request"], "requests": "repo-exports/REQUESTS.jsonl",
                                "done": "repo-exports/DONE.jsonl", "drain": "Hark cron 0f4c2bd2 every 6h :15 PT"}
              put("repo-exports/REGISTRY.json", sha, json.dumps(reg, indent=2, ensure_ascii=False) + "\n", "feat(registry): register mesh request intake [skip render]")
          PY
      - name: Read back
        run: |
          set -euo pipefail
          P="$(gh api "repos/$TARGET" --jq .private)"; V="$(gh api "repos/$TARGET" --jq .visibility)"; B="$(gh api "repos/$TARGET" --jq .default_branch)"
          RS="$(gh api "repos/$TARGET/rulesets" --jq '[.[]|select(.name=="append-only")|.id]|join(",")')"
          RULES="$(gh api "repos/$TARGET/rulesets/$RS" --jq '[.enforcement]+[.rules[].type]|join(",")')"
          H="$(gh api "repos/$TARGET/commits/$B" --jq .sha)"
          echo "::notice title=readback::visibility=$V private=$P ruleset_id=$RS rules=$RULES head=${H:0:7}"
          [ "$P" = false ] && [ -n "$RS" ]
