name: Tribute Dashboard Preview

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or commit to preview (e.g. codex/admin-graph-validation-hardening)"
        required: true
        type: string
      preview_key:
        description: "Stable preview key (e.g. pr-2579); lowercase letters, numbers, and hyphens only"
        required: true
        type: string

permissions:
  contents: read

# Share the publication lock with production. Every run publishes the current
# production snapshot and, when dispatched, its preview in the same external commit.
concurrency:
  group: user-site-pages-publisher
  cancel-in-progress: false

jobs:
  publish-preview:
    if: ${{ github.repository == 'timerloggedout-spec/termux-monorepo' && !contains(inputs.preview_key, '/') && !contains(inputs.preview_key, '..') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout requested preview revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
      - name: Checkout current production source
        uses: actions/checkout@v4
        with:
          ref: master
          path: production
          persist-credentials: false
      - name: Checkout trusted artifact builder
        uses: actions/checkout@v4
        with:
          ref: master
          path: tooling
          persist-credentials: false
      - name: Prepare atomic production plus preview artifact
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          PREVIEW_KEY: ${{ inputs.preview_key }}
        run: |
          set -euo pipefail
          if ! [[ "$PREVIEW_KEY" =~ ^[a-z0-9][a-z0-9-]{0,60}$ ]]; then
            echo "::error::preview_key must be lowercase letters, digits, and hyphens."
            exit 1
          fi
          mkdir -p _production _preview _user_site/tribute _user_site/help-wanted _user_site/matrix/data "_user_site/previews/$PREVIEW_KEY/tribute"
          PRODUCTION_SHA="$(git -C production rev-parse HEAD)"
          SOURCE_SHA="$(git -C source rev-parse HEAD)"

          cp -a production/apps/help-wanted-dashboard/. _production/
          python3 tooling/scripts/build_dashboard_manifest.py \
            --root _production \
            --channel production \
            --source-ref master \
            --source-sha "$PRODUCTION_SHA" \
            --version-prefix "1.0.1"
          if [ -f production/docs/ops/generated/tribute-status.json ]; then
            cp production/docs/ops/generated/tribute-status.json _production/data/status.json
          fi
          touch _production/.nojekyll
          cp -a _production/. _user_site/tribute/
          cp -a _production/. _user_site/help-wanted/

          cp -a source/apps/help-wanted-dashboard/. _preview/
          python3 tooling/scripts/build_dashboard_manifest.py \
            --root _preview \
            --channel preview \
            --source-ref "$SOURCE_REF" \
            --source-sha "$SOURCE_SHA" \
            --version-prefix "1.0.1"
          touch _preview/.nojekyll
          if [ -f _preview/sitemap.xml ]; then
            sed -i "s#https://timerloggedout-spec.github.io/tribute/#https://timerloggedout-spec.github.io/previews/$PREVIEW_KEY/tribute/#g" _preview/sitemap.xml
          fi
          if [ -f _preview/robots.txt ]; then
            sed -i "s#https://timerloggedout-spec.github.io/tribute/sitemap.xml#https://timerloggedout-spec.github.io/previews/$PREVIEW_KEY/tribute/sitemap.xml#g" _preview/robots.txt
          fi
          cp -a _preview/. "_user_site/previews/$PREVIEW_KEY/tribute/"

          cp production/apps/help-wanted-dashboard/matrix.html _user_site/matrix/index.html
          cp production/apps/help-wanted-dashboard/dashboard.css _user_site/matrix/dashboard.css
          cp production/apps/help-wanted-dashboard/site-nav.js _user_site/matrix/site-nav.js
          if [ -f production/docs/ops/generated/lane-matrix-status.json ]; then
            cp production/docs/ops/generated/lane-matrix-status.json _user_site/matrix/data/lane-matrix-status.json
          fi
          touch _user_site/.nojekyll _user_site/matrix/.nojekyll
          {
            echo "Production Tribute: https://timerloggedout-spec.github.io/tribute/"
            echo "Legacy compatibility alias: https://timerloggedout-spec.github.io/help-wanted/"
            echo "Preview: https://timerloggedout-spec.github.io/previews/$PREVIEW_KEY/tribute/"
            echo "Production source SHA: $PRODUCTION_SHA"
            echo "Preview source SHA: $SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish production and preview atomically
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          personal_token: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN }}
          external_repository: timerloggedout-spec/timerloggedout-spec.github.io
          publish_dir: _user_site
          publish_branch: main
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy(production+preview): ${{ inputs.preview_key }} from ${{ inputs.source_ref }}"
