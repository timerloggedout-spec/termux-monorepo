name: Help-Wanted diff gate tests

on:
  pull_request:
    paths:
      - "scripts/ci/help_wanted_diff_gate.py"
      - "scripts/ci/test_help_wanted_diff_gate.py"
      - ".github/workflows/help-wanted-diff-gate.yml"
      - ".github/workflows/help-wanted-diff-gate-tests.yml"
  push:
    branches: [master]
    paths:
      - "scripts/ci/help_wanted_diff_gate.py"
      - "scripts/ci/test_help_wanted_diff_gate.py"
      - ".github/workflows/help-wanted-diff-gate.yml"
      - ".github/workflows/help-wanted-diff-gate-tests.yml"

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run Help-Wanted diff-gate regressions
        run: python -m pytest -q scripts/ci/test_help_wanted_diff_gate.py
