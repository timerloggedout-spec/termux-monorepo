name: help-wanted execute

# LIVE ONLY — no dry runs.
# PRIMARY: claim comment + upstream PR into author's repo.
# Parallel to SHE (evidence receipts for benchmarks only).
# OPERATOR PAT: OPERATOR_GITHUB_TOKEN | OPERATOR_TOKEN | ARCHWIZ_GITHUB_TOKEN

on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: Issue URL or owner/repo#n (empty = adaptive scout top-1)
        required: false
        default: ""
      mode:
        description: claim-and-pr | claim-and-patch-zero-72
        required: false
        default: claim-and-pr
      daily_budget:
        description: Max live contributes per UTC day
        required: false
        default: "8"

permissions:
  contents: read
  actions: read

concurrency:
  group: help-wanted-execute
  cancel-in-progress: false

jobs:
  budget:
    name: adaptive budget + inline scout
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      allow: ${{ steps.gate.outputs.allow }}
      remaining: ${{ steps.gate.outputs.remaining }}
      issue: ${{ steps.gate.outputs.issue }}
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Gate (inline scout when needed)
        id: gate
        env:
          INPUT_ISSUE: ${{ github.event.inputs.issue }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_BUDGET: ${{ github.event.inputs.daily_budget }}
          EVENT_NAME: ${{ github.event_name }}
          OPERATOR_GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          ARCHWIZ_GITHUB_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer OPERATOR token for search rate limits
          export GITHUB_TOKEN="${OPERATOR_GITHUB_TOKEN:-${OPERATOR_TOKEN:-${ARCHWIZ_GITHUB_TOKEN:-$GITHUB_TOKEN}}}"
          python3 <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          budget = int(os.environ.get("INPUT_BUDGET") or "8")
          day = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          path = Path("docs/ops/generated/help-wanted-daily-budget.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          data = {"day": day, "used": 0, "success": 0, "fail": 0, "events": []}
          # Budget is per-runner ephemeral unless restored from artifact; floor used at 0 each job.
          # Soft ceiling still applies within a single matrix expansion later.

          issue = (os.environ.get("INPUT_ISSUE") or "").strip()
          mode = (os.environ.get("INPUT_MODE") or "claim-and-pr").strip() or "claim-and-pr"
          event = os.environ.get("EVENT_NAME") or ""
          remaining = budget

          if not issue:
              # CRITICAL FIX: catalog is not on disk — scout inline every time
              out = Path("docs/ops/generated/help-wanted-catalog.json")
              out.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(
                  [
                      "python3",
                      "scripts/ci/help_wanted_scout.py",
                      "--max",
                      "20",
                      "--label",
                      "good first issue",
                      "--out",
                      str(out),
                  ],
                  check=False,
              )
              # fallback label if empty
              items = []
              if out.exists():
                  try:
                      items = json.loads(out.read_text()).get("items") or []
                  except Exception:
                      items = []
              if not items:
                  subprocess.run(
                      [
                          "python3",
                          "scripts/ci/help_wanted_scout.py",
                          "--max",
                          "20",
                          "--label",
                          "help wanted",
                          "--out",
                          str(out),
                      ],
                      check=False,
                  )
                  try:
                      items = json.loads(out.read_text()).get("items") or []
                  except Exception:
                      items = []
              if items:
                  top = items[0]
                  issue = top.get("url") or top.get("html_url") or ""
                  print(f"inline scout top: score={top.get('score')} {issue}")

          allow = "true" if issue else "false"
          if mode == "claim-and-patch-zero-72" and not issue:
              issue = "https://github.com/vedantnimbarte/zero/issues/72"
              allow = "true"

          print(f"day={day} remaining={remaining} allow={allow} issue={issue!r} mode={mode} event={event}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"allow={allow}\n")
              f.write(f"remaining={remaining}\n")
              f.write(f"issue={issue}\n")
              f.write(f"mode={mode}\n")
          path.write_text(json.dumps(data, indent=2))
          PY

      - name: Upload catalog if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: help-wanted-execute-gate
          path: |
            docs/ops/generated/help-wanted-catalog.json
            docs/ops/generated/help-wanted-daily-budget.json
          retention-days: 14
          if-no-files-found: ignore

  no-op-guard:
    name: fail-closed if nothing selected
    needs: budget
    if: needs.budget.outputs.allow != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: No issue selected
        run: |
          echo "::error::help-wanted execute selected no issue (inline scout empty or inputs missing)"
          exit 1

  claim:
    name: claim comment (stake)
    needs: budget
    if: needs.budget.outputs.allow == 'true' && needs.budget.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve operator token
        id: tok
        env:
          OPERATOR_GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          ARCHWIZ_GITHUB_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN=""
          if [ -n "${OPERATOR_GITHUB_TOKEN:-}" ]; then TOKEN="$OPERATOR_GITHUB_TOKEN"
          elif [ -n "${OPERATOR_TOKEN:-}" ]; then TOKEN="$OPERATOR_TOKEN"
          elif [ -n "${ARCHWIZ_GITHUB_TOKEN:-}" ]; then TOKEN="$ARCHWIZ_GITHUB_TOKEN"
          else TOKEN="${GITHUB_TOKEN}"
          fi
          if [ -z "$TOKEN" ]; then echo "No OPERATOR token" >&2; exit 1; fi
          echo "token_len=${#TOKEN}" >> "$GITHUB_OUTPUT"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Live claim (no dry-run)
        env:
          GITHUB_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/help_wanted_claim.py --issue "${{ needs.budget.outputs.issue }}"

      - name: Evidence receipt
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/ci/help_wanted_evidence.py \
            --kind claim \
            --issue "${{ needs.budget.outputs.issue }}" \
            --ok true \
            --run-url "$GITHUB_RUN_URL"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: help-wanted-claim-evidence
          path: docs/ops/generated/help-wanted-evidence/
          retention-days: 30

  contribute:
    name: fork + commit + upstream PR
    needs: [budget, claim]
    if: needs.budget.outputs.allow == 'true' && needs.budget.outputs.mode == 'claim-and-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve operator token
        id: tok
        env:
          OPERATOR_GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          ARCHWIZ_GITHUB_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${OPERATOR_GITHUB_TOKEN:-${OPERATOR_TOKEN:-${ARCHWIZ_GITHUB_TOKEN:-}}}"
          if [ -z "$TOKEN" ]; then echo "OPERATOR PAT required for upstream PR" >&2; exit 1; fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Contribute (PRIMARY upstream-pr)
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
          GITHUB_TOKEN: ${{ steps.tok.outputs.token }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/ci/help_wanted_contribute.py --issue "${{ needs.budget.outputs.issue }}"
          python3 scripts/ci/help_wanted_evidence.py \
            --kind upstream_pr \
            --issue "${{ needs.budget.outputs.issue }}" \
            --ok true \
            --run-url "$GITHUB_RUN_URL"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: help-wanted-contribute-evidence
          path: docs/ops/generated/help-wanted-evidence/
          retention-days: 30

  patch-zero-72:
    name: external PR zero 72 ponytail
    if: needs.budget.outputs.mode == 'claim-and-patch-zero-72'
    needs: [budget, claim]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Resolve operator token
        id: tok
        env:
          OPERATOR_GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          ARCHWIZ_GITHUB_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${OPERATOR_GITHUB_TOKEN:-${OPERATOR_TOKEN:-${ARCHWIZ_GITHUB_TOKEN:-}}}"
          if [ -z "$TOKEN" ]; then exit 1; fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Patch + upstream PR
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
          GITHUB_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          set -euo pipefail
          echo "Use prior zero#81 path or claim-and-pr for generic contributes"
          python3 scripts/ci/help_wanted_contribute.py --issue "https://github.com/vedantnimbarte/zero/issues/72"
