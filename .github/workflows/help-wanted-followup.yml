name: help-wanted-followup

# INTENDED PURPOSE (this workflow only):
#   Poll open external PRs we authored for CHANGES_REQUESTED.
#   Idempotent notify + evidence. No repo-specific patch jobs.
#
# Lane purpose lives in docs/ops/HELP-WANTED-LANE.md:
#   scout → claim → upstream PR → followup → dashboard

on:
  schedule:
    - cron: "17 */2 * * *"
      timezone: 'UTC'
  workflow_dispatch:
  repository_dispatch:
    types:
      - help-wanted-followup
      - help-wanted-foreign
      - help-wanted-changes-requested

concurrency:
  group: help-wanted-followup
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  poll:
    name: poll CHANGES_REQUESTED
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Follow up on our open external PRs
        env:
          OPERATOR_GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          ARCHWIZ_GITHUB_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/help_wanted_followup.py

      - name: Commit evidence if any
        env:
          TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if git status --porcelain docs/ops/generated/help-wanted-evidence 2>/dev/null | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/ops/generated/help-wanted-evidence || true
            git commit -m "ops(help-wanted): follow-up evidence $(date -u +%Y-%m-%dT%H:%MZ)" || true
            git push "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:master || true
          else
            echo "no evidence delta"
          fi
