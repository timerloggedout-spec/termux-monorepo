name: help-wanted-llm-assist

# LIVE catalog selection — NOT legacy model-router fallback chain.
# NOT MoneyBall admission (MB scores providers after repeated success).
#
# providers: openrouter + felo + omni via scripts/provider_model_catalog.py
# free = :free OR zero price OR free_trial (FELO ox-alpha path)

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Foreign PR URL (empty = first CHANGES_REQUESTED foreign)"
        required: false
        default: ""
  repository_dispatch:
    types: [help-wanted-llm-assist]

concurrency:
  group: help-wanted-llm-assist
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target foreign PR
        id: target
        env:
          OPERATOR_GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          ARCHWIZ_GITHUB_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR: ${{ github.event.inputs.pr || github.event.client_payload.pr || '' }}
        run: |
          set -euo pipefail
          export GITHUB_TOKEN="${OPERATOR_GITHUB_TOKEN:-${OPERATOR_TOKEN:-${ARCHWIZ_GITHUB_TOKEN:-$GITHUB_TOKEN}}}"
          python3 <<'PY'
          import json, os, re, urllib.parse, urllib.request
          tok = os.environ["GITHUB_TOKEN"]
          def api(path):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={"Accept": "application/vnd.github+json", "Authorization": f"Bearer {tok}", "User-Agent": "help-wanted-llm-assist"},
              )
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.loads(r.read().decode())
          pr = (os.environ.get("INPUT_PR") or "").strip()
          if pr:
              m = re.search(r"github\.com/([^/]+)/([^/]+)/pull/(\d+)", pr)
              if not m:
                  raise SystemExit(f"bad pr url: {pr}")
              owner, repo, num = m.group(1), m.group(2), m.group(3)
          else:
              q = urllib.parse.quote("author:timerloggedout-spec is:pr is:open review:changes_requested -repo:timerloggedout-spec/termux-monorepo")
              items = (api(f"/search/issues?q={q}&per_page=5").get("items") or [])
              if not items:
                  q2 = urllib.parse.quote("author:timerloggedout-spec is:pr is:open -repo:timerloggedout-spec/termux-monorepo")
                  items = (api(f"/search/issues?q={q2}&per_page=5").get("items") or [])
              if not items:
                  open(os.environ["GITHUB_OUTPUT"], "a").write("skip=true\n")
                  print("no foreign PR")
                  raise SystemExit(0)
              it = items[0]
              parts = (it.get("repository_url") or "").rstrip("/").split("/")
              owner, repo, num = parts[-2], parts[-1], str(it["number"])
          prd = api(f"/repos/{owner}/{repo}/pulls/{num}")
          reviews = api(f"/repos/{owner}/{repo}/pulls/{num}/reviews")
          review_bits = []
          for r in reviews or []:
              if r.get("state") == "CHANGES_REQUESTED":
                  review_bits.append(((r.get("user") or {}).get("login"), (r.get("body") or "")[:1500]))
          title = prd.get("title") or ""
          body = (prd.get("body") or "")[:2000]
          files = api(f"/repos/{owner}/{repo}/pulls/{num}/files")
          file_list = ", ".join((f.get("filename") or "") for f in (files or [])[:20])
          prompt = f"Help-wanted lane: foreign PR {owner}/{repo}#{num}\nTitle: {title}\nBody:\n{body}\nFiles: {file_list}\n\n"
          if review_bits:
              prompt += "CHANGES_REQUESTED:\n"
              for u, b in review_bits:
                  prompt += f"@{u}:\n{b}\n\n"
          prompt += "Concrete file-level next-patch plan (max 40 lines). No secrets."
          open("/tmp/hw-llm-prompt.txt", "w").write(prompt)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("skip=false\n")
              f.write(f"owner={owner}\nrepo={repo}\nnumber={num}\nfull={owner}/{repo}\n")
          print(f"target {owner}/{repo}#{num}")
          PY

      - name: Live catalog select (openrouter|felo|omni)
        id: pick
        if: steps.target.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FELO_AI_API: ${{ secrets.FELO_AI_API }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          set -euo pipefail
          # Unify omni env name for catalog script
          export OMNI_API_KEY="${OMNI_API_KEY:-${OMNIROUTE_API_KEY:-}}"
          python3 scripts/provider_model_catalog.py \
            --providers openrouter,felo,omni \
            --output /tmp/model-catalog/catalog.json || true
          python3 <<'PY'
          import json, os, re
          from pathlib import Path
          path = Path("/tmp/model-catalog/catalog.json")
          if not path.exists():
              print("no catalog")
              open(os.environ["GITHUB_OUTPUT"], "a").write("skip=true\n")
              raise SystemExit(0)
          doc = json.loads(path.read_text())
          rows = doc.get("models") or []
          eligible = [
              r for r in rows
              if r.get("pricing_classification") == "free_zero_price"
              or r.get("free_suffix")
              or r.get("access_classification") == "free_trial"
          ]
          # Prefer coding-ish ids, then openrouter free, then any eligible
          def score(r):
              mid = (r.get("id") or "").lower()
              s = 0
              if any(k in mid for k in ("coder", "code", "qwen", "deepseek", "ox-alpha")):
                  s += 50
              if r.get("provider") == "openrouter":
                  s += 20
              if r.get("provider") == "felo":
                  s += 15
              if r.get("free_suffix") or r.get("pricing_classification") == "free_zero_price":
                  s += 10
              return s
          eligible.sort(key=score, reverse=True)
          if not eligible:
              # last resort hard free list (still not MoneyBall)
              if os.environ.get("OPENROUTER_API_KEY"):
                  open(os.environ["GITHUB_OUTPUT"], "a").write(
                      "skip=false\nprovider=openrouter\nmodel=qwen/qwen3-coder:free\n"
                  )
                  print("fallback list qwen3-coder:free")
                  raise SystemExit(0)
              open(os.environ["GITHUB_OUTPUT"], "a").write("skip=true\n")
              print("no eligible free models")
              raise SystemExit(0)
          top = eligible[0]
          provider = top["provider"]
          model = top["id"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("skip=false\n")
              f.write(f"provider={provider}\n")
              f.write(f"model={model}\n")
          print(f"SELECTED {provider}/{model} score={score(top)} from {len(eligible)} eligible")
          print(f"catalog_models={len(rows)} errors={len(doc.get('errors') or [])}")
          PY

      - name: Invoke selected model + comment
        if: steps.target.outputs.skip != 'true' && steps.pick.outputs.skip != 'true'
        env:
          PROVIDER: ${{ steps.pick.outputs.provider }}
          MODEL: ${{ steps.pick.outputs.model }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FELO_AI_API: ${{ secrets.FELO_AI_API }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ steps.target.outputs.full }}
          TARGET: ${{ steps.target.outputs.number }}
        run: |
          set -euo pipefail
          case "${PROVIDER}" in
            openrouter) KEY="${OPENROUTER_API_KEY:-}"; BASE="https://openrouter.ai/api/v1" ;;
            felo) KEY="${FELO_AI_API:-}"; BASE="https://openapi.felo.ai/api/v1" ;;
            omni) KEY="${OMNI_API_KEY:-${OMNIROUTE_API_KEY:-}}"; BASE="https://cloud.omniroute.online/v1" ;;
            *) echo "unknown provider"; exit 0 ;;
          esac
          if [ -z "${KEY}" ]; then echo "::warning::missing key for ${PROVIDER}"; exit 0; fi
          echo "::add-mask::${KEY}"
          PROMPT=$(cat /tmp/hw-llm-prompt.txt)
          PAYLOAD=$(jq -n --arg m "$MODEL" --arg p "$PROMPT" '{model:$m,messages:[{role:"user",content:$p}],max_tokens:2048,stream:false}')
          RESP=$(curl -sS --connect-timeout 25 -X POST "${BASE}/chat/completions" \
            -H "Authorization: Bearer ${KEY}" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://github.com/timerloggedout-spec/termux-monorepo" \
            -H "X-Title: help-wanted-llm-assist" \
            -d "$PAYLOAD" || true)
          TEXT=$(echo "$RESP" | jq -r '.choices[0].message.content // empty' 2>/dev/null || true)
          if [ -z "$TEXT" ]; then
            echo "::warning::empty response: $(echo "$RESP" | tr '\n' ' ' | head -c 500)"
            exit 0
          fi
          BODY=$(printf '%s\n\n%s\n\n%s\n' \
            "### Help-wanted LLM assist (live catalog: \`${PROVIDER}\` / \`${MODEL}\`)" \
            "$TEXT" \
            "_Selection = live free/zero/trial catalog (openrouter|felo|omni). **Not** MoneyBall admission. Not legacy model-router residual chain._")
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${TARGET}/comments" \
            -d "$(jq -n --arg b "$BODY" '{body:$b}')" >/dev/null
          echo "commented ${REPO}#${TARGET} via ${PROVIDER}/${MODEL}"
          mkdir -p docs/ops/generated/help-wanted-evidence
          DAY=$(date -u +%Y-%m-%d)
          jq -nc --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg issue "https://github.com/${REPO}/pull/${TARGET}" \
            --arg provider "$PROVIDER" --arg model "$MODEL" \
            '{ts:$ts,kind:"llm_assist",issue:$issue,ok:true,provider:$provider,model:$model,lane:"help-wanted",selection:"live_catalog"}' \
            >> "docs/ops/generated/help-wanted-evidence/${DAY}.jsonl"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: help-wanted-llm-evidence
          path: docs/ops/generated/help-wanted-evidence/
          if-no-files-found: ignore
