name: help-wanted-llm-assist

# LIVE catalog selection — NOT legacy model-router fallback chain.
# NOT MoneyBall admission (MB scores providers after repeated success).
#
# providers: openrouter + felo + omni via scripts/provider_model_catalog.py
# free = :free OR zero price OR free_trial (FELO ox-alpha path)

on:
  schedule:
    - cron: "23 */6 * * *"
      timezone: 'UTC'
  workflow_dispatch:
    inputs:
      pr:
        description: "Foreign PR URL (empty = first CHANGES_REQUESTED foreign)"
        required: false
        default: ""
  repository_dispatch:
    types: [help-wanted-llm-assist]

concurrency:
  group: help-wanted-llm-assist
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a # v5.0.0

      - name: Resolve target foreign PR
        id: target
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const pr = String(process.env.INPUT_PR || '').trim();
            const inputPr = context.payload.inputs?.pr || context.payload.client_payload?.pr || '';
            const requested = pr || String(inputPr || '').trim();

            let owner, repo, number;
            if (requested) {
              const m = requested.match(/github\.com\/([^/]+)\/([^/]+)\/pull\/(\d+)/);
              if (!m) {
                core.setFailed(`bad pr url: ${requested}`);
                return;
              }
              [, owner, repo, number] = m;
            } else {
              const q = encodeURIComponent('author:timerloggedout-spec is:pr is:open review:changes_requested -repo:timerloggedout-spec/termux-monorepo');
              let items = (await github.rest.search.issuesAndPullRequests({ q, per_page: 5 })).data.items || [];
              if (!items.length) {
                const q2 = encodeURIComponent('author:timerloggedout-spec is:pr is:open -repo:timerloggedout-spec/termux-monorepo');
                items = (await github.rest.search.issuesAndPullRequests({ q: q2, per_page: 5 })).data.items || [];
              }
              if (!items.length) {
                core.setOutput('skip', 'true');
                core.info('no foreign PR');
                return;
              }
              const item = items[0];
              const parts = String(item.repository_url || '').replace(/\/$/, '').split('/');
              owner = parts.at(-2);
              repo = parts.at(-1);
              number = String(item.number);
            }

            const prd = (await github.rest.pulls.get({ owner, repo, pull_number: Number(number) })).data;
            const reviews = (await github.rest.pulls.listReviews({ owner, repo, pull_number: Number(number), per_page: 100 })).data;
            const files = (await github.rest.pulls.listFiles({ owner, repo, pull_number: Number(number), per_page: 100 })).data;

            const requestedChanges = reviews
              .filter(r => r.state === 'CHANGES_REQUESTED')
              .map(r => `@${r.user?.login || 'reviewer'}:\n${String(r.body || '').slice(0, 1500)}`)
              .join('\n\n');

            const title = prd.title || '';
            const body = String(prd.body || '').slice(0, 2000);
            const fileList = files.slice(0, 20).map(f => f.filename || '').join(', ');
            let prompt = `Help-wanted lane: foreign PR ${owner}/${repo}#${number}\nTitle: ${title}\nBody:\n${body}\nFiles: ${fileList}\n\n`;
            if (requestedChanges) prompt += `CHANGES_REQUESTED:\n${requestedChanges}\n\n`;
            prompt += 'Concrete file-level next-patch plan (max 40 lines). No secrets.';

            fs.writeFileSync('/tmp/hw-llm-prompt.txt', prompt);
            core.setOutput('skip', 'false');
            core.setOutput('owner', owner);
            core.setOutput('repo', repo);
            core.setOutput('number', String(number));
            core.setOutput('full', `${owner}/${repo}`);
            core.info(`target ${owner}/${repo}#${number}`);
        env:
          INPUT_PR: ${{ github.event.inputs.pr || github.event.client_payload.pr || '' }}

      - name: Live catalog select (openrouter|felo|omni)
        id: pick
        if: steps.target.outputs.skip != 'true'
        uses: ./.github/actions/provider-model-catalog
        with:
          openrouter-key: ${{ secrets.OPENROUTER_API_KEY }}
          felo-key: ${{ secrets.FELO_AI_API }}
          omni-key: ${{ secrets.OMNI_API_KEY }}
          omniroute-key: ${{ secrets.OMNIROUTE_API_KEY }}

      - name: Invoke selected model + prepare comment
        id: invoke
        if: steps.target.outputs.skip != 'true' && steps.pick.outputs.skip != 'true'
        uses: ./.github/actions/llm-chat-completion
        with:
          provider: ${{ steps.pick.outputs.provider }}
          model: ${{ steps.pick.outputs.model }}
          prompt-path: /tmp/hw-llm-prompt.txt
          api-key: ${{ steps.pick.outputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || steps.pick.outputs.provider == 'felo' && secrets.FELO_AI_API || secrets.OMNI_API_KEY || secrets.OMNIROUTE_API_KEY }}

      - name: Post assist comment with scoped GitHub token
        if: steps.target.outputs.skip != 'true' && steps.pick.outputs.skip != 'true' && steps.invoke.outputs.skip != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          REPO: ${{ steps.target.outputs.full }}
          TARGET: ${{ steps.target.outputs.number }}
        with:
          github-token: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const [owner, repo] = process.env.REPO.split('/');
            const issue_number = Number(process.env.TARGET);
            const body = fs.readFileSync('/tmp/hw-llm-body.txt', 'utf8');
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.info('posted help-wanted assist comment');
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: help-wanted-llm-evidence
          path: docs/ops/generated/help-wanted-evidence/
          if-no-files-found: ignore
