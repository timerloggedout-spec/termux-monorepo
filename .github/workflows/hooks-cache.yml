name: hooks-cache

on:
  schedule:
    - cron: "0 2 * * 1"       # Monday 02:00 UTC — keep cache warm
  workflow_dispatch:

jobs:
  prime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cache pre-commit env
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install toolchain
        run: pip install --quiet ruff detect-secrets pre-commit
      - name: Cache gitleaks binary
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-${{ runner.os }}-8.30.1
      - run: |
          mkdir -p ~/.local/bin
          [ -x ~/.local/bin/gitleaks ] || (curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C ~/.local/bin gitleaks && chmod +x ~/.local/bin/gitleaks)
