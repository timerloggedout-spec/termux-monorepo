name: hygiene-sweep

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - name: Check secrets
        id: cfg
        env:
          KEY:  ${{ secrets.MANUS_SSH_KEY }}
          HOST: ${{ secrets.MANUS_SSH_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then
            echo "::warning::MANUS_SSH_* missing — skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same environmental class as continuous-improve run 37145725107.
          if ! getent hosts "$HOST" >/dev/null 2>&1; then
            echo "::warning::MANUS_SSH_HOST does not resolve. Recording host-unresolved skip."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Reach Termux
        if: steps.cfg.outputs.ok == 'true'
        env:
          KEY:  ${{ secrets.MANUS_SSH_KEY }}
          HOST: ${{ secrets.MANUS_SSH_HOST }}
          PORT: ${{ secrets.MANUS_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "── reclaim ──"
          if ! ssh -p "${PORT:-22}" -o BatchMode=yes -o ConnectTimeout=15 "termux@$HOST" \
            "python3 ~/.local/bin/hygiene-reclaim 2>&1 | tail -15"; then
            echo "::warning::MANUS SSH reclaim failed after DNS preflight. Recording dispatch-lost skip."
            exit 0
          fi

          echo "── mvt-batch ──"
          if ! ssh -p "${PORT:-22}" -o BatchMode=yes -o ConnectTimeout=15 "termux@$HOST" \
            "python3 ~/.local/bin/mvt-batch 2>&1 | tail -25"; then
            echo "::warning::MANUS SSH mvt-batch failed after DNS preflight. Recording dispatch-lost skip."
            exit 0
          fi
