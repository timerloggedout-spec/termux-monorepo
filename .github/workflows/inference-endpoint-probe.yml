name: QUE inference endpoint availability probe

# Probe every provider endpoint in scripts/provider_model_catalog.py ENDPOINTS:
# route class, model list + free flag, declared limits ("theirs") vs consumed
# calls ("ours"), ONE free 1-token completion per endpoint, safe_parallel_slots.
# Matrix is generated from ENDPOINTS, so it grows with the catalog; it doubles as
# an Actions caching stress test (pip cache + per-endpoint catalog cache).
# Secrets reach jobs via env only (absent => skipped); outputs carry presence
# booleans only. Results land on branch inference-ledger via the contents API.
# Schema: ops/inference/ENDPOINT-PROBE-SCHEMA.md

on:
  workflow_dispatch:
    inputs:
      doe_calls_per_slot:
        description: "Expected DoE calls per slot per day (slot math divisor)"
        required: false
        default: "50"
  schedule:
    - cron: "23 */6 * * *"
      timezone: UTC

concurrency:
  group: inference-endpoint-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      day: ${{ steps.matrix.outputs.day }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip deps
        id: pip-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-endpoint-probe-${{ runner.os }}-${{ hashFiles('scripts/inference/endpoint_probe.py', 'tests/test_endpoint_probe.py') }}
          restore-keys: pip-endpoint-probe-${{ runner.os }}-
      - name: Test probe (mock HTTP)
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_endpoint_probe.py -p no:cacheprovider
      - name: Generate endpoint matrix from ENDPOINTS
        id: matrix
        run: |
          echo "matrix=$(python scripts/inference/endpoint_probe.py matrix)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "pip_cache_hit=${{ steps.pip-cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_OUTPUT"

  probe:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PROBE_TOKEN: ${{ secrets[matrix.secret] || secrets[matrix.alias1] || secrets[matrix.alias2] || secrets[matrix.alias3] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '' }}
    steps:
      - name: Stamp job start
        run: echo "JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip deps
        id: pip-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-endpoint-probe-${{ runner.os }}-${{ hashFiles('scripts/inference/endpoint_probe.py') }}
          restore-keys: pip-endpoint-probe-${{ runner.os }}-
      - name: Cache endpoint model catalog (endpoint + day)
        id: catalog-cache
        uses: actions/cache@v4
        with:
          path: .cache/endpoint-catalog
          key: endpoint-catalog-${{ matrix.endpoint }}-${{ needs.setup.outputs.day }}
      - name: Probe ${{ matrix.endpoint }}
        env:
          CATALOG_CACHE_HIT: ${{ steps.catalog-cache.outputs.cache-hit == 'true' }}
          PIP_CACHE_HIT: ${{ steps.pip-cache.outputs.cache-hit == 'true' }}
        run: |
          python scripts/inference/endpoint_probe.py probe \
            --endpoint "${{ matrix.endpoint }}" --token-env PROBE_TOKEN \
            --cache-dir .cache/endpoint-catalog \
            --output "records/${{ matrix.endpoint }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: endpoint-probe-${{ matrix.endpoint }}
          path: records/${{ matrix.endpoint }}.json
          retention-days: 7

  aggregate:
    needs: probe
    if: always() && needs.probe.result != 'cancelled' && needs.probe.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: inference-ledger
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: endpoint-probe-*
          path: records
          merge-multiple: true
      - name: Read ours (inference-ledger) ∧ prior probe log
        run: |
          mkdir -p ops/inference
          api="https://api.github.com/repos/$REPO/contents"
          get() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "$api/$1?ref=$BRANCH" -o "$2" || rm -f "$2"; }
          get ops/inference/availability-ledger.json ops/inference/availability-ledger.json
          get ops/inference/endpoint-probe-log.jsonl ops/inference/endpoint-probe-log.jsonl
          ls -l ops/inference || true
      - name: Aggregate slots
        run: |
          python scripts/inference/endpoint_probe.py aggregate \
            --records "records/*.json" \
            --ledger ops/inference/availability-ledger.json \
            --log ops/inference/endpoint-probe-log.jsonl \
            --output ops/inference/endpoint-availability.json \
            --doe-calls-per-slot "${{ inputs.doe_calls_per_slot || '50' }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Write results to inference-ledger via contents API
        run: |
          api="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          if ! curl -fsS "${auth[@]}" "$api/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            base=$(curl -fsS "${auth[@]}" "$api/git/ref/heads/${{ github.event.repository.default_branch }}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["object"]["sha"])')
            curl -fsS "${auth[@]}" -X POST "$api/git/refs" -d "{\"ref\":\"refs/heads/$BRANCH\",\"sha\":\"$base\"}" >/dev/null
          fi
          put() {
            local path="$1" attempt sha body
            for attempt in 1 2 3; do
              sha=$(curl -fsS "${auth[@]}" "$api/contents/$path?ref=$BRANCH" 2>/dev/null | python3 -c 'import json,sys;print(json.load(sys.stdin).get("sha",""))' 2>/dev/null || true)
              body=$(python3 - "$path" "$sha" <<'PY'
          import base64, json, os, sys
          path, sha = sys.argv[1], sys.argv[2]
          doc = {"message": f"Record endpoint probe run {os.environ.get('GITHUB_RUN_ID')} [skip render]",
                 "branch": os.environ["BRANCH"],
                 "content": base64.b64encode(open(path, "rb").read()).decode()}
          if sha:
              doc["sha"] = sha
          print(json.dumps(doc))
          PY
              )
              if printf '%s' "$body" | curl -fsS "${auth[@]}" -X PUT "$api/contents/$path" -d @- >/dev/null; then
                echo "wrote $path"; return 0
              fi
              sleep $((attempt * 3))
            done
            echo "::warning::contents PUT failed for $path"; return 1
          }
          put ops/inference/endpoint-availability.json
          put ops/inference/endpoint-probe-log.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: endpoint-availability
          path: ops/inference/endpoint-availability.json
          retention-days: 30
