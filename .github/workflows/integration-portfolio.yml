name: Integration portfolio validation

on:
  pull_request:
    paths:
      - "docs/integrations/**"
      - "docs.json"
      - "sitemap.md"
      - "scripts/integrations/**"
      - "tests/test_capability_opportunity_graph.py"
      - ".github/workflows/integration-portfolio.yml"
  push:
    branches: [master, master-staging]
    paths:
      - "docs/integrations/**"
      - "docs.json"
      - "sitemap.md"
      - "scripts/integrations/**"
      - "tests/test_capability_opportunity_graph.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate integration registry, catalog, and documentation navigation
        run: python3 scripts/integrations/validate_portfolio.py
      - name: Validate CEEL capability graph and provenance links
        run: python3 scripts/integrations/validate_capability_graph.py
      - name: Test CEEL graph validation invariants
        run: python3 -m unittest discover -s tests -p 'test_capability_opportunity_graph.py' -v
