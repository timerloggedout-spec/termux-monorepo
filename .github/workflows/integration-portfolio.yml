name: Integration portfolio validation

on:
  pull_request:
    paths:
      - "docs/integrations/**"
      - "docs.json"
      - "sitemap.md"
      - "scripts/integrations/**"
      - "tests/test_capability_opportunity_graph.py"
      - ".github/workflows/integration-portfolio.yml"
  push:
    branches: [master, master-staging]
    paths:
      - "docs/integrations/**"
      - "docs.json"
      - "sitemap.md"
      - "scripts/integrations/**"
      - "tests/test_capability_opportunity_graph.py"
  workflow_dispatch:

permissions:
  contents: read

# QUE fan-out guard (Owner order 2026-11-18): PR events coalesce per PR;
# every other event keeps a unique group (run_id) ⇒ ¬coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate integration registry, catalog, and documentation navigation
        run: python3 scripts/integrations/validate_portfolio.py
      - name: Install inference contract test dependencies
        run: python3 -m pip install --quiet 'jsonschema==3.2.0' pytest
      - name: Validate multi-project inference identity contract
        run: python3 -m pytest tests/test_inference_execution_contract.py -q
      - name: Validate CEEL capability graph and provenance links
        run: python3 scripts/integrations/validate_capability_graph.py
      - name: Test CEEL graph validation invariants
        run: python3 -m unittest discover -s tests -p 'test_capability_opportunity_graph.py' -v
