name: iOS-Termux Contribute

# Apply a reviewed patch from this repository to the upstream iOS-Termux
# project, push a unique branch to the maintained fork, and open a PR.
# The target repository never receives a direct default-branch write.

on:
  push:
    branches: [master]
    paths:
      - '.github/patches/ios-termux-security.patch'
      - '.github/patches/ios-termux-security-pr.md'
      - '.github/workflows/ios-termux-contribute.yml'
  workflow_dispatch:
    inputs:
      target_repo:
        description: Target repository (owner/repo)
        required: true
        default: "credkellar/iOS-Termux"
      base_branch:
        description: Target base branch
        required: true
        default: "main"
      pr_title:
        description: Pull request title
        required: true
        default: "Security: require explicit SSH key authentication for public sshd"
      use_fork:
        description: Push through timerloggedout-spec fork
        required: true
        type: boolean
        default: true

concurrency:
  group: ios-termux-contribute-${{ github.event.inputs.target_repo || 'credkellar/iOS-Termux' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  contribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate inputs and resolve destination
        id: cfg
        env:
          TARGET_REPO_INPUT: ${{ inputs.target_repo }}
          BASE_BRANCH_INPUT: ${{ inputs.base_branch }}
          PR_TITLE_INPUT: ${{ inputs.pr_title }}
          USE_FORK_INPUT: ${{ inputs.use_fork }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          target_repo="${TARGET_REPO_INPUT:-credkellar/iOS-Termux}"
          base_branch="${BASE_BRANCH_INPUT:-main}"
          pr_title="${PR_TITLE_INPUT:-Security: require explicit SSH key authentication for public sshd}"
          use_fork="${USE_FORK_INPUT:-true}"
          [[ "$target_repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "Invalid owner/repo"; exit 2; }
          [[ "$base_branch" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid base branch"; exit 2; }
          [[ "$use_fork" == "true" || "$use_fork" == "false" ]] || { echo "use_fork must be boolean"; exit 2; }
          owner="${target_repo%%/*}"
          name="${target_repo#*/}"
          if [[ "$use_fork" == "true" ]]; then
            push_owner="timerloggedout-spec"
            push_repo="${name}_fork"
          else
            push_owner="$owner"
            push_repo="$name"
          fi
          branch="security-public-ssh-key-auth-${RUN_ID}"
          {
            echo "owner=$owner"
            echo "repo=$name"
            echo "base_branch=$base_branch"
            echo "pr_title<<EOF"
            echo "$pr_title"
            echo "EOF"
            echo "push_owner=$push_owner"
            echo "push_repo=$push_repo"
            echo "branch=$branch"
            echo "head=$push_owner:$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Require cross-repository token
        env:
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${OPERATOR_TOKEN:-}" ]]; then
            echo "::error::OPERATOR_GITHUB_TOKEN is required to push the fork and open an upstream PR."
            exit 1
          fi

      - name: Verify patch and prepare target branch
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
          OWNER: ${{ steps.cfg.outputs.owner }}
          REPO: ${{ steps.cfg.outputs.repo }}
          PUSH_OWNER: ${{ steps.cfg.outputs.push_owner }}
          PUSH_REPO: ${{ steps.cfg.outputs.push_repo }}
          BASE_BRANCH: ${{ steps.cfg.outputs.base_branch }}
          BRANCH: ${{ steps.cfg.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/patches/ios-termux-security.patch
          test -s .github/patches/ios-termux-security-pr.md
          git clone --depth 1 --branch "$BASE_BRANCH" "https://github.com/$OWNER/$REPO.git" /tmp/target
          cd /tmp/target
          git apply --check "$GITHUB_WORKSPACE/.github/patches/ios-termux-security.patch"
          git apply "$GITHUB_WORKSPACE/.github/patches/ios-termux-security.patch"
          git diff --check
          git config user.name "timerloggedout-spec"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios2termux/brains.py tests/test_security_regressions.py
          git diff --cached --check
          git diff --cached --quiet && { echo "Patch produced no changes"; exit 3; }
          git commit -m "Security: require key auth for public SSH"
          git remote add contribution "https://x-access-token:${GH_TOKEN}@github.com/$PUSH_OWNER/$PUSH_REPO.git"
          git push contribution "HEAD:refs/heads/$BRANCH"

      - name: Check for existing pull request
        id: existing
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
          OWNER: ${{ steps.cfg.outputs.owner }}
          REPO: ${{ steps.cfg.outputs.repo }}
          HEAD_LABEL: ${{ steps.cfg.outputs.head }}
          BASE_BRANCH: ${{ steps.cfg.outputs.base_branch }}
        shell: bash
        run: |
          set -euo pipefail
          prs="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$OWNER/$REPO/pulls?state=open&per_page=100")"
          number="$(jq -r --arg head "$HEAD_LABEL" --arg base "$BASE_BRANCH"             '[.[] | select(.head.label == $head and .base.ref == $base)][0].number // empty' <<<"$prs")"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.existing.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
          OWNER: ${{ steps.cfg.outputs.owner }}
          REPO: ${{ steps.cfg.outputs.repo }}
          HEAD_LABEL: ${{ steps.cfg.outputs.head }}
          BASE_BRANCH: ${{ steps.cfg.outputs.base_branch }}
          PR_TITLE: ${{ steps.cfg.outputs.pr_title }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(cat .github/patches/ios-termux-security-pr.md)"
          jq -n --arg title "$PR_TITLE" --arg body "$body"             --arg head "$HEAD_LABEL" --arg base "$BASE_BRANCH"             '{title:$title, body:$body, head:$head, base:$base, maintainer_can_modify:true}' > /tmp/pr.json
          response="$(curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             -d @/tmp/pr.json             "https://api.github.com/repos/$OWNER/$REPO/pulls")"
          url="$(jq -r '.html_url // empty' <<<"$response")"
          [[ -n "$url" ]] || { echo "::error::GitHub did not return a PR URL"; exit 4; }
          echo "::notice::Created $url"
          echo "PR_URL=$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Report existing pull request
        if: steps.existing.outputs.number != ''
        env:
          OWNER: ${{ steps.cfg.outputs.owner }}
          REPO: ${{ steps.cfg.outputs.repo }}
          NUMBER: ${{ steps.existing.outputs.number }}
        run: 'echo "Existing PR: https://github.com/$OWNER/$REPO/pull/$NUMBER" >> "$GITHUB_STEP_SUMMARY"'
