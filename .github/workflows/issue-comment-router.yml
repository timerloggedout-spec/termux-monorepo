name: Issue Comment Router — modular fan-out reduction

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: issue-comment-router-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legacy_jules_request: ${{ steps.classify.outputs.legacy_jules_request }}
      needs_ledger: ${{ steps.classify.outputs.needs_ledger }}
      needs_gemini: ${{ steps.classify.outputs.needs_gemini }}
    steps:
      - name: Classify comment for routing
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body || '';
            const isBot = context.payload.sender.type === 'Bot';
            const isPR = !!context.payload.issue.pull_request;
            const labels = (context.payload.issue.labels || []).map(l => l.name);

            // Early filters to avoid unnecessary downstream starts
            const legacy_jules_request = !isBot && (body.includes('@jules') || labels.includes('jules'));
            const needs_ledger = isPR && body.includes('Implements:');
            const needs_gemini = !isBot && (body.includes('@gemini') || labels.includes('gemini'));

            core.setOutput('legacy_jules_request', legacy_jules_request);
            core.setOutput('needs_ledger', needs_ledger);
            core.setOutput('needs_gemini', needs_gemini);

            console.log(`Classification: legacy_jules_request=${legacy_jules_request}, ledger=${needs_ledger}, gemini=${needs_gemini}, bot=${isBot}`);

      - name: Record retired Jules request
        if: steps.classify.outputs.legacy_jules_request == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue.number;
            const marker = '<!-- jules-retired-router -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue, per_page: 100,
            });
            if (comments.some(comment => comment.body?.includes(marker))) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issue,
              body: [
                marker,
                '**Google Jules routing is retired.** The hosted service became read-only after 2026-11-11.',
                'Use the local Jules-derived DoE role guidance at `.agents/skills/jules-doe-role-adapter/SKILL.md`.',
                'Execution requires a currently available provider adapter selected through `docs/schemas/agent-roster.yaml`.',
              ].join('\n'),
            });

      - name: Route to Ledger (if matched)
        if: steps.classify.outputs.needs_ledger == 'true'
        run: |
          echo "Dispatching production ledger update"

      - name: Route to Gemini (if matched)
        if: steps.classify.outputs.needs_gemini == 'true'
        run: |
          echo "Dispatching Gemini peer"

      - name: Emit routing receipt
        run: |
          echo "Router completed; no spam from unmatched issue_comment."
