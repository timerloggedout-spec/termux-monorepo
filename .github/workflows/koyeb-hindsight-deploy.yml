name: Hindsight Deploy (Fly.io)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy | destroy | status | logs'
        required: false
        default: 'deploy'
  push:
    paths:
      - 'deploy/fly/fly.toml'
      - '.github/workflows/koyeb-hindsight-deploy.yml'
    branches: [master]

concurrency:
  group: hindsight-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hindsight-prod
    env:
      FLY_API_TOKEN: ${{ secrets.Fly_io_ORG_TOKEN }}
      FLY_ORG: personal
      APP_NAME: hindsight-deepagent
      REGION: sjc

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest

      - name: Whoami
        run: flyctl auth whoami

      - name: Ensure app exists
        run: |
          flyctl apps list | awk 'NR>1 {print $1}' | grep -qx "$APP_NAME" \
            || flyctl apps create "$APP_NAME" --org "$FLY_ORG"

      - name: Ensure volume exists
        run: |
          flyctl volumes list -a "$APP_NAME" | grep -q hindsight_data \
            || flyctl volumes create hindsight_data --size 1 --region "$REGION" --yes -a "$APP_NAME"

      - name: Push secrets
        run: |
          flyctl secrets set -a "$APP_NAME" \
            HINDSIGHT_API_LLM_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            HINDSIGHT_API_EMBEDDINGS_GOOGLE_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --stage

      - name: Deploy
        run: flyctl deploy --remote-only -a "$APP_NAME" --config deploy/fly/fly.toml

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            url="https://${APP_NAME}.fly.dev/health"
            if curl -sf --max-time 5 "$url" >/dev/null 2>&1; then
              echo "✓ healthy: $url"
              exit 0
            fi
            echo "  …($i/30) waiting"
            sleep 6
          done
          echo "✗ health check never passed"; exit 1

      - name: Report
        run: |
          echo "## Hindsight deployed" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://${APP_NAME}.fly.dev" >> $GITHUB_STEP_SUMMARY
          echo "- Dashboard: https://${APP_NAME}.fly.dev:9999" >> $GITHUB_STEP_SUMMARY
          echo "- Region: ${REGION}" >> $GITHUB_STEP_SUMMARY
