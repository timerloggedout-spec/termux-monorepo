name: L3VERAGE contract validation

on:
  pull_request:
    paths:
      - "docs/leverage/**"
      - "docs/proposals/active/l3verage-department/**"
      - "scripts/leverage/**"
      - "tests/test_leverage*.py"
      - ".github/workflows/l3verage-contracts.yml"
  push:
    branches: [master, feat/l3verage-department-foundation]
    paths:
      - "docs/leverage/**"
      - "scripts/leverage/**"
      - "tests/test_leverage*.py"
      - ".github/workflows/l3verage-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile leverage tooling
        run: python3 -m py_compile scripts/leverage/validate_mechanisms.py scripts/leverage/compare_experiment_records.py
      - name: Validate mechanism catalog
        run: python3 scripts/leverage/validate_mechanisms.py
      - name: Run leverage regression tests
        run: python3 -m unittest discover -s tests -p 'test_leverage*.py' -v
      - name: Check comparison CLI contract
        run: python3 scripts/leverage/compare_experiment_records.py --help
