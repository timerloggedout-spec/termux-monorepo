# Record completed runs of the help-wanted (Tribute) and SHE lanes into the
# Neon lane_events ledger (ops/lane-events/schema.sql, scripts/ops/lane_event.py).
# Additive: observes completions via shared scheduled poller (observer-poller-scheduled.yml);
# never edits or blocks the watched workflows. No-ops (notice only) until a repo secret exists:
#   LANE_EVENTS_DATABASE_URL (Postgres URL) or NEON_API_KEY (Neon free tier).
# workflow_run trigger retired 2026-10-26 to eliminate residual skipped/cancelled run records
# that still generate notification spam even with job-level success filters.
# Feature preservation: success events continue via poller batch queries.
name: lane events recorder

on:
  workflow_dispatch:
    inputs:
      command:
        description: "record (self-test event) | count | schema"
        default: count
        type: choice
        options: [count, record, schema]

permissions:
  contents: read
  actions: read

concurrency:
  group: lane-events-recorder-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/lane-event
            scripts/ops/lane_event.py
            ops/lane-events
            docs/ops/generated/help-wanted-status.json
          sparse-checkout-cone-mode: false

      - name: manual (${{ inputs.command }})
        uses: ./.github/actions/lane-event
        with:
          command: ${{ inputs.command }}
          lane: selftest
          workflow: lane events recorder
          event-type: selftest
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          head-sha: ${{ github.sha }}
          database-url: ${{ secrets.LANE_EVENTS_DATABASE_URL }}
          neon-api-key: ${{ secrets.NEON_API_KEY }}
