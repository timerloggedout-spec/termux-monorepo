name: Laya Live Runtime
on:
  workflow_dispatch:
    inputs:
      preload:
        description: "Preload all checkpoints (high memory); normally false"
        required: false
        default: "false"
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
concurrency:
  group: laya-live-\${{ github.ref }}
  cancel-in-progress: false
jobs:
  laya-live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: laya-live
    env:
      USE_TF: "0"
      LAYA_PRELOAD: \${{ inputs.preload || '0' }}
      HF_HOME: \${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: laya-\${{ runner.os }}-py312-v035-\${{ hashFiles('scripts/laya_decision_stub.py') }}
          restore-keys: |
            laya-\${{ runner.os }}-py312-v035-
      - name: Install Laya runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "laya==0.3.5"
      - name: Live decision smoke
        run: |
          mkdir -p artifacts/laya
          python scripts/laya_decision_stub.py --live --json | tee artifacts/laya/live-decision.json
      - name: Live category sweep
        run: |
          python scripts/laya_sweep.py --live --output artifacts/laya/sweep.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path("artifacts/laya/sweep.jsonl").read_text().splitlines()]
          assert len(rows) >= 6 and all(r["mode"]=="live" for r in rows)
          print("live sweep receipts:", len(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: laya-live-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: artifacts/laya/
          retention-days: 30
