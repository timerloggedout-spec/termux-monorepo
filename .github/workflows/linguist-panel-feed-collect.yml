# Linguist Panel feed refresh (contract: docs/ops/LINGUIST-PANEL-FEED.md).
# Regenerates apps/tribute-dashboard/data/linguist-panel-feed.json
# from the mapping sources of record and proposes it as a refresh PR —
# never commits directly. Mirrors the oracle-panel-feed-collect pattern.
name: linguist-panel-feed-collect

on:
  workflow_dispatch:
  schedule:
    - cron: '53 6 * * 2'
  push:
    branches: [master]
    paths:
      - 'workspace/compression_sandbox/cedrlang/**'
      - 'harmony_hub/config/grimoire/**'
      - 'harmony_hub/config/GRIMOIRE_DICTIONARY.md'
      - 'docs/proposals/active/notation-sets/nomenclature-matrix/seed.json'
      - 'docs/schemas/routing-notation.yaml'
      - 'archwiz/pointer_index.json'
      - 'scripts/linguist/linguist_panel_feed.py'

concurrency:
  group: linguist-panel-feed-collect
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint Termux Fleet Swarm token (own rate bucket)
        # #5219 leg (a): this collector's API reads/writes drew the shared
        # per-repo GITHUB_TOKEN bucket (1,000/h class) exhausted on
        # 2026-11-12. The Swarm App installation token carries its own
        # 12,500 bucket. Downscoped to this workflow's declared permissions.
        id: swarm
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3
        with:
          app-id: ${ vars.TERMUX_FLEET_SWARM_APP_ID }
          private-key: ${ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }
          repositories: ${ github.event.repository.name }
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.swarm.outputs.token }}
      - name: Collect the feed
        run: |
          set -euo pipefail
          python3 -B scripts/linguist/linguist_panel_feed.py \
            --root . --out apps/tribute-dashboard/data/linguist-panel-feed.json
      - name: Propose the refresh as a PR
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/tribute-dashboard/data/linguist-panel-feed.json; then
            echo "feed unchanged; no refresh PR"
            exit 0
          fi
          branch="linguist-panel-feed/refresh"
          git config user.name "linguist-panel-feed-collect"
          git config user.email "actions@github.com"
          git checkout -B "$branch"
          git add apps/tribute-dashboard/data/linguist-panel-feed.json
          git commit -m "chore(linguist): refresh linguist-panel-feed.json"
          git push -f origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore(linguist): refresh linguist-panel-feed.json" \
            --body "Automated Linguist Panel feed refresh (collector: scripts/linguist/linguist_panel_feed.py; contract: docs/ops/LINGUIST-PANEL-FEED.md). Data is derived from the mapping sources of record at collection time; nothing is copied forward." \
            || echo "refresh PR already open"
        env:
          GH_TOKEN: ${{ steps.swarm.outputs.token }}
