name: localization-validate

on:
  pull_request:
    paths:
      - "localization/**"
      - "docs/locales/**"
      - "docs/localization/**"
      - "scripts/localization/**"
      - "scripts/ops/render_teammate_portal_status.py"
      - "tests/localization/**"
      - ".github/workflows/localization-validate.yml"
  push:
    branches: [master]
    paths:
      - "localization/**"
      - "docs/locales/**"
      - "docs/localization/**"
      - "scripts/localization/**"
      - "scripts/ops/render_teammate_portal_status.py"
      - "tests/localization/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install portal renderer dependency
        run: python -m pip install markdown==3.7
      - name: Validate localization contracts
        run: python3 scripts/localization/validate.py
      - name: Test localization and portal rendering
        run: python3 -m unittest discover -s tests/localization -v
