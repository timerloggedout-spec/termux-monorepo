name: Master deletion recovery

# Recovery control-plane for long-lived integration branches. It restores only
# source/docs/tests that still exist on master; generated telemetry is preserved
# by provenance rather than blindly regenerated. Never executes PR source.
on:
  push:
    branches: ['jules-*']
    paths: ['.github/workflows/master-deletion-recovery.yml','docs/**','she/**','tests/**','multi-ai-cli/**']

permissions:
  contents: write

concurrency:
  group: master-deletion-recovery-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  recover:
    if: ${{ !contains(github.event.head_commit.message, '[master-recovery]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Fetch master
        run: git fetch origin master --no-tags
      - name: Recover authoritative source, docs, and tests
        shell: bash
        run: |
          set -euo pipefail
          files=(
            'docs/proposals/active/notation-sets/INDEX-HYGIENE-NOTES.md'
            'docs/proposals/active/notation-sets/NSE-022-LAMBDA-LANG.md'
            'docs/proposals/active/notation-sets/NSE-023-LEAN-MATHLIB-ORACLE.md'
            'she/attest.py' 'she/evolve.py' 'she/learn.py' 'she/ledger.py' 'she/promote.py' 'she/replay.py'
            'tests/test_multi_ai_cache_privileges.py' 'tests/test_she_attest.py' 'tests/test_she_evolve.py'
            'tests/test_she_learn.py' 'tests/test_she_ledger.py' 'tests/test_she_promote.py' 'tests/test_she_replay.py'
          )
          restored=0
          for path in "${files[@]}"; do
            if git cat-file -e "origin/master:$path" 2>/dev/null && ! git cat-file -e "HEAD:$path" 2>/dev/null; then
              git checkout origin/master -- "$path"
              restored=$((restored + 1))
            fi
          done
          echo "restored=$restored"
      - name: Commit recovery
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'timerloggedout-spec'
          git config user.email 'timerloggedout-spec@users.noreply.github.com'
          git add docs/proposals/active/notation-sets she tests multi-ai-cli
          git commit -m 'recover master source docs and tests [master-recovery]'
          git push origin HEAD:${{ github.ref_name }}
