# Mesh resiliency: Upstash Redis heartbeat. Keeps the free `termux-monorepo`
# Redis active (Upstash archives inactive free DBs) and proves the mesh
# queue/cron store is reachable. Additive; names-only output; no values printed.
name: Mesh Upstash Heartbeat

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-upstash-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.hb.outputs.ok }}
    steps:
      - name: SET mesh:heartbeat ∧ GET readback
        id: hb
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -u
          echo "ok=false" >> "$GITHUB_OUTPUT"
          if [ -z "${UPSTASH_REDIS_REST_URL:-}" ] || [ -z "${UPSTASH_REDIS_REST_TOKEN:-}" ]; then
            echo "::error::missing secret(s): UPSTASH_REDIS_REST_URL ∨ UPSTASH_REDIS_REST_TOKEN"
            exit 1
          fi
          base="${UPSTASH_REDIS_REST_URL%/}"
          set_code=$(curl -sS -o set.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${UPSTASH_REDIS_REST_TOKEN}" \
            "${base}/set/mesh:heartbeat/${RUN_ID}/EX/172800")
          get_code=$(curl -sS -o get.json -w '%{http_code}' \
            -H "Authorization: Bearer ${UPSTASH_REDIS_REST_TOKEN}" \
            "${base}/get/mesh:heartbeat")
          got=$(python3 -c 'import json;print(json.load(open("get.json")).get("result") or "")' 2>/dev/null || true)
          if [ "$set_code" = "200" ] && [ "$get_code" = "200" ] && [ "$got" = "$RUN_ID" ]; then
            echo "::notice title=upstash-heartbeat::live · SET ${set_code} ∧ GET ${get_code} · readback matches run_id · TTL 172800s"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=upstash-heartbeat::down · SET ${set_code} · GET ${get_code} · readback_match=$([ "$got" = "$RUN_ID" ] && echo yes || echo no)"
            exit 1
          fi

  enqueue-on-failure:
    needs: heartbeat
    if: ${{ failure() }}
    permissions:
      issues: write
      contents: read
    uses: ./.github/workflows/hark-enqueue.yml
    with:
      title: "mesh: Upstash Redis heartbeat failing (termux-monorepo DB)"
      key: "gha-failure:mesh-upstash-heartbeat"
      project: "termux-ops"
      priority: "P1"
      inputs: |
        workflow: mesh-upstash-heartbeat.yml
        run_id: "${{ github.run_id }}"
        check: "secrets set ∧ DB active (archived DBs restorable in console.upstash.com)"
      done_when: "next mesh-upstash-heartbeat run green (::notice live)"
