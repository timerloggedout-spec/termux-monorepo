name: mirror-openrouter
on:
  workflow_dispatch:
    inputs:
      confirm: { required: true }
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - if: github.event.inputs.confirm != 'MIRROR'
        run: exit 1
      - env:
          GH_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN }}
          V: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          [ -z "$V" ] && exit 0
          echo "::add-mask::$V"
          printf '%s' "$V" | gh secret set OPENROUTER_API_KEY \
            --app codespaces -R ${{ github.repository }}
          echo "wrote OPENROUTER_API_KEY"
