name: mirror-actions-to-codespaces
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "type MIRROR to proceed"
        required: true
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Guard
        run: |
          [ "${{ github.event.inputs.confirm }}" = "MIRROR" ] || exit 1
      - name: Mirror
        env:
          # admin-scoped PAT (stored in Actions scope already)
          GH_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN }}
          V_GEMINI: ${{ secrets.GEMINI_API_KEY }}
          V_HS_KEY: ${{ secrets.HINDSIGHT_API_KEY }}
          V_HS_BASE: ${{ secrets.HINDSIGHT_BASE_URL }}
          V_HS_BANK: ${{ secrets.HINDSIGHT_BANK_ID }}
          V_HS_TENANT: ${{ secrets.HINDSIGHT_TENANT_ID }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          _set() {
            _n="$1"; _v="$2"
            [ -z "$_v" ] && { echo "skip $_n (empty)"; return; }
            echo "::add-mask::$_v"
            printf '%s' "$_v" | gh secret set "$_n" --app codespaces -R "$REPO"
            echo "  wrote $_n"
          }
          _set HINDSIGHT_API_LLM_API_KEY "$V_GEMINI"
          _set HINDSIGHT_API_KEY        "$V_HS_KEY"
          _set HINDSIGHT_BASE_URL       "$V_HS_BASE"
          _set HINDSIGHT_BANK_ID        "$V_HS_BANK"
          _set HINDSIGHT_TENANT_ID      "$V_HS_TENANT"
