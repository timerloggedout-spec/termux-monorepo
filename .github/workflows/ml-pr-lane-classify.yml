name: ml PR lane classify

# Production run of the vocab-v2 PR classifier (ml/pipelines/lanes) over
# the live open-PR list — contract: docs/ops/ML-PR-LANE-CLASSIFY.md.
# The keep-alive workflow only unit-tests the ml package on ml/** path
# changes; this workflow is the classifier's production trigger. It
# writes ops/ml/pr-lane-feed.json and commits it only when it changed
# (repository-observatory collector pattern). Classification is
# descriptive: no labels, comments, or gates are touched.

on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * *'

permissions:
  contents: write

concurrency:
  group: ml-pr-lane-classify
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.OPERATOR_GITHUB_TOKEN || github.token }}
          fetch-depth: 1
      - name: Classify open PRs (vocab v2)
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || github.token }}
        run: |
          set +e
          python3 ml/pipelines/production_classify.py > classify-run.log 2>&1
          code=$?
          echo "collector exit=$code" >> classify-run.log
          mkdir -p ops/ml
          cp classify-run.log ops/ml/pr-lane-debug.log
          exit $code
      - name: Commit feed if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ops/ml
          git add -A ops/ml/
          if git diff --cached --quiet; then
            echo "feed unchanged — no commit"
          else
            git commit -m "data(ml): pr-lane-feed refresh [skip ci]"
            git push
          fi
