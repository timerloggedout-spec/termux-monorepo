name: ml PR lane classify

# Production run of the vocab-v2 PR classifier (ml/pipelines/lanes) over
# the live open-PR list — contract: docs/ops/ML-PR-LANE-CLASSIFY.md.
# The keep-alive workflow only unit-tests the ml package on ml/** path
# changes; this workflow is the classifier's production trigger. It
# writes ops/ml/pr-lane-feed.json and commits it only when it changed
# (repository-observatory collector pattern). Classification is
# descriptive: no labels, comments, or gates are touched.
#
# Invoke as a module from the repo root, never as a script path:
# `python3 ml/pipelines/production_classify.py` puts ml/pipelines/ at
# sys.path[0], where its operator/ subpackage shadows the stdlib
# operator module and the interpreter dies importing json (first five
# dispatched runs, 2026-10-28 — root-caused via a debug-capture run on
# a bisect branch; the keep-alive's -m invocations never hit it).

on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * *'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ml-pr-lane-classify
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.OPERATOR_GITHUB_TOKEN || github.token }}
          fetch-depth: 1
      - name: Classify open PRs (vocab v2)
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || github.token }}
        run: python3 -m ml.pipelines.production_classify
      - name: Commit feed if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ops/ml
          git add -A ops/ml/
          if git diff --cached --quiet; then
            echo "feed unchanged — no commit"
          else
            git commit -m "data(ml): pr-lane-feed refresh [skip ci]"
            git push
          fi
