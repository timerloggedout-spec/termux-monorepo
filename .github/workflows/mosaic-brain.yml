name: MOSAIC Brain Rust specialist

on:
  pull_request:
    paths:
      - "archwiz/mosaic_brain/**"
      - "brain.rs"
      - "brain/**"
      - ".github/workflows/mosaic-brain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mosaic-brain-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: MOSAIC fmt + check + test + clippy (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85.0", "1.100.0"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path archwiz/mosaic_brain/Cargo.toml -- --check
      - name: Check
        run: cargo check --manifest-path archwiz/mosaic_brain/Cargo.toml --all-targets
      - name: Test
        run: cargo test --manifest-path archwiz/mosaic_brain/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path archwiz/mosaic_brain/Cargo.toml --all-targets -- -D warnings
