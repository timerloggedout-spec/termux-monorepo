name: MOSAIC Brain Rust specialist

on:
  pull_request:
    paths:
      - "archwiz/mosaic_brain/**"
      - "brain.rs"
      - "brain/**"
      - ".github/workflows/mosaic-brain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mosaic-brain-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: MOSAIC fmt + check + test + clippy (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Two jobs per eligible PR/manual run; no scheduled trigger. Shared Brain
      # changes intentionally also exercise the root-kernel matrix (four jobs total).
      matrix:
        rust: ["1.85.0", "1.100.0"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path archwiz/mosaic_brain/Cargo.toml -- --check
      - name: Check
        run: cargo check --manifest-path archwiz/mosaic_brain/Cargo.toml --all-targets
      - name: Test
        run: |
          set -o pipefail
          cargo test --manifest-path archwiz/mosaic_brain/Cargo.toml -- --nocapture | tee "$RUNNER_TEMP/mosaic-brain-test.log"
      - name: Upload shadow composition receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mosaic-brain-shadow-receipt-${{ matrix.rust }}
          path: ${{ runner.temp }}/mosaic-brain-test.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Clippy
        run: cargo clippy --manifest-path archwiz/mosaic_brain/Cargo.toml --all-targets -- -D warnings
