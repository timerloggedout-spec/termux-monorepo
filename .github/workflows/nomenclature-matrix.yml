name: Nomenclature Equivalency Matrix
on:
  push:
    paths:
      - 'docs/proposals/active/notation-sets/nomenclature-matrix/**'
      - 'scripts/ci/validate_nomenclature_matrix.py'
      - 'tests/test_nomenclature_matrix.py'
      - '.github/workflows/nomenclature-matrix.yml'
  pull_request:
    paths:
      - 'docs/proposals/active/notation-sets/nomenclature-matrix/**'
      - 'scripts/ci/validate_nomenclature_matrix.py'
      - 'tests/test_nomenclature_matrix.py'
      - '.github/workflows/nomenclature-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
# QUE fan-out guard (Owner order 2026-11-18): PR events coalesce per PR;
# every other event keeps a unique group (run_id) ⇒ ¬coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ci/validate_nomenclature_matrix.py
      - run: python -m unittest tests/test_nomenclature_matrix.py
