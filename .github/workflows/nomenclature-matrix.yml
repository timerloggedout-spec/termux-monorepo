name: Nomenclature Equivalency Matrix
on:
  push:
    paths:
      - 'docs/proposals/active/notation-sets/nomenclature-matrix/**'
      - 'scripts/ci/validate_nomenclature_matrix.py'
      - 'tests/test_nomenclature_matrix.py'
      - '.github/workflows/nomenclature-matrix.yml'
  pull_request:
    paths:
      - 'docs/proposals/active/notation-sets/nomenclature-matrix/**'
      - 'scripts/ci/validate_nomenclature_matrix.py'
      - 'tests/test_nomenclature_matrix.py'
      - '.github/workflows/nomenclature-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ci/validate_nomenclature_matrix.py
      - run: python -m unittest tests/test_nomenclature_matrix.py
