name: openrouter-free-counter-large-probe
# [MUSEai]@{role:{quota-specialist}} Amendment-3 probe: ONE paid request
# sized ~100k input tokens between bracketed reads. Manual dispatch only.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run large probe
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/ops/openrouter_free_counter_large_probe.py
      - name: Upload large probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-free-counter-large-probe-result
          path: large-probe-result.json
