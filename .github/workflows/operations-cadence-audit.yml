name: Operations Cadence Audit
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/**.yml
      - scripts/ci/operations_cadence_audit.py
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Audit workflow schedule blocks
        run: python3 scripts/ci/operations_cadence_audit.py
