name: Operator Matrix Generate

# Method of record for the Operator Matrix (issue #175): the matrix is
# a generated artifact derived from the live inventory, not a Projects
# board kept in step by per-event sync runs. This workflow regenerates
# docs/ops/generated/operator-matrix.{json,md} with
# scripts/issue_lifecycle/operator_matrix.py and opens (or updates)
# one PR from operator-matrix/auto — the registration-monikers
# pattern. No project-scoped token is used; the job's GITHUB_TOKEN
# only reads the repo's own issues/PRs/checks and writes the PR.
#
# Trigger accounting: one weekly scheduled run + manual dispatch.
# Supersedes the per-event ops-operator-matrix-project-sync method
# (495 no-op runs while its prerequisites were missing); that workflow
# is retired in a follow-up once this one has proven on schedule.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1'

concurrency:
  group: operator-matrix-generate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required: with explicit permissions, unspecified scopes are none —
  # and the issues endpoint silently returns ONLY pull requests to a
  # token without issues:read (first automated cut, run 40727258970,
  # stamped "0 issues, 96 PRs" before this was added).
  issues: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Generate matrix and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/issue_lifecycle/operator_matrix.py --fetch | tee matrix-run.txt
          if git diff --quiet -- docs/ops/generated/operator-matrix.json docs/ops/generated/operator-matrix.md; then
            echo "Matrix already current; no PR."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="operator-matrix/auto"
          git checkout -B "$branch"
          git add docs/ops/generated/operator-matrix.json docs/ops/generated/operator-matrix.md
          git commit -m "chore(ops): regenerate operator matrix"
          git push --force-with-lease origin "$branch"
          if gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "Operator matrix PR already open; branch updated in place."
          else
            gh pr create --base master --head "$branch" \
              --title "chore(ops): regenerate operator matrix" \
              --body "Automated regeneration of the Operator Matrix (docs/ops/generated/operator-matrix.{json,md}) from the live inventory by scripts/issue_lifecycle/operator_matrix.py — the #175 method of record (docs/ops/ISSUE-LIFECYCLE.md). PR classes use the #175 vocabulary from dual-gate evidence on each head; SUPERSEDE is never auto-emitted."
          fi

      - name: Merge the matrix PR when the dual gates pass
        # The workflow finishes its own loop: no human merges the
        # generated PR. Master has no branch-protection required
        # checks, so this step applies the merge rule itself:
        #   - if the dual gates report on the head, both must be
        #     green (a failure/cancel leaves the PR open);
        #   - the gate workflows are path-filtered and do NOT report
        #     at all on generated-docs-only heads (first self-merge
        #     attempt, run 40749498541: 12 polls, zero check-runs) —
        #     so after a 3-minute grace, a PR whose diff is ONLY the
        #     two generated matrix files merges on provenance (the
        #     landed generator's own output), the same basis the lane
        #     hand-merged #2055/#2057 on.
        # Transient API errors (the shared Actions rate wall) never
        # fail this step; an unsettled outcome leaves the PR open
        # with a notice and exit 0 — generation already succeeded.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head "operator-matrix/auto" --state open --json number --jq '.[0].number // empty' || echo "")
          if [ -z "$pr" ]; then
            echo "No open operator-matrix PR; nothing to merge."
            exit 0
          fi
          files=$(gh pr diff "$pr" --name-only || echo "unknown")
          echo "PR #$pr files: $files"
          generated_only=1
          while IFS= read -r f; do
            case "$f" in
              docs/ops/generated/operator-matrix.json|docs/ops/generated/operator-matrix.md) ;;
              *) generated_only=0 ;;
            esac
          done <<EOF
          $files
          EOF
          sha=$(gh pr view "$pr" --json headRefOid --jq '.headRefOid' || echo "")
          echo "Watching dual gates on PR #$pr head $sha (generated_only=$generated_only)"
          merge_pr() {
            if gh pr merge "$pr" --squash; then
              echo "PR #$pr merged by operator-matrix-generate ($1)."
            else
              echo "::notice::Merge of PR #$pr failed ($1); leaving it open."
            fi
            exit 0
          }
          for i in $(seq 1 20); do
            runs=""
            for attempt in 1 2 3; do
              runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" 2>/dev/null || echo "")
              [ -n "$runs" ] && break
              sleep 10
            done
            if [ -z "$runs" ]; then
              echo "poll $i: check-runs unavailable (API); continuing"
              sleep 30
              continue
            fi
            hygiene=$(echo "$runs" | jq -r '[.check_runs[] | select(.name == "hygiene + portability gate") | .conclusion // .status] | @csv')
            smoke=$(echo "$runs" | jq -r '[.check_runs[] | select(.name | contains("termux smoke")) | .conclusion // .status] | @csv')
            echo "poll $i: hygiene=[$hygiene] smoke=[$smoke]"
            if echo "$hygiene $smoke" | grep -qE '"(failure|cancelled|timed_out)"'; then
              echo "::notice::A dual gate failed on PR #$pr; leaving it open."
              exit 0
            fi
            if echo "$hygiene" | grep -q '"success"' && echo "$smoke" | grep -q '"success"'; then
              merge_pr "dual gates green"
            fi
            if [ -z "$hygiene" ] && [ -z "$smoke" ] && [ "$i" -ge 6 ] && [ "$generated_only" -eq 1 ]; then
              merge_pr "no gate runs report on generated-docs-only heads; provenance merge after grace"
            fi
            sleep 30
          done
          echo "::notice::Dual gates did not settle within 10 minutes on PR #$pr; leaving it open."
          exit 0
