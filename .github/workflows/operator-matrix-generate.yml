name: Operator Matrix Generate

# Method of record for the Operator Matrix (issue #175): the matrix is
# a generated artifact derived from the live inventory, not a Projects
# board kept in step by per-event sync runs. This workflow regenerates
# docs/ops/generated/operator-matrix.{json,md} with
# scripts/issue_lifecycle/operator_matrix.py and opens (or updates)
# one PR from operator-matrix/auto — the registration-monikers
# pattern. No project-scoped token is used; the job's GITHUB_TOKEN
# only reads the repo's own issues/PRs/checks and writes the PR.
#
# Trigger accounting (adaptive frequency, owner order 2026-10-28 —
# cadence follows relevance, not a fixed weekly guess):
#   - pull_request closed+merged: the inventory the matrix describes
#     just changed; regenerate then (job-level if keeps unmerged
#     closes out). The workflow's own bot merge re-fires this once —
#     a self-limiting no-op ("already current").
#   - daily schedule (06:41 UTC): the floor — bounds staleness at
#     ~24h for issue-side change (opens/closes don't fire the PR
#     trigger); a no-change run costs ~5 GraphQL calls and no PR.
#   - manual dispatch.
# Supersedes the per-event ops-operator-matrix-project-sync method
# (495 no-op runs while its prerequisites were missing); that workflow
# is retired in a follow-up once this one has proven on schedule.

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
  schedule:
    - cron: '41 6 * * *'

concurrency:
  group: operator-matrix-generate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required: with explicit permissions, unspecified scopes are none —
  # and the issues endpoint silently returns ONLY pull requests to a
  # token without issues:read (first automated cut, run 40727258970,
  # stamped "0 issues, 96 PRs" before this was added).
  issues: read

jobs:
  generate:
    # pull_request trigger fires on every close; only merges count.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Generate matrix and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/issue_lifecycle/operator_matrix.py --fetch | tee matrix-run.txt
          if git diff --quiet -- docs/ops/generated/operator-matrix.json docs/ops/generated/operator-matrix.md; then
            echo "Matrix already current; no PR."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="operator-matrix/auto"
          git checkout -B "$branch"
          git add docs/ops/generated/operator-matrix.json docs/ops/generated/operator-matrix.md
          git commit -m "chore(ops): regenerate operator matrix"
          git push --force-with-lease origin "$branch"
          if gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "Operator matrix PR already open; branch updated in place."
          else
            gh pr create --base master --head "$branch" \
              --title "chore(ops): regenerate operator matrix" \
              --body "Automated regeneration of the Operator Matrix (docs/ops/generated/operator-matrix.{json,md}) from the live inventory by scripts/issue_lifecycle/operator_matrix.py — the #175 method of record (docs/ops/ISSUE-LIFECYCLE.md). PR classes use the #175 vocabulary from dual-gate evidence on each head; SUPERSEDE is never auto-emitted."
          fi

      - name: Merge the matrix PR when the dual gates pass
        # The workflow finishes its own loop: no human merges the
        # generated PR. Rule v3 (v1/v2 died in the field: v1 polled
        # for gates that never report on generated-docs-only heads;
        # v2's polling multiplied calls into the shared Actions rate
        # wall and an unguarded jq under the runner's `bash -e`
        # killed the step):
        #   - ONE gate read (retried x3), every command guarded, the
        #     step always exits 0 — generation already succeeded.
        #   - any dual gate failed/cancelled -> leave open.
        #   - both gates green -> merge.
        #   - gates absent (path-filtered off this PR class) and the
        #     diff is only the two generated files (or the diff read
        #     itself was rate-limited — this branch is written ONLY
        #     by this workflow, two paths by construction) -> merge
        #     on provenance.
        #   - gates present but still pending -> leave open; the
        #     next scheduled run re-checks the same PR (self-healing
        #     on the weekly cadence, no polling).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head "operator-matrix/auto" --state open --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -z "$pr" ]; then
            echo "No open operator-matrix PR; nothing to merge."
            exit 0
          fi
          files=$(gh pr diff "$pr" --name-only 2>/dev/null || echo "")
          echo "PR #$pr files: ${files:-<unavailable>}"
          generated_only=1
          if [ -n "$files" ]; then
            while IFS= read -r f; do
              case "$f" in
                docs/ops/generated/operator-matrix.json|docs/ops/generated/operator-matrix.md) ;;
                *) generated_only=0 ;;
              esac
            done <<EOF
          $files
          EOF
          fi
          if [ "$generated_only" -eq 0 ]; then
            echo "::notice::PR #$pr touches non-generated files; leaving it open."
            exit 0
          fi
          sha=$(gh pr view "$pr" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "")
          runs=""
          for attempt in 1 2 3; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" 2>/dev/null || echo "")
            [ -n "$runs" ] && break
            sleep 15
          done
          if [ -z "$runs" ]; then
            echo "::notice::Check-runs unreadable for PR #$pr after retries; leaving it open for the next run."
            exit 0
          fi
          hygiene=$(echo "$runs" | jq -r '[(.check_runs // [])[] | select(.name == "hygiene + portability gate") | .conclusion // .status] | @csv' 2>/dev/null || echo "")
          smoke=$(echo "$runs" | jq -r '[(.check_runs // [])[] | select(.name | contains("termux smoke")) | .conclusion // .status] | @csv' 2>/dev/null || echo "")
          echo "PR #$pr head $sha gates: hygiene=[$hygiene] smoke=[$smoke]"
          if echo "$hygiene $smoke" | grep -qE '"(failure|cancelled|timed_out)"'; then
            echo "::notice::A dual gate failed on PR #$pr; leaving it open."
            exit 0
          fi
          if echo "$hygiene" | grep -q '"success"' && echo "$smoke" | grep -q '"success"'; then
            verdict="dual gates green"
          elif [ -z "$hygiene" ] && [ -z "$smoke" ]; then
            verdict="no gate runs on generated-docs-only head; provenance merge"
          else
            echo "::notice::Dual gates still pending on PR #$pr; the next scheduled run re-checks it."
            exit 0
          fi
          if gh pr merge "$pr" --squash 2>/dev/null; then
            echo "PR #$pr merged by operator-matrix-generate ($verdict)."
          else
            echo "::notice::Merge of PR #$pr failed ($verdict); leaving it open."
          fi
          exit 0
