name: opportunity-cycle

# Opportunity self-eval loop (#5096 / #5103): ingest -> QUE priority
# stamp -> prep gate (Stages 0-4 + submission census) -> Delphi-rubric
# selection -> Stages 5-7 -> cycle receipts. Design of record:
# docs/ops/OPPORTUNITY-CYCLE.md. Single-flight; commits land via the
# Termux Fleet Swarm App so downstream consumers trigger on the push;
# outputs commit only on change.

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "ops/challenge/coordinator.json"
      - "entries/**"
      - "scripts/opportunities/**"

permissions:
  contents: write

concurrency:
  group: opportunity-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint Swarm App token
        id: app
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e
        with:
          app-id: ${{ vars.TERMUX_FLEET_SWARM_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one opportunity cycle
        run: python3 scripts/opportunities/opportunity_cycle.py

      - name: Commit cycle outputs (only on change)
        run: |
          git config user.name "termux-fleet-swarm[bot]"
          git config user.email "termux-fleet-swarm[bot]@users.noreply.github.com"
          git add ops/opportunities ops/que/feeds/opportunity-priority.json
          if git diff --cached --quiet; then
            echo "no cycle output change this run"
          else
            git commit -m "opportunity-cycle: $(date -u +%Y-%m-%dT%H:%MZ) cycle receipts + QUE priority feed"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push rejected (attempt $attempt) — rebasing"
              git pull --rebase origin master
            done
          fi
