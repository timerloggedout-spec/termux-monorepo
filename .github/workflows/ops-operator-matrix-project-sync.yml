name: Operator Matrix Project Sync

# Option A: GitHub Actions plane (not Grok connector).
# Adds issues/PRs to the Operator Matrix Projects v2 board using a
# Project-capable token from #184 inventory (names only).
#
# Prerequisites (Operator, once):
# 1. Create user/org Project: "termux-monorepo — Operator Matrix (#175)"
# 2. Repo variable or secret PROJECT_URL =
#    https://github.com/users/timerloggedout-spec/projects/<N>
#    (or orgs/<org>/projects/<N>)
# 3. Token secret with project scope:
#    OPERATOR_GITHUB_TOKEN | OPERATOR_TOKEN | ARCHWIZ_GITHUB_TOKEN
#
# Templates referenced:
# - actions/add-to-project (GitHub-maintained)
# - github/docs automating-projects-using-actions
# - existing dependency-phase-project-sync.yml (OPERATOR_TOKEN chain)

on:
  issues:
    types: [opened, reopened, transferred, labeled]
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      seed_hub:
        description: "Also ensure hub issues/PRs are on the board (175, 184, 713, 714, 682)"
        required: false
        default: true
        type: boolean

concurrency:
  group: operator-matrix-project-sync-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || 'dispatch' }}
  cancel-in-progress: true

permissions: {}

jobs:
  add-current:
    name: Add current issue/PR to Operator Matrix
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve project URL
        id: project
        env:
          FROM_VAR: ${{ vars.OPERATOR_MATRIX_PROJECT_URL }}
          FROM_SECRET: ${{ secrets.OPERATOR_MATRIX_PROJECT_URL }}
        run: |
          set -euo pipefail
          url="${FROM_VAR:-}"
          if [ -z "$url" ]; then url="${FROM_SECRET:-}"; fi
          if [ -z "$url" ]; then
            echo "::notice::OPERATOR_MATRIX_PROJECT_URL not set — skip add-to-project (create Project + set repo variable)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Add to Project (actions/add-to-project)
        if: ${{ steps.project.outputs.skip != 'true' }}
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ steps.project.outputs.url }}
          # Plane A: Project-capable PAT/App token by secret name only (#184).
          github-token: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN }}

  seed-hub:
    name: Seed hub items (workflow_dispatch)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_hub }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN }}
      PROJECT_URL: ${{ vars.OPERATOR_MATRIX_PROJECT_URL || secrets.OPERATOR_MATRIX_PROJECT_URL }}
    steps:
      - name: Require token + project URL
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::No OPERATOR_GITHUB_TOKEN / OPERATOR_TOKEN / ARCHWIZ_GITHUB_TOKEN"
            exit 1
          fi
          if [ -z "${PROJECT_URL:-}" ]; then
            echo "::error::Set repo variable OPERATOR_MATRIX_PROJECT_URL to the Projects v2 URL"
            exit 1
          fi
          echo "Project URL: $PROJECT_URL"

      - name: Resolve project node id
        id: proj
        run: |
          set -euo pipefail
          # Accept user or org project URL forms.
          if [[ "$PROJECT_URL" =~ /users/([^/]+)/projects/([0-9]+) ]]; then
            OWNER="${BASH_REMATCH[1]}"
            NUMBER="${BASH_REMATCH[2]}"
            KIND=user
          elif [[ "$PROJECT_URL" =~ /orgs/([^/]+)/projects/([0-9]+) ]]; then
            OWNER="${BASH_REMATCH[1]}"
            NUMBER="${BASH_REMATCH[2]}"
            KIND=org
          else
            echo "::error::Unrecognized project URL: $PROJECT_URL"
            exit 1
          fi
          if [ "$KIND" = user ]; then
            QUERY='query($login:String!,$n:Int!){ user(login:$login){ projectV2(number:$n){ id title } } }'
            PROJECT_ID=$(gh api graphql -f query="$QUERY" -f login="$OWNER" -F n="$NUMBER" --jq '.data.user.projectV2.id')
            TITLE=$(gh api graphql -f query="$QUERY" -f login="$OWNER" -F n="$NUMBER" --jq '.data.user.projectV2.title')
          else
            QUERY='query($login:String!,$n:Int!){ organization(login:$login){ projectV2(number:$n){ id title } } }'
            PROJECT_ID=$(gh api graphql -f query="$QUERY" -f login="$OWNER" -F n="$NUMBER" --jq '.data.organization.projectV2.id')
            TITLE=$(gh api graphql -f query="$QUERY" -f login="$OWNER" -F n="$NUMBER" --jq '.data.organization.projectV2.title')
          fi
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = null ]; then
            echo "::error::Could not resolve project id (token missing project scope or wrong number)"
            exit 1
          fi
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved: $TITLE ($PROJECT_ID)"

      - name: Seed hub content ids
        env:
          PROJECT_ID: ${{ steps.proj.outputs.project_id }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # Hub issues + preferred extract PRs (numbers stable; node ids resolved live).
          SEED_ISSUES=(175 184)
          SEED_PRS=(713 714 682)

          add_content() {
            local content_id="$1"
            local label="$2"
            gh api graphql -f query='mutation($project:ID!,$content:ID!){
              addProjectV2ItemById(input:{projectId:$project,contentId:$content}){
                item { id }
              }
            }' -f project="$PROJECT_ID" -f content="$content_id" >/dev/null \
              && echo "OK $label" \
              || echo "::warning::Failed $label (may already be on board or ACL)"
          }

          for n in "${SEED_ISSUES[@]}"; do
            nid=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){
              repository(owner:$o,name:$r){ issue(number:$n){ id title } }
            }' -f o="$OWNER" -f r="$REPO" -F n="$n" --jq '.data.repository.issue.id // empty')
            if [ -n "$nid" ]; then add_content "$nid" "issue #$n"; else echo "::warning::Missing issue #$n"; fi
          done

          for n in "${SEED_PRS[@]}"; do
            nid=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){
              repository(owner:$o,name:$r){ pullRequest(number:$n){ id title } }
            }' -f o="$OWNER" -f r="$REPO" -F n="$n" --jq '.data.repository.pullRequest.id // empty')
            if [ -n "$nid" ]; then add_content "$nid" "PR #$n"; else echo "::warning::Missing PR #$n"; fi
          done
