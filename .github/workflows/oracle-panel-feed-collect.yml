# Oracle Panel feed refresh (contract: docs/ops/ORACLE-PANEL-FEED.md).
# Regenerates apps/tribute-dashboard/data/oracle-panel-feed.json
# from the registry, the pass records, and the outcome ledger
# (#1487), and proposes it as a refresh PR — never commits directly.
# Mirrors the reviewer-metrics-collect pattern; push triggers cover
# the source paths so a landed pass refreshes the panel promptly.
name: oracle-panel-feed-collect

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 2'
  push:
    branches: [master]
    paths:
      - 'docs/proposals/registry.yaml'
      - 'docs/proposals/passes/**'
      - 'docs/proposals/active/**'

concurrency:
  group: oracle-panel-feed-collect
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GH_TOKEN is set per step: the steps context is not available in job-level env
    # (job env referencing steps.* makes the workflow file invalid: 0 jobs, 0s failure).
    steps:
      - name: Mint Termux Fleet Swarm token (own rate bucket)
        # #5219 leg (a): this collector's API reads/writes drew the shared
        # per-repo GITHUB_TOKEN bucket (1,000/h class) exhausted on
        # 2026-11-12. The Swarm App installation token carries its own
        # 12,500 bucket. Downscoped to this workflow's declared permissions.
        id: swarm
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3
        with:
          app-id: ${{ vars.TERMUX_FLEET_SWARM_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.swarm.outputs.token }}
      - name: Collect the feed
        env:
          GH_TOKEN: ${{ steps.swarm.outputs.token }}
        run: |
          set -euo pipefail
          python3 -B scripts/delphi/oracle_panel_feed.py \
            --root . --out apps/tribute-dashboard/data/oracle-panel-feed.json
      - name: Propose the refresh as a PR
        env:
          GH_TOKEN: ${{ steps.swarm.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/tribute-dashboard/data/oracle-panel-feed.json; then
            echo "feed unchanged; no refresh PR"
            exit 0
          fi
          branch="oracle-panel-feed/refresh"
          git config user.name "oracle-panel-feed-collect"
          git config user.email "actions@github.com"
          git checkout -B "$branch"
          git add apps/tribute-dashboard/data/oracle-panel-feed.json
          git commit -m "chore(delphi): refresh oracle-panel-feed.json"
          git push -f origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore(delphi): refresh oracle-panel-feed.json" \
            --body "Automated Oracle Panel feed refresh (collector: scripts/delphi/oracle_panel_feed.py; contract: docs/ops/ORACLE-PANEL-FEED.md). Data is derived from the registry, pass records, and ledger #1487 at collection time; nothing is copied forward." \
            || echo "refresh PR already open"
