name: Peer review orchestrator

# Control plane for external PR reviewers.
#
# The orchestrator autonomously invokes each provider's documented pull-request
# command through the existing OPERATOR token lane, records a SHA-bound request,
# ingests provider responses, and releases second pass only after every required
# provider has delivered for the live PR SHA. Provider-owned checkboxes are audit
# evidence only and are never emulated through undocumented API mutations.
#
# The workflow never handles browser cookies or attempts undocumented UI/API
# requests. It runs API-only and never checks out pull-request code, including
# under pull_request_target. See docs/ops/OPERATOR_INTERACTIVE_ACTIONS.md.
#
# Bot-authored PRs: CodeRabbit does not review PRs authored by bots unless a
# review seat is assigned to the bot. The owner declined the seat assignment
# (2026-10-23) and accepted bot-authored PRs proceeding without CodeRabbit,
# so the collect step drops 'coderabbit' from the effective required set
# when the PR author is a bot. Other providers are unaffected.
#
# Reviewer JIT (docs/ops/REVIEWER-JIT-DESIGN.md): the collect step derives
# the PR's context (author class, changed-file classes, size, labels),
# records it in the state comment, and adapts the effective required set
# just-in-time: the structural bot-author rule above, plus a metrics rule
# driven by docs/ops/generated/reviewer-metrics.json (a provider with zero
# deliveries over >=10 required cycles in this cycle's context is exempted
# for the cycle). The metrics map is fail-open: missing/stale/unparsable
# disables the metrics rule only. Every adaptation is recorded in the
# state comment for audit and for the metrics collector to measure.

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  # Comment storms must not cancel an in-flight provider collect. Cancelled
  # runs were recorded as failures (runs 37247048701 / 37247242679 on #1125).
  # Include event_name so a pull_request_target collect is not superseded by
  # a later issue_comment on the same PR.
  group: peer-orch-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}-${{ github.event_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  collect-peer-responses:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request &&
        github.event.comment.user.login != 'github-actions[bot]' &&
        !contains(github.event.comment.body, 'sweep accountability receipt') &&
        (
          contains(github.event.comment.body, '@coderabbitai') ||
          contains(github.event.comment.body, '@qodo') ||
          contains(github.event.comment.body, 'devin review') ||
          contains(github.event.comment.body, 'operator-action')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read
    outputs:
      cycle_id: ${{ steps.collect.outputs.cycle_id }}
      head_sha: ${{ steps.collect.outputs.head_sha }}
      state: ${{ steps.collect.outputs.state }}
      ready: ${{ steps.collect.outputs.ready }}
      skipped: ${{ steps.collect.outputs.skipped }}
      pending: ${{ steps.collect.outputs.pending }}
      context_author_class: ${{ steps.collect.outputs.context_author_class }}
      context_primary_class: ${{ steps.collect.outputs.context_primary_class }}
      metrics_map: ${{ steps.collect.outputs.metrics_map }}
      provider_cooldowns: ${{ steps.collect.outputs.provider_cooldowns }}
    steps:
      - name: Collect controls and provider response evidence
        id: collect
        timeout-minutes: 8
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          # Comma-separated active-provider policy. CodeRabbit is the only
          # verified default integration; opt in to other providers explicitly.
          REQUIRED_PROVIDERS: ${{ vars.PEER_REQUIRED_PROVIDERS || 'coderabbit' }}
          # Pending provider evidence is advisory by default. Set this variable
          # to true only after deliberate branch-protection acceptance.
          ENFORCE_PROVIDER_COMPLETION: ${{ vars.PEER_ENFORCE_PROVIDER_COMPLETION || 'false' }}
          # State is event-driven. A run snapshots the active cycle once;
          # provider events re-enter this workflow and advance the state.
          MAX_WAIT_SEC: '1'
          POLL_SEC: '5'
          OPERATOR_EXECUTOR_LOGINS: ${{ vars.OPERATOR_EXECUTOR_LOGINS || github.repository_owner }}
          OPERATOR_ALLOWED_ACTIONS: ${{ vars.OPERATOR_ALLOWED_ACTIONS || 'coderabbit:trigger_review,qodo:trigger_review,devin:trigger_review' }}
          PEER_STATE_PUBLISHER_LOGINS: ${{ vars.PEER_STATE_PUBLISHER_LOGINS || github.repository_owner }}
        with:
          script: |
            const requiredProviders = (process.env.REQUIRED_PROVIDERS || 'coderabbit')
              .split(',').map(v => v.trim().toLowerCase()).filter(Boolean);
            const enforceProviderCompletion =
              (process.env.ENFORCE_PROVIDER_COMPLETION || 'false').toLowerCase() === 'true';
            const maxWait = Math.max(0, Number(process.env.MAX_WAIT_SEC) || 1);
            const pollSec = Math.max(5, Number(process.env.POLL_SEC) || 20);
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const operatorAckMarker = '<!-- operator-action-ack:v1 -->';
            const operatorReviewMarker = '<!-- operator-coderabbit-review:v1 -->';
            const operatorProviderReviewMarker = '<!-- operator-provider-review:v1 -->';

            const providerLogins = new Map([
              ['coderabbitai[bot]', 'coderabbit'],
              ['qodo-code-review[bot]', 'qodo'],
              ['devin-ai-integration[bot]', 'devin'],
              ['aikido-security[bot]', 'aikido'],
              ['sentry-io[bot]', 'sentry'],
              ['copilot-pull-request-reviewer[bot]', 'copilot'],
            ]);
            const providerCheckApps = new Map([
              ['coderabbit', 'coderabbit'],
              ['qodo', 'qodo'],
              ['devin', 'devin'],
              ['aikido', 'aikido'],
              ['sentry', 'sentry'],
              ['copilot', 'copilot'],
            ]);
            const executorLogins = new Set((process.env.OPERATOR_EXECUTOR_LOGINS || '')
              .split(',').map(value => value.trim().toLowerCase()).filter(Boolean));
            const allowedActions = new Set((process.env.OPERATOR_ALLOWED_ACTIONS || '')
              .split(',').map(value => value.trim().toLowerCase()).filter(Boolean));
            const statePublisherLogins = new Set((process.env.PEER_STATE_PUBLISHER_LOGINS || '')
              .split(',').map(value => value.trim().toLowerCase()).filter(Boolean));

            function providerFor(user) {
              if (user?.type !== 'Bot') return '';
              return providerLogins.get((user.login || '').toLowerCase()) || '';
            }

            function eventDetails() {
              const payload = context.payload;
              if (payload.pull_request) return { prNumber: payload.pull_request.number };
              if (payload.issue?.pull_request) return { prNumber: payload.issue.number };
              return { prNumber: null };
            }

            const { prNumber } = eventDetails();
            if (!prNumber) {
              core.setOutput('skipped', 'true');
              core.setOutput('state', 'not_a_pull_request');
              return;
            }

            let pr;
            try {
              const res = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              pr = res.data;
            } catch (error) {
              core.warning(`GitHub API request skipped due to platform limit or network error: ${error.message}`);
              core.setOutput('skipped', 'true');
              core.setOutput('state', 'api_rate_limited');
              return;
            }
            if (pr.draft || !pr.head.repo || pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info('Draft or fork PR: no interactive agent actions requested');
              core.setOutput('skipped', 'true');
              core.setOutput('state', 'out_of_scope_pr');
              return;
            }

            const authorLogin = (pr.user?.login || '').toLowerCase();
            const authorIsBot = pr.user?.type === 'Bot' || authorLogin.endsWith('[bot]');

            const headSha = pr.head.sha;
            const cycleId = `pr-${prNumber}-${headSha.slice(0, 12)}`;
            core.setOutput('cycle_id', cycleId);
            core.setOutput('head_sha', headSha);
            const parseField = (body, name) =>
              (body || '').match(new RegExp(`^${name}:\\s*(.+?)\\s*$`, 'm'))?.[1]?.trim() || '';
            const authorizedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const isAuthorizedOperatorComment = comment =>
              authorizedAssociations.has(comment?.author_association) &&
              executorLogins.has((comment?.user?.login || '').toLowerCase());
            const isCurrentProviderRequest = (comment, provider = '') => {
              const requestedProvider = parseField(comment?.body, 'provider').toLowerCase();
              return comment?.body?.includes(operatorProviderReviewMarker) &&
                isAuthorizedOperatorComment(comment) &&
                parseField(comment.body, 'cycle_id') === cycleId &&
                parseField(comment.body, 'head_sha') === headSha &&
                parseField(comment.body, 'action').toLowerCase() === 'trigger_review' &&
                allowedActions.has(`${requestedProvider}:trigger_review`) &&
                (!provider || requestedProvider === provider);
            };
            const isCurrentOperatorAcknowledgement = comment => {
              const provider = parseField(comment?.body, 'provider').toLowerCase();
              const action = parseField(comment?.body, 'action').toLowerCase();
              return comment?.body?.includes(operatorAckMarker) &&
                isAuthorizedOperatorComment(comment) &&
                parseField(comment.body, 'cycle_id') === cycleId &&
                allowedActions.has(`${provider}:${action}`);
            };
            const isCurrentOperatorReviewRequest = comment =>
              comment?.body?.includes(operatorReviewMarker) &&
              isAuthorizedOperatorComment(comment) &&
              parseField(comment.body, 'cycle_id') === cycleId &&
              /request_kind:\s*(initial|cooldown_retry)\s*$/m.test(comment.body);
            const eventComment = context.payload.comment || context.payload.review || {};
            const eventProvider = providerFor(eventComment.user);
            const relevantEvent = context.eventName === 'pull_request_target' ||
              Boolean(eventProvider) ||
              isCurrentOperatorAcknowledgement(eventComment) ||
              isCurrentOperatorReviewRequest(eventComment) ||
              isCurrentProviderRequest(eventComment);
            if (!relevantEvent) {
              core.info(`Ignoring unrelated ${context.eventName} event on PR #${prNumber}`);
              core.setOutput('skipped', 'true');
              core.setOutput('state', 'unrelated_event');
              return;
            }

            // --- Reviewer JIT: context derivation (P1) ---
            // Record the context this cycle's policy is derived from, so the
            // metrics collector (reviewer-metrics/v1) can join provider
            // performance by context. classifyFilePath MUST stay in sync
            // with classify_file in scripts/reviewer_metrics/collect.py.
            function classifyFilePath(path) {
              const base = path.split('/').pop();
              if (path.startsWith('docs/ops/generated/') || path.includes('/generated/')) return 'generated';
              if (path.startsWith('.github/workflows/')) return 'workflows';
              if (path.startsWith('docs/') || base.endsWith('.md') || base.endsWith('.rst')) return 'docs';
              if (path.startsWith('tests/') || path.includes('/tests/') || base.startsWith('test_') ||
                  base.endsWith('_test.py') || base.endsWith('.test.js') || base.endsWith('.spec.js')) return 'tests';
              const ext = base.includes('.') ? base.split('.').pop().toLowerCase() : '';
              if (['toml', 'yaml', 'yml'].includes(ext)) return 'config';
              if (['py', 'js', 'ts', 'tsx', 'jsx', 'go', 'rs', 'sh', 'bash', 'c', 'h', 'cpp', 'java', 'rb'].includes(ext)) return 'code';
              if (['json', 'jsonl', 'csv'].includes(ext)) return 'data';
              return 'other';
            }
            let filePaths = [];
            try {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber, per_page: 100,
              });
              filePaths = files.map(f => f.filename);
            } catch (error) {
              core.info(`Changed-file lookup skipped: ${error.message}`);
            }
            const classCounts = {};
            for (const p of filePaths) {
              const c = classifyFilePath(p);
              classCounts[c] = (classCounts[c] || 0) + 1;
            }
            const classNames = Object.keys(classCounts);
            let primaryClass = 'unknown';
            if (classNames.length === 1) {
              primaryClass = classNames[0];
            } else if (classNames.length > 1) {
              const top = classNames.reduce((a, b) => (classCounts[a] >= classCounts[b] ? a : b));
              primaryClass = classCounts[top] * 2 > filePaths.length ? top : 'mixed';
            }
            const contextKey = `${authorIsBot ? 'bot' : 'user'}/${primaryClass}`;
            const labelNames = (pr.labels || [])
              .map(l => (typeof l === 'string' ? l : l.name)).filter(Boolean).sort();

            // --- Reviewer JIT: metrics map (P3 input, fail-open) ---
            let metricsGeneratedAt = '';
            let metricsByContext = {};
            let metricsByAuthorClass = {};
            try {
              const { data: mapFile } = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: 'docs/ops/generated/reviewer-metrics.json',
                ref: context.payload.repository.default_branch,
              });
              const map = JSON.parse(Buffer.from(mapFile.content, 'base64').toString('utf8'));
              const ageMs = Date.now() - Date.parse(map.generated_at || '');
              if (map.schema === 'reviewer-metrics/v1' && Number.isFinite(ageMs) && ageMs >= 0 && ageMs < 14 * 24 * 3600 * 1000) {
                metricsGeneratedAt = map.generated_at;
                for (const [provider, entry] of Object.entries(map.providers || {})) {
                  metricsByContext[provider] = entry.by_context || {};
                  metricsByAuthorClass[provider] = entry.by_author_class || {};
                }
              } else {
                core.info('Reviewer metrics map stale or unknown schema; metrics rule disabled for this cycle.');
              }
            } catch (error) {
              core.info(`Reviewer metrics map unavailable (${error.message}); metrics rule disabled for this cycle.`);
            }

            // --- Reviewer JIT: effective required set (P3 rules) ---
            let effectiveProviders = [...requiredProviders];
            const exemptions = [];
            // Structural rule: CodeRabbit skips bot-authored PRs unless a
            // review seat is assigned to the bot; the owner declined seat
            // assignment (2026-10-23) and accepted bot-authored PRs
            // proceeding without CodeRabbit.
            if (authorIsBot && effectiveProviders.includes('coderabbit')) {
              effectiveProviders = effectiveProviders.filter(p => p !== 'coderabbit');
              exemptions.push({
                provider: 'coderabbit',
                state: 'not_required_bot_authored_pr',
                note: 'CodeRabbit review seat not assigned; owner decision 2026-10-23',
              });
              core.info(`Bot-authored PR (${authorLogin}): exempting coderabbit from the required provider set.`);
            }
            // Metrics rule: a provider with zero deliveries over >=10
            // required cycles in this exact context is not actually
            // reviewing this kind of PR; stop gating on it for the cycle.
            if (metricsGeneratedAt) {
              for (const provider of [...effectiveProviders]) {
                const b = metricsByContext[provider]?.[contextKey];
                if (b && (b.required_cycles || 0) >= 10 && (b.delivered || 0) === 0) {
                  effectiveProviders = effectiveProviders.filter(p => p !== provider);
                  exemptions.push({
                    provider,
                    state: 'not_required_zero_delivery_in_context',
                    note: `metrics map ${metricsGeneratedAt}: zero deliveries in context ${contextKey} over ${b.required_cycles} required cycles`,
                  });
                  core.info(`Metrics rule: exempting ${provider} in context ${contextKey} (zero deliveries over ${b.required_cycles} required cycles).`);
                }
                // Round 2: author-class rollup. Per-context keys fragment
                // author-class-wide failure modes (widened map: bot
                // contexts held 10 required cycles across 6 keys, zero
                // delivered — no single key reached the threshold).
                if (effectiveProviders.includes(provider)) {
                  const roll = metricsByAuthorClass[provider]?.[authorIsBot ? 'bot' : 'user'];
                  if (roll && (roll.required_cycles || 0) >= 10 && (roll.delivered || 0) === 0) {
                    effectiveProviders = effectiveProviders.filter(p => p !== provider);
                    exemptions.push({
                      provider,
                      state: 'not_required_zero_delivery_in_context',
                      note: `metrics map ${metricsGeneratedAt}: zero deliveries in author-class rollup ${authorIsBot ? 'bot' : 'user'}/* over ${roll.required_cycles} required cycles`,
                    });
                    core.info(`Metrics rule (rollup): exempting ${provider} for author class ${authorIsBot ? 'bot' : 'user'} (zero deliveries over ${roll.required_cycles} required cycles).`);
                  }
                }
              }
            }

            const stateMarker = '<!-- agent-peer-response-state:v2 -->';
            let initialComments = [];
            try {
              initialComments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100,
              });
            } catch (error) {
              core.warning(`Initial comments lookup skipped: ${error.message}`);
            }
            const existingCycle = initialComments.filter(comment =>
              statePublisherLogins.has((comment.user?.login || '').toLowerCase()) &&
              comment.body?.includes(stateMarker) &&
              parseField(comment.body, 'cycle_id') === cycleId &&
              parseField(comment.body, 'head_sha') === headSha
            ).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];
            const eventTimestamp = context.payload.pull_request?.updated_at ||
              context.payload.comment?.created_at ||
              context.payload.review?.submitted_at ||
              context.payload.review?.created_at || '';
            const initialEventTime = Date.parse(eventTimestamp);
            const recordedCycleStart = Date.parse(parseField(existingCycle?.body, 'cycle_started_at'));
            const cycleStartedAt = Number.isFinite(recordedCycleStart)
              ? recordedCycleStart
              : (Number.isFinite(initialEventTime) ? initialEventTime : Date.now());
            const cycleStartedAtIso = new Date(cycleStartedAt).toISOString();

            async function fetchEvidence() {
              let comments = [], reviews = [], reviewComments = [], checks = [];
              try {
                comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  per_page: 100,
                });
                reviews = await github.paginate(github.rest.pulls.listReviews, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  per_page: 100,
                });
                reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  per_page: 100,
                });
                const response = await github.rest.checks.listForRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: headSha, per_page: 100,
                });
                checks = response.data.check_runs || [];
              } catch (error) {
                core.warning(`Evidence lookup interrupted: ${error.message}`);
              }
              return { comments, reviews, reviewComments, checks };
            }

            function controlEntries(comments) {
              const controls = [];
              for (const comment of comments) {
                const provider = providerFor(comment.user);
                if (!provider) continue;
                const matcher = /-\s*\[([ xX])\]\s*<!--\s*\{[^}]*"checkboxId"\s*:\s*"([^"]+)"[^}]*\}\s*-->/g;
                let match;
                while ((match = matcher.exec(comment.body || '')) !== null) {
                  controls.push({
                    provider,
                    checkboxId: match[2],
                    selected: match[1].toLowerCase() === 'x',
                    updatedAt: comment.updated_at || comment.created_at || '',
                    commentId: comment.id,
                    url: comment.html_url,
                  });
                }
              }
              return controls;
            }

            function acknowledgedControls(comments, controls) {
              const acknowledged = new Set();
              for (const comment of comments) {
                if (!isCurrentOperatorAcknowledgement(comment)) continue;
                if (Date.parse(comment.created_at || '') < cycleStartedAt) continue;
                const acknowledgement = {
                  provider: parseField(comment.body, 'provider').toLowerCase(),
                  controlId: parseField(comment.body, 'control_id'),
                  action: parseField(comment.body, 'action').toLowerCase(),
                };
                const control = controls.find(candidate =>
                  candidate.provider === acknowledgement.provider &&
                  candidate.checkboxId === acknowledgement.controlId
                );
                if (control) acknowledged.add(`${control.provider}:${control.checkboxId}`);
              }
              return acknowledged;
            }

            function operatorReviewRequested(comments) {
              return comments.some(comment =>
                isCurrentOperatorReviewRequest(comment) &&
                Date.parse(comment.created_at || '') >= cycleStartedAt
              );
            }

            function supportedProviderRequest(comments, provider) {
              return comments.some(comment =>
                isCurrentProviderRequest(comment, provider) &&
                Date.parse(comment.created_at || '') >= cycleStartedAt
              );
            }

            const codeRabbitCooldownPattern = /review limit reached|review rate limited|action not completed|couldn[’']t start this review|next (?:included )?review (?:will be )?available in/i;

            function isNonReviewProviderNotice(body) {
              const value = body || '';
              const checkboxTrigger = /checkboxId[\s\S]{0,500}Trigger review/i.test(value);
              const automaticReviewNotice = /does not receive automatic reviews/i.test(value);
              return checkboxTrigger || automaticReviewNotice || codeRabbitCooldownPattern.test(value);
            }

            function cooldownNotice(provider, evidence) {
              if (provider !== 'coderabbit') return { active: false, url: '', detail: '', until: '' };
              // CodeRabbit may issue the cooldown as an issue comment, inline review
              // comment, or a pull-request review body. Review-bound evidence must
              // correspond to the active head; issue comments have no commit_id.
              const sourceItems = [...evidence.comments, ...evidence.reviewComments, ...evidence.reviews];
              const notice = sourceItems.find(item =>
                providerFor(item.user) === provider &&
                (!item.commit_id || item.commit_id === headSha) &&
                Date.parse(item.created_at || item.submitted_at || '') >= cycleStartedAt &&
                codeRabbitCooldownPattern.test(item.body || '')
              );
              if (!notice) return { active: false, url: '', detail: '', until: '' };
              const retry = (notice.body || '').match(/next (?:included )?review (?:will be )?available in:?\s*\**\s*(\d+\s*(?:minutes?|hours?))\**/i)?.[1]?.trim() || 'provider cooldown';
              // JIT round 2 (cooldown-aware triggering): turn the stated
              // retry duration into an absolute window end, so the OPERATOR
              // request step can defer requests that would land inside a
              // known-dead window instead of spending trigger attempts.
              const noticeAt = Date.parse(notice.created_at || notice.submitted_at || '');
              const duration = retry.match(/(\d+)\s*(minutes?|hours?)/i);
              let until = '';
              if (duration && Number.isFinite(noticeAt)) {
                const ms = Number(duration[1]) * (duration[2].toLowerCase().startsWith('hour') ? 3600000 : 60000);
                until = new Date(noticeAt + ms).toISOString();
              }
              return { active: true, url: notice.html_url || notice.url || '', detail: retry, until };
            }

            function deliveredProvider(provider, evidence) {
              const createdDuringCycle = item => Date.parse(item.created_at || item.submitted_at || '') >= cycleStartedAt;
              // Issue comments are not bound to a commit. They may describe an older
              // head after a new push, so they are status-only and never completion evidence.
              const reviewComment = evidence.reviewComments.find(item =>
                providerFor(item.user) === provider &&
                item.commit_id === headSha && createdDuringCycle(item) && !isNonReviewProviderNotice(item.body)
              );
              if (reviewComment) {
                return { delivered: true, url: reviewComment.html_url || reviewComment.url || '', via: 'review_comment' };
              }

              const review = evidence.reviews.find(item =>
                providerFor(item.user) === provider &&
                item.commit_id === headSha && createdDuringCycle(item) && !isNonReviewProviderNotice(item.body)
              );
              if (review) return { delivered: true, url: review.html_url || review.url || '', via: 'review' };

              const check = evidence.checks.find(item =>
                item.status === 'completed' &&
                item.conclusion === 'success' &&
                Date.parse(item.started_at || item.completed_at || '') >= cycleStartedAt &&
                (item.app?.slug || '').toLowerCase() === providerCheckApps.get(provider)
              );
              if (check) return { delivered: true, url: check.html_url || check.details_url || '', via: 'check' };
              return { delivered: false, url: '', via: '' };
            }

            const began = Date.now();
            let finalState = null;
            while (Date.now() - began <= maxWait * 1000) {
              const evidence = await fetchEvidence();
              const controls = controlEntries(evidence.comments);
              const acknowledgements = acknowledgedControls(evidence.comments, controls);
              const codeRabbitCommandRequested = operatorReviewRequested(evidence.comments);
              const providerStates = effectiveProviders.map(provider => {
                const providerControls = controls.filter(control => control.provider === provider);
                const delivered = deliveredProvider(provider, evidence);
                const cooldown = cooldownNotice(provider, evidence);
                // An [x] checkbox edit made during this active cycle is evidence that
                // the provider UI action occurred. A stale [x] never carries forward.
                const selectedForCycle = providerControls.some(control =>
                  control.selected && Date.parse(control.updatedAt || '') >= cycleStartedAt
                );
                const providerCommandRequested = supportedProviderRequest(evidence.comments, provider);
                const acknowledged = selectedForCycle || providerControls.some(control =>
                  acknowledgements.has(`${control.provider}:${control.checkboxId}`)
                ) || providerCommandRequested || (provider === 'coderabbit' && codeRabbitCommandRequested);
                let state = 'awaiting_provider_response';
                if (providerControls.length && !acknowledged) state = 'pending_operator_action';
                if (acknowledged) state = 'action_acknowledged';
                if (cooldown.active) state = 'provider_cooldown';
                // A control-bearing provider may expose a completed informational
                // check before its interactive action is selected. Do not accept
                // that check/comment as completion until the control is acknowledged.
                if (delivered.delivered && (!providerControls.length || acknowledged)) {
                  state = 'provider_completed';
                }
                return { provider, state, delivered, cooldown, controls: providerControls, providerCommandRequested };
              });
              const complete = providerStates.every(item => item.state === 'provider_completed');
              finalState = { providerStates, complete };
              if (complete || Date.now() - began + pollSec * 1000 > maxWait * 1000) break;
              const pending = providerStates.map(item => `${item.provider}:${item.state}`).join(', ');
              core.info(`Waiting for SHA-bound peer evidence (${pending})`);
              await sleep(pollSec * 1000);
            }

            const { providerStates, complete } = finalState;
            const state = complete ? 'responses_collected' :
              providerStates.some(item => item.state === 'pending_operator_action') ? 'pending_operator_action' :
              providerStates.some(item => item.state === 'provider_cooldown') ? 'provider_cooldown' :
              'awaiting_provider_response';
            const pending = providerStates.filter(item => item.state !== 'provider_completed')
              .map(item => `${item.provider}:${item.state}`).join(', ') || 'none';
            const operatorControls = providerStates.flatMap(item => item.controls.map(control =>
              `- ${item.provider}: control_id=${control.checkboxId}; source=${control.url}; selected=${control.selected}; updated_at=${control.updatedAt}`
            ));
            const deliveryLines = providerStates.map(item =>
              `- ${item.provider}: ${item.state}${item.delivered.url ? `; evidence=${item.delivered.url}` : ''}${item.cooldown?.active ? `; cooldown=${item.cooldown.detail}; source=${item.cooldown.url}` : ''}${item.cooldown?.until ? `; cooldown_until=${item.cooldown.until}` : ''}`
            );
            for (const exemption of exemptions) {
              deliveryLines.push(`- ${exemption.provider}: ${exemption.state} (${exemption.note})`);
            }

            core.setOutput('skipped', 'false');
            core.setOutput('state', state);
            core.setOutput('ready', complete ? 'true' : 'false');
            core.setOutput('pending', pending);
            core.setOutput('required_providers', effectiveProviders.join(',') || 'none');
            core.setOutput('required_providers_effective', effectiveProviders.join(','));
            core.setOutput('context_author', authorLogin);
            core.setOutput('context_author_class', authorIsBot ? 'bot' : 'user');
            core.setOutput('context_primary_class', primaryClass);
            core.setOutput('context_classes', classNames.map(c => `${c}:${classCounts[c]}`).join(',') || 'none');
            core.setOutput('context_size', `files=${pr.changed_files ?? 0},additions=${pr.additions ?? 0},deletions=${pr.deletions ?? 0}`);
            core.setOutput('context_labels', labelNames.join(',') || 'none');
            core.setOutput('metrics_map', metricsGeneratedAt || 'unavailable');
            core.setOutput('enforce_provider_completion', enforceProviderCompletion ? 'true' : 'false');
            core.setOutput('cycle_started_at', cycleStartedAtIso);
            core.setOutput('provider_cooldowns', providerStates
              .filter(item => item.cooldown?.active && item.cooldown.until)
              .map(item => `${item.provider}=${item.cooldown.until}`).join(','));
            core.setOutput('provider_lines', deliveryLines.join('\n'));
            core.setOutput('control_lines', operatorControls.join('\n') || '- none observed');

      - name: Resolve authorized state publisher
        id: publisher-token
        if: steps.collect.outputs.skipped != 'true'
        env:
          ARCHWIZ_GITHUB_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN }}
          OPERATOR_GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
        run: |
          if [ -n "$ARCHWIZ_GITHUB_TOKEN" ] || [ -n "$OPERATOR_GITHUB_TOKEN" ] || [ -n "$OPERATOR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Operator token required::Set ARCHWIZ_GITHUB_TOKEN, OPERATOR_GITHUB_TOKEN, or OPERATOR_TOKEN with write permission to publish authenticated peer-gate state."
            exit 1
          fi

      - name: Publish SHA-bound peer response state
        if: |
          steps.collect.outputs.skipped != 'true' &&
          steps.publisher-token.outputs.available == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          CYCLE_ID: ${{ steps.collect.outputs.cycle_id }}
          HEAD_SHA: ${{ steps.collect.outputs.head_sha }}
          STATE: ${{ steps.collect.outputs.state }}
          READY: ${{ steps.collect.outputs.ready }}
          PENDING: ${{ steps.collect.outputs.pending }}
          CYCLE_STARTED_AT: ${{ steps.collect.outputs.cycle_started_at }}
          PROVIDERS: ${{ steps.collect.outputs.provider_lines }}
          CONTROLS: ${{ steps.collect.outputs.control_lines }}
          REQUIRED_PROVIDERS: ${{ steps.collect.outputs.required_providers || vars.PEER_REQUIRED_PROVIDERS || 'coderabbit' }}
          ENFORCE_PROVIDER_COMPLETION: ${{ steps.collect.outputs.enforce_provider_completion }}
          CONTEXT_AUTHOR: ${{ steps.collect.outputs.context_author }}
          CONTEXT_AUTHOR_CLASS: ${{ steps.collect.outputs.context_author_class }}
          CONTEXT_PRIMARY_CLASS: ${{ steps.collect.outputs.context_primary_class }}
          CONTEXT_CLASSES: ${{ steps.collect.outputs.context_classes }}
          CONTEXT_SIZE: ${{ steps.collect.outputs.context_size }}
          CONTEXT_LABELS: ${{ steps.collect.outputs.context_labels }}
          METRICS_MAP: ${{ steps.collect.outputs.metrics_map }}
          PEER_STATE_PUBLISHER_LOGINS: ${{ vars.PEER_STATE_PUBLISHER_LOGINS || github.repository_owner }}
        with:
          # The base-repository workflow never executes PR code. Prefer an existing
          # full-scope Operator token for idempotent state comments when the
          # repository's default Actions token is limited to read-only access.
          github-token: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || github.token }}
          script: |
            const marker = '<!-- agent-peer-response-state:v2 -->';
            const statePublisherLogins = new Set((process.env.PEER_STATE_PUBLISHER_LOGINS || '')
              .split(',').map(value => value.trim().toLowerCase()).filter(Boolean));
            const prNumber = Number(context.payload.pull_request?.number || context.payload.issue?.number);
            if (!prNumber) return;
            const body = [
              marker,
              `cycle_id: ${process.env.CYCLE_ID}`,
              `head_sha: ${process.env.HEAD_SHA}`,
              `cycle_started_at: ${process.env.CYCLE_STARTED_AT}`,
              `state: ${process.env.STATE}`,
              `ready: ${process.env.READY}`,
              `required_providers: ${process.env.REQUIRED_PROVIDERS}`,
              `enforce_provider_completion: ${process.env.ENFORCE_PROVIDER_COMPLETION}`,
              `context_author: ${process.env.CONTEXT_AUTHOR}`,
              `context_author_class: ${process.env.CONTEXT_AUTHOR_CLASS}`,
              `context_primary_class: ${process.env.CONTEXT_PRIMARY_CLASS}`,
              `context_classes: ${process.env.CONTEXT_CLASSES}`,
              `context_size: ${process.env.CONTEXT_SIZE}`,
              `context_labels: ${process.env.CONTEXT_LABELS}`,
              `metrics_map: ${process.env.METRICS_MAP}`,
              '',
              '### Agent peer response gate',
              '',
              '**Provider state:**',
              process.env.PROVIDERS || '- none',
              '',
              '**Pending:**',
              process.env.PENDING || 'none',
              '',
              '**Authorized interactive controls:**',
              process.env.CONTROLS || '- none observed',
              '',
              'A provider-owned checkbox/button requires an authorized Operator Action Executor.',
              'Do not copy control markup into a relay comment. After a permitted UI action, post:',
              '```text',
              '<!-- operator-action-ack:v1 -->',
              `cycle_id: ${process.env.CYCLE_ID}`,
              'provider: <provider>',
              'control_id: <provider-control-id>',
              'action: <allowed-action>',
              '```',
              'The second-pass reviewer remains blocked until matching provider completion evidence is ingested for this SHA.',
              'A checked [x] control means the provider UI action occurred; it is not a completed review.',
              'A provider cooldown is also non-completing: wait for the stated retry window, then retrigger through the authorized provider path.',
              'Pending provider evidence is advisory unless PEER_ENFORCE_PROVIDER_COMPLETION is deliberately set to true for branch protection.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.filter(comment =>
              statePublisherLogins.has((comment.user?.login || '').toLowerCase()) &&
              comment.body?.includes(marker) &&
              comment.body.includes(`cycle_id: ${process.env.CYCLE_ID}`) &&
              comment.body.includes(`head_sha: ${process.env.HEAD_SHA}`)
            ).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body,
              });
            }

      - name: Dispatch verified second pass
        if: |
          steps.collect.outputs.skipped != 'true' &&
          steps.collect.outputs.state == 'responses_collected' &&
          steps.collect.outputs.ready == 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.publisher-token.outputs.available == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ steps.collect.outputs.head_sha }}
          CYCLE_ID: ${{ steps.collect.outputs.cycle_id }}
        with:
          # Keep dispatch authority aligned with the state publisher above.
          github-token: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || github.token }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!prNumber) return;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'gemini-after-peers.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                pr_number: String(prNumber),
                head_sha: process.env.HEAD_SHA,
                cycle_id: process.env.CYCLE_ID,
              },
            });
            core.info(`Dispatched verified second pass for ${process.env.CYCLE_ID}`);

      - name: Request supported provider reviews through OPERATOR
        if: |
          steps.collect.outputs.skipped != 'true' &&
          steps.collect.outputs.ready != 'true' &&
          steps.publisher-token.outputs.available == 'true'
        timeout-minutes: 5
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          CYCLE_ID: ${{ steps.collect.outputs.cycle_id }}
          HEAD_SHA: ${{ steps.collect.outputs.head_sha }}
          REQUIRED_PROVIDERS: ${{ steps.collect.outputs.required_providers_effective }}
          PROVIDER_COOLDOWNS: ${{ steps.collect.outputs.provider_cooldowns }}
          OPERATOR_ALLOWED_ACTIONS: ${{ vars.OPERATOR_ALLOWED_ACTIONS || 'coderabbit:trigger_review,qodo:trigger_review,devin:trigger_review' }}
          OPERATOR_EXECUTOR_LOGINS: ${{ vars.OPERATOR_EXECUTOR_LOGINS || github.repository_owner }}
        with:
          github-token: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const cycleId = process.env.CYCLE_ID;
            const headSha = process.env.HEAD_SHA;
            if (!prNumber || !cycleId || !headSha) return;
            const marker = '<!-- operator-provider-review:v1 -->';
            const providers = (process.env.REQUIRED_PROVIDERS || '')
              .split(',').map(value => value.trim().toLowerCase()).filter(Boolean);
            const allowed = new Set((process.env.OPERATOR_ALLOWED_ACTIONS || '')
              .split(',').map(value => value.trim().toLowerCase()).filter(Boolean));
            const executorLogins = new Set((process.env.OPERATOR_EXECUTOR_LOGINS || '')
              .split(',').map(value => value.trim().toLowerCase()).filter(Boolean));
            const authorizedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const parseField = (body, name) =>
              (body || '').match(new RegExp(`^${name}:\\s*(.+?)\\s*$`, 'm'))?.[1]?.trim() || '';
            const commands = new Map([
              ['coderabbit', '@coderabbitai full review'],
              ['qodo', '/agentic_review'],
              ['devin', '/devin review'],
            ]);
            // JIT round 2: cooldown windows recorded by the collect step
            // (provider=ISO pairs). A request inside a known window is
            // deferred, not spent; the next cycle event after the window
            // ends re-evaluates from fresh evidence.
            const cooldownWindows = new Map((process.env.PROVIDER_COOLDOWNS || '')
              .split(',').map(pair => pair.trim()).filter(Boolean)
              .map(pair => { const i = pair.indexOf('='); return [pair.slice(0, i), pair.slice(i + 1)]; }));
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100,
            });
            for (const provider of providers) {
              const command = commands.get(provider);
              if (!command) {
                core.info(`${provider}: no documented GitHub command is configured; leaving the provider pending.`);
                continue;
              }
              if (!allowed.has(`${provider}:trigger_review`)) {
                core.info(`${provider}: trigger_review is not in OPERATOR_ALLOWED_ACTIONS; leaving the provider pending.`);
                continue;
              }
              const requested = comments.some(comment =>
                comment.body?.includes(marker) &&
                authorizedAssociations.has(comment.author_association) &&
                executorLogins.has((comment.user?.login || '').toLowerCase()) &&
                parseField(comment.body, 'cycle_id') === cycleId &&
                parseField(comment.body, 'head_sha') === headSha &&
                parseField(comment.body, 'provider').toLowerCase() === provider &&
                parseField(comment.body, 'action').toLowerCase() === 'trigger_review'
              );
              if (requested) {
                core.info(`${provider}: review already requested for ${cycleId}`);
                continue;
              }
              const cooldownUntil = cooldownWindows.get(provider);
              if (cooldownUntil && Date.parse(cooldownUntil) > Date.now()) {
                core.info(`${provider}: deferring review request; recorded cooldown window runs until ${cooldownUntil}.`);
                continue;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: [
                  command,
                  '',
                  marker,
                  `cycle_id: ${cycleId}`,
                  `head_sha: ${headSha}`,
                  `provider: ${provider}`,
                  'action: trigger_review',
                  'request_actor: OPERATOR',
                  '',
                  'Autonomous OPERATOR-token request for a current-SHA provider review. A command request is not review completion; await provider evidence.',
                ].join('\n'),
              });
              core.info(`${provider}: requested review for ${cycleId}`);
              await new Promise(resolve => setTimeout(resolve, 1200));
            }

      - name: Record pending provider review policy
        if: |
          steps.collect.outputs.skipped != 'true' &&
          steps.collect.outputs.ready != 'true'
        env:
          CYCLE_ID: ${{ steps.collect.outputs.cycle_id }}
          PENDING: ${{ steps.collect.outputs.pending }}
          ENFORCE_PROVIDER_COMPLETION: ${{ steps.collect.outputs.enforce_provider_completion }}
        run: |
          if [ "$ENFORCE_PROVIDER_COMPLETION" = "true" ]; then
            echo "::error title=Required provider review pending::${CYCLE_ID}: ${PENDING}"
            echo "Current-SHA completion is explicitly enforced by PEER_ENFORCE_PROVIDER_COMPLETION."
            exit 1
          fi
          echo "::notice title=Provider review pending (advisory)::${CYCLE_ID}: ${PENDING}"
          echo "The SHA-bound provider state is published for review; enforcement requires deliberate repository-variable opt-in."
