name: Phantom secrets audit

# Repeatable form of docs/ops/PHANTOM-SECRETS-AUDIT.md: compares every
# secrets.* reference in .github/workflows against the repo's live
# provisioned inventory (names only — the API never returns values) and
# classifies each phantom reference (scripts/secrets_audit/audit.py):
# case-variant repoints and dead fallback-branch retirements are opened
# as remediation PRs; everything else lands in the remediation document
# (docs/ops/PHANTOM-SECRET-REMEDIATION.md) as the owner's explicit
# provisioning checklist. No secret name is ever invented.
#
# Trigger accounting: one weekly scheduled run, manual dispatch, plus a
# marker-gated issue-comment wake (issue #184 credential/ops ledger
# lane; bot-authored comments trigger it — operator-wake precedent).
# 2026-10-25: the issue_comment marker gate skipped every run observed
# in production (runs #12-#86); the operator-wake duty
# `audit-phantom-secrets` (workflow_dispatch, proven lane) is the
# reliable bot-facing trigger. The marker gate is kept, aligned to the
# proven operator-wake condition form, but the wake duty is primary.
# Every run posts a names-only audit report comment on issue #184 so
# the ledger thread sees the current phantom state and opened PRs.
# 2026-10-25: the remediation/doc steps push with the full operator PAT
# chain (ARCHWIZ_GITHUB_TOKEN first) — a bare OPERATOR_GITHUB_TOKEN
# checkout rejected the secrets-remediation/doc branch push (run
# 40174074768 failed in the doc step). The ledger comment posts on
# every run (if: always()) so #184 sees phantom state even when a
# remediation step fails.
# The scan fails closed if the provisioned inventory cannot be read
# (an empty inventory would make every reference look phantom), which
# is why the operator token — not the workflow token — runs the scan:
# listing secret names requires it.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = audit + remediation PRs + doc; audit-only = report artifact only'
        required: false
        default: 'full'
        type: choice
        options: [full, audit-only]
  issue_comment:
    types: [created]
  schedule:
    - cron: '23 6 * * 3'

concurrency:
  group: phantom-secrets-audit
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body || '', '<!-- request-phantom-secrets-audit -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          # Run 40174595002: branch pushes from a shallow (depth-1) checkout
          # are rejected by the remote ("shallow update not allowed"); the
          # remediation and doc steps both push, so this needs full history
          # (same as docs-branch-index / sweep-accountability / automation-docs).
          token: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Scan workflows against the live provisioned inventory
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
        run: |
          python3 scripts/secrets_audit/audit.py scan \
            --repo "${{ github.repository }}" \
            --out phantom-report.json
          python3 -c "
          import json
          s = json.load(open('phantom-report.json'))['summary']
          print('phantom names:', s['phantom_names'], '| references:', s['references'], '| by class:', s['by_class'])"

      - name: Upload audit report artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-secrets-report
          path: phantom-report.json
          retention-days: 30

      - name: Open remediation PRs for the mechanical fix classes
        if: inputs.mode != 'audit-only'
        env:
          GH_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo '{}' > pr-numbers.json
          for class in case-variant dead-branch; do
            git checkout -f master
            python3 scripts/secrets_audit/audit.py apply \
              --class "$class" --report phantom-report.json > "apply-$class.json"
            if git diff --quiet -- .github/workflows; then
              echo "class $class: no changes"
              continue
            fi
            branch="secrets-remediation/$class"
            git checkout -B "$branch"
            git add .github/workflows
            git commit -m "fix(secrets): phantom-secret remediation ($class)"
            git push --force-with-lease origin "$branch"
            number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
            if [ -z "$number" ]; then
              url=$(gh pr create --base master --head "$branch" \
                --title "fix(secrets): phantom-secret remediation ($class)" \
                --body "Automated remediation opened by the phantom-secrets-audit workflow. Class: $class — see docs/ops/PHANTOM-SECRET-REMEDIATION.md (regenerated in the same run) for the per-reference map. Every change is one of: a case-variant repointed at the provisioned name, or a dead fallback branch retired from a chain that already resolves to a provisioned secret. Behavior-preserving; no secret name was invented.")
              number="${url##*/}"
            fi
            echo "class $class: PR #$number"
            python3 -c "
          import json
          d = json.load(open('pr-numbers.json')); d['$class'] = int('$number')
          json.dump(d, open('pr-numbers.json', 'w'))"
            git checkout -f master
          done

      - name: Regenerate the remediation document
        if: inputs.mode != 'audit-only'
        env:
          GH_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -f master
          [ -f pr-numbers.json ] || echo '{}' > pr-numbers.json
          branch="secrets-remediation/doc"
          git checkout -B "$branch"
          python3 scripts/secrets_audit/audit.py render \
            --report phantom-report.json --pr-numbers pr-numbers.json \
            --out docs/ops/PHANTOM-SECRET-REMEDIATION.md
          git add docs/ops/PHANTOM-SECRET-REMEDIATION.md
          if git diff --cached --quiet; then
            echo "Remediation document unchanged."
            exit 0
          fi
          git commit -m "docs(secrets): regenerate phantom-secret remediation map"
          git push --force-with-lease origin "$branch"
          if gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "Remediation doc PR already open; branch updated in place."
          else
            gh pr create --base master --head "$branch" \
              --title "docs(secrets): phantom-secret remediation map + provisioning checklist" \
              --body "Automated regeneration by the phantom-secrets-audit workflow. Every phantom secret reference in the repo's workflows appears here with its disposition: repointed (case variant), retired (dead fallback branch), or an explicit owner provisioning item. Names only; no values."
          fi

      - name: Post audit ledger comment on #184
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          s = json.load(open('phantom-report.json'))['summary']
          prs = {}
          try:
              prs = json.load(open('pr-numbers.json'))
          except Exception:
              pass
          def fmt(cls):
              n = prs.get(cls)
              return f"#{n}" if n else "none"
          lines = [
              "### Phantom secrets audit report",
              "- phantom names: {} across {} references".format(s['phantom_names'], s['references']),
              "- by class: " + ", ".join("{}={}".format(k, v) for k, v in sorted(s['by_class'].items())),
              "- remediation PRs: case-variant {}, dead-branch {}".format(fmt('case-variant'), fmt('dead-branch')),
              "- owner provisioning checklist: docs/ops/PHANTOM-SECRET-REMEDIATION.md (names only; no values)",
              "<!-- meta:gha phantom-secrets-audit run={} -->".format(os.environ.get('GITHUB_RUN_ID', '')),
          ]
          body = "\n".join(lines)
          subprocess.run([
              "gh", "api", "--method", "POST",
              "repos/{}/issues/184/comments".format(os.environ['GITHUB_REPOSITORY']),
              "-f", "body=" + body,
          ], check=True)
          EOF
# 