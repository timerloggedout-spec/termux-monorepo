name: PR Change Effectiveness Ledger

# Trusted control-plane telemetry. It inspects Git objects as data and never
# executes pull-request source, tests, build scripts, or dependencies.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional PR number to inspect'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-change-effectiveness-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted control-plane
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Measure complete PR change history
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PR_NUMBER}" ]]; then
            echo 'PR number is required.' >&2
            exit 1
          fi

          # Fetch PR objects only. Nothing from the PR is executed.
          git fetch --no-tags --prune origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}"
          read -r BASE_SHA HEAD_SHA < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.base.sha, .head.sha] | @tsv')
          # API head can move between fetch and measure (sweep receipt). Refetch once.
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head" "$BASE_SHA" || true
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "receipt race: base=${BASE_SHA} head=${HEAD_SHA} not in fetched objects; skipping measure" >&2
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          mapfile -t COMMITS < <(git rev-list --reverse "$MERGE_BASE..$HEAD_SHA")
          COMMIT_COUNT=${#COMMITS[@]}
          EMPTY_COUNT=0
          EFFECTIVE_COUNT=0
          GROSS_ADD=0
          GROSS_DEL=0
          EMPTY_LIST=()

          for sha in "${COMMITS[@]}"; do
            parent="$(git rev-parse "${sha}^" 2>/dev/null || true)"
            if [[ -n "$parent" ]]; then
              read -r add del files < <(git diff --numstat "$parent" "$sha" | awk '
                BEGIN {a=0;d=0;f=0}
                { if ($1 ~ /^[0-9]+$/) a += $1; if ($2 ~ /^[0-9]+$/) d += $2; f++ }
                END {print a,d,f+0}')
            else
              read -r add del files < <(git diff --numstat --root "$sha" | awk '
                BEGIN {a=0;d=0;f=0}
                { if ($1 ~ /^[0-9]+$/) a += $1; if ($2 ~ /^[0-9]+$/) d += $2; f++ }
                END {print a,d,f+0}')
            fi
            if [[ "$files" -eq 0 ]]; then
              EMPTY_COUNT=$((EMPTY_COUNT + 1))
              EMPTY_LIST+=("$sha")
            else
              EFFECTIVE_COUNT=$((EFFECTIVE_COUNT + 1))
              GROSS_ADD=$((GROSS_ADD + add))
              GROSS_DEL=$((GROSS_DEL + del))
            fi
          done

          read -r FINAL_ADD FINAL_DEL FINAL_FILES < <(git diff --numstat "$BASE_SHA" "$HEAD_SHA" | awk '
            BEGIN {a=0;d=0;f=0}
            { if ($1 ~ /^[0-9]+$/) a += $1; if ($2 ~ /^[0-9]+$/) d += $2; f++ }
            END {print a,d,f+0}')
          # Unique patch vs merge-base. Tip-to-tip can be empty when base already
          # contains an equivalent tree (run 37166124171: ahead 1 / behind 1, gross 27, final 0).
          read -r UNIQUE_ADD UNIQUE_DEL UNIQUE_FILES < <(git diff --numstat "$MERGE_BASE" "$HEAD_SHA" | awk '
            BEGIN {a=0;d=0;f=0}
            { if ($1 ~ /^[0-9]+$/) a += $1; if ($2 ~ /^[0-9]+$/) d += $2; f++ }
            END {print a,d,f+0}')

          AHEAD=$(git rev-list --count "$BASE_SHA..$HEAD_SHA")
          BEHIND=$(git rev-list --count "$HEAD_SHA..$BASE_SHA")
          CHURN=$((GROSS_ADD + GROSS_DEL))
          NET_DELTA=$((FINAL_ADD + FINAL_DEL))
          if [[ "$COMMIT_COUNT" -gt 0 ]]; then NOOP_PCT=$((EMPTY_COUNT * 100 / COMMIT_COUNT)); else NOOP_PCT=0; fi
          if [[ "$CHURN" -gt 0 ]]; then REALIZATION_PCT=$((NET_DELTA * 100 / CHURN)); else REALIZATION_PCT=0; fi

          {
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
            echo "merge_base=$MERGE_BASE"
            echo "commit_count=$COMMIT_COUNT"
            echo "empty_commit_count=$EMPTY_COUNT"
            echo "effective_commit_count=$EFFECTIVE_COUNT"
            echo "gross_additions=$GROSS_ADD"
            echo "gross_deletions=$GROSS_DEL"
            echo "final_additions=$FINAL_ADD"
            echo "final_deletions=$FINAL_DEL"
            echo "final_changed_files=$FINAL_FILES"
            echo "unique_additions=$UNIQUE_ADD"
            echo "unique_deletions=$UNIQUE_DEL"
            echo "unique_changed_files=$UNIQUE_FILES"
            echo "ahead=$AHEAD"
            echo "behind=$BEHIND"
            echo "noop_percent=$NOOP_PCT"
            echo "realization_percent=$REALIZATION_PCT"
          } >> "$GITHUB_OUTPUT"

          printf '%s\n' "${EMPTY_LIST[@]:-}" > empty-commits.txt

      - name: Publish evidence summary
        if: steps.measure.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          BASE_SHA: ${{ steps.measure.outputs.base_sha }}
          HEAD_SHA: ${{ steps.measure.outputs.head_sha }}
          MERGE_BASE: ${{ steps.measure.outputs.merge_base }}
          COMMIT_COUNT: ${{ steps.measure.outputs.commit_count }}
          EMPTY_COUNT: ${{ steps.measure.outputs.empty_commit_count }}
          EFFECTIVE_COUNT: ${{ steps.measure.outputs.effective_commit_count }}
          GROSS_ADD: ${{ steps.measure.outputs.gross_additions }}
          GROSS_DEL: ${{ steps.measure.outputs.gross_deletions }}
          FINAL_ADD: ${{ steps.measure.outputs.final_additions }}
          FINAL_DEL: ${{ steps.measure.outputs.final_deletions }}
          FINAL_FILES: ${{ steps.measure.outputs.final_changed_files }}
          UNIQUE_FILES: ${{ steps.measure.outputs.unique_changed_files }}
          AHEAD: ${{ steps.measure.outputs.ahead }}
          BEHIND: ${{ steps.measure.outputs.behind }}
          NOOP_PCT: ${{ steps.measure.outputs.noop_percent }}
          REALIZATION_PCT: ${{ steps.measure.outputs.realization_percent }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- pr-change-effectiveness-ledger:v1 -->'
          state='🟢 EFFECTIVE_DIFF_PRESENT'
          absorbed=0
          if [[ "$FINAL_FILES" -eq 0 && "$UNIQUE_FILES" -eq 0 && "$EFFECTIVE_COUNT" -eq 0 ]]; then
            state='❌ NO_EFFECTIVE_DIFF'
          elif [[ "$FINAL_FILES" -eq 0 && ( "$UNIQUE_FILES" -gt 0 || "$EFFECTIVE_COUNT" -gt 0 ) ]]; then
            state='🟡 ABSORBED_BY_BASE'
            absorbed=1
          fi
          noop='No empty commits observed.'
          if [[ "$EMPTY_COUNT" -gt 0 ]]; then noop="⚠️ ${EMPTY_COUNT} empty/no-op commit(s) observed."; fi

          # Assemble markdown incrementally so backticks are escaped exactly once
          # by bash. This prevents accidental command substitution in YAML blocks.
          generated="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          nl=$'\n'
          body="${marker}${nl}"
          body+="## PR Change Effectiveness Ledger${nl}${nl}"
          body+="**Measured head:** \`${HEAD_SHA}\`${nl}"
          body+="**Measured base:** \`${BASE_SHA}\`${nl}"
          body+="**Merge base:** \`${MERGE_BASE}\`${nl}${nl}"
          body+="| Signal | Value |${nl}"
          body+="|---|---:|${nl}"
          body+="| commits in PR range | ${COMMIT_COUNT} |${nl}"
          body+="| commits with no file delta | ${EMPTY_COUNT} |${nl}"
          body+="| commits with file delta | ${EFFECTIVE_COUNT} |${nl}"
          body+="| no-op commit rate | ${NOOP_PCT}% |${nl}"
          body+="| gross additions across commits | ${GROSS_ADD} |${nl}"
          body+="| gross deletions across commits | ${GROSS_DEL} |${nl}"
          body+="| final additions vs base | ${FINAL_ADD} |${nl}"
          body+="| final deletions vs base | ${FINAL_DEL} |${nl}"
          body+="| final changed files vs base tip | ${FINAL_FILES} |${nl}"
          body+="| unique changed files vs merge-base | ${UNIQUE_FILES} |${nl}"
          body+="| churn → retained final diff | ${REALIZATION_PCT}% |${nl}"
          body+="| ahead / behind base | ${AHEAD} / ${BEHIND} |${nl}${nl}"
          body+="**Interpretation:** commit count is context, not quality. Empty commits are explicitly measured, not silently treated as productive work. Gross churn describes work performed across history; the final base→head diff describes what remains. Review/comment/check evidence must be evaluated separately and tied to this measured head SHA.${nl}${nl}"
          body+="**State:** ${state}; ${noop}${nl}${nl}"
          body+="Generated: ${generated}"

          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --jq '.[] | select(.body | contains("'"$marker"'")) | [.id,.body] | @tsv' | head -n1 || true)
          if [[ -n "$existing" ]]; then
            id="${existing%%$'\t'*}"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi

          # Hard-fail only a true empty PR. Equivalent tip trees with a unique
          # patch are absorbed-by-base, not a workflow defect (run 37166124171).
          if [[ "$FINAL_FILES" -eq 0 && "$absorbed" -eq 0 ]]; then
            exit 1
          fi
