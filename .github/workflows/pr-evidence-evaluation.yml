name: PR evidence evaluation

# Read-only continuous evaluation. Quality is evidence-weighted: current-SHA
# diffs, substantive reviews, review-cycle continuity, and validation dominate
# raw commit/file counts. This workflow never checks out or executes PR code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read

concurrency:
  group: pr-evidence-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/evaluate')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Evaluate current-SHA evidence
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = Number(context.payload.pull_request?.number || context.payload.issue?.number || context.payload.review?.pull_request_url?.match(/pulls\/(\d+)/)?.[1] || context.payload.comment?.pull_request_url?.match(/pulls\/(\d+)/)?.[1] || context.payload.inputs?.pr_number || '${{ inputs.pr_number }}');
            if (!prNumber) throw new Error('PR number is required');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const safePaginate = async (fn, params, label) => {
              try { return await github.paginate(fn, params); }
              catch (error) { core.warning(`${label} unavailable: ${error.message}`); return []; }
            };
            const safeCall = async (fn, params, label, fallback) => {
              try { return (await fn(params)).data; }
              catch (error) { core.warning(`${label} unavailable: ${error.message}`); return fallback; }
            };
            const pr = await safeCall(github.rest.pulls.get, { owner, repo, pull_number: prNumber }, 'PR metadata', null);
            if (!pr) throw new Error(`Unable to read PR #${prNumber}`);
            const reviews = await safePaginate(github.rest.pulls.listReviews, { owner, repo, pull_number: prNumber, per_page: 100 }, 'reviews');
            const comments = await safePaginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 }, 'issue comments');
            const reviewComments = await safePaginate(github.rest.pulls.listReviewComments, { owner, repo, pull_number: prNumber, per_page: 100 }, 'inline review comments');
            const checks = await safePaginate(github.rest.checks.listForRef, { owner, repo, ref: pr.head.sha, per_page: 100 }, 'checks');
            const comparison = await safeCall(github.rest.repos.compareCommitsWithBasehead, { owner, repo, basehead: `${context.repo.default_branch}...${pr.head.sha}`, per_page: 100 }, 'master comparison', { ahead_by: null, behind_by: null });
            const now = Date.now();
            const currentSha = pr.head.sha;
            const shaIn = text => typeof text === 'string' && text.includes(currentSha);
            const substantive = text => {
              const body = String(text || '').trim();
              return body.length >= 180 || /\b(high|medium|correctness|security|bug|regression|performance|reliability|contract|must|should)\b/i.test(body);
            };
            const findingWeight = text => {
              const body = String(text || '');
              if (/\b(high|security|correctness|critical|blocker)\b/i.test(body)) return 10;
              if (/\b(medium|reliability|maintainability|regression)\b/i.test(body)) return 5;
              return 1;
            };
            const normalize = text => String(text || '').toLowerCase().replace(/\s+/g, ' ').replace(/`[^`]+`/g, '`x`').trim();
            const currentReviews = reviews.filter(r => r.commit_id === currentSha || (r.commit_id == null && new Date(r.submitted_at || r.updated_at || r.created_at || 0).getTime() >= new Date(pr.updated_at).getTime() - 60 * 60 * 1000));
            const approvals = currentReviews.filter(r => r.state === 'APPROVED').length;
            const changeRequests = currentReviews.filter(r => r.state === 'CHANGES_REQUESTED').length;
            const substantiveReviews = currentReviews.filter(r => substantive(r.body));
            const findingMap = new Map();
            for (const c of [...reviewComments, ...comments]) {
              const body = c.body || '';
              if (!substantive(body)) continue;
              const key = `${c.path || 'conversation'}:${normalize(body).slice(0, 500)}`;
              const weight = findingWeight(body);
              const previous = findingMap.get(key);
              if (!previous || weight > previous.weight) findingMap.set(key, { weight, current: shaIn(body) || c.commit_id === currentSha });
            }
            const currentFindings = [...findingMap.values()].filter(f => f.current);
            const weightedFindings = currentFindings.reduce((sum, f) => sum + f.weight, 0);
            const terminal = checks.filter(c => c.status === 'completed');
            const passing = terminal.filter(c => ['success', 'neutral', 'skipped'].includes(c.conclusion));
            const failed = terminal.filter(c => ['failure', 'timed_out', 'action_required'].includes(c.conclusion));
            const pending = checks.filter(c => c.status !== 'completed');
            const validationScore = checks.length === 0 ? 0 : Math.round(20 * (passing.length / checks.length));
            const linkedIssueRefs = `${pr.title}\n${pr.body || ''}`.match(/#\d+/g) || [];
            const cycleComments = comments.filter(c => /cycle_id:\s*pr-/i.test(c.body || '') && /head_sha:/i.test(c.body || ''));
            const currentCycles = cycleComments.filter(c => shaIn(c.body || ''));
            const continuityScore = Math.min(10, currentCycles.length * 2 + (substantiveReviews.length ? 4 : 0));
            const freshnessHours = Math.max(0, (now - new Date(pr.updated_at).getTime()) / 3600000);
            const freshnessScore = freshnessHours <= 6 ? 10 : freshnessHours <= 24 ? 7 : freshnessHours <= 72 ? 4 : 1;
            const relevanceScore = Math.min(35, Math.min(20, linkedIssueRefs.length * 4) + Math.min(15, substantiveReviews.length * 3));
            const reviewScore = Math.max(0, Math.min(25, 12 + approvals * 4 - Math.min(20, weightedFindings * 2) + Math.min(9, substantiveReviews.length * 2)));
            const score = Math.max(0, Math.min(100, relevanceScore + reviewScore + validationScore + continuityScore + freshnessScore));
            const classification = failed.length ? 'ACTION_REQUIRED' : pending.length ? 'UNVERIFIED_PENDING_CHECKS' : currentFindings.length ? 'ACTION_REQUIRED' : score >= 70 ? 'STRONG_EVIDENCE' : 'INSUFFICIENT_EVIDENCE';
            const summary = [
              '<!-- pr-evidence-evaluation:v1 -->',
              `pr: #${prNumber}`,
              `head_sha: ${currentSha}`,
              `master_compare: ${comparison.ahead_by ?? 'unverified'} ahead / ${comparison.behind_by ?? 'unverified'} behind`,
              `score: ${score}/100`,
              `classification: ${classification}`,
              `weights: relevance=35 review=25 validation=20 continuity=10 freshness=10 size=0`,
              `review_state: substantive=${substantiveReviews.length} approvals=${approvals} changes_requested=${changeRequests} current_findings_weight=${weightedFindings}`,
              `validation: checks=${checks.length} passing=${passing.length} pending=${pending.length} failed=${failed.length}`,
              `cycles: total=${cycleComments.length} current_sha=${currentCycles.length}`,
              `size_context_only: commits=${pr.commits} files=${pr.changed_files} additions=${pr.additions} deletions=${pr.deletions}`,
              '',
              'This is an evidence score, not merge authorization. Re-fetch after every new head SHA and repeat the cycle.',
            ].join('\n');
            core.summary.addRaw(summary).write();
            core.info(summary);