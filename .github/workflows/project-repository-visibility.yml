name: Project Repository Visibility

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: project-visibility-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  promote-approved-project:
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[publish-project]') &&
      github.event.issue.author_association == 'OWNER' &&
      github.event.sender.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || github.token }}
      EXPECTED_AUTH_OWNER: timerloggedout-spec
      TARGET_REPOSITORY: timerloggedout-spec/cell-the-living-machine
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - name: Validate owner authorization and exact target
        id: request
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Configure an authenticated operator Actions secret}"

          target="$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^target_repository:[[:space:]]*//p' | head -n1)"
          visibility="$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^requested_visibility:[[:space:]]*//p' | head -n1)"
          requested_by="$(gh api user --jq '.login')"
          actor_permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq '.permission')"

          if [[ "$requested_by" != "$EXPECTED_AUTH_OWNER" ]]; then
            echo "::error::Operator credential identity failed owner verification."
            exit 1
          fi
          if [[ "$actor_permission" != "admin" ]]; then
            echo "::error::Issue actor requires repository admin permission."
            exit 1
          fi
          if [[ "$target" != "$TARGET_REPOSITORY" || "$visibility" != "public" ]]; then
            echo "::error::Request must match the exact allowlisted repository and public visibility."
            exit 1
          fi

          current="$(gh api "repos/$TARGET_REPOSITORY" --jq '[.id, .full_name, .private, .default_branch] | @tsv')"
          IFS=$'\t' read -r repo_id full_name is_private default_branch <<< "$current"
          if [[ "$full_name" != "$TARGET_REPOSITORY" || -z "$repo_id" || -z "$default_branch" ]]; then
            echo "::error::Target repository identity verification failed."
            exit 1
          fi

          echo "repo_id=$repo_id" >> "$GITHUB_OUTPUT"
          echo "full_name=$full_name" >> "$GITHUB_OUTPUT"
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"
          echo "already_public=$([[ "$is_private" == "false" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Promote allowlisted product repository
        id: promote
        if: steps.request.outputs.already_public != 'true'
        shell: bash
        env:
          REPO_ID: ${{ steps.request.outputs.repo_id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$TARGET_REPOSITORY" -F private=false >/dev/null
          verified="$(gh api "repos/$TARGET_REPOSITORY" --jq '[.id, .full_name, .private, .visibility] | @tsv')"
          IFS=$'\t' read -r repo_id full_name is_private visibility <<< "$verified"
          if [[ "$repo_id" != "$REPO_ID" || "$full_name" != "$TARGET_REPOSITORY" || "$is_private" != "false" || "$visibility" != "public" ]]; then
            echo "::error::Repository visibility verification failed."
            exit 1
          fi
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Publish non-secret audit receipt
        shell: bash
        env:
          REPO_ID: ${{ steps.request.outputs.repo_id }}
          DEFAULT_BRANCH: ${{ steps.request.outputs.default_branch }}
          ALREADY_PUBLIC: ${{ steps.request.outputs.already_public }}
        run: |
          set -euo pipefail
          if [[ "$ALREADY_PUBLIC" == "true" ]]; then
            state="already_public"
          else
            state="promoted_and_verified"
          fi
          body="$(cat <<EOF
          ## Project repository visibility receipt

          - state: **$state**
          - repository: https://github.com/$TARGET_REPOSITORY
          - repository_id: $REPO_ID
          - visibility: public
          - default_branch: $DEFAULT_BRANCH
          - authorized_actor: $GITHUB_ACTOR
          - credential_reference: existing Actions secret (value withheld)
          - workflow_run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          )"
          gh issue comment "$ISSUE_NUMBER" --body "$body"
