name: project-task-dispatch

# Issue #3577: intake + routing receipt for project-task issues.
# Filing IS the trigger — this workflow validates the intake and posts
# the receipt; selection/execution happens in the system's existing
# dispatch machinery. Keyed on the `project-task` label or the
# `[task]` title prefix, so API-filed replicas of the form body
# trigger identically (never on form provenance).

on:
  issues:
    types: [opened, reopened]
  pull_request:
    paths:
      - '.github/workflows/project-task-dispatch.yml'
      - 'scripts/dispatch/project_task.py'
      - 'scripts/dispatch/test_project_task.py'

permissions:
  issues: write
  contents: read

concurrency:
  group: project-task-dispatch-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  contract-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise QUE intake, lane profiling and Siglary data guard
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('scripts/dispatch/test_project_task.py')
          spec = importlib.util.spec_from_file_location('test_project_task', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          tests = [value for name, value in vars(module).items()
                   if name.startswith('test_') and callable(value)]
          for test in tests:
              test()
              print('PASS', test.__name__)
          print(f'{len(tests)} QUE dispatch contract tests passed')
          PY

  intake:
    if: github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'project-task') || startsWith(github.event.issue.title, '[task]') || contains(github.event.issue.body, '### Task / spec'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse + validate the intake
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue-body.md"
          python3 scripts/dispatch/project_task.py \
            --body-file "$RUNNER_TEMP/issue-body.md" \
            --issue "${{ github.event.issue.number }}" \
            --comment-out "$RUNNER_TEMP/comment.md" \
            --metadata-out "$RUNNER_TEMP/dispatch-profile.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Post routing receipt + queue (valid intake)
        if: steps.parse.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create dispatch-queued --force \
            --color 0E8A16 \
            --description "Project task accepted into the system; selection pending/executing" || true
          gh issue comment "${{ github.event.issue.number }}" \
            --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "${{ github.event.issue.number }}" \
            --add-label dispatch-queued

      - name: Publish QUE lane profile
        if: steps.parse.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: que-dispatch-profile-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/dispatch-profile.json
          if-no-files-found: error
          retention-days: 30

      - name: Post intake diagnosis (malformed intake)
        if: steps.parse.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create intake-incomplete --force \
            --color D93F0B \
            --description "Project-task intake missing required field(s); see the diagnosis comment" || true
          gh issue comment "${{ github.event.issue.number }}" \
            --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "${{ github.event.issue.number }}" \
            --add-label intake-incomplete
