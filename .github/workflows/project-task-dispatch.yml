name: project-task-dispatch

# Preserve the repository's issue-event contract. QUE admission runs on the
# same issues.opened/reopened lifecycle; this route waits for its first-fleet
# receipt before intake. The issue event remains the trigger, admission the gate.
# Provider/model selection and execution remain in existing dispatch machinery.

on:
  issues:
    types: [opened, reopened]
  pull_request:
    paths:
      - '.github/workflows/project-task-dispatch.yml'
      - 'scripts/dispatch/project_task.py'
      - 'scripts/dispatch/admission_receipt.py'
      - 'scripts/dispatch/test_project_task.py'
      - 'ops/roles/scientific-specialists.json'
      - 'scripts/proposals/proposals_feed.py'
      - 'tests/test_proposals_feed.py'
      - 'apps/tribute-dashboard/proposals.html'
      - 'docs/ops/PROPOSALS-FEED.md'
      - 'docs/proposals/registry.yaml'
      - 'docs/proposals/PROPOSAL-TYPES.md'
      - '.github/ISSUE_TEMPLATE/project-task.yml'
      - '.github/ISSUE_TEMPLATE/scientific-research-task.yml'
      - '.github/ISSUE_TEMPLATE/behavioral-experiment-task.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: project-task-dispatch-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  contract-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise QUE intake, lane profiling, Siglary guard and admission gate
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('scripts/dispatch/test_project_task.py')
          spec = importlib.util.spec_from_file_location('test_project_task', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          tests = [value for name, value in vars(module).items()
                   if name.startswith('test_') and callable(value)]
          for test in tests:
              test()
              print('PASS', test.__name__)
          print(f'{len(tests)} QUE dispatch contract tests passed')
          PY

  intake:
    if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'reopened') && (contains(github.event.issue.labels.*.name, 'project-task') || contains(github.event.issue.labels.*.name, 'scientific-task') || contains(github.event.issue.labels.*.name, 'behavioral-experiment'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Wait for this issue event's QUE admission receipt
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_AT: ${{ github.event.issue.updated_at || github.event.issue.created_at }}
        run: |
          python3 scripts/dispatch/admission_receipt.py --issue "$ISSUE_NUMBER" --template project-task.yml,scientific-research-task.yml,behavioral-experiment-task.yml --event-at "$EVENT_AT" --timeout 600 --poll-interval 5

      - name: Fetch the admitted issue body
        if: steps.admission.outputs.decision == 'admitted'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" --jq .body > "$RUNNER_TEMP/issue-body.md"

      - name: Parse and validate the admitted intake
        if: steps.admission.outputs.decision == 'admitted'
        id: parse
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 scripts/dispatch/project_task.py --body-file "$RUNNER_TEMP/issue-body.md" --issue "$ISSUE_NUMBER" --comment-out "$RUNNER_TEMP/comment.md" --metadata-out "$RUNNER_TEMP/dispatch-profile.json" --github-output "$GITHUB_OUTPUT"

      - name: Add event-scoped idempotency marker
        if: steps.admission.outputs.decision == 'admitted' && steps.parse.outputs.ok == 'true'
        env:
          EVENT_AT: ${{ github.event.issue.updated_at || github.event.issue.created_at }}
        run: |
          printf '\n\n<!-- que-intake-event:%s -->\n' "$EVENT_AT" >> "$RUNNER_TEMP/comment.md"

      - name: Post routing receipt once per issue event
        if: steps.admission.outputs.decision == 'admitted' && steps.parse.outputs.ok == 'true' && steps.admission.outputs.already_processed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"

      - name: Ensure admitted task is queued
        if: steps.admission.outputs.decision == 'admitted' && steps.parse.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create dispatch-queued --force --color 0E8A16 --description "Project task accepted into the system; selection pending/executing" || true
          gh issue edit "$ISSUE_NUMBER" --add-label dispatch-queued

      - name: Apply QUE capability lane labels
        if: steps.admission.outputs.decision == 'admitted' && steps.parse.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CAPABILITY_LANES: ${{ steps.parse.outputs.capability_lanes }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          IFS=',' read -ra LANES <<< "$CAPABILITY_LANES"
          for lane in "${LANES[@]}"; do
            [ -n "$lane" ] || continue
            label="que-lane-$lane"
            gh label create "$label" --force --color 1D76DB --description "QUE capability/experiment lane: $lane" || true
            gh issue edit "$ISSUE_NUMBER" --add-label "$label"
          done

      - name: Publish QUE lane profile
        if: steps.admission.outputs.decision == 'admitted' && steps.parse.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: que-dispatch-profile-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/dispatch-profile.json
          if-no-files-found: error
          retention-days: 30

      - name: Diagnose incomplete admitted intake
        if: steps.admission.outputs.decision == 'admitted' && steps.parse.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create intake-incomplete --force --color D93F0B --description "Project-task intake missing required field(s); see the diagnosis comment" || true
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$ISSUE_NUMBER" --add-label intake-incomplete
