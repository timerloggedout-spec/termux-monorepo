name: project-task-dispatch

# Project-task execution is admission-gated. The only issue-event path
# is swarm-admission; this route consumes that run's one-use handoff.
# Provider/model selection remains in the existing dispatch machinery.

on:
  workflow_run:
    workflows: ["swarm-admission"]
    types: [completed]
  pull_request:
    paths:
      - '.github/workflows/project-task-dispatch.yml'
      - 'scripts/dispatch/project_task.py'
      - 'scripts/dispatch/test_project_task.py'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: project-task-dispatch-${{ github.event.workflow_run.id || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  contract-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise QUE intake, lane profiling and Siglary data guard
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('scripts/dispatch/test_project_task.py')
          spec = importlib.util.spec_from_file_location('test_project_task', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          tests = [value for name, value in vars(module).items()
                   if name.startswith('test_') and callable(value)]
          for test in tests:
              test()
              print('PASS', test.__name__)
          print(f'{len(tests)} QUE dispatch contract tests passed')
          PY

  intake:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download the admission handoff
        uses: actions/download-artifact@v4
        with:
          name: issue-admission
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/admission

      - name: Select admitted project-task filings only
        id: handoff
        run: |
          python3 - <<'PYEOF'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "admission", "admission.json")
          with open(path, encoding="utf-8") as fh:
              record = json.load(fh)
          dispatch = (
              record.get("matched") is True
              and record.get("template") == "project-task.yml"
              and record.get("decision") == "admitted"
              and isinstance(record.get("issue_number"), int)
              and record.get("issue_number") > 0
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"dispatch={'true' if dispatch else 'false'}\\n")
              fh.write(f"issue_number={record.get('issue_number', '')}\\n")
          print("Project-task dispatch admitted." if dispatch else
                "No admitted project-task filing in this admission run.")
          PYEOF

      - name: Fetch the admitted issue body
        if: steps.handoff.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.handoff.outputs.issue_number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" --jq .body > "$RUNNER_TEMP/issue-body.md"

      - name: Parse + validate the admitted intake
        if: steps.handoff.outputs.dispatch == 'true'
        id: parse
        env:
          ISSUE_NUMBER: ${{ steps.handoff.outputs.issue_number }}
        run: |
          python3 scripts/dispatch/project_task.py \\
            --body-file "$RUNNER_TEMP/issue-body.md" \\
            --issue "$ISSUE_NUMBER" \\
            --comment-out "$RUNNER_TEMP/comment.md" \\
            --metadata-out "$RUNNER_TEMP/dispatch-profile.json" \\
            --github-output "$GITHUB_OUTPUT"

      - name: Post routing receipt + queue (valid admitted intake)
        if: steps.handoff.outputs.dispatch == 'true' && steps.parse.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.handoff.outputs.issue_number }}
        run: |
          gh label create dispatch-queued --force --color 0E8A16 \\
            --description "Project task accepted into the system; selection pending/executing" || true
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$ISSUE_NUMBER" --add-label dispatch-queued

      - name: Apply QUE capability lane labels
        if: steps.handoff.outputs.dispatch == 'true' && steps.parse.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CAPABILITY_LANES: ${{ steps.parse.outputs.capability_lanes }}
          ISSUE_NUMBER: ${{ steps.handoff.outputs.issue_number }}
        run: |
          set -euo pipefail
          IFS=',' read -ra LANES <<< "$CAPABILITY_LANES"
          for lane in "${LANES[@]}"; do
            [ -n "$lane" ] || continue
            label="que-lane-$lane"
            gh label create "$label" --force --color 1D76DB \\
              --description "QUE capability/experiment lane: $lane" || true
            gh issue edit "$ISSUE_NUMBER" --add-label "$label"
          done

      - name: Publish QUE lane profile
        if: steps.handoff.outputs.dispatch == 'true' && steps.parse.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: que-dispatch-profile-${{ steps.handoff.outputs.issue_number }}-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/dispatch-profile.json
          if-no-files-found: error
          retention-days: 30

      - name: Diagnose incomplete admitted intake
        if: steps.handoff.outputs.dispatch == 'true' && steps.parse.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.handoff.outputs.issue_number }}
        run: |
          gh label create intake-incomplete --force --color D93F0B \\
            --description "Project-task intake missing required field(s); see the diagnosis comment" || true
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$ISSUE_NUMBER" --add-label intake-incomplete
