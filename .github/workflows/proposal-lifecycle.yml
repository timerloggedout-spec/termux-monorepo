name: proposal-lifecycle

on:
  pull_request:
    paths:
      - "docs/proposals/**"
      - "scripts/proposals/**"
      - ".github/workflows/proposal-lifecycle.yml"
  push:
    branches: [master, master-staging]
    paths:
      - "docs/proposals/**"
      - "scripts/proposals/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/proposals/validate_registry.py
      - name: Summarize active proposals
        run: |
          {
            echo "## Active proposals"
            echo '```yaml'
            sed -n '1,120p' docs/proposals/registry.yaml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  vote-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Scan PR for VOTE lines
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$TITLE" "$BODY" > /tmp/pr.txt
          if grep -E '^VOTE: (accept|reject|abstain|summary OK)' /tmp/pr.txt; then
            echo "Found VOTE line(s) — MANIFEST Review log is the binding store."
          else
            echo "No VOTE: line in PR title/body (OK)."
          fi
      - uses: actions/github-script@v7
        with:
          script: |
            const body = `### Proposal process checklist
            - [ ] registry.yaml updated if new/changed proposal
            - [ ] active/<id>/MANIFEST.md + ITEMS.md present
            - [ ] Binding decisions logged in Review log (not only chat)
            - [ ] Votes use VOTE: accept|reject|abstain + term: (see docs/CONSENSUS.md)
            - [ ] Promotion via scripts/proposals/promote_proposal.py when status changes
            - [ ] Full large sources may stay on a docs/* branch with a pointer on master

            Refs: PROCESS · CONSENSUS · registry.yaml
            `;
            const classify = (error) => {
              const response = error.response || {};
              const headers = {};
              for (const [key, value] of Object.entries(response.headers || {})) headers[key.toLowerCase()] = String(value).trim();
              const message = String(response.data && response.data.message || error.message || '').toLowerCase();
              const counters = ['x-ratelimit-limit', 'x-ratelimit-used', 'x-ratelimit-reset'];
              const valid = (response.status || error.status || 0) === 403
                && message.includes('installation') && message.includes('api rate limit exceeded')
                && headers['x-ratelimit-remaining'] === '0' && headers['x-ratelimit-resource'] === 'core'
                && counters.every(key => /^[0-9]{1,20}$/.test(headers[key] || ''));
              return valid && BigInt(headers['x-ratelimit-limit']) > 0n
                && BigInt(headers['x-ratelimit-used']) >= BigInt(headers['x-ratelimit-limit'])
                && BigInt(headers['x-ratelimit-reset']) > 0n ? 'deferred_rate_limit' : 'error';
            };
            let requestPath = `/repos/${context.repo.owner}/${context.repo.repo}/pulls/${context.issue.number}/files?per_page=100`;
            try {
              const { data: files } = await github.rest.pulls.listFiles({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: context.issue.number, per_page: 100,
              });
              const hit = files.some(f => f.filename.startsWith('docs/proposals/') || f.filename.startsWith('scripts/proposals/'));
              if (!hit) { core.setOutput('feedback_status', 'not_applicable'); return; }
              requestPath = `/repos/${context.repo.owner}/${context.repo.repo}/issues/${context.issue.number}/comments?per_page=50`;
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, per_page: 50,
              });
              if (comments.data.some(c => c.body && c.body.includes('Proposal process checklist'))) {
                core.setOutput('feedback_status', 'already_present'); return;
              }
              requestPath = `/repos/${context.repo.owner}/${context.repo.repo}/issues/${context.issue.number}/comments`;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
              core.setOutput('feedback_status', 'posted');
            } catch (error) {
              if (classify(error) !== 'deferred_rate_limit') throw error;
              core.setOutput('feedback_status', 'deferred_rate_limit');
              core.warning('Advisory checklist comment not posted: verified installation core quota exhausted. No review or vote is inferred.');
              core.summary.addHeading('Proposal process checklist — deferred');
              core.summary.addRaw(`The checklist comment was **not posted**: HTTP 403 with verified exhausted installation core quota (remaining 0). Request: ${requestPath}. Authentication: Actions job token.\n\n`);
              core.summary.addRaw(body);
              core.summary.addRaw('\nRetry posting when the installation quota resets. Registry validation and the VOTE scan ran independently.\n');
              await core.summary.write();
              return;
            }
