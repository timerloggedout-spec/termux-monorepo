# Proposals index feed refresh (contract: docs/ops/PROPOSALS-FEED.md).
# Regenerates apps/help-wanted-dashboard/data/proposals-feed.json from
# the proposal registry of record (docs/proposals/registry.yaml) and
# the pass records under docs/proposals/passes/, and proposes it as a
# refresh PR — never commits directly.
name: proposals-feed-collect

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/proposals/**'

concurrency:
  group: proposals-feed-collect
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the feed
        run: |
          set -euo pipefail
          python3 -B scripts/proposals/proposals_feed.py \
            --registry docs/proposals/registry.yaml \
            --proposals-root docs/proposals \
            --out apps/help-wanted-dashboard/data/proposals-feed.json
      - name: Propose the refresh as a PR
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/help-wanted-dashboard/data/proposals-feed.json; then
            echo "feed unchanged; no refresh PR"
            exit 0
          fi
          branch="proposals-feed/refresh"
          git config user.name "proposals-feed-collect"
          git config user.email "actions@github.com"
          git checkout -B "$branch"
          git add apps/help-wanted-dashboard/data/proposals-feed.json
          git commit -m "chore(proposals): refresh proposals-feed"
          git push -f origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore(proposals): refresh proposals-feed.json" \
            --body "Automated proposals index feed refresh (collector: scripts/proposals/proposals_feed.py; contract: docs/ops/PROPOSALS-FEED.md). Data is derived from docs/proposals/registry.yaml and docs/proposals/passes/*/pass.json at collection time; nothing is copied forward." \
            || echo "refresh PR already open"
