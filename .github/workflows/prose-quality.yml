name: Prose Quality
on:
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'docs/**/*.md'
      - '.github/**/*.md'
      - 'scripts/ci/check_do_statement_style.py'
      - 'scripts/ci/check_do_statement_style.py'
      - '.vale.ini'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/prose-quality.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**/*.md'
      - '.github/**/*.md'
      - '.vale.ini'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/prose-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prose-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Lint changed Markdown
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE=""
          fi
          if [[ -n "$RANGE" ]]; then
            mapfile -t FILES < <(git diff --name-only "$RANGE" -- '*.md' | grep -v '^docs/archive/' || true)
          else
            mapfile -t FILES < <(find docs .github -type f -name '*.md' -not -path 'docs/archive/*'; test -f README.md && echo README.md)
          fi
          if (("${#FILES[@]}")); then
            npx --yes markdownlint-cli2@0.24.1 "${FILES[@]}"
          else
            echo "Markdown lint: no eligible changed files"
          fi
      - uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3
        with:
          fail_on_error: true
          files: '["docs", ".github", "README.md"]'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate DO statement style
        run: python scripts/ci/check_do_statement_style.py
