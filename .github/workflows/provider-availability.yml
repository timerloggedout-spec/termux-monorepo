name: Prnvider availability cnntinuity

# Continuous health/evidence plane for provider integrations already used by the
# monorepo. This does not rotate keys or change routing policy.
#
# Semantics:
#   credential_present = workflow secret is configured
#   catalog_ok        = live provider catalog is reachable
#   inference_ok      = false here; explicit verified no-cost smoke is manual only
#
# Provider secrets are never printed, committed, or included in artifacts.

on:
# Cadence owned by quota-dispatch-tree.yml (Tier 0 decision tree, issue #1573).
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail the workflow when a configured provider or public-catalog probe fails"
        required: false
        default: false
        type: boolean

concurrency:
  group: provider-availability
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FELO_AI_API: ${{ secrets.FELO_AI_API }}
      OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
      HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      AION_API_KEY: ${{ secrets.AION_API_KEY }}
      LLM7_API_TOKEN: ${{ secrets.LLM7_API_TOKEN }}
      MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
      OVHCLOUD_API_KEY: ${{ secrets.OVHCLOUD_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '' }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      GEMINI_HEALTH_MODEL: ${{ vars.GEMINI_HEALTH_MODEL || '' }}
      OPENROUTER_HEALTH_MODEL: ${{ vars.OPENROUTER_HEALTH_MODEL || '' }}
      STRICT: ${{ inputs.strict || 'false' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Probe provider availability
        run: |
          set -euo pipefail
          python3 scripts/provider_availability_probe.py
          cat /tmp/provider-availability.json >> "$GITHUB_STEP_SUMMARY"

      - name: Validate configured-provider continuity
        env:
          STRICT: ${{ env.STRICT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          d=json.load(open('/tmp/provider-availability.json', encoding='utf-8'))
          print("### Provider continuity")
          failed=[]
          for p in d["providers"]:
              configured=p["credential_present"]
              required=p.get("catalog_probe_required", configured)
              if not required:
                  print(f"- {p['provider']}: not configured (no secret); observation only")
                  continue
              # Catalog continuity does not authorize recurring inference spend.
              ok=p["catalog_ok"]
              mode=p.get("auth_mode", "credential" if configured else "unconfigured")
              print(f"- {p['provider']} ({mode}): {'PASS' if ok else 'FAIL'}")
              if not ok:
                  failed.append(p["provider"])
          if failed and os.environ.get("STRICT","false").lower()=="true":
              raise SystemExit("Configured provider probe failures: " + ", ".join(failed))
          if failed:
              print("Non-strict mode: recording failures without changing routing policy.")
          PY

      - name: Publish immutable health evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: provider-availability-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/provider-availability.json
          if-no-files-found: error
          retention-days: 30
