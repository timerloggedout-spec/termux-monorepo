name: Provider batch production contracts
# No scheduler or routing activation. Manual observations run trusted master only.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'scripts/provider_model_catalog.py'
      - 'scripts/model_selection_market/**'
      - 'llm_api_hub/**'
      - 'tests/test_provider_model_catalog.py'
      - 'tests/test_provider_batch.py'
      - 'tests/test_review_evidence.py'
      - 'tests/test_research_provider_hub.py'
      - 'tests/test_llm_api_hub_server.py'
      - '.github/workflows/provider-batch.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/provider_model_catalog.py'
      - 'scripts/model_selection_market/**'
      - 'llm_api_hub/**'
      - '.github/workflows/provider-batch.yml'
permissions: {}
concurrency:
  group: provider-batch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install contract test dependencies
        run: python3 -m pip install pytest==8.4.2 fastapi==0.143.3 pydantic==2.14.1 httpx==0.28.1 PyYAML==6.0.3
      - name: Test active production entry points and reconciliation contracts
        run: |
          python3 -m pytest -q tests/test_provider_model_catalog.py tests/test_provider_batch.py tests/test_review_evidence.py tests/test_research_provider_hub.py tests/test_llm_api_hub_server.py
          python3 -m pytest -q tests/test_provider_recon.py tests/test_market_cadence.py tests/test_publish_provider_recon.py tests/test_resource_index.py tests/test_resource_registry.py
          python3 -m unittest scripts.model_selection_market.test_msm
  observe:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Observe official catalogs without inference or routing changes
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FELO_AI_API: ${{ secrets.FELO_AI_API }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_HUB_TOKEN || secrets.HF_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/provider-batch
          # Exit 1 means no successful model rows, not a successful admission.
          status=0
          python3 scripts/provider_model_catalog.py --providers openrouter,felo,omni,huggingface,groq,mistral,gemini --output /tmp/provider-batch/catalog.json || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          python3 -m scripts.model_selection_market.provider_batch --catalog /tmp/provider-batch/catalog.json --output /tmp/provider-batch/coverage.json
      - name: Collect paginated matrix-review evidence with the read-only job token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/matrix-review
          base=repos/timerloggedout-spec/termux-monorepo
          gh api "$base/pulls/1297" --jq .head.sha > /tmp/matrix-review/head
          gh api --paginate --slurp "$base/pulls/1297/reviews?per_page=100" > /tmp/matrix-review/reviews.json
          gh api --paginate --slurp "$base/issues/1297/comments?per_page=100" > /tmp/matrix-review/comments.json
          gh api --paginate --slurp "$base/pulls/1297/comments?per_page=100" > /tmp/matrix-review/inline.json
          gh api --paginate --slurp "$base/pulls/1297/commits?per_page=100" > /tmp/matrix-review/commits.json
          python3 -m scripts.model_selection_market.review_evidence --reviews /tmp/matrix-review/reviews.json --comments /tmp/matrix-review/comments.json --inline-comments /tmp/matrix-review/inline.json --commits /tmp/matrix-review/commits.json --repo timerloggedout-spec/termux-monorepo --pr 1297 --head-sha "$(cat /tmp/matrix-review/head)" --output /tmp/provider-batch/matrix-review.json
      - name: Preserve sanitized run-attempt observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-batch-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/provider-batch/
          if-no-files-found: error
          retention-days: 30
