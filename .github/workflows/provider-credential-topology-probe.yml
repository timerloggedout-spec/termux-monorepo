name: Provider Credential Topology Probe

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect credential topology
        env:
          GH_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "== repository secret names =="
          gh secret list --repo "$REPO" --json name,updatedAt --jq '.[] | [.name,.updatedAt] | @tsv' | sort
          echo "== environments =="
          gh api "repos/$REPO/environments?per_page=100" --jq '.environments[].name' | sort | while IFS= read -r env; do
            [ -n "$env" ] || continue
            echo "-- environment: $env"
            gh api "repos/$REPO/environments/$env/secrets?per_page=100" --jq '.secrets[].name' | sort | sed 's/^/secret: /'
          done