name: Provider invoke (inference batch)

# Per-provider bounded invoke for the class-corrected inference batch:
# one dispatch = one provider, one production-work completion, verdict +
# completion posted to the batch evidence issue. Endpoints/secrets resolve
# from the repo's reviewed hub sources at runtime (no hard-pinned routes).

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Allocation focus slice this dispatch draws on (quota.slice join key); blank = unjoined, counted in the consumption gap"
        required: false
        type: string
      mode:
        description: "invoke (one completion) or catalog (count live models)"
        required: false
        default: invoke
        type: choice
        options:
          - invoke
          - catalog
      model:
        description: "Optional exact model id (per-model shard); blank = first catalog chat model"
        required: false
        type: string
      provider:
        description: "Inference provider to invoke"
        required: true
        type: choice
        options:
          - gemini
          - cohere
          - sambanova
          - zai
          - llm7
          - routeway
          - unorouter
          - siliconflow
          - huggingface
          - groq
          - xkiro
          - cerebras
          - kilo
          - mistral
          - modelscope
          - ovhcloud
          - requesty
          - typhoon
          - xfyun
          - aion
          - sealion
          - cloudflare
          - nvidia
          - felo
          - omni
          - deepinfra
          - novita
          - friendli
          - baseten
          - deepseek

permissions: {}

jobs:
  invoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    outputs:
      tokens_in: ${{ steps.invoke.outputs.tokens_in }}
      tokens_out: ${{ steps.invoke.outputs.tokens_out }}
      latency_ms: ${{ steps.invoke.outputs.latency_ms }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Invoke provider against production work
        id: invoke
        env:
          INVOKE_MODEL: ${{ inputs.model }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          AION_API_KEY: ${{ secrets.AION_API_KEY }}
          LLM7_API_TOKEN: ${{ secrets.LLM7_API_TOKEN }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          OVHCLOUD_API_KEY: ${{ secrets.OVHCLOUD_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          OPENTYPHOON_API_KEY: ${{ secrets.OPENTYPHOON_API_KEY }}
          TYPHOON_API_KEY: ${{ secrets.TYPHOON_API_KEY }}
          UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
          ROUTEWAY_API_KEY: ${{ secrets.ROUTEWAY_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
          XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
          IFLYTEK_SPARK_API_PASSWORD: ${{ secrets.IFLYTEK_SPARK_API_PASSWORD }}
          SEALION_API_KEY: ${{ secrets.SEALION_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FELO_AI_API: ${{ secrets.FELO_AI_API }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          NOVITA_API_KEY: ${{ secrets.NOVITA_API_KEY }}
          FRIENDLI_API_KEY: ${{ secrets.FRIENDLI_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
        run: |
          set -o pipefail
          python3 scripts/ops/provider_invoke.py \
            --provider "${{ inputs.provider }}" \
            --prompt-file docs/ops/tasks/inference-batch-ww3.md \
            --out /tmp/invoke-completion.md \
            ${{ inputs.mode == 'catalog' && '--catalog-only' || '' }} 2>&1 | tee /tmp/invoke.log
          grep -E '^(INVOKE|CATALOG)_VERDICT ' /tmp/invoke.log | tail -1 | sed -E 's/^(INVOKE|CATALOG)_VERDICT //' > /tmp/verdict.json
          python3 -c "import json; v=json.load(open('/tmp/verdict.json')); open('/tmp/tokens.env','w').write('tokens_in=%s\ntokens_out=%s\nlatency_ms=%s\n' % ('' if v.get('tokens_in') is None else v['tokens_in'], '' if v.get('tokens_out') is None else v['tokens_out'], '' if v.get('latency_ms') is None else v['latency_ms']))"
          cat /tmp/tokens.env >> "$GITHUB_OUTPUT"
          python3 - <<'PYEOF'
          import json
          v = json.load(open('/tmp/verdict.json'))
          with open('/tmp/invoke-comment.md', 'w') as f:
              if 'models' in v:
                  f.write('[MUSEai]@{role:{optimizations-assurance}} ENDPOINT CENSUS — provider **%s**: %s\n\n' % (
                      v['provider'], ('**%d models**' % v['models']) if v['models'] is not None else 'not countable from CI'))
                  f.write('verdict: `%s`\n' % json.dumps(v))
                  raise SystemExit(0)
              f.write('[MUSEai]@{role:{optimizations-assurance}} INFERENCE BATCH invoke — provider **%s**: %s\n\n' % (
                  v['provider'], '✓ INVOKE OK' if v['ok'] else '✗ ' + v['diagnosis']))
              f.write('verdict: `%s`\n' % json.dumps(v))
              if v['ok']:
                  f.write('\n<details><summary>completion (production work product)</summary>\n\n')
                  f.write(open('/tmp/invoke-completion.md').read())
                  f.write('\n</details>\n')
          PYEOF
      - name: Post invoke evidence
        run: |
          GH_TOKEN="${{ github.token }}" gh issue comment "3141" --repo timerloggedout-spec/termux-monorepo --body-file /tmp/invoke-comment.md

  stamp:
    needs: [invoke]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Mint Swarm App token (stamp fan-out dispatch)
        id: app-token
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3
        with:
          app-id: ${{ vars.TERMUX_FLEET_SWARM_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }}
      - name: Emit dispatch stamp to scoring planes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPSTREAM_RESULT: ${{ needs.invoke.result }}
          TOKENS_IN: ${{ needs.invoke.outputs.tokens_in }}
          TOKENS_OUT: ${{ needs.invoke.outputs.tokens_out }}
          LATENCY_MS: ${{ needs.invoke.outputs.latency_ms }}
        run: |
          export TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          STAMP=$(python3 - <<'PYEOF'
          import json, os
          stamp = {
            "dispatch_id": "provider-invoke-${{ github.run_id }}",
            "ts": os.environ.get("TS"),
            "task_class": "inference-invoke",
            "entry": "3141",
            "trigger": "workflow_dispatch",
            "provider": "${{ inputs.provider }}",
            "model": "${{ inputs.model }}" or None,
            "role": "builder",
            "moniker": "optimizations-assurance",
            "context": "provider-invoke mode=${{ inputs.mode }}",
            "focus": "${{ inputs.focus }}" or None,
            "run": {"workflow": "provider-invoke.yml", "run_id": "${{ github.run_id }}", "session_id": None},
            "outcome": {"status": "completed" if os.environ.get("UPSTREAM_RESULT") == "success" else "failed",
                        "summary": "provider-invoke.yml run ${{ github.run_id }} result=" + str(os.environ.get("UPSTREAM_RESULT")),
                        "artifact": "actions run ${{ github.run_id }}", "gate_call": None, "confirmed": None},
            "quota": {"pool": "${{ inputs.provider }}", "cost_class": "free-tier", "slice": None},
            "usage": {"tokens_in": int(os.environ["TOKENS_IN"]) if os.environ.get("TOKENS_IN") else None,
                      "tokens_out": int(os.environ["TOKENS_OUT"]) if os.environ.get("TOKENS_OUT") else None,
                      "latency_ms": int(os.environ["LATENCY_MS"]) if os.environ.get("LATENCY_MS") else None},
          }
          print(json.dumps(stamp))
          PYEOF
          )
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/dispatch-stamp-fanout.yml/dispatches" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"ref": "master", "inputs": {"stamp": sys.argv[1]}}))' "$STAMP")" > /dev/null
          echo "stamp dispatched for run ${{ github.run_id }}"
