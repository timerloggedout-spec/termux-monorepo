name: Provider research compounding
# Reuses the existing daily catalog cadence. Never executes upstream code.
on:
  workflow_run:
    workflows: [OpenRouter free catalog snapshot]
    types: [completed]
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'scripts/model_selection_market/**'
      - 'tests/test_provider_recon.py'
      - 'tests/test_market_cadence.py'
      - 'tests/test_publish_provider_recon.py'
      - 'tests/test_resource_index.py'
      - 'tests/test_resource_registry.py'
      - 'tests/test_msm_paper_wallet.py'
      - 'tests/test_paper_accounting*.py'
      - '.github/workflows/provider-recon-compound.yml'
      - 'data/model-selection-market/**'
permissions: {}
concurrency:
  group: provider-research-${{ github.event.pull_request.number || 'compound' }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install test runner
        run: python3 -m pip install pytest==8.4.2
      - name: Validate discovery, advisory planning and restricted publication
        run: |
          python3 -m pytest -q tests/test_provider_recon.py tests/test_market_cadence.py tests/test_publish_provider_recon.py
          python3 -m pytest -q tests/test_resource_index.py tests/test_resource_registry.py
          python3 -m unittest scripts.model_selection_market.test_msm
          python3 -m pytest -q tests/test_msm_paper_wallet.py tests/test_paper_accounting*.py
  collect:
    needs: contracts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Privileged workflow_run never checks out the triggering revision or PR code.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Ingest pinned public source data and generate an advisory Cadence plan
        env:
          # Read-only collect-job token; used only for fixed GitHub commit metadata.
          PROVIDER_RECON_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/provider-research
          python3 -m scripts.model_selection_market.provider_recon --output /tmp/provider-research/provider-recon.json
          python3 -m scripts.model_selection_market.cadence --input data/model-selection-market/cadence-seed.json --output /tmp/provider-research/cadence-plan.json
          python3 -m scripts.model_selection_market.resource_index --registry data/model-selection-market/resource-registry.json --providers /tmp/provider-research/provider-recon.json --output /tmp/provider-research/resource-index.json
      - name: Preserve run-attempt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/provider-research/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # Only this run's normalized output is consumed, never a triggering artifact.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provider-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/provider-research
      - name: Publish research-only refresh PR and request current-head dual gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m scripts.model_selection_market.publish_recon --snapshot /tmp/provider-research/provider-recon.json > /tmp/provider-research-publication.json
          cat /tmp/provider-research-publication.json >> "$GITHUB_STEP_SUMMARY"
