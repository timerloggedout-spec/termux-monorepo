# Provision Actions secrets secret-to-secret (names-only inventory: issue #184,
# map: docs/ops/secrets-provisioning-map.md / scripts/termux/provision-secrets.sh).
#
# - workflow_dispatch only; GITHUB_TOKEN is contents:read.
# - `gh` authenticates as the existing admin Actions secret GH_ACTIONS (the #184
#   `Gh_actions` classic PAT), else OPERATOR, OPERATOR_GITHUB_TOKEN, OPERATOR_TOKEN,
#   ARCHWIZ_GITHUB_TOKEN — the first that can list secrets on each target is the setter.
#   An admin setter is used ONLY to call `gh secret list/set`, never copied cross-repo.
# - Additive: a target secret that already exists is never overwritten.
# - Values flow secrets -> env -> stdin of `gh secret set`. Nothing is echoed; logs
#   and the job summary carry secret NAMES only.
name: Provision secrets (secret-to-secret)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = report only; apply = set missing secrets"
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: provision-secrets
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OWNER: timerloggedout-spec
      MODE: ${{ inputs.mode }}
      # Setter credential (never a value source)
      ADMIN_GH_ACTIONS: ${{ secrets.GH_ACTIONS }}
      ADMIN_OPERATOR: ${{ secrets.OPERATOR }}
      # Candidate value sources present (or not) in termux-monorepo. Empty = absent.
      SRC_ARCHWIZ_GITHUB_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN }}
      SRC_OPERATOR_GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
      SRC_OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
      SRC_GITLAB_CICD: ${{ secrets.GITLAB_CICD }}
      SRC_GITLAB_CICD_W_ORG_VIEW: ${{ secrets.GITLAB_CICD_W_ORG_VIEW }}
      SRC_CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
      SRC_GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
      SRC_GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
      SRC_GH_AW_CI_TRIGGER_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN }}
      SRC_GH_AW_AGENT_TOKEN: ${{ secrets.GH_AW_AGENT_TOKEN }}
      SRC_COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      SRC_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SRC_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SRC_CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      SRC_REPOSITORY_OBSERVATORY_TOKEN: ${{ secrets.REPOSITORY_OBSERVATORY_TOKEN }}
    steps:
      - name: Provision (names-only logging)
        shell: bash
        run: |
          set -uo pipefail
          # Mask every line of every value we may touch (secrets are auto-masked; belt and braces).
          for v in $(compgen -e | grep -E '^(ADMIN|SRC)_'); do
            [ -n "${!v}" ] || continue
            while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<<"${!v}"
          done

          # Setter = first credential (in order) that can LIST secrets on each target repo.
          # #184's `Gh_actions` PAT is stored under one of these names; probe instead of assuming.
          declare -A TOK
          [ -n "$ADMIN_GH_ACTIONS" ] && TOK[GH_ACTIONS]="$ADMIN_GH_ACTIONS"
          [ -n "$ADMIN_OPERATOR" ] && TOK[OPERATOR]="$ADMIN_OPERATOR"
          for c in OPERATOR_GITHUB_TOKEN OPERATOR_TOKEN ARCHWIZ_GITHUB_TOKEN; do
            v="SRC_$c"; [ -n "${!v:-}" ] && TOK[$c]="${!v}"
          done
          unset ADMIN_GH_ACTIONS ADMIN_OPERATOR
          SETTER_ORDER="GH_ACTIONS OPERATOR OPERATOR_GITHUB_TOKEN OPERATOR_TOKEN ARCHWIZ_GITHUB_TOKEN"
          present=""; for c in $SETTER_ORDER; do [ -n "${TOK[$c]:-}" ] && present+="$c "; done
          echo "setter candidates present: ${present:-none}"
          [ -n "$present" ] || { echo "::error::No setter credential present (GH_ACTIONS, OPERATOR, OPERATOR_GITHUB_TOKEN, OPERATOR_TOKEN, ARCHWIZ_GITHUB_TOKEN)"; exit 1; }
          SETTER="per-repo"

          # target_repo|target_secret|required|ordered value sources (non-admin only)|access check
          MAP='termux-monorepo|OPERATOR_GITHUB_TOKEN|yes|ARCHWIZ_GITHUB_TOKEN|github
          termux-monorepo|OPERATOR_TOKEN|no|OPERATOR_GITHUB_TOKEN,ARCHWIZ_GITHUB_TOKEN|github
          termux-monorepo|REPOSITORY_OBSERVATORY_TOKEN|no|GITLAB_CICD_W_ORG_VIEW|github
          gh-aw-mcpg_fork|CROSS_REPO_PAT|yes|CROSS_REPO_PAT,GITLAB_CICD|github
          gh-aw-mcpg_fork|GH_AW_GITHUB_TOKEN|yes|GH_AW_GITHUB_TOKEN,ARCHWIZ_GITHUB_TOKEN,GITLAB_CICD|github
          gh-aw-mcpg_fork|GH_AW_GITHUB_MCP_SERVER_TOKEN|yes|GH_AW_GITHUB_MCP_SERVER_TOKEN,GITLAB_CICD_W_ORG_VIEW|github
          gh-aw-mcpg_fork|GH_AW_CI_TRIGGER_TOKEN|no|GH_AW_CI_TRIGGER_TOKEN,GITLAB_CICD|github
          gh-aw_fork|GH_AW_GITHUB_TOKEN|yes|GH_AW_GITHUB_TOKEN,ARCHWIZ_GITHUB_TOKEN,GITLAB_CICD|github
          gh-aw_fork|GH_AW_GITHUB_MCP_SERVER_TOKEN|yes|GH_AW_GITHUB_MCP_SERVER_TOKEN,GITLAB_CICD_W_ORG_VIEW|github
          gh-aw_fork|COPILOT_GITHUB_TOKEN|yes|COPILOT_GITHUB_TOKEN|none
          gh-aw_fork|GH_AW_CI_TRIGGER_TOKEN|no|GH_AW_CI_TRIGGER_TOKEN,GITLAB_CICD|github
          gh-aw_fork|GH_AW_AGENT_TOKEN|no|GH_AW_AGENT_TOKEN|github
          gh-aw_fork|ANTHROPIC_API_KEY|no|ANTHROPIC_API_KEY|none
          gh-aw_fork|OPENAI_API_KEY|no|OPENAI_API_KEY|none
          gh-aw_fork|CODEX_API_KEY|no|CODEX_API_KEY,OPENAI_API_KEY|none'

          declare -A HAVE SET_BY
          for r in termux-monorepo gh-aw_fork gh-aw-mcpg_fork; do
            HAVE[$r]="__LIST_FAILED__"; SET_BY[$r]=""
            for c in $present; do
              if names="$(GH_TOKEN="${TOK[$c]}" gh secret list -R "$OWNER/$r" --json name --jq '.[].name' 2>/dev/null)"; then
                HAVE[$r]="$names"; SET_BY[$r]="$c"
                echo "listed $OWNER/$r via $c: $(printf '%s\n' "$names" | grep -c . ) secret names"; break
              fi
            done
            [ -n "${SET_BY[$r]}" ] || echo "::warning::no setter candidate can list secrets on $OWNER/$r"
          done

          S="$GITHUB_STEP_SUMMARY"
          { echo "## Secret provisioning ($MODE) — setter: \`$SETTER\` (names only)"; echo
            echo "| Repo | Secret | Req | Result |"; echo "|---|---|---|---|"; } >>"$S"
          set_n=0; missing_req=0
          while IFS='|' read -r repo name req srcs check; do
            repo="$(echo "$repo" | xargs)"; [ -n "$repo" ] || continue
            result=""
            if [ "${HAVE[$repo]}" = "__LIST_FAILED__" ]; then result="skipped: no setter can list secrets here"
            elif printf '%s\n' "${HAVE[$repo]}" | grep -qx "$name"; then result="already set (kept)"
            else
              chosen=""; notes=""
              IFS=',' read -ra cands <<<"$srcs"
              for c in "${cands[@]}"; do
                v="SRC_$c"; val="${!v:-}"
                [ -n "$val" ] || { notes+="$c absent; "; continue; }
                [ "$c" = "$name" ] && [ "$repo" = termux-monorepo ] && continue
                if [ "$check" = github ] && ! GH_TOKEN="$val" gh api "repos/$OWNER/$repo" --silent >/dev/null 2>&1; then
                  notes+="$c cannot read $repo; "; continue
                fi
                chosen="$c"; break
              done
              if [ -z "$chosen" ]; then
                result="MISSING (${notes%; })"; [ "$req" = yes ] && missing_req=$((missing_req+1))
              elif [ "$MODE" != apply ]; then
                result="would set from \`$chosen\`"
              else
                v="SRC_$chosen"
                if printf '%s' "${!v}" | GH_TOKEN="${TOK[${SET_BY[$repo]}]}" gh secret set "$name" -R "$OWNER/$repo" >/dev/null 2>&1; then
                  result="SET from \`$chosen\`"; set_n=$((set_n+1))
                else
                  result="FAILED gh secret set (from \`$chosen\`)"
                fi
              fi
            fi
            echo "$repo/$name: $result"
            echo "| $repo | \`$name\` | $req | $result (setter: ${SET_BY[$repo]:-none}) |" >>"$S"
          done <<<"$MAP"
          { echo; echo "Set: $set_n. Required still missing: $missing_req."
            echo "A MISSING secret has no value anywhere in termux-monorepo Actions; save it once (e.g. scripts/termux/provision-secrets.sh set)."; } >>"$S"
          echo "set=$set_n required_missing=$missing_req"
