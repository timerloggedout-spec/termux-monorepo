name: Publish wiki

on:
  push:
    branches: [master, master-staging]
    paths:
      - "wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

concurrency:
  group: publish-wiki
  # Match agent-feedback-linear-sync: do not cancel in-flight wiki publishes
  # (a workflow_dispatch from one ref must not be dropped by an unrelated push).
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish wiki/ → GitHub Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: wiki
          strategy: clone
          # First bootstrap only: if the wiki has never been initialized, create a
          # dummy page in the Wiki UI, or temporarily set strategy: init once.
          token: ${{ github.token }}
          preprocess: true
          disable-empty-commits: true
          commit-message: "wiki: sync from ${{ github.sha }}"
