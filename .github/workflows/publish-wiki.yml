name: Publish wiki

on:
  push:
    branches: [master, master-staging]
    paths:
      - "wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

concurrency:
  group: publish-wiki
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish wiki/ → GitHub Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e # v5.0.6
        with:
          path: wiki
          strategy: clone
          token: ${{ github.token }}
          preprocess: true
          disable-empty-commits: true
          commit-message: "wiki: sync from ${{ github.sha }}"
