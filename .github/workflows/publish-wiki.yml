# managed-by: timerloggedout-spec/repository-surface-reconciler
name: Publish wiki

on:
  push:
    paths:
      - "wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the managed publisher without updating the GitHub Wiki"
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-wiki
  # A manual run must not be dropped because a source update is already publishing.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Explain dry-run mode
        if: ${{ inputs.dry_run }}
        run: 'echo "Dry run requested: the GitHub Wiki was not modified."'

      - name: Reject a non-default branch publish request
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "Ref ${GITHUB_REF_NAME} is not the repository default branch; refusing to publish."
          exit 1

      - name: Publish wiki/ → GitHub Wiki
        if: ${{ !inputs.dry_run && github.ref_name == github.event.repository.default_branch }}
        uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e # v5
        with:
          path: wiki
          strategy: clone
          # First bootstrap only: create any page in the Wiki UI, or temporarily
          # set strategy: init for one reviewed run.
          token: ${{ github.token }}
          preprocess: true
          disable-empty-commits: true
          commit-message: "wiki: sync from ${{ github.sha }}"
