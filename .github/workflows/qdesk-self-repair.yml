name: qdesk self-repair
# QDesk self-repair loop (SIE ⇒ Desk QUE). Proposal:
# docs/proposals/active/qdesk-self-repair/PROPOSAL.md
# One batched pass every 3h (usage budget is tight; no polling):
#   observe  failing master workflows ∨ stale feeds ⇒ que:self-repair items (dedupe workflow ∧ signature)
#   promote  que:self-repair PRs: green ∧ additive ∧ ≥2 candidates ∧ outside DoE pass ⇒ self-merge;
#            destructive ∨ secrets ∨ money ⇒ Owner packet on hark:queue
#   learn    closed items labeled sr:verified ∨ sr:regression ∧ role:* ⇒ weights.json step
# Delphi feeds ∧ the C15 chain belong to the Delphi room and are skipped.
on:
  schedule:
    - cron: "41 */3 * * *"
  pull_request:
    paths:
      - "scripts/que/**"
      - "tests/que/**"
      - "brain/src/adapters/**"
      - "brain/src/lib.rs"
      - "docs/schemas/que-sie-stage-v1.schema.json"
      - ".github/workflows/qdesk-self-repair.yml"
  workflow_run:
    workflows:
      - "repo gate"
      - "termux smoke"
      - "DO Statement Style"
      - "Repository development evaluation"
      - "Peer review orchestrator"
      - "RECON INTEL discovery"
      - "archwiz dangle check"
    types: [completed]
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read
concurrency:
  group: qdesk-self-repair
  cancel-in-progress: false
jobs:
  sie-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SIE stage contract and QDesk intake adapter
        run: |
          python3 scripts/que/sie_pipeline.py --self-test
          python3 -m unittest discover -s tests/que -p 'test_sie_pipeline.py' -v
  loop:
    if: github.event_name != 'pull_request' && vars.QDESK_LOOP_ENABLED != 'false' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint Swarm App token (falls back to GITHUB_TOKEN)
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e
        with:
          app-id: ${{ vars.TERMUX_FLEET_SWARM_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build branch reconciliation inventory
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          python3 scripts/branch_reconciliation_registry.py \
            --repo "${GITHUB_REPOSITORY}" \
            --default-branch "${{ github.event.repository.default_branch }}"
      - name: Validate SIE stage contract
        run: |
          python3 scripts/que/sie_pipeline.py --self-test
          python3 -m unittest discover -s tests/que -p 'test_sie_pipeline.py' -v
      - name: Observe ∧ promote ∧ learn
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          QUE_SR_WINDOW_HOURS: "6"
        run: |
          echo "token_source=${{ steps.app.outcome == 'success' && 'swarm-app' || 'github-token' }}"
          python3 scripts/que/self_repair.py --branch-inventory artifacts/branch-reconciliation/inventory.json
      - name: Retain BRR evidence
        uses: actions/upload-artifact@v4
        with:
          name: branch-reconciliation-${{ github.run_id }}
          path: artifacts/branch-reconciliation/
          if-no-files-found: error
          retention-days: 90
      - name: Commit learned weights (only on change)
        run: |
          git config user.name "termux-fleet-swarm[bot]"
          git config user.email "termux-fleet-swarm[bot]@users.noreply.github.com"
          git add ops/que/self-repair/weights.json
          if git diff --cached --quiet; then echo "no weight change"; exit 0; fi
          git commit -m "que(self-repair): learn role weights [skip render]"
          for attempt in 1 2 3; do git push && break; git pull --rebase origin master; done
