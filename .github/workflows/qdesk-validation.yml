name: QDesk validation

on:
  pull_request:
    paths:
      - 'apps/tribute-dashboard/qdesk.html'
      - 'apps/tribute-dashboard/qdesk.css'
      - 'apps/tribute-dashboard/qdesk.js'
      - 'tests/qdesk.test.cjs'
      - 'tests/test_qdesk_dashboard.py'
      - '.github/workflows/qdesk-validation.yml'

permissions:
  contents: read

jobs:
  qdesk-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node projection and quarantine tests
        run: node --test tests/qdesk.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Static page and authority-boundary tests
        run: pytest -q tests/test_qdesk_dashboard.py
