name: QUE auto-claim regression

# #5546 gate 3: run the auto-claim decision suite (scripts/dispatch/test_auto_claim.py)
# ∧ the BRR companion suite (#5552) on every change to the dispatch/QUE planes.
# Linked from orchestration-regression-guard.yml (step "Run QUE auto-claim regression").

on:
  push:
    branches: [master]
    paths:
      - 'scripts/dispatch/**'
      - 'scripts/que/**'
      - '.github/workflows/que-auto-claim-regression.yml'
  pull_request:
    paths:
      - 'scripts/dispatch/**'
      - 'scripts/que/**'
      - '.github/workflows/que-auto-claim-regression.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: que-auto-claim-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install pytest
        run: python3 -m pip install --quiet --disable-pip-version-check 'pytest>=8,<9'
      - name: Run auto-claim decision suite (#5286 ∧ #5546 gate 3)
        run: python3 -m pytest -q scripts/dispatch/test_auto_claim.py
      - name: Run BRR companion suite (#5552)
        run: python3 -m pytest -q scripts/que/test_brr_companion_suite.py
      - name: Emit gate-3 receipt
        run: echo "::notice title=que-gate-3::auto-claim ∧ brr-companion suites ✓ at $GITHUB_SHA"
