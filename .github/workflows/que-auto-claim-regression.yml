name: QUE BRR and self-repair regression

# #5552: run BRR companion and QDesk self-repair policy tests.
# Auto-claim remains owned by orchestration-regression-guard.yml to avoid duplicate quota.

on:
  push:
    branches: [master]
    paths:
      - 'scripts/que/**'
      - 'tests/test_que_self_repair.py'
      - 'tests/test_que_self_repair.py'
      - '.github/workflows/que-auto-claim-regression.yml'
  pull_request:
    paths:
      - 'scripts/que/**'
      - '.github/workflows/que-auto-claim-regression.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: que-brr-self-repair-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install pytest
        run: python3 -m pip install --quiet --disable-pip-version-check 'pytest>=8,<9'
      - name: Run BRR companion and QDesk policy suites (#5552)
        run: python3 -m pytest -q scripts/que/test_brr_companion_suite.py tests/test_que_self_repair.py
      - name: Emit regression receipt
        run: echo "::notice title=que-brr-regression::BRR companion ∧ QDesk policy suites ✓ at $GITHUB_SHA"
