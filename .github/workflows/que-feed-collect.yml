name: que-feed-collect
# QUE producer: queue-by-tier · priority windows · governor
# feeds + the T1 measurement-plane transition events
# (ops/que/). Single-flight on a 10-minute cadence; commits
# land via the Termux Fleet Swarm App so downstream
# consumers trigger on the push.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: que-feed-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Mint Swarm App token
        id: app
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e
        with:
          app-id: ${{ vars.TERMUX_FLEET_SWARM_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/checkout@v4
        with:
          ref: master
          path: .que-backoff-master
          persist-credentials: false
          sparse-checkout: |
            ops/que/feeds/api-backoff.json
          sparse-checkout-cone-mode: false
      - name: Refresh API backoff marker from current master
        run: |
          python3 scripts/que/refresh_api_backoff.py \
            .que-backoff-master/ops/que/feeds/api-backoff.json \
            ops/que/feeds/api-backoff.json
          rm -rf .que-backoff-master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect one QUE cycle
        id: collect
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 scripts/que/que_feed_collect.py
      - name: Checkout current master for API backoff publication
        if: ${{ always() && steps.collect.outputs.rate_limit_defer_until != '' }}
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          ref: master
          path: .que-backoff-publish
          persist-credentials: true
          sparse-checkout: |
            ops/que/feeds/api-backoff.json
          sparse-checkout-cone-mode: false
      - name: Persist long API retry window
        if: ${{ always() && steps.collect.outputs.rate_limit_defer_until != '' }}
        env:
          RETRY_NOT_BEFORE: ${{ steps.collect.outputs.rate_limit_defer_until }}
        run: |
          set -eu
          repo=.que-backoff-publish
          git -C "$repo" config user.name "termux-fleet-swarm[bot]"
          git -C "$repo" config user.email "termux-fleet-swarm[bot]@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3; do
            git -C "$repo" fetch origin master
            git -C "$repo" reset --hard FETCH_HEAD
            python3 scripts/que/persist_api_backoff.py \
              "$repo/ops/que/feeds/api-backoff.json" "$RETRY_NOT_BEFORE"
            git -C "$repo" add -- ops/que/feeds/api-backoff.json
            if git -C "$repo" diff --cached --quiet; then
              echo "master already has an equal or later API retry deadline"
              pushed=1
              break
            fi
            git -C "$repo" commit -m "que: persist API retry deadline"
            if git -C "$repo" push origin HEAD:refs/heads/master; then
              pushed=1
              break
            fi
            echo "push rejected (attempt $attempt) — rereading current master marker"
          done
          if [ "$pushed" -ne 1 ]; then
            echo "failed to persist API retry deadline after 3 pushes" >&2
            exit 1
          fi
      - name: Commit feeds + events (only on change)
        run: |
          git config user.name "termux-fleet-swarm[bot]"
          git config user.email "termux-fleet-swarm[bot]@users.noreply.github.com"
          git add ops/que apps/tribute-dashboard/data/que-queue-feed.json apps/tribute-dashboard/data/queue-by-tier.json apps/tribute-dashboard/data/governor.json apps/tribute-dashboard/data/priority-windows.json apps/tribute-dashboard/data/que-governor.json apps/tribute-dashboard/data/que-priority-windows.json
          if git diff --cached --quiet; then
            echo "no feed change this cycle"
          else
            git commit -m "que: feed cycle $(date -u +%Y-%m-%dT%H:%MZ)"
            # master moves under this run on a busy fleet:
            # rebase onto the new head and retry the push
            # (first live cycle lost exactly this race)
            pushed=0
            for attempt in 1 2 3; do
              if git push; then
                pushed=1
                break
              fi
              echo "push rejected (attempt $attempt) — rebasing"
              git pull --rebase origin master
            done
            if [ "$pushed" -ne 1 ]; then
              echo "failed to publish QUE feeds after 3 pushes" >&2
              exit 1
            fi
          fi
