name: QUE SIE Contract

on:
  pull_request:
    paths:
      - "scripts/que/sie_pipeline.py"
      - "scripts/que/self_repair.py"
      - "tests/que/**"
      - "docs/schemas/que-sie-stage-v1.schema.json"
      - ".github/workflows/que-sie-contract.yml"
  push:
    branches: ["master"]
    paths:
      - "scripts/que/sie_pipeline.py"
      - "scripts/que/self_repair.py"
      - "tests/que/**"
      - "docs/schemas/que-sie-stage-v1.schema.json"
      - ".github/workflows/que-sie-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: que-sie-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate lifecycle contract
        run: python3 scripts/que/sie_pipeline.py --self-test
      - name: Run lifecycle and intake regression tests
        run: python3 -m unittest discover -s tests/que -p "test_sie_pipeline.py" -v
