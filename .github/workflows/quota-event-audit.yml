name: quota-event-audit

# Event Audit gate (owner standard 2026-11-01: the events register
# gets audited into improvements). State-gated cadence per cadence
# law: NO cron - the gate fires when the register grows (push on the
# events file) or on manual dispatch. The checker proves coverage:
# every register event must be referenced by >=1 audit finding in
# ops/quota/rate-limit-event-audits.json. A red run = an audit is
# owed; the audit content itself is authored by the quota-specialist
# lane, never by this workflow. Shape follows graph-matrix-probe.
#
# Publishing leg (owner directive 2026-11-01: the Event Audit is
# published .html): the sync-twin job keeps the dashboard twin
# apps/tribute-dashboard/data/rate-limit-event-audits.json
# byte-identical to the record (single-writer, Swarm app token,
# direct commit - the twin path is not a trigger path, so no loop).
# It runs only when the coverage gate passes: an unaudited register
# never reaches the page.

on:
  push:
    branches: [master]
    paths:
      - "ops/quota/rate-limit-events.json"
      - "ops/quota/rate-limit-event-audits.json"
  workflow_dispatch:

concurrency:
  group: quota-event-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-gate:
    name: event audit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit coverage check
        id: audit
        run: |
          set -euo pipefail
          python3 scripts/quota_event_audit.py | tee -a "$GITHUB_STEP_SUMMARY"

  sync-twin:
    name: sync dashboard twin
    needs: audit-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Mint Swarm app token (F1)
        id: swarm-token
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3 release
        with:
          app-id: ${{ vars.TERMUX_FLEET_SWARM_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          token: ${{ steps.swarm-token.outputs.token }}
      - name: Copy record to dashboard twin (byte-identical)
        run: |
          set -euo pipefail
          cp ops/quota/rate-limit-event-audits.json \
            apps/tribute-dashboard/data/rate-limit-event-audits.json
          cmp ops/quota/rate-limit-event-audits.json \
            apps/tribute-dashboard/data/rate-limit-event-audits.json
      - name: Commit twin to master (single-writer)
        run: |
          set -euo pipefail
          git add apps/tribute-dashboard/data/rate-limit-event-audits.json
          if git diff --cached --quiet; then
            echo "twin already identical - nothing to commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name="termux-fleet-swarm[bot]" \
              -c user.email="termux-fleet-swarm[bot]@users.noreply.github.com" \
              commit -m "chore(quota): event-audits dashboard twin sync (automated)"
          git push origin master
