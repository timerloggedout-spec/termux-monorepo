name: re-taxonomy intake

# Issue trigger for the Reverse Engineering taxonomy/toolkit category
# (docs/ops/RE-TAXONOMY-TEMPLATES.md). Filing a reverse-engineering-taxonomy
# or reverse-engineering-taxonomy-record form (label `re-taxonomy`) IS the
# trigger. Exactly ONE issues event per filing: types opened/reopened/edited,
# no `labeled`, no concurrency group (research-intake fix, PRs #2132/#2137).
# Deterministic parsing only; trusted default-branch code; the issue body is
# data, never code. No pull_request_target (Nov-2 rules). No provisioned
# secrets: only the job GITHUB_TOKEN with issues:write.

on:
  issues:
    types: [opened, reopened, edited]

permissions: {}

jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 're-taxonomy')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted default-branch control plane
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Parse filing into the taxonomy intake record
        env:
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
        run: |
          set -uo pipefail
          printf '%s' "$ISSUE_BODY" > /tmp/re-taxonomy-body.md
          set +e
          python3 -m scripts.reverse_engineering.re_taxonomy_intake /tmp/re-taxonomy-body.md \
            --markdown --issue "${{ github.event.issue.number }}" \
            --taxonomy ops/reverse_engineering/taxonomy.json > /tmp/re-taxonomy-record.md
          code=$?
          set -e
          {
            cat /tmp/re-taxonomy-record.md
            echo
            echo "---"
            if [ "$code" -eq 0 ]; then
              echo "[MUSEai]@{role:{research-triggers}} taxonomy intake record generated by \`re_taxonomy_intake\` from this filing, validated against taxonomy.json (vocab, parent/tool resolution, stage order). The reverse-engineering-toolkits lane lands validated nodes in taxonomy.json; validated placements are filed on the Taxonomy / Toolkit Record form. Edit the issue to re-run."
            else
              echo "[MUSEai]@{role:{research-triggers}} intake refused (exit $code): an out-of-vocabulary tag, an unresolvable parent or toolchain tool, a tool node without tool_role tags, out-of-order toolchain stages, or a submitter not in Role{Moniker} form. Fix the fields and edit the issue to re-run."
            fi
          } > /tmp/comment.md
          hash="$(sha256sum /tmp/re-taxonomy-record.md | cut -d' ' -f1)"
          echo "<!-- re-taxonomy-intake:${hash} -->" >> /tmp/comment.md
          echo "RECORD_HASH=${hash}" >> "$GITHUB_ENV"
          cat /tmp/comment.md

      - name: Comment the record on the issue (hash-deduped)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" --paginate \
              --jq '[.[] | .body // ""] | join("\n")' | grep -q "re-taxonomy-intake:${RECORD_HASH}"; then
            echo "Identical taxonomy intake record already posted (hash ${RECORD_HASH}); skipping duplicate."
            exit 0
          fi
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md
