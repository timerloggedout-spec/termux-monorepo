name: readme-extractor-image
# Builds a ~5 MB busybox image holding README.md and pushes it to GHCR.
# A Render image-backed service pulls it, so its deploys skip Render's
# pipeline minutes. Sparse checkout only; no full clone.
on:
  push:
    branches: [master]
    paths:
      - README.md
      - ops/render-image/**
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: readme-extractor-image
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            README.md
            ops/render-image
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/termux-readme-extractor
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} \
            -f ops/render-image/Dockerfile -t "$IMG:latest" -t "$IMG:${GITHUB_SHA::7}" .
          docker push "$IMG:latest"
          docker push "$IMG:${GITHUB_SHA::7}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMG:latest")
          SIZE=$(docker image inspect "$IMG:latest" --format='{{.Size}}')
          echo "::notice title=readme-extractor-image::pushed ${DIGEST} size_bytes=${SIZE}"
