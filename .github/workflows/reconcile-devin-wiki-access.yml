name: Reconcile Devin Wiki access

on:
  schedule:
    - cron: "41 5 * * *"
  create:
  workflow_dispatch:
    inputs:
      apply:
        description: "Grant missing selected-repository Devin GitHub App access through the documented GitHub endpoint"
        required: true
        default: false
        type: boolean
      index:
        description: "Devin Wiki branch indexing scope for this run (schedule runs always use first-pass, account-wide)"
        required: true
        default: skip
        type: choice
        options:
          - skip
          - first-pass
          - all
          - single
      index_repos:
        description: "Repositories to index: this repository only, or every accessible repository in the account"
        required: true
        default: this-repo
        type: choice
        options:
          - this-repo
          - all-repos
      index_branch:
        description: "Branch name when index = single (this-repo only)"
        required: false
        default: ""
        type: string
      approve_nonlow_effort:
        description: "Approve a bulk index=all run at medium/high DeepWiki effort (projected ACUs are reported by the indexer)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: reconcile-devin-wiki-access
  cancel-in-progress: false

jobs:
  reconcile:
    name: Discover Devin Wiki indexing eligibility for accessible repositories
    if: github.event_name != 'create'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout control-plane source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reconcile supported Devin GitHub App access
        env:
          # Scheduled runs reconcile newly discovered repositories. A manual run
          # is read-only unless its explicit apply input is true.
          APPLY: ${{ github.event_name == 'schedule' && 'true' || inputs.apply || 'false' }}
          # The selected token must be an existing classic PAT with repo scope
          # when GitHub App assignment is required. No new credential is minted.
          GH_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          arguments=(
            --source-repo "${GITHUB_REPOSITORY}"
            --report "reports/devin-wiki-access-detail.json"
            --summary-report "reports/devin-wiki-access-summary.json"
          )
          if [[ "${APPLY}" == "true" ]]; then
            arguments+=(--apply)
          fi
          python3 scripts/agentic/reconcile_devin_wiki_access.py "${arguments[@]}"
          rm -f reports/devin-wiki-access-detail.json

      - name: Upload redacted Devin Wiki access summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devin-wiki-access-${{ github.run_id }}
          path: reports/devin-wiki-access-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Index Devin Wiki branches
        env:
          # Existing operator-token precedence; used only to list this
          # repository's branches and open pull requests.
          GH_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          # Devin v3 indexing credential (names only). The token is a Devin
          # service-user token with IndexOrgRepositories, NOT a GitHub PAT.
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ vars.DEVIN_ORG_ID }}
          DEVIN_WIKI_EFFORT: ${{ vars.DEVIN_WIKI_EFFORT }}
          INDEX_REQUEST: ${{ inputs.index || 'skip' }}
          INDEX_REPOS: ${{ inputs.index_repos || 'this-repo' }}
          INDEX_BRANCH_INPUT: ${{ inputs.index_branch || '' }}
          APPROVE_NONLOW_EFFORT: ${{ inputs.approve_nonlow_effort || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p reports
          summary="reports/devin-wiki-indexing-summary.json"
          write_summary() {
            python3 - "${summary}" "$1" "$2" <<'PY'
          import json, sys
          path, state, detail = sys.argv[1], sys.argv[2], sys.argv[3]
          payload = {
              "schema_version": 1,
              "provider": "Devin Wiki indexing (v3 API)",
              "state": state,
              "detail": detail,
              "additive_only": True,
              "redaction": "Devin org ID, API token, per-branch commits and job IDs are intentionally omitted.",
          }
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY
          }
          scope=""
          extra=()
          repo_args=(--repo "${GITHUB_REPOSITORY}")
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            scope="first-pass"
            repo_args=(--all-repos)
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${INDEX_REPOS}" == "all-repos" ]]; then
              repo_args=(--all-repos)
            fi
            case "${INDEX_REQUEST}" in
              first-pass|all) scope="${INDEX_REQUEST}" ;;
              single)
                scope="single"
                if [[ "${INDEX_REPOS}" == "all-repos" ]]; then
                  write_summary "invalid_input" "index=single applies to one repository; combine it with index_repos=this-repo."
                  echo "::error title=Devin Wiki indexing::index=single requires index_repos=this-repo."
                  exit 0
                fi
                if [[ -z "${INDEX_BRANCH_INPUT}" ]]; then
                  write_summary "invalid_input" "index=single requires the index_branch input."
                  echo "::error title=Devin Wiki indexing::index=single requires the index_branch input."
                  exit 0
                fi
                extra+=(--branch "${INDEX_BRANCH_INPUT}")
                ;;
              *) scope="" ;;
            esac
          fi
          if [[ -z "${scope}" ]]; then
            write_summary "skipped" "No indexing scope selected for this run."
            exit 0
          fi
          if [[ -z "${DEVIN_API_KEY}" || -z "${DEVIN_ORG_ID}" ]]; then
            write_summary "not_provisioned" "Missing DEVIN_API_KEY secret and/or DEVIN_ORG_ID variable (names only)."
            echo "::warning title=Devin Wiki indexing not provisioned::Set the DEVIN_API_KEY Actions secret (Devin service-user token with IndexOrgRepositories) and the DEVIN_ORG_ID Actions variable (org-... ID from Devin Settings)."
            exit 0
          fi
          arguments=(
            "${repo_args[@]}"
            --scope "${scope}"
            --report "reports/devin-wiki-indexing-detail.json"
            --summary-report "${summary}"
          )
          if [[ ${#extra[@]} -gt 0 ]]; then
            arguments+=("${extra[@]}")
          fi
          if [[ "${APPROVE_NONLOW_EFFORT}" == "true" ]]; then
            arguments+=(--approve-nonlow-effort)
          fi
          python3 scripts/agentic/devin_wiki_indexing.py "${arguments[@]}"
          rm -f reports/devin-wiki-indexing-detail.json

      - name: Upload redacted Devin Wiki indexing summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devin-wiki-indexing-${{ github.run_id }}
          path: reports/devin-wiki-indexing-summary.json
          if-no-files-found: error
          retention-days: 14

  index-created-branch:
    name: Index a newly created branch in Devin Wiki
    if: github.event_name == 'create' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout control-plane source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Index the created branch
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ vars.DEVIN_ORG_ID }}
          DEVIN_WIKI_EFFORT: ${{ vars.DEVIN_WIKI_EFFORT }}
          NEW_BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          mkdir -p reports
          summary="reports/devin-wiki-indexing-summary.json"
          if [[ -z "${DEVIN_API_KEY}" || -z "${DEVIN_ORG_ID}" ]]; then
            python3 - "${summary}" <<'PY'
          import json, sys
          payload = {
              "schema_version": 1,
              "provider": "Devin Wiki indexing (v3 API)",
              "state": "not_provisioned",
              "detail": "Missing DEVIN_API_KEY secret and/or DEVIN_ORG_ID variable (names only).",
              "additive_only": True,
              "redaction": "Devin org ID, API token, per-branch commits and job IDs are intentionally omitted.",
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY
            echo "::warning title=Devin Wiki indexing not provisioned::Set the DEVIN_API_KEY Actions secret (Devin service-user token with IndexOrgRepositories) and the DEVIN_ORG_ID Actions variable (org-... ID from Devin Settings)."
            exit 0
          fi
          python3 scripts/agentic/devin_wiki_indexing.py \
            --repo "${GITHUB_REPOSITORY}" \
            --scope single \
            --branch "${NEW_BRANCH}" \
            --report "reports/devin-wiki-indexing-detail.json" \
            --summary-report "${summary}"
          rm -f reports/devin-wiki-indexing-detail.json

      - name: Upload redacted Devin Wiki indexing summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devin-wiki-indexing-${{ github.run_id }}
          path: reports/devin-wiki-indexing-summary.json
          if-no-files-found: error
          retention-days: 14
