name: Repository Provisioner

run-name: "Provision controller-2-export"

on:
  push:
    branches: [master]
    paths:
      - ops/provisioning/controller-2-export.json
  workflow_dispatch:

concurrency:
  group: repository-provisioner-controller-2-export
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    name: Create personal-account export repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN || secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.OPERATOR }}
      EXPECTED_OWNER: timerloggedout-spec
    steps:
      - name: Check out provisioning manifest
        uses: actions/checkout@v4

      - name: Validate request and create repository
        id: create
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?An existing administrator Actions secret is required}"

          manifest=ops/provisioning/controller-2-export.json
          repo_name="$(jq -r '.name' "$manifest")"
          description="$(jq -r '.description' "$manifest")"
          visibility="$(jq -r '.visibility' "$manifest")"

          if [[ ! "$repo_name" =~ ^[a-z0-9]([a-z0-9-]{0,98}[a-z0-9])?$ ]]; then
            echo "::error::Invalid repository slug in $manifest"
            exit 1
          fi

          owner="$(gh api user --jq '.login')"
          if [[ -z "$owner" || "${owner,,}" != "${EXPECTED_OWNER,,}" ]]; then
            echo "::error::OPERATOR token identity must be $EXPECTED_OWNER; received ${owner:-empty}."
            exit 1
          fi

          case "$visibility" in
            public) private=false ;;
            private) private=true ;;
            *)
              echo "::error::Unsupported visibility: $visibility"
              exit 1
              ;;
          esac

          if created="$(gh api "/repos/$owner/$repo_name" 2>/dev/null)"; then
            actual_owner="$(jq -r '.owner.login // empty' <<<"$created")"
            actual_name="$(jq -r '.name // empty' <<<"$created")"
            actual_private="$(jq -r '.private' <<<"$created")"
            if [[ "${actual_owner,,}" != "${owner,,}" || "$actual_name" != "$repo_name" || "$actual_private" != "$private" ]]; then
              echo "::error::Existing repository metadata differs from the manifest."
              exit 1
            fi
          else
            created="$(gh api --method POST /user/repos \
              -f "name=$repo_name" \
              -f "description=$description" \
              -F "private=$private" \
              -F "auto_init=true" \
              -F "has_issues=true" \
              -F "has_wiki=false")"
          fi

          created_owner="$(jq -r '.owner.login // empty' <<<"$created")"
          created_name="$(jq -r '.name // empty' <<<"$created")"
          default_branch="$(jq -r '.default_branch // empty' <<<"$created")"
          repo_url="$(jq -r '.html_url // empty' <<<"$created")"
          repo_id="$(jq -r '.id // empty' <<<"$created")"
          if [[ "${created_owner,,}" != "${owner,,}" || "$created_name" != "$repo_name" || -z "$default_branch" || -z "$repo_id" ]]; then
            echo "::error::GitHub returned repository metadata outside the requested identity."
            exit 1
          fi

          printf 'url=%s\nid=%s\ndefault_branch=%s\n' "$repo_url" "$repo_id" "$default_branch" >> "$GITHUB_OUTPUT"

      - name: Publish provisioning receipt
        env:
          REPOSITORY_URL: ${{ steps.create.outputs.url }}
          REPOSITORY_ID: ${{ steps.create.outputs.id }}
          DEFAULT_BRANCH: ${{ steps.create.outputs.default_branch }}
        shell: bash
        run: |
          {
            echo "## Controller export repository provisioned"
            echo
            echo "- Repository: [$REPOSITORY_URL]($REPOSITORY_URL)"
            echo "- Repository ID: $REPOSITORY_ID"
            echo "- Visibility: public"
            echo "- Default branch: $DEFAULT_BRANCH"
            echo "- Initialization: GitHub auto_init (default README.md)"
            echo "- Credential: existing OPERATOR Actions secret (value withheld)"
          } >> "$GITHUB_STEP_SUMMARY"
