name: research intake

# Issue triggers for the research pipeline (docs/ops/RESEARCH-TRIGGERS.md).
# Filing a research template issue IS the trigger (target-intake / delphi-intake
# precedent: event trigger, no cron). Events:
#   issues opened/labeled/reopened with label research, research:provider or
#     research:service -> parse the form body into the seed/starter record
#     for the pipeline the kind routes to, comment it back on the issue.
#   issue_comment created containing '<!-- request-research -->' plus
#     'key: value' lines -> same record from the comment command.
# Deterministic parsing only (no LLM, no model ballots). Runs trusted
# default-branch code only; the issue/comment body is data, never code.
# No pull_request_target (Nov-2 rules). No provisioned secrets: only the
# job's GITHUB_TOKEN with issues:write; secret VALUES in a body are refused
# by the parser (Actions secret NAMEs only, issue #184 plane).

on:
  issues:
    types: [opened, labeled, reopened]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: research-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      (github.event_name == 'issues' &&
       (contains(github.event.issue.labels.*.name, 'research:provider') ||
        contains(github.event.issue.labels.*.name, 'research:service') ||
        (github.event.action != 'labeled' &&
         contains(github.event.issue.labels.*.name, 'research')) ||
        (github.event.action == 'labeled' &&
         startsWith(github.event.label.name, 'research')))) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       contains(github.event.comment.body || '', '<!-- request-research -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted default-branch control plane
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Parse intake into the seed/starter record
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          set -uo pipefail
          if [ -n "$COMMENT_BODY" ]; then
            printf '%s' "$COMMENT_BODY" > /tmp/research-body.md
          else
            printf '%s' "$ISSUE_BODY" > /tmp/research-body.md
          fi
          kind=""
          case ",$LABELS," in
            *",research:provider,"*) kind="provider" ;;
            *",research:service,"*) kind="service" ;;
          esac
          set +e
          if [ -n "$kind" ]; then
            python3 -m scripts.research.research_intake /tmp/research-body.md \
              --kind "$kind" --markdown > /tmp/research-record.md
          else
            python3 -m scripts.research.research_intake /tmp/research-body.md \
              --markdown > /tmp/research-record.md
          fi
          code=$?
          set -e
          {
            cat /tmp/research-record.md
            echo
            echo "---"
            if [ "$code" -eq 0 ]; then
              echo "[MUSEai]@{role:{research-triggers}} seed/starter record generated by \`research_intake\` from this intake. Research signal only — adoption stays research-only until a separate evaluation promotes it. Add label \`research:provider\` / \`research:service\` or post a \`<!-- request-research -->\` comment to re-run."
            else
              echo "[MUSEai]@{role:{research-triggers}} intake refused (exit $code): missing id/name, a bad observatory signal, or a secret VALUE instead of an Actions secret NAME. Fix the fields and re-label or re-comment to re-run."
            fi
          } > /tmp/comment.md
          cat /tmp/comment.md

      - name: Comment the record on the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md
