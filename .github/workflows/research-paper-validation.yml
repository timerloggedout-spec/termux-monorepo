name: Research and paper accounting validation
on:
  pull_request:
    paths:
      - 'src/advanced_research*'
      - 'src/swarms_*'
      - 'src/telemetry.py'
      - 'termux-multi-agent/src/__init__.py'
      - 'termux-multi-agent/src/telemetry.py'
      - 'llm_api_hub/**'
      - 'scripts/swarms/**'
      - 'scripts/model_selection_market/**'
      - 'integrations/swarms/**'
      - 'tests/test_advanced_research*'
      - 'tests/test_research_*'
      - 'tests/test_paper_accounting*'
      - 'tests/test_research_paper_workflow.py'
      - 'scripts/ci/research_paper_receipt.py'
      - '.github/workflows/research-paper-validation.yml'
      - '.github/workflows/continuous-evaluation.yml'
  push:
    branches: ['cue/implement-thub017-msm005']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-paper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bounded-offline:
    name: Pinned Research and MSM-005 offline evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESEARCH_PAPER_EVIDENCE_DIR: /tmp/research-paper-evidence
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Test the candidate itself, not an unidentifiable synthetic merge SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 PyYAML==6.0.3 uvicorn==0.54.0 fastapi==0.143.3 httpx==0.28.1
      - name: Prepare evidence directory
        run: mkdir -p /tmp/research-paper-evidence
      - name: Offline runtime, admission, telemetry and accounting regressions
        run: |
          python -m pytest -q tests/test_advanced_research_runtime.py tests/test_research_admission.py tests/test_research_hub_execution.py tests/test_research_telemetry.py tests/test_research_live*.py tests/test_paper_accounting.py tests/test_research_paper_evidence.py tests/test_research_paper_workflow.py tests/test_swarms*.py tests/test_llm_api_hub_server.py tests/test_research_provider_hub.py tests/test_msm_paper_wallet.py scripts/model_selection_market/test_msm.py --junitxml=/tmp/research-paper-evidence/tests.xml
      - name: Repository gate on candidate
        run: python3 scripts/ci/repo_gate.py --base d2778bcc25966533ccd2f5bc1991aab672fb9cbe > /tmp/research-paper-evidence/repo-gate.txt 2>&1
      - name: Require clean tracked candidate after tests
        run: git diff --exit-code HEAD --
      - name: Termux smoke on candidate (Linux only)
        run: python3 scripts/ci/termux_smoke.py --json > /tmp/research-paper-evidence/termux-smoke.json
      - name: Bind receipt to candidate, workflow and artifact hashes
        if: always()
        run: |
          python3 scripts/ci/research_paper_receipt.py --output /tmp/research-paper-evidence/receipt.json $(find /tmp/research-paper-evidence -maxdepth 1 -type f ! -name receipt.json -printf ' --artifact %p')
      - name: Upload bounded offline validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-paper-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: /tmp/research-paper-evidence/
          retention-days: 14
          if-no-files-found: error
  rust-hub-offline:
    name: Locked Rust worker through shared hub admission
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install fake-hub test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 uvicorn==0.54.0 fastapi==0.143.3 httpx==0.28.1
      - name: Build and unit-test immutable Cargo dependency graph
        run: |
          mkdir -p /tmp/research-paper-rust
          rustc --version > /tmp/research-paper-rust/toolchain.txt
          cargo --version >> /tmp/research-paper-rust/toolchain.txt
          cargo test --locked --manifest-path integrations/swarms/rust/Cargo.toml > /tmp/research-paper-rust/cargo-test.txt 2>&1
          cargo build --locked --manifest-path integrations/swarms/rust/Cargo.toml > /tmp/research-paper-rust/cargo-build.txt 2>&1
      - name: Execute rebuilt worker through real local hub with fake inference
        env:
          SWARMS_RS_TEST_BINARY: ${{ github.workspace }}/integrations/swarms/rust/target/debug/termux-swarms-rs-worker
        run: python -m pytest -q tests/test_swarms_rust_hub.py --junitxml=/tmp/research-paper-rust/rust-hub-tests.xml
      - name: Require clean tracked candidate after Rust tests
        run: git diff --exit-code HEAD --
      - name: Bind Rust receipt to candidate and artifacts
        if: always()
        run: python3 scripts/ci/research_paper_receipt.py --output /tmp/research-paper-rust/receipt.json $(find /tmp/research-paper-rust -maxdepth 1 -type f ! -name receipt.json -printf ' --artifact %p')
      - name: Upload attributable locked Rust evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-paper-rust-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: /tmp/research-paper-rust/
          retention-days: 14
          if-no-files-found: error
