name: research-registry

on:
  pull_request:
    paths:
      - "docs/research/**"
      - "config/foresight_digest_sources.json"
      - "scripts/briefing/validate_research_registry.py"
  push:
    branches: [master]
    paths:
      - "docs/research/**"
      - "config/foresight_digest_sources.json"
      - "scripts/briefing/validate_research_registry.py"

permissions:
  contents: read

# QUE fan-out guard (Owner order 2026-11-18): PR events coalesce per PR;
# every other event keeps a unique group (run_id) ⇒ ¬coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate research registry example
        run: python3 scripts/briefing/validate_research_registry.py docs/research/resource-registry.example.json
      - name: Validate standing digest source registry
        run: python3 -m json.tool config/foresight_digest_sources.json >/dev/null
