name: Reviewer metrics collect

# Aggregates the peer-review orchestrator's SHA-bound state comments plus
# the reviews/comments APIs into docs/ops/generated/reviewer-metrics.json
# (schema reviewer-metrics/v1) — the measurement layer of the reviewer JIT
# system (docs/ops/REVIEWER-JIT-DESIGN.md). The regenerated map is proposed
# as a refresh PR, never committed directly: the orchestrator consumes the
# map from master and fails open when it is missing or stale (>14 days),
# so a lagging refresh degrades to structural rules only.
#
# Trigger accounting: event-driven on peer-review-orchestrator completion
# (throttled: a workflow_run trigger collects at most once per 24h — see
# the freshness gate), one weekly scheduled run as backstop, plus manual
# dispatch. Previously weekly+dispatch only, which left the map static
# for up to a week while review volume moved (owner challenge 2026-10-28;
# the 150-PR window is now the default everywhere — the old 60 default
# silently shrank the window on scheduled runs). The collector is
# read-only against the API until the refresh-PR step.
#
# MIG-02 (2026-10-30, docs/ops/GITHUB-APP-MIGRATION-PLAN.md): collection
# reads run on the Termux Fleet Collector app token when minting succeeds
# (vars.REVIEWER_METRICS_TOKEN_SOURCE=pat forces the old path; a failed
# mint falls back automatically). The refresh-PR step is a write and
# stays on its existing token.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Most-recently-updated PRs to examine'
        required: false
        default: '150'
  workflow_run:
    workflows: ['Peer review orchestrator']
    types: [completed]
  schedule:
    - cron: '17 5 * * 1'

concurrency:
  group: reviewer-metrics-collect
  cancel-in-progress: false

# The refresh-PR step pushes a branch and opens a PR, so this job needs
# write on contents + pull-requests (the first dispatched run failed at
# that step on read-only permissions; collection itself is read-only).
permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Freshness gate (event-driven runs only)
        id: gate
        if: github.event_name == 'workflow_run'
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          skip = False
          try:
              with open('docs/ops/generated/reviewer-metrics.json') as fh:
                  generated = datetime.fromisoformat(
                      json.load(fh)['generated_at'].replace('Z', '+00:00'))
              age_h = (datetime.now(timezone.utc) - generated).total_seconds() / 3600
              skip = age_h < 24
              print(f'map age {age_h:.1f}h; event-driven collect {"skipped (<24h)" if skip else "proceeds"}')
          except Exception as exc:
              print(f'freshness gate unreadable ({exc}); event-driven collect proceeds')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Mint Collector app token (MIG-02)
        id: app-token
        if: steps.gate.outputs.skip != 'true' && vars.REVIEWER_METRICS_TOKEN_SOURCE != 'pat'
        continue-on-error: true
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3 release
        with:
          app-id: ${{ vars.TERMUX_FLEET_COLLECTOR_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_COLLECTOR_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Collect reviewer metrics
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.OPERATOR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          LIMIT: ${{ inputs.limit || '150' }}
        run: |
          python3 scripts/reviewer_metrics/collect.py \
            --repo "${{ github.repository }}" \
            --limit "$LIMIT" \
            --out reviewer-metrics.json
          python3 - <<'PY'
          import json
          d = json.load(open('reviewer-metrics.json'))
          print('window:', d['window'])
          for name, e in sorted(d['providers'].items()):
              t = e['totals']
              print(f"{name}: cycles={t['cycles']} required={t['required_cycles']} "
                    f"delivered={t['delivered']} rate={t['delivery_rate']} "
                    f"cooldown={t['cooldown_cycles']} median_latency={t['median_latency_sec']}")
          PY


      - name: Runtime receipt (MIG-02 / G4)
        if: steps.gate.outputs.skip != 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          {
            echo "## Reviewer metrics - token receipt"
            if [ -n "$APP_TOKEN" ]; then echo "- Token source: Termux Fleet Collector (app)"; else echo "- Token source: fallback (operator token)"; fi
            echo "- Run: ${{ github.run_id }} attempt ${{ github.run_attempt }} sha ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$APP_TOKEN" ]; then GH_TOKEN="$APP_TOKEN" gh api /rate_limit --jq '.resources.core | "- App bucket after collect: limit=\(.limit) remaining=\(.remaining) reset=\(.reset)"' >> "$GITHUB_STEP_SUMMARY" || true; fi

      - name: Upload metrics artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-metrics
          path: reviewer-metrics.json
          retention-days: 30

      - name: Open or update the metrics refresh PR
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if cmp -s reviewer-metrics.json docs/ops/generated/reviewer-metrics.json; then
            echo "Metrics map unchanged; no refresh PR needed."
            exit 0
          fi
          branch="reviewer-metrics/refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          cp reviewer-metrics.json docs/ops/generated/reviewer-metrics.json
          git add docs/ops/generated/reviewer-metrics.json
          git commit -m "chore(reviewer-metrics): regenerate provider x context map"
          # The refresh branch persists between runs (its PR may have
          # merged without the branch being deleted). A bare checkout
          # has no remote-tracking ref for it, so --force-with-lease
          # rejects the push as stale info — this step failed on every
          # run from 2026-10-26 until this fix. Fetch the branch first
          # so the lease has a current value to check against.
          git fetch origin "$branch" || true
          git push --force-with-lease origin "$branch"
          if gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "Refresh PR already open for $branch; branch updated in place."
          else
            gh pr create --base master --head "$branch" \
              --title "chore(reviewer-metrics): regenerate provider x context map" \
              --body "Automated regeneration of \`docs/ops/generated/reviewer-metrics.json\` by the reviewer-metrics-collect workflow (schema reviewer-metrics/v1). Figures are derived from live API data at collection time: orchestrator state comments plus the reviews/comments APIs. Merging refreshes the map the peer-review orchestrator's JIT metrics rule consumes; the rule fails open on a stale (>14d) map."
          fi
