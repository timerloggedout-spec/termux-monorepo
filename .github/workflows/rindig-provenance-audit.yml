name: RinDig Provenance Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - config/rindig_sources.json
      - scripts/ci/rindig_provenance_audit.py
      - scripts/ci/test_rindig_provenance_audit.py
      - .gitmodules
      - .github/workflows/rindig-provenance-audit.yml
  schedule:
    - cron: "47 5 * * 1"
  push:
    branches: [master]
    paths:
      - config/rindig_sources.json
      - scripts/ci/rindig_provenance_audit.py
      - scripts/ci/test_rindig_provenance_audit.py
      - .gitmodules
      - .github/workflows/rindig-provenance-audit.yml

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Validate provenance classifier
        run: |
          python3 -m py_compile scripts/ci/rindig_provenance_audit.py
          python3 scripts/ci/test_rindig_provenance_audit.py
      - name: Audit RinDig provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/rindig_provenance_audit.py \
            --registry config/rindig_sources.json \
            --gitmodules .gitmodules \
            --output /tmp/rindig-provenance.json
      - name: Publish provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: rindig-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/rindig-provenance.json
          if-no-files-found: error
          retention-days: 14
