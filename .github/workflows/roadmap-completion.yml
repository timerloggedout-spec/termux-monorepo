name: Roadmap Completion Evidence

on:
  push:
    branches: [master]
    paths:
      - "roadmap-completions/roadmaps/**/exercises/**/evidence.json"
  issues:
    types: [opened, edited, labeled, reopened]
  workflow_dispatch:
    inputs:
      roadmap:
        description: Roadmap slug from verification-rules.yaml
        required: true
        type: string
      exercise:
        description: Exercise slug from verification-rules.yaml
        required: true
        type: string
      issue_number:
        description: Related issue number
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: roadmap-completion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'issues' || github.event.action != 'labeled' || !startsWith(github.event.label.name, 'completion:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependency
        run: python -m pip install PyYAML

      - name: Resolve roadmap, exercise, and related issues
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          INPUT_ROADMAP: ${{ inputs.roadmap }}
          INPUT_EXERCISE: ${{ inputs.exercise }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          roadmap=""
          exercise=""
          issue_numbers=""

          if [ "$EVENT_NAME" = "issues" ]; then
            roadmap=$(jq -r '[.issue.labels[].name | select(startswith("roadmap:")) | sub("^roadmap:"; "")][0] // empty' "$EVENT_PATH")
            exercise=$(jq -r '[.issue.labels[].name | select(startswith("exercise:")) | sub("^exercise:"; "")][0] // empty' "$EVENT_PATH")
            issue_numbers=$(jq -r '.issue.number' "$EVENT_PATH")
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            roadmap="$INPUT_ROADMAP"
            exercise="$INPUT_EXERCISE"
            issue_numbers="$INPUT_ISSUE_NUMBER"
          else
            changed=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" || true)
            evidence_path=$(printf '%s\n' "$changed" | grep -E '^roadmap-completions/roadmaps/[^/]+/exercises/[^/]+/evidence\.json$' | head -n 1 || true)
            if [ -n "$evidence_path" ]; then
              roadmap=$(printf '%s' "$evidence_path" | cut -d/ -f3)
              exercise=$(printf '%s' "$evidence_path" | cut -d/ -f5)
              issue_numbers=$(gh issue list --repo "$REPOSITORY" --state open --label "roadmap:$roadmap" --label "exercise:$exercise" --json number --jq '.[].number')
            fi
          fi

          if [ -z "$roadmap" ] || [ -z "$exercise" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No roadmap/exercise labels or evidence path were supplied; add roadmap:<slug> and exercise:<slug> labels or dispatch with explicit inputs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "ready=true"
            echo "roadmap=$roadmap"
            echo "exercise=$exercise"
            echo "issue_numbers<<EOF"
            printf '%s\n' "$issue_numbers"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify completion evidence
        id: verify
        if: steps.context.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ROADMAP: ${{ steps.context.outputs.roadmap }}
          EXERCISE: ${{ steps.context.outputs.exercise }}
        run: |
          set +e
          python roadmap-completions/scripts/verify-completion.py \
            --roadmap "$ROADMAP" --exercise "$EXERCISE" \
            --json-output "$RUNNER_TEMP/roadmap-verification.json" \
            > "$RUNNER_TEMP/roadmap-verification.stdout"
          status=$?
          cat "$RUNNER_TEMP/roadmap-verification.stdout" >> "$GITHUB_STEP_SUMMARY"
          echo "passed=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish badge and README entry
        if: steps.context.outputs.ready == 'true' && steps.verify.outputs.passed == 'true'
        env:
          ROADMAP: ${{ steps.context.outputs.roadmap }}
          EXERCISE: ${{ steps.context.outputs.exercise }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Publish requires the master branch; current ref is $GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          score=$(jq -r '.score' "$RUNNER_TEMP/roadmap-verification.json")
          python roadmap-completions/scripts/publish-completion.py \
            --roadmap "$ROADMAP" --exercise "$EXERCISE" --score "$score"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md "roadmap-completions/badges/$ROADMAP/$EXERCISE.svg"
          if git diff --cached --quiet; then
            echo "Badge and README publication already match the verified result." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "docs: publish roadmap completion badge" -m "Implements: REPO-ARCH-008"
            git push origin HEAD:master
          fi

      - name: Report verified evidence
        if: steps.context.outputs.ready == 'true' && steps.verify.outputs.passed == 'true' && steps.context.outputs.issue_numbers != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBERS: ${{ steps.context.outputs.issue_numbers }}
          ROADMAP: ${{ steps.context.outputs.roadmap }}
          EXERCISE: ${{ steps.context.outputs.exercise }}
        run: |
          while IFS= read -r issue_number; do
            [ -z "$issue_number" ] && continue
            body=$(printf 'Roadmap evidence verification passed for %s/%s. The workflow published the badge and updated README.md.' "$ROADMAP" "$EXERCISE")
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --reason completed
          done <<< "$ISSUE_NUMBERS"

      - name: Report evidence requiring changes
        if: steps.context.outputs.ready == 'true' && steps.verify.outputs.passed == 'false' && steps.context.outputs.issue_numbers != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBERS: ${{ steps.context.outputs.issue_numbers }}
          ROADMAP: ${{ steps.context.outputs.roadmap }}
          EXERCISE: ${{ steps.context.outputs.exercise }}
        run: |
          while IFS= read -r issue_number; do
            [ -z "$issue_number" ] && continue
            body=$(printf 'Roadmap evidence verification needs updates for %s/%s. Review the workflow run summary for the exact checks and resubmit the evidence file.' "$ROADMAP" "$EXERCISE")
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          done <<< "$ISSUE_NUMBERS"

      - name: Enforce evidence result
        if: steps.context.outputs.ready == 'true' && steps.verify.outputs.passed == 'false'
        run: exit 1
