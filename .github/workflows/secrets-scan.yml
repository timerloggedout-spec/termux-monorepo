name: secrets-scan

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "diff | full | history"
        default: diff
      tool:
        description: "gitleaks | trufflehog | entropy | all"
        default: all

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache gitleaks binary
        id: cache-gitleaks
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-${{ runner.os }}-8.30.1
      - name: Install gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C ~/.local/bin gitleaks
          chmod +x ~/.local/bin/gitleaks
      - name: Run gitleaks (diff)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cfg=""
          for candidate in .gitleaks.toml ops/hooks-reference/gitleaks.toml; do
            if [ -f "$candidate" ]; then cfg="$candidate"; break; fi
          done
          if [ -z "$cfg" ]; then
            echo "no gitleaks config on this branch; skip detect (not a secret leak)"
            exit 0
          fi
          # Full-history detect on this stale feature branch scanned 4527 commits
          # (run 37033345379, 915 historical findings). Gate the repair on the
          # PR range only. Do not print finding bodies.
          if [ -n "$BASE_SHA" ]; then
            range="$BASE_SHA...HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "gitleaks range $range"
          gitleaks detect --source . --redact --no-banner \
            --config "$cfg" \
            --log-opts="$range" \
            --report-format sarif --report-path gitleaks.sarif
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  entropy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Entropy scan (staged-equivalent)
        run: |
          if [ ! -f scripts/entropy_scan.py ]; then
            echo "scripts/entropy_scan.py absent on this branch; skip"
            exit 0
          fi
          changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
          [ -z "$changed" ] && echo "no diff" && exit 0
          python3 scripts/entropy_scan.py $changed
        continue-on-error: false

  cache-warm:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cache pre-commit env
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Warm pip cache
        run: pip install --quiet ruff detect-secrets pre-commit || true
