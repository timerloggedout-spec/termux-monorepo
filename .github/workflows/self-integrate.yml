name: DeepSeek Self-Integrate
on:
  schedule:
    - cron: '17 */4 * * *'   # every 4h at :17
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
concurrency:
  group: self-integrate
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dispatch
        env:
          AGENT_URL: ${{ secrets.DEEPSEEK_AGENT_URL }}
          AGENT_TOKEN: ${{ secrets.DEEPSEEK_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          TASK='Execute ~/deepcli/tasks/self-integrate.md. Do exactly ONE improvement this cycle. Follow the wait-valid loop. Sync logs at the end.'
          jq -n --arg t "$TASK" '{task:$t, source:"gh-schedule:self-integrate"}' > payload.json
          INV=""
          BUSY=0
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "::group::POST attempt $attempt"
            RESP=$(curl -sS --max-time 30 -X POST "$AGENT_URL/v1/agent" \
                     -H "Authorization: Bearer $AGENT_TOKEN" \
                     -H 'Content-Type: application/json' \
                     --data-binary @payload.json 2>&1) || true
            echo "resp: $RESP"
            echo "::endgroup::"
            INV=$(echo "$RESP" | jq -r '.invocation_id // empty' 2>/dev/null || echo "")
            ERR=$(echo "$RESP" | jq -r '.detail.error // empty' 2>/dev/null || echo "")
            if [ -n "$INV" ] && [ "$INV" != "null" ]; then break; fi
            if echo "$ERR $RESP" | grep -qi 'another agent run is active'; then
              BUSY=1
              echo "agent single-flight busy on attempt $attempt"
            fi
            echo "attempt $attempt failed, sleeping 20s"
            sleep 20
          done
          if [ -z "$INV" ] || [ "$INV" = "null" ]; then
            if [ "$BUSY" = "1" ]; then
              echo "::notice::DeepSeek agent busy (single-flight). Skip this cycle."
              exit 0
            fi
            echo "::error::could not reach agent after retries"
            exit 1
          fi
          echo "invocation=$INV"
          for i in $(seq 1 120); do
            S=$(curl -sS "$AGENT_URL/v1/agent/status/$INV" -H "Authorization: Bearer $AGENT_TOKEN")
            P=$(echo "$S" | jq -r .phase)
            echo "[$i] $P"
            [ "$P" = "done" ] && break
            [ "$P" = "error" ] && break
            sleep 15
          done
