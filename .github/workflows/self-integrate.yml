name: DeepSeek Self-Integrate
on:
  schedule:
    - cron: '17 */4 * * *'   # every 4h at :17
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
concurrency:
  group: self-integrate
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dispatch
        env:
          AGENT_URL: ${{ secrets.DEEPSEEK_AGENT_URL }}
          AGENT_TOKEN: ${{ secrets.DEEPSEEK_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          TASK='Execute ~/deepcli/tasks/self-integrate.md. Do exactly ONE improvement this cycle. Follow the wait-valid loop. Sync logs at the end.'
          jq -n --arg t "$TASK" '{task:$t, source:"gh-schedule:self-integrate"}' > payload.json
          INV=$(curl -sS -X POST "$AGENT_URL/v1/agent" -H "Authorization: Bearer $AGENT_TOKEN" \
                  -H 'Content-Type: application/json' --data-binary @payload.json | jq -r .invocation_id)
          echo "invocation=$INV"
          for i in $(seq 1 120); do
            S=$(curl -sS "$AGENT_URL/v1/agent/status/$INV" -H "Authorization: Bearer $AGENT_TOKEN")
            P=$(echo "$S" | jq -r .phase)
            echo "[$i] $P"
            [ "$P" = "done" ] && break
            [ "$P" = "error" ] && break
            sleep 15
          done
