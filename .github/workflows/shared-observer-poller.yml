name: Shared Observer Poller

on:
  schedule:
    # Run every 15 minutes to batch observations, eliminating per-event skip records
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: shared-observer-poller
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Poll recent runs and emit batched receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo "## Shared Observer Poller Receipt" >> $GITHUB_STEP_SUMMARY
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          # Fetch recent completed runs (last ~30 min via per_page; resilient)
          if ! runs_json=$(gh api --paginate "/repos/${{ github.repository }}/actions/runs?status=completed&per_page=30" 2>&1); then
            echo "::warning::gh api failed (capacity/rate-limit/transient); treating as non-failure." >> $GITHUB_STEP_SUMMARY
            echo "No fresh observation this cycle." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          # Filter to recent by created_at if jq available; fallback to all
          if command -v jq >/dev/null; then
            cutoff=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-30M +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo "")
            if [ -n "$cutoff" ]; then
              runs=$(echo "$runs_json" | jq -c --arg cutoff "$cutoff" '.workflow_runs[]? | select(.created_at > $cutoff)' 2>/dev/null || echo "")
            else
              runs=$(echo "$runs_json" | jq -c '.workflow_runs[]?' 2>/dev/null || echo "")
            fi
          else
            runs=""
          fi
          count=$(echo "$runs" | grep -c . || true)
          echo "Recent completed runs observed: $count" >> $GITHUB_STEP_SUMMARY
          if [ "$count" -gt 0 ] && command -v jq >/dev/null; then
            echo "$runs" | jq -s 'group_by(.conclusion) | map({conclusion: .[0].conclusion, count: length})' >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            failures=$(echo "$runs" | jq -r 'select(.conclusion == "failure") | .html_url' 2>/dev/null || true)
            if [ -n "$failures" ]; then
              echo "### Failures requiring attention" >> $GITHUB_STEP_SUMMARY
              echo "$failures" >> $GITHUB_STEP_SUMMARY
            else
              echo "No failures in window. Skips/cancels audited as operational." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No runs or jq unavailable. Skips audited as operational." >> $GITHUB_STEP_SUMMARY
          fi
          echo "Device #1 (tmx-node-primary) Pinggy/Tailscale: check heartbeat separately." >> $GITHUB_STEP_SUMMARY
          exit 0
