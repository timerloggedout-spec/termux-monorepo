name: Siglary DO-statement policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  enforce:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request || github.event.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Validate DO statements across PR communication and additions
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request || (context.payload.issue?.pull_request
              ? await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number}).then(r => r.data)
              : null);
            if (!pr) core.setFailed("PR context required");
            const patterns = [
              /\bno\b/i, /\bnot\b/i, /\bnever\b/i, /\bnone\b/i, /\bnothing\b/i,
              /\bwithout\b/i, /\bneither\b/i, /\bnor\b/i, /\bdon['’]?t\b/i,
              /\bdoesn['’]?t\b/i, /\bisn['’]?t\b/i, /\baren['’]?t\b/i,
              /\bcan['’]?t\b/i, /\bwon['’]?t\b/i, /\bshouldn['’]?t\b/i
            ];
            const violations = [];
            function scan(label, value) {
              if (!value) return;
              for (const [i,line] of value.split(/\r?\n/).entries()) {
                if (/SIGLARY-EXEMPT:/i.test(line)) continue;
                const hit = patterns.find(p => p.test(line));
                if (hit) violations.push(label + ":" + (i+1) + " → " + line.trim().slice(0,180));
              }
            }
            scan("PR title", pr.title);
            scan("PR body", pr.body);
            const commits = await github.paginate(github.rest.pulls.listCommits,{owner:context.repo.owner,repo:context.repo.repo,pull_number:pr.number,per_page:100});
            for (const c of commits) scan("commit " + c.sha.slice(0,8), c.commit.message.split("\n")[0]);
            const files = await github.paginate(github.rest.pulls.listFiles,{owner:context.repo.owner,repo:context.repo.repo,pull_number:pr.number,per_page:100});
            for (const f of files) {
              if (!f.patch || f.filename === "docs/ops/DO-STATEMENT-SIGLARY-MANDATE.md") continue;
              const added = f.patch.split("\n").filter(x => x.startsWith("+") && !x.startsWith("+++")).map(x=>x.slice(1));
              if (/\.(md|mdx|txt)$/i.test(f.filename)) scan(f.filename, added.join("\n"));
              else scan(f.filename + " comments", added.filter(x => /^\s*(\/\/|\/\*|\*|#)/.test(x)).join("\n"));
            }
            const created = new Date("2026-11-13T14:32:00Z"); // Policy activation boundary; earlier generated discussion remains baseline evidence.
            const comments = await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:pr.number,per_page:100});
            for (const c of comments) if (c.user?.type === "User" && !c.user?.login?.endsWith("[bot]") && new Date(c.created_at) >= created) scan("comment " + c.id,c.body);
            const reviews = await github.paginate(github.rest.pulls.listReviews,{owner:context.repo.owner,repo:context.repo.repo,pull_number:pr.number,per_page:100});
            for (const r of reviews) if (r.user?.type === "User" && !r.user?.login?.endsWith("[bot]") && r.body && new Date(r.submitted_at || r.created_at) >= created) scan("review " + r.id,r.body);
            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments,{owner:context.repo.owner,repo:context.repo.repo,pull_number:pr.number,per_page:100});
            for (const c of reviewComments) if (c.user?.type === "User" && !c.user?.login?.endsWith("[bot]") && new Date(c.created_at) >= created) scan("inline review " + c.id,c.body);
            if (violations.length) core.setFailed("DO-statement violations:\n" + violations.join("\n"));
            else core.info("✓ PR communication, new commit subjects, added prose/comments and PR discussion pass Siglary policy.");
