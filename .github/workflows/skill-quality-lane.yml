name: Skill Quality Lane

# Deterministic, read-only structural evaluation for SKILL.md and .skill packages.
on:
  push:
    branches:
      - "ops/skill-quality-lane"
  pull_request:
    paths:
      - ".agents/skills/**/SKILL.md"
      - ".claude/**/SKILL.md"
      - "SKILLS.md"
      - ".github/skills/**/SKILL.md"
      - "docs/ops/skills/**/SKILL.md"
      - "**/*.skill"
      - "scripts/ci/evaluate_skills.py"
      - "tests/test_skill_evaluation.py"
      - "docs/ops/SKILL-EVALUATION.md"
      - "docs/ops/SKILL-EVALUATION-EVIDENCE.schema.json"
      - "docs/ops/SKILLS-INVENTORY.md"
      - "docs/ops/SKILL-DISCOVERY-MATRIX.md"
      - "docs/ops/CAPABILITY-DISCOVERY-AND-ACTIVATION.md"
      - "docs/ops/DOE-QUESTIONS-MATRIX.md"
      - "docs/integrations/session-plugin-skill-catalog.json"
      - "docs/integrations/session-tool-action-catalog.json"
      - "ops/capability_discovery/**"
      - "scripts/capabilities/**"
      - "tests/test_capability_discovery.py"
      - "experiments/doe/capability-discovery-routing/**"
      - ".github/workflows/skill-quality-lane.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate evidence schema JSON
        run: python -m json.tool docs/ops/SKILL-EVALUATION-EVIDENCE.schema.json >/dev/null

      - name: Validate capability catalogs and schemas
        run: |
          python -m json.tool ops/capability_discovery/taxonomy.json >/dev/null
          python -m json.tool ops/capability_discovery/sources.json >/dev/null
          python -m json.tool ops/capability_discovery/record.schema.json >/dev/null
          python -m json.tool docs/integrations/session-plugin-skill-catalog.json >/dev/null
          python -m json.tool docs/integrations/session-tool-action-catalog.json >/dev/null
          python -m json.tool experiments/doe/capability-discovery-routing/DESIGN.json >/dev/null

      - name: Compile evaluators, indexer and tests
        run: python -m py_compile scripts/ci/evaluate_skills.py scripts/capabilities/discover.py tests/test_skill_evaluation.py tests/test_capability_discovery.py

      - name: Run deterministic skill evaluator
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            python scripts/ci/evaluate_skills.py --baseline-ref "$BASE_SHA" --head-ref "$HEAD_SHA" --json | tee skill-evaluation.json
          else
            python scripts/ci/evaluate_skills.py --json | tee skill-evaluation.json
          fi

      - name: Run focused evaluator tests
        run: python -m unittest tests.test_skill_evaluation -v

      - name: Run capability discovery tests
        run: python -m unittest tests.test_capability_discovery -v

      - name: Build compact capability database and ledger
        run: |
          python scripts/capabilities/discover.py scan --root . \
            --db .cache/capability-index.sqlite \
            --ledger .cache/capability-discovery-ledger.jsonl \
            --plugin-skills-json docs/integrations/session-plugin-skill-catalog.json \
            --tool-actions-json docs/integrations/session-tool-action-catalog.json
          python scripts/capabilities/discover.py find \
            "repository skill plugin tool discovery" \
            --db .cache/capability-index.sqlite --limit 8 > capability-search-smoke.json
          python -m json.tool capability-search-smoke.json >/dev/null

      - name: Check source diff whitespace hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA" -- .agents .github docs scripts tests

      - name: Publish deterministic evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-quality-evidence
          path: |
            skill-evaluation.json
            capability-search-smoke.json
            .cache/capability-index.sqlite
            .cache/capability-discovery-ledger.jsonl
          if-no-files-found: error
