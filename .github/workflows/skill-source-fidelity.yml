name: Skill Source Fidelity

on:
  pull_request:
    paths:
      - 'experiments/doe/skill-content-preservation/**'
      - 'scripts/ci/verify_skill_lineage.py'
      - 'vendor/skills-mirror/**'
  push:
    branches: [master]
    paths:
      - 'experiments/doe/skill-content-preservation/**'
      - 'scripts/ci/verify_skill_lineage.py'
      - 'vendor/skills-mirror/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify immutable source and candidate hashes
        run: >-
          python scripts/ci/verify_skill_lineage.py
          --manifest experiments/doe/skill-content-preservation/manifest.json
