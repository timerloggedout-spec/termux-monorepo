name: SKYHOOK Dispatch

on:
  workflow_dispatch:
    inputs:
      task_title:
        description: 'Title for the Jules task'
        required: true
        type: string
      task_prompt:
        description: 'Prompt/description for the Jules task'
        required: true
        type: string
      source_repo:
        description: 'Source repository (owner/repo)'
        required: false
        type: string
        default: 'timerloggedout-spec/termux-monorepo'
      starting_branch:
        description: 'Branch to start from'
        required: false
        type: string
        default: 'master-staging'
      require_plan_approval:
        description: 'Require plan approval'
        required: false
        type: boolean
        default: false
      session_type:
        description: 'Session type (INTERACTIVE, BATCH, REVIEW, ORCHESTRATION)'
        required: false
        type: string
        default: 'INTERACTIVE'
      priority:
        description: 'Task priority (low, medium, high, critical)'
        required: false
        type: string
        default: 'medium'

  schedule:
    # Daily check for queued tasks
    - cron: '0 8 * * *'  # 8 AM UTC

  repository_dispatch:
    types: [skyhook-dispatch]

jobs:
  dispatch:
    name: Dispatch to Jules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install SKYHOOK dependencies
          pip install psutil

      - name: Dispatch task to Jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import sys
          import os
          
          # Add skyhook to path
          sys.path.insert(0, '.')
          
          from skyhook.bridge.dispatch_v2 import plan_task_v2
          from skyhook.bridge.http_client import request_json, build_create_session_body
          from skyhook.protocol import SessionType
          
          # Get inputs
          task_title = '${{ github.event.inputs.task_title || '' }}'
          task_prompt = '${{ github.event.inputs.task_prompt || '' }}'
          source_repo = '${{ github.event.inputs.source_repo || 'timerloggedout-spec/termux-monorepo' }}'
          starting_branch = '${{ github.event.inputs.starting_branch || 'master-staging' }}'
          require_plan_approval = ${{ github.event.inputs.require_plan_approval || false }}
          session_type = '${{ github.event.inputs.session_type || 'INTERACTIVE' }}'
          priority = '${{ github.event.inputs.priority || 'medium' }}'
          
          # Create plan
          plan = plan_task_v2(
              title=task_title,
              prompt=task_prompt,
              source_repo=source_repo,
              starting_branch=starting_branch,
              require_plan_approval=require_plan_approval,
              session_type=SessionType.from_string(session_type),
              priority=priority,
          )
          
          print(f'Created plan: {plan.title}')
          print(f'Source: {plan.source_repo}')
          print(f'Branch: {plan.starting_branch}')
          print(f'Session Type: {plan.session_type.to_string()}')
          
          # Convert to API request
          request = plan.to_jules_request()
          print(f'Request: {request.to_json()}')
          
          # If we have API key, we could actually dispatch
          if os.environ.get('JULES_API_KEY'):
              print('JULES_API_KEY available - could dispatch to Jules API')
          else:
              print('JULES_API_KEY not available - dry run only')
          " 2>&1

  process-queue:
    name: Process queued tasks
    runs-on: ubuntu-latest
    needs: dispatch
    if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process task queue
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import sys
          import os
          import glob
          import yaml
          
          sys.path.insert(0, '.')
          
          from skyhook.bridge.dispatch_v2 import plan_from_task_yaml_fields_v2
          from skyhook.protocol import SessionType
          
          # Find all queued task files
          task_files = glob.glob('skyhook/tasks/queue/*.yaml') + glob.glob('skyhook/tasks/queue/*.yml')
          
          print(f'Found {len(task_files)} queued tasks')
          
          for task_file in task_files:
              print(f'Processing: {task_file}')
              
              with open(task_file, 'r') as f:
                  task_data = yaml.safe_load(f)
              
              # Create plan from task file
              plan = plan_from_task_yaml_fields_v2(task_data)
              
              print(f'  Title: {plan.title}')
              print(f'  Source: {plan.source_repo}')
              print(f'  Branch: {plan.starting_branch}')
              print(f'  Type: {plan.session_type.to_string()}')
              
              # Here you would dispatch to Jules API
              # For now, just print the plan
              print(f'  Prompt: {plan.prompt[:100]}...')
          " 2>&1

  monitor:
    name: Monitor active sessions
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Monitor sessions
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          python -c "
          import sys
          import os
          
          sys.path.insert(0, '.')
          
          from skyhook.bridge.http_client import request_json
          from skyhook.protocol import JulesResponse, SessionState
          
          if not os.environ.get('JULES_API_KEY'):
              print('JULES_API_KEY not available - skipping monitoring')
              sys.exit(0)
          
          try:
              # List sessions (this would need the actual API endpoint)
              print('Monitoring would check Jules API for active sessions')
              print('This requires JULES_API_KEY and proper API endpoints')
              
          except Exception as e:
              print(f'Monitoring error: {e}')
          " 2>&1
