name: studysprint-apk-smoke

# Headless emulator smoke gate for the StudySprint APK surface
# (issue #4283): builds the APK at the requested ref, boots an
# AVD (KVM on the runner), installs, launches, and asserts the
# state-loaded signals the 2026-11-03 device smoke found missing
# (#4276) -- via apps/studysprint/android/emulator-smoke.sh.
# Acceptance use: dispatch once at the 0.1.0-era ref (expect the
# #4276 FAIL signature in the verdict artifact) and once at
# master (expect PASS). Screenshots + UI dumps ride as artifacts.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to build + smoke"
        required: true
        default: "master"
      label:
        description: "artifact label"
        required: true
        default: "smoke"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The harness itself always comes from master: the ref under
      # test (e.g. the 0.1.0-era tree) predates it.
      - uses: actions/checkout@v4
        with:
          ref: master
          path: gate

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK pieces
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp
          curl -sL -o cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" \
             "$HOME/android-sdk/cmdline-tools/latest"
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "emulator" "platforms;android-34" \
            "build-tools;34.0.0" "system-images;android-34;default;x86_64"
          # Pin the AVD home explicitly: unpinned, avdmanager's default
          # AVD location and the emulator's search paths diverged and
          # the first acceptance pair died on "Unknown AVD name
          # [ss-smoke]" without the emulator ever starting (#4283).
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n ss-smoke \
            -k "system-images;android-34;default;x86_64" -d pixel_6
          test -f "$ANDROID_AVD_HOME/ss-smoke.ini"
          "$HOME/android-sdk/emulator/emulator" -list-avds | grep -qx ss-smoke
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Build the APK at the ref
        working-directory: apps/studysprint
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          bash android/build.sh
          cp android/studysprint.apk "$GITHUB_WORKSPACE/studysprint.apk"

      - name: Run the emulator smoke gate
        id: smoke
        timeout-minutes: 25
        run: |
          export ANDROID_HOME
          bash gate/apps/studysprint/android/emulator-smoke.sh \
            "$GITHUB_WORKSPACE/studysprint.apk" \
            "$GITHUB_WORKSPACE/smoke-out" ss-smoke

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-smoke-${{ inputs.label }}
          path: smoke-out/
          if-no-files-found: warn
