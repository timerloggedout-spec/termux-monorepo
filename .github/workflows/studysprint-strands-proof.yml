name: studysprint-strands-proof

# Model-access proof, live leg (monorepo issue #4534): the
# fleet GEMINI_API_KEY (Actions secret) drives the StudySprint
# Strands agent -- model swapped to GeminiModel pre-invocation,
# both syllabus tools asserted called. The receipt artifact is
# the deliverable; on failure the receipt carries the exact
# error and the run fails with it.
#
# AWS env vars below are LITERAL placeholders: strands-agents
# 1.63.0's Agent() eagerly constructs a BedrockModel at build
# time, so construction needs credentials PRESENT -- no AWS
# call is ever made (see tools/strands_proof.py).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AWS_ACCESS_KEY_ID: "placeholder"
      AWS_SECRET_ACCESS_KEY: "placeholder"
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the SDK + the agent's core deps
        run: |
          pip install strands-agents==1.63.0 google-genai fsrs genanki

      - name: Run the proof harness
        run: python3 apps/studysprint/tools/strands_proof.py

      - name: Upload the proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strands-proof-receipt
          path: apps/studysprint/strands-proof-receipt.json
          if-no-files-found: warn
