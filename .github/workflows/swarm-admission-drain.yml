name: QUE deferred-admission drain

# Re-evaluate only already-open deferred filings. This is an admission-only
# transition: no issue reopening, provider call, build dispatch, claim, or
# production routing change. The drain reuses the canonical admission
# evaluator and emits an idempotent receipt for each changed verdict.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: que-deferred-admission-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Mint Termux Fleet Swarm token
        id: swarm
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3
        with:
          app-id: ${{ vars.TERMUX_FLEET_SWARM_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-issues: write
          permission-contents: read

      - name: Re-evaluate deferred filings
        env:
          GH_TOKEN: ${{ steps.swarm.outputs.token }}
        run: |
          python3 scripts/ops/swarm_admission_drain.py \
            --repo "${GITHUB_REPOSITORY}" \
            --templates-dir .github/ISSUE_TEMPLATE \
            --tiers ops/quota/dispatch-tiers.json \
            --feeds-dir ops/que/feeds \
            --max-issues 100 \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
