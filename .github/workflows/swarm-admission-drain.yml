name: swarm-admission-drain

# QUE #4977 Fix 3b. Re-evaluate existing deferred filings on a schedule.
# This workflow is intentionally NOT triggered by issues.opened/reopened:
# it cannot wake the generic issue-open provider listener. It only applies
# the canonical admission verdict; it never dispatches a provider/build.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Classify deferred filings without changing labels or comments"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: swarm-admission-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint Termux Fleet Swarm token
        id: swarm
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3
        with:
          app-id: \${{ vars.TERMUX_FLEET_SWARM_APP_ID }}
          private-key: \${{ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }}
          repositories: \${{ github.event.repository.name }}
          permission-actions: read
          permission-issues: write
          permission-contents: read

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          token: \${{ steps.swarm.outputs.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Re-evaluate deferred filings
        env:
          GH_TOKEN: \${{ steps.swarm.outputs.token }}
          GITHUB_REPOSITORY: \${{ github.repository }}
          GITHUB_SERVER_URL: \${{ github.server_url }}
          GITHUB_RUN_ID: \${{ github.run_id }}
          DRY_RUN: \${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python3 scripts/ops/swarm_admission_drain.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "\${ARGS[@]}"
