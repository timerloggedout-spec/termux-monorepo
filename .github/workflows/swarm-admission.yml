name: swarm-admission

# Issue-template dispatch (owner contract, 2026-11-03): a filing IS a
# dispatch, declared at the template, and reaches the swarm only
# THROUGH QUE ADMISSION. This workflow is the admission route for
# every issue form carrying a SWARM-DISPATCH block
# (schema issue-dispatch/v1, docs/ops/ISSUE-TEMPLATE-DISPATCH.md).
# It evaluates tier -> after -> chain -> flow (dispatch-tiers v2),
# stamps the filing with the decision as its first fleet comment, and
# labels it swarm-admitted | deferred-by-tier. It spawns NOTHING
# itself: the route named in the template's block executes under its
# own intake, and deferred filings are never actionable until the
# QUE admission drain re-evaluates them. Fail-soft throughout.

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: read
  actions: read

concurrency:
  group: swarm-admission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the live queue picture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, time
          # Page fetches retry with backoff on a bad body (proof
          # runs 41737482551 + 41738428894: API error envelopes
          # mid-pagination -- no "workflow_runs" key -- kept
          # killing collection even at one retry per 100-run
          # page; pages are now 50 with 4 attempts at 5/10/20s).
          # If the picture still cannot be collected, write the
          # collection_error sentinel and exit 0: the evaluator
          # turns an unknown queue into a DEFERRED stamp with
          # the reason, never a silent death.
          def fetch(status, page):
              for attempt, wait in ((1, 5), (2, 10), (3, 20), (4, 0)):
                  out = subprocess.run(
                      ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?status={status}&per_page=50&page={page}"],
                      capture_output=True, text=True).stdout
                  try:
                      return json.loads(out)["workflow_runs"]
                  except Exception:
                      if attempt == 4:
                          return None
                      time.sleep(wait)
          runs, failed = [], False
          for status in ("queued", "in_progress"):
              page = 1
              while True:
                  batch = fetch(status, page)
                  if batch is None:
                      failed = True
                      break
                  runs += [{"name": r["name"], "status": r["status"], "created_at": r["created_at"]} for r in batch]
                  if len(batch) < 50:
                      break
                  page += 1
              if failed:
                  break
          with open(os.environ["RUNNER_TEMP"] + "/runs.json", "w") as fh:
              json.dump({"collection_error": True} if failed else runs, fh)
          print(f"queue picture: {'COLLECTION ERROR' if failed else str(len(runs)) + ' runs'}")
          PYEOF

      - name: Evaluate admission
        id: eval
        env:
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          python3 scripts/ops/swarm_admission.py \
            --templates-dir .github/ISSUE_TEMPLATE \
            --tiers ops/quota/dispatch-tiers.json \
            --runs-file "$RUNNER_TEMP/runs.json" \
            --issue-labels "$LABELS" \
            --issue-title "$TITLE" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --comment-out "$RUNNER_TEMP/stamp.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Stamp the filing (admitted or deferred)
        if: steps.eval.outputs.matched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create swarm-admitted --force --color 0E8A16 \
            --description "Filing admitted through QUE admission (dispatch-tiers v2)" || true
          gh label create deferred-by-tier --force --color D93F0B \
            --description "Filing deferred by QUE admission; drain re-evaluates" || true
          gh issue comment "${{ github.event.issue.number }}" --body-file "$RUNNER_TEMP/stamp.md"
          gh issue edit "${{ github.event.issue.number }}" --add-label "${{ steps.eval.outputs.label }}"
