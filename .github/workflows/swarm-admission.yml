name: swarm-admission

# Issue-template dispatch (owner contract, 2026-11-03): a filing IS a
# dispatch, declared at the template, and reaches the swarm only
# THROUGH QUE ADMISSION. This workflow is the admission route for
# every issue form carrying a SWARM-DISPATCH block
# (schema issue-dispatch/v1, docs/ops/ISSUE-TEMPLATE-DISPATCH.md).
# It evaluates tier -> after -> chain -> flow (dispatch-tiers v2),
# stamps the filing with the decision as its first fleet comment, and
# labels it swarm-admitted | deferred-by-tier. The queue picture is
# the collector feed in the checkout (#4979: ops/que/feeds/,
# freshness-gated at 2 collector cycles); the live paginated census
# is only the stale-feed fallback. It spawns NOTHING
# itself: the route named in the template's block executes under its
# own intake, and deferred filings are never actionable until the
# QUE admission drain re-evaluates them. Fail-soft throughout.

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: read
  actions: read

concurrency:
  group: swarm-admission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mint Termux Fleet Swarm token (own rate bucket)
        # #4977 token leg (folded into #4979): collection and stamping
        # ride the Swarm App installation token, never the shared
        # per-repo GITHUB_TOKEN bucket exhausted on 2026-11-12.
        id: swarm
        uses: actions/create-github-app-token@b60ed23e06e1e229cd0384bf542ad2781a8df21e # v3
        with:
          app-id: ${{ vars.TERMUX_FLEET_SWARM_APP_ID }}
          private-key: ${{ secrets.TERMUX_FLEET_SWARM_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-issues: write
          permission-contents: read

      - name: Picture gate (collector feeds fresh?)
        id: picture-gate
        run: |
          python3 scripts/ops/swarm_admission.py picture-gate \
            --feeds-dir ops/que/feeds \
            --github-output "$GITHUB_OUTPUT"

      - name: Collect the live queue picture (stale-feed fallback only)
        if: steps.picture-gate.outputs.feeds_fresh != 'true'
        env:
          GH_TOKEN: ${{ steps.swarm.outputs.token }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, time
          # Page fetches retry with backoff on a bad body (proof
          # runs 41737482551 + 41738428894: API error envelopes
          # mid-pagination -- no "workflow_runs" key -- kept
          # killing collection even at one retry per 100-run
          # page; pages are now 50 with 4 attempts at 5/10/20s).
          # If the picture still cannot be collected, write the
          # collection_error sentinel and exit 0: the evaluator
          # turns an unknown queue into a DEFERRED stamp with
          # the reason, never a silent death.
          def fetch(status, page):
              for attempt, wait in ((1, 5), (2, 10), (3, 20), (4, 0)):
                  out = subprocess.run(
                      ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?status={status}&per_page=50&page={page}"],
                      capture_output=True, text=True).stdout
                  try:
                      return json.loads(out)["workflow_runs"]
                  except Exception:
                      if attempt == 4:
                          return None
                      time.sleep(wait)
          # On failure the sentinel NAMES the failed status+page and
          # the API error class (#4979 point 2) -- the old bare
          # {"collection_error": true} hid the cause behind generic
          # stamp text and deferred every tier alike.
          import re
          from datetime import datetime, timezone
          def fetch2(status, page):
              last_err = ""
              for attempt, wait in ((1, 5), (2, 10), (3, 20), (4, 0)):
                  proc = subprocess.run(
                      ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?status={status}&per_page=50&page={page}"],
                      capture_output=True, text=True)
                  try:
                      return json.loads(proc.stdout)["workflow_runs"], None
                  except Exception:
                      last_err = (proc.stderr or "") + (proc.stdout or "")
                      if attempt == 4:
                          low = last_err.lower()
                          if "rate limit" in low:
                              cls = "rate_limited"
                          else:
                              m = re.search(r"\b(4\d\d|5\d\d)\b", last_err)
                              cls = f"http_{m.group(1)}" if m else ("empty_response" if not last_err.strip() else "malformed_body")
                          return None, cls
                      time.sleep(wait)
          runs, failure = [], None
          for status in ("queued", "in_progress"):
              page = 1
              while True:
                  batch, cls = fetch2(status, page)
                  if batch is None:
                      failure = {"failed_status": status, "failed_page": page, "error_class": cls}
                      break
                  runs += [{"name": r["name"], "status": r["status"], "created_at": r["created_at"]} for r in batch]
                  if len(batch) < 50:
                      break
                  page += 1
              if failure:
                  break
          with open(os.environ["RUNNER_TEMP"] + "/runs.json", "w") as fh:
              if failure:
                  json.dump({"collection_error": failure}, fh)
              else:
                  json.dump({"picture_source": "live-fallback",
                             "collected_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                             "runs": runs}, fh)
          print("queue picture:", ("COLLECTION ERROR " + str(failure)) if failure else (str(len(runs)) + " runs (live fallback)"))
          PYEOF

      - name: Evaluate admission
        id: eval
        env:
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          python3 scripts/ops/swarm_admission.py \
            --templates-dir .github/ISSUE_TEMPLATE \
            --tiers ops/quota/dispatch-tiers.json \
            --runs-file "$RUNNER_TEMP/runs.json" \
            --feeds-dir ops/que/feeds \
            --issue-labels "$LABELS" \
            --issue-title "$TITLE" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --comment-out "$RUNNER_TEMP/stamp.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Stamp the filing (admitted or deferred)
        if: steps.eval.outputs.matched == 'true'
        env:
          GH_TOKEN: ${{ steps.swarm.outputs.token }}
        run: |
          gh label create swarm-admitted --force --color 0E8A16 \
            --description "Filing admitted through QUE admission (dispatch-tiers v2)" || true
          gh label create deferred-by-tier --force --color D93F0B \
            --description "Filing deferred by QUE admission; drain re-evaluates" || true
          if [ "${{ steps.eval.outputs.template }}" = "game-development-task.yml" ]; then
            gh label create game-development --force --color 1D76DB \
              --description "Game Development & Production task intake" || true
            gh issue edit "${{ github.event.issue.number }}" --add-label game-development
          fi
          # Admission labels are mutually exclusive. On reopen, remove the prior
          # opposite decision before applying the new receipt label.
          if [ "${{ steps.eval.outputs.label }}" = "swarm-admitted" ]; then
            gh issue edit "${{ github.event.issue.number }}" --remove-label deferred-by-tier || true
          else
            gh issue edit "${{ github.event.issue.number }}" --remove-label swarm-admitted || true
          fi
          gh issue comment "${{ github.event.issue.number }}" --body-file "$RUNNER_TEMP/stamp.md"
          gh issue edit "${{ github.event.issue.number }}" --add-label "${{ steps.eval.outputs.label }}"

      - name: Write admission handoff
        if: steps.eval.outcome == 'success'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MATCHED: ${{ steps.eval.outputs.matched }}
          DECISION: ${{ steps.eval.outputs.decision }}
          TEMPLATE: ${{ steps.eval.outputs.template }}
          LABEL: ${{ steps.eval.outputs.label }}
        run: |
          python3 - <<'PYEOF'
          import json, os
          payload = {
              "issue_number": int(os.environ["ISSUE_NUMBER"]),
              "matched": os.environ.get("MATCHED", "false") == "true",
              "decision": os.environ.get("DECISION", ""),
              "template": os.environ.get("TEMPLATE", ""),
              "label": os.environ.get("LABEL", ""),
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "admission.json"), "w") as fh:
              json.dump(payload, fh, sort_keys=True)
          PYEOF

      - name: Publish admission handoff
        if: steps.eval.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: issue-admission
          path: ${{ runner.temp }}/admission.json
          retention-days: 1
