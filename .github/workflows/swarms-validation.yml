name: Swarms offline validation

on:
  pull_request:
    paths:
      - 'src/swarms_*.py'
      - 'scripts/swarms/**'
      - 'integrations/swarms/**'
      - 'tests/test_swarms*.py'
      - '.github/workflows/swarms-validation.yml'
  push:
    paths:
      - 'src/swarms_*.py'
      - 'scripts/swarms/**'
      - 'integrations/swarms/**'
      - 'tests/test_swarms*.py'
      - '.github/workflows/swarms-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarms-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    name: Offline Python contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 PyYAML==6.0.3 uvicorn==0.54.0
      - name: Run offline Swarms contracts and workflow assertions
        run: python -m pytest -q tests/test_swarms*.py
      - name: Exercise fixed synthetic dry-run
        run: |
          python3 scripts/swarms/run.py --task 'Synthetic offline validation fixture'
          python3 scripts/swarms/research-plan.py --lane research --task 'Synthetic source-planning fixture'

  rust-contract:
    name: Optional Rust worker contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/swarms/rust
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect runner Rust toolchain (Cargo enforces minimum version)
        run: rustc --version && cargo --version
      - name: Test pinned Rust worker
        run: cargo test --locked
