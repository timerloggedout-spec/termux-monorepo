name: SWE reference evaluation

# Implements: THUB-007
# Manual-only and intentionally bounded: one SWE-bench instance per run.
# The workflow never uploads trajectories, predictions, prompts, patches, or credentials.

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Provider model identifier; must not contain a credential"
        required: true
        type: string
      benchmark:
        description: "Small evaluation suite"
        required: true
        default: lite
        type: choice
        options: [lite, verified]
      split:
        description: "Dataset split"
        required: true
        default: dev
        type: choice
        options: [dev, test]

permissions:
  contents: read

concurrency:
  group: swe-reference-evaluation-${{ inputs.benchmark }}-${{ inputs.split }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: bounded mini-SWE smoke evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MINI_SWE_REVISION: a83fcae82d2a08f0ee0c688f9d137b3566c097f8
      RUN_DIRECTORY: ${{ runner.temp }}/swe-evaluation
      # This repository secret is human-managed. It is never echoed, written to
      # manifests, or included in uploaded artifacts.
      SWE_EVALUATION_API_KEY: ${{ secrets.SWE_EVALUATION_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          submodules: false

      - name: Validate bounded invocation
        env:
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          set -euo pipefail
          if [ -z "${SWE_EVALUATION_API_KEY}" ]; then
            echo "SWE_EVALUATION_API_KEY is not configured; a human-managed provider secret is required." >&2
            exit 78
          fi
          if ! [[ "${MODEL_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$ ]]; then
            echo "model_id must be a model identifier, not a secret or free-form command." >&2
            exit 2
          fi
          if [[ "${MODEL_ID}" =~ (ghp|github_pat|sk-|tskey|AIza|client_secret|api[_-]?key) ]]; then
            echo "model_id resembles a credential and is rejected." >&2
            exit 2
          fi

      - name: Checkout pinned mini-SWE-agent reference
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/timerloggedout-spec/mini-swe-agent_fork.git reference
          git -C reference checkout --detach "${MINI_SWE_REVISION}"
          test "$(git -C reference rev-parse HEAD)" = "${MINI_SWE_REVISION}"

      - name: Install pinned reference dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install ./reference

      - name: Run one bounded benchmark instance
        id: run
        env:
          MODEL_ID: ${{ inputs.model_id }}
          # mini-SWE-agent consumes provider-specific environment variables.
          # The human-managed evaluation secret is mapped only at process runtime.
          ANTHROPIC_API_KEY: ${{ secrets.SWE_EVALUATION_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.SWE_EVALUATION_API_KEY }}
        run: |
          set -uo pipefail
          mkdir -p "${RUN_DIRECTORY}"
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          mini-extra swebench \
            --model "${MODEL_ID}" \
            --subset "${{ inputs.benchmark }}" \
            --split "${{ inputs.split }}" \
            --slice "0:1" \
            --workers 1 \
            --output "${RUN_DIRECTORY}" \
            --environment-class docker
          RUNNER_EXIT_CODE=$?
          set -e
          FINISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started_at=${STARTED_AT}" >> "${GITHUB_OUTPUT}"
          echo "finished_at=${FINISHED_AT}" >> "${GITHUB_OUTPUT}"
          echo "runner_exit_code=${RUNNER_EXIT_CODE}" >> "${GITHUB_OUTPUT}"

      - name: Build redacted result manifest
        if: always()
        env:
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          set -euo pipefail
          mkdir -p evaluation-results
          python3 scripts/ci/swe_evaluation_contract.py manifest \
            --output evaluation-results/manifest.json \
            --run-id "mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --reference mini-swe-agent \
            --reference-revision "${MINI_SWE_REVISION}" \
            --benchmark "${{ inputs.benchmark }}" \
            --split "${{ inputs.split }}" \
            --model-id "${MODEL_ID}" \
            --started-at "${{ steps.run.outputs.started_at }}" \
            --finished-at "${{ steps.run.outputs.finished_at }}" \
            --runner-exit-code "${{ steps.run.outputs.runner_exit_code }}" \
            --predictions "${RUN_DIRECTORY}/preds.json"
          python3 scripts/ci/swe_evaluation_contract.py audit evaluation-results/manifest.json

      - name: Upload redacted evaluation manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.5.0
        with:
          name: swe-evaluation-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: evaluation-results/manifest.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Set evaluation outcome
        if: always()
        run: |
          set -euo pipefail
          exit "${{ steps.run.outputs.runner_exit_code }}"
