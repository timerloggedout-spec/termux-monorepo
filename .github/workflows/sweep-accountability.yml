name: Sweep Accountability

on:
  push:
    paths-ignore:
      - "docs/ops/generated/sweep-ledger/**"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: HISTORICAL or CONTINUOUS
        required: true
        default: CONTINUOUS
      sweep_version:
        description: Analytical layer/version
        required: true
        default: v1
      iteration:
        description: Iteration number within the layer
        required: true
        default: "0"
      from:
        description: Optional lower bound (ISO-8601)
        required: false
        default: ""
      to:
        description: Optional upper bound (ISO-8601)
        required: false
        default: ""
  pull_request:
    types: [opened, reopened, synchronize, closed, ready_for_review, converted_to_draft]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: sweep-accountability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.type != 'Bot' &&
       !contains(github.event.comment.body, 'sweep accountability receipt'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate receipt contract
        run: python3 scripts/ci/test_sweep_accountability.py

      - name: Historical source census
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'HISTORICAL' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CENSUS_DIR="docs/ops/generated/sweep-ledger/census/${GITHUB_RUN_ID}"
          mkdir -p "$CENSUS_DIR"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100" > "$CENSUS_DIR/pulls.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" > "$CENSUS_DIR/issues.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > "$CENSUS_DIR/workflow-runs.json"
          python3 scripts/ci/sweep_census_counts.py "$CENSUS_DIR"

      - name: Record sweep observation
        env:
          MODE: ${{ github.event.inputs.mode }}
          SWEEP_VERSION: ${{ github.event.inputs.sweep_version }}
          ITERATION: ${{ github.event.inputs.iteration }}
          FROM_TIME: ${{ github.event.inputs.from }}
          TO_TIME: ${{ github.event.inputs.to }}
        run: |
          set -euo pipefail
          MODE="${MODE:-CONTINUOUS}"
          SWEEP_VERSION="${SWEEP_VERSION:-v1}"
          ITERATION="${ITERATION:-0}"
          FROM_TIME="${FROM_TIME:-}"
          TO_TIME="${TO_TIME:-}"
          git config user.name "termux-monorepo sweep"
          git config user.email "actions@users.noreply.github.com"
          # Receipt commits on non-master refs collide with master ledger
          # files (add/add) and move PR heads. Record only on master.
          # On master, skip a push whose tip is already a fresh receipt so
          # deploy contexts are not re-triggered until the Vercel rate limit clears.
          # Schedule and workflow_dispatch still record on master.
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "skip receipt push: ref ${GITHUB_REF} is not master"
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tip_subject="$(git log -1 --format=%s)"
            tip_epoch="$(git log -1 --format=%ct)"
            now_epoch="$(date -u +%s)"
            age=$((now_epoch - tip_epoch))
            if [ "$tip_subject" = "chore(ops): record sweep accountability receipt" ] && [ "$age" -lt 900 ]; then
              echo "skip receipt: tip is a sweep receipt ${age}s old (< 900s debounce)"
              exit 0
            fi
          fi
          START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          COMMITS="$(git rev-list --count HEAD)"
          HEAD_SHA="$(git rev-parse HEAD)"
          FIRST_SHA="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          EVENT_KIND="$GITHUB_EVENT_NAME"
          export COMMITS HEAD_SHA FIRST_SHA EVENT_KIND
          export CENSUS_DIR="${CENSUS_DIR:-}"
          FINDINGS="$(python3 scripts/ci/sweep_findings.py)"
          python3 scripts/ci/sweep_accountability.py \
            --repository "$GITHUB_REPOSITORY" \
            --sweep-version "$SWEEP_VERSION" \
            --iteration "$ITERATION" \
            --mode "$MODE" \
            --status SUCCESS \
            --coverage COMPLETE \
            --observed "$COMMITS" \
            --ref "$GITHUB_REF_NAME" \
            --from "$FROM_TIME" \
            --to "${TO_TIME:-$START}" \
            --query "event=$EVENT_KIND; historical census when requested" \
            --sources "[\"git://repository\",\"github://event/$GITHUB_EVENT_NAME\",\"github://actions/$GITHUB_RUN_ID\"]" \
            --provenance "{\"actor_type\":\"workflow\",\"actor\":\"$GITHUB_ACTOR\",\"tool\":\"GitHub Actions\",\"workflow\":\"$GITHUB_WORKFLOW\",\"run_id\":\"$GITHUB_RUN_ID\",\"event\":\"$GITHUB_EVENT_NAME\",\"source_refs\":[\"$RUN_URL\"],\"source_shas\":[\"$HEAD_SHA\",\"$FIRST_SHA\"]}" \
            --findings "$FINDINGS" \
            --actions "[{\"id\":\"sweep-$GITHUB_RUN_ID\",\"type\":\"accountability-sweep\",\"status\":\"SUCCEEDED\",\"actor\":\"$GITHUB_ACTOR\",\"tool\":\"GitHub Actions\",\"target\":\"$GITHUB_REPOSITORY\"}]" \
            --effects "[{\"id\":\"effect-$GITHUB_RUN_ID\",\"type\":\"accountability-receipt\",\"after\":{\"head_sha\":\"$HEAD_SHA\",\"reachable_commits\":$COMMITS,\"trigger_event\":\"$EVENT_KIND\",\"run_url\":\"$RUN_URL\"}}]" \
            --coverage-reason "Git history is complete for the checked-out ref; external source census is explicit and retained when HISTORICAL mode is requested." \
            --out-dir docs/ops/generated/sweep-ledger
          git add docs/ops/generated/sweep-ledger
          if git diff --cached --quiet; then
            echo "No ledger delta"
            exit 0
          fi
          git commit -m "chore(ops): record sweep accountability receipt"
          # pull_request checkouts use GITHUB_REF_NAME like 1059/merge, which
          # is not a branch. Run 37148428849 failed: destination is not a full
          # refname. Receipts belong on the branch that was pushed, not the
          # merge ref. Issue/comment events also lack a writable branch.
          case "${GITHUB_REF}" in
            refs/heads/*) ;;
            *)
              echo "skip receipt push: event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} is not a branch"
              exit 0
              ;;
          esac
          # Receipt races are not compile failures. Run 37082734311 failed
          # non-fast-forward when another writer moved the ref. Retry once
          # by rebasing the ledger-only commit; leave the remote tip
          # authoritative if the ref moves again.
          set +e
          push_out="$(git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1)"
          push_rc=$?
          set -e
          printf '%s\n' "$push_out"
          if [ "$push_rc" -eq 0 ]; then
            exit 0
          fi
          if ! printf '%s\n' "$push_out" | grep -Eq 'non-fast-forward|rejected'; then
            exit "$push_rc"
          fi
          echo "receipt push rejected; rebasing ledger-only commit onto origin/${GITHUB_REF_NAME}"
          git fetch origin "${GITHUB_REF_NAME}"
          if git rebase --onto "origin/${GITHUB_REF_NAME}" HEAD~1 HEAD; then
            set +e
            retry_out="$(git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1)"
            retry_rc=$?
            set -e
            printf '%s\n' "$retry_out"
            if [ "$retry_rc" -ne 0 ]; then
              echo "receipt still superseded after rebase; remote tip remains authoritative"
            fi
          else
            echo "receipt rebase conflict; remote tip remains authoritative"
            git rebase --abort || true
          fi
