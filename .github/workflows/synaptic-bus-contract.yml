name: SYNAPSE Synaptic Bus Contract

on:
  pull_request:
    paths:
      - "docs/ops/brain-architecture/contracts/**"
      - "tests/ops/test_synaptic_bus_contract.py"
      - "tests/ops/test_orchestration_receipt_adapter.py"
      - "tools/ade_synapse/**"
      - ".github/workflows/synaptic-bus-contract.yml"
  push:
    branches: [master, main]
    paths:
      - "docs/ops/brain-architecture/contracts/**"
      - "tests/ops/test_synaptic_bus_contract.py"
      - ".github/workflows/synaptic-bus-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.20,<5"
      - name: Validate Synaptic Bus schema and fixtures
        run: python -m unittest discover -s tests/ops -p 'test_*synaptic*.py' -v
