name: System One Experiment Lanes

on:
  pull_request:
    paths:
      - "scripts/decision_engines.py"
      - "scripts/laya_decision_stub.py"
      - "scripts/system_one_experiment.py"
      - "tests/test_system_one_experiment.py"
      - "scripts/system_one_adapters.py"
      - "tests/test_system_one_adapters.py"
      - "scripts/classifier_eval.py"
      - "tests/test_classifier_question_bank.py"
      - "tests/fixtures/classifier-question-bank.json"
      - "docs/ops/SYSTEM-ONE-EXPERIMENT-PLAN.md"
      - "docs/ops/CLASSIFIER-REGISTRY-AND-EVALUATION.md"
      - "docs/ops/REPO-TAXONOMY-AND-EVIDENCE-GOVERNANCE.md"
      - "docs/ops/repository-taxonomy.v1.json"
      - "scripts/eval_tournament.py"
      - "tests/test_eval_tournament.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system-one:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          python -m unittest tests.test_system_one_experiment tests.test_system_one_adapters tests.test_classifier_question_bank tests.test_eval_tournament -v
      - name: Run normalized System One cohort
        run: |
          mkdir -p artifacts/system-one
          python scripts/system_one_experiment.py --cohort gha-${{ github.run_id }}-${{ github.run_attempt }} --output artifacts/system-one/decisions.jsonl
      - name: Validate System One receipt contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(x) for x in Path("artifacts/system-one/decisions.jsonl").read_text().splitlines()]
          assert rows
          assert all(r["schema_version"] == "system-one.v1" for r in rows)
          assert all(r["experiment_id"].startswith("system-one:") for r in rows)
          assert {r["lane_id"] for r in rows} == {"A", "B", "C"}
          assert any(r["engine"] == "jev" and r["status"] == "UNAVAILABLE" for r in rows)
          print("validated", len(rows), "System One receipts")
          PY
      - name: Run classifier question-bank smoke cohort
        run: |
          python scripts/classifier_eval.py --workers 4 --run-id gha-${{ github.run_id }}-${{ github.run_attempt }} --source-commit "${{ github.sha }}" --output artifacts/system-one/classifier-eval.jsonl
      - name: Validate classifier receipt contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(x) for x in Path("artifacts/system-one/classifier-eval.jsonl").read_text().splitlines()]
          assert rows
          assert all(r["schema_version"] == "classifier-eval.v1" for r in rows)
          assert all(r["status"] == "OK" for r in rows)
          assert all(r["correct"] is True for r in rows)
          print("validated", len(rows), "classifier receipts")
          PY
      - name: Exercise offline pairwise tournament scorer
        run: |
          cat > artifacts/system-one/tournament-input.jsonl <<'JSONL'
          {"candidate_id":"baseline-a","question_id":"q1","expected":"yes","prediction":"yes","latency_ms":12}
          {"candidate_id":"baseline-a","question_id":"q2","expected":"no","prediction":"yes","latency_ms":22}
          {"candidate_id":"baseline-b","question_id":"q1","expected":"yes","prediction":"yes","latency_ms":15}
          {"candidate_id":"baseline-b","question_id":"q2","expected":"no","prediction":"no","latency_ms":25}
          JSONL
          python scripts/eval_tournament.py artifacts/system-one/tournament-input.jsonl --output artifacts/system-one/tournament-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/system-one/tournament-report.json").read_text())
          assert report["schema_version"] == "system-one-tournament.v1"
          assert report["candidates"]["baseline-b"]["exact_match_accuracy"] == 1.0
          assert report["pairwise"][0]["right_wins"] == 1
          print("validated offline tournament scoring")
          PY
      - name: Publish experiment receipts
        uses: actions/upload-artifact@v4
        with:
          name: system-one-experiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/system-one/*
          retention-days: 14
