name: target intake

# T.A.K. input layer: a Target Brief issue (label `target-brief`, from
# .github/ISSUE_TEMPLATE/target-brief.yml) wakes this workflow — event
# trigger, NO cron (trigger budget law). Intake parses the form body into
# the Foundry brief schema, validates scope/authorisation, and comments
# the taxonomy-mapped dispatch plan back onto the issue. Edits re-run it.
# Uses only github.token (issues: write) — no provisioned secrets.

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: target-intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 'target-brief')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1

      - name: Parse brief and build the dispatch plan
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > /tmp/issue-body.md
          set +e
          python3 -m ops.web_adapter_foundry.waf issue-intake /tmp/issue-body.md --markdown > /tmp/plan.md
          code=$?
          set -e
          {
            cat /tmp/plan.md
            echo
            echo "---"
            if [ "$code" -eq 0 ]; then
              echo "[MUSEai]@{role:{inventory}} dispatch package generated by \`waf issue-intake\` from this issue's brief. Stack resolves against \`ops/web_adapter_foundry/taxonomy.json\`; execution follows the plan's per-tool sites. Edit the issue to re-plan."
            else
              echo "[MUSEai]@{role:{inventory}} intake refused this brief (exit $code). Fix the fields above and edit the issue to re-run."
            fi
          } > /tmp/comment.md
          cat /tmp/comment.md

      - name: Comment the plan on the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md
