name: Team MVT — simultaneous provider lanes

on:
  workflow_dispatch:
    inputs:
      target_number:
        description: 'Issue/PR receiving lane receipts'
        required: true
        default: '337'
        type: string
      cohort:
        description: 'Repository ref used for the benchmark'
        required: true
        default: 'HEAD'
        type: string
  schedule:
    - cron: '*/15 * * * *'
  issues:
    types: [edited]
  push:
    branches: [master]
    paths:
      - '.github/workflows/team-mvt.yml'
      - '.github/actions/http-llm-invoke/action.yml'
      - 'scripts/provider_model_catalog.py'
      - 'scripts/model_performance_index.py'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: team-mvt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lane:
    if: github.event_name != 'issues' || github.event.issue.number == 337
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [a-ox-openrouter, b-other-openrouter, c-felo-prompt-variant, d-omni-peer]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve manager cohort
        id: manager
        env:
          EVENT: ${{ github.event_name }}
          INPUT_COHORT: ${{ inputs.cohort }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MANAGER="parallel-then-integrate"
            COHORT="${INPUT_COHORT:-HEAD}"
          else
            SLOT=$((10#$(date -u +%M) / 15 % 3))
            case "$SLOT" in
              0) MANAGER="baseline-peer-first";;
              1) MANAGER="free-capacity-first";;
              2) MANAGER="parallel-then-integrate";;
            esac
            COHORT="HEAD"
          fi
          echo "manager=$MANAGER" >> "$GITHUB_OUTPUT"
          echo "cohort=$COHORT" >> "$GITHUB_OUTPUT"

      - name: Poll live catalogs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FELO_AI_API: ${{ secrets.FELO_AI_API }}
        run: python3 scripts/provider_model_catalog.py --output /tmp/catalog.json

      - name: Select lane model and prompt
        id: lane
        env:
          LANE: ${{ matrix.lane }}
          COHORT: ${{ steps.manager.outputs.cohort }}
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/catalog.json',encoding='utf-8'))
          lane=os.environ['LANE']; cohort=os.environ['COHORT']; manager=os.environ['MANAGER']
          def free(r): return r['pricing_classification']=='free_zero_price' or r['free_suffix']
          if lane=='a-ox-openrouter':
              provider='openrouter'; rows=[r for r in d['models'] if r['provider']==provider and r['id']=='stealth/ox-alpha']; variant='same-task-a'
              prompt=f'Manager={manager}. Cohort={cohort}. Analyze issue #337 as a team-orchestration benchmark. Identify the most important correctness risk, one concrete improvement, and how to validate it. Do not fabricate repository access.'
          elif lane=='b-other-openrouter':
              provider='openrouter'; rows=[r for r in d['models'] if r['provider']==provider and r['id']!='stealth/ox-alpha' and free(r)]; variant='same-task-b'
              prompt=f'Manager={manager}. Cohort={cohort}. Independently analyze issue #337 as a team-orchestration benchmark. Identify the most important correctness risk, one concrete improvement, and how to validate it. Do not fabricate repository access.'
          elif lane=='c-felo-prompt-variant':
              provider='felo'; rows=[r for r in d['models'] if r['provider']==provider and free(r)] or [r for r in d['models'] if r['provider']==provider]; variant='adversarial-c'
              prompt=f'Manager={manager}. Cohort={cohort}. Act as a skeptical experiment scientist. Analyze issue #337, actively search for confounders in simultaneous LLM testing, attribution, scoring, and rollback protection. Give a falsifiable improvement and a validation test.'
          else:
              provider='omni'; rows=[{'id':'auto'}]; variant='synthesis-d'
              prompt=f'Manager={manager}. Cohort={cohort}. Act as the integration manager. Analyze issue #337 and propose how four simultaneous model lanes should be compared without rewarding speed over correctness. Define the minimum evidence required to promote or cull a manager.'
          if not rows: raise SystemExit(f'no live candidate for {lane}')
          model=rows[0]['id']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'provider={provider}\nmodel={model}\nvariant={variant}\n')
              f.write('prompt<<EOF\n'+prompt+'\nEOF\n')
          print(f'{lane}: {provider}/{model} variant={variant} manager={manager} cohort={cohort}')
          PY

      - name: Invoke lane
        uses: ./.github/actions/http-llm-invoke
        with:
          provider: ${{ steps.lane.outputs.provider }}
          model: ${{ steps.lane.outputs.model }}
          role: review
          target_number: ${{ inputs.target_number || '337' }}
          api_key: ${{ steps.lane.outputs.provider == 'felo' && secrets.FELO_AI_API || steps.lane.outputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || secrets.OMNI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          prompt: ${{ steps.lane.outputs.prompt }}
          experiment_id: team-mvt-${{ github.run_id }}-${{ steps.manager.outputs.manager }}-${{ matrix.lane }}
          prompt_variant: ${{ steps.lane.outputs.variant }}

      - name: Write lane manifest
        if: always()
        env:
          MANAGER: ${{ steps.manager.outputs.manager }}
          COHORT: ${{ steps.manager.outputs.cohort }}
        run: |
          mkdir -p /tmp/evaluation
          cat > /tmp/evaluation/lane.json <<EOF
          {"schema":"team-mvt/v2","run_id":"${GITHUB_RUN_ID}","lane":"${{ matrix.lane }}","provider":"${{ steps.lane.outputs.provider }}","model":"${{ steps.lane.outputs.model }}","prompt_variant":"${{ steps.lane.outputs.variant }}","manager":"${MANAGER}","cohort":"${COHORT}"}
          EOF

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-mvt-${{ github.run_id }}-${{ matrix.lane }}
          path: |
            /tmp/evaluation/lane.json
            /tmp/model-performance/observations.ndjson
          if-no-files-found: ignore
