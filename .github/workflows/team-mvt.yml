name: Team MVT — simultaneous provider lanes

on:
  workflow_dispatch:
    inputs:
      target_number:
        description: 'Issue/PR receiving lane receipts'
        required: true
        default: '337'
        type: string
      cohort:
        description: 'Repository ref used for the benchmark'
        required: true
        default: 'HEAD'
        type: string
      ox_model:
        description: 'Optional Felo OX Alpha model id; blank selects the live documented trial candidate'
        required: false
        default: 'ox-alpha'
        type: string
  schedule:
    - cron: '*/15 * * * *'
  issues:
    types: [edited]
  push:
    branches: [master]
    paths:
      - '.github/workflows/team-mvt.yml'
      - '.github/actions/http-llm-invoke/action.yml'
      - 'scripts/provider_model_catalog.py'
      - 'scripts/model_performance_index.py'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: team-mvt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lane:
    if: github.event_name != 'issues' || github.event.issue.number == 337
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [a-ox-felo, b-other-openrouter, c-felo-prompt-variant, d-omni-peer]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve manager cohort
        id: manager
        env:
          EVENT: ${{ github.event_name }}
          INPUT_COHORT: ${{ inputs.cohort }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MANAGER="parallel-then-integrate"
            COHORT="${INPUT_COHORT:-HEAD}"
          else
            SLOT=$((10#$(date -u +%M) / 15 % 3))
            case "$SLOT" in
              0) MANAGER="baseline-peer-first";;
              1) MANAGER="free-capacity-first";;
              2) MANAGER="parallel-then-integrate";;
            esac
            COHORT="HEAD"
          fi
          echo "manager=$MANAGER" >> "$GITHUB_OUTPUT"
          echo "cohort=$COHORT" >> "$GITHUB_OUTPUT"

      - name: Poll live catalogs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FELO_AI_API: ${{ secrets.FELO_AI_API }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
        run: python3 scripts/provider_model_catalog.py --output /tmp/catalog.json

      - name: Select lane model and prompt
        id: lane
        env:
          LANE: ${{ matrix.lane }}
          COHORT: ${{ steps.manager.outputs.cohort }}
          MANAGER: ${{ steps.manager.outputs.manager }}
          OX_MODEL: ${{ inputs.ox_model }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/catalog.json',encoding='utf-8'))
          lane=os.environ['LANE']; cohort=os.environ['COHORT']; manager=os.environ['MANAGER']; requested=os.environ.get('OX_MODEL','').strip()
          def free(r): return r['pricing_classification']=='free_zero_price' or r['free_suffix'] or r.get('access_classification')=='free_trial'
          def missing_secret(provider): return any(e.get('provider') == provider and e.get('error') == 'missing_secret' for e in d.get('errors', []))
          provider=''; rows=[]; variant=''; prompt=''; eligible='true'; skip_reason=''; max_tokens='131072'
          if lane=='a-ox-felo':
              provider='felo'
              model_id=requested or 'ox-alpha'
              rows=[r for r in d['models'] if r['provider']==provider and r['id']==model_id and free(r)]
              variant='same-task-a'
              prompt=f'Manager={manager}. Cohort={cohort}. Analyze issue #337 as a team-orchestration benchmark. Identify the most important correctness risk, one concrete improvement, and how to validate it. Do not fabricate repository access.'
          elif lane=='b-other-openrouter':
              provider='openrouter'; rows=[r for r in d['models'] if r['provider']==provider and not ('ox-alpha' in str(r['id']).lower() or 'ox alpha' in str(r.get('name','')).lower()) and free(r)]; variant='same-task-b'
              prompt=f'Manager={manager}. Cohort={cohort}. Independently analyze issue #337 as a team-orchestration benchmark. Identify the most important correctness risk, one concrete improvement, and how to validate it. Do not fabricate repository access.'
          elif lane=='c-felo-prompt-variant':
              provider='felo'; rows=[r for r in d['models'] if r['provider']==provider and r['id']=='ox-alpha' and free(r)]; variant='adversarial-c'
              prompt=f'Manager={manager}. Cohort={cohort}. Act as a skeptical experiment scientist. Analyze issue #337, actively search for confounders in simultaneous LLM testing, attribution, scoring, and rollback protection. Give a falsifiable improvement and a validation test.'
          else:
              provider='omni'; rows=[{'id':'auto'}]; variant='synthesis-d'
              prompt=f'Manager={manager}. Cohort={cohort}. Act as the integration manager. Analyze issue #337 and propose how four simultaneous model lanes should be compared without rewarding speed over correctness. Define the minimum evidence required to promote or cull a manager.'
              if missing_secret('omni'):
                  rows=[]
                  eligible='false'
                  skip_reason='OMNI_API_KEY is not available to this run; do not emit a fake Omni lane'

          if not rows:
              eligible='false'
              if lane=='a-ox-felo':
                  skip_reason=skip_reason or 'no dynamically observed Felo OX Alpha free-trial candidate; do not substitute a different model'
              elif lane=='b-other-openrouter':
                  skip_reason=skip_reason or 'no dynamically observed free/zero-price OpenRouter peer; do not spend paid quota'
              elif lane=='c-felo-prompt-variant':
                  skip_reason=skip_reason or 'no dynamically observed Felo OX Alpha trial candidate for the adversarial prompt variant'
          else:
              reported_max=rows[0].get('max_output_tokens')
              if isinstance(reported_max, (int, float)) and reported_max > 0:
                  max_tokens=str(int(reported_max))

          model=rows[0]['id'] if rows else ''
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'provider={provider}\nmodel={model}\nvariant={variant}\neligible={eligible}\nskip_reason={skip_reason}\nmax_tokens={max_tokens}\n')
              f.write('prompt<<EOF\n'+prompt+'\nEOF\n')
          print(f'{lane}: {provider}/{model or "SKIP"} variant={variant} manager={manager} eligible={eligible} max_tokens={max_tokens} reason={skip_reason}')
          PY

      - name: Invoke lane
        if: steps.lane.outputs.eligible == 'true'
        uses: ./.github/actions/http-llm-invoke
        with:
          provider: ${{ steps.lane.outputs.provider }}
          model: ${{ steps.lane.outputs.model }}
          role: review
          target_number: ${{ inputs.target_number || '337' }}
          api_key: ${{ steps.lane.outputs.provider == 'felo' && secrets.FELO_AI_API || steps.lane.outputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || secrets.OMNI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          prompt: ${{ steps.lane.outputs.prompt }}
          experiment_id: team-mvt-${{ github.run_id }}-${{ steps.manager.outputs.manager }}-${{ matrix.lane }}
          prompt_variant: ${{ steps.lane.outputs.variant }}
          max_tokens: ${{ steps.lane.outputs.max_tokens }}
          post_comment: 'false'

      - name: Write lane manifest
        if: always()
        env:
          MANAGER: ${{ steps.manager.outputs.manager }}
          COHORT: ${{ steps.manager.outputs.cohort }}
        run: |
          mkdir -p /tmp/evaluation
          cat > /tmp/evaluation/lane.json <<EOF
          {"schema":"team-mvt/v3","run_id":"${GITHUB_RUN_ID}","lane":"${{ matrix.lane }}","provider":"${{ steps.lane.outputs.provider }}","model":"${{ steps.lane.outputs.model }}","prompt_variant":"${{ steps.lane.outputs.variant }}","manager":"${MANAGER}","cohort":"${COHORT}","eligible":"${{ steps.lane.outputs.eligible }}","skip_reason":"${{ steps.lane.outputs.skip_reason }}","max_tokens":"${{ steps.lane.outputs.max_tokens }}"}
          EOF

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-mvt-${{ github.run_id }}-${{ matrix.lane }}
          path: |
            /tmp/evaluation/lane.json
            /tmp/model-performance/observations.ndjson
          if-no-files-found: ignore
