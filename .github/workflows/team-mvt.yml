name: Team MVT — simultaneous provider lanes

on:
  workflow_dispatch:
    inputs:
      target_number:
        description: 'Issue/PR receiving lane receipts'
        required: true
        default: '337'
        type: string
      cohort:
        description: 'Repository ref used for the benchmark'
        required: true
        default: 'HEAD'
        type: string
      ox_model:
        description: 'Optional Felo OX Alpha model id; blank selects the live documented trial candidate'
        required: false
        default: 'ox-alpha'
        type: string
  schedule:
    - cron: '*/15 * * * *'
  issues:
    types: [edited]
  push:
    branches: [master]
    paths:
      - '.github/workflows/team-mvt.yml'
      - '.github/actions/http-llm-invoke/action.yml'
      - 'scripts/provider_model_catalog.py'
      - 'scripts/model_performance_index.py'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: team-mvt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lane:
    if: github.event_name != 'issues' || github.event.issue.number == 337
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [a-ox-felo, b-other-openrouter, c-felo-prompt-variant, d-omni-peer]
        trial: [1, 2, 3]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve manager cohort
        id: manager
        env:
          EVENT: ${{ github.event_name }}
          INPUT_COHORT: ${{ inputs.cohort }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MANAGER="parallel-then-integrate"
            COHORT="${INPUT_COHORT:-HEAD}"
          else
            SLOT=$((10#$(date -u +%M) / 15 % 3))
            case "$SLOT" in
              0) MANAGER="baseline-peer-first";;
              1) MANAGER="free-capacity-first";;
              2) MANAGER="parallel-then-integrate";;
            esac
            COHORT="HEAD"
          fi
          echo "manager=$MANAGER" >> "$GITHUB_OUTPUT"
          echo "cohort=$COHORT" >> "$GITHUB_OUTPUT"

      - name: Poll live catalogs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FELO_AI_API: ${{ secrets.FELO_AI_API }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
        run: python3 scripts/provider_model_catalog.py --output /tmp/catalog.json

      - name: Select DOE treatment
        id: lane
        env:
          LANE: ${{ matrix.lane }}
          TRIAL: ${{ matrix.trial }}
          COHORT: ${{ steps.manager.outputs.cohort }}
          MANAGER: ${{ steps.manager.outputs.manager }}
          OX_MODEL: ${{ inputs.ox_model }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/catalog.json',encoding='utf-8'))
          lane=os.environ['LANE']; trial=int(os.environ['TRIAL']); cohort=os.environ['COHORT']; manager=os.environ['MANAGER']; requested=os.environ.get('OX_MODEL','').strip()
          def free(r): return r['pricing_classification']=='free_zero_price' or r['free_suffix'] or r.get('access_classification')=='free_trial'
          def missing_secret(provider): return any(e.get('provider') == provider and e.get('error') == 'missing_secret' for e in d.get('errors', []))
          lane_index={'a-ox-felo':0,'b-other-openrouter':1,'c-felo-prompt-variant':2,'d-omni-peer':3}[lane]
          sequence_slot=(trial-1+lane_index) % 4
          provider=''; rows=[]; variant=''; prompt=''; eligible='true'; skip_reason=''; max_tokens='131072'; hypothesis=''; task_role=''
          if lane=='a-ox-felo':
              provider='felo'; model_id=requested or 'ox-alpha'
              rows=[r for r in d['models'] if r['provider']==provider and r['id']==model_id and free(r)]
              variant='same-task-a'; task_role='same-task-treatment'; hypothesis='Felo OX Alpha can solve the canonical orchestration task with correctness evidence under the live trial route.'
              prompt=f'Manager={manager}. Cohort={cohort}. Trial={trial}. Treatment=A. Analyze issue #337 as a team-orchestration benchmark. Identify the most important correctness risk, one concrete improvement, and how to validate it. Do not fabricate repository access.'
          elif lane=='b-other-openrouter':
              provider='openrouter'; rows=[r for r in d['models'] if r['provider']==provider and not ('ox-alpha' in str(r['id']).lower() or 'ox alpha' in str(r.get('name','')).lower()) and free(r)]; variant='same-task-b'; task_role='same-task-control'; hypothesis='A dynamically admitted free OpenRouter peer provides a valid same-task control for the OX Alpha treatment.'
              prompt=f'Manager={manager}. Cohort={cohort}. Trial={trial}. Treatment=B. Independently analyze issue #337 as a team-orchestration benchmark. Identify the most important correctness risk, one concrete improvement, and how to validate it. Do not fabricate repository access.'
          elif lane=='c-felo-prompt-variant':
              provider='felo'; rows=[r for r in d['models'] if r['provider']==provider and r['id']=='ox-alpha' and free(r)]; variant='adversarial-c'; task_role='adversarial-review'; hypothesis='An adversarial reviewer prompt exposes orchestration confounders that a same-task treatment may miss.'
              prompt=f'Manager={manager}. Cohort={cohort}. Trial={trial}. Treatment=C. Act as a skeptical experiment scientist. Analyze issue #337, actively search for confounders in simultaneous LLM testing, attribution, scoring, and rollback protection. Give a falsifiable improvement and a validation test.'
          else:
              provider='omni'; rows=[{'id':'auto'}]; variant='synthesis-d'; task_role='integration-manager'; hypothesis='An integration-manager treatment can define evidence gates that prevent speed from outranking correctness across lanes.'
              prompt=f'Manager={manager}. Cohort={cohort}. Trial={trial}. Treatment=D. Act as the integration manager. Analyze issue #337 and propose how simultaneous model lanes should be compared without rewarding speed over correctness. Define the minimum evidence required to promote or cull a manager.'
              if missing_secret('omni'):
                  rows=[]; eligible='false'; skip_reason='OMNI_API_KEY is not available to this run; do not emit a fake Omni lane'

          if not rows:
              eligible='false'
              if lane=='a-ox-felo': skip_reason=skip_reason or 'no dynamically observed Felo OX Alpha free-trial candidate; do not substitute a different model'
              elif lane=='b-other-openrouter': skip_reason=skip_reason or 'no dynamically observed free/zero-price OpenRouter peer; do not spend paid quota'
              elif lane=='c-felo-prompt-variant': skip_reason=skip_reason or 'no dynamically observed Felo OX Alpha trial candidate for the adversarial prompt variant'
          else:
              reported_max=rows[0].get('max_output_tokens')
              if isinstance(reported_max, (int, float)) and reported_max > 0: max_tokens=str(int(reported_max))

          model=rows[0]['id'] if rows else ''
          treatment=f'{lane}:trial-{trial}'
          experiment_id=f'team-mvt-{os.environ.get("GITHUB_RUN_ID","local")}-{manager}-{treatment}'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k,v in {'provider':provider,'model':model,'variant':variant,'eligible':eligible,'skip_reason':skip_reason,'max_tokens':max_tokens,'task_role':task_role,'hypothesis':hypothesis,'sequence_slot':str(sequence_slot),'treatment':treatment,'experiment_id':experiment_id}.items(): f.write(f'{k}={v}\n')
              f.write('prompt<<EOF\n'+prompt+'\nEOF\n')
          print(json.dumps({'lane':lane,'trial':trial,'provider':provider,'model':model or 'SKIP','variant':variant,'manager':manager,'eligible':eligible,'max_tokens':max_tokens,'sequence_slot':sequence_slot,'hypothesis':hypothesis,'skip_reason':skip_reason},sort_keys=True))
          PY

      - name: Invoke lane
        id: invoke
        if: steps.lane.outputs.eligible == 'true'
        uses: ./.github/actions/http-llm-invoke
        with:
          provider: ${{ steps.lane.outputs.provider }}
          model: ${{ steps.lane.outputs.model }}
          role: review
          target_number: ${{ inputs.target_number || '337' }}
          api_key: ${{ steps.lane.outputs.provider == 'felo' && secrets.FELO_AI_API || steps.lane.outputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || secrets.OMNI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          prompt: ${{ steps.lane.outputs.prompt }}
          experiment_id: ${{ steps.lane.outputs.experiment_id }}
          prompt_variant: ${{ steps.lane.outputs.variant }}
          max_tokens: ${{ steps.lane.outputs.max_tokens }}
          post_comment: 'false'

      - name: Write lane manifest
        if: always()
        env:
          MANAGER: ${{ steps.manager.outputs.manager }}
          COHORT: ${{ steps.manager.outputs.cohort }}
        run: |
          mkdir -p /tmp/evaluation
          python3 - <<'PY'
          import json, os
          lane=os.environ['LANE']; trial=os.environ['TRIAL'] if 'TRIAL' in os.environ else '${{ matrix.trial }}'
          invoke='${{ steps.invoke.outcome }}' if '${{ steps.lane.outputs.eligible }}' == 'true' else 'skipped'
          data={
            'schema':'team-mvt/v4','run_id':'${{ github.run_id }}','lane':lane,'trial':int(trial),
            'provider':'${{ steps.lane.outputs.provider }}','model':'${{ steps.lane.outputs.model }}',
            'prompt_variant':'${{ steps.lane.outputs.variant }}','task_role':'${{ steps.lane.outputs.task_role }}',
            'hypothesis':'''${{ steps.lane.outputs.hypothesis }}''','manager':os.environ['MANAGER'],
            'cohort':os.environ['COHORT'],'eligible':'${{ steps.lane.outputs.eligible }}',
            'execution_status':invoke,'skip_reason':'''${{ steps.lane.outputs.skip_reason }}''',
            'max_tokens':'${{ steps.lane.outputs.max_tokens }}','sequence_slot':int('${{ steps.lane.outputs.sequence_slot }}'),
            'treatment_id':'${{ steps.lane.outputs.treatment }}','experiment_id':'${{ steps.lane.outputs.experiment_id }}',
            'task_outcome':'UNKNOWN','correctness':'UNKNOWN','integration':'UNKNOWN','regression':'UNKNOWN'
          }
          with open('/tmp/evaluation/lane.json','w',encoding='utf-8') as f: json.dump(data,f,sort_keys=True,indent=2)
          PY

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-mvt-${{ github.run_id }}-${{ matrix.lane }}-trial-${{ matrix.trial }}
          path: |
            /tmp/evaluation/lane.json
            /tmp/model-performance/observations.ndjson
          if-no-files-found: ignore

  evaluate:
    if: always()
    needs: lane
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download lane evidence
        uses: actions/download-artifact@v4
        with:
          pattern: team-mvt-${{ github.run_id }}-*-trial-*
          path: /tmp/team-mvt
          merge-multiple: false

      - name: Evaluate DOE evidence boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os
          paths=glob.glob('/tmp/team-mvt/**/lane.json', recursive=True)
          rows=[json.load(open(p,encoding='utf-8')) for p in paths]
          eligible=[r for r in rows if r['eligible']=='true']
          executed=[r for r in eligible if r['execution_status']=='success']
          failed=[r for r in eligible if r['execution_status']=='failure']
          skipped=[r for r in rows if r['eligible']!='true']
          trials={r['lane'] for r in rows}
          if len(rows) < 12: raise SystemExit(f'FAIL: expected 12 DOE cells, found {len(rows)}')
          print(json.dumps({'schema':'team-mvt-evaluation/v1','cells':len(rows),'eligible':len(eligible),'executed':len(executed),'execution_failures':len(failed),'skipped':len(skipped),'lanes':sorted(trials),'promotion_ready':False,'reason':'task correctness/evaluator evidence remains UNKNOWN until independent evaluation'},sort_keys=True))
          os.makedirs('/tmp/evaluation',exist_ok=True)
          with open('/tmp/evaluation/summary.json','w') as f: json.dump({'schema':'team-mvt-evaluation/v1','cells':len(rows),'eligible':len(eligible),'executed':len(executed),'execution_failures':len(failed),'skipped':len(skipped),'promotion_ready':False},f,indent=2)
          PY

      - name: Upload evaluation summary
        uses: actions/upload-artifact@v4
        with:
          name: team-mvt-${{ github.run_id }}-evaluation
          path: /tmp/evaluation/summary.json
