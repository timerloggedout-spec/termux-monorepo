name: teammate-portal-status-publish

# Teammate Portal (proposal hackathon-desk, PR #5840) reference + status page.
# Proposal documents follow source_ref; the renderer and locale assets share tooling_ref.
# Contract: docs/ops/REVIEW-PUBLISHING.md. Hand commits to gh-pages are wiped
# by tribute-dashboard-deploy (force-orphan); review routes run on GitHub Pages only.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Ref holding docs/proposals/active/hackathon-desk"
        required: false
        default: ""
        type: string
      tooling_ref:
        description: "Ref holding the renderer, catalogs, and translation manifest"
        required: false
        default: ""
        type: string
  push:
    branches: [master]
    paths:
      - "docs/proposals/active/hackathon-desk/**"
      - "localization/**"
      - "scripts/ops/render_teammate_portal_status.py"
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: teammate-portal-status-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve source and tooling refs
        id: ref
        env:
          IN_REF: ${{ inputs.source_ref }}
          IN_TOOLING_REF: ${{ inputs.tooling_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_ref="${IN_REF:-}"
          if [ -z "$source_ref" ]; then
            if gh api "repos/${{ github.repository }}/contents/docs/proposals/active/hackathon-desk/ITEMS.md?ref=master" >/dev/null 2>&1; then
              source_ref=master
            else
              source_ref=feat/hackathon-desk-full-20261124
            fi
          fi

          tooling_ref="${IN_TOOLING_REF:-}"
          if [ -z "$tooling_ref" ]; then
            tooling_ref=master
            assets=(
              "scripts/ops/render_teammate_portal_status.py"
              "localization/catalogs/teammate-portal/en.json"
              "localization/catalogs/teammate-portal/ur.json"
              "localization/manifests/teammate-portal.json"
            )
            for asset in "${assets[@]}"; do
              if ! gh api "repos/${{ github.repository }}/contents/$asset?ref=$tooling_ref" >/dev/null 2>&1; then
                tooling_ref=feat/polyglot-urdu-portal-20261127-clean
                break
              fi
            done
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "tooling_ref=$tooling_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.source_ref }}
          persist-credentials: false
      - name: Render reference + status
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_REF: ${{ steps.ref.outputs.source_ref }}
          TOOLING_REF: ${{ steps.ref.outputs.tooling_ref }}
        run: |
          set -euo pipefail
          pip install --quiet markdown==3.7
          renderer=scripts/ops/render_teammate_portal_status.py
          en_catalog=localization/catalogs/teammate-portal/en.json
          ur_catalog=localization/catalogs/teammate-portal/ur.json
          translation_manifest=localization/manifests/teammate-portal.json
          for asset in "$renderer" "$en_catalog" "$ur_catalog" "$translation_manifest"; do
            mkdir -p "$(dirname "$asset")"
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${{ github.repository }}/contents/$asset?ref=$TOOLING_REF" > "$asset"
          done
          python3 "$renderer" \
            --out _site/previews/pr-5840/hackathon-desk \
            --source-ref "$SRC_REF" --source-sha "$(git rev-parse HEAD)" \
            --repo "${{ github.repository }}" --pr 5840
          touch _site/.nojekyll
          echo "Status page: https://timerloggedout-spec.github.io/previews/pr-5840/hackathon-desk/ (source $SRC_REF; tooling $TOOLING_REF)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish (keep_files)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          personal_token: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN }}
          external_repository: timerloggedout-spec/timerloggedout-spec.github.io
          publish_dir: _site
          publish_branch: main
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy(teammate-portal-status): pr-5840 from ${{ steps.ref.outputs.source_ref }}"
