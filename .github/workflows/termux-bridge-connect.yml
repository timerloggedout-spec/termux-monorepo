name: Termux bridge connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live bridge manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/contents/ops/termux-bridge/current.json?ref=master" \
            --jq '.content' | tr -d '\n' | base64 -d | tee bridge.json
          python - <<'PY'
          import json
          d=json.load(open("bridge.json"))
          if d.get("status") != "active":
              raise SystemExit("bridge is not active")
          if not d.get("endpoint") or not d.get("port") or not d.get("ssh_user"):
              raise SystemExit("bridge manifest is incomplete; wait for Termux publisher")
          print(f"bridge={d['ssh_user']}@{d['endpoint']}:{d['port']}")
          PY
      - name: Install SSH identity
        env:
          SSH_KEY: ${{ secrets.TERMUX_MCP_SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_KEY" || { echo "Missing TERMUX_MCP_SSH_PRIVATE_KEY repository secret"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/termux_mcp
          chmod 600 ~/.ssh/termux_mcp
      - name: Verify host key and run fixed health check
        run: |
          host="$(python -c 'import json; print(json.load(open("bridge.json"))["endpoint"])')"
          port="$(python -c 'import json; print(json.load(open("bridge.json"))["port"])')"
          user="$(python -c 'import json; print(json.load(open("bridge.json"))["ssh_user"])')"
          test -n "${{ secrets.TERMUX_MCP_KNOWN_HOSTS }}" || { echo "Missing TERMUX_MCP_KNOWN_HOSTS repository secret"; exit 1; }
          printf '%s\n' "${{ secrets.TERMUX_MCP_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/termux_mcp -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 -o ConnectTimeout=15 -p "$port" "$user@$host" \
            'printf "termux bridge online\n"; id; uname -a'
