name: termux smoke

# Agentic Termux runtime surface check.
# The workflow check stays visible; the smoke suite runs for matching surfaces.
#
# On device:
#     python3 scripts/ci/termux_smoke.py
#     python3 scripts/ci/termux_smoke.py --with-optional
#
# The admission and default smoke paths use Python stdlib only.

on:
  pull_request:
  push:
    branches: [master, master-staging, termux-smoke]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: termux-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: agentic termux smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Determine Termux surface
        id: admission
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/gate_admission.py \
            --event "$EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Smoke gate regression tests
        if: steps.admission.outputs.required == 'true'
        run: python3 -B -m unittest discover -s tests -p 'test_termux_smoke.py' -v

      - name: Core smoke (required)
        if: steps.admission.outputs.required == 'true'
        run: python3 scripts/ci/termux_smoke.py

      - name: Optional agent-surface probes
        if: steps.admission.outputs.required == 'true'
        run: python3 scripts/ci/termux_smoke.py --with-optional
        # Optional probes never fail the job unless --strict is used later.
        continue-on-error: true

      - name: Termux surface unchanged
        if: steps.admission.outputs.required != 'true'
        run: echo "Termux surface unchanged; smoke execution skipped by admission."
