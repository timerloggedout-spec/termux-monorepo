name: termux smoke

# Termux runtime and device-surface validation. Scope: Termux-related paths only.
# Sits *after* repo-gate (hygiene) and *before* language-specific / provider work.
#
# On device:
#     python3 scripts/ci/termux_smoke.py
#     python3 scripts/ci/termux_smoke.py --with-optional
#
# The default path uses Python standard-library checks and local repository inputs.

on:
  pull_request:
    paths:
      - ".github/workflows/termux-smoke.yml"
      - "scripts/ci/termux_smoke.py"
      - "scripts/ci/termux_smoke/**"
      - "tests/test_termux_smoke.py"
      - "docs/TERMUX-SMOKE.md"
      - "docs/ops/TERMUX-*.md"
      - "termux-multi-agent/**"
      - "skyhook/**"
      - "archwiz/termux_*.py"
      - "archwiz/termux/**"
      - "**/*termux*"
      - "**/termux/**"
      - "docs/proposals/active/termux-*/**"
      - "docs/proposals/active/demo-portal/**"
      - "docs/proposals/active/archwiz-ui-protocol/**"
      - "docs/proposals/active/ratatui-tokio-terminal-dashboard/**"
  push:
    branches: [master, master-staging, termux-smoke]
    paths:
      - ".github/workflows/termux-smoke.yml"
      - "scripts/ci/termux_smoke.py"
      - "scripts/ci/termux_smoke/**"
      - "tests/test_termux_smoke.py"
      - "docs/TERMUX-SMOKE.md"
      - "docs/ops/TERMUX-*.md"
      - "termux-multi-agent/**"
      - "skyhook/**"
      - "archwiz/termux_*.py"
      - "archwiz/termux/**"
      - "**/*termux*"
      - "**/termux/**"
      - "docs/proposals/active/termux-*/**"
      - "docs/proposals/active/demo-portal/**"
      - "docs/proposals/active/archwiz-ui-protocol/**"
      - "docs/proposals/active/ratatui-tokio-terminal-dashboard/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: termux-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: agentic termux smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Smoke gate regression tests
        run: python3 -B -m unittest discover -s tests -p 'test_termux_smoke.py' -v

      - name: Core smoke (required)
        run: python3 scripts/ci/termux_smoke.py

      - name: Optional agent-surface probes
        run: python3 scripts/ci/termux_smoke.py --with-optional
        # Optional probes contribute advisory evidence; --strict promotes their failures to job failures.
        continue-on-error: true
