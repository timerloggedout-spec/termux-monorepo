name: traffic-feed-collect

# Landing traffic feed (traffic-feed/1): reads the GitHub Traffic API
# for the landing repo and writes data/traffic-feed.json there.
# Contract: docs/ops/REFERRAL-AUTOMATION.md (Traffic counters).
# Auth: OPERATOR_GITHUB_TOKEN — the workflow's own GITHUB_TOKEN cannot
# read another repo's traffic; the collector fails loudly if the
# secret lacks access, never writes a fabricated zero feed.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 2"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect landing traffic into the landing repo feed
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
        run: python3 scripts/referral/traffic_feed.py
