# Cross-repo publish: serialize the mirror commit so GitHub Pages deployment completes before landing navigation is promoted.
name: tribute-dashboard-deploy

# marketing (/) ≠ Tribute (/tribute/) ≠ legacy alias (/help-wanted/) ≠ Matrix (/matrix/) ≠ project hub (/termux-monorepo/)

on:
  push:
    branches: [master]
    paths:
      - "apps/tribute-dashboard/**"
      # LC-002 (lane-compounding, verified LC-001): status data is read
      # raw from master at page load, so status pushes no longer need a
      # redeploy. The generated files stay out of the trigger set and a
      # status.json-only push is carved out of the app glob.
      - "!apps/tribute-dashboard/data/status.json"
      - "apps/project-pages-hub/**"
      - "apps/graph-studio/v0.1.0/**"
      - ".github/workflows/tribute-dashboard-deploy.yml"
      - ".github/workflows/tribute-dashboard-preview.yml"
      - "scripts/build_dashboard_manifest.py"
      - "scripts/ci/verify_tribute_dashboard.py"
  workflow_dispatch:
    inputs:
      target:
        description: "pages | user-site | vercel | both | all (Vercel is opt-in to conserve the Hobby deployment quota)"
        required: false
        default: "user-site"


permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  enable-pages:
    name: enable-project-pages
    if: ${{ github.event_name == 'push' || contains(fromJSON('["pages","user-site","both","all",""]'), github.event.inputs.target || 'user-site') }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or update Pages site (branch gh-pages)
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER=timerloggedout-spec
          REPO=termux-monorepo
          API="https://api.github.com/repos/$OWNER/$REPO/pages"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::No GitHub token available for Pages configuration."
            exit 1
          fi

          CODE=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API")
          echo "GET pages => $CODE"

          if [ "$CODE" = "200" ]; then
            if jq -e '.source.branch == "gh-pages" and .source.path == "/"' /tmp/pages.json >/dev/null; then
              echo "Pages source already matches gh-pages:/; no configuration write needed."
              exit 0
            fi
            METHOD=PUT
          elif [ "$CODE" = "404" ]; then
            METHOD=POST
          else
            echo "::error::Unexpected Pages API status $CODE"
            cat /tmp/pages.json
            exit 1
          fi

          UPDATE_CODE=$(curl -sS -o /tmp/pages-update.json -w "%{http_code}" \
            -X "$METHOD" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          echo "$METHOD pages => $UPDATE_CODE"
          case "$UPDATE_CODE" in
            2??) cat /tmp/pages-update.json ;;
            *)
              echo "::error::Pages configuration failed with HTTP $UPDATE_CODE"
              cat /tmp/pages-update.json
              exit 1
              ;;
          esac

  pages:
    name: publish-gh-pages
    needs: [enable-pages]
    if: ${{ github.event_name == 'push' || contains(fromJSON('["pages","user-site","both","all",""]'), github.event.inputs.target || 'user-site') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js for Graph Studio
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and build Graph Studio
        working-directory: apps/graph-studio/v0.1.0
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Prepare project hub + matrix page
        run: |
          mkdir -p _site/data _site/graph-studio
          cp -a apps/graph-studio/v0.1.0/dist/. _site/graph-studio/
          cp apps/project-pages-hub/index.html _site/index.html
          cp apps/tribute-dashboard/matrix.html _site/matrix.html
          cp apps/tribute-dashboard/dashboard.css _site/dashboard.css
          cp apps/tribute-dashboard/site-nav.js _site/site-nav.js
          if [ -f docs/ops/generated/lane-matrix-status.json ]; then
            cp docs/ops/generated/lane-matrix-status.json _site/data/lane-matrix-status.json
          fi
          touch _site/.nojekyll
      - name: Opt gh-pages out of Vercel Git deployments
        # gh-pages is a force-orphaned static Pages artifact, not an app source.
        # Every Vercel project linked to this repo (mcp-hub, tribute-dash,
        # tribute-oversight, termux-monorepo) otherwise tries a Preview build
        # of it and fails because its Root Directory is absent here. Drop a
        # vercel.json at the root and at every known lane Root Directory so
        # Vercel skips the branch (git.deploymentEnabled) and, as a fallback,
        # cancels instead of failing (ignoreCommand). Additive only; no app files.
        run: |
          set -euo pipefail
          for d in . mcp-hub demo-portal/public deepseek-cli apps/tribute-dashboard apps/tribute-oversight; do
            mkdir -p "_site/$d"
            printf '%s\n' '{' '  "git": { "deploymentEnabled": false },' '  "ignoreCommand": "exit 0"' '}' > "_site/$d/vercel.json"
          done
          find _site -name vercel.json -print
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy(project-hub+matrix+graph-studio): ${{ github.sha }}"

  user-site:
    name: mirror-user-github-io
    needs: [pages]
    if: ${{ github.event_name == 'push' || contains(fromJSON('["user-site","both","all",""]'), github.event.inputs.target || 'all') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh offline provider quota coverage
        run: python3 scripts/provider_quota_coverage.py --output apps/tribute-dashboard/data/provider-quota-coverage.json
      - name: Refresh provenance-aware dashboard snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/tribute_status.py
          python3 scripts/ci/verify_tribute_dashboard.py
      - name: Prepare Tribute subtree
        run: |
          mkdir -p _tribute/data
          cp -a apps/tribute-dashboard/. _tribute/
      - name: Stamp version identities and content hashes
        run: |
          set -euo pipefail
          python3 scripts/build_dashboard_manifest.py \
            --root _tribute \
            --channel production \
            --source-ref "${GITHUB_REF_NAME}" \
            --source-sha "${GITHUB_SHA}" \
            --version-prefix "1.0.1"
          if [ -f docs/ops/generated/tribute-status.json ]; then
            cp docs/ops/generated/tribute-status.json _tribute/data/status.json
          fi
      - name: Prepare combined user-site artifact
        run: |
          set -euo pipefail
          mkdir -p _user_site/tribute _user_site/help-wanted _user_site/matrix/data
          cp -a _tribute/. _user_site/tribute/
          cp -a _tribute/. _user_site/help-wanted/
          cp apps/tribute-dashboard/matrix.html _user_site/matrix/index.html
          cp apps/tribute-dashboard/dashboard.css _user_site/matrix/dashboard.css
          cp apps/tribute-dashboard/site-nav.js _user_site/matrix/site-nav.js
          if [ -f docs/ops/generated/lane-matrix-status.json ]; then
            cp docs/ops/generated/lane-matrix-status.json _user_site/matrix/data/lane-matrix-status.json
          fi
          touch _user_site/.nojekyll _user_site/tribute/.nojekyll _user_site/help-wanted/.nojekyll _user_site/matrix/.nojekyll
      - name: Publish all user-site routes in one commit
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          external_repository: timerloggedout-spec/timerloggedout-spec.github.io
          publish_dir: _user_site
          publish_branch: main
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy(tribute+matrix): ${{ github.sha }}"
      - name: Prune orphaned files from owned subtrees
        env:
          PAT_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          # keep_files:true on the publish step overlays the artifact but
          # never deletes: files removed from apps/tribute-dashboard kept
          # serving forever (the queue-feed.json orphan, 2026-11-04).
          # The workflow owns exactly three landing subtrees; prune any
          # file in them that the just-published artifact does not carry.
          # Everything else in the landing repo (marketing root,
          # previews/, project sites) is hand-owned and untouchable.
          # Credential: the publish step's own proven chain (it writes
          # this same repo every run) — secrets.PAT_TOKEN alone died on
          # the first git-data call in-job (Repair 2026-11-04: its scope
          # does not cover this repo; status now printed in-step).
          # Done through the git-data API, not git push: three runs of a
          # bash git-push variant were rejected inside this job while the
          # publish step's own push (same secret) succeeded — the API
          # channel is the fleet's proven write path.
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error
          TOK = os.environ["PAT_TOKEN"]
          print("prune token present:", bool(TOK), "length:", len(TOK))
          API = "https://api.github.com/repos/timerloggedout-spec/timerloggedout-spec.github.io"
          OWNED = ("tribute/", "help-wanted/", "matrix/")
          def call(method, path, body=None):
              req = urllib.request.Request(API + path, method=method,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={"Authorization": "Bearer " + TOK,
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with urllib.request.urlopen(req) as r:
                      print(f"HTTP {r.status} {method} {path}")
                      return json.loads(r.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  detail = e.read().decode("utf-8", "replace")[:300]
                  print(f"HTTP {e.code} {method} {path} :: {detail}")
                  raise SystemExit(f"::error::prune API call failed: HTTP {e.code} {method} {path} :: {detail}")
          artifact = set()
          for root, _dirs, names in os.walk("_user_site"):
              for n in names:
                  artifact.add(os.path.relpath(os.path.join(root, n), "_user_site"))
          for attempt in (1, 2, 3):
              ref = call("GET", "/git/ref/heads/main")
              tip = ref["object"]["sha"]
              tree = call("GET", f"/git/trees/{tip}?recursive=1")
              orphans = [e["path"] for e in tree["tree"]
                         if e["type"] == "blob" and e["path"].startswith(OWNED)
                         and e["path"] not in artifact]
              print(f"attempt {attempt}: orphans = {len(orphans)}")
              for p in orphans: print("prune:", p)
              if not orphans:
                  break
              new_tree = call("POST", "/git/trees", {
                  "base_tree": tree["sha"],
                  "tree": [{"path": p, "mode": "100644", "type": "blob", "sha": None} for p in orphans]})
              commit = call("POST", "/git/commits", {
                  "message": "deploy-prune: remove orphaned files absent from the dashboard artifact",
                  "tree": new_tree["sha"], "parents": [tip]})
              try:
                  call("PATCH", "/git/refs/heads/main", {"sha": commit["sha"], "force": False})
                  print("prune commit pushed:", commit["sha"])
                  break
              except Exception as e:
                  print("ref update raced:", e)
          else:
              raise SystemExit("::error::prune could not land after 3 attempts")
          PYEOF
      - name: User-site URLs
        run: |
          echo "https://timerloggedout-spec.github.io/tribute/ (canonical)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://timerloggedout-spec.github.io/help-wanted/ (compatibility alias)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://timerloggedout-spec.github.io/matrix/" >> "$GITHUB_STEP_SUMMARY"

  vercel:
    name: vercel-prod
    if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["vercel","both","all"]'), github.event.inputs.target || 'pages') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Refresh offline provider quota coverage
        run: python3 scripts/provider_quota_coverage.py --output apps/tribute-dashboard/data/provider-quota-coverage.json
      - name: Refresh provenance-aware dashboard snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/tribute_status.py
          python3 scripts/ci/verify_tribute_dashboard.py
      - name: Sync status snapshot
        run: |
          mkdir -p apps/tribute-dashboard/data
          if [ -f docs/ops/generated/tribute-status.json ]; then
            cp docs/ops/generated/tribute-status.json apps/tribute-dashboard/data/status.json
          fi
          if [ -f docs/ops/generated/lane-matrix-status.json ]; then
            cp docs/ops/generated/lane-matrix-status.json apps/tribute-dashboard/data/lane-matrix-status.json
          fi
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::warning::VERCEL_TOKEN missing — skip"
            exit 0
          fi
          ORG="${VERCEL_ORG_ID:-team_jKHy7m9xZrvrGP5cAlIMPs3S}"
          cd apps/tribute-dashboard
          set +e
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope="$ORG" 2>&1 | tee /tmp/v.txt
          deploy_rc=${PIPESTATUS[0]}
          set -e
          if [ "$deploy_rc" -eq 0 ]; then
            {
              echo "### Vercel deployment"
              echo "- Outcome: command succeeded; verify deployment source SHA and READY state independently."
              echo "- Requested source SHA: $GITHUB_SHA"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if grep -Eqi 'api-deployments-free-per-day|deployment.{0,30}(quota|limit)|rate.?limit|too many requests|quota exceeded' /tmp/v.txt; then
            {
              echo "### Vercel deployment — provider capacity constrained"
              echo "- Outcome: quota/rate-limit response; Vercel is an optional non-gate."
              echo "- Requested source SHA: $GITHUB_SHA"
              echo "- Recovery: do not retry-loop. Keep GitHub Pages publication and CI moving; retry after capacity recovery or use only a separately provisioned, source-verified fallback lane."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Vercel quota/capacity exhausted; deployment skipped as non-gate. No blind retry."
          else
            {
              echo "### Vercel deployment — attempt failed"
              echo "- Outcome: deployment command exited $deploy_rc. Vercel is an optional non-gate; inspect the preceding logs before retrying."
              echo "- Requested source SHA: $GITHUB_SHA"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Vercel deployment failed (exit $deploy_rc); preserved as a warning, not a CI correctness failure."
          fi
          exit 0
