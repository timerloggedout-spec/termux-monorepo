name: tribute execute

# LIVE ONLY — no dry runs. Ever.
# PRIMARY: claim comment + upstream PR into author's repo.
# Interthread: after success → repository_dispatch tribute-followup poll.
# Foreign: accepts repository_dispatch tribute-execute.

on:
# Cadence owned by quota-dispatch-tree.yml (Tier 0 decision tree, issue #1573).
  workflow_dispatch:
    inputs:
      issue:
        description: Issue URL or owner/repo#n (empty = adaptive scout top-1 / mutual preference)
        required: false
        default: ""
      mode:
        description: claim-and-pr | claim-and-patch-zero-72
        required: false
        default: claim-and-pr
      daily_budget:
        description: Max live contributes per UTC day (soft ceiling this runner)
        required: false
        default: "8"
  repository_dispatch:
    types:
      - tribute-execute
      - tribute-foreign-execute

permissions:
  contents: read
  actions: write

concurrency:
  group: tribute-execute
  cancel-in-progress: false

jobs:
  budget:
    name: adaptive budget + inline scout
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write   # only to append auction receipts on branch tribute-auction/receipts
    outputs:
      allow: ${{ steps.gate.outputs.allow }}
      remaining: ${{ steps.gate.outputs.remaining }}
      issue: ${{ steps.gate.outputs.issue }}
      issue_label: ${{ steps.gate.outputs.issue_label }}
      mode: ${{ steps.gate.outputs.mode }}
      auction_result: ${{ steps.auction.outputs.auction_result }}
      auction_winner: ${{ steps.auction.outputs.auction_winner }}
      patch_ready: ${{ steps.auction.outputs.patch_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Gate (inline scout when needed)
        id: gate
        env:
          INPUT_ISSUE: ${{ github.event.inputs.issue || github.event.client_payload.issue || '' }}
          INPUT_MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'claim-and-pr' }}
          INPUT_BUDGET: ${{ github.event.inputs.daily_budget || github.event.client_payload.daily_budget || '8' }}
          EVENT_NAME: ${{ github.event_name }}
          OPERATOR_GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          ARCHWIZ_GITHUB_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GITHUB_TOKEN="${OPERATOR_GITHUB_TOKEN:-${OPERATOR_TOKEN:-${ARCHWIZ_GITHUB_TOKEN:-$GITHUB_TOKEN}}}"
          python3 <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          budget = int(os.environ.get("INPUT_BUDGET") or "8")
          day = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          path = Path("docs/ops/generated/tribute-daily-budget.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          data = {"day": day, "used": 0, "success": 0, "fail": 0, "events": [], "note": "ephemeral-runner soft ceiling"}
          remaining = budget
          issue = (os.environ.get("INPUT_ISSUE") or "").strip()
          issue_label = ""
          mode = (os.environ.get("INPUT_MODE") or "claim-and-pr").strip() or "claim-and-pr"
          event = os.environ.get("EVENT_NAME") or ""

          MUTUAL = [
              "https://github.com/DioNanos/codex-termux/issues/14",
              "https://github.com/GlassHaven/Haven/issues/273",
              "https://github.com/Kilo-Org/agentic-path/issues/25",
              "https://github.com/PubDeer/astro-loop/issues/42",
          ]

          if not issue:
              out = Path("docs/ops/generated/tribute-catalog.json")
              out.parent.mkdir(parents=True, exist_ok=True)
              for label in ("good first issue", "help wanted"):
                  subprocess.run(
                      ["python3", "scripts/ci/tribute_scout.py", "--max", "20", "--label", label, "--out", str(out)],
                      check=False,
                  )
                  items = []
                  if out.exists():
                      try:
                          items = json.loads(out.read_text()).get("items") or []
                      except Exception:
                          items = []
                  if items:
                      normalize = lambda value: " ".join(str(value or "").lower().replace("-", " ").split())
                      requested_label = label
                      candidate = next((
                          item for item in items
                          if any(normalize(label_name) == normalize(requested_label)
                                 for label_name in (item.get("labels") or []))
                      ), None)
                      if candidate:
                          issue = candidate.get("url") or candidate.get("html_url") or ""
                          issue_label = next(
                              (str(name) for name in (candidate.get("labels") or [])
                               if normalize(name) == normalize(label)),
                              "",
                          )
                          print(f"inline scout selected: score={candidate.get('score')} label={issue_label!r} {issue}")
                          break
                      print(f"inline scout returned no candidate carrying the requested label {label!r}")
              if not issue and MUTUAL:
                  issue = MUTUAL[0]
                  print(f"mutual fallback: {issue}")

          if mode == "claim-and-patch-zero-72" and not issue:
              issue = "https://github.com/vedantnimbarte/zero/issues/72"

          allow = "true" if issue else "false"
          print(f"day={day} remaining={remaining} allow={allow} issue={issue!r} mode={mode} event={event}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"allow={allow}\n")
              f.write(f"remaining={remaining}\n")
              f.write(f"issue={issue}\n")
              f.write(f"issue_label={issue_label}\n")
              f.write(f"mode={mode}\n")
          path.write_text(json.dumps(data, indent=2))
          PY

      - name: Claim auction (free endpoints ante + bid; System 1 preflight; real patch required)
        # docs/ops/TRIBUTE-AUCTION.md. Deterministic, read-only: the pool is
        # data/g4f-working/working-endpoints.json, credits/track record are
        # replayed from branch tribute-auction/receipts, repo priors come from
        # the honest outcome census. No winner above reserve -> no claim.
        # A winner without a real patch (HELP_WANTED_PATCH) -> no claim either:
        # nothing is posted on a foreign repo without a patch that passes preflight_pr.
        id: auction
        if: steps.gate.outputs.allow == 'true' && steps.gate.outputs.mode == 'claim-and-pr'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.gate.outputs.issue }}
          HELP_WANTED_PATCH: ${{ github.event.client_payload.patch || '' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/auction
          if git ls-remote --exit-code origin refs/heads/tribute-auction/receipts >/dev/null 2>&1; then
            git fetch --depth 1 origin tribute-auction/receipts
            git show FETCH_HEAD:receipts.jsonl > /tmp/auction/prev.jsonl 2>/dev/null || : > /tmp/auction/prev.jsonl
          else
            : > /tmp/auction/prev.jsonl
          fi
          cat_path=docs/ops/generated/tribute-catalog.json
          [ -f "$cat_path" ] || echo '{"items":[]}' > "$cat_path"
          python3 scripts/ci/tribute_auction.py auction --catalog "$cat_path" --issue "$ISSUE" --live-preflight --enrich \
            --ledger /tmp/auction/prev.jsonl --census docs/ops/generated/tribute-outcomes.json \
            --out /tmp/auction/new.jsonl
          if [ -n "${HELP_WANTED_PATCH}" ]; then echo "patch_ready=true" >> "$GITHUB_OUTPUT"; else echo "patch_ready=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "## Claim auction"
            jq -r '"\(.issue): **\(.result)** winner=\(.winner // "-") ev=\(.ev // "-") p=\(.p_real_merge // "-") bids=\(.bids|length)"' /tmp/auction/new.jsonl
            [ -n "${HELP_WANTED_PATCH}" ] || echo "No real patch supplied: no claim is posted (stake-only claims are retired)."
          } >> "$GITHUB_STEP_SUMMARY"
          # append-only receipts branch, in a separate worktree (the workspace keeps the catalog)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            rm -rf /tmp/rcpt; git worktree prune
            if git ls-remote --exit-code origin refs/heads/tribute-auction/receipts >/dev/null 2>&1; then
              git fetch -q --depth 1 origin tribute-auction/receipts && git worktree add -q --detach /tmp/rcpt FETCH_HEAD
            else
              git worktree add -q --detach /tmp/rcpt HEAD && git -C /tmp/rcpt checkout -q --orphan tribute-auction/receipts && git -C /tmp/rcpt rm -rqf .
            fi
            touch /tmp/rcpt/receipts.jsonl && cat /tmp/auction/new.jsonl >> /tmp/rcpt/receipts.jsonl
            git -C /tmp/rcpt add receipts.jsonl && git -C /tmp/rcpt commit -qm "tribute-auction: receipt $(date -u +%FT%H:%MZ) [skip render]"
            git -C /tmp/rcpt push -q origin HEAD:refs/heads/tribute-auction/receipts && break
            sleep $((attempt * 3))
          done

      - name: Upload catalog if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tribute-execute-gate
          path: |
            docs/ops/generated/tribute-catalog.json
            docs/ops/generated/tribute-daily-budget.json
          if-no-files-found: ignore

  fail_closed:
    name: fail-closed if nothing selected
    needs: budget
    if: needs.budget.outputs.allow != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: No issue selected
        run: |
          echo "::error::tribute execute selected no issue"
          exit 1

  claim:
    name: claim comment (stake)
    needs: budget
    # Auction gate: a winning endpoint AND a real patch, or no public claim.
    if: >-
      needs.budget.outputs.allow == 'true' && needs.budget.outputs.issue != '' &&
      (needs.budget.outputs.mode != 'claim-and-pr' ||
       (needs.budget.outputs.auction_winner != '' && needs.budget.outputs.patch_ready == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # only to append the claim receipt on branch tribute-auction/receipts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Live claim (no dry-run)
        env:
          GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE: ${{ needs.budget.outputs.issue }}
          REQUIRED_LABEL: ${{ needs.budget.outputs.issue_label }}
        run: |
          set -euo pipefail
          ARGS=(python3 scripts/ci/tribute_claim.py --issue "$ISSUE")
          if [ -n "$REQUIRED_LABEL" ]; then ARGS+=(--required-label "$REQUIRED_LABEL"); fi
          "${ARGS[@]}"

      - name: Evidence receipt
        if: success()
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/ci/tribute_evidence.py \
            --kind claim --issue "${{ needs.budget.outputs.issue }}" --ok true --run-url "$GITHUB_RUN_URL"

      - name: Auction claim receipt (settlement input)
        if: success() && needs.budget.outputs.auction_winner != ''
        env:
          ISSUE: ${{ needs.budget.outputs.issue }}
          WINNER: ${{ needs.budget.outputs.auction_winner }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rec="$(jq -nc --arg i "$ISSUE" --arg w "$WINNER" --arg t "$(date -u +%FT%TZ)" '{kind:"claim",issue:$i,winner:$w,at:$t}')"
          for attempt in 1 2 3; do
            rm -rf /tmp/rcpt; git worktree prune
            git fetch -q --depth 1 origin tribute-auction/receipts && git worktree add -q --detach /tmp/rcpt FETCH_HEAD || exit 0
            echo "$rec" >> /tmp/rcpt/receipts.jsonl
            git -C /tmp/rcpt add receipts.jsonl && git -C /tmp/rcpt commit -qm "tribute-auction: claim $(date -u +%FT%H:%MZ) [skip render]"
            git -C /tmp/rcpt push -q origin HEAD:refs/heads/tribute-auction/receipts && exit 0
            sleep $((attempt * 3))
          done

      - name: Evidence receipt (fail)
        if: failure()
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/ci/tribute_evidence.py \
            --kind claim --issue "${{ needs.budget.outputs.issue }}" --ok false --run-url "$GITHUB_RUN_URL" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tribute-claim-evidence
          path: docs/ops/generated/tribute-evidence/
          retention-days: 30
          if-no-files-found: ignore

  contribute:
    name: fork + commit + upstream PR
    needs: [budget, claim]
    if: needs.budget.outputs.allow == 'true' && needs.budget.outputs.mode == 'claim-and-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Contribute (PRIMARY upstream-pr)
        id: contrib
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HELP_WANTED_PATCH: ${{ github.event.client_payload.patch || '' }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::An operator PAT is required for upstream contribution"
            exit 1
          fi
          python3 scripts/ci/tribute_contribute.py --issue "${{ needs.budget.outputs.issue }}"

      - name: Evidence receipt (success)
        if: success()
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/ci/tribute_evidence.py \
            --kind stake_pr --issue "${{ needs.budget.outputs.issue }}" --ok true --extra '{"stage":"STAKE","gate_pass":false}' --run-url "$GITHUB_RUN_URL"

      - name: Evidence receipt (fail)
        if: failure()
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/ci/tribute_evidence.py \
            --kind stake_pr --issue "${{ needs.budget.outputs.issue }}" --ok false --extra '{"stage":"STAKE","gate_pass":false}' --run-url "$GITHUB_RUN_URL" || true

      - name: Interthread → followup poll
        if: always()
        env:
          TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # repository_dispatch foreign-hook compatible interthread
          curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"tribute-followup","client_payload":{"mode":"poll","source":"execute","run_id":"${{ github.run_id }}"}}' \
            || true
          echo "dispatched tribute-followup"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: help-wanted-contribute-evidence
          path: docs/ops/generated/tribute-evidence/
          retention-days: 30
          if-no-files-found: ignore

  patch-zero-72:
    name: external PR zero 72 ponytail
    if: needs.budget.outputs.mode == 'claim-and-patch-zero-72'
    needs: [budget, claim]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch + upstream PR
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.OPERATOR_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::An operator PAT is required for upstream contribution"
            exit 1
          fi
          python3 scripts/ci/tribute_contribute.py --issue "https://github.com/vedantnimbarte/zero/issues/72"
