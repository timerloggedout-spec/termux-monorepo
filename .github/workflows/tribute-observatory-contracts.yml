name: Tribute observatory contracts

on:
  pull_request:
    paths:
      - ".github/workflows/tribute-observatory-contracts.yml"
      - "apps/tribute-dashboard/data/doe-settings-register.json"
      - "apps/tribute-dashboard/doe-settings.html"
      - "apps/tribute-dashboard/family.html"
      - "apps/tribute-dashboard/quota-swarm.html"
      - "apps/tribute-dashboard/site-nav.js"
      - "apps/tribute-dashboard/sitemap.xml"
      - "apps/tribute-dashboard/surfaces-map.html"
      - "docs/ops/DASHBOARD-CHART-STANDARD.md"
      - "docs/ops/DOE-FAMILY.md"
      - "docs/ops/NESTED-FAMILY.md"
      - "docs/ops/SURFACES-MAP.md"
      - "ops/doe/settings-register.json"
      - "scripts/tracking/nested_family.py"
      - "tests/test_doe_settings_register.py"
      - "tests/test_tribute_family_integrity.py"
  push:
    branches: [master]
    paths:
      - ".github/workflows/tribute-observatory-contracts.yml"
      - "apps/tribute-dashboard/data/doe-settings-register.json"
      - "apps/tribute-dashboard/doe-settings.html"
      - "apps/tribute-dashboard/family.html"
      - "apps/tribute-dashboard/quota-swarm.html"
      - "apps/tribute-dashboard/site-nav.js"
      - "apps/tribute-dashboard/sitemap.xml"
      - "apps/tribute-dashboard/surfaces-map.html"
      - "docs/ops/DASHBOARD-CHART-STANDARD.md"
      - "docs/ops/DOE-FAMILY.md"
      - "docs/ops/NESTED-FAMILY.md"
      - "docs/ops/SURFACES-MAP.md"
      - "ops/doe/settings-register.json"
      - "scripts/tracking/nested_family.py"
      - "tests/test_doe_settings_register.py"
      - "tests/test_tribute_family_integrity.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tribute-observatory-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: DoE settings + Nested Family contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test DoE settings register
        run: python -B -m unittest discover -s tests -p 'test_doe_settings_register.py' -v
      - name: Test Tribute Family integrity
        run: python -B -m unittest discover -s tests -p 'test_tribute_family_integrity.py' -v
