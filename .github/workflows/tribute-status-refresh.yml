name: tribute-status-refresh

# Rebuild status + dashboard data from evidence + live foreign PR search.
# Keeps https://timerloggedout-spec.github.io/tribute/ current.

on:
# Cadence owned by quota-dispatch-tree.yml (Tier 0 decision tree, issue #1573).
  workflow_dispatch:
  repository_dispatch:
    types: [tribute-status-refresh, tribute-followup]
  workflow_run:
    workflows: ["tribute execute", "tribute-followup", "tribute scout"]
    types: [completed]

concurrency:
  group: tribute-status-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild status → dashboard data
        env:
          OPERATOR_GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          ARCHWIZ_GITHUB_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GITHUB_TOKEN="${OPERATOR_GITHUB_TOKEN:-${OPERATOR_TOKEN:-${ARCHWIZ_GITHUB_TOKEN:-$GITHUB_TOKEN}}}"
          python3 scripts/ci/tribute_status.py

      - name: Audit tribute lifecycle against upstream evidence
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPERATOR_GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          ARCHWIZ_GITHUB_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GITHUB_TOKEN="${OPERATOR_GITHUB_TOKEN:-${OPERATOR_TOKEN:-${ARCHWIZ_GITHUB_TOKEN:-$GITHUB_TOKEN}}}"
          python3 scripts/ci/tribute_audit.py

      - name: Honest outcome census + SLO (merged real / stake / closed-unmerged / open / yielded / retired)
        # Receipts (actioned/skipped/failed) are not outcomes. This step counts
        # foreign PR outcomes from the search API and merges them into
        # status.json as tribute_outcomes / outcome_slo. Never gates here;
        # tribute-outcome-slo.yml turns a FAIL into a red run.
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPERATOR_GITHUB_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          ARCHWIZ_GITHUB_TOKEN: ${{ secrets.ARCHWIZ_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GITHUB_TOKEN="${OPERATOR_GITHUB_TOKEN:-${OPERATOR_TOKEN:-${ARCHWIZ_GITHUB_TOKEN:-$GITHUB_TOKEN}}}"
          mkdir -p /tmp/s1dec
          if git ls-remote --exit-code origin refs/heads/tribute-s1/backfill >/dev/null 2>&1; then
            git fetch --depth 1 origin tribute-s1/backfill
            latest="$(git ls-tree --name-only FETCH_HEAD backfill/ 2>/dev/null | sort | tail -1 || true)"
            [ -n "$latest" ] && git show "FETCH_HEAD:$latest" > /tmp/s1dec/latest.jsonl || true
          fi
          python3 scripts/ci/tribute_outcomes.py --decisions /tmp/s1dec \
            --merge-into docs/ops/generated/tribute-status.json \
            --merge-into apps/tribute-dashboard/data/status.json \
            --summary "$GITHUB_STEP_SUMMARY"
          { echo; cat docs/ops/generated/tribute-outcomes.md; } >> docs/ops/generated/tribute-status.md

      - name: Settle claim auctions (replay receipts vs outcome census)
        # docs/ops/TRIBUTE-AUCTION.md: real merge -> ante + reward; stake-only /
        # closed-unmerged / no patch after claim -> ante forfeited. Writes the
        # ledger, a tribute_auction summary in status.json, and the Delphi
        # signals that are new since the last committed ledger.
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p /tmp/auction
          : > /tmp/auction/receipts.jsonl
          if git ls-remote --exit-code origin refs/heads/tribute-auction/receipts >/dev/null 2>&1; then
            git fetch -q --depth 1 origin tribute-auction/receipts
            git show FETCH_HEAD:receipts.jsonl > /tmp/auction/receipts.jsonl 2>/dev/null || true
          fi
          python3 scripts/ci/tribute_auction.py settle --receipts /tmp/auction/receipts.jsonl \
            --census docs/ops/generated/tribute-outcomes.json \
            --new-signals docs/ops/generated/tribute-auction-new-signals.json \
            --merge-into docs/ops/generated/tribute-status.json \
            --merge-into apps/tribute-dashboard/data/status.json

      - name: Commit if changed
        env:
          TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ops/generated/tribute-status.json \
                  docs/ops/generated/tribute-status.md \
                  apps/tribute-dashboard/data/status.json \
                  docs/ops/generated/tribute-audit.json \
                  docs/ops/generated/tribute-outcomes.json \
                  docs/ops/generated/tribute-outcomes.md \
                  apps/tribute-dashboard/data/tribute-outcomes.json \
                  docs/ops/generated/tribute-auction-ledger.json \
                  docs/ops/generated/tribute-auction-new-signals.json \
                  apps/tribute-dashboard/data/tribute-auction-ledger.json || true
          if git diff --staged --quiet; then
            echo "no status delta"
            exit 0
          fi
          git commit -m "ops(help-wanted): live status refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          remote="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          git remote set-url origin "$remote"
          attempt=1
          while [ "$attempt" -le 5 ]; do
            if git push origin HEAD:master; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebase onto origin/master"
            git fetch origin master
            if ! git rebase origin/master; then
              echo "rebase conflict on generated status; abort and skip"
              git rebase --abort || true
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep $((attempt))
          done
          echo "push still raced after 5 attempts; next refresh will land it"
          exit 0

      - name: Verify tribute audit actually refreshed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          from datetime import datetime, timezone
          try:
              d = json.load(open('docs/ops/generated/tribute-audit.json'))
              gen = datetime.fromisoformat(d['generated_at'])
              if gen.tzinfo is None:
                  gen = gen.replace(tzinfo=timezone.utc)
          except Exception as e:
              print(f'::error::tribute audit unreadable after refresh: {e}')
              sys.exit(1)
          age_min = (datetime.now(timezone.utc) - gen).total_seconds() / 60
          print(f"tribute audit generated_at={d['generated_at']} age={age_min:.1f}m")
          if age_min > 20:
              print(f'::error::tribute audit STALE after refresh (age {age_min:.0f}m > 20m): the audit step failed silently under continue-on-error; diagnostics are out of date (gap G-02)')
              sys.exit(1)
          PY

      - name: Deploy dashboard mirror
        env:
          TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN || secrets.ARCHWIZ_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/tribute-dashboard-deploy.yml/dispatches" \
            -d '{"ref":"master","inputs":{"target":"user-site"}}' || true
