name: Tunnel Canary
# Hybrid: honest bridge health from device-published manifest + TCP, but treat operational lag
# (stale/inactive/unreachable) as notice (exit 0) to avoid notification spam. Dual-gate remains separate.
# Device #1 (BLU B160V#1) opaque ID tmx-node-primary. Tailscale preferred; Pinggy fallback.
# Public obfuscation of device identification.
on:
# Cadence owned by quota-dispatch-tree.yml (Tier 0 decision tree, issue #1573).
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tunnel-canary
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ops/termux-bridge
      - name: Check bridge manifest + TCP + lag classification
        env:
          DEVICE_ID: tmx-node-primary
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, socket, sys
          from datetime import datetime, timezone
          device_id = os.environ.get("DEVICE_ID", "tmx-node-primary")
          print(f"::notice::device_id={device_id} (public obfuscated; BLU B160V#1 primary, replica #2)")
          try:
              m = json.load(open("ops/termux-bridge/current.json"))
          except Exception as e:
              print(f"::notice::lead_lag=lag_operational reason=manifest_missing_or_invalid {e}; not dual-gate; device_id={device_id}")
              sys.exit(0)
          now = datetime.now(timezone.utc)
          status, host, port = m.get("status"), m.get("endpoint"), m.get("port")
          obs = m.get("observed_at")
          ttl = int(m.get("ttl_minutes") or 60)
          age = None
          if obs:
              try:
                  age = (now - datetime.fromisoformat(obs.replace("Z", "+00:00"))).total_seconds() / 60
              except Exception:
                  age = None
          reachable = False
          err = ""
          if host and port:
              try:
                  with socket.create_connection((host, int(port)), timeout=8):
                      reachable = True
              except OSError as e:
                  err = str(e)
          lines = [
              "## Termux bridge",
              f"- device_id: `{device_id}`",
              f"- manifest status: `{status}`",
              f"- endpoint: `{host}:{port}`",
              f"- observed_at: `{obs}` (age: {'n/a' if age is None else f'{age:.0f} min'}, ttl {ttl} min)",
              f"- TCP reachable from runner: **{reachable}**",
          ]
          problems = []
          if status != "active":
              problems.append(f"manifest status is '{status}' (publisher not live)")
          if age is None or age > ttl * 2:
              problems.append("manifest is stale")
          if not reachable:
              problems.append(f"endpoint not reachable over TCP ({err})")
          if problems:
              lines.append("\n### Operational lag (non-gate)\n" + "\n".join(f"- {p}" for p in problems))
              summary = "\n".join(lines)
              print(summary)
              with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
                  f.write(summary + "\n")
              print(f"::notice::lead_lag=lag_operational problems={'; '.join(problems)}; not dual-gate; device_id={device_id}")
              sys.exit(0)
          print("::notice::bridge_up device_id=" + device_id)
          print("\n".join(lines))
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
              f.write("\n".join(lines) + "\n")
          PY

