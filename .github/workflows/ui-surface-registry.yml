name: UI surface registry

on:
  pull_request:
    paths:
      - "docs/ops/ui-surface-registry.json"
      - "docs/ops/ui-surface-registry.schema.json"
      - "scripts/validate-ui-surface-registry.py"
      - "scripts/requirements-ui-surface-registry.txt"
      - "tests/test_ui_surface_registry.py"
      - ".github/workflows/ui-surface-registry.yml"
  push:
    branches: [master]
    paths:
      - "docs/ops/ui-surface-registry.json"
      - "docs/ops/ui-surface-registry.schema.json"
      - "scripts/validate-ui-surface-registry.py"
      - "scripts/requirements-ui-surface-registry.txt"
      - "tests/test_ui_surface_registry.py"
      - ".github/workflows/ui-surface-registry.yml"

permissions:
  contents: read

concurrency:
  group: ui-surface-registry-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate registry and evidence paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ui-surface-registry.txt
      - name: Install validator
        run: python -m pip install -r scripts/requirements-ui-surface-registry.txt
      - name: Validate registry
        run: python scripts/validate-ui-surface-registry.py
      - name: Run registry contract tests
        run: python -m unittest discover -s tests -p 'test_ui_surface_registry.py' -v
