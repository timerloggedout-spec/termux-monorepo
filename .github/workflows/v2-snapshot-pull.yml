name: v2-snapshot-pull
# Repo Replay V2 (pack v2, diagnostics-hardened): pull the GitLab
# validator copy (auth-gated; token lives HERE as GITLAB_TOKEN) for ALL
# branches as a tree+blob pack and push it to
# timerloggedout-spec/repo-replay-data/v2-snapshot/ via
# OPERATOR_GITHUB_TOKEN. Layout: tree/<branch>/<path>; manifest v2
# carries per-branch head sha + file counts. Fetch pattern copied from
# gitlab-governed-reconciliation.yml (oauth2 Basic extraheader; token
# never in a URL, never printed). branches.tsv is written incrementally
# and uploaded as an artifact even on failure (run 41434360163 failed
# ~28 min into the fetch/pack step with logs unreachable — diagnose by
# artifact, not by log).
on: workflow_dispatch
permissions:
  contents: read
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch GitLab snapshot (all branches) + pack
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN:-}" ]; then echo "::error::GITLAB_TOKEN unset"; exit 1; fi
          df -h / | tail -1
          mkdir work && cd work && git init -q
          auth="$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w 0)"
          git -c http.extraheader="Authorization: Basic $auth" fetch --no-tags --depth 1 \
            "https://gitlab.com/a-group2180532/termux-monorepo.git" \
            "+refs/heads/*:refs/remotes/gitlab/*"
          echo "fetch done"; df -h / | tail -1
          git for-each-ref --format='%(refname)' refs/remotes/gitlab | wc -l
          mkdir -p ../tree
          : > ../branches.tsv
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/gitlab); do
            br="${ref#refs/remotes/gitlab/}"
            sha="$(git rev-parse "$ref")"
            mkdir -p "../tree/$br"
            git archive "$sha" | tar -x -C "../tree/$br"
            n="$(find "../tree/$br" -type f | wc -l)"
            printf '%s\t%s\t%s\n' "$br" "$sha" "$n" >> ../branches.tsv
            echo "branch $br files=$n"; df -h / | tail -1
          done
          cd ..
          FILES="$(find tree -type f | wc -l)"
          echo "files=$FILES" >> "$GITHUB_ENV"
          MAIN_SHA="$(awk -F'\t' '$1=="master"{print $2}' branches.tsv)"
          echo "gitlab_sha=${MAIN_SHA:-unknown}" >> "$GITHUB_ENV"
          tar -czf v2.tar.gz -C tree .
          sha256sum v2.tar.gz | awk '{print $1}' > tar.sha
          BYTES="$(stat -c%s v2.tar.gz)"
          echo "bytes=$BYTES" >> "$GITHUB_ENV"
          mkdir chunks && split -b 40M v2.tar.gz chunks/part-
          ls -la chunks/
      - name: Diagnostics artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-pull-diagnostics
          path: branches.tsv
          if-no-files-found: warn
      - name: Push pack to repo-replay-data
        env:
          OP_TOKEN: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OP_TOKEN:-}" ]; then echo "::error::OPERATOR_GITHUB_TOKEN unset"; exit 1; fi
          git clone -q "https://x-access-token:${OP_TOKEN}@github.com/timerloggedout-spec/repo-replay-data.git" data
          rm -rf data/v2-snapshot && mkdir -p data/v2-snapshot
          cp chunks/part-* data/v2-snapshot/
          python3 - << 'PY'
          import json, hashlib, os, datetime
          branches = {}
          for line in open('branches.tsv'):
              br, sha, n = line.rstrip('\n').split('\t')
              branches[br] = {'head_sha': sha, 'files': int(n)}
          chunks = sorted(f for f in os.listdir('data/v2-snapshot') if f.startswith('part-'))
          man = {
            'pack_version': 2,
            'source': 'gitlab.com/a-group2180532/termux-monorepo',
            'branches': branches,
            'head_sha': os.environ['gitlab_sha'],
            'files': int(os.environ['files']),
            'tar_sha256': open('tar.sha').read().strip(),
            'tar_bytes': int(os.environ['bytes']),
            'packed_at': datetime.datetime.utcnow().isoformat() + 'Z',
            'chunks': [{'name': c, 'sha256': hashlib.sha256(open(f'data/v2-snapshot/{c}','rb').read()).hexdigest()} for c in chunks],
          }
          json.dump(man, open('data/v2-snapshot/MANIFEST.json','w'), indent=1)
          print(man['head_sha'], man['files'], man['tar_bytes'], len(chunks), list(branches))
          PY
          cd data
          git config user.name "repo-replay snapshot pull"
          git config user.email "actions@users.noreply.github.com"
          git add v2-snapshot
          git commit -q -m "v2-snapshot: GitLab validator pack v2, all branches (master ${gitlab_sha}) [skip ci]"
          git push -q origin main
          echo "pushed"
