name: vercel-quota-probe
# Quota probe: full quota registry poll with a status-only public projection.
# Private CLI consumers retain their existing default output; this public job
# must not expose account readings, routing weights or legacy numeric log lines.
# (ops/quota/registry.json -> scripts/quota_poll.py). Run on demand only by the
# scheduled one-shots; no cron, so it is not a second monitor.
# Lean by design: sparse checkout of 4 paths, no installs, artifacts not commits.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ops/quota
            scripts/quota_poll.py
            ml/pipelines/moneyball/quota_weights.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Poll quotas
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          python3 scripts/quota_poll.py --public --registry ops/quota/registry.json --out quota-out
          {
            echo "### Quota observation status (private values withheld)"
            python3 -c "import json;[print('- '+r['resource_id']+': '+r['status']) for r in json.load(open('quota-out/quota-public-status.json'))['readings']]"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: quota-readings
          path: quota-out/quota-public-status.json
          retention-days: 7
