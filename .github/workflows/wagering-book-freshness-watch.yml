name: Wagering Book Freshness Watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'ops/agentic-gambling/book/**'
      - 'ops/moneyball/wagering-book.json'
      - 'apps/tribute-dashboard/data/wagering-book.json'
      - 'apps/tribute-dashboard/wagering-book.html'
      - 'scripts/moneyball/wagering_book_feed.py'
      - 'scripts/ci/check_wagering_book_freshness.py'
      - 'tests/test_wagering_book_page.py'
      - 'tests/test_wagering_book_freshness.py'
  pull_request:
    paths:
      - 'ops/agentic-gambling/book/**'
      - 'ops/moneyball/wagering-book.json'
      - 'apps/tribute-dashboard/data/wagering-book.json'
      - 'apps/tribute-dashboard/wagering-book.html'
      - 'scripts/moneyball/wagering_book_feed.py'
      - 'scripts/ci/check_wagering_book_freshness.py'
      - 'tests/test_wagering_book_page.py'
      - 'tests/test_wagering_book_freshness.py'

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify page and freshness contracts
        run: python -m pytest -q tests/test_wagering_book_page.py tests/test_wagering_book_freshness.py
      - name: Observe freshness and source parity
        id: freshness
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/check_wagering_book_freshness.py \
            --root . \
            --output "$RUNNER_TEMP/wagering-book-freshness.json" \
            --max-age-hours 48
      - name: Upload immutable observation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wagering-book-freshness-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: \${{ runner.temp }}/wagering-book-freshness.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce freshness result
        if: steps.freshness.outcome == 'failure'
        run: |
          echo "::error::Wagering Book freshness or source parity failed. Inspect the uploaded observation receipt."
          exit 1
