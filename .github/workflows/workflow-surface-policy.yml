name: Workflow Surface Policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/ci/workflow_surface_policy.py'
      - 'tests/test_workflow_surface_policy.py'
      - 'scripts/ci/automation_docs.py'
      - 'tests/test_automation_docs.py'
      - 'docs/ops/automation-decision-tree.md'
      - 'docs/ops/diagrams/**'
      - 'docs/ops/generated/**'
      - 'docs/schemas/model-success-matrix.yaml'
      - 'docs/schemas/llm-leaderboard-matrix.yaml'
      - 'docs/schemas/model-rotation.yaml'
      - 'docs/schemas/routing-priority.yaml'
      - 'docs/ops/OPERATOR_INTERACTIVE_ACTIONS.md'
      - 'docs/proposals/active/actions-refinements/**'
      - 'docs/proposals/active/rate-limit-rotation/**'

permissions: {}

concurrency:
  group: workflow-surface-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    # Classification is git-diff based: no pulls-API call, no scopes beyond
    # contents:read, and no action token-input defaults. The job therefore
    # compiles and runs identically on GitHub and on Buildkite PR builds
    # (github-actions plugin caps GITHUB_TOKEN at contents:read and previously
    # hard-failed dorny/paths-filter's static token validation, which also broke
    # verify and automation-documentation as broken dependencies).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      automation: ${{ steps.changes.outputs.automation }}
      source: ${{ steps.changes.outputs.source }}
      tests: ${{ steps.changes.outputs.tests }}
      docs: ${{ steps.changes.outputs.docs }}
      automation_docs: ${{ steps.changes.outputs.automation_docs }}
      high_impact_control_plane: ${{ steps.changes.outputs.high_impact_control_plane }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Classify changed surfaces
        id: changes
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin master
          BASE_HINT="${{ github.event.pull_request.base.sha }}"
          BASE="origin/master"
          if [ -n "${BASE_HINT}" ]; then
            if git fetch --no-tags --depth=1 origin "$BASE_HINT" 2>/dev/null; then
              BASE="$BASE_HINT"
            else
              echo "::notice::base sha $BASE_HINT unavailable; classifying against origin/master tip"
            fi
          fi
          git diff --name-only "$BASE" > changed_paths.txt
          echo "classification base: $BASE"
          python3 - <<'PY'
          import fnmatch, os

          with open("changed_paths.txt") as f:
              paths = [line.strip() for line in f if line.strip()]

          FILTERS = {
              "automation": [
                  ".github/workflows/**",
                  ".github/actions/**",
                  "scripts/ci/workflow_surface_policy.py",
                  "tests/test_workflow_surface_policy.py",
              ],
              "high_impact_control_plane": [
                  ".github/workflows/**",
                  ".github/actions/**",
                  "scripts/model_router.py",
                  "docs/schemas/model-success-matrix.yaml",
                  "docs/schemas/llm-leaderboard-matrix.yaml",
                  "docs/schemas/model-rotation.yaml",
                  "docs/schemas/routing-priority.yaml",
                  "docs/ops/OPERATOR_INTERACTIVE_ACTIONS.md",
              ],
              "automation_docs": [
                  ".github/workflows/**",
                  ".github/actions/**",
                  "scripts/model_router.py",
                  "scripts/ci/automation_docs.py",
                  "tests/test_automation_docs.py",
                  "docs/ops/automation-decision-tree.md",
                  "docs/ops/diagrams/**",
                  "docs/ops/generated/**",
                  "docs/schemas/model-success-matrix.yaml",
                  "docs/schemas/llm-leaderboard-matrix.yaml",
                  "docs/schemas/model-rotation.yaml",
                  "docs/schemas/routing-priority.yaml",
                  "docs/ops/OPERATOR_INTERACTIVE_ACTIONS.md",
                  "docs/proposals/active/actions-refinements/**",
                  "docs/proposals/active/rate-limit-rotation/**",
              ],
              "source": [
                  "**/*.py",
                  "**/*.sh",
                  "**/*.js",
                  "**/*.mjs",
                  "**/*.c",
                  "**/*.h",
                  "!tests/**",
                  "!scripts/ci/**",
              ],
              "tests": ["tests/**"],
              "docs": [
                  "docs/**",
                  ".github/ISSUE_TEMPLATE/**",
                  "**/README*",
                  "CONTRIBUTING.md",
                  "SECURITY.md",
                  "CODE_OF_CONDUCT.md",
              ],
          }

          def match(path, pattern):
              if pattern.startswith("**/"):
                  return fnmatch.fnmatch(path, pattern) or fnmatch.fnmatch(path, pattern[3:])
              return fnmatch.fnmatch(path, pattern)

          def changed(patterns):
              positive = [p for p in patterns if not p.startswith("!")]
              negative = [p[1:] for p in patterns if p.startswith("!")]
              hits = [p for p in paths if any(match(p, pat) for pat in positive)]
              hits = [p for p in hits if not any(match(p, pat) for pat in negative)]
              return bool(hits)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for name, patterns in FILTERS.items():
                  out.write("%s=%s\\n" % (name, "true" if changed(patterns) else "false"))
          PY


  verify:
    needs: route
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run workflow-surface policy tests
        run: python3 -m unittest tests.test_workflow_surface_policy tests.test_quota_dispatch_drift

      - name: Record boolean routing result
        env:
          AUTOMATION_CHANGED: ${{ needs.route.outputs.automation }}
          SOURCE_CHANGED: ${{ needs.route.outputs.source }}
          TESTS_CHANGED: ${{ needs.route.outputs.tests }}
          DOCS_CHANGED: ${{ needs.route.outputs.docs }}
          AUTOMATION_DOCS_CHANGED: ${{ needs.route.outputs.automation_docs }}
          HIGH_IMPACT_CONTROL_PLANE_CHANGED: ${{ needs.route.outputs.high_impact_control_plane }}
        run: |
          {
            echo '## Workflow Surface Policy'
            echo
            echo '| Surface | Changed |'
            echo '|---|---:|'
            echo "| Automation | ${AUTOMATION_CHANGED} |"
            echo "| Source | ${SOURCE_CHANGED} |"
            echo "| Tests | ${TESTS_CHANGED} |"
            echo "| Docs | ${DOCS_CHANGED} |"
            echo "| Automation documentation control plane | ${AUTOMATION_DOCS_CHANGED} |"
            echo "| High-impact automation control plane | ${HIGH_IMPACT_CONTROL_PLANE_CHANGED} |"
          } >> "$GITHUB_STEP_SUMMARY"

  automation-documentation:
    needs: route
    if: needs.route.outputs.automation_docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Regenerate deterministic automation documentation in workspace
        run: python3 scripts/ci/automation_docs.py --write

      - name: Validate deterministic automation documentation catalog
        run: |
          python3 -m unittest tests.test_automation_docs tests.test_automation_documentation_workflow
          python3 scripts/ci/automation_docs.py --check

      - name: Publish control-plane review summary
        env:
          HIGH_IMPACT_CONTROL_PLANE_CHANGED: ${{ needs.route.outputs.high_impact_control_plane }}
        run: |
          {
            echo '## Automation Documentation Freshness'
            echo
            if [ "${HIGH_IMPACT_CONTROL_PLANE_CHANGED}" = 'true' ]; then
              echo '**high-impact control-plane review required**'
            else
              echo '**documentation update required**'
            fi
            echo
            echo 'The catalog and rendered diagrams are deterministic, source-controlled artifacts.'
            echo 'This job is read-only: it does not create a branch, pull request, comment, provider request, or repository mutation.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reviewed documentation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: automation-documentation-preview
          path: |
            docs/ops/automation-decision-tree.md
            docs/ops/diagrams
            docs/ops/generated
          if-no-files-found: error
          retention-days: 7
