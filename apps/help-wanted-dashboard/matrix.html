<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LANE-MATRIX</title>
<meta name="description" content="LANE-MATRIX live board — monorepo PR lanes. Not nested under Tribute.">
<link rel="stylesheet" href="./dashboard.css">
<style>main{padding-top:1.5rem}.table-wrap{border:1px solid var(--line);border-radius:12px}.table{min-width:760px}</style>
</head>
<body>
<nav aria-label="Primary"><a class="brand" href="https://timerloggedout-spec.github.io/">Autonomous AI Employees</a><a href="https://timerloggedout-spec.github.io/">Marketing</a><a href="https://timerloggedout-spec.github.io/help-wanted/">Ops · Tribute</a><a href="https://timerloggedout-spec.github.io/matrix/" aria-current="page">Lane matrix</a><a href="https://timerloggedout-spec.github.io/help-wanted/quota.html">Quota</a><a href="https://timerloggedout-spec.github.io/help-wanted/admin.html">Admin</a><a href="https://timerloggedout-spec.github.io/help-wanted/oracle.html">Oracle</a><a href="https://timerloggedout-spec.github.io/help-wanted/3l0.html">3L0</a><a href="https://timerloggedout-spec.github.io/help-wanted/moneyball.html">MoneyBall</a><a href="https://help-wanted-oversight.vercel.app/">Vercel deployment</a><a href="https://timerloggedout-spec.github.io/help-wanted/sitemap.xml">Sitemap</a><a href="https://github.com/timerloggedout-spec/termux-monorepo">Monorepo</a></nav>
<main>
  <p class="label">Live board · not a PR · not Tribute</p>
  <h1>LANE-MATRIX</h1>
  <p class="lede" id="meta">Loading matrix…</p>
  <div class="grid" id="kpis"></div>
  <div class="table-wrap"><table class="table"><thead><tr><th>PR</th><th>Lane</th><th>Days</th><th>Reason</th><th>Title</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
  const sources=[
    'https://raw.githubusercontent.com/timerloggedout-spec/termux-monorepo/master/docs/ops/generated/lane-matrix-status.json?t='+Date.now(),
    './data/lane-matrix-status.json?t='+Date.now(),
    '/matrix/data/lane-matrix-status.json?t='+Date.now()
  ];
  let data=null;
  for(const u of sources){try{const r=await fetch(u,{cache:'no-store'});if(r.ok){data=await r.json();break}}catch(_){}}
  if(!data){document.getElementById('meta').textContent='Matrix unavailable.';return;}
  const counts=data.counts||{}, by=counts.by_lane||{};
  document.getElementById('meta').textContent='Observed '+(data.observed_at||'—')+' · '+(data.master_sha||'').slice(0,12)+' · '+(counts.open_prs||0)+' open PRs';
  const cards=[['Open',counts.open_prs||0],['EXTRACT',by.EXTRACT||0],['CANDIDATE',by.CANDIDATE||0],['NEED_EVIDENCE',by.NEED_EVIDENCE||0],['SUPERSEDE',by.SUPERSEDE||0]];
  document.getElementById('kpis').innerHTML=cards.map(([l,v])=>'<div class="card"><div class="label">'+esc(l)+'</div><div class="value">'+esc(v)+'</div></div>').join('');
  const rank=l=>({EXTRACT:0,CANDIDATE:1,NEED_EVIDENCE:2,SUPERSEDE:3}[l]??9);
  const prs=[...(data.prs||[])].sort((a,b)=>rank(a.lane)-rank(b.lane)||(b.days_open||0)-(a.days_open||0));
  document.getElementById('rows').innerHTML=prs.map(p=>'<tr><td><a href="'+esc(p.html_url||'#')+'">#'+esc(p.number)+'</a></td><td><span class="pill">'+esc(p.lane)+'</span></td><td>'+esc(p.days_open)+'</td><td>'+esc((p.reasons||[]).join(', '))+'</td><td>'+esc(p.title||'')+'</td></tr>').join('')||'<tr><td colspan="5">No rows.</td></tr>';
}
load();
</script>
</body>
</html>
