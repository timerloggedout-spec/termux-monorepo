<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning Queue</title>
<style>
 body{font:15px/1.45 system-ui,sans-serif;margin:0;background:#0f1419;color:#e6e6e6}
 main{max-width:960px;margin:0 auto;padding:24px}
 h1{font-size:22px;margin:0 0 4px} .muted{color:#8b98a5}
 form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0}
 input,textarea,button{font:inherit;padding:8px;border-radius:6px;border:1px solid #2f3b46;background:#16202a;color:inherit}
 textarea{grid-column:1/-1;min-height:60px} button{cursor:pointer;background:#1d9bf0;border:0;color:#fff}
 .counts span{display:inline-block;margin-right:12px}
 table{width:100%;border-collapse:collapse;margin-top:12px} td,th{padding:6px;border-bottom:1px solid #22303c;text-align:left;vertical-align:top}
 code{font-size:12px;color:#9fb3c8} .st{padding:2px 6px;border-radius:4px;background:#22303c}
</style>
</head>
<body><main>
 <h1>Planning Queue</h1>
 <div class="muted">POST /api/task &rarr; Pub/Sub &rarr; collector &rarr; Neon <code>ops_queue</code></div>
 <form id="f">
  <input name="source" placeholder="source (e.g. hark:ops)" required>
  <input name="kind" placeholder="kind (e.g. deploy)" required>
  <input name="repo" placeholder="owner/repo (optional)">
  <textarea name="payload" placeholder='payload JSON, e.g. {"note":"..."}'></textarea>
  <button>Queue task</button><span id="msg" class="muted"></span>
 </form>
 <div class="counts" id="counts"></div>
 <table><thead><tr><th>Created</th><th>Kind</th><th>Source / Repo</th><th>Status</th><th>Payload</th></tr></thead><tbody id="rows"></tbody></table>
</main>
<script>
const $=id=>document.getElementById(id);
function td(t){const e=document.createElement('td');e.textContent=t;return e}
async function load(){
 try{const r=await fetch('/api/queue?limit=100');const j=await r.json();
  $('counts').replaceChildren(...Object.entries(j.counts||{}).map(([k,v])=>{const s=document.createElement('span');s.textContent=k+': '+v;return s}));
  $('rows').replaceChildren(...(j.tasks||[]).map(t=>{const tr=document.createElement('tr');
   tr.append(td(new Date(t.createdAt).toLocaleString()),td(t.kind),td(t.source+(t.repo?' / '+t.repo:'')));
   const s=td('');const b=document.createElement('span');b.className='st';b.textContent=t.status+(t.claimedBy?' ('+t.claimedBy+')':'');s.append(b);tr.append(s);
   const p=td('');const c=document.createElement('code');c.textContent=JSON.stringify(t.payload);p.append(c);tr.append(p);return tr}));
 }catch(e){$('counts').textContent='Queue unavailable'}
}
$('f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);let payload={};
 try{payload=fd.get('payload')?JSON.parse(fd.get('payload')):{}}catch{$('msg').textContent='payload must be JSON';return}
 const r=await fetch('/api/task',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:fd.get('source'),kind:fd.get('kind'),repo:fd.get('repo')||null,payload})});
 const j=await r.json();$('msg').textContent=r.ok?'Queued '+j.task.id:(j.error||'failed');setTimeout(load,1200)};
load();setInterval(load,10000);
</script>
</body></html>
