<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14532d">
<title>StudySprint</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>StudySprint</h1>
  <p id="course-name"></p>
</header>

<nav id="tabs" role="tablist">
  <button data-view="today" class="tab active">Today</button>
  <button data-view="plan" class="tab">Plan / Receipt</button>
  <button data-view="reader" class="tab">Reader</button>
  <button data-view="sr" class="tab">SR Review</button>
  <button data-view="calendar" class="tab">Calendar</button>
  <button data-view="routes" class="tab">Routes</button>
  <button data-view="ingest" class="tab">Ingest</button>
</nav>

<main>
  <section id="view-today" class="view">
    <p id="today-summary"></p>
    <div id="today-sessions"></div>
    <p id="checkin-status" aria-live="polite"></p>
  </section>

  <section id="view-plan" class="view hidden">
    <div id="plan-body"></div>
    <pre id="receipt-body"></pre>
  </section>

  <section id="view-reader" class="view hidden">
    <select id="reader-section-select"></select>
    <div class="row">
      <button id="reader-prev">Prev</button>
      <button id="reader-next">Next</button>
    </div>
    <p id="reader-section"></p>
    <div id="reader-word" aria-live="polite"></div>
    <div class="row">
      <button id="reader-start">Start</button>
      <button id="reader-step">Step</button>
      <button id="reader-play">Play / Pause</button>
      <button id="reader-rewind">Rewind 10</button>
    </div>
  </section>

  <section id="view-sr" class="view hidden">
    <select id="sr-scheduler">
      <option value="fsrs" selected>FSRS</option>
      <option value="sm2">SM-2</option>
    </select>
    <div id="sr-front" class="card"></div>
    <div id="sr-back" class="card hidden"></div>
    <div class="row">
      <button id="sr-flip">Flip</button>
    </div>
    <div class="row grades">
      <button data-grade="1">1 Again</button>
      <button data-grade="2">2 Hard</button>
      <button data-grade="3">3 Good</button>
      <button data-grade="4">4 Easy</button>
    </div>
    <p id="sr-receipt" aria-live="polite"></p>
  </section>

  <section id="view-calendar" class="view hidden">
    <div id="calendar-body"></div>
  </section>

  <section id="view-routes" class="view hidden">
    <div id="routes-body"></div>
  </section>

  <section id="view-ingest" class="view hidden">
    <label>File
      <input type="file" id="ingest-file" accept=".txt,.md,text/plain">
    </label>
    <label>Photo
      <input type="file" id="ingest-camera" accept="image/*" capture="environment">
    </label>
    <div id="ingest-preview" aria-live="polite"></div>
    <div class="row">
      <button id="ingest-confirm" class="hidden">Confirm placement</button>
    </div>
    <p id="ingest-status" aria-live="polite"></p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
