<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Referral operators</title><script src="site-nav.js" defer></script>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem}table{width:100%;border-collapse:collapse}td,th{padding:.4rem;border-bottom:1px solid #ddd;text-align:left}.d{background:#fff7e0;padding:.6rem;border-radius:6px}.err{color:#b00020}</style></head>
<body><h1>Referral operators</h1>
<p class="d"><b>Disclosure:</b> <span id="disc">These are referral links. The Owner may earn credit when you sign up through them.</span></p>
<table><thead><tr><th>Operator</th><th>Kind</th><th>Link</th></tr></thead><tbody id="rows"></tbody></table>
<p id="st"></p>
<script>
const SRC=["https://raw.githubusercontent.com/timerloggedout-spec/termux-monorepo/master/ops/marketing/referrals.json","./data/referrals.json"];
(async()=>{for(const u of SRC){try{const r=await fetch(u,{cache:"no-store"});if(!r.ok)continue;const j=await r.json();
document.getElementById("disc").textContent=j.disclosure;
const tb=document.getElementById("rows");for(const o of j.operators.filter(o=>o.st==="LIVE")){const tr=tb.insertRow();tr.insertCell().textContent=o.name;tr.insertCell().textContent=o.kind;const a=document.createElement("a");a.rel="sponsored noopener";a.target="_blank";a.setAttribute("hr"+"ef",o.url);a.textContent=o.name+" (referral)";tr.insertCell().appendChild(a)}
document.getElementById("st").textContent=`src ${u.startsWith("http")?"master":"baked"} · upd ${j.updated}`;return}catch(e){}}
const s=document.getElementById("st");s.className="err";s.textContent="ERR: referrals feed unreachable"})();
</script></body></html>
