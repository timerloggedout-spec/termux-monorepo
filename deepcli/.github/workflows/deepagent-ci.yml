name: deepagent-ci
on:
  push:
    branches: [master, "feat/**"]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check deepcli/deepagent.py deepcli/llm/ || true
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python3 -c "import sys; sys.path.insert(0,'.'); import deepcli._v1_hindsight; print('ok')"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deepcli test suite
        run: python3 deepcli/tests/run.py
