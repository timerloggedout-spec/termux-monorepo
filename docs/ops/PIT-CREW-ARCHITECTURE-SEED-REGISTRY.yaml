evolution:
  version_rule: "Any change to role topology, Chief policy, factor levels, prompts, tools, model instance, evaluator or environment creates a new immutable seed version."
  lineage_fields: ["parent_seed_id","parent_version","change_set","hypothesis","experiment_id","arm_id","repetition","evidence_refs","doe_disposition"]
  inheritance: "A child seed inherits shared invariants and Crew Chief contract; it may change only declared architecture deltas."
  selection: "No popularity or single-run winner; compare replicated, blocked outcomes and fresh holdout."
  retirement: "Retire from future assignment only under preregistered rules; retain historical records and evidence."
  promotion: "DoE recommends; existing operator/policy authority separately approves exact immutable version."
