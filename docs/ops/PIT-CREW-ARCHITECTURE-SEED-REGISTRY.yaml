schema_version: "1.0.0"
registry_id: "pit-crew-architecture-seed-registry"
status: "proposal"
purpose: "Map every analogy architecture in PIT-CREW-ARCHITECTURE.md Section 7 to an independently versioned DoE treatment seed."
authority:
  crew_chief: "Preserved common Crew Chief contract; mission-scoped coordination only."
  doe: "Independent oversight of preregistration, assignment, measurement, monitoring, analysis and recommendation."
  dispatch: "Existing QUE/QDesk, phase engine, claims, router and execution adapters only."
  promotion: "Existing Operator and production gates only; DoE recommendation is not authorization."
  canonical_experiment_record: "docs/ops/corpus/EXPERIMENT.schema.json"
  canonical_tournament_record: "docs/ops/MANAGER-TOURNAMENT.schema.json"
shared_invariants:
  - "Same Crew Chief mandate, inputs, responsibilities and prohibited powers for every seed."
  - "No seed owns queue, scheduler, router, lease, execution, evidence ledger or promotion."
  - "One authoritative writer per protected resource."
  - "Independent verification; builder cannot self-certify."
  - "Unknown remains unknown; failures and deviations are retained."
  - "Treatment identity pins policy, role map, prompt/tool references, configured instances and environment."
  - "No live dispatch from this registry; seeds are proposals until separately authorized."
assignment:
  unit: "one mission/task instance × one seed × one repetition"
  control: "incumbent Pit Crew / manager policy"
  blocking: ["task_family","complexity_stratum","risk_tier","repository_surface","environment"]
  comparability: "same task contract, source baseline, acceptance rubric and independent verifier"
  holdout: "fresh task instances not used for seed design or tuning"
  missingness: "retain null/unknown/censored/failed observations; never zero-fill"
  contamination: "one task instance cannot silently cross arms"
seeds:
