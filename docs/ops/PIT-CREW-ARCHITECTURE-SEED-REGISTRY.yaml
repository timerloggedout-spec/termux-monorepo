    name: "Formula 1 pit crew"
    architecture_delta: "Specialist pods with timed synchronized handoffs"
    crew_chief_mode: "Fixed pit-stop checklist and explicit role call"
    factors: ["role specialization", "choreography", "capacity", "handoff protocol"]
    primary_outcomes: ["accepted integration time", "first-pass yield"]
    hard_guardrails: ["collision", "skipped verification", "unsafe concurrency"]
    target_task_families: ["bounded implementation and rapid integration"]
    control_arm_required: true
    independent_verifier_required: true
    doe_preregistration_required: true
    live_dispatch_authorized: false
    promotion_authorized: false
