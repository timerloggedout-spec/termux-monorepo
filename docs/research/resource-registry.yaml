schema_version: "1.0"
registry:
  identity: canonical-source-plus-version
  evidence_statuses: [confirmed, research, attributed, signal, speculative, disputed]
  horizons: [H0, H1, H2, H3]
  decision_statuses: [WATCH, INVESTIGATE, PROTOTYPE, ADOPT, REJECT, HOLD]
required:
  - resource_id
  - project
  - canonical_source
  - source_type
  - observed_at
  - evidence_status
  - horizon
  - confidence
  - decision_status
procurement:
  - license
  - maintenance
  - portability
  - offline_capability
  - interoperability
  - reproducibility
  - provenance
  - dependency_risk
  - lock_in_risk
  - security_surface
  - resource_cost
  - operational_fit
