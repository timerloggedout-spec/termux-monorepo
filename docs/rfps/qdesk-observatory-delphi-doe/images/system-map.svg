<rect class="bg" width="1280" height="760"/><text x="54" y="58" class="h">QDesk · Observatory · Delphi · DoE</text><text x="54" y="90" class="s">Integration architecture — canonical systems remain owners of their data and decisions</text>
<rect x="440" y="125" width="400" height="95" rx="18" class="core"/><text x="640" y="163" text-anchor="middle" class="t">QDesk pipeline coordinator</text><text x="640" y="192" text-anchor="middle" class="s">intake · idempotency · correlation · state machine</text>
<path class="a" d="M640 220 V260"/>
<rect x="65" y="275" width="340" height="125" rx="16" class="panel"/><text x="235" y="316" text-anchor="middle" class="t">Oracle Method + Delphi</text><text x="235" y="347" text-anchor="middle" class="s">RFP generator · blind panel · signed award</text><text x="235" y="374" text-anchor="middle" class="s">one gate · one ledger · one feed</text>
<rect x="470" y="275" width="340" height="125" rx="16" class="panel"/><text x="640" y="316" text-anchor="middle" class="t">DoE + Dreambeans</text><text x="640" y="347" text-anchor="middle" class="s">candidate census · design · cohorts</text><text x="640" y="374" text-anchor="middle" class="s">selection · cull · cherry-pick · inherit</text>
