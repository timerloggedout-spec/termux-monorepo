<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">QDesk Observatory integration architecture</title><desc id="desc">QDesk orchestration integrates existing Delphi, DoE, memory, evidence, provider, execution and observability systems without replacing their sources of truth.</desc>
<defs><style>
.bg{fill:#0b1220}.panel{fill:#111d31;stroke:#47617f;stroke-width:2}.core{fill:#172b46;stroke:#69b7ff;stroke-width:2.5}.evidence{fill:#102d2a;stroke:#55c6a5;stroke-width:2}.execution{fill:#302449;stroke:#b99aff;stroke-width:2}.ui{fill:#322819;stroke:#e7b86a;stroke-width:2}.t{fill:#f4f7fb;font:600 22px system-ui,sans-serif}.s{fill:#c1d0e0;font:16px system-ui,sans-serif}.h{fill:#8fc9ff;font:700 28px system-ui,sans-serif}.a{stroke:#8aa8c7;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.d{stroke:#65bba6;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow2)}
