<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">QDesk trigger to verified evolution pipeline</title><desc id="desc">A gated flow from request intake through evidence, Delphi review, DoE pool design, implementation, verification and next-generation feedback.</desc>
<defs><style>
.bg{fill:#0b1220}.node{fill:#14243a;stroke:#75b9f4;stroke-width:2}.gate{fill:#332a1a;stroke:#e7b86a;stroke-width:2}.verify{fill:#102e2a;stroke:#55c6a5;stroke-width:2}.hold{fill:#3b2028;stroke:#e58a9a;stroke-width:2}.t{fill:#f4f7fb;font:600 20px system-ui,sans-serif}.s{fill:#c1d0e0;font:15px system-ui,sans-serif}.h{fill:#8fc9ff;font:700 28px system-ui,sans-serif}.a{stroke:#8aa8c7;stroke-width:2.5;fill:none;marker-end:url(#arr)}.branch{stroke:#e7b86a;stroke-width:2;fill:none;marker-end:url(#arr2)}.small{fill:#b7c7d8;font:13px system-ui,sans-serif}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="#8aa8c7"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="#e7b86a"/></marker></defs>
<rect class="bg" width="1280" height="760"/><text x="50" y="55" class="h">Trigger → Review → Design → Implement → Verify → Evolve</text><text x="50" y="86" class="s">Every transition is idempotent, attributable and evidence-backed; protected actions remain gated.</text>
<rect x="55" y="145" width="220" height="100" rx="14" class="node"/><text x="165" y="184" text-anchor="middle" class="t">QDesk intake</text><text x="165" y="213" text-anchor="middle" class="s">normalize · dedupe</text>
<rect x="350" y="145" width="220" height="100" rx="14" class="node"/><text x="460" y="184" text-anchor="middle" class="t">Evidence check</text><text x="460" y="213" text-anchor="middle" class="s">sources · hashes · gaps</text>
<rect x="645" y="145" width="220" height="100" rx="14" class="node"/><text x="755" y="184" text-anchor="middle" class="t">Oracle generator</text><text x="755" y="213" text-anchor="middle" class="s">RFP + provenance</text>
<rect x="940" y="145" width="275" height="100" rx="14" class="gate"/><text x="1077" y="184" text-anchor="middle" class="t">Delphi blind review</text><text x="1077" y="213" text-anchor="middle" class="s">signed rounds · award / park</text>
<path class="a" d="M275 195 H350"/><path class="a" d="M570 195 H645"/><path class="a" d="M865 195 H940"/>
<rect x="940" y="315" width="275" height="100" rx="14" class="hold"/><text x="1077" y="354" text-anchor="middle" class="t">PARKED / HELD</text><text x="1077" y="383" text-anchor="middle" class="s">retain · recheck · no auto-build</text>
<path class="branch" d="M1077 245 V315"/><text x="1090" y="282" class="small">no award / veto</text>
<rect x="645" y="315" width="220" height="100" rx="14" class="node"/><text x="755" y="354" text-anchor="middle" class="t">DoE registration</text><text x="755" y="383" text-anchor="middle" class="s">factors · blocks · stopping</text>
<rect x="350" y="315" width="220" height="100" rx="14" class="node"/><text x="460" y="354" text-anchor="middle" class="t">Pool generation</text><text x="460" y="383" text-anchor="middle" class="s">census · candidates · seed</text>
<rect x="55" y="315" width="220" height="100" rx="14" class="node"/><text x="165" y="354" text-anchor="middle" class="t">Work packet</text><text x="165" y="383" text-anchor="middle" class="s">scope · base SHA · gates</text>
<path class="a" d="M940 365 H865"/><path class="a" d="M645 365 H570"/><path class="a" d="M350 365 H275"/>
<rect x="55" y="500" width="220" height="100" rx="14" class="node"/><text x="165" y="539" text-anchor="middle" class="t">Build / PR</text><text x="165" y="568" text-anchor="middle" class="s">authorized worker</text>
<rect x="350" y="500" width="220" height="100" rx="14" class="verify"/><text x="460" y="539" text-anchor="middle" class="t">Independent verify</text><text x="460" y="568" text-anchor="middle" class="s">tests · review · provenance</text>
<rect x="645" y="500" width="220" height="100" rx="14" class="verify"/><text x="755" y="539" text-anchor="middle" class="t">Outcome receipt</text><text x="755" y="568" text-anchor="middle" class="s">live outcome ≠ replay score</text>
<rect x="940" y="500" width="275" height="100" rx="14" class="verify"/><text x="1077" y="539" text-anchor="middle" class="t">Next generation</text><text x="1077" y="568" text-anchor="middle" class="s">cull · cherry-pick · propagate</text>
<path class="a" d="M165 415 V500"/><path class="a" d="M275 550 H350"/><path class="a" d="M570 550 H645"/><path class="a" d="M865 550 H940"/>
<path class="branch" d="M1077 600 V665 H165 V600"/><text x="620" y="696" text-anchor="middle" class="small">Feedback to new cohort; incumbent and negative results are retained</text>
</svg>