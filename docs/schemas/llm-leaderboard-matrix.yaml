# LLM leaderboard matrix — features for routing, not authority
#
# Policy (operator 2026-08-08 → 2026-08-09):
# - Public leaderboards = FEATURES for models
# - Our success matrices / ELO++ (3L0) = LABELS for routing decisions
# - FREE TIER ONLY in production Fallback
# - Selection mix percentages: SINGLE OWNER = model-success-matrix.yaml selection_mix
#
# Related: #94 #86 #88 #91 #90 #96 · Termux-Multi-Agents/*
# Implements: SM-01

version: 2
updated_at: "2026-08-09T01:20:00Z"
updated_by: grok
policy: free_tier_only

public_boards:
  - id: openrouter-free-collection
    url: https://openrouter.ai/collections/free-models
    notes: "Live free model roster rotates; always filter :free"
  - id: lmsys-arena
    url: https://lmarena.ai/
    notes: "Chatbot Arena Elo — general preference, not our harness"
  - id: artificial-analysis
    url: https://artificialanalysis.ai/
    notes: "Quality / speed / price composites"
  - id: openrouter-rankings
    url: https://openrouter.ai/rankings
    notes: "Usage-weighted popularity on OpenRouter"
  - id: huggingface-open-llm
    url: https://huggingface.co/spaces/open-llm-leaderboard/open_llm_leaderboard
    notes: "Open LLM leaderboard (academic benchmarks)"

immediate_role_picks:
  triage:
    preferred:
      - id: meta-llama/llama-3.3-70b-instruct:free
        context_tokens: 131000
        max_requests: 1
        strength: [classification, concise]
      - id: google/gemma-3-12b-it:free
        context_tokens: 128000
        max_requests: 1
        strength: [fast, general]
  review:
    preferred:
      - id: qwen/qwen3-coder:free
        context_tokens: 262000
        max_requests: 1
        strength: [code, review]
      - id: meta-llama/llama-3.3-70b-instruct:free
        context_tokens: 131000
        max_requests: 1
        strength: [general, code]
      - id: deepseek/deepseek-r1:free
        context_tokens: 128000
        max_requests: 1
        strength: [reasoning]
  invoke:
    preferred:
      - id: meta-llama/llama-3.3-70b-instruct:free
        context_tokens: 131000
        max_requests: 1
        strength: [assistant, general]
      - id: google/gemma-3-12b-it:free
        context_tokens: 128000
        max_requests: 1
        strength: [fast]

selection_modes:
  # Percentages live ONLY in model-success-matrix.yaml selection_mix
  control:
    description: "Use immediate_role_picks order (production control)"
    pct_key: control_pct
  mixed:
    description: "Weighted blend of our win-rate + public features"
    pct_key: mixed_pct
  random_valley:
    description: |
      Sample lower-ranked free models to discover saddles/valleys
      where our harness outperforms public #1s. Track experiment_id.
    pct_key: random_valley_pct
    status: active_sketch

our_success_metrics:
  store: docs/schemas/model-success-matrix.yaml  # SM-01 — single owner of %
  fields: [role, model, success, tokens_in, tokens_out, latency_ms, requests_used, human_override]
  ranking: ELO++ / 3L0

constraints:
  cost: free_only
  openrouter_suffix_required: ":free"
  reject_paid_routes: true
  max_prompt_chars:
    triage: 4000
    review: 24000
    invoke: 6000

easter_eggs:
  - id: egg-valley
    marker: "<!-- egg: low valleys often outrun peaks on free paths -->"
  - id: egg-label
    marker: "<!-- egg: public leaderboards are features; our win-rate is the label -->"
  - id: egg-3l0
    marker: "<!-- egg: 3L0 ranks our tasks; public boards rank other peoples' tasks -->"
  - id: egg-brush
    note: "Hygiene PRs: scrub local identity from scanners; keep .gitignored paths local"
  - id: egg-caveman
    marker: "<!-- egg: CAVEMAN stays; micro seed 6 lines / 85 tok -->"
