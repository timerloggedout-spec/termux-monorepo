# Model rotation & free-tier quota registry (policy reference)
#
# RUNTIME: soft budgets are currently inlined in
#   .github/actions/model-router/action.yml
# (no yq dependency on ubuntu-latest). Keep the shell table and this file
# in sync by hand until a parse path lands (RL-02 follow-up).
#
# Updated from AI Studio rate-limit page (issue #86 snapshot 2026-08-08).
#
# Policy:
# - Prefer high-RPD Lite models for triage/invoke
# - Reserve limited Flash RPD for review quality (soft 15/20)
# - On Gemini exhaustion → skip (OpenRouter HTTP invoke is RL-05 foundation)
# - Never hard-fail CI on quota; graceful skip + comment
# - Actions cache counters are per-branch best-effort (not global RPD)

version: 1
updated_at: "2026-08-08T21:00:00Z"
updated_by: grok
source_issue: 86

reset_tz: America/Los_Angeles

providers:
  gemini_ai_studio:
    secret: GEMINI_API_KEY
    notes: "Free tier CLI-Build project. RPM + TPM + RPD all apply."
    models:
      gemini-3.5-flash:
        id: gemini-3.5-flash
        category: text-out
        rpm: 5
        tpm: 250000
        rpd: 20
        soft_rpd: 15
        roles: [review]
        priority: 30
        status: constrained
        note: "Was 65/20 RPD and 7/5 RPM — primary exhaustion source"

      gemini-3.1-flash-lite:
        id: gemini-3.1-flash-lite
        category: text-out
        rpm: 15
        tpm: 250000
        rpd: 500
        soft_rpd: 450
        roles: [triage, invoke, review-fallback]
        priority: 10
        status: preferred

      gemini-3.5-flash-lite:
        id: gemini-3.5-flash-lite
        category: text-out
        rpm: 15
        tpm: 250000
        rpd: 500
        soft_rpd: 450
        roles: [triage, invoke, review-fallback]
        priority: 11
        status: preferred

      gemini-2.5-flash-lite:
        id: gemini-2.5-flash-lite
        category: text-out
        rpm: 10
        tpm: 250000
        rpd: 20
        soft_rpd: 15
        roles: [triage, invoke]
        priority: 40
        status: backup

      gemini-2.5-flash:
        id: gemini-2.5-flash
        category: text-out
        rpm: 5
        tpm: 250000
        rpd: 20
        soft_rpd: 15
        roles: [review]
        priority: 35
        status: backup

      gemini-3-flash:
        id: gemini-3-flash
        category: text-out
        rpm: 5
        tpm: 250000
        rpd: 20
        soft_rpd: 15
        roles: [review]
        priority: 36
        status: backup

  openrouter:
    secret: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    notes: "Fallback foundation only until HTTP invoke is wired (RL-05)."
    models:
      openrouter/auto:
        id: openrouter/auto
        roles: [triage, review, invoke]
        priority: 50
        status: fallback

role_matrix:
  triage:
    primary:
      - gemini-3.1-flash-lite
      - gemini-3.5-flash-lite
    fallback:
      - gemini-2.5-flash-lite
    max_prompt_chars: 4000
  review:
    primary:
      - gemini-3.5-flash
      - gemini-2.5-flash
      - gemini-3-flash
    fallback:
      - gemini-3.1-flash-lite
    max_prompt_chars: 8000
  invoke:
    primary:
      - gemini-3.1-flash-lite
      - gemini-3.5-flash-lite
    fallback: []
    max_prompt_chars: 6000

job_gate:
  daily_limit: 100
  note: "Target value for gemini-quota-gate when #81 lands (RL-06 still todo)."

related:
  quota_gate: .github/actions/gemini-quota-gate
  promote_pr: 81
  loadbalancer_pr: 72
  omniroute_issue: 91
