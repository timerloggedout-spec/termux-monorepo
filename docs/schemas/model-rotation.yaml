# Model rotation & free-tier quota registry (policy reference)
#
# RUNTIME: soft budgets are currently inlined in
#   .github/actions/model-router/action.yml
# (no yq dependency on ubuntu-latest). Keep the shell table and this file
# in sync by hand until a parse path lands (RL-02 follow-up).
#
# Updated from AI Studio rate-limit page (issue #86 snapshot 2026-08-08).
# FB-01 (2026-08-08): OpenRouter :free invoke is LIVE when Gemini soft budgets exhaust.
#
# Policy:
# - Prefer high-RPD Lite models for triage/invoke
# - Reserve limited Flash RPD for review quality (soft 15/20)
# - On Gemini exhaustion → OpenRouter :free models only (never paid)
# - Never hard-fail CI on quota; graceful skip + comment
# - Actions cache counters are per-branch best-effort (not global RPD)

