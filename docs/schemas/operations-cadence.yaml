schema: termux.operations-cadence/v1

clock:
  canonical_timezone: UTC
  quota_reset:
    anchor: monthly
    instant: "00:00:00Z"
    basis: github-actions-metered-usage
    rule: "Treat the GitHub billing boundary as UTC; never infer quota reset from operator-local time."
  runtime_env:
    OPS_CADENCE_TZ: UTC
    OPS_QUOTA_RESET_ANCHOR: monthly@00:00Z
    TZ: UTC

scheduling:
  require_explicit_timezone: true
  preferred_timezone: UTC
  avoid_top_of_hour: true
  preferred_minute_offsets: [7, 13, 17, 23, 27, 37, 43, 47, 53, 57]
  minimum_supported_interval_minutes: 5

concurrency:
  default_principle: "serialize conflicting writers; cancel stale observations; preserve long-running evidence"
  issue:
    group: "ops-issue-${{ github.event.issue.number || github.run_id }}"
    cancel_in_progress: false
  pull_request:
    group: "ops-pr-${{ github.event.pull_request.number || github.run_id }}"
    cancel_in_progress: true
  pull_request_synchronize:
    key: head_sha
    rule: "A new head supersedes stale review/observation work, but never cancels a distinct PR."

response_flow:
  issue: [RECEIVE, TRUST_BOUNDARY, DEDUPE, TRIAGE, ROUTE, ACT, WAIT, WATCH, VALIDATE, RECORD, REPEAT]
  pull_request: [RECEIVE, SNAPSHOT_SHA, TRUST_BOUNDARY, TRIAGE, CHECKS, REVIEW_LEASE, ACT, WAIT, WATCH, REFETCH, COMPARE, VALIDATE, RECORD, REPEAT]
  rule: "Queued, running, or commented is never equivalent to validated."

operating_lenses:
  agile:
    unit: event-to-evidence-micro-cycle
    principle: "small batch, visible state, inspect/adapt before the next mutation"
  musashi:
    kan: "broad situational awareness: queue, quota, dependencies, competing writers, current SHA"
    ken: "focused execution: one bounded task, one evidence target, one active write lease"
    principle: "scan wide; act narrow; integrate once"
  mayan_inspired:
    note: "Planning metaphor only; GitHub remains the authoritative civil/technical clock."
    kin: daily-operational-pulse
    uinal: 20-day-pattern-review
    tun: 360-day-architecture-review
    research_cycle: 260-day-longitudinal-experiment-horizon

quota_aware_admission:
  reset_window:
    pre_reset: "observe and avoid unnecessary retries near exhaustion"
    post_reset: "reconcile observed allowance before increasing parallelism"
  evidence:
    required: [provider, observed_at_utc, request_or_run_id]
    rule: "Never infer remaining quota from public entitlement alone."
  free_capacity:
    rule: "Promotional/free capacity is an experiment lane, not a permanent route."

security:
  issue_and_comment_text: untrusted-data
  pr_fork_code: untrusted-code
  taint_model:
    sources: [issue_title, issue_body, issue_comment, pull_request_title, pull_request_body, pull_request_diff]
    sinks: [shell_command, provider_prompt, repository_write, secret_bearing_request]
    principle: "Validate/normalize before crossing a sink."

observability:
  minimum_identity: [workflow, workflow_run, event, issue_or_pr, head_sha, observed_at_utc]
  state_model: [COMMITTED, EXECUTED, VALIDATED, PROMOTED]
  rule: "Failures are observations. Retry only under an explicit admission policy."

governance:
  default_mode: advisory_then_enforce
  migration: [inventory_and_report, align_high_impact_writers, enforce_on_workflow_changes]
  promotion: "Do not merge or promote automatically merely because cadence checks pass."
