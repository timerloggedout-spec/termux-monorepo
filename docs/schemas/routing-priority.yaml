# Routing priority — FREE TIER ROI (peer semantics)
# Operator clarification 2026-08-08: OmniRoute and OpenRouter are nearly equal
# peers. Selection is driven by the *model desired for the operation* + soft
# budget headroom + free-tier health — NOT a rigid "always burn Omni first".
#
# ADE / BIUDL: base URLs are auto-discovered from secrets or the catalog below.
# Never require a human to paste an endpoint for production free paths.

version: 3
updated_at: "2026-08-22T05:00:00Z"
policy: capability_scope_specialist_observe

peers:
  - id: omni
    kind: openai_compatible
    secrets: [OMNI_API_KEY, OMNIROUTE_API_KEY]
    base_url_secrets: [OMNI_BASE_URL, OMNIROUTE_BASE_URL]
    discovery:
      - https://cloud.omniroute.online/v1
    default_models:
      triage: auto/best-free
      review: auto/best-free
      invoke: auto/best-free
    soft_rpd:
      triage: 200
      review: 120
      invoke: 200
    notes: Free aggregation + auto failover (#91). Peer with OpenRouter.

  - id: openrouter
    kind: openai_compatible
    secrets: [OPENROUTER_API_KEY]
    base_url_secrets: [OPENROUTER_BASE_URL]
    discovery:
      - https://openrouter.ai/api/v1
    model_suffix_required: ":free"
    default_models:
      triage:
        - meta-llama/llama-3.3-70b-instruct:free
        - google/gemma-3-12b-it:free
      review:
        - qwen/qwen3-coder:free
        - meta-llama/llama-3.3-70b-instruct:free
        - deepseek/deepseek-r1:free
      invoke:
        - meta-llama/llama-3.3-70b-instruct:free
        - google/gemma-3-12b-it:free
    soft_rpd_per_model:
      meta-llama/llama-3.3-70b-instruct:free: 40
      google/gemma-3-12b-it:free: 40
      qwen/qwen3-coder:free: 30
      deepseek/deepseek-r1:free: 20
    account_soft_rpd_default: 50
    notes: Direct :free catalog. Peer with Omni. Account-wide free limit ~50 RPD default.

residual:
  - id: gemini
    secrets: [GEMINI_API_KEY]
    notes: AI Studio free RPD — residual / second-pass only. Do not lead.
  - id: jules
    notes: Cloud VM builder — async, not first-line triage/review.

selection_rule: |
  For role R and desired model M:
    1. Among peers that can serve M (or auto/best-free) with soft-budget headroom,
       pick the first with capacity (Omni and OpenRouter are equal priority band).
    2. Else residual Gemini soft budgets.
    3. Else skip + comment (never hard-fail CI on quota).

capability_scope_specialist:
  mode: observe
  rollback: set capability_spine_observe=false to remove the shadow recommendation; current execution routing remains unchanged
  requested_capabilities: [triage, review, invoke, security_analysis, implementation, test, autofix, fix_ci, resolve_merge_conflict, conflict_resolution]
  authority_effects: [read_only_analysis, review_request, branch_write, stacked_pull_request, provider_configuration]
  hard_gates:
    - declared_capability_and_effect
    - trusted_provenance_and_policy_gate
    - live_or_conservative_catalog_availability
    - quota_and_cooldown_headroom
    - current_sha_evidence_when_pr_scoped
    - explicit_confirm_branch_write_for_branch_effects
  decision_envelope:
    schema_version: 1
    contains: [mode, capability, state, recommendation, runner_up, candidate_availability, quota, evidence_confidence, score_components]
    excludes: [secrets, raw_issue_bodies, raw_review_bodies, command_fragments]
  specialist_boundaries:
    coderabbit: declared library actions only; branch effects remain explicit-confirmation operations
    qodo_and_devin: trusted review evidence only unless a separately declared provider action is approved
    jules: independent implementation specialist; not the default recipient when a native provider action is eligible
    copilot: candidate only after effective execution-identity availability is confirmed; blocked or unknown availability fails closed

matrix_semantics:
  repository_outcomes: primary routing evidence; capture correctness, substantive resolution, duplicate avoidance, safe-feedback time, cost, and coordinated asynchronous completion
  evidence_confidence: sample count, recency, provenance, and decision-version metadata; sparse evidence remains low confidence
  public_boards: contextual features only (llm-leaderboard-matrix.yaml), never a sole production authority
  initial_weights:
    repository_outcomes: 0.55
    evidence_confidence: 0.15
    public_inference: 0.15
    availability_and_headroom: 0.15
  valleys: under-ranked free models that win on OUR harness (loss landscape)
  labels: our success metrics + 3L0 / ELO++

related_issues: [91, 94, 86, 88, 93, 97, 100]
stack: 99
