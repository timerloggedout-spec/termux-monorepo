agent_control_specification_version: "0.4.0-alpha.1"
metadata:
  name: ceel-assert-acs-2x2
  version: "0.1.0"
extends: []
policies:
  email_policy:
    type: custom
    adapter: email_policy
intervention_points:
  pre_tool_call:
    policy_target: $.tool_call.args
    policy_target_kind: tool_args
    tool_name_from: $.tool_call.name
    policy:
      id: email_policy
  post_tool_call:
    policy_target: $.tool_result.value
    policy_target_kind: tool_result
    tool_name_from: $.tool_call.name
    policy:
      id: email_policy
tools:
  send_email:
    clearance: internal
