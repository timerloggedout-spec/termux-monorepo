[package]
name = "ratatui-tokio-dashboard"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Termux-first responsive system dashboard built with Ratatui and Tokio"
license = "MIT"

[dependencies]
color-eyre = "0.6"
crossterm = { version = "0.29", default-features = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
