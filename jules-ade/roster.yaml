# jules-ade roster — SSOT for multi-repo scavenge + focus
version: 1
updated_at: "2026-08-03T20:20:00Z"
updated_by: grok-archw1z
branch: feature/jules-ade

home:
  owner: timerloggedout-spec
  repo: termux-monorepo
  package_root: jules-ade/
  integration_branch: master-staging
  package_branch: feature/jules-ade
  smoke_branch: termux-smoke
  production_branch: master
  gates: [repo-gate, termux-smoke]

focus_first:
  local_drivers:
    - multi-ai-cli
    - deepcli
    - deepseek-cli
    - deepterm
  cloud_agents:
    - jules  # Google Jules API + MCP
    - antigravity  # SDK / orchestration patterns
  bridges:
    - jules-mcp  # @google/jules-mcp / community servers
    - termux-mcp  # on-device control (PR #7)
    - jules-dispatch  # batch YAML → parallel sessions

scavenge_templates:
  # Names from Jules Create Project UI — owner assumed timerloggedout-spec
  # Status: unknown until agent verifies visibility (may be private)
  jules_family:
    - name: jules-sdk-fork-rs
      role: rust_sdk
      upstream_hint: google-labs-code/jules-sdk
    - name: jules-action_fork
      role: github_action
    - name: jules-awesome-list_fork
      role: catalog
    - name: jules-multi-agent
      role: multi_agent_patterns
    - name: jules-foreman_fork
      role: task_foreman
    - name: jules-skill_fork
      role: skills_packaging
    - name: jules_api_cli_fork
      role: api_cli
    - name: jules-dispatch-cli_fork
      role: dispatch_cli
      upstream_hint: jules-dispatch / Yuuqq/jules-dispatch
    - name: jules-skills_fork
      role: skills_collection
    - name: jules-mcp-server_fork
      role: mcp_server
      upstream_hint: "@google/jules-mcp"
    - name: cjules_fork
      role: c_variant
    - name: gh-jules-workflow-development_fork
      role: gh_workflows
    - name: pi-jules_fork
      role: pi_agent_bridge
    - name: google-jules-workflow_fork
      role: google_workflow
    - name: google-jules-skill_fork
      role: google_skill
    - name: jules-studio_fork
      role: studio_ui
  antigravity_family:
    - name: antigravity-jules-orchestration_fork
      role: jules_antigravity_orchestration
    - name: llm-antigravity-orchestrator_fork
      role: llm_orchestrator
    - name: Antigravity_cli_sdk_fork
      role: cli_sdk
      upstream_hint: google-antigravity / google-antigravity SDK
    - name: Antigravity_2.0_fork
      role: antigravity_2
    - name: agy-sdk-agents_fork
      role: agy_agents
    - name: run-agy-sdk_fork
      role: run_harness
    - name: feishu-agy-sdk-bridge_fork
      role: feishu_bridge
    - name: lego_fork
      role: composition
    - name: STMoEOrchestrator_fork
      role: moe_orchestrator

policy:
  scavenge: depth-1-sparse-metadata
  human_only: [credential_rotation, history_rewrite, app_permissions]
  human_temporary: [termux_smoke_cherry_pick_until_automated]
  agent_owns: [branch, implement, pr, merge_to_master_staging, gates]
  package_merge: focused_prs_only  # never dump entire feature/jules-ade blind
