# ops/cadence/secrets-scan-policy.yml
# Cadence Dispatch Optimizer — quota-aware scan scheduling.
# Runners read this as documentation; workflows encode the same policy.
#
# Principle: run each scanner at the lowest-cost moment that still catches
# its class of finding. Device hooks stay thin; CI does the heavy lifting.

cadence:
  push:
    enabled: true
    scope: diff
    concurrency: cancel-in-progress
    paths_ignore: ["docs/**", "agent_workspaces/**", "*.md"]
    jobs: [gitleaks-diff]
    budget_seconds: 60

  pull_request:
    enabled: true
    scope: diff-against-base
    concurrency: cancel-in-progress
    jobs: [gitleaks-diff, entropy-diff]
    budget_seconds: 90

  scheduled_fast:
    cron: "0 */6 * * *"           # every 6h UTC
    scope: full-repo-tree
    jobs: [gitleaks-full]
    budget_seconds: 300

  scheduled_deep:
    cron: "0 3 * * 0"             # Sunday 03:00 UTC
    scope: full-history
    jobs: [gitleaks-history, trufflehog-history]
    budget_seconds: 1800

  manual:
    workflow_dispatch_inputs: [scope, tool, ref]
    jobs: [gitleaks-any, trufflehog-any, entropy-any]

quota:
  monthly_budget_minutes: 1200     # reserve vs GitHub free tier (2000)
  circuit_breaker:
    on_minutes_remaining_below: 300
    action: demote_scheduled_to_weekly
  notify:
    on_deep_scan_findings: true
