# Google Data Agent Kit — fleet guardrail policy (machine-readable tier map)
#
# SSOT for which Data Agent Kit controls are ENFORCED (IAM / permission /
# install layer) and which are only ADVISORY (agent instructions).
# Human design doc: docs/ops/DATA-AGENT-KIT-WIRING.md
# Activation runbook: docs/ops/DATA-AGENT-KIT-ACTIVATION.md
# Catalog entry: mcp-hub/catalog.json host id "google-data-agent-kit".
#
# Fleet rule implemented here: a destructive-action rule that lives only in
# an agent's instructions is NOT a guardrail. Enforcement sits at the
# credential/permission layer; skills and prompts are guidance.
# Second rule (owner, 2026-10-26): freemium-prep — wire EVERYTHING before
# signup, so trial credits fund usage, never setup.

schema: data-agent-kit-guardrail-policy/v2
status: wired_full_pending_gcp_project
updated: "2026-10-27"

kit:
  name: Google Data Agent Kit
  upstream: https://github.com/GoogleCloudPlatform/data-agent-kit-plugin
  plugin_version: 1.1.0
  license: Apache-2.0
  ga_date: "2026-09-30"
  cost: "Kit is free; standard pricing applies only to Google Cloud services used."
  servers_total: 11
  skills_total: 37

freemium:
  program: "Google Cloud Free Trial + Always Free"
  trial: "BLOCKED (owner ruling, 2026-10-26: the credit card is a block). $300 credit / 90 days would require a card for identity verification; that route is closed while the block stands. If it lifts: no automatic charge or upgrade at trial end, 30-day grace before deletion; eligibility = account never a paying GCP customer, trial never used."
  always_free_relevant:
    - "BigQuery: 1 TiB query processing/month + 10 GiB storage"
    - "Cloud Storage: 5 GiB regional storage (US regions)"
    - "Firestore: 1 GiB storage + daily read/write allowances (not a kit server; noted for completeness)"
  doctrine: >
    Complete ALL wiring (repo config, policy, skills, provisioning commands,
    runbook) BEFORE the owner creates the account. The 90-day trial clock
    starts at signup; credits are spent on usage and evaluation, never on
    setup. Budget alert is set on day 0 (alerts notify; they do not cap).
  operating_mode: >
    NO-CARD (current): a project with no billing account runs BigQuery in
    sandbox mode — 1 TiB queries/month, 10 GiB storage LIFETIME, all tables
    expire at 60 days, no streaming/DML/Data Transfer Service. Safe for the
    fleet because sandbox tables are a regenerable scratch copy of repo
    artifacts, never the system of record. Cloud Storage and Dataplex/
    Knowledge Catalog require billing and stay pending while the card
    block stands. If billing is ever attached, the Always Free allowances
    (BigQuery 1 TiB/mo + 10 GiB storage, GCS 5 GiB) cover the steady
    read-only workload and the project graduates with no re-wiring.

placeholders:
  project: "<GCP_PROJECT_ID>"        # no fleet GCP project exists yet (owner item)
  region: "<GCP_REGION>"              # set when the project is created
  telemetry_dataset: "fleet_telemetry"
  evidence_bucket: "<GCP_PROJECT_ID>-evidence"

identity:
  model: adc_impersonation_only
  service_account:
    name: dak-readonly
    email_form: "dak-readonly@<GCP_PROJECT_ID>.iam.gserviceaccount.com"
    purpose: "The only identity fleet agents may use for Data Agent Kit data work."
  service_account_keys: forbidden     # no key files; impersonation via ADC only
  owner_user_credentials_for_agent_work: forbidden
  impersonation_grant: "roles/iam.serviceAccountTokenCreator, granted to operator identities only"

readiness_classes:
  day_one: "Server answers usefully the moment the project exists and the API is enabled."
  instance_required: "Server is wired; it answers once a fleet instance of that service exists."
  local: "Server runs inside the plugin on the agent's machine; no GCP resource needed."
  iam_denied: "Server is wired for completeness; the fleet identity holds no role for it and the deny policy blocks its non-read-only tools."

servers:
  - server: dak-bigquery
    endpoint: https://bigquery.googleapis.com/mcp
    readiness: day_one
    enforced_roles:
      - { role: roles/bigquery.dataViewer, scope: "dataset <GCP_PROJECT_ID>.fleet_telemetry only" }
      - { role: roles/bigquery.jobUser, scope: "project (run queries; grants no data write)" }
    cost_guard: "Set maximum_bytes_billed on the telemetry dataset at creation (enforced version of the dry-run rule)."
    fleet_use: "Telemetry / provenance / reviewer-metrics / quota analysis (MVT-DoE lane). A BigQuery connector entry already exists in the ML pipeline registry (ml/pipelines/recon09/connectors.py). Under the card block this is the one day-one server that ACTIVATES: sandbox mode on a billing-less project (see freemium.operating_mode); loads are batch load jobs (no DML/streaming in sandbox); maximum_bytes_billed applies on billing-enabled projects — in sandbox the 1 TiB/mo cap is the enforced cost control."
  - server: dak-gcs
    endpoint: https://storage.googleapis.com/storage/mcp
    readiness: day_one
    enforced_roles:
      - { role: roles/storage.objectViewer, scope: "bucket gs://<GCP_PROJECT_ID>-evidence only" }
    fleet_use: "Evidence artifacts adjunct storage (read-only). REQUIRES BILLING: pending while the owner card block stands (Firebase Spark no longer includes Storage — Blaze-only since 2026-02-03)."
  - server: dak-kc
    endpoint: https://dataplex.googleapis.com/mcp
    readiness: day_one
    enforced_roles:
      - { role: roles/datacatalog.viewer, scope: "project (Knowledge Catalog read/discovery)" }
    note: "If the Dataplex endpoint requires roles/dataplex.viewer instead, grant that at provisioning and record the substitution here."
    fleet_use: "Knowledge Catalog discovery + lineage over the wired services. REQUIRES BILLING (Dataplex): pending while the owner card block stands."
  - server: dak-alloydb
    endpoint: https://alloydb.googleapis.com/mcp
    readiness: instance_required
    enforced_roles:
      - { role: roles/alloydb.viewer, scope: "project (metadata read; database data access additionally requires AlloyDB user provisioning per instance)" }
    fleet_use: "Future: only if a workload ever lands on AlloyDB (fleet Postgres today is Neon/Supabase)."
  - server: dak-cloudsql
    endpoint: https://sqladmin.googleapis.com/mcp
    readiness: instance_required
    enforced_roles:
      - { role: roles/cloudsql.viewer, scope: "project (instance metadata read-only)" }
    fleet_use: "Future: only if a Cloud SQL instance ever exists in the fleet."
  - server: dak-spanner
    endpoint: https://spanner.googleapis.com/mcp
    readiness: instance_required
    enforced_roles:
      - { role: roles/spanner.viewer, scope: "project (metadata)" }
      - { role: roles/spanner.databaseReader, scope: "per-database, granted only on databases in scope (read-only data)" }
    fleet_use: "Future: only if a Spanner database ever exists in the fleet."
  - server: dak-bigtable-data
    endpoint: https://bigtable.googleapis.com/mcp
    readiness: instance_required
    enforced_roles:
      - { role: roles/bigtable.reader, scope: "per-table where possible (read-only data access)" }
    fleet_use: "Future: only if a Bigtable instance ever exists in the fleet."
  - server: dak-bigtable
    endpoint: https://bigtableadmin.googleapis.com/mcp
    readiness: iam_denied
    enforced_roles: []
    note: "Admin plane. Wired for completeness; the fleet identity holds NO admin role and mcp-deny-nonreadonly-tools blocks its write tools. Granting any bigtable admin role requires a separate owner-approved design."
  - server: dak-spark
    endpoint: https://dataproc-$GCP_REGION.googleapis.com/mcp
    readiness: instance_required
    enforced_roles:
      - { role: roles/dataproc.viewer, scope: "project (clusters/jobs metadata read-only; job submission is a write and stays denied)" }
    fleet_use: "Future: lakehouse/Spark over Foundry/taxonomy exports if that lane ever moves to GCP."
  - server: dak-notebook
    endpoint: "local (plugin mcp/dist/index.js --mode=notebook)"
    readiness: local
    enforced_roles: []
    note: "Runs on the agent's machine inside the plugin; inherits the identity above when it calls data services."
  - server: dak-viz
    endpoint: "local (plugin mcp/dist/index.js --mode=visualization)"
    readiness: local
    enforced_roles: []
    note: "Runs on the agent's machine inside the plugin."

pipeline_surfaces_without_mcp_servers:
  - surface: "Dataform / dbt pipelines"
    wiring: "Skills only (dataform-bigquery, dbt-bigquery, data-autocleaning); read posture via roles/dataform.viewer where Dataform resources exist."
  - surface: "Managed Service for Apache Airflow / Composer"
    wiring: "Skills only (dag authoring, migrations, recommendations, composer troubleshooting). No read-only predefined Composer role is wired; DAG/log inspection rides the BigQuery/GCS surfaces until a role is verified at provisioning. Do not grant composer.user (it can trigger DAGs) under this policy."

enforced_tier:
  description: >
    Controls that hold even if the agent ignores every instruction:
    IAM/permission-layer mechanisms plus one install-layer control.
  controls:
    - id: readonly-service-account
      mechanism: "Dedicated service account with the per-server read-only roles listed under servers:; agents impersonate it via ADC. No write role exists on the identity."
    - id: mcp-deny-nonreadonly-tools
      mechanism: "IAM deny policy: deny MCP tool invocations where tool.isReadOnly == false for the dak-readonly principal."
      source: "Google GA guidance for Data Agent Kit (read-only agent pattern)."
    - id: no-service-account-keys
      mechanism: "No SA keys are created; recommended policy iam.disableServiceAccountKeyCreation once available."
    - id: row-column-security-inheritance
      mechanism: "BigQuery row/column policies apply automatically because the agent connects as the impersonated SA, never as the owner."
    - id: plugin-telemetry-hook-disabled
      mechanism: >
        INSTALL-LAYER control. The upstream plugin ships a PreToolUse
        telemetry hook (.agents/hooks/telemetry_hook.js, matcher *) that
        reports tool use. Fleet installs ship with this hook DISABLED
        until the owner reviews what it sends and where. The SessionStart
        dak-setup-sync hook is configuration sync and may stay enabled.
      verification: "Post-install, confirm the telemetry hook is absent/disabled in the surface's hooks config; record the check in the activation evidence."

advisory_tier:
  description: >
    Guidance an agent can ignore, misread, or be injected against.
    Never counted as enforcement in fleet documentation or admission
    evidence.
  controls:
    - id: kit-skills
      mechanism: "All 37 upstream skills (Apache-2.0) — incl. accidental-data-loss-prevention (explicit consent before DROP TABLE / TRUNCATE / DELETE without WHERE), cost skills (partition checks, dry run first), and per-service authoring/troubleshooting skills. Full grouped inventory in docs/ops/DATA-AGENT-KIT-WIRING.md."
    - id: fleet-skill
      mechanism: ".agents/skills/data-agent-kit/SKILL.md — fleet usage rules, readiness classes, consent gate."

action_classes:
  - action: "Read schemas, catalogs, job history; SELECT / dry-run queries on any wired server"
    tier: enforced_allow
    via: "Per-server read-only bindings under servers:."
  - action: "CREATE / INSERT / UPDATE / DELETE / DROP / TRUNCATE anywhere"
    tier: enforced_deny
    via: "No write role on the identity; mcp-deny-nonreadonly-tools as second layer; bigtable admin plane has no role at all."
  - action: "Writes via a future write-capable identity"
    tier: out_of_scope
    via: "Separate owner-approved design + separate service account. Skill consent language never authorizes writes."
  - action: "High-cost queries"
    tier: enforced_cap_on_bigquery
    via: "maximum_bytes_billed on the telemetry dataset; advisory dry-run discipline elsewhere."

surfaces:
  wired:
    - { surface: "Claude Code", install: "claude plugin marketplace add https://github.com/GoogleCloudPlatform/data-agent-kit-plugin && claude plugin install dak@dak-marketplace" }
    - { surface: "Codex CLI", install: "codex plugin marketplace add GoogleCloudPlatform/data-agent-kit-plugin && codex plugin add dak@dak-marketplace" }
    - { surface: "Antigravity CLI", install: "agy plugin install https://github.com/GoogleCloudPlatform/data-agent-kit-plugin" }
    - { surface: "VS Code-family IDEs", install: "Data Agent Kit extension (Marketplace / Open VSX) — same MCP configuration and identity rules apply." }
  not_wired:
    - { surface: "Jules", reason: "Cloud agent; its MCPs are configured in Jules' own settings and the kit targets local coding agents. Separate owner decision if ever wanted." }
    - { surface: "On-device Termux agents (origin B160V)", reason: "Kit needs Node + gcloud + interactive Google sign-in; origin-device constraints are remote-first. Device agents consume results, not the kit." }

provisioning:
  note: "Run ONLY after the owner items below are complete (see docs/ops/DATA-AGENT-KIT-ACTIVATION.md for the full sequence). Creates no keys, grants no write roles."
  commands:
    - "gcloud services enable bigquery.googleapis.com storage.googleapis.com dataplex.googleapis.com datacatalog.googleapis.com alloydb.googleapis.com sqladmin.googleapis.com spanner.googleapis.com bigtable.googleapis.com bigtableadmin.googleapis.com dataproc.googleapis.com dataform.googleapis.com iam.googleapis.com --project=<GCP_PROJECT_ID>"
    - "gcloud iam service-accounts create dak-readonly --display-name='Data Agent Kit fleet read-only' --project=<GCP_PROJECT_ID>"
    - "gcloud projects add-iam-policy-binding <GCP_PROJECT_ID> --member='serviceAccount:dak-readonly@<GCP_PROJECT_ID>.iam.gserviceaccount.com' --role='roles/bigquery.jobUser'"
    - "gcloud projects add-iam-policy-binding <GCP_PROJECT_ID> --member='serviceAccount:dak-readonly@<GCP_PROJECT_ID>.iam.gserviceaccount.com' --role='roles/datacatalog.viewer'"
    - "gcloud projects add-iam-policy-binding <GCP_PROJECT_ID> --member='serviceAccount:dak-readonly@<GCP_PROJECT_ID>.iam.gserviceaccount.com' --role='roles/alloydb.viewer'"
    - "gcloud projects add-iam-policy-binding <GCP_PROJECT_ID> --member='serviceAccount:dak-readonly@<GCP_PROJECT_ID>.iam.gserviceaccount.com' --role='roles/cloudsql.viewer'"
    - "gcloud projects add-iam-policy-binding <GCP_PROJECT_ID> --member='serviceAccount:dak-readonly@<GCP_PROJECT_ID>.iam.gserviceaccount.com' --role='roles/spanner.viewer'"
    - "gcloud projects add-iam-policy-binding <GCP_PROJECT_ID> --member='serviceAccount:dak-readonly@<GCP_PROJECT_ID>.iam.gserviceaccount.com' --role='roles/dataproc.viewer'"
    - "# Dataset/bucket/table-scoped bindings (bigquery.dataViewer, storage.objectViewer, spanner.databaseReader, bigtable.reader) are applied when each resource is created — never widened to project scope."
    - "# Create the telemetry dataset with a bytes-billed cap and the evidence bucket; set a billing budget alert for the project (day 0)."
    - "# Apply the mcp-deny-nonreadonly-tools IAM deny policy for the dak-readonly principal."

owner_items:
  - id: gcp-project-and-billing
    item: "Create the fleet GCP project WITHOUT billing (owner ruling 2026-10-26: credit card is a BLOCK — the trial/billing route is closed). A billing-less project activates the BigQuery sandbox, the fleet primary need; GCS + Knowledge Catalog stay pending-billing. Fleet recon 2026-10-21 (PR #1511): no fleet GCP presence exists. Everything repo-side is already wired; the only owner action left is the sign-in session below."
  - id: gcp-signin-path
    item: "gcloud auth / ADC sign-in for the owner Google account — prompts land on the origin B160V (broken screen); plan the session."
  - id: telemetry-hook-review
    item: "Review the plugin's telemetry hook payload/destination when convenient; fleet installs keep it disabled until then (enforced_tier.plugin-telemetry-hook-disabled)."

exit:
  mortality_rule: "No critical lane single-homes on this path. HindSight/Provenance and the evidence lanes run unchanged without it; the kit is an additional read path, never the only copy."
  data_exit: "BigQuery datasets export to GCS as JSONL/Parquet and from there back into repo artifacts; nothing is stored only in GCP."
  steps:
    - "Remove the google-data-agent-kit host entry from mcp-hub/catalog.json and delete mcp-hub/client-configs/data-agent-kit.json."
    - "Uninstall the plugin on each surface."
    - "Delete the dak-readonly service account (revokes all agent data access at once)."
  effort: "One session."
