  control_plane:
    full_name: timerloggedout-spec/termux-monorepo
    url: https://github.com/timerloggedout-spec/termux-monorepo
    role: project_profiles_lanes_tooling_ci_qa_orchestration
  research:
    research_astute:
      organization: Research-Astute
      url: https://github.com/Research-Astute
      repository: Research-Astute/molecular-biology-research
      repository_id: 183701786
