  service_category_map: ops/fabrication/service-category-map.yaml
  concept_to_production: [discover, define, design, simulate, review, prototype, fabricate, inspect, iterate, publish]
  internal_equipment_registry: shared_across_projects_and_grants
  external_services: provider_directory_with_user_approval
  player_identity: central_cross_game_profile
