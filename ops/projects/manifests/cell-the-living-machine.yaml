      existing_research_repository_scope: public_manus_ui_source_inventory
      integration_status: organization_lifecycle_and_scientific_search_endpoint_pending

architecture:
  contract: versioned_manifests_and_api_adapters
  stable_project_ref: project:cell-the-living-machine
  local_workspace_links: optional_symlinks
  source_identity: canonical_url_plus_upstream_accession_plus_version
  provenance: required_for_every_external_claim_and_asset
  planes:
    - id: product
      owner: dedicated_game_repository
      outputs: [game_source, assets, runtime, builds, tests, releases]
    - id: developer_control
      owner: termux-monorepo
      outputs: [project_profile, lanes, tool_profiles, task_routing, ci, qa, release_contracts]
    - id: reusable_research
      owner: research_astute
      outputs: [curated_references, research_notes, reusable_knowledge_artifacts]
    - id: search_aggregation
      owner: search_astutely
      outputs: [queries, result_sets, normalized_records, source_snapshots, deduplication_lineage]
    - id: scientific_authorities
      owner: upstream_databases
      outputs: [structures, sequences, annotations, pathways, molecules, literature]

game:
  project_kind: new_game
  dimensions: [3d, mixed]
  genre_facets: [strategy_4x, action_arcade, simulation_builder, puzzle_educational, multiplayer, accessibility, exploration, engineering, factory_automation, creator, digital_twin, manufacturing, research_lab, production_marketplace]
  session_model: shared_player_identity_across_modes_and_game_types
  time_model: simulation_with_scenario_challenges
  scales: [molecular, membrane, organelle, cellular, tissue, organism]
  core_loop: [explore, define, design, build, simulate, validate, make, inspect, improve, publish]
  engine:
    selection: provisional_godot_prototype_lead
    prototype_version: 4.7.2
    baseline_renderer: compatibility
    higher_tier_renderers: [mobile, forward_plus]
    candidates: [godot, unity_6_urp, unreal_5, browser_runtime]
    decision_record: docs/proposals/active/cell-the-living-machine/ENGINE_DECISION.md
    final_selection: pending_physical_device_benchmarks
  first_slice:
    parallel_vertical_slices:
      - id: biological_membrane
        scope: single_cell_membrane
        mechanisms: [sodium_potassium_pump, aquaporin, atp_synthase]
        evidence_gate: source_linked_scientific_review
      - id: engineering_factory_cell
        scope: compact_3d_automated_production_cell
        systems: [input_storage, transport, processing_machine, power, sensor, output_inspection]
        reference_kernel: simulation/reference/factory_cell.py
        tests: tests/test_factory_cell.py
        implementation_status: engine_neutral_reference_passed
        evidence_gate: deterministic_simulation_and_engineering_review

engineering_platform:
  player_profile_schema: schemas/player-profile.schema.json
  design_artifact_schema: schemas/design-artifact.schema.json
  bill_of_materials_schema: schemas/bill-of-materials.schema.json
