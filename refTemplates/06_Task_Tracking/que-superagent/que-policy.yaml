# QUE policy (template). Any change to rules, accept_mode or sources bumps `version`.
# A bump: discards running admission Evals ∧ requeues their Triggers;
# posts a policy-changed note to affected live items only; ¬ cancels running work.
schema: que-policy/v1
version: 1
accept_mode: shadow        # shadow: record "would accept", act on nothing inferred · live: act
sources:
  github:
    repo: timerloggedout-spec/termux-monorepo
    allowed:               # explicit requests (Source-local identities, ¬ cross-mapped)
      - timerloggedout-spec
    bots:                  # may raise inferred candidates only; never explicit, never stop
      - dependabot[bot]
    admission:             # per receiving scope; cells: explicit | inferred | ignore
      issues.new:  {listed_unaddressed: inferred, unlisted_addressed: ignore, unlisted_unaddressed: ignore}
      comment:     {listed_unaddressed: inferred, unlisted_addressed: ignore, unlisted_unaddressed: ignore}
      ci.default:  {unlisted_unaddressed: ignore}
rules:                     # proactive work; each needs an id ∧ text; matched rules land in the Mandate
  - id: auto-claim-escalated
    enabled: true
    text: Claim an escalated, unclaimed, non-owner-gated filing by rank (QUE-AUTO-CLAIM.md).
  - id: challenge-registration
    enabled: true
    text: Register free challenge/hackathon events under the LoggedOut Timer moniker; ¬ money, ¬ legal attestations.
