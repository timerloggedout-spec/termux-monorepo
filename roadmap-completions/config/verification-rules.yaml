# Roadmap Completion Verification Rules
# Defines verification criteria for each roadmap exercise

version: "1.0.0"
generated: "2026-11-07T00:00:00Z"

# Global default rules
defaults:
  code:
    required: true
    min_size: 100  # bytes
    max_size: null
    patterns: []
    extensions: [".py", ".js", ".ts", ".java", ".go", ".rs", ".cpp", ".c"]
    
  test:
    required: true
    min_coverage: 70  # percentage
    passing: true
    test_framework: null  # auto-detect
    
  documentation:
    required: true
    min_words: 100
    sections: ["Description", "Usage", "Examples"]
    
  portfolio:
    required: false
    min_files: 5
    required_files: ["README.md", "LICENSE"]

# Roadmap-specific rules
