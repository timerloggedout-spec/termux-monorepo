  mlops:
    name: "MLOps"
    description: "ML pipeline operations"
    exercises:
      implement-ml-pipeline:
        name: "Implement ML Pipeline"
        description: "Create a complete ML pipeline with training, evaluation, and deployment"
        rules:
          code:
            required: true
            min_size: 500
            patterns:
              - "def train"
              - "def evaluate"
              - "def predict"
            extensions: [".py"]
          test:
            required: true
            min_coverage: 80
          documentation:
            required: true
            min_words: 500
            sections: ["Overview", "Pipeline Stages", "Usage", "Deployment"]
          portfolio:
            required: true
            min_files: 10
            required_files: ["README.md", "LICENSE", "requirements.txt", "Dockerfile"]
        
      model-versioning:
        name: "Model Versioning"
        description: "Implement model versioning and tracking"
        rules:
          code:
            required: true
            min_size: 300
            patterns:
              - "version"
              - "save_model"
              - "load_model"
          test:
            required: true
            min_coverage: 75
          documentation:
            required: true
            min_words: 300
        
      pipeline-orchestration:
        name: "Pipeline Orchestration"
        description: "Orchestrate ML pipeline execution"
        rules:
          code:
            required: true
            min_size: 400
            patterns:
              - "def run_pipeline"
