# Enhanced policy with protocol layer considerations
policy:
  phase: jules_first
  scavenge: depth-1-sparse-metadata
  
  protocol_layer_policy:
    - All new code should use protocol layer components
    - Existing code should migrate to protocol layer
    - Protocol layer should remain stdlib-only for Termux compatibility
    
  agents_credit_policy: >-
    Devin and Vercel out of credit. Prefer Jules sessions or Grok (not a Linear
    teammate — put Agent: Grok|Jules at top of issue body). Clear Devin delegate.
    
    Protocol layer enables better credit management through:
    - Error type classification (retryable vs user action)
    - Fallback chain implementation
    - Multi-agent orchestration
  
  human_only: [credential_rotation, history_rewrite, app_permissions]
  human_temporary: [termux_smoke_cherry_pick_until_automated]
  agent_owns: [branch, implement, pr, merge_to_master_staging, gates]
  
  # New protocol layer specific policies
  protocol_specific:
    - All API responses should use protocol layer error handling
    - All session states should use protocol layer SessionState enum
    - All message formats should use protocol layer JulesRequest/JulesResponse
    - All device profiles should extend from protocol layer base classes

